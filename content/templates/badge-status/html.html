<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  li + li { border-top: 1px solid var(--border); }
  li b { display: block; font-weight: 600; }
  li small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .badge { --c: var(--muted); --bg: var(--accent-soft); display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px;
    border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius: 999px; background: var(--bg); color: var(--text);
    font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .badge--ok { --c: var(--ok); --bg: var(--ok-soft); }
  .badge--warn { --c: var(--warn); --bg: var(--warn-soft); }
  .badge--err { --c: var(--err); --bg: var(--err-soft); }
  .badge--ok::before { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .badge--ok::before { animation: none; } }
</style>
</head>
<body>
  <h1>Pedidos recientes</h1>
  <ul>
    <li><div><b>Pedido #1042</b><small>hoy, 09:41</small></div><span class="badge badge--ok">Activo</span></li>
    <li><div><b>Pedido #1041</b><small>ayer, 18:03</small></div><span class="badge badge--warn">Pendiente</span></li>
    <li><div><b>Pedido #1040</b><small>ayer, 11:27</small></div><span class="badge badge--err">Error de pago</span></li>
    <li><div><b>Pedido #1039</b><small>hace 3 días</small></div><span class="badge">Borrador</span></li>
  </ul>
</body>
</html>
