<script>
  const triggers = [...document.querySelectorAll('[aria-controls][aria-expanded]')];
  const panelOf = (t) => document.getElementById(t.getAttribute('aria-controls'));
  const setOpen = (t, open) => { t.setAttribute('aria-expanded', open); panelOf(t).hidden = !open; };
  const closeAll = (except) => triggers.filter((t) => t !== except).forEach((t) => setOpen(t, false));

  triggers.forEach((t) => t.addEventListener('click', () => {
    const open = t.getAttribute('aria-expanded') !== 'true';
    closeAll(t);
    setOpen(t, open);
  }));
  document.addEventListener('click', (e) => { if (!e.target.closest('.wrap')) closeAll(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const open = triggers.find((t) => t.getAttribute('aria-expanded') === 'true');
      if (open) { setOpen(open, false); open.focus(); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.getElementById('q').focus();
    }
  });
</script>
