<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barra de aplicación con acciones</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, input { font:inherit; color:inherit; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .page { overflow:hidden; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); }
  .bar { position:relative; display:flex; align-items:center; gap:8px; height:56px; padding:0 12px; background:var(--surface); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:8px; flex:none; font-weight:700; color:var(--text); text-decoration:none; }
  .brand i { display:grid; place-items:center; width:26px; height:26px; border-radius:min(var(--radius),6px); background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff)); color:var(--accent-ink); font:700 13px/1 system-ui,sans-serif; font-style:normal; }
  .wrap { display:flex; }
  .ws { display:flex; align-items:center; gap:6px; flex:none; height:34px; margin-left:4px; padding:0 8px 0 4px; font-weight:600; color:var(--text); background:none; border:1px solid transparent; border-radius:var(--radius); cursor:pointer; }
  .ws:hover, .ws[aria-expanded=true] { background:var(--accent-soft); }
  .ws-mark { display:grid; place-items:center; width:22px; height:22px; border-radius:min(var(--radius),6px); background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700; }
  .ws svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; color:var(--muted); }
  .search { display:flex; align-items:center; gap:8px; flex:0 1 240px; height:36px; margin-left:auto; padding:0 8px; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); cursor:text; }
  .search:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  .search svg { flex:none; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .search input { flex:1; min-width:0; padding:0; border:0; background:none; outline:0; }
  .search input::placeholder { color:var(--muted); }
  kbd { flex:none; padding:0 6px; font:12px/18px ui-monospace,"Cascadia Code",Menlo,monospace; color:var(--muted); border:1px solid var(--border); border-radius:min(var(--radius),4px); }
  .icon-btn { position:relative; display:grid; place-items:center; flex:none; width:36px; height:36px; padding:0; color:var(--muted); background:none; border:0; border-radius:var(--radius); cursor:pointer; }
  .icon-btn:hover, .icon-btn[aria-expanded=true] { color:var(--text); background:var(--accent-soft); }
  .icon-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .count { position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; display:grid; place-items:center; font-size:11px; font-weight:700; line-height:1; color:var(--accent-ink); background:var(--err); border-radius:999px; box-shadow:0 0 0 2px var(--surface); }
  .avatar-btn { flex:none; padding:0; background:none; border:0; border-radius:999px; cursor:pointer; }
  .avatar { display:grid; place-items:center; width:32px; height:32px; border-radius:999px; font-size:12px; font-weight:700; color:var(--accent-ink); background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff)); }
  .avatar.lg { width:40px; height:40px; font-size:14px; }
  .avatar-btn[aria-expanded=true] .avatar { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .pop { position:absolute; top:calc(100% + 6px); z-index:3; width:min(280px, calc(100% - 24px)); padding:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .pop.start { left:12px; }
  .pop.end { right:12px; }
  .pop-title { margin:4px 8px 6px; font-size:12px; font-weight:600; color:var(--muted); }
  .pop ul { display:grid; gap:2px; margin:0; padding:0; list-style:none; }
  .pop button { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:8px; text-align:left; color:var(--text); background:none; border:0; border-radius:min(var(--radius),6px); cursor:pointer; }
  .pop button:hover { background:var(--accent-soft); }
  .pop [aria-current=true] { color:var(--accent); font-weight:600; }
  .pop [aria-current=true] span { font-size:12px; font-weight:500; }
  .notes li { display:flex; gap:10px; padding:8px; border-radius:min(var(--radius),6px); }
  .notes li:hover { background:var(--bg); }
  .notes b { display:block; font-weight:600; }
  .notes span { font-size:12px; color:var(--muted); }
  .dot { flex:none; width:8px; height:8px; margin-top:6px; border-radius:50%; background:var(--accent); }
  .me { display:flex; align-items:center; gap:10px; padding:8px; }
  .me b { display:block; }
  .me span { font-size:12px; color:var(--muted); }
  .pop .danger { color:var(--err); }
  .content { padding:16px 12px; background:var(--surface); }
  h1 { margin:0 0 4px; font-size:1.15rem; font-weight:600; letter-spacing:-.01em; }
  .content p { margin:0; color:var(--muted); }
  @media (max-width:479px) {
    .brand span, .ws-name, kbd { display:none; }
    .search { flex:none; width:36px; margin-left:auto; padding:0; justify-content:center; background:none; border-color:transparent; cursor:pointer; }
    .search input { width:0; flex:none; }
    .search:focus-within { position:absolute; top:10px; left:12px; right:12px; z-index:2; width:auto; padding:0 8px; background:var(--bg); border-color:var(--border); }
    .search:focus-within input { width:auto; flex:1; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="brand" href="#"><i aria-hidden="true">N</i><span>Nimbo</span></a>
    <div class="wrap">
      <button class="ws" type="button" id="ws-btn" aria-expanded="false" aria-controls="ws-pop" aria-label="Espacio de trabajo: Equipo Nimbo">
        <span class="ws-mark" aria-hidden="true">E</span><span class="ws-name" aria-hidden="true">Equipo Nimbo</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="pop start" id="ws-pop" hidden>
        <p class="pop-title">Espacios de trabajo</p>
        <ul>
          <li><button type="button" aria-current="true">Equipo Nimbo <span>Activo</span></button></li>
          <li><button type="button">Marketing</button></li>
          <li><button type="button">Clientes beta</button></li>
        </ul>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Buscar proyectos" aria-label="Buscar proyectos" autocomplete="off">
      <kbd>Ctrl K</kbd>
    </label>
    <div class="wrap">
      <button class="icon-btn" type="button" id="bell-btn" aria-expanded="false" aria-controls="bell-pop" aria-label="Notificaciones, 3 sin leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="count" aria-hidden="true">3</span>
      </button>
      <div class="pop end" id="bell-pop" hidden>
        <p class="pop-title">Notificaciones</p>
        <ul class="notes">
          <li><span class="dot" aria-hidden="true"></span><div><b>Ana comentó en Rediseño</b><span>Hace 5 min</span></div></li>
          <li><span class="dot" aria-hidden="true"></span><div><b>Se completó la tarea «Facturas»</b><span>Hace 1 h</span></div></li>
          <li><span class="dot" aria-hidden="true"></span><div><b>Invitación aceptada por Marcos</b><span>Ayer</span></div></li>
        </ul>
      </div>
    </div>
    <div class="wrap">
      <button class="avatar-btn" type="button" id="me-btn" aria-expanded="false" aria-controls="me-pop" aria-label="Cuenta de Lucía Ferrer">
        <span class="avatar" aria-hidden="true">LF</span>
      </button>
      <div class="pop end" id="me-pop" hidden>
        <div class="me"><span class="avatar lg" aria-hidden="true">LF</span><div><b>Lucía Ferrer</b><span>lucia@nimbo.app</span></div></div>
        <ul>
          <li><button type="button">Mi perfil</button></li>
          <li><button type="button">Preferencias</button></li>
          <li><button type="button" class="danger">Cerrar sesión</button></li>
        </ul>
      </div>
    </div>
  </header>
  <main class="content">
    <h1>Proyectos</h1>
    <p>Ocho proyectos activos esta semana. Pulsa Ctrl K para encontrar uno.</p>
  </main>
</div>
<script>
  const triggers = [...document.querySelectorAll('[aria-controls][aria-expanded]')];
  const panelOf = (t) => document.getElementById(t.getAttribute('aria-controls'));
  const setOpen = (t, open) => { t.setAttribute('aria-expanded', open); panelOf(t).hidden = !open; };
  const closeAll = (except) => triggers.filter((t) => t !== except).forEach((t) => setOpen(t, false));

  triggers.forEach((t) => t.addEventListener('click', () => {
    const open = t.getAttribute('aria-expanded') !== 'true';
    closeAll(t);
    setOpen(t, open);
  }));
  document.addEventListener('click', (e) => { if (!e.target.closest('.wrap')) closeAll(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const open = triggers.find((t) => t.getAttribute('aria-expanded') === 'true');
      if (open) { setOpen(open, false); open.focus(); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      document.getElementById('q').focus();
    }
  });
</script>
</body>
</html>
