<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px 16px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  code { font: 12px ui-monospace, "Cascadia Code", Menlo, monospace; color: var(--muted); }

  .btn { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); cursor: pointer; transition: background-color .14s, filter .14s, box-shadow .14s; }
  .btn:hover { background: var(--accent-soft); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn--primary { border-color: transparent; background: var(--accent); color: var(--accent-ink); }
  .btn--primary:hover { background: var(--accent); filter: brightness(1.1); box-shadow: var(--shadow); }
  .btn--danger { border-color: transparent; background: var(--err); color: var(--accent-ink); }
  .btn--danger:hover { background: var(--err); filter: brightness(1.1); }
  .btn--ghost, .btn--link { border-color: transparent; background: transparent; }
  .btn--ghost { color: var(--accent); }
  .btn--link { padding: 8px 4px; color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .btn--link:hover { background: transparent; text-decoration-thickness: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <h1>Variantes de botón</h1>
  <div class="grid">
    <div class="cell"><button class="btn btn--primary" type="button">Guardar cambios</button><code>.btn--primary</code></div>
    <div class="cell"><button class="btn" type="button">Cancelar</button><code>.btn</code></div>
    <div class="cell"><button class="btn btn--ghost" type="button">Omitir por ahora</button><code>.btn--ghost</code></div>
    <div class="cell"><button class="btn btn--danger" type="button">Eliminar cuenta</button><code>.btn--danger</code></div>
    <div class="cell"><button class="btn btn--link" type="button">Ver detalles</button><code>.btn--link</code></div>
  </div>
</body>
</html>
