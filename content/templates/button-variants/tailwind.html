<!-- Base compartida: rounded-lg px-4 py-2 text-sm font-medium transition
     foco: focus-visible:outline-2 outline-offset-2 outline-blue-500 -->
<div class="flex flex-wrap items-center gap-4 p-5 text-slate-900 dark:text-slate-100">
  <button type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:bg-blue-500 dark:hover:bg-blue-400">Guardar cambios</button>

  <button type="button" class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-900 transition hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800">Cancelar</button>

  <button type="button" class="rounded-lg px-4 py-2 text-sm font-medium text-blue-600 transition hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:text-blue-400 dark:hover:bg-slate-800">Omitir por ahora</button>

  <button type="button" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none">Eliminar cuenta</button>

  <button type="button" class="rounded-lg px-1 py-2 text-sm font-medium text-blue-600 underline underline-offset-4 hover:decoration-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-blue-400">Ver detalles</button>
</div>
