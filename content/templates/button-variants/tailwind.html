<!-- Base compartida: rounded-lg px-4 py-2 text-sm font-medium transition
     foco: focus-visible:outline-2 outline-offset-2 outline-accent -->
<div class="flex flex-wrap items-center gap-4 p-5 text-fg">
  <button type="button" class="rounded-lg bg-accent px-4 py-2 text-sm font-medium text-accent-ink shadow-sm transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Guardar cambios</button>

  <button type="button" class="rounded-lg border border-line bg-surface px-4 py-2 text-sm font-medium text-fg transition hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Cancelar</button>

  <button type="button" class="rounded-lg px-4 py-2 text-sm font-medium text-accent transition hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Omitir por ahora</button>

  <button type="button" class="rounded-lg bg-err px-4 py-2 text-sm font-medium text-accent-ink transition hover:bg-err focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Eliminar cuenta</button>

  <button type="button" class="rounded-lg px-1 py-2 text-sm font-medium text-accent underline underline-offset-4 hover:decoration-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ver detalles</button>
</div>
