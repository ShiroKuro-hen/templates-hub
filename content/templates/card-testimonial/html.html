<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:820px;margin:0 auto}
  .card{position:relative;display:flex;flex-direction:column;gap:14px;margin:0;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .q{position:absolute;top:18px;right:20px;width:28px;height:21px;fill:var(--accent-soft)}
  .rate{display:flex;gap:2px}
  .st{width:16px;height:16px;fill:var(--border)}
  .st.on{fill:var(--warn)}
  blockquote{margin:0}
  blockquote p{margin:0;font-size:16px;line-height:1.55}
  .kpi{margin:0;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted)}
  .kpi b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
  figcaption{display:flex;align-items:center;gap:12px;margin-top:auto}
  .av{display:grid;place-items:center;flex:none;width:40px;height:40px;box-sizing:border-box;font-weight:600;border:1px solid transparent;border-radius:50%;
      background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box}
  .who b{display:block}
  .who span{display:block;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="s" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol></svg>
<div class="grid">
  <figure class="card">
    <svg class="q" viewBox="0 0 32 24" aria-hidden="true"><path d="M0 24V13.5C0 6 4.2 1.2 11 0l1.2 3.6C8.4 4.8 6.6 7.2 6.4 10H12v14zM18 24V13.5C18 6 22.2 1.2 29 0l1.2 3.6C26.4 4.8 24.6 7.2 24.4 10H30v14z"/></svg>
    <div class="rate" role="img" aria-label="5 de 5 estrellas"><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg></div>
    <blockquote><p>“Pasamos de gestionar incidencias por correo a verlas todas en un solo panel. El equipo responde en minutos y dejamos de perder pedidos.”</p></blockquote>
    <p class="kpi"><b>38%</b> menos tickets de soporte en tres meses</p>
    <figcaption><span class="av" aria-hidden="true">AP</span><span class="who"><b>Ana Pérez</b><span>Directora de Operaciones</span><span>Meridian Logística</span></span></figcaption>
  </figure>
  <figure class="card">
    <svg class="q" viewBox="0 0 32 24" aria-hidden="true"><path d="M0 24V13.5C0 6 4.2 1.2 11 0l1.2 3.6C8.4 4.8 6.6 7.2 6.4 10H12v14zM18 24V13.5C18 6 22.2 1.2 29 0l1.2 3.6C26.4 4.8 24.6 7.2 24.4 10H30v14z"/></svg>
    <div class="rate" role="img" aria-label="4 de 5 estrellas"><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st on"><use href="#s"/></svg><svg class="st"><use href="#s"/></svg></div>
    <blockquote><p>“La migración tomó un fin de semana y el lunes nadie notó el cambio. El soporte fue claro y directo en cada duda.”</p></blockquote>
    <p class="kpi"><b>99,98%</b> de disponibilidad desde el cambio</p>
    <figcaption><span class="av" aria-hidden="true">JS</span><span class="who"><b>Jorge Salazar</b><span>Jefe de Tecnología</span><span>Andina Retail</span></span></figcaption>
  </figure>
</div>
</body>
</html>
