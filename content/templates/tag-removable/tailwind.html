<div class="bg-[#f6f1e7] p-5 text-[#17130f]">
  <ul id="tags" aria-label="Etiquetas actuales" class="flex flex-wrap gap-2">
    <li class="inline-flex items-center gap-0.5 rounded-full border-2 border-[#17130f] bg-[#ffd84d] py-0.5 pl-3 pr-0.5 font-semibold">
      <span>diseño</span>
      <button type="button" aria-label="Quitar etiqueta diseño" class="grid size-6 place-items-center rounded-full text-base leading-none hover:bg-[#17130f] hover:text-[#ffd84d] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#ff5a36]">×</button>
    </li>
    <li class="inline-flex items-center gap-0.5 rounded-full border-2 border-[#17130f] bg-[#ffd84d] py-0.5 pl-3 pr-0.5 font-semibold">
      <span>accesibilidad</span>
      <button type="button" aria-label="Quitar etiqueta accesibilidad" class="grid size-6 place-items-center rounded-full text-base leading-none hover:bg-[#17130f] hover:text-[#ffd84d] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#ff5a36]">×</button>
    </li>
  </ul>
  <p role="status" class="sr-only" id="msg"></p>
</div>

<script>
  document.getElementById('tags').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const li = b.closest('li');
    (li.nextElementSibling || li.previousElementSibling)?.querySelector('button')?.focus();
    document.getElementById('msg').textContent = 'Etiqueta ' + li.firstElementChild.textContent + ' eliminada';
    li.remove();
  });
</script>
