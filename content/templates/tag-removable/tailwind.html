<div class="p-5 text-slate-900 dark:text-slate-100">
  <ul id="tags" aria-label="Etiquetas actuales" class="flex flex-wrap gap-2">
    <li class="inline-flex items-center gap-0.5 rounded-full border border-blue-200 bg-blue-50 py-0.5 pl-3 pr-0.5 font-medium dark:border-blue-500/30 dark:bg-blue-500/15">
      <span>diseño</span>
      <button type="button" aria-label="Quitar etiqueta diseño" class="grid size-6 place-items-center rounded-full text-base leading-none text-slate-500 hover:bg-blue-600 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-blue-500">×</button>
    </li>
    <li class="inline-flex items-center gap-0.5 rounded-full border border-blue-200 bg-blue-50 py-0.5 pl-3 pr-0.5 font-medium dark:border-blue-500/30 dark:bg-blue-500/15">
      <span>accesibilidad</span>
      <button type="button" aria-label="Quitar etiqueta accesibilidad" class="grid size-6 place-items-center rounded-full text-base leading-none text-slate-500 hover:bg-blue-600 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-blue-500">×</button>
    </li>
    <li class="inline-flex items-center gap-0.5 rounded-full border border-blue-200 bg-blue-50 py-0.5 pl-3 pr-0.5 font-medium dark:border-blue-500/30 dark:bg-blue-500/15">
      <span>css</span>
      <button type="button" aria-label="Quitar etiqueta css" class="grid size-6 place-items-center rounded-full text-base leading-none text-slate-500 hover:bg-blue-600 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-blue-500">×</button>
    </li>
  </ul>
  <p role="status" class="sr-only" id="msg"></p>
</div>

<script>
  document.getElementById('tags').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const li = b.closest('li');
    (li.nextElementSibling || li.previousElementSibling)?.querySelector('button')?.focus();
    document.getElementById('msg').textContent = 'Etiqueta ' + li.firstElementChild.textContent + ' eliminada';
    li.remove();
  });
</script>
