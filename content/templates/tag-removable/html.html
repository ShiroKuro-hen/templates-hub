<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .box { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  li { display: inline-flex; align-items: center; gap: 2px; padding: 2px 2px 2px 12px; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 999px; background: var(--accent-soft); font-weight: 500; }
  li button { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: none;
    font-size: 16px; line-height: 1; color: var(--muted); cursor: pointer; transition: background-color .14s, color .14s; }
  li button:hover { background: var(--accent); color: var(--accent-ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input { width: 100%; margin-top: 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font: inherit; color: var(--text); }
  input::placeholder { color: var(--muted); }
  .empty { margin: 0; color: var(--muted); }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { li button { transition: none; } }
</style>
</head>
<body>
  <h1>Etiquetas del artículo</h1>
  <div class="box">
    <ul id="tags" aria-label="Etiquetas actuales">
      <li><span>diseño</span><button type="button" aria-label="Quitar etiqueta diseño">×</button></li>
      <li><span>accesibilidad</span><button type="button" aria-label="Quitar etiqueta accesibilidad">×</button></li>
      <li><span>css</span><button type="button" aria-label="Quitar etiqueta css">×</button></li>
      <li><span>tutorial</span><button type="button" aria-label="Quitar etiqueta tutorial">×</button></li>
    </ul>
    <p class="empty" id="empty" hidden>Sin etiquetas. Escribe una y pulsa Enter.</p>
    <input id="new" type="text" aria-label="Añadir etiqueta" placeholder="Añadir etiqueta y pulsar Enter" autocomplete="off">
  </div>
  <p class="hint">Pulsa Supr o Retroceso sobre la × para eliminar.</p>
  <p class="sr" role="status" id="msg"></p>

<script>
  const list = document.getElementById('tags'), input = document.getElementById('new');
  const msg = document.getElementById('msg'), empty = document.getElementById('empty');
  const sync = () => { empty.hidden = list.children.length > 0; };

  function remove(li) {
    const next = (li.nextElementSibling || li.previousElementSibling)?.querySelector('button') || input;
    const name = li.querySelector('span').textContent;
    li.remove();
    next.focus();
    msg.textContent = 'Etiqueta ' + name + ' eliminada';
    sync();
  }
  list.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) remove(b.closest('li')); });
  list.addEventListener('keydown', (e) => {
    if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.matches('button')) { e.preventDefault(); remove(e.target.closest('li')); }
  });

  input.addEventListener('keydown', (e) => {
    const v = input.value.trim();
    if (e.key !== 'Enter' || !v) return;
    e.preventDefault();
    const dup = [...list.querySelectorAll('span')].some((s) => s.textContent.toLowerCase() === v.toLowerCase());
    msg.textContent = dup ? 'La etiqueta ' + v + ' ya existe' : 'Etiqueta ' + v + ' añadida';
    if (!dup) {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><button type="button">×</button>';
      li.firstChild.textContent = v;
      li.lastChild.setAttribute('aria-label', 'Quitar etiqueta ' + v);
      list.append(li);
      sync();
    }
    input.value = '';
  });
</script>
</body>
</html>
