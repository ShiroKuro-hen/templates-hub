<div class="min-h-[400px] bg-page p-5 text-sm text-fg">
  <main class="mx-auto max-w-[720px]">
    <header class="flex items-center justify-between gap-3 rounded-lg border border-line bg-surface px-3 py-2 shadow-sm">
      <span class="flex items-center gap-2 font-semibold"><span class="h-5 w-5 rounded-md bg-gradient-to-br from-accent-2 to-accent" aria-hidden="true"></span>Norte Cloud</span>
      <div class="relative">
        <button id="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pop"
                class="group flex h-10 items-center gap-2 rounded-lg border border-line bg-surface pl-1.5 pr-2.5 transition-colors hover:border-accent hover:bg-accent-soft aria-expanded:border-accent aria-expanded:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <span class="grid h-7 w-7 place-items-center rounded-full bg-gradient-to-br from-accent-2 to-accent p-px text-xs font-semibold" aria-hidden="true"><span class="grid h-full w-full place-items-center rounded-full bg-accent-soft text-accent">LF</span></span>Lucía Ferrer
          <svg class="h-4 w-4 text-muted transition-transform group-aria-expanded:rotate-180 motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="pop" hidden class="absolute right-0 top-[calc(100%+8px)] z-10 w-[280px] max-w-[calc(100vw-40px)] rounded-lg border border-line bg-surface shadow-lg">
          <div class="flex items-center gap-3 p-4">
            <span class="grid h-10 w-10 place-items-center rounded-full bg-accent-soft text-sm font-semibold text-accent" aria-hidden="true">LF</span>
            <div><strong class="block">Lucía Ferrer</strong><span class="block break-words text-muted">lucia.ferrer@norte.cloud</span></div>
          </div>
          <div class="border-y border-line px-4 py-3">
            <div class="mb-2 flex items-center justify-between tabular-nums text-muted"><span class="rounded-full bg-accent-soft px-2.5 py-0.5 text-xs font-semibold text-accent">Plan Business</span><span>6,4 de 10 GB</span></div>
            <div class="h-1 overflow-hidden rounded-full bg-line" aria-hidden="true"><i class="block h-full w-[64%] bg-gradient-to-br from-accent-2 to-accent"></i></div>
          </div>
          <div role="menu" aria-label="Acciones de la cuenta" class="p-1.5 [&>button]:flex [&>button]:h-9 [&>button]:w-full [&>button]:items-center [&>button]:gap-2.5 [&>button]:rounded-lg [&>button]:px-2.5 [&>button]:text-left hover:[&>button]:bg-accent-soft focus-visible:[&>button]:bg-accent-soft focus-visible:[&>button]:outline-2 focus-visible:[&>button]:-outline-offset-2 focus-visible:[&>button]:outline-accent">
            <button role="menuitem" tabindex="-1" type="button">Mi perfil</button>
            <button role="menuitem" tabindex="-1" type="button">Facturación</button>
            <button role="menuitem" tabindex="-1" type="button">Equipo</button>
            <button role="menuitem" tabindex="-1" type="button">Atajos de teclado<kbd class="ml-auto rounded-sm border border-line px-1.5 text-xs text-muted" aria-hidden="true">?</kbd></button>
            <hr class="my-1.5 border-t border-line" role="separator">
            <button role="menuitem" tabindex="-1" type="button" class="danger text-err">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </header>
    <p id="log" class="mx-1 my-4 text-muted" role="status">Abre el menú desde tu avatar.</p>
  </main>
</div>
<script>
  const btn = document.getElementById('btn'), pop = document.getElementById('pop'), log = document.getElementById('log');
  const items = [...pop.querySelectorAll('[role=menuitem]')];
  const open = (i = 0) => { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); items.at(i).focus(); };
  const close = (back) => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (back) btn.focus(); };
  btn.onclick = () => (pop.hidden ? open() : close());
  btn.onkeydown = (e) => { if (/^Arrow(Up|Down)$/.test(e.key)) { e.preventDefault(); open(e.key === 'ArrowDown' ? 0 : -1); } };
  pop.onkeydown = (e) => {
    const i = items.indexOf(document.activeElement), n = items.length;
    const to = { ArrowDown: (i + 1) % n, ArrowUp: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); items[to].focus(); } else if (e.key === 'Escape') close(true); else if (e.key === 'Tab') close();
  };
  items.forEach((it) => it.addEventListener('click', () => {
    log.textContent = it.classList.contains('danger') ? 'Cerraste la sesión.' : `Elegiste «${it.textContent.replace('?', '')}».`; close(true);
  }));
  document.addEventListener('click', (e) => { if (!pop.hidden && !e.target.closest('.relative')) close(); });
</script>
