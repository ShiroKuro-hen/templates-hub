<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:720px;min-height:400px;margin:0 auto}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600}
  .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .wrap{position:relative}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .trigger{font:inherit;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 6px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s,border-color .14s}
  .trigger:hover,.trigger[aria-expanded=true]{background:var(--accent-soft);border-color:var(--accent)}
  .trigger svg{width:16px;height:16px;color:var(--muted);transition:transform .14s}
  .trigger[aria-expanded=true] svg{transform:rotate(180deg)}
  .avatar{flex:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid transparent;border-radius:999px;font-size:12px;font-weight:600;color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box}
  .avatar.lg{width:40px;height:40px;font-size:14px}
  .pop{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:280px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pop[hidden]{display:none}
  .head{display:flex;align-items:center;gap:12px;padding:16px}
  .head strong{display:block}
  .mail{display:block;color:var(--muted);overflow-wrap:anywhere}
  .plan{padding:12px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .plan p{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
  .badge{padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
  .meter{height:4px;border-radius:999px;background:var(--border);overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  [role=menu]{padding:6px}
  hr{margin:6px 0;border:0;border-top:1px solid var(--border)}
  .item{font:inherit;display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;color:var(--text);background:none;border:0;border-radius:var(--radius);text-align:left;cursor:pointer}
  .item:hover,.item:focus-visible{background:var(--accent-soft)}
  .item:focus-visible{outline-offset:-2px}
  .item svg{width:16px;height:16px;flex:none;color:var(--muted)}
  .item.danger,.item.danger svg{color:var(--err)}
  kbd{margin-left:auto;padding:0 6px;font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:4px}
  .log{margin:16px 4px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="bar">
    <span class="brand"><span class="logo" aria-hidden="true"></span>Norte Cloud</span>
    <div class="wrap">
      <button id="btn" class="trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pop">
        <span class="avatar" aria-hidden="true">LF</span>Lucía Ferrer
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="pop" class="pop" hidden>
        <div class="head"><span class="avatar lg" aria-hidden="true">LF</span><div><strong>Lucía Ferrer</strong><span class="mail">lucia.ferrer@norte.cloud</span></div></div>
        <div class="plan"><p><span class="badge">Plan Business</span><span>6,4 de 10 GB</span></p><div class="meter" aria-hidden="true"><i style="width:64%"></i></div></div>
        <div role="menu" aria-label="Acciones de la cuenta">
          <button class="item" role="menuitem" tabindex="-1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a4 4 0 1 0-8 0a4 4 0 1 0 8 0M4 21a8 8 0 0 1 16 0"/></svg>Mi perfil</button>
          <button class="item" role="menuitem" tabindex="-1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18"/></svg>Facturación</button>
          <button class="item" role="menuitem" tabindex="-1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 8a3.5 3.5 0 1 0-7 0a3.5 3.5 0 1 0 7 0M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>Equipo</button>
          <button class="item" role="menuitem" tabindex="-1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Atajos de teclado<kbd aria-hidden="true">?</kbd></button>
          <hr role="separator">
          <button class="item danger" role="menuitem" tabindex="-1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>
  <p id="log" class="log" role="status">Abre el menú desde tu avatar.</p>
</main>
<script>
  const btn = document.getElementById('btn'), pop = document.getElementById('pop'), log = document.getElementById('log');
  const items = [...pop.querySelectorAll('[role=menuitem]')];
  const open = (i = 0) => { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); items.at(i).focus(); };
  const close = (back) => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (back) btn.focus(); };
  btn.addEventListener('click', () => (pop.hidden ? open() : close()));
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); open(e.key === 'ArrowDown' ? 0 : -1); }
  });
  pop.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement), n = items.length;
    const to = { ArrowDown: (i + 1) % n, ArrowUp: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); items[to].focus(); }
    else if (e.key === 'Escape') close(true);
    else if (e.key === 'Tab') close();
  });
  items.forEach((it) => it.addEventListener('click', () => {
    const label = it.textContent.replace('?', '');
    log.textContent = it.classList.contains('danger') ? 'Cerraste la sesión.' : `Elegiste «${label}».`;
    close(true);
  }));
  document.addEventListener('click', (e) => { if (!pop.hidden && !e.target.closest('.wrap')) close(); });
</script>
</body>
</html>
