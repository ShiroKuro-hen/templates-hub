<main class="mx-auto max-w-[420px] rounded-lg border border-slate-200 bg-white p-6 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
<form id="f" novalidate>
  <h1 class="text-lg font-semibold leading-snug">Teléfono de contacto</h1>
  <p class="mb-4 text-slate-500 dark:text-slate-400">Solo lo usaremos para confirmar tu pedido.</p>
  <label for="tel" class="mb-1.5 block font-semibold">Número de teléfono</label>
  <div id="g" class="flex rounded-lg border border-slate-200 bg-white transition-colors focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-blue-500 motion-reduce:transition-none dark:border-slate-700 dark:bg-slate-900 [&.bad]:border-red-500">
    <select id="pais" aria-label="País" autocomplete="tel-country-code" class="min-w-0 max-w-[55%] cursor-pointer rounded-l-lg border-0 border-r border-slate-200 bg-transparent px-3 py-2 outline-none dark:border-slate-700 dark:bg-slate-900">
      <option value="51" data-mask="### ### ###" data-n="Perú">Perú +51</option>
      <option value="52" data-mask="## #### ####" data-n="México">México +52</option>
      <option value="57" data-mask="### ### ####" data-n="Colombia">Colombia +57</option>
      <option value="56" data-mask="# #### ####" data-n="Chile">Chile +56</option>
      <option value="34" data-mask="### ## ## ##" data-n="España">España +34</option>
    </select>
    <input id="tel" type="tel" inputmode="numeric" autocomplete="tel-national" aria-describedby="h" class="min-w-0 flex-1 rounded-r-lg border-0 bg-transparent px-3 py-2 tabular-nums outline-none">
  </div>
  <div class="mt-2 h-1 overflow-hidden rounded-full bg-blue-100 dark:bg-slate-800" aria-hidden="true">
    <i id="m" class="block h-full w-0 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 transition-[width] duration-150 motion-reduce:transition-none"></i>
  </div>
  <p id="h" aria-live="polite" class="mt-2 min-h-[21px] text-[13px] tabular-nums text-slate-500 dark:text-slate-400"></p>
  <div class="mt-4 flex justify-end">
    <button class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Guardar número</button>
  </div>
</form>
</main>
<script>
  const $ = (id) => document.getElementById(id), p = $('pais'), t = $('tel'), h = $('h'), g = $('g');
  const cur = () => { const o = p.selectedOptions[0], m = o.dataset.mask; return { m, max: m.split('#').length - 1, code: o.value, name: o.dataset.n }; };
  const digits = (v, c) => { v = v.trim(); return (v.startsWith('+' + c.code) ? v.slice(c.code.length + 1) : v).replace(/\D/g, '').slice(0, c.max); };
  function fmt(d, m) { let o = '', i = 0; for (const c of m) { if (i >= d.length) break; o += c === '#' ? d[i++] : c; } return o; }
  const TONE = { err: 'text-red-600 dark:text-red-400', ok: 'text-emerald-600 dark:text-emerald-400', '': 'text-slate-500 dark:text-slate-400' };
  function say(msg, cls = '') {
    h.className = 'mt-2 min-h-[21px] text-[13px] tabular-nums ' + TONE[cls]; h.textContent = msg;
    g.classList.toggle('bad', cls === 'err'); t.setAttribute('aria-invalid', cls === 'err');
  }
  function render() {
    const c = cur(), d = digits(t.value, c), k = c.max - d.length;
    t.value = fmt(d, c.m); t.placeholder = fmt('9876543210', c.m);
    $('m').style.width = (d.length / c.max) * 100 + '%';
    say(!d.length ? `Un número de ${c.name} tiene ${c.max} dígitos.` : k ? `Faltan ${k} dígito${k > 1 ? 's' : ''}.` : `Se guardará como +${c.code}${d}.`, !k ? 'ok' : '');
  }
  t.oninput = p.onchange = render;
  $('f').onsubmit = (e) => {
    e.preventDefault();
    const c = cur(), d = digits(t.value, c), k = c.max - d.length;
    if (k) { say(`Faltan ${k} dígito${k > 1 ? 's' : ''}. Un número de ${c.name} tiene ${c.max}.`, 'err'); t.focus(); }
    else say(`Número guardado: +${c.code} ${t.value}.`, 'ok');
  };
  render();
</script>
