<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  figure{margin:0;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  figcaption{margin-bottom:12px}
  figcaption strong{display:block;font-size:15px;font-weight:600}
  figcaption span{color:var(--muted)}
  svg{display:block;overflow:visible}
  .label{fill:var(--text);font-size:13px}
  .rank{fill:var(--muted);font-variant-numeric:tabular-nums}
  .val{fill:var(--text);font-size:13px;font-weight:600;text-anchor:end;font-variant-numeric:tabular-nums}
  .track{fill:var(--accent-soft)}
  .bar{fill:var(--accent)}
  .bar.top{fill:url(#ion-h)}
</style>
</head>
<body>
<figure>
  <figcaption><strong>Productos más vendidos</strong><span>Unidades vendidas en septiembre de 2026</span></figcaption>
  <svg id="chart" width="100%" role="img"></svg>
</figure>
<script>
  const data = [
    { label: 'Plan Pro mensual', value: 980 },
    { label: 'Plan Pro anual', value: 1840 },
    { label: 'Soporte prioritario', value: 388 },
    { label: 'Plan Team', value: 1325 },
    { label: 'Almacenamiento extra', value: 612 },
  ];
  const rows = [...data].sort((a, b) => b.value - a.value);
  const max = rows[0].value, ROW = 46, fmt = new Intl.NumberFormat('es');
  const svg = document.getElementById('chart');

  svg.setAttribute('height', rows.length * ROW - 12);
  svg.setAttribute('aria-label', 'Ranking de ventas: ' + rows.map((r, i) => `${i + 1}, ${r.label}, ${fmt.format(r.value)} unidades`).join('; '));
  svg.innerHTML = `<defs><linearGradient id="ion-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>`
    + rows.map((r, i) => {
      const y = i * ROW;
      return `<text class="label" x="0" y="${y + 14}"><tspan class="rank">${i + 1}  </tspan>${r.label}</text>
        <text class="val" x="100%" y="${y + 14}">${fmt.format(r.value)}</text>
        <rect class="track" x="0" y="${y + 22}" width="100%" height="10" rx="5"/>
        <rect class="bar${i === 0 ? ' top' : ''}" x="0" y="${y + 22}" width="${(r.value / max) * 100}%" height="10" rx="5"/>`;
    }).join('');
</script>
</body>
</html>
