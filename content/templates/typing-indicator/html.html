<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .chat{max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .log{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;margin:0;list-style:none;background:var(--bg)}
  .log li{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:80%}
  .log li.me{align-self:flex-end;align-items:flex-end}
  p{margin:0;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow-wrap:anywhere}
  .me p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .st{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
  .st svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .st[data-s=read]{color:var(--accent)}
  .typing p{display:flex;align-items:center;gap:4px;height:20px}
  .typing[hidden]{display:none}
  .dots i{width:6px;height:6px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff);animation:b 1.1s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.15s}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px}
  button{font:inherit;font-weight:600;padding:8px 16px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .14s}
  button:hover{filter:brightness(1.08)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.dots i{animation:none;opacity:.7}}
</style>
</head>
<body>
<section class="chat" aria-label="Conversación con Lucía Ortega">
  <ol class="log" id="log" role="log" aria-live="polite" tabindex="0">
    <li><p>¿Pudiste revisar el informe de septiembre?</p></li>
    <li class="me"><p>Sí, te lo devuelvo con comentarios hoy.</p><span class="st" data-s="read"></span></li>
    <li class="typing" id="ty" hidden><p class="dots" aria-hidden="true"><i></i><i></i><i></i></p><span class="sr" role="status">Lucía está escribiendo</span></li>
  </ol>
  <form id="f">
    <label class="sr" for="m">Mensaje</label>
    <input id="m" autocomplete="off" placeholder="Escribe un mensaje" required>
    <button type="submit">Enviar</button>
  </form>
</section>
<script>
  const log = document.getElementById('log'), ty = document.getElementById('ty'), f = document.getElementById('f'), m = document.getElementById('m');
  const LABEL = { sent: 'Enviado', delivered: 'Entregado', read: 'Leído' };
  const ICON = { sent: '<path d="M3 8.5l3.5 3.5L13 5"/>', delivered: '<path d="M1 8.5l3.5 3.5L11 5M7.5 11.5l.5.5L15 5"/>' };
  const replies = ['Recibido, gracias.', 'Perfecto, lo reviso ahora.', 'Listo, te confirmo en unos minutos.'];
  let k = 0, typers = 0;
  const bottom = () => (log.scrollTop = log.scrollHeight);
  function status(el, s) { el.dataset.s = s; el.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">' + (ICON[s] || ICON.delivered) + '</svg>' + LABEL[s]; }
  function add(text, me) {
    const li = document.createElement('li'), p = document.createElement('p'); p.textContent = text; li.append(p);
    if (me) { li.className = 'me'; const s = document.createElement('span'); s.className = 'st'; status(s, 'sent'); li.append(s); }
    log.insertBefore(li, ty); bottom(); return li.querySelector('.st');
  }
  document.querySelectorAll('.st').forEach((s) => status(s, s.dataset.s));
  f.addEventListener('submit', (e) => {
    e.preventDefault(); const v = m.value.trim(); if (!v) return;
    const s = add(v, true); m.value = '';
    setTimeout(() => status(s, 'delivered'), 900);
    setTimeout(() => { status(s, 'read'); typers++; ty.hidden = false; bottom(); }, 1900);
    setTimeout(() => { typers--; ty.hidden = typers > 0; add(replies[k++ % replies.length], false); }, 4200);
  });
  bottom();
</script>
</body>
</html>
