<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .car{max-width:640px;margin:0 auto}
  h2{margin:0;font-size:16px;font-weight:600}
  .muted{margin:2px 0 16px;color:var(--muted)}
  .view{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .track{display:flex;transform:translateX(calc(var(--i,0) * -100%));transition:transform .16s ease}
  .slide{flex:none;display:block;width:100%;aspect-ratio:16/9}
  .ib{position:absolute;top:50%;display:grid;place-items:center;width:36px;height:36px;margin-top:-18px;padding:0;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:50%;box-shadow:var(--shadow);cursor:pointer;transition:background .14s}
  .ib:hover{background:var(--accent-soft)}
  .ib svg{width:18px;height:18px;fill:currentColor}
  .prev{left:10px}.next{right:10px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cap{display:flex;justify-content:space-between;gap:12px;margin:10px 2px}
  .cap b{font-weight:600}
  .cap span{color:var(--muted);font-variant-numeric:tabular-nums}
  .strip{position:relative;display:flex;gap:8px;padding:4px 2px 10px;overflow-x:auto}
  .th{position:relative;flex:none;width:96px;padding:0;overflow:hidden;opacity:.7;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:opacity .14s,border-color .14s}
  .th:hover{opacity:1}
  .th svg{display:block;width:100%;aspect-ratio:16/10}
  .th[aria-current]{opacity:1;border-color:var(--accent)}
  .th[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .bw{fill:var(--warn-soft)}.bi{fill:var(--info-soft)}.ba{fill:var(--accent-soft)}.bo{fill:var(--ok-soft)}.be{fill:var(--err-soft)}
  .fw{fill:var(--warn)}.fi{fill:var(--info)}.fa{fill:var(--accent)}.fo{fill:var(--ok)}.fe{fill:var(--err)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s0" viewBox="0 0 160 100"><rect class="bw" width="160" height="100"/><path class="fw" d="M108 28a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/><path class="fa" d="M0 100V70L40 38l28 28 26-22 66 56z"/><path class="fi" d="M0 100 50 74l40 14 70-18v30z"/></symbol>
  <symbol id="s1" viewBox="0 0 160 100"><rect class="bi" width="160" height="100"/><path class="fw" d="M28 26a10 10 0 1 0 20 0a10 10 0 1 0-20 0"/><path class="fi" d="M0 62q20-10 40 0t40 0t40 0t40 0V100H0z"/><path class="fa" d="M0 80q20-10 40 0t40 0t40 0t40 0V100H0z"/></symbol>
  <symbol id="s2" viewBox="0 0 160 100"><rect class="ba" width="160" height="100"/><path class="fi" d="M122 20a8 8 0 1 0 16 0a8 8 0 1 0-16 0"/><path class="fa" d="M10 100V50h22v50zM38 100V28h26v72zM70 100V58h20v42zM96 100V40h24v60zM126 100V60h24v40z"/></symbol>
  <symbol id="s3" viewBox="0 0 160 100"><rect class="bo" width="160" height="100"/><path class="fw" d="M108 28a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/><path class="fo" d="M0 100V64q40-30 80 0t80 0v36z"/></symbol>
  <symbol id="s4" viewBox="0 0 160 100"><rect class="be" width="160" height="100"/><path class="fe" d="M60 70a20 20 0 0 1 40 0z"/><path class="fa" d="M0 100V74l30-10 40 14 40-16 50 12v26z"/></symbol>
</svg>
<section class="car" id="car" role="region" aria-roledescription="carrusel" aria-label="Rutas de senderismo">
  <h2>Rutas de senderismo</h2>
  <p class="muted">Elige una miniatura o usa las flechas del teclado.</p>
  <div class="view">
    <div class="track" id="track">
      <svg class="slide" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="group" aria-roledescription="diapositiva" aria-label="1 de 5"><use href="#s0"/></svg>
      <svg class="slide" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="group" aria-roledescription="diapositiva" aria-label="2 de 5"><use href="#s1"/></svg>
      <svg class="slide" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="group" aria-roledescription="diapositiva" aria-label="3 de 5"><use href="#s2"/></svg>
      <svg class="slide" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="group" aria-roledescription="diapositiva" aria-label="4 de 5"><use href="#s3"/></svg>
      <svg class="slide" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="group" aria-roledescription="diapositiva" aria-label="5 de 5"><use href="#s4"/></svg>
    </div>
    <button type="button" class="ib prev" id="prev" aria-label="Imagen anterior"><svg viewBox="0 0 24 24"><path d="M15.4 6 14 4.6 6.6 12 14 19.4 15.4 18 9.4 12z"/></svg></button>
    <button type="button" class="ib next" id="next" aria-label="Imagen siguiente"><svg viewBox="0 0 24 24"><path d="M8.6 6 10 4.6l7.4 7.4-7.4 7.4L8.6 18l6-6z"/></svg></button>
  </div>
  <div class="cap"><b id="cap"></b><span id="cnt" aria-live="polite"></span></div>
  <div class="strip" id="strip" role="group" aria-label="Miniaturas">
    <button type="button" class="th" aria-label="Ver Sierra al amanecer"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s0"/></svg></button>
    <button type="button" class="th" aria-label="Ver Costa norte"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s1"/></svg></button>
    <button type="button" class="th" aria-label="Ver Ciudad nocturna"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s2"/></svg></button>
    <button type="button" class="th" aria-label="Ver Valle verde"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s3"/></svg></button>
    <button type="button" class="th" aria-label="Ver Atardecer en la loma"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s4"/></svg></button>
  </div>
</section>
<script>
  const $ = (id) => document.getElementById(id), car = $('car'), strip = $('strip');
  const T = ['Sierra al amanecer', 'Costa norte', 'Ciudad nocturna', 'Valle verde', 'Atardecer en la loma'];
  const slides = [...$('track').children], ths = [...strip.children];
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let n = 0;
  function go(k) {
    n = (k + T.length) % T.length;
    car.style.setProperty('--i', n);
    slides.forEach((s, j) => s.setAttribute('aria-hidden', j !== n));
    ths.forEach((b, j) => (j === n ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current')));
    $('cap').textContent = T[n]; $('cnt').textContent = `${n + 1} de ${T.length}`;
    const b = ths[n];
    strip.scrollTo({ left: b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2, behavior: calm ? 'auto' : 'smooth' });
  }
  $('prev').onclick = () => go(n - 1); $('next').onclick = () => go(n + 1);
  ths.forEach((b, k) => (b.onclick = () => go(k)));
  car.onkeydown = (e) => {
    if (e.key === 'ArrowLeft') go(n - 1); else if (e.key === 'ArrowRight') go(n + 1); else return;
    e.preventDefault();
  };
  go(0);
</script>
</body>
</html>
