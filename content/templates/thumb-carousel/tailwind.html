<script>
  const $ = (id) => document.getElementById(id), car = $('car'), strip = $('strip');
  const T = ['Sierra al amanecer', 'Costa norte', 'Ciudad nocturna', 'Valle verde', 'Atardecer en la loma'];
  const slides = [...$('track').children], ths = [...strip.children];
  const BASE = 'th relative w-24 flex-none cursor-pointer overflow-hidden rounded-lg border bg-white p-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-slate-900 ';
  const ON = BASE + 'border-blue-500 after:absolute after:inset-x-0 after:bottom-0 after:h-[3px] after:bg-gradient-to-br after:from-cyan-400 after:to-blue-600 after:content-[""]';
  const OFF = BASE + 'border-slate-200 opacity-70 hover:opacity-100 dark:border-slate-700';
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let n = 0;
  function go(k) {
    n = (k + T.length) % T.length;
    $('track').style.transform = `translateX(${-n * 100}%)`;
    slides.forEach((s, j) => s.setAttribute('aria-hidden', j !== n));
    ths.forEach((b, j) => { b.className = j === n ? ON : OFF; j === n ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'); });
    $('cap').textContent = T[n]; $('cnt').textContent = `${n + 1} de ${T.length}`;
    const b = ths[n];
    strip.scrollTo({ left: b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2, behavior: calm ? 'auto' : 'smooth' });
  }
  $('prev').onclick = () => go(n - 1); $('next').onclick = () => go(n + 1);
  ths.forEach((b, k) => (b.onclick = () => go(k)));
  car.onkeydown = (e) => {
    if (e.key === 'ArrowLeft') go(n - 1); else if (e.key === 'ArrowRight') go(n + 1); else return;
    e.preventDefault();
  };
  go(0);
</script>
