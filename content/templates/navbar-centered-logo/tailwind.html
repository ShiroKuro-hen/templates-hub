<div class="overflow-hidden rounded-lg border border-line bg-surface text-fg shadow-sm">
  <header class="relative grid h-16 grid-cols-[1fr_auto_1fr] items-center gap-2 border-b border-line px-3">
    <a href="#" class="brand col-start-2 row-start-1 flex items-center gap-2 whitespace-nowrap font-bold"><i aria-hidden="true" class="h-6 w-6 rounded-[min(var(--radius),6px)] bg-gradient-to-br from-accent-2 to-accent"></i>Nexo</a>
    <button type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"
      class="burger group col-start-3 row-start-1 grid h-10 w-10 place-items-center justify-self-end rounded-lg border border-line bg-surface text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:hidden">
      <svg class="m h-5 w-5 fill-none stroke-current stroke-2 group-aria-expanded:hidden" viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="x hidden h-5 w-5 fill-none stroke-current stroke-2 group-aria-expanded:block" viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <nav id="menu" aria-label="Principal"
      class="menu absolute inset-x-0 top-full z-[2] hidden border-b border-line bg-surface p-2 shadow-sm sm:contents sm:border-0 sm:p-0 sm:shadow-none">
      <ul class="l m-0 flex list-none flex-col gap-0.5 p-0 sm:col-start-1 sm:row-start-1 sm:flex-row sm:justify-self-end sm:gap-1">
        <li><a href="#" aria-current="page" class="block rounded-lg bg-accent-soft px-3 py-2 font-semibold text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:py-1.5">Inicio</a></li>
        <li><a href="#" class="block rounded-lg px-3 py-2 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:py-1.5">Productos</a></li>
      </ul>
      <ul class="r m-0 flex list-none flex-col gap-0.5 p-0 sm:col-start-3 sm:row-start-1 sm:flex-row sm:justify-self-start sm:gap-1">
        <li><a href="#" class="block rounded-lg px-3 py-2 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:py-1.5">Precios</a></li>
        <li><a href="#" class="block rounded-lg px-3 py-2 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:py-1.5">Contacto</a></li>
        <li><a href="#" class="btn block rounded-lg bg-accent px-3.5 py-2 text-center font-semibold text-accent-ink shadow-sm hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Crear cuenta</a></li>
      </ul>
    </nav>
  </header>
  <main class="content min-h-[260px] px-5 py-6">
    <h1 id="title" class="mb-1 text-[1.4rem] font-semibold tracking-[-0.01em]">Inicio</h1>
    <p class="m-0 max-w-[46ch] text-muted">En pantallas estrechas, el botón abre el menú a ancho completo. Esc lo cierra y el foco vuelve al botón.</p>
  </main>
</div>
<script>
  const burger = document.querySelector('.burger'), menu = document.getElementById('menu'), title = document.getElementById('title');
  const isOpen = () => burger.getAttribute('aria-expanded') === 'true';
  const set = (open) => {
    burger.setAttribute('aria-expanded', open);
    burger.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
    menu.classList.toggle('hidden', !open);
  };
  burger.addEventListener('click', () => set(!isOpen()));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) { set(false); burger.focus(); } });
  menu.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    if (!a.classList.contains('btn')) {
      menu.querySelectorAll('a').forEach((x) => x.removeAttribute('aria-current'));
      a.setAttribute('aria-current', 'page');
      title.textContent = a.textContent;
    }
    set(false);
  });
</script>
