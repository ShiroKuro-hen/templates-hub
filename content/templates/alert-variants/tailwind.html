    <i aria-hidden="true" class="grid h-6 w-6 flex-none place-items-center rounded-full border-2 border-[#17130f] bg-[#1f9d55] font-mono text-[13px] font-bold not-italic text-white">✓</i>

    <button type="button" data-dismiss aria-label="Descartar aviso: pago recibido" class="h-7 w-7 flex-none rounded-lg border-2 border-transparent text-lg leading-none hover:border-[#17130f] hover:bg-[#fffdf8] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#ff5a36]">×</button>

    <button type="button" data-dismiss aria-label="Descartar aviso: error de formulario" class="h-7 w-7 flex-none rounded-lg border-2 border-transparent text-lg leading-none hover:border-[#17130f] hover:bg-[#fffdf8] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#ff5a36]">×</button>

<script>
  document.querySelectorAll('[data-dismiss]').forEach((b) =>
    b.addEventListener('click', () => b.closest('li').remove()));
</script>
