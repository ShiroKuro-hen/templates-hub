<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero dividido con imagen</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hero{display:grid;gap:40px;align-items:center;max-width:1040px;margin:0 auto;padding:clamp(24px,5vw,56px);background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  @media(min-width:768px){.hero{grid-template-columns:1fr 1fr}.frame{order:0}}
  .copy{min-width:0}
  .frame{position:relative;order:-1;margin:0}
  .pill{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:500}
  h1{margin:0 0 16px;font-size:clamp(2rem,5.5vw,3.4rem);font-weight:700;line-height:1.08;letter-spacing:-.03em;text-wrap:balance}
  .sub{margin:0 0 28px;max-width:46ch;color:var(--muted);font-size:1.08rem;line-height:1.55}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;padding:11px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:600 1rem system-ui,sans-serif;text-decoration:none;transition:filter .14s,border-color .14s}
  .btn:hover{border-color:var(--muted)}
  .btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
  .btn.main:hover{filter:brightness(1.08)}
  .note{margin:16px 0 0;color:var(--muted);font-size:.85rem}
  .pic{padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pic img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:min(var(--radius),6px)}
  .float{position:absolute;left:-14px;bottom:28px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .float i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff));color:var(--accent-ink);font-style:normal;font-weight:700}
  .float b{display:block;font-weight:600}
  .float small{color:var(--muted);font-size:12px}
  @media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
  <section class="hero" aria-labelledby="h">
    <div class="copy">
      <p class="pill">Nuevo · Temporada 2026</p>
      <h1 id="h">Tu próxima escapada a una isla blanca.</h1>
      <p class="sub">Reserva vuelo, alojamiento y traslados en un solo paso, con cancelación gratuita hasta 48 horas antes.</p>
      <div class="row">
        <a class="btn main" href="#empezar">Reservar ahora</a>
        <a class="btn" href="#catalogo">Ver destinos</a>
      </div>
      <p class="note">Sin cargos ocultos. Cancelas gratis hasta 48 h antes.</p>
    </div>
    <figure class="frame">
      <div class="pic">
        <img src="/stock/isla-blanca.webp" alt="Pueblo blanco de una isla griega junto al mar" width="800" height="533" fetchpriority="high">
      </div>
      <div class="float">
        <i aria-hidden="true">✓</i>
        <span><b>Reserva confirmada</b><small>Hace 2 min · 3 noches, vista al mar</small></span>
      </div>
    </figure>
  </section>
</body>
</html>
