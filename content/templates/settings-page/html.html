<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes de Nimbo</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:22px;line-height:1.25;margin:0}
  .lead{margin:2px 0 20px;color:var(--muted)}
  form{display:grid;grid-template-columns:200px 1fr;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  [role=tablist]{display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid var(--border)}
  [role=tab]{all:unset;position:relative;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500;cursor:pointer;transition:background .14s,color .14s}
  [role=tab]:hover{background:var(--bg);color:var(--text)}
  [role=tab][aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
  [role=tab][aria-selected=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [role=tabpanel]{padding:24px;min-width:0}
  [role=tabpanel][hidden]{display:none}
  h2{font-size:16px;margin:0 0 4px}
  .desc{margin:0 0 20px;color:var(--muted)}
  .fields{display:grid;gap:16px;max-width:440px}
  label.f{display:grid;gap:6px;font-weight:600}
  input:not([type=checkbox]),select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
  input:user-invalid{border-color:var(--err)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
  .row:first-of-type{border-top:0;padding-top:0}
  .row small{display:block;color:var(--muted);font-size:13px}
  .switch{appearance:none;flex:none;width:36px;height:20px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;margin:0;transition:background .14s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:transform .14s}
  .switch:checked{background:var(--accent)}
  .switch:checked::after{transform:translateX(16px)}
  .bar{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:12px 24px;border-top:1px solid var(--border);background:var(--bg)}
  .bar p{margin:0 auto 0 0;color:var(--muted)}
  .btn{font:inherit;font-weight:600;border-radius:var(--radius);padding:8px 14px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  @media (max-width:680px){
    form{grid-template-columns:1fr}
    [role=tablist]{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border)}
    [role=tab]{white-space:nowrap}
    [role=tab][aria-selected=true]::before{left:12px;right:12px;top:auto;bottom:0;width:auto;height:2px}
    [role=tabpanel]{padding:20px 16px}.bar{padding:12px 16px;flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Ajustes</h1>
  <p class="lead">Gestiona tu perfil, avisos y seguridad de la cuenta.</p>
  <form id="f" novalidate>
    <div role="tablist" aria-label="Secciones de ajustes" aria-orientation="vertical">
      <button type="button" role="tab" id="t1" aria-controls="p1" aria-selected="true">Perfil</button>
      <button type="button" role="tab" id="t2" aria-controls="p2" aria-selected="false" tabindex="-1">Notificaciones</button>
      <button type="button" role="tab" id="t3" aria-controls="p3" aria-selected="false" tabindex="-1">Seguridad</button>
    </div>
    <section role="tabpanel" id="p1" aria-labelledby="t1">
      <h2>Perfil</h2><p class="desc">Así te ven las personas de tu equipo.</p>
      <div class="fields">
        <label class="f">Nombre <input name="name" value="Laura Méndez" required autocomplete="name"></label>
        <label class="f">Correo <input type="email" name="email" value="laura@altamira.com" required autocomplete="email"></label>
        <label class="f">Idioma <select name="lang"><option selected>Español</option><option>English</option><option>Português</option></select></label>
      </div>
    </section>
    <section role="tabpanel" id="p2" aria-labelledby="t2" hidden>
      <h2>Notificaciones</h2><p class="desc">Elige qué avisos recibes por correo.</p>
      <label class="row"><span>Resumen semanal<small>Un correo cada lunes con la actividad del equipo.</small></span><input class="switch" type="checkbox" role="switch" name="weekly" checked></label>
      <label class="row"><span>Menciones<small>Cuando alguien te menciona en un comentario.</small></span><input class="switch" type="checkbox" role="switch" name="mentions" checked></label>
      <label class="row"><span>Novedades del producto<small>Funciones nuevas, como mucho una vez al mes.</small></span><input class="switch" type="checkbox" role="switch" name="news"></label>
    </section>
    <section role="tabpanel" id="p3" aria-labelledby="t3" hidden>
      <h2>Seguridad</h2><p class="desc">Protege el acceso a tu cuenta.</p>
      <label class="row"><span>Verificación en dos pasos<small>Pide un código de tu app de autenticación al iniciar sesión.</small></span><input class="switch" type="checkbox" role="switch" name="mfa"></label>
      <div class="fields"><label class="f">Cerrar sesión por inactividad
        <select name="timeout"><option>Tras 30 minutos</option><option selected>Tras 8 horas</option><option>Nunca</option></select></label></div>
    </section>
    <div class="bar">
      <p id="status" role="status">Sin cambios pendientes.</p>
      <button class="btn" type="reset" id="reset" disabled>Descartar</button>
      <button class="btn primary" type="submit" id="save" disabled>Guardar cambios</button>
    </div>
  </form>
</main>
<script>
  const form = document.getElementById('f'), tabs = [...form.querySelectorAll('[role=tab]')];
  const status = document.getElementById('status'), save = document.getElementById('save'), reset = document.getElementById('reset');
  function select(tab) {
    tabs.forEach((t) => {
      const on = t === tab;
      t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    tab.focus();
  }
  tabs.forEach((t) => t.addEventListener('click', () => select(t)));
  form.querySelector('[role=tablist]').addEventListener('keydown', (e) => {
    const i = tabs.indexOf(document.activeElement), n = tabs.length;
    const next = { ArrowDown: i + 1, ArrowRight: i + 1, ArrowUp: i - 1, ArrowLeft: i - 1, Home: 0, End: n - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault(); select(tabs[(next + n) % n]);
  });
  const dirty = (on, msg) => { save.disabled = reset.disabled = !on; status.textContent = msg; };
  form.addEventListener('input', () => dirty(true, 'Tienes cambios sin guardar.'));
  form.addEventListener('reset', () => dirty(false, 'Cambios descartados.'));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) { // el campo inválido puede estar en otra pestaña
      const bad = form.querySelector(':invalid');
      select(document.getElementById(bad.closest('[role=tabpanel]').getAttribute('aria-labelledby')));
      return bad.reportValidity();
    }
    form.querySelectorAll('[name]').forEach((el) => (el.type === 'checkbox' ? (el.defaultChecked = el.checked) : (el.defaultValue = el.value)));
    form.querySelectorAll('option').forEach((o) => (o.defaultSelected = o.selected));
    dirty(false, 'Cambios guardados.');
  });
</script>
</body>
</html>
