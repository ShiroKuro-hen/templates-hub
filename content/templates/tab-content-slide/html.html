<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pestañas con deslizamiento</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  html{--d:1}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{max-width:560px;margin:0 auto}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}
  .tab{position:relative;padding:9px 14px;background:none;border:0;border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;transition:color .14s}
  .tab:hover,.tab[aria-selected=true]{color:var(--text)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff));opacity:0}
  .tab[aria-selected=true]::after{opacity:1}
  .panel{view-transition-name:panel;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h2{margin:0;font-size:16px;font-weight:600}
  .panel p{margin:4px 0 12px;color:var(--muted)}
  .panel ul{margin:0;padding:0;list-style:none}
  .panel li{padding:10px 0;border-top:1px solid var(--border)}
  ::view-transition-old(panel){animation:out .2s ease both}
  ::view-transition-new(panel){animation:in .3s ease both}
  @keyframes out{to{opacity:0}}
  @keyframes in{from{opacity:0;transform:translateX(calc(var(--d) * 40px))}}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <div class="tabs" role="tablist" id="tabs" aria-label="Secciones">
    <button class="tab" role="tab" type="button" id="t0" aria-controls="panel">Resumen</button>
    <button class="tab" role="tab" type="button" id="t1" aria-controls="panel">Equipo</button>
    <button class="tab" role="tab" type="button" id="t2" aria-controls="panel">Facturación</button>
  </div>
  <section class="panel" role="tabpanel" id="panel" tabindex="0"></section>
</div>
<script>
  const PANELS = [
    ['Resumen del equipo', 'Actividad de las últimas 24 horas en todos tus proyectos.', ['Despliegues: 18', 'Incidencias abiertas: 2', 'Cobertura de pruebas: 91 %']],
    ['Miembros del equipo', 'Personas con acceso a este espacio de trabajo.', ['Ana Pérez · Administradora', 'Luis Gómez · Editor', 'Marta Ruiz · Lectora']],
    ['Facturación', 'Plan y próximos cobros de tu organización.', ['Plan: Profesional (anual)', 'Próximo cobro: 5 de enero', 'Pago con tarjeta terminada en 4821']],
  ];
  const tabs = [...document.querySelectorAll('.tab')], panel = document.getElementById('panel');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, native = 'startViewTransition' in document;
  let cur = 0;

  function render(k) {
    const [t, p, items] = PANELS[k];
    panel.setAttribute('aria-labelledby', tabs[k].id);
    panel.innerHTML = `<h2>${t}</h2><p>${p}</p><ul>${items.map((x) => `<li>${x}</li>`).join('')}</ul>`;
    tabs.forEach((b, j) => {
      b.setAttribute('aria-selected', j === k);
      b.tabIndex = j === k ? 0 : -1;
    });
  }
  function select(k) {
    if (k === cur) return;
    const dir = Math.sign(k - cur), show = () => render(k);
    cur = k;
    document.documentElement.style.setProperty('--d', dir);
    if (calm) show();
    else if (native) document.startViewTransition(show);
    else {
      show();
      panel.animate([{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease' });
    }
  }
  function targetIndex(key) {
    const n = tabs.length;
    return { ArrowRight: (cur + 1) % n, ArrowLeft: (cur + n - 1) % n, Home: 0, End: n - 1 }[key];
  }
  document.getElementById('tabs').addEventListener('keydown', (e) => {
    const k = targetIndex(e.key);
    if (k === undefined) return;
    e.preventDefault();
    select(k);
    tabs[k].focus();
  });
  tabs.forEach((b, k) => b.addEventListener('click', () => select(k)));
  render(0);
</script>
</body>
</html>
