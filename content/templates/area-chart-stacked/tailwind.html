<figure class="m-0 rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <figcaption class="mb-4 flex flex-wrap justify-between gap-3">
    <div>
      <h2 class="m-0 text-base font-semibold">Sesiones por dispositivo</h2>
      <p class="mt-0.5 text-slate-500 dark:text-slate-400">Miles de sesiones al mes, de enero a agosto</p>
    </div>
    <div id="lg" role="group" aria-label="Series visibles" class="flex flex-wrap items-start gap-2"></div>
  </figcaption>
  <div class="relative">
    <svg id="svg" tabindex="0" role="img" aria-label="Áreas apiladas de sesiones por dispositivo. Usa las flechas izquierda y derecha para explorar los meses." class="block h-[280px] w-full overflow-visible rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"></svg>
    <div id="tip" hidden class="pointer-events-none absolute top-0 min-w-40 -translate-x-1/2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-[13px] shadow-md dark:border-slate-700 dark:bg-slate-900"></div>
  </div>
  <p id="live" aria-live="polite" class="sr-only"></p>
</figure>
<script>
  const series = [
    { n: 'Escritorio', d: [42, 45, 48, 46, 52, 55, 58, 61], sw: 'bg-blue-600 dark:bg-blue-400', f: 'fill-blue-600/35 dark:fill-blue-400/35', s: 'stroke-blue-600 dark:stroke-blue-400' },
    { n: 'Móvil', d: [30, 34, 39, 44, 48, 53, 57, 64], sw: 'bg-cyan-600 dark:bg-cyan-400', f: 'fill-cyan-600/35 dark:fill-cyan-400/35', s: 'stroke-cyan-600 dark:stroke-cyan-400' },
    { n: 'Tablet', d: [8, 9, 9, 10, 11, 11, 12, 13], sw: 'bg-emerald-600 dark:bg-emerald-400', f: 'fill-emerald-600/35 dark:fill-emerald-400/35', s: 'stroke-emerald-600 dark:stroke-emerald-400' },
  ];
  const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago'];
  const on = new Set([0, 1, 2]), H = 280, L = 40, R = 12, T = 12, B = 28;
  let W = 560, idx = -1;
  const x = (i) => L + i * (W - L - R) / (months.length - 1);
  const vis = () => series.map((_, i) => i).filter((i) => on.has(i));
  const btn = 'inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:hover:bg-slate-800';
  const ax = 'fill-slate-500 text-xs tabular-nums dark:fill-slate-400';
  function legend() {
    lg.innerHTML = series.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="${on.has(i)}" class="${btn} ${on.has(i) ? '' : 'text-slate-500 dark:text-slate-400'}"><i class="size-2.5 rounded-sm ${s.sw} ${on.has(i) ? '' : 'opacity-30'}"></i>${s.n}</button>`).join('');
  }
  function draw() {
    W = svg.clientWidth || 560;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const v = vis(), tot = months.map((_, i) => v.reduce((a, s) => a + series[s].d[i], 0));
    const max = Math.ceil(Math.max(...tot) / 40) * 40, y = (n) => T + (H - T - B) * (1 - n / max);
    let s = '<defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>', base = months.map(() => 0);
    for (let t = 0; t <= max; t += 40) s += `<line class="stroke-slate-200 dark:stroke-slate-700" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="${ax}" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    v.forEach((si) => {
      const top = base.map((b, i) => b + series[si].d[i]);
      const up = top.map((n, i) => `${x(i)},${y(n)}`), dn = base.map((n, i) => `${x(i)},${y(n)}`).reverse();
      s += `<polygon class="${series[si].f}" points="${[...up, ...dn].join(' ')}"/><polyline class="${series[si].s}" fill="none" stroke-width="2" points="${up.join(' ')}"/>`;
      base = top;
    });
    months.forEach((m, i) => { s += `<text class="${ax}" x="${x(i)}" y="${H - 8}" text-anchor="middle">${m}</text>`; });
    if (idx >= 0) s += `<rect x="${x(idx) - 0.75}" y="${T}" width="1.5" height="${H - T - B}" fill="url(#cg)"/>`;
    svg.innerHTML = s;
    if (idx >= 0) show(idx); else tip.hidden = true;
  }
  function show(i) {
    idx = i;
    const v = vis(), t = v.reduce((a, s) => a + series[s].d[i], 0), row = 'flex justify-between gap-4 tabular-nums';
    tip.innerHTML = `<b class="mb-1 block">${months[i]}</b>` + [...v].reverse().map((s) => `<div class="${row}"><span><i class="mr-1.5 inline-block size-2.5 rounded-sm ${series[s].sw}"></i>${series[s].n}</span><span>${series[s].d[i]}</span></div>`).join('') + `<div class="${row} mt-1 border-t border-slate-200 pt-1 font-semibold dark:border-slate-700"><span>Total</span><span>${t}</span></div>`;
    tip.style.left = Math.min(Math.max(x(i), 90), W - 90) + 'px'; tip.hidden = false;
    live.textContent = `${months[i]}: ` + v.map((s) => `${series[s].n} ${series[s].d[i]}`).join(', ') + `. Total ${t}.`;
  }
  const set = (i) => { if (i !== idx) { idx = i; draw(); } };
  lg.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; if (on.has(i) && on.size > 1) on.delete(i); else on.add(i); legend(); draw(); };
  svg.onpointermove = (e) => { const r = svg.getBoundingClientRect(); set(Math.max(0, Math.min(months.length - 1, Math.round((e.clientX - r.left - L) / ((W - L - R) / (months.length - 1)))))); };
  svg.onpointerleave = () => document.activeElement !== svg && set(-1);
  svg.onblur = () => set(-1);
  svg.onkeydown = (e) => {
    const n = months.length - 1, k = { ArrowRight: Math.min(n, idx + 1), ArrowLeft: Math.max(0, idx < 0 ? 0 : idx - 1), Home: 0, End: n }[e.key];
    if (e.key === 'Escape') set(-1); else if (k !== undefined) { e.preventDefault(); set(k); }
  };
  addEventListener('resize', draw);
  legend(); draw();
</script>
