<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:760px;margin:0 auto;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
  h2{margin:0;font-size:16px}
  .btn{font:inherit;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s}
  .btn:hover{background:var(--accent-soft)}
  .btn[aria-disabled=true]{cursor:progress;opacity:.6}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .scroll{overflow-x:auto}
  table{width:100%;min-width:520px;border-collapse:collapse}
  th,td{padding:12px 20px;text-align:left;border-bottom:1px solid var(--border)}
  tbody tr:last-child td{border-bottom:0}
  th{font-weight:600;color:var(--muted)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .b{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b.ok{background:var(--ok-soft);color:var(--text)} .b.ok::before{color:var(--ok)}
  .b.warn{background:var(--warn-soft);color:var(--text)} .b.warn::before{color:var(--warn)}
  .b.err{background:var(--err-soft);color:var(--text)} .b.err::before{color:var(--err)}
  .sk{display:block;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--accent-soft),var(--info-soft),var(--accent-soft));background-size:200% 100%;animation:sh 1.4s linear infinite}
  @keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.sk{animation:none}}
</style>
</head>
<body>
<section class="card" id="card" aria-labelledby="t" aria-busy="true">
  <header>
    <h2 id="t">Pedidos recientes</h2>
    <button class="btn" id="re" type="button" aria-disabled="true">Recargar</button>
  </header>
  <div class="scroll">
    <table>
      <caption class="sr">Últimos pedidos de clientes con estado y total.</caption>
      <thead><tr><th scope="col">Pedido</th><th scope="col">Cliente</th><th scope="col">Estado</th><th scope="col" class="num">Total</th></tr></thead>
      <tbody id="b"></tbody>
    </table>
  </div>
  <p class="sr" id="live" role="status"></p>
</section>
<script>
  const rows = [
    ['#4821', 'Textiles Andina', 'Pagado', 'ok', 'S/ 2,480.00'],
    ['#4820', 'Café del Valle', 'Pendiente', 'warn', 'S/ 960.50'],
    ['#4819', 'Logística Pacífico', 'Pagado', 'ok', 'S/ 5,310.00'],
    ['#4818', 'Estudio Mirador', 'Fallido', 'err', 'S/ 740.00'],
    ['#4817', 'Agro Sierra', 'Pagado', 'ok', 'S/ 1,125.80'],
  ];
  const $ = (id) => document.getElementById(id);
  const widths = [38, 70, 52, 64, 46];
  function load() {
    $('card').setAttribute('aria-busy', 'true'); $('re').setAttribute('aria-disabled', 'true');
    $('live').textContent = 'Cargando pedidos…';
    $('b').innerHTML = widths.map((w) =>
      `<tr aria-hidden="true"><td><span class="sk" style="width:${w}%"></span></td><td><span class="sk" style="width:${100 - w / 3}%"></span></td><td><span class="sk" style="width:72px"></span></td><td><span class="sk" style="width:60%;margin-left:auto"></span></td></tr>`).join('');
    setTimeout(() => {
      $('b').innerHTML = rows.map((r) =>
        `<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="b ${r[3]}">${r[2]}</span></td><td class="num">${r[4]}</td></tr>`).join('');
      $('card').setAttribute('aria-busy', 'false'); $('re').removeAttribute('aria-disabled');
      $('live').textContent = 'Pedidos cargados.';
    }, 1800);
  }
  $('re').addEventListener('click', () => { if ($('re').getAttribute('aria-disabled') !== 'true') load(); });
  load();
</script>
</body>
</html>
