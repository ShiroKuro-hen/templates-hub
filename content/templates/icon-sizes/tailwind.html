<svg width="0" height="0" class="absolute" aria-hidden="true"><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" vector-effect="non-scaling-stroke"/><path d="m20 20-3.5-3.5" vector-effect="non-scaling-stroke"/></symbol></svg>
<section class="mx-auto max-w-2xl rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
    <div><h2 id="t" class="text-lg font-semibold">Tamaños y trazos de iconos</h2><p class="mb-2 mt-0.5 text-slate-500 dark:text-slate-400">Cada tamaño tiene su propio grosor de trazo, en píxeles reales.</p></div>
    <label class="flex items-center gap-2 text-slate-500 dark:text-slate-400"><input id="g" type="checkbox" class="size-4 accent-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:accent-blue-400"> Mostrar guías</label>
  </div>
  <ul id="list"></ul>
  <p class="mt-3 rounded-lg bg-blue-50 px-3 py-2.5 dark:bg-slate-800">Junto a texto, el icono mide 1,2 veces el cuerpo y se centra con <code class="font-mono text-xs">align-items: center</code>.</p>
</section>
<script>
  const SIZES = [['xs', 12, 1.25, 12], ['sm', 16, 1.5, 14], ['md', 20, 1.75, 16], ['lg', 24, 2, 20], ['xl', 32, 2.5, 28], ['2xl', 48, 3, 40]];
  const SVG = 'fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round]';
  list.innerHTML = SIZES.map(([k, s, w, f]) => `
    <li class="flex flex-wrap items-center gap-x-5 gap-y-2 border-t border-slate-200 py-3 dark:border-slate-700">
      <div class="w-28"><b class="block">${k}</b><span class="text-[13px] tabular-nums text-slate-500 dark:text-slate-400">${s} px, trazo ${String(w).replace('.', ',')}</span></div>
      <div class="grid w-14 place-items-center text-blue-600 dark:text-blue-400"><svg class="${SVG}" style="width:${s}px;height:${s}px;stroke-width:${w}px" aria-hidden="true"><use href="#i-search"/></svg></div>
      <span class="t inline-flex items-center gap-[.4em] whitespace-nowrap leading-tight" style="font-size:${f}px"><svg class="shrink-0 ${SVG}" style="width:1.2em;height:1.2em;stroke-width:${w}px" aria-hidden="true"><use href="#i-search"/></svg>${f === 40 ? 'Buscar' : 'Buscar clientes'}</span>
    </li>`).join('');
  g.addEventListener('change', () =>
    document.querySelectorAll('.t').forEach((el) =>
      ['outline', 'outline-1', 'outline-dashed', 'outline-blue-500'].forEach((c) => el.classList.toggle(c, g.checked))));
</script>
