<div class="bg-page text-sm leading-[1.5] text-fg">
  <main class="mx-auto max-w-[520px]">
    <h2 class="mb-0.5 text-lg leading-[1.5] font-semibold">Taza vintage estampada 350 ml</h2>
    <p class="mb-3.5 text-muted">18,90 €</p>
    <div id="stage" tabindex="0" role="group" aria-label="Imagen del producto. Con el zoom activo, usa las flechas para desplazarte y Escape para salir." class="stage relative aspect-[3/2] cursor-zoom-in overflow-hidden rounded-lg border border-line bg-surface shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <img id="main" src="/stock/taza-vintage.webp" alt="Taza roja con estampado vintage" width="800" height="533" fetchpriority="high" class="block h-full w-full object-cover transition-transform duration-[.2s] motion-reduce:transition-none">
      <div id="lens" hidden class="lens absolute h-[140px] w-[140px] rounded-full border-2 border-accent bg-no-repeat shadow-sm pointer-events-none"></div>
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-3">
      <button type="button" id="zoom" aria-pressed="false" class="h-9 cursor-pointer rounded-lg border border-line bg-surface px-3.5 font-medium transition-colors duration-[.14s] hover:border-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ampliar</button>
      <span id="hint" class="text-[13px] text-muted">Pasa el cursor o pulsa Ampliar para ver el detalle.</span>
    </div>
    <ul class="mt-2.5 grid grid-cols-[repeat(4,minmax(0,1fr))] gap-2 p-0">
      <li><button type="button" aria-current="true" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="/stock/taza-vintage.webp" alt="Taza roja con estampado vintage" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="/stock/camara-vintage.webp" alt="Cámara vintage sobre teclas de piano" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="/stock/tocadiscos.webp" alt="Aguja de tocadiscos sobre el vinilo" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="/stock/cafe-rojo.webp" alt="Taza de café sobre fondo rojo" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
    </ul>
  </main>
</div>
<style>
  .stage.zoomed { cursor: move; }
  .stage.zoomed img { transform: translate(var(--tx, 0), var(--ty, 0)) scale(2); }
</style>
<script>
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), main = $('main'), lens = $('lens'), zoomBtn = $('zoom'), hint = $('hint');
  const thumbs = [...document.querySelectorAll('ul button')];
  const LENS = 140, ZOOM = 2.5, STEP = 10, LIMIT = 50;
  const KEYS = { ArrowLeft: [STEP, 0], ArrowRight: [-STEP, 0], ArrowUp: [0, STEP], ArrowDown: [0, -STEP] };
  const pan = { x: 0, y: 0 };
  let zoomed = false;

  function setMain(btn) {
    const img = btn.querySelector('img');
    main.src = img.src;
    main.alt = img.alt;
    lens.style.backgroundImage = `url("${img.src}")`;
    thumbs.forEach((t) => t.setAttribute('aria-current', String(t === btn)));
  }

  function applyPan() {
    stage.style.setProperty('--tx', pan.x + '%');
    stage.style.setProperty('--ty', pan.y + '%');
  }

  function setZoom(on) {
    zoomed = on;
    stage.classList.toggle('zoomed', on);
    zoomBtn.setAttribute('aria-pressed', String(on));
    lens.hidden = true;
    pan.x = 0;
    pan.y = 0;
    applyPan();
    hint.textContent = on ? 'Usa las flechas para desplazarte; Escape para salir.' : 'Pasa el cursor o pulsa Ampliar para ver el detalle.';
    if (on) stage.focus();
  }

  function moveLens(e) {
    if (zoomed || e.pointerType !== 'mouse') return;
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    Object.assign(lens.style, {
      left: x - LENS / 2 + 'px',
      top: y - LENS / 2 + 'px',
      backgroundSize: `${r.width * ZOOM}px ${r.height * ZOOM}px`,
      backgroundPosition: `${LENS / 2 - x * ZOOM}px ${LENS / 2 - y * ZOOM}px`,
    });
    lens.hidden = false;
  }

  zoomBtn.addEventListener('click', () => setZoom(!zoomed));
  stage.addEventListener('pointermove', moveLens);
  stage.addEventListener('pointerleave', () => { lens.hidden = true; });
  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && zoomed) return setZoom(false);
    const d = KEYS[e.key];
    if (!zoomed || !d) return;
    e.preventDefault();
    pan.x = Math.min(LIMIT, Math.max(-LIMIT, pan.x + d[0]));
    pan.y = Math.min(LIMIT, Math.max(-LIMIT, pan.y + d[1]));
    applyPan();
  });
  thumbs.forEach((t) => t.addEventListener('click', () => setMain(t)));
  setMain(thumbs[0]);
</script>
