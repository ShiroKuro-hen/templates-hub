<div class="bg-page text-sm leading-[1.5] text-fg">
  <main class="mx-auto max-w-[520px]">
    <h2 class="mb-0.5 text-lg leading-[1.5] font-semibold">Mochila Sierra 24 L</h2>
    <p class="mb-3.5 text-muted">89,90 €</p>
    <div id="stage" tabindex="0" role="group" aria-label="Imagen del producto. Con el zoom activo, usa las flechas para desplazarte y Escape para salir." class="stage relative aspect-[4/3] cursor-zoom-in overflow-hidden rounded-lg border border-line bg-surface shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <img id="main" src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20320%20240%27%3E%3Crect%20width=%27320%27%20height=%27240%27%20fill=%27%23fde7c7%27/%3E%3Ccircle%20cx=%27240%27%20cy=%2770%27%20r=%2728%27%20fill=%27%23f59e0b%27/%3E%3Cpath%20d=%27M0%20240V150l80-70%2070%2060%2090-90%2080%2080v110z%27%20fill=%27%232f5bff%27/%3E%3Cpath%20d=%27M0%20240v-50l120-40%20100%2030%20100-26v86z%27%20fill=%27%230e9f6e%27/%3E%3C/svg%3E" alt="Vista frontal" width="640" height="480" loading="lazy" class="block h-full w-full object-cover transition-transform duration-[.2s] motion-reduce:transition-none">
      <div id="lens" hidden class="lens absolute h-[140px] w-[140px] rounded-full border-2 border-accent bg-no-repeat shadow-sm pointer-events-none"></div>
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-3">
      <button type="button" id="zoom" aria-pressed="false" class="h-9 cursor-pointer rounded-lg border border-line bg-surface px-3.5 font-medium transition-colors duration-[.14s] hover:border-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ampliar</button>
      <span id="hint" class="text-[13px] text-muted">Pasa el cursor o pulsa Ampliar para ver el detalle.</span>
    </div>
    <ul class="mt-2.5 grid grid-cols-[repeat(4,1fr)] gap-2 p-0">
      <li><button type="button" aria-current="true" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20320%20240%27%3E%3Crect%20width=%27320%27%20height=%27240%27%20fill=%27%23fde7c7%27/%3E%3Ccircle%20cx=%27240%27%20cy=%2770%27%20r=%2728%27%20fill=%27%23f59e0b%27/%3E%3Cpath%20d=%27M0%20240V150l80-70%2070%2060%2090-90%2080%2080v110z%27%20fill=%27%232f5bff%27/%3E%3Cpath%20d=%27M0%20240v-50l120-40%20100%2030%20100-26v86z%27%20fill=%27%230e9f6e%27/%3E%3C/svg%3E" alt="Vista frontal" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20320%20240%27%3E%3Crect%20width=%27320%27%20height=%27240%27%20fill=%27%23dbe7ff%27/%3E%3Crect%20x=%2730%27%20y=%2780%27%20width=%2750%27%20height=%27160%27%20fill=%27%232f5bff%27/%3E%3Crect%20x=%2790%27%20y=%2740%27%20width=%2760%27%20height=%27200%27%20fill=%27%230891b2%27/%3E%3Crect%20x=%27160%27%20y=%27100%27%20width=%2744%27%20height=%27140%27%20fill=%27%235b6b82%27/%3E%3Crect%20x=%27214%27%20y=%2760%27%20width=%2770%27%20height=%27180%27%20fill=%27%232f5bff%27/%3E%3Cg%20fill=%27%23fff%27%3E%3Crect%20x=%27104%27%20y=%2760%27%20width=%2710%27%20height=%2712%27/%3E%3Crect%20x=%27124%27%20y=%2760%27%20width=%2710%27%20height=%2712%27/%3E%3Crect%20x=%27228%27%20y=%2780%27%20width=%2710%27%20height=%2712%27/%3E%3Crect%20x=%27248%27%20y=%2780%27%20width=%2710%27%20height=%2712%27/%3E%3C/g%3E%3C/svg%3E" alt="Vista lateral" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20320%20240%27%3E%3Crect%20width=%27320%27%20height=%27240%27%20fill=%27%23e6fbf4%27/%3E%3Ccircle%20cx=%27110%27%20cy=%27120%27%20r=%2780%27%20fill=%27%2334d399%27/%3E%3Ccircle%20cx=%27200%27%20cy=%27110%27%20r=%2760%27%20fill=%27%232f5bff%27%20opacity=%27.8%27/%3E%3Cpath%20d=%27M0%20200q80-60%20160%200t160%200v40H0z%27%20fill=%27%23f5b84b%27/%3E%3C/svg%3E" alt="Detalle del bolsillo" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
      <li><button type="button" aria-current="false" class="block w-full cursor-pointer overflow-hidden rounded-md border-2 border-line bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[current=true]:border-accent"><img src="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20320%20240%27%3E%3Crect%20width=%27320%27%20height=%27240%27%20fill=%27%23ffe4ea%27/%3E%3Cpath%20d=%27M0%2080q40-30%2080%200t80%200%2080%200%2080%200v160H0z%27%20fill=%27%23ff6b81%27/%3E%3Cpath%20d=%27M0%20140q40-30%2080%200t80%200%2080%200%2080%200v100H0z%27%20fill=%27%23d92d4a%27%20opacity=%27.8%27/%3E%3Ccircle%20cx=%27260%27%20cy=%2746%27%20r=%2718%27%20fill=%27%23fbf1dc%27/%3E%3C/svg%3E" alt="Vista en uso" width="96" height="72" loading="lazy" class="block h-[72px] w-full object-cover"></button></li>
    </ul>
  </main>
</div>
<style>
  .stage.zoomed { cursor: move; }
  .stage.zoomed img { transform: translate(var(--tx, 0), var(--ty, 0)) scale(2); }
</style>
<script>
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), main = $('main'), lens = $('lens'), zoomBtn = $('zoom'), hint = $('hint');
  const thumbs = [...document.querySelectorAll('ul button')];
  const LENS = 140, ZOOM = 2.5, STEP = 10, LIMIT = 50;
  const KEYS = { ArrowLeft: [STEP, 0], ArrowRight: [-STEP, 0], ArrowUp: [0, STEP], ArrowDown: [0, -STEP] };
  const pan = { x: 0, y: 0 };
  let zoomed = false;

  function setMain(btn) {
    const img = btn.querySelector('img');
    main.src = img.src;
    main.alt = img.alt;
    lens.style.backgroundImage = `url("${img.src}")`;
    thumbs.forEach((t) => t.setAttribute('aria-current', String(t === btn)));
  }

  function applyPan() {
    stage.style.setProperty('--tx', pan.x + '%');
    stage.style.setProperty('--ty', pan.y + '%');
  }

  function setZoom(on) {
    zoomed = on;
    stage.classList.toggle('zoomed', on);
    zoomBtn.setAttribute('aria-pressed', String(on));
    lens.hidden = true;
    pan.x = 0;
    pan.y = 0;
    applyPan();
    hint.textContent = on ? 'Usa las flechas para desplazarte; Escape para salir.' : 'Pasa el cursor o pulsa Ampliar para ver el detalle.';
    if (on) stage.focus();
  }

  function moveLens(e) {
    if (zoomed || e.pointerType !== 'mouse') return;
    const r = stage.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    Object.assign(lens.style, {
      left: x - LENS / 2 + 'px',
      top: y - LENS / 2 + 'px',
      backgroundSize: `${r.width * ZOOM}px ${r.height * ZOOM}px`,
      backgroundPosition: `${LENS / 2 - x * ZOOM}px ${LENS / 2 - y * ZOOM}px`,
    });
    lens.hidden = false;
  }

  zoomBtn.addEventListener('click', () => setZoom(!zoomed));
  stage.addEventListener('pointermove', moveLens);
  stage.addEventListener('pointerleave', () => { lens.hidden = true; });
  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && zoomed) return setZoom(false);
    const d = KEYS[e.key];
    if (!zoomed || !d) return;
    e.preventDefault();
    pan.x = Math.min(LIMIT, Math.max(-LIMIT, pan.x + d[0]));
    pan.y = Math.min(LIMIT, Math.max(-LIMIT, pan.y + d[1]));
    applyPan();
  });
  thumbs.forEach((t) => t.addEventListener('click', () => setMain(t)));
  setMain(thumbs[0]);
</script>
