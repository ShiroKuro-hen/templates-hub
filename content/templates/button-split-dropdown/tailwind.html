<div class="p-5 text-slate-900 dark:text-slate-100">
  <div class="inline-flex rounded-lg shadow-sm">
    <button type="button" id="main" class="rounded-l-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-blue-500">Publicar ahora</button>
    <button type="button" id="caret" popovertarget="menu" aria-haspopup="menu" aria-label="Más opciones de publicación"
            class="rounded-r-lg border-l border-white/30 bg-blue-600 px-2.5 py-2 text-sm font-medium text-white hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-blue-500">▾</button>
  </div>

  <div id="menu" popover role="menu" aria-label="Opciones de publicación"
       class="fixed inset-auto m-0 min-w-[230px] rounded-lg border border-slate-200 bg-white p-1 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Publicar ahora<small class="block font-normal text-slate-500 dark:text-slate-400">Visible al instante</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Programar<small class="block font-normal text-slate-500 dark:text-slate-400">Mañana a las 9:00</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Guardar borrador<small class="block font-normal text-slate-500 dark:text-slate-400">Solo lo ves tú</small></button>
  </div>
</div>

<script>
  const menu = document.getElementById('menu'), caret = document.getElementById('caret');
  const items = [...menu.querySelectorAll('button')];
  caret.addEventListener('click', () => {
    const r = caret.parentElement.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = r.bottom + 8 + 'px';
  });
  menu.addEventListener('toggle', (e) => e.newState === 'open' && items[0].focus());
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  items.forEach((b) => b.addEventListener('click', () => {
    document.getElementById('main').textContent = b.firstChild.textContent;
    menu.hidePopover();
  }));
</script>
