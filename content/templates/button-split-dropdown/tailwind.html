<div class="bg-[#f6f1e7] p-5 text-[#17130f]">
  <div class="inline-flex rounded-[10px] shadow-[4px_4px_0_#17130f]">
    <button type="button" id="main" class="rounded-l-[10px] border-2 border-[#17130f] bg-[#ff5a36] px-4 py-2 font-semibold hover:bg-[#ff7d5e] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[#ff5a36]">Publicar ahora</button>
    <button type="button" id="caret" popovertarget="menu" aria-haspopup="menu" aria-label="Más opciones de publicación"
            class="-ml-0.5 rounded-r-[10px] border-2 border-[#17130f] bg-[#ff5a36] px-3 py-2 font-semibold hover:bg-[#ff7d5e] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[#ff5a36]">▾</button>
  </div>

  <div id="menu" popover role="menu" aria-label="Opciones de publicación"
       class="fixed inset-auto m-0 min-w-[230px] rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-1.5 text-[#17130f] shadow-[4px_4px_0_#17130f]">
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left font-semibold hover:bg-[#ffd84d] focus-visible:bg-[#ffd84d] focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Publicar ahora<small class="block font-normal text-[#6b6258]">Visible al instante</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left font-semibold hover:bg-[#ffd84d] focus-visible:bg-[#ffd84d] focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Programar<small class="block font-normal text-[#6b6258]">Mañana a las 9:00</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left font-semibold hover:bg-[#ffd84d] focus-visible:bg-[#ffd84d] focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Guardar borrador<small class="block font-normal text-[#6b6258]">Solo lo ves tú</small></button>
  </div>
</div>

<script>
  const menu = document.getElementById('menu'), caret = document.getElementById('caret');
  const items = [...menu.querySelectorAll('button')];
  caret.addEventListener('click', () => {
    const r = caret.parentElement.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = r.bottom + 10 + 'px';
  });
  menu.addEventListener('toggle', (e) => e.newState === 'open' && items[0].focus());
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  items.forEach((b) => b.addEventListener('click', () => {
    document.getElementById('main').textContent = b.firstChild.textContent;
    menu.hidePopover();
  }));
</script>
