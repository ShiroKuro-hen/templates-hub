<div class="p-5 text-fg">
  <div class="inline-flex rounded-lg shadow-sm">
    <button type="button" id="main" class="rounded-l-lg bg-accent px-4 py-2 text-sm font-medium text-accent-ink hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Publicar ahora</button>
    <button type="button" id="caret" popovertarget="menu" aria-haspopup="menu" aria-label="Más opciones de publicación"
            class="rounded-r-lg border-l border-surface/30 bg-accent px-2.5 py-2 text-sm font-medium text-accent-ink hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">▾</button>
  </div>

  <div id="menu" popover role="menu" aria-label="Opciones de publicación"
       class="fixed inset-auto m-0 min-w-[230px] rounded-lg border border-line bg-surface p-1 text-fg shadow-sm">
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Publicar ahora<small class="block font-normal text-muted">Visible al instante</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Programar<small class="block font-normal text-muted">Mañana a las 9:00</small></button>
    <button role="menuitem" class="block w-full rounded-md px-2.5 py-2 text-left text-sm font-medium hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Guardar borrador<small class="block font-normal text-muted">Solo lo ves tú</small></button>
  </div>
</div>

<script>
  const menu = document.getElementById('menu'), caret = document.getElementById('caret');
  const items = [...menu.querySelectorAll('button')];
  caret.addEventListener('click', () => {
    const r = caret.parentElement.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = r.bottom + 8 + 'px';
  });
  menu.addEventListener('toggle', (e) => e.newState === 'open' && items[0].focus());
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  items.forEach((b) => b.addEventListener('click', () => {
    document.getElementById('main').textContent = b.firstChild.textContent;
    menu.hidePopover();
  }));
</script>
