<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
  .log { margin: 18px 0 0; font-size: 13px; color: var(--muted); }

  .split { display: inline-flex; border-radius: var(--radius); box-shadow: var(--shadow); }
  .split button { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 8px 16px; border: 0; background: var(--accent);
    color: var(--accent-ink); cursor: pointer; transition: filter .14s; }
  .split button:hover { filter: brightness(1.1); }
  .split button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #main { border-radius: var(--radius) 0 0 var(--radius); }
  #caret { border-radius: 0 var(--radius) var(--radius) 0; padding: 8px 10px; border-left: 1px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); }

  #menu { position: fixed; inset: auto; margin: 0; min-width: 230px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  #menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px;
    background: none; font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; color: inherit; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: var(--accent-soft); }
  #menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #menu small { display: block; font-weight: 400; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .split button { transition: none; } }
</style>
</head>
<body>
  <h1>Nuevo artículo</h1>
  <div class="split">
    <button type="button" id="main">Publicar ahora</button>
    <button type="button" id="caret" popovertarget="menu" aria-label="Más opciones de publicación"
            aria-haspopup="menu" aria-expanded="false">▾</button>
  </div>
  <div id="menu" popover role="menu" aria-label="Opciones de publicación">
    <button role="menuitem" data-label="Publicar ahora">Publicar ahora<small>Visible al instante</small></button>
    <button role="menuitem" data-label="Programar">Programar<small>Mañana a las 9:00</small></button>
    <button role="menuitem" data-label="Guardar borrador">Guardar borrador<small>Solo lo ves tú</small></button>
  </div>
  <p class="log" role="status" id="log">Sin acciones todavía</p>

<script>
  const $ = (id) => document.getElementById(id);
  const menu = $('menu'), caret = $('caret'), main = $('main'), log = $('log');
  const items = [...menu.querySelectorAll('button')];

  caret.addEventListener('click', () => {            // se ejecuta antes de abrir el popover
    const r = main.parentElement.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = r.bottom + 8 + 'px';
  });
  menu.addEventListener('toggle', (e) => {
    caret.setAttribute('aria-expanded', e.newState === 'open');
    if (e.newState === 'open') items[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  items.forEach((b) => b.addEventListener('click', () => {
    main.textContent = b.dataset.label;
    log.textContent = 'Elegiste: ' + b.dataset.label;
    menu.hidePopover();
  }));
  main.addEventListener('click', () => { log.textContent = 'Acción: ' + main.textContent; });
</script>
</body>
</html>
