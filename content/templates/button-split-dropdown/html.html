<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #f6f1e7; color: #17130f; }
  h1 { margin: 0 0 16px; font-size: 1.2rem; letter-spacing: -.02em; }
  .log { margin: 18px 0 0; font: 12px ui-monospace, monospace; color: #6b6258; }

  .split { display: inline-flex; border-radius: 10px; box-shadow: 4px 4px 0 #17130f; transition: transform .1s, box-shadow .1s; }
  .split:has(button:active) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #17130f; }
  .split button { font: 600 14px system-ui, sans-serif; padding: 9px 16px; border: 2px solid #17130f; background: #ff5a36;
    color: #17130f; cursor: pointer; }
  .split button:hover { background: #ff7d5e; }
  .split button:focus-visible { outline: 3px solid #ff5a36; outline-offset: 3px; }
  #main { border-radius: 10px 0 0 10px; }
  #caret { border-radius: 0 10px 10px 0; margin-left: -2px; padding: 9px 12px; }

  #menu { position: fixed; inset: auto; margin: 0; min-width: 230px; padding: 6px; border: 2px solid #17130f; border-radius: 10px;
    background: #fffdf8; color: #17130f; box-shadow: 4px 4px 0 #17130f; }
  #menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px;
    background: none; font: 600 14px system-ui, sans-serif; color: inherit; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: #ffd84d; outline: 3px solid #ff5a36; outline-offset: -3px; }
  #menu small { display: block; font-weight: 400; color: #6b6258; }
  @media (prefers-reduced-motion: reduce) { .split { transition: none; } }
</style>
</head>
<body>
  <h1>Nuevo artículo</h1>
  <div class="split">
    <button type="button" id="main">Publicar ahora</button>
    <button type="button" id="caret" popovertarget="menu" aria-label="Más opciones de publicación"
            aria-haspopup="menu" aria-expanded="false">▾</button>
  </div>
  <div id="menu" popover role="menu" aria-label="Opciones de publicación">
    <button role="menuitem" data-label="Publicar ahora">Publicar ahora<small>Visible al instante</small></button>
    <button role="menuitem" data-label="Programar">Programar<small>Mañana a las 9:00</small></button>
    <button role="menuitem" data-label="Guardar borrador">Guardar borrador<small>Solo lo ves tú</small></button>
  </div>
  <p class="log" role="status" id="log">Sin acciones todavía</p>

<script>
  const $ = (id) => document.getElementById(id);
  const menu = $('menu'), caret = $('caret'), main = $('main'), log = $('log');
  const items = [...menu.querySelectorAll('button')];

  caret.addEventListener('click', () => {            // se ejecuta antes de abrir el popover
    const r = main.parentElement.getBoundingClientRect();
    menu.style.left = r.left + 'px';
    menu.style.top = r.bottom + 10 + 'px';
  });
  menu.addEventListener('toggle', (e) => {
    caret.setAttribute('aria-expanded', e.newState === 'open');
    if (e.newState === 'open') items[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
  items.forEach((b) => b.addEventListener('click', () => {
    main.textContent = b.dataset.label;
    log.textContent = 'Elegiste: ' + b.dataset.label;
    menu.hidePopover();
  }));
  main.addEventListener('click', () => { log.textContent = 'Acción: ' + main.textContent; });
</script>
</body>
</html>
