<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú contextual de archivos</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  [hidden]{display:none!important}
  .files{display:grid;gap:10px;max-width:420px;margin:0;padding:0;list-style:none}
  .card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:context-menu}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ext{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:min(var(--radius),6px);background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff));color:var(--accent-ink);font:600 11px/1 system-ui,-apple-system,"Segoe UI",sans-serif}
  .meta{min-width:0}
  .meta strong{display:block;overflow-wrap:anywhere}
  .meta span{color:var(--muted);font-size:13px}
  .hint,.log{max-width:420px;margin:12px 0 0}
  .hint{color:var(--muted);font-size:13px}
  .log{font-weight:600}
  .menu{position:fixed;z-index:20;min-width:220px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .menu hr{margin:6px 4px;border:0;border-top:1px solid var(--border)}
  [role=group]{padding-left:12px}
  [role=menuitem]{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:34px;padding:0 10px;font:inherit;text-align:left;color:var(--text);background:none;border:0;border-radius:min(var(--radius),6px);cursor:pointer}
  [role=menuitem]:hover{background:var(--accent-soft)}
  [role=menuitem]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  [role=menuitem][aria-disabled=true]{color:var(--muted);background:none;cursor:not-allowed}
  [role=menuitem].danger{color:var(--err)}
  .chev{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .14s}
  [aria-expanded=true]>.chev{transform:rotate(90deg)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <ul class="files" id="files">
    <li><article class="card" tabindex="0" data-name="informe-q3.pdf"><span class="ext" aria-hidden="true">PDF</span><span class="meta"><strong>informe-q3.pdf</strong><span>2,4 MB · Hace 2 h</span></span></article></li>
    <li><article class="card" tabindex="0" data-name="presupuesto.xlsx"><span class="ext" aria-hidden="true">XLSX</span><span class="meta"><strong>presupuesto.xlsx</strong><span>812 KB · Ayer</span></span></article></li>
    <li><article class="card" tabindex="0" data-name="logo.svg"><span class="ext" aria-hidden="true">SVG</span><span class="meta"><strong>logo.svg</strong><span>14 KB · Hace 3 días</span></span></article></li>
    <li><article class="card" tabindex="0" data-name="notas-reunion.md"><span class="ext" aria-hidden="true">MD</span><span class="meta"><strong>notas-reunion.md</strong><span>3 KB · Hace 1 semana</span></span></article></li>
  </ul>
  <p class="hint">Clic derecho, Mayús+F10 o la tecla Menú sobre un archivo abre sus acciones.</p>
  <p class="log" id="log" role="status" aria-live="polite">Aún no has elegido ninguna acción.</p>
  <div class="menu" id="menu" role="menu" aria-label="Acciones del archivo" hidden>
    <button type="button" role="menuitem" tabindex="-1" data-act="abrir">Abrir</button>
    <button type="button" role="menuitem" tabindex="-1" data-act="renombrar">Renombrar</button>
    <button type="button" role="menuitem" tabindex="-1" data-act="duplicar">Duplicar</button>
    <button type="button" role="menuitem" tabindex="-1" aria-disabled="true">Compartir (próximamente)</button>
    <hr role="separator">
    <button type="button" role="menuitem" tabindex="-1" aria-haspopup="menu" aria-expanded="false" aria-controls="mover" data-sub>Mover a<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    <div id="mover" role="group" aria-label="Mover a" hidden>
      <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Documentos">Documentos</button>
      <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Descargas">Descargas</button>
      <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Proyectos">Proyectos</button>
    </div>
    <hr role="separator">
    <button type="button" role="menuitem" tabindex="-1" class="danger" data-act="eliminar">Eliminar</button>
  </div>
</main>
<script>
  const files = document.getElementById('files'), menu = document.getElementById('menu'), log = document.getElementById('log');
  const trigger = menu.querySelector('[data-sub]'), sub = document.getElementById('mover');
  const MSG = {
    abrir: (n) => `Abriste ${n}.`,
    renombrar: (n) => `Renombrar ${n}: escribe el nombre nuevo.`,
    duplicar: (n) => `Duplicaste ${n}.`,
    eliminar: (n) => `Eliminaste ${n}.`,
    mover: (n, dest) => `Moviste ${n} a ${dest}.`,
  };
  let card = null, anchor = { x: 0, y: 0 };

  const isOpen = () => !menu.hidden;
  const items = () => [...menu.querySelectorAll('[role=menuitem]')].filter((el) => !el.closest('[hidden]') && el.getAttribute('aria-disabled') !== 'true');
  function place(x, y) {
    const m = 8;
    menu.style.left = `${Math.max(m, Math.min(x, innerWidth - menu.offsetWidth - m))}px`;
    menu.style.top = `${Math.max(m, Math.min(y, innerHeight - menu.offsetHeight - m))}px`;
  }
  function setSub(open) {
    sub.hidden = !open;
    trigger.setAttribute('aria-expanded', String(open));
    place(anchor.x, anchor.y);
  }
  function openMenu(x, y, target) {
    card = target;
    anchor = { x, y };
    menu.hidden = false;
    setSub(false);
    items()[0].focus();
  }
  function close(devolver = menu.contains(document.activeElement)) {
    menu.hidden = true;
    if (devolver) card.focus();
  }
  function act(item) {
    const name = card.dataset.name;
    log.textContent = MSG[item.dataset.act](name, item.dataset.dest);
    close();
  }

  files.addEventListener('contextmenu', (e) => {
    const target = e.target.closest('.card');
    if (!target) return;
    e.preventDefault();
    openMenu(e.clientX, e.clientY, target);
  });
  files.addEventListener('keydown', (e) => {
    const target = e.target.closest('.card');
    if (!target || !(e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) return;
    e.preventDefault();
    const r = target.getBoundingClientRect();
    openMenu(r.left + 24, r.bottom - 8, target);
  });
  menu.addEventListener('keydown', (e) => {
    const list = items(), i = list.indexOf(document.activeElement), n = list.length;
    const onTrigger = document.activeElement === trigger, inSub = sub.contains(document.activeElement);
    if (e.key === 'ArrowRight' && onTrigger) {
      e.preventDefault();
      setSub(true);
      items()[i + 1].focus();
      return;
    }
    if (e.key === 'ArrowLeft' && inSub) {
      e.preventDefault();
      setSub(false);
      trigger.focus();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (inSub) {
        setSub(false);
        trigger.focus();
      } else close();
      return;
    }
    if (e.key === 'Tab') return close();
    const destino = { ArrowDown: list[(i + 1) % n], ArrowUp: list[(i - 1 + n) % n], Home: list[0], End: list[n - 1] }[e.key];
    if (destino) {
      e.preventDefault();
      destino.focus();
    }
  });
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[role=menuitem]');
    if (!item || item.getAttribute('aria-disabled') === 'true') return;
    if (item === trigger) {
      setSub(sub.hidden);
      return;
    }
    act(item);
  });
  document.addEventListener('pointerdown', (e) => {
    if (isOpen() && !menu.contains(e.target)) close(false);
  });
  document.addEventListener('scroll', () => isOpen() && close(), { capture: true, passive: true });
</script>
</body>
</html>
