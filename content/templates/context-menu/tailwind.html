<p class="mt-3 max-w-[420px] text-[13px] text-muted">Clic derecho, Mayús+F10 o la tecla Menú sobre un archivo abre sus acciones.</p>
<p id="log" role="status" aria-live="polite" class="mt-3 max-w-[420px] font-semibold">Aún no has elegido ninguna acción.</p>
<div id="menu" role="menu" aria-label="Acciones del archivo" hidden class="fixed z-20 min-w-[220px] rounded-lg border border-line bg-surface p-1.5 shadow-sm">
  <button type="button" role="menuitem" tabindex="-1" data-act="abrir" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Abrir</button>
  <button type="button" role="menuitem" tabindex="-1" data-act="renombrar" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Renombrar</button>
  <button type="button" role="menuitem" tabindex="-1" data-act="duplicar" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Duplicar</button>
  <button type="button" role="menuitem" tabindex="-1" aria-disabled="true" class="flex h-[34px] w-full cursor-not-allowed items-center justify-between gap-2.5 rounded-md px-2.5 text-left text-muted focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Compartir (próximamente)</button>
  <hr role="separator" class="mx-1 my-1.5 border-0 border-t border-line">
  <button type="button" role="menuitem" tabindex="-1" aria-haspopup="menu" aria-expanded="false" aria-controls="mover" data-sub class="group flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Mover a<svg class="h-3.5 w-3.5 flex-none fill-none stroke-current stroke-2 text-muted transition-transform group-aria-expanded:rotate-90 motion-reduce:transition-none [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
  <div id="mover" role="group" aria-label="Mover a" hidden class="pl-3">
    <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Documentos" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Documentos</button>
    <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Descargas" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Descargas</button>
    <button type="button" role="menuitem" tabindex="-1" data-act="mover" data-dest="Proyectos" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left hover:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Proyectos</button>
  </div>
  <hr role="separator" class="mx-1 my-1.5 border-0 border-t border-line">
  <button type="button" role="menuitem" tabindex="-1" data-act="eliminar" class="flex h-[34px] w-full items-center justify-between gap-2.5 rounded-md px-2.5 text-left text-err hover:bg-err-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Eliminar</button>
</div>
<script>
  const files = document.getElementById('files'), menu = document.getElementById('menu'), log = document.getElementById('log');
  const trigger = menu.querySelector('[data-sub]'), sub = document.getElementById('mover');
  const MSG = {
    abrir: (n) => `Abriste ${n}.`,
    renombrar: (n) => `Renombrar ${n}: escribe el nombre nuevo.`,
    duplicar: (n) => `Duplicaste ${n}.`,
    eliminar: (n) => `Eliminaste ${n}.`,
    mover: (n, dest) => `Moviste ${n} a ${dest}.`,
  };
  let card = null, anchor = { x: 0, y: 0 };

  const isOpen = () => !menu.hidden;
  const items = () => [...menu.querySelectorAll('[role=menuitem]')].filter((el) => !el.closest('[hidden]') && el.getAttribute('aria-disabled') !== 'true');
  function place(x, y) {
    const m = 8;
    menu.style.left = `${Math.max(m, Math.min(x, innerWidth - menu.offsetWidth - m))}px`;
    menu.style.top = `${Math.max(m, Math.min(y, innerHeight - menu.offsetHeight - m))}px`;
  }
  function setSub(open) {
    sub.hidden = !open;
    trigger.setAttribute('aria-expanded', String(open));
    place(anchor.x, anchor.y);
  }
  function openMenu(x, y, target) {
    card = target;
    anchor = { x, y };
    menu.hidden = false;
    setSub(false);
    items()[0].focus();
  }
  function close(devolver = menu.contains(document.activeElement)) {
    menu.hidden = true;
    if (devolver) card.focus();
  }
  function act(item) {
    const name = card.dataset.name;
    log.textContent = MSG[item.dataset.act](name, item.dataset.dest);
    close();
  }

  files.addEventListener('contextmenu', (e) => {
    const target = e.target.closest('article');
    if (!target) return;
    e.preventDefault();
    openMenu(e.clientX, e.clientY, target);
  });
  files.addEventListener('keydown', (e) => {
    const target = e.target.closest('article');
    if (!target || !(e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10'))) return;
    e.preventDefault();
    const r = target.getBoundingClientRect();
    openMenu(r.left + 24, r.bottom - 8, target);
  });
  menu.addEventListener('keydown', (e) => {
    const list = items(), i = list.indexOf(document.activeElement), n = list.length;
    const onTrigger = document.activeElement === trigger, inSub = sub.contains(document.activeElement);
    if (e.key === 'ArrowRight' && onTrigger) {
      e.preventDefault();
      setSub(true);
      items()[i + 1].focus();
      return;
    }
    if (e.key === 'ArrowLeft' && inSub) {
      e.preventDefault();
      setSub(false);
      trigger.focus();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (inSub) {
        setSub(false);
        trigger.focus();
      } else close();
      return;
    }
    if (e.key === 'Tab') return close();
    const destino = { ArrowDown: list[(i + 1) % n], ArrowUp: list[(i - 1 + n) % n], Home: list[0], End: list[n - 1] }[e.key];
    if (destino) {
      e.preventDefault();
      destino.focus();
    }
  });
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('[role=menuitem]');
    if (!item || item.getAttribute('aria-disabled') === 'true') return;
    if (item === trigger) {
      setSub(sub.hidden);
      return;
    }
    act(item);
  });
  document.addEventListener('pointerdown', (e) => {
    if (isOpen() && !menu.contains(e.target)) close(false);
  });
  document.addEventListener('scroll', () => isOpen() && close(), { capture: true, passive: true });
</script>
