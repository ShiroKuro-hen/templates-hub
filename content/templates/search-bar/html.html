<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { display:flex; flex-direction:column; gap:8px; margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .box { position:relative; flex:none; }
  .box::after { content:""; position:absolute; left:10px; right:10px; bottom:0; height:2px; border-radius:2px; background:linear-gradient(135deg,#22d3ee,#2f5bff); opacity:0; transition:opacity .14s; pointer-events:none; }
  .box:focus-within::after { opacity:1; }
  .box > svg { position:absolute; left:12px; top:50%; width:18px; height:18px; transform:translateY(-50%); fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; pointer-events:none; }
  input { width:100%; height:42px; padding:0 44px 0 40px; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); appearance:none; transition:border-color .14s; }
  input::-webkit-search-cancel-button { display:none; }
  input::placeholder { color:var(--muted); }
  input:focus-visible, .clear:focus-visible, ul:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .clear { position:absolute; right:6px; top:50%; display:grid; place-items:center; width:28px; height:28px; padding:0; transform:translateY(-50%); color:var(--muted); background:var(--accent-soft); border:0; border-radius:var(--radius); cursor:pointer; transition:color .14s; }
  .clear:hover { color:var(--text); }
  .clear svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; }
  #n { flex:none; margin:0; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  ul { flex:1; min-height:0; margin:0; padding:0; overflow:auto; list-style:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  li { display:flex; justify-content:space-between; gap:8px; padding:9px 14px; border-bottom:1px solid var(--border); }
  li:last-child { border-bottom:0; }
  li span { color:var(--muted); font-size:13px; }
  mark { color:var(--accent); background:var(--accent-soft); font-weight:600; border-radius:3px; }
  .empty { display:block; padding:16px 14px; color:var(--muted); }
  @media (prefers-reduced-motion:reduce) { *, *::after { transition:none !important; } }
</style>
</head>
<body>
  <form class="box" role="search" onsubmit="return false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Busca un país o una capital" aria-label="Buscar países" autocomplete="off">
    <button type="button" class="clear" id="x" aria-label="Limpiar búsqueda" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </form>
  <p id="n" role="status"></p>
  <ul id="list" tabindex="0" aria-label="Resultados"></ul>
<script>
  const DATA = [['Argentina','Buenos Aires'],['Bolivia','Sucre'],['Chile','Santiago'],['Colombia','Bogotá'],['Costa Rica','San José'],['Cuba','La Habana'],['Ecuador','Quito'],['El Salvador','San Salvador'],['España','Madrid'],['Guatemala','Ciudad de Guatemala'],['Honduras','Tegucigalpa'],['México','Ciudad de México'],['Panamá','Ciudad de Panamá'],['Paraguay','Asunción'],['Perú','Lima'],['Uruguay','Montevideo']];
  const q = document.getElementById('q'), x = document.getElementById('x'), list = document.getElementById('list'), n = document.getElementById('n');
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function mark(text, term) {
    const frag = document.createDocumentFragment(), i = term ? norm(text).indexOf(term) : -1;
    if (i < 0) { frag.append(text); return frag; }
    const m = document.createElement('mark'); m.textContent = text.slice(i, i + term.length);
    frag.append(text.slice(0, i), m, text.slice(i + term.length)); return frag;
  }
  function render() {
    const term = norm(q.value.trim()), rows = DATA.filter(([a, b]) => norm(a + ' ' + b).includes(term));
    x.hidden = !q.value; list.replaceChildren();
    rows.forEach(([a, b]) => { const li = document.createElement('li'), s = document.createElement('span'); s.append(mark(b, term)); li.append(mark(a, term), s); list.append(li); });
    if (!rows.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = `Sin resultados para «${q.value.trim()}». Prueba con otra palabra.`; list.append(li); }
    n.textContent = rows.length === 1 ? '1 resultado' : `${rows.length} resultados`;
  }
  q.addEventListener('input', render);
  q.addEventListener('keydown', (e) => { if (e.key === 'Escape' && q.value) { e.preventDefault(); q.value = ''; render(); } });
  x.addEventListener('click', () => { q.value = ''; render(); q.focus(); });
  render();
</script>
</body>
</html>
