<div class="flex flex-col gap-2 p-1 text-slate-900 dark:text-slate-100">
  <form role="search" onsubmit="return false" class="relative">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="pointer-events-none absolute top-1/2 left-3 h-[18px] w-[18px] -translate-y-1/2 fill-none stroke-slate-500 stroke-2 [stroke-linecap:round] dark:stroke-slate-400"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Busca un país" aria-label="Buscar países" autocomplete="off"
      class="h-[42px] w-full appearance-none rounded-lg border border-slate-200 bg-white pr-11 pl-10 shadow-sm placeholder:text-slate-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:placeholder:text-slate-400 [&::-webkit-search-cancel-button]:hidden">
    <button type="button" id="x" aria-label="Limpiar búsqueda" hidden
      class="absolute top-1/2 right-1.5 grid h-7 w-7 -translate-y-1/2 place-items-center rounded-lg bg-slate-100 text-slate-500 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-slate-800 dark:text-slate-400 dark:hover:text-slate-100">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="h-3 w-3 fill-none stroke-current stroke-[2.5] [stroke-linecap:round]"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </form>
  <p id="n" role="status" class="text-xs text-slate-500 tabular-nums dark:text-slate-400"></p>
  <ul id="list" class="max-h-48 divide-y divide-slate-200 overflow-auto rounded-lg border border-slate-200 bg-white shadow-sm dark:divide-slate-700 dark:border-slate-700 dark:bg-slate-900"></ul>
</div>
<script>
  const DATA = ['Argentina', 'Bolivia', 'Chile', 'Colombia', 'Ecuador', 'España', 'México', 'Panamá', 'Perú', 'Uruguay'];
  const q = document.getElementById('q'), x = document.getElementById('x'), list = document.getElementById('list');
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function render() {
    const rows = DATA.filter((d) => norm(d).includes(norm(q.value.trim())));
    x.hidden = !q.value;
    list.innerHTML = rows.map((d) => `<li class="px-3.5 py-2">${d}</li>`).join('') || '<li class="px-3.5 py-4 text-slate-500 dark:text-slate-400">Sin resultados. Prueba con otra palabra.</li>';
    document.getElementById('n').textContent = rows.length + (rows.length === 1 ? ' resultado' : ' resultados');
  }
  q.addEventListener('input', render);
  q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { q.value = ''; render(); } });
  x.addEventListener('click', () => { q.value = ''; render(); q.focus(); });
  render();
</script>
