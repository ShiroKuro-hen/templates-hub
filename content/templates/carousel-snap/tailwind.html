<section aria-roledescription="carrusel" aria-label="Rutas destacadas" class="p-5 text-sm text-slate-900 dark:text-slate-100">
  <div class="mb-3 flex items-center justify-between gap-3">
    <h1 class="m-0 text-xl font-semibold tracking-tight">Rutas destacadas</h1>
    <div class="flex items-center gap-2">
      <button type="button" id="prev" aria-label="Anterior"
        class="grid size-9 cursor-pointer place-items-center rounded-lg border border-slate-200 bg-white text-lg hover:border-blue-600 hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-700 dark:bg-slate-900 dark:hover:border-blue-500 dark:hover:bg-slate-800 dark:hover:text-blue-400">‹</button>
      <span id="count" aria-live="polite" class="min-w-[3.2em] text-center text-[13px] font-semibold tabular-nums text-slate-500 dark:text-slate-400">1 / 3</span>
      <button type="button" id="next" aria-label="Siguiente"
        class="grid size-9 cursor-pointer place-items-center rounded-lg border border-slate-200 bg-white text-lg hover:border-blue-600 hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-700 dark:bg-slate-900 dark:hover:border-blue-500 dark:hover:bg-slate-800 dark:hover:text-blue-400">›</button>
    </div>
  </div>
  <ul id="track" tabindex="0" aria-label="Diapositivas, desplázate con las flechas"
    class="m-0 flex list-none snap-x snap-mandatory gap-3.5 overflow-x-auto p-1 pb-4 motion-safe:scroll-smooth focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <div class="grid h-24 place-items-center bg-blue-50 text-[40px] font-bold leading-none tracking-tighter tabular-nums text-blue-700 dark:bg-slate-800 dark:text-blue-400">9 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Cerros de Lima</h2><p class="m-0 text-slate-500 dark:text-slate-400">Sendero suave, 2 h.</p></div>
    </li>
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <div class="grid h-24 place-items-center bg-cyan-100 text-[40px] font-bold leading-none tracking-tighter tabular-nums text-cyan-700 dark:bg-cyan-950 dark:text-cyan-400">14 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Valle Sagrado</h2><p class="m-0 text-slate-500 dark:text-slate-400">Ruta mixta, 5 h.</p></div>
    </li>
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <div class="grid h-24 place-items-center bg-emerald-100 text-[40px] font-bold leading-none tracking-tighter tabular-nums text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400">6 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Laguna Churup</h2><p class="m-0 text-slate-500 dark:text-slate-400">Subida corta, 3 h.</p></div>
    </li>
  </ul>
</section>
<script>
  const track = document.getElementById('track'), prev = document.getElementById('prev'),
        next = document.getElementById('next'), count = document.getElementById('count');
  const slides = [...track.children];
  const step = () => slides[1].offsetLeft - slides[0].offsetLeft;
  function update() {
    const end = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
    count.textContent = `${(end ? slides.length - 1 : Math.round(track.scrollLeft / step())) + 1} / ${slides.length}`;
    prev.disabled = track.scrollLeft <= 2;
    next.disabled = end;
  }
  prev.onclick = () => track.scrollBy({ left: -step() });
  next.onclick = () => track.scrollBy({ left: step() });
  track.addEventListener('scroll', update, { passive: true });
  update();
</script>
