<section aria-roledescription="carrusel" aria-label="Rutas destacadas" class="p-5 text-sm text-fg">
  <div class="mb-3 flex items-center justify-between gap-3">
    <h1 class="m-0 text-xl font-semibold tracking-tight">Rutas destacadas</h1>
    <div class="flex items-center gap-2">
      <button type="button" id="prev" aria-label="Anterior"
        class="grid size-9 cursor-pointer place-items-center rounded-lg border border-line bg-surface text-lg hover:border-accent hover:bg-accent-soft hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40">‹</button>
      <span id="count" aria-live="polite" class="min-w-[3.2em] text-center text-[13px] font-semibold tabular-nums text-muted">1 / 3</span>
      <button type="button" id="next" aria-label="Siguiente"
        class="grid size-9 cursor-pointer place-items-center rounded-lg border border-line bg-surface text-lg hover:border-accent hover:bg-accent-soft hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40">›</button>
    </div>
  </div>
  <ul id="track" tabindex="0" aria-label="Diapositivas, desplázate con las flechas"
    class="m-0 flex list-none snap-x snap-mandatory gap-3.5 overflow-x-auto p-1 pb-4 motion-safe:scroll-smooth focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
      <div class="grid h-24 place-items-center bg-accent-soft text-[40px] font-bold leading-none tracking-tighter tabular-nums text-accent">9 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Cerros de Lima</h2><p class="m-0 text-muted">Sendero suave, 2 h.</p></div>
    </li>
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
      <div class="grid h-24 place-items-center bg-info-soft text-[40px] font-bold leading-none tracking-tighter tabular-nums text-info">14 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Valle Sagrado</h2><p class="m-0 text-muted">Ruta mixta, 5 h.</p></div>
    </li>
    <li aria-roledescription="diapositiva" class="flex w-[min(78%,260px)] flex-none snap-start flex-col overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
      <div class="grid h-24 place-items-center bg-ok-soft text-[40px] font-bold leading-none tracking-tighter tabular-nums text-ok">6 km</div>
      <div class="px-4 pb-4 pt-3"><h2 class="m-0 mb-0.5 text-base font-semibold">Laguna Churup</h2><p class="m-0 text-muted">Subida corta, 3 h.</p></div>
    </li>
  </ul>
</section>
<script>
  const track = document.getElementById('track'), prev = document.getElementById('prev'),
        next = document.getElementById('next'), count = document.getElementById('count');
  const slides = [...track.children];
  const step = () => slides[1].offsetLeft - slides[0].offsetLeft;
  function update() {
    const end = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
    count.textContent = `${(end ? slides.length - 1 : Math.round(track.scrollLeft / step())) + 1} / ${slides.length}`;
    prev.disabled = track.scrollLeft <= 2;
    next.disabled = end;
  }
  prev.onclick = () => track.scrollBy({ left: -step() });
  next.onclick = () => track.scrollBy({ left: step() });
  track.addEventListener('scroll', update, { passive: true });
  update();
</script>
