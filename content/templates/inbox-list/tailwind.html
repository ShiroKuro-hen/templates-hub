<section aria-labelledby="h" class="mx-auto max-w-2xl overflow-hidden rounded-lg border border-line bg-surface text-sm text-fg shadow-sm">
  <div class="flex items-center gap-3 border-b border-line px-4 py-2.5"><h2 id="h" class="text-base font-semibold">Bandeja de entrada</h2><span id="un" class="rounded-full bg-accent-soft px-2 text-xs tabular-nums text-accent"></span></div>
  <div role="toolbar" aria-label="Acciones de la selección" class="flex flex-wrap items-center gap-x-2 gap-y-1 border-b border-line px-4 py-2 text-muted [&_button]:rounded-lg [&_button]:border [&_button]:border-line [&_button]:bg-surface [&_button]:px-2.5 [&_button]:py-1 [&_button]:text-fg [&_button:hover:not(:disabled)]:bg-accent-soft [&_button:disabled]:cursor-not-allowed [&_button:disabled]:opacity-60">
    <label class="mr-auto flex items-center gap-2"><input type="checkbox" id="all" class="size-4 accent-accent"><span id="cnt"></span></label>
    <button type="button" data-a="read">Marcar como leído</button>
    <button type="button" data-a="unread">Marcar como no leído</button>
    <button type="button" data-a="archive">Archivar</button>
  </div>
  <ul id="list" class="[&>li]:flex [&>li]:items-center [&>li]:gap-3 [&>li]:border-b [&>li]:border-line [&>li]:px-4 [&>li:hover]:bg-accent-soft [&>li:has(input:checked)]:bg-accent-soft [&>li:last-child]:border-0">
    <li class="group" data-unread><input type="checkbox" class="size-4 accent-accent" aria-label="Seleccionar mensaje de Lucía Ortega"><button type="button" class="open grid min-w-0 flex-1 grid-cols-[1fr_auto] gap-x-3 py-2.5 text-left focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"><span class="who truncate group-data-[unread]:font-bold before:mr-2 before:hidden before:size-2 before:rounded-full before:bg-gradient-to-br before:from-accent-2 before:to-accent group-data-[unread]:before:inline-block"><span class="sr-only">No leído. </span>Lucía Ortega</span><time class="text-xs tabular-nums text-muted">09:41</time><span class="sub col-span-full truncate text-muted group-data-[unread]:text-fg [&_b]:font-medium group-data-[unread]:[&_b]:font-bold"><b>Informe de incidencias de septiembre</b> - Adjunto el resumen con los tiempos.</span></button></li>
    <li class="group" data-unread><input type="checkbox" class="size-4 accent-accent" aria-label="Seleccionar mensaje de Soporte Nimbus"><button type="button" class="open grid min-w-0 flex-1 grid-cols-[1fr_auto] gap-x-3 py-2.5 text-left focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"><span class="who truncate group-data-[unread]:font-bold before:mr-2 before:hidden before:size-2 before:rounded-full before:bg-gradient-to-br before:from-accent-2 before:to-accent group-data-[unread]:before:inline-block"><span class="sr-only">No leído. </span>Soporte Nimbus</span><time class="text-xs tabular-nums text-muted">08:15</time><span class="sub col-span-full truncate text-muted group-data-[unread]:text-fg [&_b]:font-medium group-data-[unread]:[&_b]:font-bold"><b>Tu ticket 4821 está resuelto</b> - Confirma si el acceso funciona.</span></button></li>
    <li class="group"><input type="checkbox" class="size-4 accent-accent" aria-label="Seleccionar mensaje de Gonzalo Paredes"><button type="button" class="open grid min-w-0 flex-1 grid-cols-[1fr_auto] gap-x-3 py-2.5 text-left focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"><span class="who truncate group-data-[unread]:font-bold before:mr-2 before:hidden before:size-2 before:rounded-full before:bg-gradient-to-br before:from-accent-2 before:to-accent group-data-[unread]:before:inline-block">Gonzalo Paredes</span><time class="text-xs tabular-nums text-muted">Ayer</time><span class="sub col-span-full truncate text-muted group-data-[unread]:text-fg [&_b]:font-medium group-data-[unread]:[&_b]:font-bold"><b>Agenda del comité del jueves</b> - Faltan dos puntos por confirmar.</span></button></li>
  </ul>
  <p id="empty" hidden class="px-4 py-8 text-center text-muted"><b class="block text-fg">No quedan mensajes por revisar</b>Los mensajes nuevos aparecerán aquí.</p>
</section>
<script>
  const list = document.getElementById('list'), all = document.getElementById('all'), cnt = document.getElementById('cnt');
  const un = document.getElementById('un'), empty = document.getElementById('empty'), tools = document.querySelectorAll('[data-a]');
  const rows = () => [...list.children], picked = () => rows().filter((r) => r.querySelector('input').checked);
  function sync() {
    const s = picked().length, n = rows().length;
    all.checked = n > 0 && s === n; all.indeterminate = s > 0 && s < n;
    cnt.textContent = s ? s + (s === 1 ? ' seleccionado' : ' seleccionados') : 'Seleccionar todo';
    un.textContent = rows().filter((r) => r.hasAttribute('data-unread')).length + ' sin leer'; empty.hidden = n > 0;
    tools.forEach((b) => (b.disabled = !s));
  }
  list.addEventListener('change', sync);
  list.addEventListener('click', (e) => { const b = e.target.closest('.open'); if (b) { b.parentElement.removeAttribute('data-unread'); sync(); } });
  all.addEventListener('change', () => { rows().forEach((r) => (r.querySelector('input').checked = all.checked)); sync(); });
  document.querySelector('[role=toolbar]').addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
    picked().forEach((r) => { if (a === 'archive') r.remove(); else { r.toggleAttribute('data-unread', a === 'unread'); r.querySelector('input').checked = false; } });
    sync();
  });
  sync();
</script>
