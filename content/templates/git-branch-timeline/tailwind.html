<figure class="mx-auto max-w-[620px] rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <figcaption>
    <h2 class="m-0 text-base font-semibold">Ramas y fusiones</h2>
    <p class="mt-0.5 mb-3 text-muted">Cada línea es una rama. Pasa el cursor o enfoca un commit para ver su detalle y resaltar su rama.</p>
  </figcaption>
  <div class="scroll overflow-x-auto" role="region" tabindex="0" aria-label="Grafo de commits desplazable horizontalmente">
    <svg id="graph" class="block h-auto w-full min-w-[514px]" viewBox="0 0 560 480" role="img" aria-labelledby="g-t g-d">
      <title id="g-t">Grafo de commits con main y dos ramas</title>
      <desc id="g-d">La rama main recibe la fusión de feature/pagos. feature/login sale de main y aún no está fusionada. Cada commit muestra su hash, su mensaje, su autor y la fecha relativa.</desc>
      <path class="lane" data-branch="main" d="M40 50V442"/>
      <path class="lane" data-branch="pagos" d="M40 50C40 78 140 78 140 106V162C140 190 40 190 40 218"/>
      <path class="lane" data-branch="login" d="M40 386C40 358 90 358 90 330V274"/>
      <g class="commit" tabindex="0" role="group" aria-label="e41d0a2 Fusiona feature/pagos en main, Lucía Ruiz, hace 1 día" data-branch="main">
        <rect class="row" x="10" y="24" width="540" height="52" rx="6"/>
        <circle class="dot" cx="40" cy="50" r="6"/>
        <text x="170" y="45"><tspan class="hash">e41d0a2</tspan><tspan dx="8">Fusiona feature/pagos en main</tspan></text>
        <text class="meta" x="170" y="63">Lucía Ruiz · hace 1 día</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="9c7f3b1 Añade reintentos al cobro, Mateo Ortiz, hace 2 días" data-branch="pagos">
        <rect class="row" x="10" y="80" width="540" height="52" rx="6"/>
        <circle class="dot" cx="140" cy="106" r="6"/>
        <text x="170" y="101"><tspan class="hash">9c7f3b1</tspan><tspan dx="8">Añade reintentos al cobro</tspan></text>
        <text class="meta" x="170" y="119">Mateo Ortiz · hace 2 días</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="5b2e8d4 Integra la pasarela de pago, Mateo Ortiz, hace 3 días" data-branch="pagos">
        <rect class="row" x="10" y="136" width="540" height="52" rx="6"/>
        <circle class="dot" cx="140" cy="162" r="6"/>
        <text x="170" y="157"><tspan class="hash">5b2e8d4</tspan><tspan dx="8">Integra la pasarela de pago</tspan></text>
        <text class="meta" x="170" y="175">Mateo Ortiz · hace 3 días</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="3f8a6c2 Corrige el redondeo de totales, Ana Gil, hace 4 días" data-branch="main">
        <rect class="row" x="10" y="192" width="540" height="52" rx="6"/>
        <circle class="dot" cx="40" cy="218" r="6"/>
        <text x="170" y="213"><tspan class="hash">3f8a6c2</tspan><tspan dx="8">Corrige el redondeo de totales</tspan></text>
        <text class="meta" x="170" y="231">Ana Gil · hace 4 días</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="d62b9e1 Pantalla de inicio de sesión, Ana Gil, hace 5 días" data-branch="login">
        <rect class="row" x="10" y="248" width="540" height="52" rx="6"/>
        <circle class="dot" cx="90" cy="274" r="6"/>
        <text x="170" y="269"><tspan class="hash">d62b9e1</tspan><tspan dx="8">Pantalla de inicio de sesión</tspan></text>
        <text class="meta" x="170" y="287">Ana Gil · hace 5 días</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="b1d4e77 Valida el formato del correo, Carlos Pérez, hace 6 días" data-branch="login">
        <rect class="row" x="10" y="304" width="540" height="52" rx="6"/>
        <circle class="dot" cx="90" cy="330" r="6"/>
        <text x="170" y="325"><tspan class="hash">b1d4e77</tspan><tspan dx="8">Valida el formato del correo</tspan></text>
        <text class="meta" x="170" y="343">Carlos Pérez · hace 6 días</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="7c02a9e Añade CI con pruebas, Lucía Ruiz, hace 1 semana" data-branch="main">
        <rect class="row" x="10" y="360" width="540" height="52" rx="6"/>
        <circle class="dot" cx="40" cy="386" r="6"/>
        <text x="170" y="381"><tspan class="hash">7c02a9e</tspan><tspan dx="8">Añade CI con pruebas</tspan></text>
        <text class="meta" x="170" y="399">Lucía Ruiz · hace 1 semana</text>
      </g>
      <g class="commit" tabindex="0" role="group" aria-label="a0f13c5 Versión 2.3.0, Lucía Ruiz, hace 2 semanas" data-branch="main">
        <rect class="row" x="10" y="416" width="540" height="52" rx="6"/>
        <circle class="dot" cx="40" cy="442" r="6"/>
        <text x="170" y="437"><tspan class="hash">a0f13c5</tspan><tspan dx="8">Versión 2.3.0</tspan></text>
        <text class="meta" x="170" y="455">Lucía Ruiz · hace 2 semanas</text>
      </g>
    </svg>
  </div>
  <p class="panel mt-3 min-h-[3.2em] border-t border-line pt-2.5 text-[13px]" aria-live="polite"><strong id="pm" class="block font-semibold text-fg">Ningún commit seleccionado</strong><span id="pd" class="block text-muted">Pasa el cursor o enfoca un commit para ver su detalle.</span></p>
  <ul class="m-0 mt-3 flex list-none flex-wrap gap-x-4 gap-y-1.5 p-0 text-[13px] text-muted" aria-label="Leyenda de ramas">
    <li class="flex items-center gap-1.5"><i class="size-2.5 rounded-[3px] bg-accent"></i>main</li>
    <li class="flex items-center gap-1.5"><i class="size-2.5 rounded-[3px] bg-ok"></i>feature/login</li>
    <li class="flex items-center gap-1.5"><i class="size-2.5 rounded-[3px] bg-warn"></i>feature/pagos</li>
  </ul>
</figure>
<style>
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  text{font-size:13px;line-height:1;fill:var(--text)}
  [data-branch=main]{--c:var(--accent)}
  [data-branch=pagos]{--c:var(--warn)}
  [data-branch=login]{--c:var(--ok)}
  .hash{font:600 12px ui-monospace,Consolas,monospace}
  .meta{font-size:12px;fill:var(--muted)}
  .lane{fill:none;stroke:var(--c);stroke-width:3;transition:opacity .15s,stroke-width .15s}
  .dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
  .row{fill:transparent}
  .commit{outline:none}
  .commit.on .row{stroke:var(--accent);stroke-width:2}
  svg.active .lane:not(.on){opacity:.3}
  svg.active .lane.on{stroke-width:5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
  const svg = document.getElementById('graph'), pm = document.getElementById('pm'), pd = document.getElementById('pd');
  const [titulo, detalle] = [pm.textContent, pd.textContent];
  const lanes = svg.querySelectorAll('.lane'), commits = svg.querySelectorAll('.commit');
  const etiqueta = { main: 'main', pagos: 'feature/pagos', login: 'feature/login' };
  const mensajeDe = (commit) => commit.querySelector('tspan:not(.hash)').textContent;
  const infoDe = (commit) => `${commit.querySelector('.hash').textContent} · ${commit.querySelector('.meta').textContent} · rama ${etiqueta[commit.dataset.branch]}`;
  const show = (commit) => {
    const rama = commit?.dataset.branch;
    svg.classList.toggle('active', Boolean(commit));
    lanes.forEach((l) => l.classList.toggle('on', l.dataset.branch === rama));
    commits.forEach((c) => c.classList.toggle('on', c === commit));
    pm.textContent = commit ? mensajeDe(commit) : titulo;
    pd.textContent = commit ? infoDe(commit) : detalle;
  };
  const commitOf = (e) => e.target.closest('.commit');
  svg.addEventListener('pointerover', (e) => show(commitOf(e)));
  svg.addEventListener('pointerleave', () => show(null));
  svg.addEventListener('focusin', (e) => show(commitOf(e)));
  svg.addEventListener('focusout', () => show(null));
</script>
