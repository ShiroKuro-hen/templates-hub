<style>
  #v{view-transition-name:view}
  ::view-transition-old(view){animation:out .2s ease both}
  ::view-transition-new(view){animation:in .24s ease both}
  @keyframes out{to{opacity:0;transform:translateX(calc(var(--d,1) * -24px))}}
  @keyframes in{from{opacity:0;transform:translateX(calc(var(--d,1) * 24px))}}
  @media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
<div class="mx-auto max-w-[560px] text-sm text-fg">
  <nav id="tabs" aria-label="Vistas" class="mb-3 flex gap-1 border-b border-line">
    <button type="button" class="tab relative rounded-t-lg px-3.5 py-2 font-semibold text-muted transition-colors hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-[current=page]:text-fg after:absolute after:inset-x-2.5 after:-bottom-px after:h-0.5 after:bg-gradient-to-br after:from-accent-2 after:to-accent after:opacity-0 aria-[current=page]:after:opacity-100 motion-reduce:transition-none">Resumen</button>
    <button type="button" class="tab relative rounded-t-lg px-3.5 py-2 font-semibold text-muted transition-colors hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-[current=page]:text-fg after:absolute after:inset-x-2.5 after:-bottom-px after:h-0.5 after:bg-gradient-to-br after:from-accent-2 after:to-accent after:opacity-0 aria-[current=page]:after:opacity-100 motion-reduce:transition-none">Proyectos</button>
    <button type="button" class="tab relative rounded-t-lg px-3.5 py-2 font-semibold text-muted transition-colors hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-[current=page]:text-fg after:absolute after:inset-x-2.5 after:-bottom-px after:h-0.5 after:bg-gradient-to-br after:from-accent-2 after:to-accent after:opacity-0 aria-[current=page]:after:opacity-100 motion-reduce:transition-none">Ajustes</button>
  </nav>
  <main id="v" aria-live="polite" class="rounded-lg border border-line bg-surface p-5 shadow-sm"></main>
  <span id="note" class="mt-3 inline-block rounded-full bg-info-soft px-2.5 py-0.5 text-xs"></span>
</div>
<script>
  const V = [
    ['Resumen del equipo', 'Actividad de las últimas 24 horas en todos tus proyectos.', [['Despliegues', '18'], ['Incidencias abiertas', '2'], ['Cobertura de pruebas', '91 %']]],
    ['Proyectos activos', 'Tres proyectos con entregas este mes.', [['Portal de clientes', 'En curso'], ['App móvil', 'En revisión'], ['API pública', 'Estable']]],
    ['Ajustes del espacio', 'Define quién puede ver y editar cada proyecto.', [['Miembros', '12'], ['Roles personalizados', '3'], ['Verificación en dos pasos', 'Activa']]],
  ];
  const v = document.getElementById('v'), tabs = [...document.querySelectorAll('.tab')];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, native = 'startViewTransition' in document;
  let cur = 0;
  function render(k) {
    const [t, p, rows] = V[k];
    v.innerHTML = `<h2 class="text-base font-semibold">${t}</h2><p class="mb-3.5 mt-1 text-muted">${p}</p>` +
      rows.map(([a, b]) => `<div class="flex justify-between gap-3 border-t border-line py-2.5"><span class="text-muted">${a}</span><b class="tabular-nums">${b}</b></div>`).join('');
    tabs.forEach((b, j) => (j === k ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  }
  function go(k) {
    if (k === cur) return;
    const dir = k > cur ? 1 : -1, swap = () => render(k);
    cur = k;
    document.documentElement.style.setProperty('--d', dir);
    if (calm) swap();
    else if (native) document.startViewTransition(swap);
    else {
      swap();
      v.animate([{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease' });
    }
  }
  tabs.forEach((b, k) => b.addEventListener('click', () => go(k)));
  document.getElementById('note').textContent = calm ? 'Movimiento reducido: el cambio es instantáneo.'
    : native ? 'View Transitions API activa.' : 'Tu navegador no admite View Transitions: se usa un deslizamiento simple.';
  render(0);
</script>
