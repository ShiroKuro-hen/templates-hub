<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  html{--d:1} /* dirección: 1 avanza, -1 retrocede */
  .app{max-width:560px;margin:0 auto}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border)}
  .tab{position:relative;padding:9px 14px;background:none;border:0;border-radius:var(--radius) var(--radius) 0 0;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;transition:color .14s}
  .tab:hover,.tab[aria-current]{color:var(--text)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:linear-gradient(135deg,#22d3ee,#2f5bff);opacity:0}
  .tab[aria-current]::after{opacity:1}
  .view{view-transition-name:view;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0;font-size:16px;font-weight:600}
  .view p{margin:4px 0 14px;color:var(--muted)}
  .rows{margin:0}
  .rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  dt{color:var(--muted)}
  dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
  .note{display:inline-block;margin:12px 0 0;padding:2px 10px;background:var(--info-soft);border-radius:999px;font-size:12px}
  ::view-transition-old(view){animation:out .2s ease both}
  ::view-transition-new(view){animation:in .24s ease both}
  @keyframes out{to{opacity:0;transform:translateX(calc(var(--d) * -24px))}}
  @keyframes in{from{opacity:0;transform:translateX(calc(var(--d) * 24px))}}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="Vistas">
    <button class="tab" type="button">Resumen</button>
    <button class="tab" type="button">Proyectos</button>
    <button class="tab" type="button">Ajustes</button>
  </nav>
  <main class="view" id="v" aria-live="polite"></main>
  <span class="note" id="note"></span>
</div>
<script>
  const V = [
    ['Resumen del equipo', 'Actividad de las últimas 24 horas en todos tus proyectos.', [['Despliegues', '18'], ['Incidencias abiertas', '2'], ['Cobertura de pruebas', '91 %']]],
    ['Proyectos activos', 'Tres proyectos con entregas este mes.', [['Portal de clientes', 'En curso'], ['App móvil', 'En revisión'], ['API pública', 'Estable']]],
    ['Ajustes del espacio', 'Define quién puede ver y editar cada proyecto.', [['Miembros', '12'], ['Roles personalizados', '3'], ['Verificación en dos pasos', 'Activa']]],
  ];
  const v = document.getElementById('v'), tabs = [...document.querySelectorAll('.tab')];
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, native = 'startViewTransition' in document;
  let cur = 0;
  function render(k) {
    const [t, p, rows] = V[k];
    v.innerHTML = `<h2>${t}</h2><p>${p}</p><dl class="rows">${rows.map(([a, b]) => `<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;
    tabs.forEach((b, j) => (j === k ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  }
  function go(k) {
    if (k === cur) return;
    const dir = k > cur ? 1 : -1, swap = () => render(k);
    cur = k;
    document.documentElement.style.setProperty('--d', dir);
    if (calm) swap();                                   // alternativa estática: cambio instantáneo
    else if (native) document.startViewTransition(swap); // transición nativa entre vistas
    else {                                              // alternativa: entrada con Web Animations
      swap();
      v.animate([{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'ease' });
    }
  }
  tabs.forEach((b, k) => b.addEventListener('click', () => go(k)));
  document.getElementById('note').textContent = calm ? 'Movimiento reducido: el cambio es instantáneo.'
    : native ? 'View Transitions API activa.' : 'Tu navegador no admite View Transitions: se usa un deslizamiento simple.';
  render(0);
</script>
</body>
</html>
