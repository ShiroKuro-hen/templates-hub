<section aria-labelledby="zone-title" class="flex max-w-2xl flex-wrap items-center justify-between gap-x-6 gap-y-3 rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <div>
    <h2 id="zone-title" class="text-base font-semibold">Eliminar proyecto</h2>
    <p class="mt-1 text-muted">Borra «Web corporativa», sus archivos y su historial. No se puede deshacer.</p>
    <p id="zone-status" role="status" class="mt-1 empty:m-0"></p>
  </div>
  <button id="open" type="button" class="rounded-lg border border-err bg-err px-3.5 py-2 font-semibold text-accent-ink hover:bg-err focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-45">Eliminar proyecto</button>
</section>

<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-desc"
        class="w-[min(440px,calc(100%-32px))] rounded-lg border border-line bg-surface p-6 text-sm text-fg shadow-lg backdrop:bg-fg/50">
  <form method="dialog">
    <div aria-hidden="true" class="mb-3 grid h-10 w-10 place-items-center rounded-full bg-err-soft text-err">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
    </div>
    <h2 id="dlg-title" class="text-lg font-semibold">¿Eliminar «Web corporativa»?</h2>
    <p id="dlg-desc" class="mt-1 text-muted">Se borrarán 128 archivos y 3 integraciones. Esta acción no se puede deshacer.</p>
    <label for="confirm-in" class="mb-1.5 mt-4 block font-medium">Escribe <b>ELIMINAR</b> para confirmar</label>
    <input id="confirm-in" autocomplete="off" spellcheck="false" autocapitalize="characters"
           class="w-full rounded-lg border border-line bg-transparent px-2.5 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <div class="mt-5 flex flex-wrap justify-end gap-2">
      <button id="cancel" type="button" class="rounded-lg border border-line px-3.5 py-2 font-semibold hover:bg-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Cancelar</button>
      <button id="confirm" value="confirm" disabled class="rounded-lg border border-err bg-err px-3.5 py-2 font-semibold text-accent-ink hover:bg-err focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-45">Eliminar proyecto</button>
    </div>
  </form>
</dialog>
<script>
  const dlg = document.getElementById('dlg'), input = document.getElementById('confirm-in'),
        ok = document.getElementById('confirm'), open = document.getElementById('open'), out = document.getElementById('zone-status');
  open.addEventListener('click', () => { input.value = ''; ok.disabled = true; dlg.returnValue = ''; dlg.showModal(); });
  document.getElementById('cancel').addEventListener('click', () => dlg.close());
  input.addEventListener('input', () => { ok.disabled = input.value.trim() !== 'ELIMINAR'; });
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'confirm') return;
    out.textContent = 'Eliminaste «Web corporativa».';
    open.disabled = true;
  });
</script>
