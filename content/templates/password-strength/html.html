<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:420px;margin:0 auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  label{display:block;margin-bottom:6px;font-weight:600}
  .field{display:flex;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:border-color .14s}
  .field:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
  .field input{flex:1;min-width:0;padding:9px 12px;font:inherit;color:var(--text);background:none;border:0;outline:0}
  .toggle{font:inherit;font-weight:600;padding:0 12px;color:var(--accent);background:none;border:0;border-left:1px solid var(--border);border-radius:0 var(--radius) var(--radius) 0;cursor:pointer}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
  .meter i{height:4px;border-radius:999px;background:var(--border);transition:background .16s}
  [data-score="1"] i:nth-child(-n+1){background:var(--err)}
  [data-score="2"] i:nth-child(-n+2){background:var(--warn)}
  [data-score="3"] i:nth-child(-n+3){background:var(--accent)}
  [data-score="4"] i{background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  #level{margin:6px 0 12px;color:var(--muted)}
  #level b{color:var(--text)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  li{display:flex;align-items:center;gap:8px;color:var(--muted);transition:color .14s}
  li::before{content:"";flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--border);box-sizing:border-box;font-size:10px;font-weight:700}
  li.ok{color:var(--text)}
  li.ok::before{content:"✓" / "Cumplido: ";color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <label for="pw">Nueva contraseña</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="new-password" aria-describedby="level reqs">
    <button type="button" class="toggle" id="toggle" aria-pressed="false" aria-controls="pw">Mostrar</button>
  </div>
  <div class="meter" id="meter" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p id="level" aria-live="polite">Fortaleza: <b>sin evaluar</b></p>
  <ul id="reqs" aria-label="Requisitos">
    <li data-rule=".{8,}">Al menos 8 caracteres</li>
    <li data-rule="(?=.*[a-z])(?=.*[A-Z])">Mayúsculas y minúsculas</li>
    <li data-rule="\d">Un número</li>
    <li data-rule="[^A-Za-z0-9]">Un símbolo, como ! o #</li>
  </ul>
</div>
<script>
  const pw = document.getElementById('pw'), toggle = document.getElementById('toggle');
  const meter = document.getElementById('meter'), level = document.querySelector('#level b');
  const rules = [...document.querySelectorAll('#reqs li')];
  const NAMES = ['muy débil', 'débil', 'aceptable', 'buena', 'fuerte'];

  pw.addEventListener('input', () => {
    let score = 0;
    rules.forEach((li) => {
      const ok = new RegExp(li.dataset.rule).test(pw.value);
      li.classList.toggle('ok', ok);
      score += ok;
    });
    meter.dataset.score = score;
    level.textContent = pw.value ? NAMES[score] : 'sin evaluar';
  });
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Ocultar' : 'Mostrar';
    toggle.setAttribute('aria-pressed', show);
  });
</script>
</body>
</html>
