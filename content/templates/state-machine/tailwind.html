<figure class="mx-auto max-w-[740px] rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <figcaption>
    <h2 class="m-0 text-base font-semibold">Estados de un pedido</h2>
    <p class="mt-0.5 mb-3 text-muted">Desde el estado actual solo se ofrecen los cambios permitidos.</p>
  </figcaption>
  <div class="scroll overflow-x-auto" role="region" tabindex="0" aria-label="Diagrama de estados desplazable horizontalmente">
    <svg id="maquina" class="block h-auto w-full min-w-[642px]" viewBox="0 0 700 260" role="img" aria-labelledby="sm-t sm-d">
      <title id="sm-t">Estados de un pedido</title>
      <desc id="sm-d">Un pedido pasa de Pendiente a Pagado o a Cancelado. Pagado pasa a Enviado o a Reembolsado, Enviado pasa a Entregado y Entregado puede pasar a Reembolsado. Cancelado y Reembolsado son estados finales.</desc>
      <defs>
        <marker id="fl" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head" d="M0 0L9 5L0 10z"/></marker>
        <marker id="fl-hot" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head hot" d="M0 0L9 5L0 10z"/></marker>
      </defs>
      <path class="edge" data-t="pagar" d="M138 70H202"/>
      <path class="edge" data-t="enviar" d="M318 70H382"/>
      <path class="edge" data-t="entregar" d="M498 70H562"/>
      <path class="edge" data-t="cancelar" d="M80 92V188"/>
      <path class="edge" data-t="reembolsar" d="M260 92V210H382"/>
      <path class="edge" data-t="devolver" d="M620 92V210H498"/>
      <text class="lbl" x="170" y="60">Pagar</text>
      <text class="lbl" x="350" y="60">Enviar</text>
      <text class="lbl" x="530" y="60">Entregar</text>
      <text class="lbl left" x="92" y="144">Cancelar</text>
      <text class="lbl" x="321" y="200">Reembolsar</text>
      <text class="lbl" x="559" y="200">Devolver</text>
      <g class="state" data-state="pendiente"><rect class="box" x="22" y="48" width="116" height="44" rx="6"/><text x="80" y="70">Pendiente</text></g>
      <g class="state" data-state="pagado"><rect class="box" x="202" y="48" width="116" height="44" rx="6"/><text x="260" y="70">Pagado</text></g>
      <g class="state" data-state="enviado"><rect class="box" x="382" y="48" width="116" height="44" rx="6"/><text x="440" y="70">Enviado</text></g>
      <g class="state" data-state="entregado"><rect class="box" x="562" y="48" width="116" height="44" rx="6"/><text x="620" y="70">Entregado</text></g>
      <g class="state" data-state="cancelado"><rect class="box" x="22" y="188" width="116" height="44" rx="6"/><text x="80" y="210">Cancelado</text></g>
      <g class="state" data-state="reembolsado"><rect class="box" x="382" y="188" width="116" height="44" rx="6"/><text x="440" y="210">Reembolsado</text></g>
    </svg>
  </div>
  <p class="mt-3.5 mb-0">Estado actual: <strong id="estado" class="font-semibold text-accent">Pendiente</strong></p>
  <div class="mt-3 flex flex-wrap items-center gap-2">
    <div id="transiciones" class="flex flex-1 flex-wrap gap-2" role="group" aria-label="Transiciones disponibles"></div>
    <button type="button" id="reiniciar" class="cursor-pointer rounded-lg border border-line bg-surface px-3.5 py-2 text-sm font-semibold text-muted shadow-sm transition-colors hover:border-accent">Reiniciar</button>
  </div>
  <p id="live" class="mt-3 min-h-[3em] border-t border-line pt-2.5 text-[13px] text-muted" aria-live="polite">Pedido creado en estado Pendiente.</p>
</figure>
<style>
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  text{font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
  .lbl{font-size:12px;fill:var(--muted)}
  .lbl.left{text-anchor:start}
  .box{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
  .state.on .box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
  .state.on text{fill:var(--accent);font-weight:600}
  .edge{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#fl);transition:stroke .15s}
  .edge.taken{stroke:var(--accent);stroke-width:2.5;marker-end:url(#fl-hot)}
  .head{fill:var(--muted)}
  .head.hot{fill:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
  const TRANSICIONES = [
    { id: 'pagar', de: 'pendiente', a: 'pagado', texto: 'Pagar' },
    { id: 'cancelar', de: 'pendiente', a: 'cancelado', texto: 'Cancelar' },
    { id: 'enviar', de: 'pagado', a: 'enviado', texto: 'Enviar' },
    { id: 'reembolsar', de: 'pagado', a: 'reembolsado', texto: 'Reembolsar' },
    { id: 'entregar', de: 'enviado', a: 'entregado', texto: 'Entregar' },
    { id: 'devolver', de: 'entregado', a: 'reembolsado', texto: 'Devolver' },
  ];
  const NOMBRES = { pendiente: 'Pendiente', pagado: 'Pagado', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado', reembolsado: 'Reembolsado' };
  const svg = document.getElementById('maquina'), lista = document.getElementById('transiciones');
  const reiniciar = document.getElementById('reiniciar'), estado = document.getElementById('estado'), live = document.getElementById('live');
  let actual = 'pendiente', ultima = null;

  const boton = (t) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = t.texto;
    b.className = 'cursor-pointer rounded-lg border border-line bg-surface px-3.5 py-2 text-sm font-semibold text-fg shadow-sm transition-colors hover:border-accent';
    b.addEventListener('click', () => mover(t));
    return b;
  };
  const render = () => {
    svg.querySelectorAll('.state').forEach((s) => s.classList.toggle('on', s.dataset.state === actual));
    svg.querySelectorAll('.edge').forEach((e) => e.classList.toggle('taken', e.dataset.t === ultima));
    estado.textContent = NOMBRES[actual];
    lista.replaceChildren(...TRANSICIONES.filter((t) => t.de === actual).map(boton));
  };
  const mover = (t) => {
    actual = t.a;
    ultima = t.id;
    render();
    const final = lista.children.length === 0;
    live.textContent = `Pedido pasado de ${NOMBRES[t.de]} a ${NOMBRES[t.a]}.${final ? ' Es un estado final.' : ''}`;
    (lista.querySelector('button') ?? reiniciar).focus();
  };
  reiniciar.addEventListener('click', () => {
    actual = 'pendiente';
    ultima = null;
    render();
    live.textContent = 'Pedido reiniciado en estado Pendiente.';
  });
  render();
</script>
