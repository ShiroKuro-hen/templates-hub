<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de patrones de fondo</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gen{max-width:880px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.5rem;line-height:1.3;letter-spacing:-.02em}
  .lead{margin:0 0 18px;color:var(--muted)}
  .layout{display:grid;gap:16px}
  @media(min-width:768px){.layout{grid-template-columns:1fr 1fr}}
  .panel,.out{min-width:0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  fieldset{min-width:0;margin:0 0 16px;padding:0;border:0}
  legend,.field label{display:block;margin:0 0 8px;padding:0;font-weight:600}
  .field{min-width:0;margin:0 0 16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:min(var(--radius),6px);cursor:pointer}
  .chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
  select{width:100%;font:inherit;padding:8px 10px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:min(var(--radius),6px)}
  .preview{height:224px;margin:0 0 12px;background-color:var(--surface);border:1px solid var(--border);border-radius:min(var(--radius),6px)}
  pre{margin:0 0 12px;padding:12px;overflow-x:auto;font:13px/1.6 ui-monospace,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:min(var(--radius),6px)}
  .btn{padding:8px 14px;font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .msg{min-height:1.5em;margin:8px 0 0;color:var(--muted);font-size:13px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="gen" aria-labelledby="h">
  <h1 id="h">Generador de patrones de fondo</h1>
  <p class="lead">Elige un patrón, ajusta su tamaño y color, y copia el CSS.</p>
  <div class="layout">
    <div class="panel" id="controls">
      <fieldset>
        <legend>Patrón</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="pattern" value="dots" checked> Puntos</label>
          <label class="chip"><input type="radio" name="pattern" value="lines"> Líneas</label>
          <label class="chip"><input type="radio" name="pattern" value="grid"> Cuadrícula</label>
          <label class="chip"><input type="radio" name="pattern" value="waves"> Ondas</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="size">Tamaño: <output id="size-out" for="size">24</output> px</label>
        <input id="size" type="range" min="8" max="48" value="24">
      </div>
      <div class="field">
        <label for="color">Color</label>
        <select id="color">
          <option value="accent">Acento</option>
          <option value="ok">Éxito</option>
          <option value="warn">Aviso</option>
          <option value="info">Información</option>
          <option value="muted">Atenuado</option>
        </select>
      </div>
    </div>
    <div class="out">
      <div class="preview" id="preview" role="img" aria-label="Vista previa del patrón"></div>
      <pre tabindex="0" aria-label="CSS generado"><code id="css"></code></pre>
      <button type="button" class="btn" id="copy">Copiar CSS</button>
      <p class="msg" id="msg" role="status"></p>
    </div>
  </div>
</section>
<script>
  const $ = (id) => document.getElementById(id);
  const sizeInput = $('size'), sizeOut = $('size-out'), colorSelect = $('color');
  const preview = $('preview'), codeEl = $('css'), msg = $('msg');

  function layers(pattern, size, color) {
    const dot = Math.max(1, Math.round(size / 8)), arc = Math.round(size * 0.4);
    if (pattern === 'dots') return `radial-gradient(circle, ${color} ${dot}px, transparent ${dot + 1}px)`;
    if (pattern === 'lines') return `linear-gradient(${color} 2px, transparent 2px)`;
    if (pattern === 'grid') return `linear-gradient(${color} 1px, transparent 1px), linear-gradient(90deg, ${color} 1px, transparent 1px)`;
    return `radial-gradient(circle at 50% 100%, transparent ${arc - 1}px, ${color} ${arc}px ${arc + 2}px, transparent ${arc + 3}px)`;
  }

  function render() {
    const size = Number(sizeInput.value);
    const pattern = document.querySelector('input[name=pattern]:checked').value;
    const image = layers(pattern, size, `var(--${colorSelect.value})`);
    sizeOut.textContent = size;
    preview.style.backgroundImage = image;
    preview.style.backgroundSize = `${size}px ${size}px`;
    codeEl.textContent = `.patron {\n  background-color: var(--surface);\n  background-image: ${image};\n  background-size: ${size}px ${size}px;\n}`;
  }

  async function copyCss() {
    try {
      if (!navigator.clipboard) throw new Error('sin portapapeles');
      await navigator.clipboard.writeText(codeEl.textContent);
      msg.textContent = 'CSS copiado.';
    } catch {
      msg.textContent = 'No se pudo copiar. Selecciona el código y cópialo a mano.';
    }
  }

  $('controls').addEventListener('input', render);
  $('controls').addEventListener('change', render);
  $('copy').addEventListener('click', copyCss);
  render();
</script>
</body>
</html>
