<div class="mx-auto max-w-xl rounded-lg border border-slate-200 bg-white p-5 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <h2 class="mb-3.5 text-lg font-semibold tracking-tight">Crea tu cuenta</h2>
  <form id="f" novalidate class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-x-4 gap-y-3">
    <div class="flex flex-col gap-1">
      <label for="email" class="text-[13px] font-semibold">Correo</label>
      <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="email-e"
        class="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-invalid:border-red-500 dark:border-slate-700 dark:bg-slate-900">
      <p id="email-e" class="min-h-4 text-xs text-red-600 dark:text-red-400"></p>
    </div>
    <div class="flex flex-col gap-1">
      <label for="pw" class="text-[13px] font-semibold">Contraseña</label>
      <input id="pw" name="pw" type="password" required minlength="8" pattern=".*\d.*" autocomplete="new-password" aria-describedby="pw-e"
        class="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-invalid:border-red-500 dark:border-slate-700 dark:bg-slate-900">
      <p id="pw-e" class="min-h-4 text-xs text-red-600 dark:text-red-400"></p>
    </div>
    <div class="flex flex-col gap-1">
      <label for="pw2" class="text-[13px] font-semibold">Repite la contraseña</label>
      <input id="pw2" name="pw2" type="password" required autocomplete="new-password" aria-describedby="pw2-e"
        class="h-9 w-full rounded-lg border border-slate-200 bg-white px-3 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-invalid:border-red-500 dark:border-slate-700 dark:bg-slate-900">
      <p id="pw2-e" class="min-h-4 text-xs text-red-600 dark:text-red-400"></p>
    </div>
    <div class="col-span-full">
      <button type="submit"
        class="h-9 rounded-lg bg-blue-600 px-4 font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-blue-500">
        Crear cuenta
      </button>
    </div>
  </form>
  <p id="done" role="status" hidden class="mt-3.5 rounded-lg border border-emerald-600 bg-emerald-50 px-3 py-2 font-semibold text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">Cuenta creada. Revisa tu correo.</p>
</div>
<script>
  const f = document.getElementById('f');
  const M = { valueMissing: 'Completa este campo.', typeMismatch: 'Escribe un correo válido.', tooShort: 'Usa al menos 8 caracteres.', patternMismatch: 'Incluye al menos un número.' };
  const show = (el) => {
    if (el.id === 'pw2') el.setCustomValidity(el.value !== f.pw.value ? 'Las contraseñas no coinciden.' : '');
    const k = Object.keys(M).find((k) => el.validity[k]);
    const m = k ? M[k] : el.validationMessage;
    el.setAttribute('aria-invalid', !!m);
    document.getElementById(el.id + '-e').textContent = m;
  };
  f.addEventListener('focusout', (e) => e.target.matches('input') && show(e.target));
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    f.querySelectorAll('input').forEach(show);
    const bad = f.querySelector('[aria-invalid=true]');
    if (bad) bad.focus(); else document.getElementById('done').hidden = false;
  });
</script>
