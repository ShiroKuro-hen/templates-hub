<div class="bg-page p-5 text-sm text-fg">
<section aria-label="Publicar un sitio" class="mx-auto max-w-3xl rounded-lg border border-line bg-surface p-5 shadow-sm">
  <nav aria-label="Pasos para publicar tu sitio"><ol id="ol" class="mb-5 grid list-none gap-3 p-0 sm:grid-cols-4"></ol></nav>
  <div aria-live="polite" class="rounded-lg border border-line bg-page p-4">
    <h2 id="h" class="mb-1 text-base font-semibold"></h2>
    <p id="d" class="mb-4 text-muted"></p>
    <div class="flex gap-2">
      <button id="back" type="button" class="cursor-pointer rounded-lg border border-line bg-surface px-3.5 py-2 hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50">Atrás</button>
      <button id="next" type="button" class="cursor-pointer rounded-lg border border-accent bg-accent px-3.5 py-2 text-accent-ink hover:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50">Continuar</button>
    </div>
  </div>
</section>
</div>
<script>
  const steps = [
    ['Dominio', 'Conecta tu dominio', 'Apunta tu dominio al servidor con un registro CNAME.'],
    ['Contenido', 'Revisa el contenido', 'Agrega la imagen de portada para poder continuar.'],
    ['Pagos', 'Configura los pagos', 'Conecta una cuenta bancaria para cobrar a tus clientes.'],
    ['Publicación', 'Publica tu sitio', 'Revisa el resumen y publica cuando estés listo.'],
  ];
  const RAIL = { done: 'bg-gradient-to-br from-accent-2 to-accent', current: 'bg-accent', error: 'bg-err', todo: 'bg-line' };
  const DOT = { done: 'border-accent bg-accent text-accent-ink', current: 'border-accent bg-accent-soft', error: 'border-err bg-err-soft', todo: 'border-line text-muted' };
  const SUB = { done: 'Completo', error: 'Requiere atención', current: 'En curso', todo: 'Pendiente' };
  const CHECK = '<svg viewBox="0 0 24 24" class="size-3.5 fill-none stroke-current stroke-[2.5]" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  let cur = 2, max = 2, err = { 1: 'Falta la imagen de portada' };
  const $ = (id) => document.getElementById(id);
  function render(focus) {
    $('ol').innerHTML = steps.map(([name], i) => {
      const s = i === cur ? 'current' : i > max ? 'todo' : err[i] ? 'error' : 'done';
      const sub = s === 'error' ? `<span class="block text-[13px] text-err">${err[i]}</span>` : `<span class="block text-[13px] text-muted">${SUB[s]}</span>`;
      const inner = `<span class="grid size-6 flex-none place-items-center rounded-full border text-xs font-semibold tabular-nums ${DOT[s]}">${s === 'done' ? CHECK : s === 'error' ? '!' : i + 1}</span><span><span class="block font-semibold">${name}</span>${sub}</span>`;
      const box = 'flex items-start gap-2.5 rounded-lg p-1.5 no-underline';
      return `<li><div class="mb-2.5 h-1 rounded-full ${RAIL[s]}"></div>` + (s === 'todo' ? `<span class="${box} text-muted">${inner}</span>` :
        `<a href="#paso-${i + 1}" data-i="${i}" ${s === 'current' ? 'aria-current="step"' : ''} class="${box} text-inherit hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">${inner}</a>`) + '</li>';
    }).join('');
    const s = steps[cur] || ['', 'Sitio publicado', 'Tu sitio ya está disponible en tu dominio.'];
    $('h').textContent = s[1]; $('d').textContent = s[2];
    $('back').disabled = cur === 0; $('next').disabled = cur > 3;
    $('next').textContent = cur === 3 ? 'Publicar sitio' : 'Continuar';
    if (focus) $('ol').querySelector('[aria-current]')?.focus();
  }
  $('ol').addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault(); cur = +a.dataset.i; render(true);
  });
  $('back').addEventListener('click', () => { cur--; render(); });
  $('next').addEventListener('click', () => { delete err[cur]; cur++; max = Math.max(max, cur); render(); });
  render();
</script>
