<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:440px;margin:0 auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .logo{width:32px;height:32px;border-radius:var(--radius);background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  h1{margin:16px 0 4px;font-size:20px;line-height:1.3}
  .sub{margin:0 0 20px;color:var(--muted)}
  .providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .btn{font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s,border-color .14s}
  .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn:disabled{cursor:progress;opacity:.6}
  .btn[aria-busy=true]{opacity:1;border-color:var(--accent)}
  .btn svg{width:18px;height:18px;flex:none}
  .btn.primary{width:100%;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.08)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sep{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted)}
  .sep::before,.sep::after{content:"";flex:1;border-top:1px solid var(--border)}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{box-sizing:border-box;width:100%;height:40px;margin-bottom:12px;padding:0 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  input:focus-visible{border-color:var(--accent)}
  input[aria-invalid=true]{border-color:var(--err)}
  .msg{margin:-4px 0 12px;font-size:13px;color:var(--muted)}
  .msg:empty{display:none}
  .msg.err{color:var(--err)}
  .legal{margin:16px 0 0;font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card" aria-labelledby="t">
  <div class="logo" aria-hidden="true"></div>
  <h1 id="t">Accede a Norte Cloud</h1>
  <p class="sub">Usa la cuenta de tu empresa. No publicamos nada en tu nombre.</p>
  <div class="providers" role="group" aria-label="Acceder con un proveedor">
    <button class="btn" type="button" data-p="Google"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 12h-8"/></svg>Google</button>
    <button class="btn" type="button" data-p="Microsoft"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8" opacity=".7"/><rect x="3" y="13" width="8" height="8" opacity=".7"/><rect x="13" y="13" width="8" height="8" opacity=".45"/></svg>Microsoft</button>
    <button class="btn" type="button" data-p="GitHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"/></svg>GitHub</button>
    <button class="btn" type="button" data-p="tu proveedor SSO"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg>SSO empresarial</button>
  </div>
  <p class="sep">o con tu correo</p>
  <form id="f" novalidate>
    <label for="email">Correo de trabajo</label>
    <input id="email" type="email" autocomplete="email" placeholder="nombre@empresa.com" required aria-describedby="msg">
    <p id="msg" class="msg" aria-live="polite"></p>
    <button class="btn primary" type="submit">Continuar con correo</button>
  </form>
  <p class="legal">Al continuar aceptas los <a href="#">Términos del servicio</a> y la <a href="#">Política de privacidad</a>.</p>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
</main>
<script>
  const btns = document.querySelectorAll('[data-p]'), live = document.getElementById('live');
  btns.forEach((b) => b.addEventListener('click', () => {
    btns.forEach((x) => (x.disabled = true));
    b.setAttribute('aria-busy', 'true');
    live.textContent = `Redirigiendo a ${b.dataset.p}…`;
    setTimeout(() => { btns.forEach((x) => (x.disabled = false)); b.removeAttribute('aria-busy'); live.textContent = ''; }, 1600);
  }));
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const i = document.getElementById('email'), m = document.getElementById('msg'), ok = i.checkValidity();
    m.textContent = ok ? `Te enviamos un código a ${i.value}.` : 'Escribe un correo válido, por ejemplo nombre@empresa.com.';
    m.className = ok ? 'msg' : 'msg err';
    i.setAttribute('aria-invalid', String(!ok));
  });
</script>
</body>
</html>
