<div class="bg-page p-5 text-sm text-fg">
  <article aria-labelledby="p-title" class="max-w-[300px] overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
    <div class="relative grid aspect-[4/3] place-items-center border-b border-line bg-accent-soft text-accent">
      <span class="absolute left-3 top-3 rounded-full border border-line bg-surface px-2.5 py-0.5 text-xs font-medium">Nuevo</span>
      <svg viewBox="0 0 120 120" role="img" aria-label="Auriculares inalámbricos" class="w-[46%]">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="[stop-color:var(--accent-2)]"/><stop offset="1" class="[stop-color:var(--accent)]"/></linearGradient></defs>
        <path d="M22 70V60a38 38 0 0 1 76 0v10" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
        <rect x="14" y="64" width="22" height="36" rx="8" fill="currentColor"/>
        <rect x="84" y="64" width="22" height="36" rx="8" fill="currentColor"/>
      </svg>
    </div>
    <div class="p-4">
      <h3 id="p-title" class="mb-1 text-base font-semibold leading-snug">Auriculares Aura 2</h3>
      <p class="mb-2.5 text-muted">Cancelación de ruido, 40 h de batería</p>
      <div class="mb-3.5 flex items-center gap-1.5 tabular-nums text-muted">
        <span role="img" aria-label="Valoración: 4,5 de 5" class="relative inline-block text-base leading-none tracking-tight text-line">★★★★★
          <span aria-hidden="true" class="absolute inset-0 w-[90%] overflow-hidden text-warn">★★★★★</span></span>
        <span aria-hidden="true">4,5</span><span>(1.284 reseñas)</span>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <p class="text-xl font-bold tabular-nums">149 €<s class="ml-1.5 text-[13px] font-normal text-muted" aria-label="Precio anterior 189 €">189 €</s></p>
        <button type="button" id="add" class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink hover:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent data-[n]:border-ok data-[n]:bg-ok-soft data-[n]:text-fg">Añadir al carrito</button>
      </div>
      <p id="live" role="status" class="sr-only"></p>
    </div>
  </article>
</div>
<script>
  const b = document.getElementById('add');
  let n = 0;
  b.addEventListener('click', () => {
    b.dataset.n = ++n;
    b.textContent = `Añadir otro (${n} en carrito)`;
    document.getElementById('live').textContent = `Añadido al carrito. Tienes ${n}.`;
  });
</script>
