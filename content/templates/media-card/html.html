<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui, sans-serif; background:#f6f1e7; color:#17130f; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px; }
  .media { display:flex; flex-direction:column; overflow:hidden; border:2px solid #17130f; border-radius:10px; background:#fffdf8; box-shadow:4px 4px 0 #17130f; }
  .media svg { display:block; width:100%; height:auto; aspect-ratio:16/9; border-bottom:2px solid #17130f; }
  .body { display:flex; flex-direction:column; gap:6px; padding:12px 14px 14px; flex:1; }
  .media h2 { margin:0; font-size:1.05rem; letter-spacing:-.02em; }
  .meta { display:flex; flex-wrap:wrap; gap:2px 12px; margin:0; font:600 .75rem ui-monospace, monospace; color:#4d453c; }
  .acts { display:flex; gap:8px; margin-top:auto; padding-top:6px; }
  button { font:600 .85rem system-ui, sans-serif; color:#17130f; background:#fffdf8; border:2px solid #17130f; border-radius:10px; padding:6px 14px; box-shadow:4px 4px 0 #17130f; cursor:pointer; }
  .main { background:#ff5a36; }
  button[aria-pressed="true"] { background:#17130f; color:#fffdf8; }
  button:hover, button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #17130f; }
  button:focus-visible { outline:3px solid #ff5a36; outline-offset:2px; }
  @media (prefers-reduced-motion:no-preference) { button { transition:transform .1s, box-shadow .1s; } }
</style>
</head>
<body>
<div class="cards">
  <article class="media" aria-labelledby="t1">
    <svg viewBox="0 0 160 90" aria-hidden="true" focusable="false">
      <rect width="160" height="90" fill="#ffd84d"/>
      <circle cx="118" cy="30" r="14" fill="#ff5a36" stroke="#17130f" stroke-width="2"/>
      <path d="M0 90V62l34-26 30 28 28-18 68 36z" fill="#17130f"/>
      <path d="M0 90V74l30-14 34 16 40-12 56 26z" fill="#1f9d55" stroke="#17130f" stroke-width="2"/>
    </svg>
    <div class="body">
      <h2 id="t1">Cinco rutas para un fin de semana</h2>
      <p class="meta"><span>12 oct 2026</span><span>5 min de lectura</span></p>
      <div class="acts">
        <button type="button" class="main" aria-label="Leer el artículo Cinco rutas para un fin de semana">Leer artículo</button>
        <button type="button" class="save" aria-pressed="false">Guardar</button>
      </div>
    </div>
  </article>
  <article class="media" aria-labelledby="t2">
    <svg viewBox="0 0 160 90" aria-hidden="true" focusable="false">
      <rect width="160" height="90" fill="#cfd8ff"/>
      <g fill="#fffdf8" stroke="#17130f" stroke-width="2"><rect x="20" y="22" width="50" height="46" rx="6"/><rect x="82" y="22" width="58" height="20" rx="6"/><rect x="82" y="48" width="58" height="20" rx="6"/></g>
      <circle cx="45" cy="45" r="10" fill="#3b5bfd" stroke="#17130f" stroke-width="2"/>
    </svg>
    <div class="body">
      <h2 id="t2">Guía rápida de tu primer panel</h2>
      <p class="meta"><span>3 oct 2026</span><span>8 min de lectura</span></p>
      <div class="acts">
        <button type="button" class="main" aria-label="Leer el artículo Guía rápida de tu primer panel">Leer artículo</button>
        <button type="button" class="save" aria-pressed="true">Guardado</button>
      </div>
    </div>
  </article>
</div>
<script>
  document.querySelectorAll('.save').forEach((b) => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    b.textContent = on ? 'Guardado' : 'Guardar';
  }));
</script>
</body>
</html>
