<article class="m-5 flex max-w-xs flex-col overflow-hidden rounded-lg border border-slate-200 bg-white text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t1">
  <svg viewBox="0 0 160 90" aria-hidden="true" focusable="false" class="block aspect-video h-auto w-full border-b border-slate-200 text-slate-500 dark:border-slate-700 dark:text-slate-400">
    <rect class="fill-blue-50 dark:fill-slate-800" width="160" height="90"/>
    <circle class="fill-blue-600 dark:fill-blue-400" cx="118" cy="30" r="12"/>
    <path class="fill-current opacity-40" d="M0 90V62l34-26 30 28 28-18 68 36z"/>
    <path class="fill-current opacity-70" d="M0 90V74l30-14 34 16 40-12 56 26z"/>
  </svg>
  <div class="flex flex-1 flex-col gap-1 px-4 pb-4 pt-3.5">
    <h2 id="t1" class="text-base font-semibold tracking-tight">Cinco rutas para un fin de semana</h2>
    <p class="flex flex-wrap gap-x-3 text-xs tabular-nums text-slate-500 dark:text-slate-400"><span>12 oct 2026</span><span>5 min de lectura</span></p>
    <div class="mt-auto flex gap-2 pt-3">
      <button type="button" aria-label="Leer el artículo Cinco rutas para un fin de semana" class="rounded-lg bg-blue-600 px-3.5 py-1.5 text-[13px] font-semibold text-white transition-colors hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:bg-blue-500">Leer artículo</button>
      <button type="button" id="guardar" aria-pressed="false" class="rounded-lg border border-slate-200 px-3.5 py-1.5 text-[13px] font-semibold transition-colors hover:border-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-pressed:border-blue-600 aria-pressed:bg-blue-50 aria-pressed:text-blue-700 motion-reduce:transition-none dark:border-slate-700 dark:aria-pressed:border-blue-400 dark:aria-pressed:bg-slate-800 dark:aria-pressed:text-blue-400">Guardar</button>
    </div>
  </div>
</article>
<script>
  const g = document.getElementById('guardar');
  g.addEventListener('click', () => {
    const on = g.getAttribute('aria-pressed') !== 'true';
    g.setAttribute('aria-pressed', on);
    g.textContent = on ? 'Guardado' : 'Guardar';
  });
</script>
