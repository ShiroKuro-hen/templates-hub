<article class="m-5 flex max-w-xs flex-col overflow-hidden rounded-lg border border-line bg-surface text-sm text-fg shadow-sm" aria-labelledby="t1">
  <svg viewBox="0 0 160 90" aria-hidden="true" focusable="false" class="block aspect-video h-auto w-full border-b border-line text-muted">
    <rect class="fill-accent-soft" width="160" height="90"/>
    <circle class="fill-accent" cx="118" cy="30" r="12"/>
    <path class="fill-current opacity-40" d="M0 90V62l34-26 30 28 28-18 68 36z"/>
    <path class="fill-current opacity-70" d="M0 90V74l30-14 34 16 40-12 56 26z"/>
  </svg>
  <div class="flex flex-1 flex-col gap-1 px-4 pb-4 pt-3.5">
    <h2 id="t1" class="text-base font-semibold tracking-tight">Cinco rutas para un fin de semana</h2>
    <p class="flex flex-wrap gap-x-3 text-xs tabular-nums text-muted"><span>12 oct 2026</span><span>5 min de lectura</span></p>
    <div class="mt-auto flex gap-2 pt-3">
      <button type="button" aria-label="Leer el artículo Cinco rutas para un fin de semana" class="rounded-lg bg-accent px-3.5 py-1.5 text-[13px] font-semibold text-accent-ink transition-colors hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Leer artículo</button>
      <button type="button" id="guardar" aria-pressed="false" class="rounded-lg border border-line px-3.5 py-1.5 text-[13px] font-semibold transition-colors hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent-soft aria-pressed:text-accent motion-reduce:transition-none">Guardar</button>
    </div>
  </div>
</article>
<script>
  const g = document.getElementById('guardar');
  g.addEventListener('click', () => {
    const on = g.getAttribute('aria-pressed') !== 'true';
    g.setAttribute('aria-pressed', on);
    g.textContent = on ? 'Guardado' : 'Guardar';
  });
</script>
