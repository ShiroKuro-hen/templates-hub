<section aria-label="Chat con Lucía Ortega" class="mx-auto flex h-[460px] max-w-xl flex-col overflow-hidden rounded-lg border border-line bg-surface text-sm text-fg shadow-sm">
  <header class="flex items-center gap-2.5 border-b border-line px-4 py-3">
    <span aria-hidden="true" class="grid size-9 place-items-center rounded-full bg-accent-soft text-xs font-semibold text-accent">LO</span>
    <div>
      <strong class="block">Lucía Ortega</strong>
      <small class="flex items-center gap-1.5 text-xs text-muted"><i class="size-2 rounded-full bg-gradient-to-br from-accent-2 to-accent"></i>En línea</small>
    </div>
  </header>
  <div id="log" role="log" aria-live="polite" tabindex="0" class="flex flex-1 flex-col gap-3.5 overflow-y-auto bg-page p-4 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">
    <p class="self-center text-xs text-muted">Hoy</p>
    <div class="flex max-w-[80%] gap-2">
      <span aria-hidden="true" class="grid size-7 shrink-0 place-items-center self-end rounded-full bg-accent-soft text-[11px] font-semibold text-accent">LO</span>
      <div class="flex flex-col items-start gap-0.5">
        <p class="rounded-lg border border-line bg-surface px-3 py-2">Hola, ya subí el informe de incidencias de septiembre.</p>
        <p class="rounded-lg border border-line bg-surface px-3 py-2">¿Puedes revisar la sección de tiempos de respuesta antes del comité?</p>
        <time class="text-[11px] tabular-nums text-muted">09:41</time>
      </div>
    </div>
    <div data-me class="flex max-w-[80%] gap-2 self-end">
      <div class="flex flex-col items-end gap-0.5">
        <p class="whitespace-pre-wrap break-words rounded-lg bg-accent px-3 py-2 text-accent-ink">Claro, lo reviso esta mañana.</p>
        <time class="text-[11px] tabular-nums text-muted">09:44</time>
      </div>
    </div>
  </div>
  <form id="f" class="flex gap-2 border-t border-line px-3 pb-1 pt-3">
    <label for="txt" class="sr-only">Mensaje para Lucía Ortega</label>
    <textarea id="txt" rows="1" placeholder="Escribe un mensaje" aria-describedby="hint" class="min-w-0 flex-1 resize-none rounded-lg border border-line bg-surface px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"></textarea>
    <button class="rounded-lg bg-accent px-4 py-2 font-semibold text-accent-ink hover:brightness-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Enviar</button>
  </form>
  <p id="hint" class="px-3 pb-2.5 text-xs text-muted">Enter envía. Mayús + Enter añade una línea.</p>
</section>
<script>
  const log = document.getElementById('log'), f = document.getElementById('f'), txt = document.getElementById('txt');
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = txt.value.trim(); if (!v) return;
    let g = log.lastElementChild;
    if (!g.hasAttribute('data-me')) { // nuevo grupo si el último no es tuyo
      g = log.querySelector('[data-me]').cloneNode(true);
      g.querySelectorAll('p').forEach((p) => p.remove()); log.append(g);
    }
    const st = g.firstElementChild, time = st.querySelector('time'), p = log.querySelector('[data-me] p').cloneNode();
    p.textContent = v; st.insertBefore(p, time);
    time.textContent = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    txt.value = ''; log.scrollTop = log.scrollHeight;
  });
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
</script>
