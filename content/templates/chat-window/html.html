<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .chat{max-width:560px;margin:0 auto;height:460px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .head small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .av{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
  .av.sm{width:28px;height:28px;font-size:11px;align-self:flex-end}
  .log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
  .day{margin:0;align-self:center;font-size:12px;color:var(--muted)}
  .group{display:flex;gap:8px;max-width:80%}
  .group.me{align-self:flex-end}
  .stack{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
  .me .stack{align-items:flex-end}
  .msg{margin:0;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere}
  .me .msg{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .compose{display:flex;gap:8px;padding:12px 12px 4px;border-top:1px solid var(--border)}
  textarea{flex:1;min-width:0;resize:none;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px}
  button{font:inherit;font-weight:600;padding:8px 16px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .14s}
  button:hover{filter:brightness(1.08)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .log:focus-visible{outline-offset:-2px}
  .hint{margin:0;padding:0 12px 10px;font-size:12px;color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="chat" aria-label="Chat con Lucía Ortega">
  <header class="head">
    <span class="av" aria-hidden="true">LO</span>
    <div><strong>Lucía Ortega</strong><small><i class="dot"></i>En línea</small></div>
  </header>
  <div class="log" id="log" role="log" aria-live="polite" tabindex="0">
    <p class="day">Hoy</p>
    <div class="group them">
      <span class="av sm" aria-hidden="true">LO</span>
      <div class="stack">
        <p class="msg">Hola, ya subí el informe de incidencias de septiembre.</p>
        <p class="msg">¿Puedes revisar la sección de tiempos de respuesta antes del comité?</p>
        <time>09:41</time>
      </div>
    </div>
    <div class="group me">
      <div class="stack">
        <p class="msg">Claro, lo reviso esta mañana.</p>
        <time>09:44</time>
      </div>
    </div>
    <div class="group them">
      <span class="av sm" aria-hidden="true">LO</span>
      <div class="stack"><p class="msg">Gracias. El comité empieza a las 12:00.</p><time>09:45</time></div>
    </div>
  </div>
  <form class="compose" id="f">
    <label class="sr" for="txt">Mensaje para Lucía Ortega</label>
    <textarea id="txt" rows="1" placeholder="Escribe un mensaje" aria-describedby="hint"></textarea>
    <button type="submit">Enviar</button>
  </form>
  <p class="hint" id="hint">Enter envía. Mayús + Enter añade una línea.</p>
</section>
<script>
  const log = document.getElementById('log'), f = document.getElementById('f'), txt = document.getElementById('txt');
  const bottom = () => (log.scrollTop = log.scrollHeight);
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = txt.value.trim(); if (!v) return txt.focus();
    let g = log.lastElementChild;
    if (!g.classList.contains('me')) { // agrupa mensajes seguidos del mismo remitente
      g = document.createElement('div'); g.className = 'group me';
      g.innerHTML = '<div class="stack"><time></time></div>'; log.append(g);
    }
    const st = g.firstElementChild, time = st.querySelector('time'), p = document.createElement('p');
    p.className = 'msg'; p.textContent = v; st.insertBefore(p, time);
    time.textContent = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    txt.value = ''; bottom();
  });
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
  bottom();
</script>
</body>
</html>
