<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  section{padding:20px}
  section+section{border-top:1px solid var(--border)}
  h1{margin:0;font-size:18px;line-height:1.3}
  h2{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px}
  .sub{margin:4px 0 16px;color:var(--muted)}
  .seats{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-variant-numeric:tabular-nums}
  .meter{height:4px;margin-bottom:20px;border-radius:999px;background:var(--border);overflow:hidden}
  .meter i{display:block;height:100%;background:linear-gradient(135deg,#22d3ee,#2f5bff);transition:width .14s}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
  .f{flex:1 1 200px}
  .f.role{flex:0 1 160px}
  label{display:block;margin-bottom:6px;font-weight:600}
  input,select{box-sizing:border-box;width:100%;height:40px;padding:0 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  input:focus-visible,select:focus-visible{border-color:var(--accent)}
  input[aria-invalid=true]{border-color:var(--err)}
  .hint,.msg{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
  .msg{color:var(--err)}
  .msg.ok{color:var(--text)}
  .msg:empty{display:none}
  .btn{font:inherit;font-weight:600;height:40px;padding:0 16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s,border-color .14s}
  .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn.primary{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
  .btn.sm{height:32px;padding:0 12px}
  .btn.danger{color:var(--err)}
  .btn.danger:hover{background:var(--err-soft);border-color:var(--err)}
  .count{padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums}
  ul{margin:0;padding:0;list-style:none}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0;padding-top:0}
  .av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .who{flex:1 1 180px;min-width:0}
  .who strong,.who span{display:block;overflow-wrap:anywhere}
  .who span{color:var(--muted)}
  .acts{display:flex;gap:6px}
  .empty{margin:0;padding:16px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);text-align:center}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <section aria-labelledby="t">
    <h1 id="t">Invitar al equipo</h1>
    <p class="sub">Los miembros nuevos reciben un correo con un enlace válido por 7 días.</p>
    <div class="seats"><span id="seats">7 de 10 puestos ocupados</span></div>
    <div id="meter" class="meter" role="meter" aria-label="Puestos ocupados" aria-valuemin="0" aria-valuemax="10" aria-valuenow="7"><i id="fill" style="width:70%"></i></div>
    <form id="f" novalidate>
      <div class="f"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="off" placeholder="nombre@empresa.com" required aria-describedby="msg"></div>
      <div class="f role"><label for="role">Rol</label>
        <select id="role" aria-describedby="rh"><option>Editor</option><option>Lector</option><option>Administrador</option></select></div>
      <button class="btn primary" type="submit">Enviar invitación</button>
      <p id="rh" class="hint"></p>
      <p id="msg" class="msg"></p>
    </form>
  </section>
  <section aria-labelledby="p">
    <h2 id="p">Invitaciones pendientes <span id="n" class="count">3</span></h2>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>No hay invitaciones pendientes. Escribe un correo arriba para sumar a tu equipo.</p>
  </section>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
</main>
<script>
  const $ = (i) => document.getElementById(i), MAX = 10, MEMBERS = 4;
  const HINT = { Administrador: 'Gestiona miembros, facturación y ajustes.', Editor: 'Crea y edita proyectos. No ve la facturación.', Lector: 'Solo consulta proyectos y comentarios.' };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  let pending = [
    { email: 'carlos.mendoza@norte.cloud', role: 'Editor', when: 'hace 2 días' },
    { email: 'valeria.rios@norte.cloud', role: 'Lector', when: 'hace 5 días' },
    { email: 'andres.paz@norte.cloud', role: 'Administrador', when: 'hoy' },
  ];
  function say(text, cls = '') { $('msg').textContent = text; $('msg').className = 'msg ' + cls; $('live').textContent = text; }
  function render() {
    $('list').innerHTML = pending.map((p, i) => `<li class="row"><span class="av" aria-hidden="true">${esc(p.email[0].toUpperCase())}</span>
      <div class="who"><strong>${esc(p.email)}</strong><span>${p.role}, enviada ${p.when}</span></div>
      <div class="acts"><button class="btn sm" data-a="resend" data-i="${i}" aria-label="Reenviar invitación a ${esc(p.email)}">Reenviar</button>
      <button class="btn sm danger" data-a="cancel" data-i="${i}" aria-label="Cancelar invitación a ${esc(p.email)}">Cancelar</button></div></li>`).join('');
    const used = MEMBERS + pending.length;
    $('empty').hidden = pending.length > 0; $('n').textContent = pending.length;
    $('seats').textContent = `${used} de ${MAX} puestos ocupados`;
    $('fill').style.width = `${(used / MAX) * 100}%`; $('meter').setAttribute('aria-valuenow', used);
  }
  $('role').addEventListener('change', () => ($('rh').textContent = HINT[$('role').value]));
  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const i = $('email'), v = i.value.trim().toLowerCase();
    const m = !i.checkValidity() ? 'Escribe un correo válido, por ejemplo nombre@empresa.com.'
      : pending.some((p) => p.email === v) ? `${v} ya tiene una invitación pendiente. Usa Reenviar en la lista.`
      : MEMBERS + pending.length >= MAX ? `Alcanzaste el límite de ${MAX} puestos. Cancela una invitación o amplía tu plan.` : '';
    i.setAttribute('aria-invalid', String(!!m));
    if (m) return say(m);
    pending.unshift({ email: v, role: $('role').value, when: 'ahora' });
    i.value = ''; render(); say(`Invitación enviada a ${v}.`, 'ok');
  });
  $('list').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const p = pending[b.dataset.i];
    if (b.dataset.a === 'cancel') { pending.splice(b.dataset.i, 1); render(); say(`Invitación a ${p.email} cancelada.`); $('email').focus(); }
    else { b.textContent = 'Reenviada'; say(`Invitación reenviada a ${p.email}.`, 'ok'); setTimeout(() => (b.textContent = 'Reenviar'), 1600); }
  });
  $('rh').textContent = HINT.Editor; render();
</script>
</body>
</html>
