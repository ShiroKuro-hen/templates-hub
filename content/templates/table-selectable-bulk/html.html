<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:52px;padding:8px 16px;border-bottom:1px solid;border-image:linear-gradient(90deg,#22d3ee,#2f5bff) 1;background:var(--accent-soft)}
  .bulk[hidden]{display:none}
  .count{padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums}
  .bulk .sp{flex:1}
  .btn{font:inherit;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s,border-color .14s}
  .btn:hover{border-color:var(--accent)}
  .btn.danger{color:var(--err)}
  .btn.danger:hover{border-color:var(--err);background:var(--err-soft)}
  .btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .scroll{overflow-x:auto}
  table{width:100%;min-width:460px;border-collapse:collapse}
  th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
  tbody tr:last-child td{border-bottom:0}
  th{font-weight:600;color:var(--muted)}
  th:first-child,td:first-child{width:20px;padding-right:0}
  input[type=checkbox]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
  tbody tr{transition:background .14s}
  tbody tr:hover{background:var(--bg)}
  tbody tr:has(:checked){background:var(--accent-soft)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{padding:32px 16px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="bulk" id="bulk" hidden>
    <span class="count" id="count" aria-live="polite">0</span><span>seleccionados</span>
    <span class="sp"></span>
    <button type="button" class="btn" id="exp">Exportar CSV</button>
    <button type="button" class="btn danger" id="del">Archivar</button>
  </div>
  <div class="scroll">
  <table id="t">
    <caption hidden>Facturas pendientes. Marca filas para aplicar acciones en bloque.</caption>
    <thead><tr>
      <th scope="col"><input type="checkbox" id="all" aria-label="Seleccionar todas las filas"></th>
      <th scope="col">Factura</th><th scope="col">Cliente</th><th scope="col" class="num">Importe</th>
    </tr></thead>
    <tbody>
      <tr><td><input type="checkbox" aria-label="Seleccionar F-1042"></td><td>F-1042</td><td>Nórdica Labs</td><td class="num">1.240,00 €</td></tr>
      <tr><td><input type="checkbox" aria-label="Seleccionar F-1043"></td><td>F-1043</td><td>Atlas Energía</td><td class="num">3.890,50 €</td></tr>
      <tr><td><input type="checkbox" aria-label="Seleccionar F-1044"></td><td>F-1044</td><td>Brío Studio</td><td class="num">760,00 €</td></tr>
      <tr><td><input type="checkbox" aria-label="Seleccionar F-1045"></td><td>F-1045</td><td>Cobalto SA</td><td class="num">12.300,00 €</td></tr>
    </tbody>
  </table>
  </div>
</div>
<p id="msg" role="status" style="color:var(--muted);margin:8px 0 0"></p>
<script>
  const t = document.getElementById('t'), all = document.getElementById('all');
  const bulk = document.getElementById('bulk'), count = document.getElementById('count');
  const boxes = () => [...t.tBodies[0].querySelectorAll('input')];
  function sync() {
    const b = boxes(), n = b.filter((x) => x.checked).length;
    all.checked = n > 0 && n === b.length;
    all.indeterminate = n > 0 && n < b.length;
    all.disabled = !b.length;
    bulk.hidden = !n; count.textContent = n;
    if (!b.length) t.tBodies[0].innerHTML = '<tr><td colspan="4" class="empty">No quedan facturas pendientes. Crea una nueva para empezar.</td></tr>';
  }
  all.addEventListener('change', () => { boxes().forEach((x) => (x.checked = all.checked)); sync(); });
  t.tBodies[0].addEventListener('change', sync);
  document.getElementById('del').addEventListener('click', () => {
    boxes().filter((x) => x.checked).forEach((x) => x.closest('tr').remove());
    sync(); all.focus();
  });
  document.getElementById('exp').addEventListener('click', () => {
    const ids = boxes().filter((x) => x.checked).map((x) => x.closest('tr').cells[1].textContent);
    document.getElementById('msg').textContent = 'Exportadas ' + ids.join(', ') + '.';
  });
</script>
</body>
</html>
