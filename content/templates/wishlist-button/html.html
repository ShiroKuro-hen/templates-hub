<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{position:relative;width:min(100%,280px);overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .img{display:grid;place-items:center;aspect-ratio:4/3;color:var(--accent);background:var(--accent-soft);border-bottom:1px solid var(--border)}
  .img svg{width:44%}
  .info{padding:12px 16px 16px}
  .info h2{margin:0;font-size:15px}
  .price{margin:0 0 12px;color:var(--muted);font-variant-numeric:tabular-nums}
  button{font:inherit;color:var(--text);cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .heart{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:fill .14s}
  [aria-pressed=true] .heart{fill:url(#hg);stroke:var(--accent);animation:pop .16s ease-out}
  @keyframes pop{50%{transform:scale(1.25)}}
  .fab{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:36px;height:36px;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);transition:background .14s}
  .fab:hover{background:var(--accent-soft)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;transition:background .14s,border-color .14s}
  .pill:hover{background:var(--accent-soft)}
  .pill[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
  .pill b{min-width:3ch;font-weight:600;font-variant-numeric:tabular-nums}
  .toast{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);animation:in .16s ease-out}
  .toast[hidden]{display:none}
  .toast button{padding:0 4px;color:var(--accent);background:none;border:0;text-decoration:underline}
  @keyframes in{from{transform:translateY(8px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient>
  <symbol id="h" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol></defs>
</svg>
<article class="card">
  <div class="img" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="38" y="6" width="24" height="24" rx="6"/><rect x="38" y="70" width="24" height="24" rx="6"/><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="20"/><path d="M50 50V37M50 50l9 5"/></svg></div>
  <button class="fab" type="button" data-wish aria-pressed="false" aria-label="Guardar Reloj Orbit S2 en favoritos"><svg class="heart" aria-hidden="true"><use href="#h"/></svg></button>
  <div class="info">
    <h2>Reloj Orbit S2</h2>
    <p class="price">149,00 €</p>
    <button class="pill" type="button" data-wish aria-pressed="false" aria-label="Guardar Reloj Orbit S2 en favoritos"><svg class="heart" aria-hidden="true"><use href="#h"/></svg><span data-label>Guardar</span><b data-count>248</b></button>
  </div>
  <div class="toast" id="toast" role="status" hidden><span id="msg"></span><button type="button" id="undo">Deshacer</button></div>
</article>
<script>
  let on = false, n = 248, timer;
  const btns = [...document.querySelectorAll('[data-wish]')], toast = document.getElementById('toast'), msg = document.getElementById('msg');
  function set(v, quiet) {
    on = v; n += v ? 1 : -1;
    btns.forEach((b) => {
      b.setAttribute('aria-pressed', on);
      const l = b.querySelector('[data-label]'); if (l) { l.textContent = on ? 'Guardado' : 'Guardar'; b.querySelector('[data-count]').textContent = n; }
    });
    if (quiet) return;
    msg.textContent = on ? 'Añadido a tus favoritos.' : 'Quitado de tus favoritos.';
    toast.hidden = false; clearTimeout(timer); timer = setTimeout(() => (toast.hidden = true), 4000);
  }
  btns.forEach((b) => b.addEventListener('click', () => set(!on)));
  document.getElementById('undo').addEventListener('click', () => { set(!on, true); toast.hidden = true; btns[1].focus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toast.hidden = true; });
</script>
</body>
</html>
