<div class="bg-page p-5 text-sm text-fg">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <symbol id="h" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol></defs>
  </svg>
  <article class="relative w-full max-w-[280px] overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
    <div class="aspect-[4/3] border-b border-line bg-accent-soft" aria-hidden="true"></div>
    <button type="button" data-wish aria-pressed="false" aria-label="Guardar Reloj Orbit S2 en favoritos" class="group absolute right-2.5 top-2.5 grid size-9 place-items-center rounded-full border border-line bg-surface shadow-sm hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <svg class="size-5 fill-none stroke-current stroke-2 group-aria-pressed:fill-[url(#hg)] group-aria-pressed:stroke-accent" aria-hidden="true"><use href="#h"/></svg>
    </button>
    <div class="px-4 pb-4 pt-3">
      <h2 class="text-[15px] font-semibold">Reloj Orbit S2</h2>
      <p class="mb-3 tabular-nums text-muted">149,00 €</p>
      <button type="button" data-wish aria-pressed="false" aria-label="Guardar Reloj Orbit S2 en favoritos" class="group inline-flex items-center gap-2 rounded-full border border-line bg-surface py-1.5 pl-2.5 pr-3 hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent-soft">
        <svg class="size-5 fill-none stroke-current stroke-2 group-aria-pressed:fill-[url(#hg)] group-aria-pressed:stroke-accent" aria-hidden="true"><use href="#h"/></svg>
        <span data-label>Guardar</span><b data-count class="min-w-[3ch] font-semibold tabular-nums">248</b>
      </button>
    </div>
    <div id="toast" role="status" hidden class="[&[hidden]]:hidden absolute inset-x-3 bottom-3 flex items-center justify-between gap-2 rounded-lg border border-line bg-surface px-3 py-2 shadow-sm">
      <span id="msg"></span><button type="button" id="undo" class="px-1 text-accent underline focus-visible:outline-2 focus-visible:outline-accent">Deshacer</button>
    </div>
  </article>
</div>
<script>
  let on = false, n = 248, timer;
  const btns = [...document.querySelectorAll('[data-wish]')], toast = document.getElementById('toast'), msg = document.getElementById('msg');
  function set(v, quiet) {
    on = v; n += v ? 1 : -1;
    btns.forEach((b) => {
      b.setAttribute('aria-pressed', on);
      const l = b.querySelector('[data-label]'); if (l) { l.textContent = on ? 'Guardado' : 'Guardar'; b.querySelector('[data-count]').textContent = n; }
    });
    if (quiet) return;
    msg.textContent = on ? 'Añadido a tus favoritos.' : 'Quitado de tus favoritos.';
    toast.hidden = false; clearTimeout(timer); timer = setTimeout(() => (toast.hidden = true), 4000);
  }
  btns.forEach((b) => b.addEventListener('click', () => set(!on)));
  document.getElementById('undo').addEventListener('click', () => { set(!on, true); toast.hidden = true; btns[1].focus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toast.hidden = true; });
</script>
