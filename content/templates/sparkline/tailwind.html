<div id="kpis" class="mx-auto grid max-w-3xl grid-cols-[repeat(auto-fit,minmax(170px,1fr))] gap-4 p-5"></div>
<script>
  const kpis = [
    { label: 'Ingresos', fmt: v => '$' + (v / 10).toFixed(1) + 'k', data: [31,34,33,38,36,41,40,45,43,48,47,52], goodWhenUp: true },
    { label: 'Cancelaciones', fmt: v => v, data: [14,15,13,16,12,13,11,12,10,11,9,8], goodWhenUp: false },
  ];
  const W = 120, H = 36, P = 4;
  kpis.forEach(k => {
    const d = k.data, min = Math.min(...d), max = Math.max(...d), first = d[0], last = d[d.length - 1];
    const X = i => P + i * (W - 2 * P) / (d.length - 1), Y = v => P + (1 - (v - min) / (max - min || 1)) * (H - 2 * P);
    const pct = Math.round((last - first) / first * 100), up = pct >= 0, good = up === k.goodWhenUp;
    // Clases completas (no concatenadas) para que Tailwind las detecte
    const tone = good ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400';
    const chip = good ? 'bg-emerald-50 dark:bg-emerald-950' : 'bg-rose-50 dark:bg-rose-950';
    const pts = d.map((v, i) => `${X(i)},${Y(v)}`).join(' L');
    const el = document.createElement('article');
    el.className = 'flex flex-col items-start gap-1 rounded-lg border border-slate-200 bg-white p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100';
    el.innerHTML = `<small class="text-[13px] text-slate-500 dark:text-slate-400">${k.label}</small>
      <strong class="text-2xl font-semibold tabular-nums">${k.fmt(last)}</strong>
      <span class="rounded-full px-2 text-xs font-semibold tabular-nums ${tone} ${chip}">${up ? '▲' : '▼'} ${Math.abs(pct)}% en 12 semanas</span>
      <svg class="mt-2.5 block h-auto w-full overflow-visible ${tone}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${k.label}: de ${k.fmt(first)} a ${k.fmt(last)} en 12 semanas">
        <path d="M${X(0)},${H} L${pts} L${X(d.length - 1)},${H}Z" fill="currentColor" opacity=".12"/>
        <path d="M${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${X(d.length - 1)}" cy="${Y(last)}" r="3" stroke="currentColor" stroke-width="2" class="fill-white dark:fill-slate-900"/>
      </svg>`;
    document.getElementById('kpis').appendChild(el);
  });
</script>
