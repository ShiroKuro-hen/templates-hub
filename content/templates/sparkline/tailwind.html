<div id="kpis" class="mx-auto grid max-w-3xl grid-cols-[repeat(auto-fit,minmax(148px,1fr))] gap-3.5 p-[18px]"></div>
<script>
  const kpis = [
    { label: 'Ingresos', fmt: v => '$' + (v / 10).toFixed(1) + 'k', data: [31,34,33,38,36,41,40,45,43,48,47,52], goodWhenUp: true },
    { label: 'Cancelaciones', fmt: v => v, data: [14,15,13,16,12,13,11,12,10,11,9,8], goodWhenUp: false },
  ];
  const NS = 'http://www.w3.org/2000/svg', W = 120, H = 36, P = 4;
  kpis.forEach(k => {
    const d = k.data, min = Math.min(...d), max = Math.max(...d), first = d[0], last = d[d.length - 1];
    const X = i => P + i * (W - 2 * P) / (d.length - 1), Y = v => P + (1 - (v - min) / (max - min || 1)) * (H - 2 * P);
    const pct = Math.round((last - first) / first * 100), up = pct >= 0;
    const color = up === k.goodWhenUp ? '#1f9d55' : '#d6293e', text = up === k.goodWhenUp ? 'text-[#1a7f47]' : 'text-[#d6293e]';
    const pts = d.map((v, i) => `${X(i)},${Y(v)}`).join(' L');
    const el = document.createElement('article');
    el.className = 'flex flex-col gap-0.5 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-3.5 shadow-[4px_4px_0_#17130f]';
    el.innerHTML = `<small class="font-semibold text-[#6b6258]">${k.label}</small>
      <strong class="text-[1.7rem] leading-tight tracking-tight tabular-nums">${k.fmt(last)}</strong>
      <span class="font-mono text-[.8rem] font-bold ${text}">${up ? '▲' : '▼'} ${Math.abs(pct)}% en 12 semanas</span>
      <svg class="mt-2 block h-auto w-full overflow-visible" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${k.label}: de ${k.fmt(first)} a ${k.fmt(last)} en 12 semanas">
        <path d="M${X(0)},${H} L${pts} L${X(d.length - 1)},${H}Z" fill="${color}" opacity=".18"/>
        <path d="M${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${X(d.length - 1)}" cy="${Y(last)}" r="3.5" fill="#fffdf8" stroke="#17130f" stroke-width="2"/>
      </svg>`;
    document.getElementById('kpis').appendChild(el);
  });
</script>
