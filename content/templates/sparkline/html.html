<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:18px;font:14px/1.4 system-ui,sans-serif;background:#f6f1e7;color:#17130f}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;max-width:760px;margin:0 auto}
  .kpi{display:flex;flex-direction:column;gap:2px;padding:14px;border:2px solid #17130f;border-radius:10px;background:#fffdf8;box-shadow:4px 4px 0 #17130f}
  .kpi small{color:#6b6258;font-weight:600}
  .kpi strong{font-size:1.7rem;line-height:1.15;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .delta{font:700 .8rem ui-monospace,monospace}
  .good{color:#1a7f47}.bad{color:#d6293e}
  .spark{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
  .spark .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .spark .area{opacity:.18}
  .spark .end{stroke:#17130f;stroke-width:2;fill:#fffdf8}
  .good .line,.good .bar{stroke:#1f9d55;fill:#1f9d55}.good .area{fill:#1f9d55}
  .bad .line,.bad .bar{stroke:#d6293e;fill:#d6293e}.bad .area{fill:#d6293e}
  .spark .line{fill:none}
  .spark .bar{stroke:none}
  @media(prefers-reduced-motion:no-preference){.spark .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}.spark .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s ease-out both}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes grow{from{transform:scaleY(0)}}
</style>
</head>
<body>
  <div class="kpis" id="kpis"></div>
<script>
  const kpis = [
    { label: 'Ingresos', fmt: v => '$' + (v / 10).toFixed(1) + 'k', data: [31,34,33,38,36,41,40,45,43,48,47,52], goodWhenUp: true },
    { label: 'Usuarios activos', fmt: v => (v * 24).toLocaleString('es'), data: [60,62,61,66,70,69,74,78,77,83,88,92], goodWhenUp: true },
    { label: 'Cancelaciones', fmt: v => v, data: [14,15,13,16,12,13,11,12,10,11,9,8], goodWhenUp: false },
    { label: 'Tickets abiertos', fmt: v => v, data: [22,18,25,21,30,24,19,28,33,29,35,38], goodWhenUp: false, bars: true },
  ];
  const NS = 'http://www.w3.org/2000/svg', W = 120, H = 36, P = 4;
  const root = document.getElementById('kpis');
  kpis.forEach(k => {
    const d = k.data, min = Math.min(...d), max = Math.max(...d), last = d[d.length - 1], first = d[0];
    const X = i => P + i * (W - 2 * P) / (d.length - 1), Y = v => P + (1 - (v - min) / (max - min || 1)) * (H - 2 * P);
    const pct = Math.round((last - first) / first * 100), up = pct >= 0, good = up === k.goodWhenUp;
    let g;
    if (k.bars) {
      const bw = (W - 2 * P) / d.length;
      const Yb = v => P + (1 - v / max) * (H - 2 * P); // barras parten de 0
      g = d.map((v, i) => `<rect class="bar" x="${P + i * bw + 1}" y="${Yb(v)}" width="${bw - 2}" height="${H - P - Yb(v)}" rx="1.5"/>`).join('');
    } else {
      const pts = d.map((v, i) => `${X(i)},${Y(v)}`).join(' L');
      g = `<path class="area" d="M${X(0)},${H} L${pts} L${X(d.length - 1)},${H}Z"/><path class="line" pathLength="1" d="M${pts}"/><circle class="end" cx="${X(d.length - 1)}" cy="${Y(last)}" r="3.5"/>`;
    }
    const el = document.createElement('article');
    el.className = 'kpi ' + (good ? 'good' : 'bad');
    el.innerHTML = `<small>${k.label}</small><strong>${k.fmt(last)}</strong>
      <span class="delta">${up ? '▲' : '▼'} ${Math.abs(pct)}% en 12 semanas</span>
      <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${k.label}: de ${k.fmt(first)} a ${k.fmt(last)} en 12 semanas">${g}</svg>`;
    root.appendChild(el);
  });
</script>
</body>
</html>
