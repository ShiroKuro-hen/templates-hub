<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparklines en tarjetas KPI</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:16px; max-width:900px; margin:0 auto; }
  .kpi { display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .kpi small { color:var(--muted); font-size:.8125rem; }
  .kpi strong { font-size:1.6rem; font-weight:600; line-height:1.2; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .delta { padding:1px 8px; border-radius:999px; font-size:.75rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .good { --tone:var(--ok); --tone-soft:var(--ok-soft); } .bad { --tone:var(--err); --tone-soft:var(--err-soft); }
  .delta { color:var(--tone); background:var(--tone-soft); }
  .spark { display:block; width:100%; height:auto; margin-top:10px; overflow:visible; color:var(--tone); }
  .spark .line { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .spark .area { fill:currentColor; opacity:.12; }
  .spark .bar { fill:currentColor; opacity:.85; }
  .spark .end { fill:var(--surface); stroke:currentColor; stroke-width:2; }
  @media (prefers-reduced-motion:no-preference) {
    .spark .line { stroke-dasharray:1; stroke-dashoffset:1; animation:draw .9s ease-out forwards; }
    .spark .bar { transform-box:fill-box; transform-origin:bottom; animation:grow .6s ease-out both; }
  }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes grow { from { transform:scaleY(0); } }
</style>
</head>
<body>
  <div class="kpis" id="kpis"></div>
<script>
  const kpis = [
    { label: 'Ingresos', fmt: v => '$' + (v / 10).toFixed(1) + 'k', data: [31,34,33,38,36,41,40,45,43,48,47,52], goodWhenUp: true },
    { label: 'Usuarios activos', fmt: v => (v * 24).toLocaleString('es'), data: [60,62,61,66,70,69,74,78,77,83,88,92], goodWhenUp: true },
    { label: 'Cancelaciones', fmt: v => v, data: [14,15,13,16,12,13,11,12,10,11,9,8], goodWhenUp: false },
    { label: 'Tickets abiertos', fmt: v => v, data: [22,18,25,21,30,24,19,28,33,29,35,38], goodWhenUp: false, bars: true },
  ];
  const W = 120, H = 36, P = 4;
  const root = document.getElementById('kpis');
  kpis.forEach(k => {
    const d = k.data, min = Math.min(...d), max = Math.max(...d), last = d[d.length - 1], first = d[0];
    const X = i => P + i * (W - 2 * P) / (d.length - 1), Y = v => P + (1 - (v - min) / (max - min || 1)) * (H - 2 * P);
    const pct = Math.round((last - first) / first * 100), up = pct >= 0, good = up === k.goodWhenUp;
    let g;
    if (k.bars) {
      const bw = (W - 2 * P) / d.length;
      const Yb = v => P + (1 - v / max) * (H - 2 * P); // barras parten de 0
      g = d.map((v, i) => `<rect class="bar" x="${P + i * bw + 1}" y="${Yb(v)}" width="${bw - 2}" height="${H - P - Yb(v)}" rx="1.5"/>`).join('');
    } else {
      const pts = d.map((v, i) => `${X(i)},${Y(v)}`).join(' L');
      g = `<path class="area" d="M${X(0)},${H} L${pts} L${X(d.length - 1)},${H}Z"/><path class="line" pathLength="1" d="M${pts}"/><circle class="end" cx="${X(d.length - 1)}" cy="${Y(last)}" r="3"/>`;
    }
    const el = document.createElement('article');
    el.className = 'kpi ' + (good ? 'good' : 'bad');
    el.innerHTML = `<small>${k.label}</small><strong>${k.fmt(last)}</strong>
      <span class="delta">${up ? '▲' : '▼'} ${Math.abs(pct)}% en 12 semanas</span>
      <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de ${k.label}: de ${k.fmt(first)} a ${k.fmt(last)} en 12 semanas">${g}</svg>`;
    root.appendChild(el);
  });
</script>
</body>
</html>
