<div id="row" class="flex flex-wrap gap-2.5 p-5 text-sm text-slate-900 dark:text-slate-100"></div>

<ul id="toasts" aria-live="polite" aria-label="Notificaciones"
    class="fixed right-3 bottom-3 m-0 flex w-[340px] max-w-[calc(100%-1.5rem)] list-none flex-col gap-2 p-0"></ul>

<script>
  // Clases completas por tipo (Tailwind necesita verlas enteras).
  const TYPES = {
    ok:   { btn: 'Guardar', bar: 'before:bg-emerald-600', title: 'Cambios guardados', text: 'Tu perfil ya está actualizado.', role: 'status' },
    err:  { btn: 'Falla de red', bar: 'before:bg-red-600', title: 'No se pudo conectar', text: 'Revisa tu conexión e inténtalo de nuevo.', role: 'alert' },
    info: { btn: 'Nuevo mensaje', bar: 'before:bg-blue-600', title: 'Mensaje nuevo de Ana', text: '«¿Revisamos el informe hoy?»', role: 'status' },
    warn: { btn: 'Poco espacio', bar: 'before:bg-amber-600', title: 'Almacenamiento al 90 %', text: 'Libera espacio para seguir subiendo.', role: 'status' },
  };
  const box = document.getElementById('toasts');
  document.getElementById('row').innerHTML = Object.entries(TYPES).map(([k, t]) =>
    `<button type="button" data-t="${k}" class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 font-semibold shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900">${t.btn}</button>`).join('');
  document.querySelectorAll('[data-t]').forEach((btn) => btn.addEventListener('click', () => {
    const t = TYPES[btn.dataset.t];
    const li = document.createElement('li');
    li.setAttribute('role', t.role);
    li.className = `relative flex items-center gap-3 overflow-hidden rounded-lg border border-slate-200 bg-white py-3 pr-2.5 pl-4 text-slate-900 shadow-sm before:absolute before:inset-y-0 before:left-0 before:w-[3px] dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 ${t.bar}`;
    li.innerHTML = '<span class="flex-1 text-sm"><b class="block font-semibold"></b><small class="text-[13px] text-slate-500 dark:text-slate-400"></small></span>' +
      '<button type="button" aria-label="Cerrar aviso" class="h-7 w-7 rounded-lg text-lg leading-none text-slate-500 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800">×</button>';
    li.querySelector('b').textContent = t.title;
    li.querySelector('small').textContent = t.text;
    const close = () => li.remove();
    let timer = setTimeout(close, 5000);
    li.querySelector('button').onclick = close;
    li.onmouseenter = () => clearTimeout(timer);
    li.onmouseleave = () => { timer = setTimeout(close, 5000); };
    box.append(li);
    while (box.children.length > 4) box.firstElementChild.remove();
  }));
</script>
