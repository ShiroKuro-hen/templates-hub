<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toasts apilables</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:-.01em; }
  p { margin:0 0 16px; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  button { font:inherit; font-weight:600; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .14s; }
  button:hover { border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .toasts { position:fixed; right:12px; bottom:12px; width:min(340px, calc(100% - 24px)); display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
  .toast { --c:var(--accent); position:relative; display:flex; align-items:center; gap:12px; padding:12px 10px 12px 16px; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); animation:in .16s ease-out; }
  .toast::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--c); }
  .toast.ok { --c:var(--ok); } .toast.warn { --c:var(--warn); } .toast.err { --c:var(--err); }
  .toast span { flex:1; }
  .toast b { display:block; font-weight:600; }
  .toast small { color:var(--muted); font-size:13px; }
  .toast button { padding:0; width:28px; height:28px; border:0; box-shadow:none; background:none; color:var(--muted); font-size:18px; line-height:1; }
  .toast button:hover { background:var(--bg); color:var(--text); }
  .toast.out { opacity:0; transform:translateX(24px); transition:opacity .16s, transform .16s; }
  @keyframes in { from { opacity:0; transform:translateY(12px); } }
  @media (prefers-reduced-motion:reduce) { .toast { animation:none; } .toast.out { transition:none; transform:none; } * { transition:none !important; } }
</style>
</head>
<body>
<h1>Avisos emergentes</h1>
<p>Se apilan y se cierran solos a los 5 s. Pausa con el cursor.</p>
<div class="row">
  <button data-t="ok">Guardar</button>
  <button data-t="err">Falla de red</button>
  <button data-t="info">Nuevo mensaje</button>
  <button data-t="warn">Poco espacio</button>
</div>
<ul class="toasts" id="toasts" aria-live="polite" aria-label="Notificaciones"></ul>
<script>
  const MSG = {
    ok:   ['Cambios guardados', 'Tu perfil ya está actualizado.'],
    err:  ['No se pudo conectar', 'Revisa tu conexión e inténtalo de nuevo.'],
    info: ['Mensaje nuevo de Ana', '«¿Revisamos el informe hoy?»'],
    warn: ['Almacenamiento al 90 %', 'Libera espacio para seguir subiendo.'],
  };
  const box = document.getElementById('toasts');
  function toast(type) {
    const [title, text] = MSG[type];
    const li = document.createElement('li');
    li.className = 'toast ' + type;
    li.setAttribute('role', type === 'err' ? 'alert' : 'status');
    li.innerHTML = '<span><b></b><small></small></span><button type="button" aria-label="Cerrar aviso">×</button>';
    li.querySelector('b').textContent = title;
    li.querySelector('small').textContent = text;
    let timer;
    const close = () => { clearTimeout(timer); li.classList.add('out'); setTimeout(() => li.remove(), 160); };
    const start = () => { timer = setTimeout(close, 5000); };
    li.querySelector('button').onclick = close;
    li.onmouseenter = () => clearTimeout(timer);
    li.onmouseleave = start;
    box.append(li);
    while (box.children.length > 4) box.firstElementChild.remove();
    start();
  }
  document.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => toast(b.dataset.t)));
</script>
</body>
</html>
