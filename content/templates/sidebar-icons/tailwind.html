    [&_a[aria-current]]:before:absolute [&_a[aria-current]]:before:-left-2 [&_a[aria-current]]:before:inset-y-2.5 [&_a[aria-current]]:before:w-[3px] [&_a[aria-current]]:before:rounded-full [&_a[aria-current]]:before:bg-gradient-to-br [&_a[aria-current]]:before:from-accent-2 [&_a[aria-current]]:before:to-accent

    </ul>

  <main class="px-6 py-5"><h1 id="h" class="mb-1 text-lg font-semibold">Inicio</h1><p id="d" aria-live="polite" class="text-muted">Resumen de actividad de tu equipo esta semana.</p></main>
</div>
</div>
<script>
  const rail = document.getElementById('rail'), links = [...rail.querySelectorAll('a')];
  rail.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    links.forEach((l) => l.removeAttribute('aria-current')); a.setAttribute('aria-current', 'page');
    document.getElementById('h').textContent = a.dataset.tip; document.getElementById('d').textContent = a.dataset.d;
  });
  rail.addEventListener('keydown', (e) => { if (e.key === 'Escape') rail.dataset.esc = ''; });
  ['mouseover', 'focusin'].forEach((ev) => rail.addEventListener(ev, () => rail.removeAttribute('data-esc')));
</script>
