<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{display:grid;grid-template-columns:56px 1fr;max-width:720px;min-height:340px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .rail{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-right:1px solid var(--border)}
  .rail ul{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
  .rail ul:last-child{margin-top:auto}
  .logo{width:28px;height:28px;margin-bottom:12px;border-radius:var(--radius);background:var(--accent)}
  .rail a{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:var(--radius);color:var(--muted);transition:background .14s,color .14s}
  .rail a:hover{background:var(--accent-soft);color:var(--text)}
  .rail a[aria-current=page]{background:var(--accent-soft);color:var(--text)}
  .rail a[aria-current=page]::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .rail a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .n{position:absolute;top:2px;right:2px;min-width:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
  .rail a::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);padding:4px 10px;border-radius:6px;background:var(--text);color:var(--bg);font-size:12px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s,visibility .14s}
  .rail a:hover::after,.rail a:focus-visible::after{opacity:1;visibility:visible}
  .rail[data-esc] a::after{display:none}
  main{padding:20px 24px}
  h1{margin:0 0 4px;font-size:18px}
  main p{margin:0;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-4v-6H8v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
</svg>
<div class="app">
  <nav class="rail" id="rail" aria-label="Principal">
    <span class="logo" aria-hidden="true"></span>
    <ul>
      <li><a href="#inicio" data-tip="Inicio" aria-label="Inicio" aria-current="page" data-d="Resumen de actividad de tu equipo esta semana."><svg aria-hidden="true"><use href="#i-home"/></svg></a></li>
      <li><a href="#proyectos" data-tip="Proyectos" aria-label="Proyectos" data-d="Tienes 8 proyectos activos y 2 por revisar."><svg aria-hidden="true"><use href="#i-folder"/></svg></a></li>
      <li><a href="#mensajes" data-tip="Mensajes" aria-label="Mensajes, 3 sin leer" data-d="Tienes 3 mensajes sin leer."><svg aria-hidden="true"><use href="#i-chat"/></svg><span class="n" aria-hidden="true">3</span></a></li>
      <li><a href="#analitica" data-tip="Analítica" aria-label="Analítica" data-d="Las visitas subieron un 12 % frente a la semana pasada."><svg aria-hidden="true"><use href="#i-chart"/></svg></a></li>
      <li><a href="#equipo" data-tip="Equipo" aria-label="Equipo" data-d="12 personas en 3 equipos. Invita a alguien nuevo."><svg aria-hidden="true"><use href="#i-users"/></svg></a></li>
    </ul>
    <ul>
      <li><a href="#ajustes" data-tip="Ajustes" aria-label="Ajustes" data-d="Gestiona tu cuenta, el plan y las integraciones."><svg aria-hidden="true"><use href="#i-sliders"/></svg></a></li>
    </ul>
  </nav>
  <main><h1 id="h">Inicio</h1><p id="d" aria-live="polite">Resumen de actividad de tu equipo esta semana.</p></main>
</div>
<script>
  const rail = document.getElementById('rail'), links = [...rail.querySelectorAll('a')];
  rail.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    links.forEach((l) => l.removeAttribute('aria-current')); a.setAttribute('aria-current', 'page');
    document.getElementById('h').textContent = a.dataset.tip; document.getElementById('d').textContent = a.dataset.d;
  });
  rail.addEventListener('keydown', (e) => { if (e.key === 'Escape') rail.dataset.esc = ''; });
  ['mouseover', 'focusin'].forEach((ev) => rail.addEventListener(ev, () => rail.removeAttribute('data-esc')));
</script>
</body>
</html>
