<div id="g" class="grid grid-cols-[repeat(auto-fill,minmax(250px,1fr))] gap-4 bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100"></div>
<script>
  const GRADS = [
    ['Ultramar', 'from-cyan-600 to-blue-600 dark:from-sky-400 dark:to-blue-400', 'Marca principal. Úsalo en encabezados y llamadas a la acción.'],
    ['Aurora', 'from-emerald-600 to-cyan-600 dark:from-emerald-400 dark:to-sky-400', 'Estados positivos, métricas en crecimiento y logros.'],
    ['Brasa', 'from-amber-600 to-rose-600 dark:from-amber-400 dark:to-rose-400', 'Avisos destacados y ofertas con fecha límite.'],
    ['Nebulosa', 'from-blue-600 to-rose-600 dark:from-blue-400 dark:to-rose-400', 'Campañas y lanzamientos. Úsalo poco.'],
  ];
  const BTN = 'cursor-pointer rounded-lg border border-slate-200 bg-white px-3 py-1 transition-colors hover:border-blue-500 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800';
  g.innerHTML = GRADS.map(([name, cls, use]) => `
    <article class="rounded-lg border border-slate-200 bg-white p-3 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <div class="h-24 rounded-lg bg-gradient-to-br ${cls}" role="img" aria-label="Muestra del degradado ${name}"></div>
      <h3 class="mt-3 font-semibold">${name}</h3>
      <p class="text-slate-500 dark:text-slate-400">${use}</p>
      <div class="my-3 grid gap-2.5">
        <div class="rounded-lg bg-gradient-to-br p-px ${cls}"><div class="rounded-[7px] bg-white px-3 py-2 dark:bg-slate-900">Borde degradado</div></div>
        <div class="h-1.5 rounded-full bg-gradient-to-br ${cls}" role="img" aria-label="Barra con degradado ${name}"></div>
      </div>
      <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 py-1 pl-2.5 pr-1 dark:border-slate-700 dark:bg-slate-950">
        <code class="min-w-0 flex-1 truncate font-mono text-xs">bg-gradient-to-br ${cls.split(' ').slice(0, 2).join(' ')}</code>
        <button type="button" class="${BTN}" data-css="bg-gradient-to-br ${cls}" aria-label="Copiar clases de ${name}">Copiar</button>
      </div>
    </article>`).join('');
  g.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.css); b.textContent = 'Copiado'; }
    catch { b.textContent = 'Sin acceso'; }
    setTimeout(() => (b.textContent = 'Copiar'), 1500);
  });
</script>
