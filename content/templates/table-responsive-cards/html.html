<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{position:relative;max-width:820px;margin:0 auto;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#22d3ee,#2f5bff,transparent)}
  h2{margin:0;padding:16px 20px;font-size:16px;border-bottom:1px solid var(--border)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 20px;text-align:left;border-bottom:1px solid var(--border)}
  thead th{color:var(--muted);font-weight:600}
  tbody tr:last-child>*{border-bottom:0}
  tbody tr:hover{background:var(--accent-soft)}
  tbody th{font-weight:600}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .b{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text)}
  .b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b.ok{background:var(--ok-soft)} .b.ok::before{color:var(--ok)}
  .b.warn{background:var(--warn-soft)} .b.warn::before{color:var(--warn)}
  .b.err{background:var(--err-soft)} .b.err::before{color:var(--err)}
  @media (max-width:639px){
    table,tbody,tr{display:block}
    thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    tbody{display:grid;gap:12px;padding:12px}
    tr{padding:0 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
    tbody tr:hover{background:var(--surface)}
    tbody tr:last-child>*{border-bottom:1px solid var(--border)}
    tbody tr>:last-child{border-bottom:0!important}
    th,td{padding:10px 0}
    td{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right}
    td::before{content:attr(data-label);color:var(--muted);text-align:left}
    tbody th{display:block;font-size:15px}
  }
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h2 id="t">Facturas de octubre</h2>
  <table role="table" aria-labelledby="t">
    <thead role="rowgroup">
      <tr role="row"><th role="columnheader" scope="col">Factura</th><th role="columnheader" scope="col">Cliente</th><th role="columnheader" scope="col">Fecha</th><th role="columnheader" scope="col">Estado</th><th role="columnheader" scope="col" class="num">Importe</th></tr>
    </thead>
    <tbody role="rowgroup">
      <tr role="row"><th role="rowheader" scope="row">F-2041</th><td role="cell" data-label="Cliente">Textiles Andina</td><td role="cell" data-label="Fecha">3 oct 2026</td><td role="cell" data-label="Estado"><span class="b ok">Pagada</span></td><td role="cell" data-label="Importe" class="num">S/ 2,480.00</td></tr>
      <tr role="row"><th role="rowheader" scope="row">F-2040</th><td role="cell" data-label="Cliente">Café del Valle</td><td role="cell" data-label="Fecha">1 oct 2026</td><td role="cell" data-label="Estado"><span class="b warn">Pendiente</span></td><td role="cell" data-label="Importe" class="num">S/ 960.50</td></tr>
      <tr role="row"><th role="rowheader" scope="row">F-2039</th><td role="cell" data-label="Cliente">Logística Pacífico</td><td role="cell" data-label="Fecha">28 sep 2026</td><td role="cell" data-label="Estado"><span class="b ok">Pagada</span></td><td role="cell" data-label="Importe" class="num">S/ 5,310.00</td></tr>
      <tr role="row"><th role="rowheader" scope="row">F-2038</th><td role="cell" data-label="Cliente">Estudio Mirador</td><td role="cell" data-label="Fecha">25 sep 2026</td><td role="cell" data-label="Estado"><span class="b err">Vencida</span></td><td role="cell" data-label="Importe" class="num">S/ 740.00</td></tr>
    </tbody>
  </table>
</section>
</body>
</html>
