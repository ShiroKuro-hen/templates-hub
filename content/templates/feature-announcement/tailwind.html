<div class="bg-page p-5 text-sm text-fg">
  <button type="button" id="open" class="inline-flex h-9 items-center gap-2 rounded-lg border border-line bg-surface px-4 font-medium hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    Ver novedades <span class="rounded-full bg-accent-soft px-2 text-xs font-semibold text-accent">Nuevo</span>
  </button>
  <p id="st" role="status" class="mt-3 text-muted"></p>
  <dialog id="dlg" aria-labelledby="ttl" aria-describedby="desc"
    class="m-auto w-[min(440px,calc(100vw-32px))] overflow-hidden rounded-lg border border-line bg-surface p-0 text-fg shadow-lg backdrop:bg-fg/50">
    <svg viewBox="0 0 440 150" aria-hidden="true" class="block h-auto w-full border-b border-line">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>
      <rect width="440" height="150" class="fill-accent-soft"/>
      <g transform="translate(56 24)">
        <rect width="170" height="104" rx="8" class="fill-surface stroke-line"/>
        <rect x="14" y="14" width="64" height="6" rx="3" class="fill-line"/>
        <rect x="18" y="58" width="22" height="30" rx="3" class="fill-accent-soft"/>
        <rect x="50" y="42" width="22" height="46" rx="3" class="fill-accent-soft"/>
        <rect x="82" y="26" width="22" height="62" rx="3" fill="url(#g)"/>
        <rect x="114" y="48" width="22" height="40" rx="3" class="fill-accent-soft"/>
      </g>
      <path d="M226 76h24" fill="none" stroke-dasharray="3 3" class="stroke-accent"/>
      <g transform="translate(250 44)">
        <rect width="134" height="64" rx="8" class="fill-surface stroke-line"/>
        <circle cx="26" cy="32" r="12" fill="url(#g)"/>
        <rect x="46" y="22" width="68" height="6" rx="3" class="fill-muted"/>
        <text x="46" y="48" font-size="11" class="fill-muted">Lunes, 08:00</text>
      </g>
    </svg>
    <button type="button" id="close" aria-label="Cerrar" class="absolute right-2.5 top-2.5 grid size-8 place-items-center rounded-lg border border-line bg-surface text-muted hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
    <div class="p-5">
      <span class="inline-block rounded-full bg-accent-soft px-2 text-xs font-semibold text-accent">Novedad</span>
      <h2 id="ttl" class="mb-1 mt-2 text-lg font-semibold">Informes programados</h2>
      <p id="desc" class="text-muted">Recibe tus paneles por correo sin abrir la aplicación.</p>
      <ul class="mt-4 grid gap-2 [&_li]:flex [&_li]:gap-2 [&_svg]:mt-1 [&_svg]:shrink-0 [&_svg]:text-ok">
        <li><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>Elige día y hora de envío.</li>
        <li><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>Añade a quien quieras como destinatario.</li>
        <li><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>Exporta en PDF o CSV.</li>
      </ul>
    </div>
    <form method="dialog" class="flex justify-end gap-2 px-5 pb-5 [&>button]:h-9 [&>button]:rounded-lg [&>button]:border [&>button]:border-line [&>button]:px-4 [&>button]:font-medium [&>button:focus-visible]:outline-2 [&>button:focus-visible]:outline-offset-2 [&>button:focus-visible]:outline-accent">
      <button value="later" class="hover:bg-accent-soft">Más tarde</button>
      <button value="try" autofocus class="!border-accent bg-accent text-accent-ink hover:brightness-90">Probar ahora</button>
    </form>
  </dialog>
</div>
<script>
  const dlg = document.getElementById('dlg'), st = document.getElementById('st');
  document.getElementById('open').onclick = () => dlg.showModal();
  document.getElementById('close').onclick = () => dlg.close();
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { st.textContent = dlg.returnValue === 'try' ? 'Abriendo informes programados.' : ''; dlg.returnValue = ''; });
  dlg.showModal();
</script>
