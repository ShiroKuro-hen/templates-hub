<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura por capas</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{max-width:620px;margin:0 auto;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  h2{margin:0;font-size:16px;font-weight:600}
  .card p{margin:2px 0 12px;color:var(--muted)}
  svg{display:block;width:100%;height:auto}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scroll:focus-visible{outline:2px solid var(--accent)}
  .scroll>svg{min-width:514px}
  .edge{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#arr);transition:stroke .15s,opacity .15s}
  .edge.hl{stroke:var(--accent);stroke-width:2.5;marker-end:url(#arr-hl)}
  .lb{fill:var(--muted);font-size:12px;transition:opacity .15s}
  .lb.hl{fill:var(--accent);font-weight:600}
  .node{cursor:pointer;transition:opacity .15s}
  .box{fill:var(--bg);stroke:var(--border);stroke-width:1}
  .node.hl .box{stroke:var(--accent)}
  .node:focus-visible .box{stroke:var(--accent);stroke-width:2}
  .name{fill:var(--text);font-size:14px;font-weight:600}
  .detail{fill:var(--muted);font-size:13px}
  svg.active .node:not(.hl),svg.active .edge:not(.hl),svg.active .lb:not(.hl){opacity:.35}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13px}
  .legend li{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<figure class="card">
  <figcaption>
    <h2>Arquitectura por capas</h2>
    <p>Cada capa solo llama a la inmediatamente inferior. Pasa el cursor o enfoca una capa para ver sus dependencias.</p>
  </figcaption>
  <div class="scroll" role="region" tabindex="0" aria-label="Diagrama desplazable horizontalmente">
  <svg id="arch" viewBox="0 0 560 500" role="img" aria-labelledby="arch-t arch-d">
    <title id="arch-t">Arquitectura en cinco capas</title>
    <desc id="arch-d">Cliente, Edge y CDN, API, Servicios y Datos, unidas de arriba abajo por flechas que indican la dependencia.</desc>
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10Z" style="fill:var(--muted)"/></marker>
      <marker id="arr-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10Z" style="fill:var(--accent)"/></marker>
    </defs>
  </svg>
  </div>
  <ul class="legend" aria-label="Leyenda">
    <li><i style="--c:var(--info)"></i>Entrada</li>
    <li><i style="--c:var(--accent)"></i>Lógica de negocio</li>
    <li><i style="--c:var(--ok)"></i>Persistencia</li>
  </ul>
</figure>
<script>
  const layers = [
    { id: 'cliente', name: 'Cliente', detail: 'Web SPA · App móvil', tone: 'info', via: 'HTTPS' },
    { id: 'edge', name: 'Edge / CDN', detail: 'CDN · WAF · Balanceador', tone: 'info', via: 'HTTPS · JSON' },
    { id: 'api', name: 'API', detail: 'Gateway · Autenticación · REST', tone: 'accent', via: 'gRPC' },
    { id: 'servicios', name: 'Servicios', detail: 'Pedidos · Catálogo · Pagos', tone: 'accent', via: 'SQL · caché' },
    { id: 'datos', name: 'Datos', detail: 'PostgreSQL · Redis · S3', tone: 'ok' },
  ];
  const svg = document.getElementById('arch');
  const Y = (i) => 20 + i * 100;
  const edge = (l, i) => `<path class="edge" d="M280,${Y(i) + 56} V${Y(i + 1)}" data-a="${l.id}" data-b="${layers[i + 1].id}"/>
    <text class="lb" x="292" y="${Y(i) + 82}" data-a="${l.id}" data-b="${layers[i + 1].id}">${l.via}</text>`;
  const node = (l, i) => `<g class="node" data-id="${l.id}" tabindex="0" role="group" aria-label="${l.name}: ${l.detail}">
    <rect class="box" x="40" y="${Y(i)}" width="480" height="56" rx="6"/>
    <rect x="40" y="${Y(i)}" width="4" height="56" style="fill:var(--${l.tone})"/>
    <text class="name" x="60" y="${Y(i) + 24}">${l.name}</text>
    <text class="detail" x="60" y="${Y(i) + 44}">${l.detail}</text>
  </g>`;
  svg.insertAdjacentHTML('beforeend', layers.slice(0, -1).map(edge).join('') + layers.map(node).join(''));

  function mark(id) {
    const linked = (el) => Boolean(id) && (el.dataset.a === id || el.dataset.b === id);
    const ends = new Set([id]);
    svg.querySelectorAll('[data-a]').forEach((e) => { if (linked(e)) ends.add(e.dataset.a).add(e.dataset.b); });
    svg.classList.toggle('active', Boolean(id));
    svg.querySelectorAll('[data-a]').forEach((e) => e.classList.toggle('hl', linked(e)));
    svg.querySelectorAll('[data-id]').forEach((n) => n.classList.toggle('hl', ends.has(n.dataset.id)));
  }
  const idOf = (e) => e.target.closest('[data-id]')?.dataset.id;
  svg.addEventListener('mouseover', (e) => mark(idOf(e)));
  svg.addEventListener('mouseleave', () => mark(null));
  svg.addEventListener('focusin', (e) => mark(idOf(e)));
  svg.addEventListener('focusout', () => mark(null));
</script>
</body>
</html>
