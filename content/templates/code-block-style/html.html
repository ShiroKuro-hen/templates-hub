<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloque de código</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .code{position:relative;max-width:720px;margin:0 auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .code::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 8px 16px;border-bottom:1px solid var(--border)}
  .bar span{font:600 12px ui-monospace,"Cascadia Code",Menlo,monospace;color:var(--muted)}
  .copy{padding:4px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font:600 12px system-ui,sans-serif;cursor:pointer;transition:background .14s,border-color .14s,color .14s}
  .copy:hover{background:var(--accent-soft);border-color:var(--accent)}
  .copy[data-ok]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  pre{margin:0;padding:12px 0;overflow-x:auto;font:13px/1.65 ui-monospace,"Cascadia Code",Menlo,monospace;color:var(--text);tab-size:2}
  pre:focus-visible{outline-offset:-2px}
  code{display:block;counter-reset:line;min-width:max-content}
  .l{display:block;padding:0 16px 0 0;white-space:pre}
  .l::before{counter-increment:line;content:counter(line);display:inline-block;width:2.8em;margin-right:1em;padding-right:.6em;text-align:right;color:var(--muted);border-right:1px solid var(--border);font-variant-numeric:tabular-nums;user-select:none}
  .k{color:var(--accent)} .s{color:var(--ok)} .f{color:var(--info)} .n{color:var(--warn)} .c{color:var(--muted);font-style:italic}
  @media(prefers-reduced-motion:reduce){.copy{transition:none}}
</style>
</head>
<body>
  <figure class="code" style="margin-inline:auto">
    <figcaption class="bar">
      <span>saludar.ts</span>
      <button type="button" class="copy" aria-live="polite">Copiar</button>
    </figcaption>
    <pre tabindex="0" aria-label="Código de saludar.ts"><code><span class="l"><span class="c">// Devuelve un saludo según la hora</span></span><span class="l"><span class="k">export function</span> <span class="f">saludar</span>(nombre: <span class="k">string</span>, hora = <span class="k">new</span> <span class="f">Date</span>().<span class="f">getHours</span>()) {</span><span class="l">  <span class="k">const</span> momento = hora &lt; <span class="n">12</span> ? <span class="s">'Buenos días'</span> : <span class="s">'Buenas tardes'</span>;</span><span class="l">  <span class="k">return</span> <span class="s">`${momento}, ${nombre}`</span>;</span><span class="l">}</span></code></pre>
  </figure>
<script>
  const btn = document.querySelector('.copy');
  btn.addEventListener('click', async () => {
    const text = [...document.querySelectorAll('.l')].map(l => l.textContent).join('\n');
    try { await navigator.clipboard.writeText(text); }
    catch { // fallback si no hay permiso de portapapeles (iframe)
      const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select();
      try { document.execCommand('copy'); } catch {} t.remove();
    }
    btn.textContent = 'Copiado'; btn.dataset.ok = '';
    setTimeout(() => { btn.textContent = 'Copiar'; delete btn.dataset.ok; }, 1800);
  });
</script>
</body>
</html>
