<figure class="relative mx-auto my-5 max-w-2xl overflow-hidden rounded-lg border border-line bg-surface text-fg shadow-sm">
  <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-br from-accent-2 to-accent" aria-hidden="true"></div>
  <figcaption class="flex items-center justify-between gap-2 border-b border-line py-2.5 pl-4 pr-2.5">
    <span class="font-mono text-xs font-semibold text-muted">saludar.ts</span>
    <button type="button" id="copy" aria-live="polite"
      class="cursor-pointer rounded-lg border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg transition hover:border-accent hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Copiar</button>
  </figcaption>
  <!-- números de línea: contador CSS en cada .l -->
  <pre tabindex="0" aria-label="Código de saludar.ts" class="m-0 overflow-x-auto py-3 font-mono text-[13px] leading-relaxed focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"><code class="block min-w-max [counter-reset:line]"><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-line before:pr-[.6em] before:text-right before:tabular-nums before:text-muted before:content-[counter(line)] before:[counter-increment:line]"><span class="italic text-muted">// Devuelve un saludo según la hora</span></span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-line before:pr-[.6em] before:text-right before:tabular-nums before:text-muted before:content-[counter(line)] before:[counter-increment:line]"><span class="text-accent">export function</span> <span class="text-info">saludar</span>(nombre: <span class="text-accent">string</span>) {</span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-line before:pr-[.6em] before:text-right before:tabular-nums before:text-muted before:content-[counter(line)] before:[counter-increment:line]">  <span class="text-accent">return</span> <span class="text-ok">`Hola, ${nombre}`</span>;</span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-line before:pr-[.6em] before:text-right before:tabular-nums before:text-muted before:content-[counter(line)] before:[counter-increment:line]">}</span></code></pre>
</figure>
<script>
  const btn = document.getElementById('copy');
  btn.addEventListener('click', async () => {
    const text = [...document.querySelectorAll('.l')].map((l) => l.textContent).join('\n');
    try { await navigator.clipboard.writeText(text); } catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
    btn.textContent = 'Copiado';
    setTimeout(() => (btn.textContent = 'Copiar'), 1800);
  });
</script>
