<figure class="relative mx-auto my-5 max-w-2xl overflow-hidden rounded-lg border border-slate-200 bg-white text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-br from-cyan-400 to-blue-600" aria-hidden="true"></div>
  <figcaption class="flex items-center justify-between gap-2 border-b border-slate-200 py-2.5 pl-4 pr-2.5 dark:border-slate-700">
    <span class="font-mono text-xs font-semibold text-slate-500 dark:text-slate-400">saludar.ts</span>
    <button type="button" id="copy" aria-live="polite"
      class="cursor-pointer rounded-lg border border-slate-200 bg-white px-3 py-1 text-xs font-semibold text-slate-900 transition hover:border-blue-600 hover:bg-blue-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:border-blue-500 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Copiar</button>
  </figcaption>
  <!-- números de línea: contador CSS en cada .l -->
  <pre tabindex="0" aria-label="Código de saludar.ts" class="m-0 overflow-x-auto py-3 font-mono text-[13px] leading-relaxed focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500"><code class="block min-w-max [counter-reset:line]"><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-slate-200 before:pr-[.6em] before:text-right before:tabular-nums before:text-slate-500 before:content-[counter(line)] before:[counter-increment:line] dark:before:border-slate-700 dark:before:text-slate-400"><span class="italic text-slate-500 dark:text-slate-400">// Devuelve un saludo según la hora</span></span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-slate-200 before:pr-[.6em] before:text-right before:tabular-nums before:text-slate-500 before:content-[counter(line)] before:[counter-increment:line] dark:before:border-slate-700 dark:before:text-slate-400"><span class="text-blue-600 dark:text-blue-400">export function</span> <span class="text-cyan-600 dark:text-cyan-400">saludar</span>(nombre: <span class="text-blue-600 dark:text-blue-400">string</span>) {</span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-slate-200 before:pr-[.6em] before:text-right before:tabular-nums before:text-slate-500 before:content-[counter(line)] before:[counter-increment:line] dark:before:border-slate-700 dark:before:text-slate-400">  <span class="text-blue-600 dark:text-blue-400">return</span> <span class="text-emerald-600 dark:text-emerald-400">`Hola, ${nombre}`</span>;</span><span class="l block whitespace-pre pr-4 before:mr-4 before:inline-block before:w-[2.8em] before:select-none before:border-r before:border-slate-200 before:pr-[.6em] before:text-right before:tabular-nums before:text-slate-500 before:content-[counter(line)] before:[counter-increment:line] dark:before:border-slate-700 dark:before:text-slate-400">}</span></code></pre>
</figure>
<script>
  const btn = document.getElementById('copy');
  btn.addEventListener('click', async () => {
    const text = [...document.querySelectorAll('.l')].map((l) => l.textContent).join('\n');
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copiado';
    setTimeout(() => (btn.textContent = 'Copiar'), 1800);
  });
</script>
