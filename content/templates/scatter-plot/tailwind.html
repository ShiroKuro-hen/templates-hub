<figure class="m-0 rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <figcaption class="mb-4 flex flex-wrap justify-between gap-3">
    <div>
      <h2 class="m-0 text-base font-semibold">Gasto frente a clientes nuevos</h2>
      <p class="mt-0.5 text-slate-500 dark:text-slate-400">Cada punto es una campaña del primer semestre.</p>
    </div>
    <div id="lg" role="group" aria-label="Canales visibles" class="flex flex-wrap items-start gap-2"></div>
  </figcaption>
  <div class="relative">
    <svg id="svg" role="group" aria-label="Diagrama de dispersión de gasto y clientes nuevos" class="block h-80 w-full overflow-visible"></svg>
    <div id="tip" hidden class="pointer-events-none absolute min-w-36 rounded-lg border border-slate-200 bg-white px-3 py-2 text-[13px] shadow-md dark:border-slate-700 dark:bg-slate-900"></div>
  </div>
  <p class="mb-0 mt-3 text-[13px] text-slate-500 dark:text-slate-400">Usa Tab para entrar en el gráfico y las flechas para moverte entre campañas.</p>
</figure>
<script>
  const groups = [
    { n: 'Búsqueda', sw: 'bg-blue-600 dark:bg-blue-400', f: 'fill-blue-600 dark:fill-blue-400' },
    { n: 'Redes sociales', sw: 'bg-cyan-600 dark:bg-cyan-400', f: 'fill-cyan-600 dark:fill-cyan-400' },
    { n: 'Correo', sw: 'bg-emerald-600 dark:bg-emerald-400', f: 'fill-emerald-600 dark:fill-emerald-400' },
  ];
  // [campaña, gasto en miles de USD, clientes nuevos, canal]
  const pts = [
    ['Marca', 14, 52, 0], ['Competencia', 28, 88, 0], ['Genéricas', 45, 118, 0], ['Remarketing', 62, 170, 0], ['Shopping', 78, 196, 0],
    ['Reels', 10, 24, 1], ['Anuncios en feed', 26, 46, 1], ['Influencers', 44, 64, 1], ['Comunidad', 58, 92, 1], ['Video largo', 84, 104, 1],
    ['Bienvenida', 6, 48, 2], ['Carrito abandonado', 12, 92, 2], ['Boletín mensual', 20, 70, 2], ['Reactivación', 32, 110, 2],
  ].sort((a, b) => a[1] - b[1]);
  const on = new Set([0, 1, 2]), H = 320, L = 48, R = 12, T = 12, B = 44;
  let W = 560, cur = 0;
  const vis = () => pts.filter((p) => on.has(p[3]));
  const btn = 'inline-flex items-center gap-2 rounded-full border border-slate-200 px-3 py-1 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:hover:bg-slate-800';
  const ax = 'fill-slate-500 text-xs tabular-nums dark:fill-slate-400', gl = 'stroke-slate-200 dark:stroke-slate-700';
  function legend() {
    lg.innerHTML = groups.map((g, i) => `<button type="button" data-i="${i}" aria-pressed="${on.has(i)}" class="${btn} ${on.has(i) ? '' : 'text-slate-500 dark:text-slate-400'}"><i class="size-2.5 rounded-full ${g.sw} ${on.has(i) ? '' : 'opacity-30'}"></i>${g.n}</button>`).join('')
      + '<span class="inline-flex items-center gap-2 rounded-full border border-dashed border-slate-200 px-3 py-1 text-slate-500 dark:border-slate-700 dark:text-slate-400"><i class="h-[3px] w-4 rounded-sm bg-gradient-to-r from-cyan-400 to-blue-600"></i>Tendencia</span>';
  }
  function draw() {
    W = svg.clientWidth || 560;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const x = (v) => L + (W - L - R) * v / 100, y = (v) => T + (H - T - B) * (1 - v / 200), v = vis();
    let s = '<defs><linearGradient id="tg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>';
    for (let t = 0; t <= 200; t += 50) s += `<line class="${gl}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="${ax}" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    for (let t = 0; t <= 100; t += 20) s += `<line class="${gl}" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}"/><text class="${ax}" x="${x(t)}" y="${H - B + 18}" text-anchor="middle">${t}</text>`;
    s += `<text class="fill-slate-900 text-xs font-semibold dark:fill-slate-100" x="${L + (W - L - R) / 2}" y="${H - 6}" text-anchor="middle">Gasto en marketing (miles de USD)</text><text class="fill-slate-900 text-xs font-semibold dark:fill-slate-100" transform="translate(12 ${T + (H - T - B) / 2}) rotate(-90)" text-anchor="middle">Clientes nuevos</text>`;
    if (v.length > 2) {
      const n = v.length, sx = v.reduce((a, p) => a + p[1], 0), sy = v.reduce((a, p) => a + p[2], 0);
      const m = (n * v.reduce((a, p) => a + p[1] * p[2], 0) - sx * sy) / (n * v.reduce((a, p) => a + p[1] ** 2, 0) - sx ** 2), b = (sy - m * sx) / n;
      const x0 = v[0][1], x1 = v[n - 1][1];
      s += `<line x1="${x(x0)}" y1="${y(m * x0 + b)}" x2="${x(x1)}" y2="${y(m * x1 + b)}" stroke="url(#tg)" stroke-width="2" stroke-linecap="round"/>`;
    }
    cur = Math.min(cur, v.length - 1);
    v.forEach((p, i) => { s += `<circle class="${groups[p[3]].f} cursor-pointer stroke-white outline-none hover:stroke-slate-900 hover:[r:8px] focus:stroke-slate-900 focus:[r:8px] dark:stroke-slate-900 dark:hover:stroke-slate-100 dark:focus:stroke-slate-100" stroke-width="1.5" fill-opacity=".85" data-i="${i}" cx="${x(p[1])}" cy="${y(p[2])}" r="6" tabindex="${i === cur ? 0 : -1}" role="img" aria-label="${p[0]}, ${groups[p[3]].n}: gasto ${p[1]} mil USD, ${p[2]} clientes nuevos"/>`; });
    svg.innerHTML = s; tip.hidden = true;
  }
  function show(c) {
    const p = vis()[c.dataset.i], cx = +c.getAttribute('cx'), cy = +c.getAttribute('cy'), row = 'flex justify-between gap-4 tabular-nums text-slate-500 dark:text-slate-400', val = 'text-slate-900 dark:text-slate-100';
    tip.innerHTML = `<b class="block">${p[0]}</b><div class="${row}"><span>Canal</span><span class="${val}">${groups[p[3]].n}</span></div><div class="${row}"><span>Gasto</span><span class="${val}">${p[1]} mil USD</span></div><div class="${row}"><span>Clientes nuevos</span><span class="${val}">${p[2]}</span></div>`;
    tip.style.transform = cy < 110 ? 'translate(-50%,14px)' : 'translate(-50%,calc(-100% - 14px))';
    tip.style.left = Math.min(Math.max(cx, 80), W - 80) + 'px'; tip.style.top = cy + 'px'; tip.hidden = false;
  }
  lg.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; if (on.has(i) && on.size > 1) on.delete(i); else on.add(i); legend(); draw(); };
  svg.addEventListener('pointerover', (e) => e.target.matches('circle') && show(e.target));
  svg.addEventListener('focusin', (e) => { if (!e.target.matches('circle')) return; svg.querySelectorAll('circle').forEach((c) => (c.tabIndex = -1)); e.target.tabIndex = 0; cur = +e.target.dataset.i; show(e.target); });
  svg.addEventListener('pointerleave', () => (tip.hidden = true));
  svg.addEventListener('focusout', () => (tip.hidden = true));
  svg.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (e.key === 'Escape') tip.hidden = true;
    if (!d || !e.target.matches('circle')) return;
    e.preventDefault(); svg.querySelector(`circle[data-i="${+e.target.dataset.i + d}"]`)?.focus();
  });
  addEventListener('resize', draw);
  legend(); draw();
</script>
