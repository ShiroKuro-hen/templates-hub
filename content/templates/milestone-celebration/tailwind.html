<style>
  @keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),360px) rotate(540deg)}}
  @keyframes draw{from{stroke-dashoffset:327}}
  @media (prefers-reduced-motion:no-preference){
    .go #cf i{animation:fall 2.2s cubic-bezier(.2,.6,.4,1) var(--d) forwards}
    .go .arc{animation:draw .9s ease-out}
  }
</style>
<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <section id="card" aria-labelledby="ttl" class="relative mx-auto max-w-md overflow-hidden rounded-lg border border-slate-200 bg-white px-5 pb-5 pt-8 text-center shadow-sm dark:border-slate-700 dark:bg-slate-900 [&_:focus-visible]:outline-2 [&_:focus-visible]:outline-offset-2 [&_:focus-visible]:outline-blue-600">
    <div id="cf" aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden [&>i]:absolute [&>i]:-top-3.5 [&>i]:left-[var(--x)] [&>i]:h-3 [&>i]:w-2 [&>i]:rounded-sm [&>i]:opacity-0"></div>
    <div class="relative mx-auto mb-4 size-[120px]">
      <svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" class="-rotate-90">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>
        <circle cx="60" cy="60" r="52" fill="none" stroke-width="4" class="stroke-slate-200 dark:stroke-slate-700"/>
        <circle class="arc" cx="60" cy="60" r="52" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="327"/>
      </svg>
      <b class="absolute inset-0 grid place-items-center text-[26px] font-semibold tabular-nums">1.000</b>
    </div>
    <h2 id="ttl" class="text-xl font-semibold">Has llegado a 1.000 clientes</h2>
    <p class="mx-auto mt-1 max-w-[340px] text-slate-500 dark:text-slate-400">Empezaste hace 14 meses. Este mes se sumaron 86 clientes nuevos.</p>
    <dl class="mb-5 mt-6 grid grid-cols-3 border-t border-slate-200 pt-4 dark:border-slate-700 [&>div+div]:border-l [&>div+div]:border-slate-200 dark:[&>div+div]:border-slate-700 [&_dt]:text-[13px] [&_dt]:text-slate-500 dark:[&_dt]:text-slate-400 [&_dd]:m-0 [&_dd]:text-[17px] [&_dd]:font-semibold [&_dd]:tabular-nums">
      <div><dt>Este mes</dt><dd>+86</dd></div>
      <div><dt>Ingresos</dt><dd>48.920 €</dd></div>
      <div><dt>Retención</dt><dd>94 %</dd></div>
    </dl>
    <div class="flex flex-wrap justify-center gap-2 [&>button]:h-9 [&>button]:rounded-lg [&>button]:border [&>button]:border-slate-200 [&>button]:px-4 [&>button]:font-medium hover:[&>button]:bg-blue-50 dark:[&>button]:border-slate-700 dark:hover:[&>button]:bg-slate-800">
      <button type="button" id="share" class="!border-blue-600 !bg-blue-600 text-white hover:!bg-blue-700">Compartir logro</button>
      <button type="button" id="again" class="motion-reduce:hidden">Repetir celebración</button>
    </div>
    <p id="st" role="status" class="mt-3 min-h-[21px] text-slate-500 dark:text-slate-400"></p>
  </section>
</div>
<script>
  const card = document.getElementById('card'), cf = document.getElementById('cf'), st = document.getElementById('st');
  const COLORS = ['bg-blue-600', 'bg-emerald-500', 'bg-amber-500', 'bg-cyan-500', 'bg-red-500'];
  cf.replaceChildren(...Array.from({ length: 20 }, (_, i) => {
    const p = document.createElement('i');
    p.className = COLORS[i % 5];
    p.style.cssText = `--x:${(i * 37 + 8) % 96 + 2}%;--d:${(i % 7) * 0.1}s;--dx:${(i % 2 ? 1 : -1) * (12 + (i % 5) * 10)}px`;
    return p;
  }));
  function play() { card.classList.remove('go'); void card.offsetWidth; card.classList.add('go'); }
  document.getElementById('again').onclick = play;
  document.getElementById('share').onclick = async () => {
    try {
      await navigator.clipboard.writeText('Hemos llegado a 1.000 clientes en Nimbus.');
      st.textContent = 'Texto copiado. Pégalo donde quieras compartirlo.';
    } catch {
      st.textContent = 'No se pudo copiar. Selecciona el título y cópialo a mano.';
    }
  };
  play();
</script>
