<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migas de pan</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .label { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--muted); }
  .crumbs { margin-bottom:24px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .crumbs ol { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin:0; padding:0; list-style:none; }
  .crumbs li { display:flex; align-items:center; gap:8px; }
  .crumbs li[hidden] { display:none; }
  .crumbs li + li::before { content:"/"; content:"/" / ""; color:var(--border); }
  .crumbs a { color:var(--muted); text-decoration:none; border-radius:4px; transition:color .14s; }
  .crumbs a:hover { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .crumbs [aria-current] { font-weight:600; padding-bottom:1px; background:linear-gradient(135deg,#22d3ee,#2f5bff) 0 100%/100% 2px no-repeat; }
  .crumbs button { min-width:32px; padding:0 8px; font:inherit; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:color .14s, border-color .14s; }
  .crumbs button:hover { color:var(--accent); border-color:var(--accent); }
  @media (prefers-reduced-motion:reduce) { .crumbs a, .crumbs button { transition:none; } }
</style>
</head>
<body>
  <p class="label">Ruta corta</p>
  <nav class="crumbs" aria-label="Migas de pan">
    <ol>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Tienda</a></li>
      <li><span aria-current="page">Zapatillas</span></li>
    </ol>
  </nav>

  <p class="label">Ruta larga, colapsada</p>
  <nav class="crumbs" aria-label="Migas de pan (ruta larga)">
    <ol>
      <li><a href="#">Inicio</a></li>
      <li><button type="button" aria-label="Mostrar 2 niveles ocultos">…</button></li>
      <li hidden><a href="#">Tienda</a></li>
      <li hidden><a href="#">Calzado</a></li>
      <li><a href="#">Zapatillas</a></li>
      <li><span aria-current="page">Modelo Aurora</span></li>
    </ol>
  </nav>
<script>
  document.querySelectorAll('.crumbs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      const li = btn.closest('li'), hidden = [...li.parentNode.querySelectorAll('li[hidden]')];
      hidden.forEach((x) => (x.hidden = false));
      li.remove();
      hidden[0].querySelector('a').focus();
    });
  });
</script>
</body>
</html>
