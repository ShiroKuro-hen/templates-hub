<section class="mx-auto max-w-xl rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <h2 id="t" class="text-lg font-semibold">Escala de acento</h2>
  <p class="mb-4 text-slate-500 dark:text-slate-400">Diez tonos del azul ultramar. Haz clic en un tono para copiar su valor.</p>
  <div id="strip" class="flex h-12 overflow-hidden rounded-lg border border-slate-200 dark:border-slate-700" aria-hidden="true"></div>
  <ul id="list" class="mt-4"></ul>
  <p id="msg" role="status" class="mt-3 min-h-5 text-slate-500 dark:text-slate-400"></p>
</section>
<script>
  const SCALE = {50:'#f0f4ff',100:'#dee5ff',200:'#bccbff',300:'#97adff',400:'#6384ff',500:'#2f5bff',600:'#2a50e1',700:'#2444bf',800:'#1d3594',900:'#16276d'};
  const INK = '#0e1726', WHITE = '#ffffff';
  const lum = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4))
    .reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
  const P = 'ml-1 rounded-full px-2 text-xs font-semibold ';
  const badge = (r) => r >= 4.5 ? `<span class="${P}bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400">AA</span>`
    : r >= 3 ? `<span class="${P}bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-400">AA texto grande</span>`
    : `<span class="${P}bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-400">No cumple</span>`;
  const entries = Object.entries(SCALE);
  strip.innerHTML = entries.map(([, h]) => `<i class="flex-1" style="background:${h}"></i>`).join('');
  list.innerHTML = entries.map(([n, h]) => {
    const w = ratio(h, WHITE), k = ratio(h, INK);
    return `<li class="grid grid-cols-[56px_1fr] items-center gap-x-3 gap-y-1 border-t border-slate-200 py-2.5 dark:border-slate-700">
      <button type="button" data-hex="${h}" aria-label="Copiar azul ${n}, ${h}" class="row-span-2 grid h-10 cursor-pointer place-items-center rounded-lg border border-slate-200 font-semibold transition-transform hover:scale-105 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700" style="background:${h};color:${w >= k ? WHITE : INK}">Aa</button>
      <div><span class="font-semibold">Azul ${n}</span><span class="ml-2 font-mono text-xs tabular-nums text-slate-500 dark:text-slate-400">${h}</span></div>
      <div class="flex flex-wrap gap-x-4 text-slate-500 tabular-nums dark:text-slate-400"><span>Texto blanco ${w.toFixed(2)}:1 ${badge(w)}</span><span>Texto oscuro ${k.toFixed(2)}:1 ${badge(k)}</span></div></li>`;
  }).join('');
  list.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.hex); msg.textContent = `Copiado ${b.dataset.hex}.`; }
    catch { msg.textContent = `No se pudo copiar. Selecciona ${b.dataset.hex} a mano.`; }
  });
</script>
