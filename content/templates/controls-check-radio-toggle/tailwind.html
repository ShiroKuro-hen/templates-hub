<div class="grid grid-cols-[repeat(auto-fit,minmax(170px,1fr))] gap-3.5 p-5 text-fg">
  <fieldset class="rounded-lg border border-line bg-surface px-3.5 pb-1.5 pt-2 shadow-sm">
    <legend class="px-1.5 font-semibold">Avisos por</legend>
    <label class="flex min-h-[34px] cursor-pointer items-center gap-2.5">
      <input type="checkbox" checked
        class="relative size-5 flex-none appearance-none rounded-[5px] border border-line bg-surface before:absolute before:left-[6px] before:top-[2px] before:h-2.5 before:w-[5px] before:rotate-45 before:border-b-2 before:border-r-2 before:border-surface before:opacity-0 before:content-[''] checked:border-accent checked:bg-accent checked:before:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      Correo
    </label>
    <label class="flex min-h-[34px] cursor-pointer items-center gap-2.5">
      <input type="checkbox"
        class="relative size-5 flex-none appearance-none rounded-[5px] border border-line bg-surface before:absolute before:left-[6px] before:top-[2px] before:h-2.5 before:w-[5px] before:rotate-45 before:border-b-2 before:border-r-2 before:border-surface before:opacity-0 before:content-[''] checked:border-accent checked:bg-accent checked:before:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      SMS
    </label>
    <label class="flex min-h-[34px] cursor-not-allowed items-center gap-2.5 text-muted">
      <input type="checkbox" checked disabled
        class="relative size-5 flex-none appearance-none rounded-[5px] border border-line bg-surface opacity-50 before:absolute before:left-[6px] before:top-[2px] before:h-2.5 before:w-[5px] before:rotate-45 before:border-b-2 before:border-r-2 before:border-surface before:opacity-0 before:content-[''] checked:border-accent checked:bg-accent checked:before:opacity-100">
      Push (obligatorio)
    </label>
  </fieldset>
  <fieldset class="rounded-lg border border-line bg-surface px-3.5 pb-1.5 pt-2 shadow-sm">
    <legend class="px-1.5 font-semibold">Plan</legend>
    <label class="flex min-h-[34px] cursor-pointer items-center gap-2.5">
      <input type="radio" name="plan" checked
        class="relative size-5 flex-none appearance-none rounded-full border border-line bg-surface before:absolute before:inset-1 before:rounded-full before:bg-accent before:opacity-0 before:content-[''] checked:border-accent checked:before:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      Gratis
    </label>
    <label class="flex min-h-[34px] cursor-pointer items-center gap-2.5">
      <input type="radio" name="plan"
        class="relative size-5 flex-none appearance-none rounded-full border border-line bg-surface before:absolute before:inset-1 before:rounded-full before:bg-accent before:opacity-0 before:content-[''] checked:border-accent checked:before:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      Pro
    </label>
  </fieldset>
  <fieldset class="col-span-full rounded-lg border border-line bg-surface px-3.5 pb-1.5 pt-2 shadow-sm">
    <legend class="px-1.5 font-semibold">Preferencias</legend>
    <label class="flex min-h-[34px] cursor-pointer items-center gap-2.5">
      <input type="checkbox" role="switch" checked
        class="relative h-6 w-10 flex-none appearance-none rounded-full border border-transparent bg-line before:absolute before:left-0.5 before:top-0.5 before:size-[18px] before:rounded-full before:bg-muted before:content-[''] checked:bg-accent checked:before:translate-x-4 checked:before:bg-surface motion-safe:before:transition-transform focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      Sincronizar en segundo plano
    </label>
  </fieldset>
</div>
