<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox, radio y switch</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:14px; }
  fieldset { margin:0; padding:8px 14px 6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  legend { padding:0 6px; font-weight:600; }
  .opt { display:flex; align-items:center; gap:10px; min-height:34px; cursor:pointer; }
  .opt:has(:disabled) { color:var(--muted); cursor:not-allowed; }
  input { flex:none; position:relative; appearance:none; margin:0; width:20px; height:20px; background:var(--surface); border:1px solid var(--muted); cursor:inherit; }
  input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input:disabled { opacity:.5; }
  input::before { content:""; position:absolute; opacity:0; }
  input:checked::before { opacity:1; }
  [type=checkbox] { border-radius:5px; }
  [type=checkbox]:checked { background:var(--accent); border-color:var(--accent); }
  [type=checkbox]::before { left:6px; top:2px; width:5px; height:10px; border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(45deg); }
  [type=radio] { border-radius:50%; }
  [type=radio]::before { inset:4px; border-radius:50%; background:var(--accent); }
  [type=radio]:checked { border-color:var(--accent); }
  [role=switch] { width:40px; height:24px; border-radius:12px; background:var(--border); border-color:transparent; }
  [role=switch]::before { opacity:1; left:2px; top:2px; width:18px; height:18px; border-radius:50%; background:var(--muted); }
  [role=switch]:checked { background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  [role=switch]:checked::before { transform:translateX(16px); background:#fff; }
  @media (prefers-reduced-motion:no-preference) { input, input::before { transition:transform .14s, background-color .14s, border-color .14s; } }
  .row { grid-column:1 / -1; }
</style>
</head>
<body>
  <div class="cols">
    <fieldset>
      <legend>Avisos por</legend>
      <label class="opt"><input type="checkbox" name="av" checked> Correo</label>
      <label class="opt"><input type="checkbox" name="av"> SMS</label>
      <label class="opt"><input type="checkbox" name="av" checked disabled> Push (obligatorio)</label>
    </fieldset>
    <fieldset>
      <legend>Plan</legend>
      <label class="opt"><input type="radio" name="plan" checked> Gratis</label>
      <label class="opt"><input type="radio" name="plan"> Pro</label>
      <label class="opt"><input type="radio" name="plan" disabled> Equipo (agotado)</label>
    </fieldset>
    <fieldset class="row">
      <legend>Preferencias</legend>
      <label class="opt"><input type="checkbox" role="switch" checked> Sincronizar en segundo plano</label>
      <label class="opt"><input type="checkbox" role="switch"> Modo ahorro de datos</label>
    </fieldset>
  </div>
</body>
</html>
