<div class="bg-page p-5 text-sm text-fg">
  <form id="f" novalidate>
    <fieldset class="w-full max-w-[360px] rounded-lg border border-line bg-surface px-5 pb-5 pt-4 shadow-sm">
      <legend class="px-1.5 text-base font-semibold">Precio</legend>
      <div id="hist" aria-hidden="true" class="mx-[9px] mt-2 flex h-14 items-end gap-[3px]"></div>
      <div class="relative h-6">
        <div class="absolute inset-x-[9px] top-2.5 h-1 rounded-full bg-accent-soft" aria-hidden="true"><div id="fill" class="absolute inset-y-0 rounded-full bg-gradient-to-br from-accent-2 to-accent"></div></div>
        <input type="range" id="rlo" min="0" max="300" step="5" value="40" aria-label="Precio mínimo">
        <input type="range" id="rhi" min="0" max="300" step="5" value="180" aria-label="Precio máximo">
      </div>
      <div class="mt-3 grid grid-cols-2 gap-3 text-[13px] text-muted">
        <label>Mínimo<span class="mt-0.5 flex items-center gap-1.5 rounded-lg border border-line bg-surface px-2.5 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent has-[[aria-invalid=true]]:border-err"><input type="number" id="nlo" min="0" max="300" step="5" inputmode="numeric" aria-describedby="err" class="w-full min-w-0 bg-transparent py-1.5 text-sm tabular-nums text-fg outline-none"><span aria-hidden="true">€</span></span></label>
        <label>Máximo<span class="mt-0.5 flex items-center gap-1.5 rounded-lg border border-line bg-surface px-2.5 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent has-[[aria-invalid=true]]:border-err"><input type="number" id="nhi" min="0" max="300" step="5" inputmode="numeric" aria-describedby="err" class="w-full min-w-0 bg-transparent py-1.5 text-sm tabular-nums text-fg outline-none"><span aria-hidden="true">€</span></span></label>
      </div>
      <p id="err" role="alert" hidden class="mt-2 text-[13px] text-err"></p>
      <button id="go" type="submit" class="mt-3.5 w-full rounded-lg bg-accent px-3.5 py-2 font-semibold text-page hover:enabled:bg-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:bg-accent-soft disabled:text-muted"></button>
    </fieldset>
  </form>
</div>
<script>
  const MAX = 300, STEP = 25, C = [4, 9, 18, 26, 31, 24, 19, 12, 8, 5, 3, 2], TOP = Math.max(...C);
  const $ = (id) => document.getElementById(id), eur = (n) => n.toLocaleString('es-ES') + ' €';
  const R = `pointer-events-none absolute inset-0 m-0 h-6 w-full appearance-none bg-transparent focus-visible:outline-none [&::-webkit-slider-runnable-track]:h-6 [&::-webkit-slider-runnable-track]:bg-transparent [&::-moz-range-track]:bg-transparent [&::-webkit-slider-thumb]:mt-[3px] [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:size-[18px] [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border [&::-webkit-slider-thumb]:border-surface [&::-webkit-slider-thumb]:bg-accent [&::-webkit-slider-thumb]:shadow-sm [&::-moz-range-thumb]:pointer-events-auto [&::-moz-range-thumb]:size-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:bg-accent focus-visible:[&::-webkit-slider-thumb]:outline-2 focus-visible:[&::-webkit-slider-thumb]:outline-offset-2 focus-visible:[&::-webkit-slider-thumb]:outline-accent`;
  $('rlo').className = $('rhi').className = R;
  $('hist').innerHTML = C.map((c) => `<i class="block flex-1 rounded-t-sm bg-line" style="height:${(c / TOP) * 100}%"></i>`).join('');
  const IN = ['bg-accent-soft', 'shadow-[inset_0_2px_0_theme(colors.blue.600)]', ''], OUT = ['bg-line', ''];
  let lo = 40, hi = 180;
  function render(from) {
    const bad = lo > hi;
    $('fill').style.left = (Math.min(lo, hi) / MAX) * 100 + '%'; $('fill').style.right = 100 - (Math.max(lo, hi) / MAX) * 100 + '%';
    if (from !== 'r') { $('rlo').value = lo; $('rhi').value = hi; }
    if (from !== 'n') { $('nlo').value = lo; $('nhi').value = hi; }
    [$('nlo'), $('nhi')].forEach((i) => i.setAttribute('aria-invalid', bad));
    $('err').hidden = !bad;
    if (bad) $('err').textContent = `El mínimo (${eur(lo)}) supera al máximo (${eur(hi)}). Baja el mínimo o sube el máximo.`;
    [...$('hist').children].forEach((b, i) => { const on = !bad && (i + 1) * STEP > lo && i * STEP < hi; b.classList.remove(...IN, ...OUT); b.classList.add(...(on ? IN : OUT)); });
    const n = bad ? 0 : C.reduce((s, c, i) => s + c * Math.max(0, Math.min(hi, (i + 1) * STEP) - Math.max(lo, i * STEP)) / STEP, 0);
    $('go').disabled = bad; $('go').textContent = bad ? 'Corrige el rango' : `Ver ${Math.round(n)} artículos`;
  }
  const num = (v, d) => (v === '' || isNaN(+v) ? d : Math.min(MAX, Math.max(0, +v)));
  $('rlo').addEventListener('input', (e) => { lo = Math.min(+e.target.value, hi); render('r'); e.target.value = lo; });
  $('rhi').addEventListener('input', (e) => { hi = Math.max(+e.target.value, lo); render('r'); e.target.value = hi; });
  $('nlo').addEventListener('input', (e) => { lo = num(e.target.value, 0); render('n'); });
  $('nhi').addEventListener('input', (e) => { hi = num(e.target.value, MAX); render('n'); });
  [$('nlo'), $('nhi')].forEach((i) => i.addEventListener('change', () => render()));
  $('f').addEventListener('submit', (e) => e.preventDefault());
  render();
</script>
