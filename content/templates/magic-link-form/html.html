<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:420px;margin:0 auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0 0 4px;font-size:20px;line-height:1.3}
  h1:focus{outline:none}
  .sub{margin:0 0 20px;color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{box-sizing:border-box;width:100%;height:40px;margin-bottom:12px;padding:0 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  input:focus-visible{border-color:var(--accent)}
  input[aria-invalid=true]{border-color:var(--err)}
  .msg{margin:-4px 0 12px;font-size:13px;color:var(--err)}
  .msg:empty{display:none}
  .btn{font:inherit;font-weight:600;display:flex;align-items:center;justify-content:center;width:100%;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s,border-color .14s}
  .btn:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  .btn:disabled{color:var(--muted);cursor:not-allowed;font-variant-numeric:tabular-nums}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
  .link{all:unset;color:var(--accent);text-decoration:underline;cursor:pointer}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .ring{position:relative;width:56px;height:56px;margin-bottom:16px}
  .ring svg{display:block;transform:rotate(-90deg)}
  .ring .track{stroke:var(--border)}
  .ring .bar{transition:stroke-dashoffset 1s linear}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
  .help{margin:16px 0 0;font-size:13px;color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <section id="v1" aria-labelledby="t1">
    <h1 id="t1" tabindex="-1">Accede sin contraseña</h1>
    <p class="sub">Escribe tu correo y te enviamos un enlace de un solo uso.</p>
    <form id="f" novalidate>
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" placeholder="nombre@empresa.com" required aria-describedby="msg">
      <p id="msg" class="msg" aria-live="polite"></p>
      <button class="btn primary" type="submit">Enviar enlace de acceso</button>
    </form>
  </section>
  <section id="v2" aria-labelledby="t2" hidden>
    <div class="ring">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>
        <circle class="track" cx="28" cy="28" r="24"/>
        <circle id="bar" class="bar" cx="28" cy="28" r="24" stroke="url(#g)" stroke-dasharray="150.8"/>
      </svg>
      <b id="n" aria-hidden="true">30</b>
    </div>
    <h1 id="t2" tabindex="-1">Revisa tu correo</h1>
    <p class="sub">Enviamos un enlace a <strong id="to"></strong>. Caduca en 10 minutos.</p>
    <button id="re" class="btn" type="button" disabled>Reenviar en 30 s</button>
    <p class="help">¿Correo equivocado? <button id="back" class="link" type="button">Usar otro correo</button></p>
  </section>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
</main>
<script>
  const $ = (i) => document.getElementById(i), N = 30, C = 2 * Math.PI * 24;
  let left = 0, timer;
  function paint() {
    $('n').textContent = left;
    $('bar').style.strokeDashoffset = C * (1 - left / N);
    $('re').disabled = left > 0;
    $('re').textContent = left > 0 ? `Reenviar en ${left} s` : 'Reenviar enlace';
  }
  function start() {
    left = N; paint(); clearInterval(timer);
    timer = setInterval(() => { left--; paint(); if (!left) clearInterval(timer); }, 1000);
  }
  function show(sent) {
    $('v1').hidden = sent; $('v2').hidden = !sent;
    (sent ? $('t2') : $('email')).focus();
  }
  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const i = $('email'), ok = i.checkValidity();
    i.setAttribute('aria-invalid', String(!ok));
    $('msg').textContent = ok ? '' : 'Escribe un correo válido, por ejemplo nombre@empresa.com.';
    if (!ok) return;
    $('to').textContent = i.value; start(); show(true);
  });
  $('re').addEventListener('click', () => { start(); $('live').textContent = `Enlace reenviado a ${$('email').value}.`; });
  $('back').addEventListener('click', () => { clearInterval(timer); $('live').textContent = ''; show(false); });
</script>
</body>
</html>
