<figure class="m-0 rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <figcaption class="mb-4 flex flex-wrap justify-between gap-3">
    <div>
      <h2 class="m-0 flex items-center gap-2 text-base font-semibold"><span class="size-2 rounded-sm bg-gradient-to-br from-accent-2 to-accent"></span>Ingresos, costos y margen por trimestre</h2>
      <p class="mt-0.5 text-muted">Miles de USD, año fiscal 2025</p>
    </div>
    <div id="lg" role="group" aria-label="Series visibles" class="flex flex-wrap items-start gap-2"></div>
  </figcaption>
  <div class="relative">
    <svg id="svg" role="group" aria-label="Barras agrupadas por trimestre" class="block h-[260px] w-full overflow-visible"></svg>
    <div id="tip" hidden class="pointer-events-none absolute top-0 min-w-36 -translate-x-1/2 rounded-lg border border-line bg-surface px-3 py-2 text-[13px] shadow-md"></div>
  </div>
</figure>
<script>
  const series = [
    { n: 'Ingresos', sw: 'bg-accent', f: 'fill-accent' },
    { n: 'Costos', sw: 'bg-info', f: 'fill-info' },
    { n: 'Margen', sw: 'bg-ok', f: 'fill-ok' },
  ];
  const data = [['T1', [120, 78, 42]], ['T2', [138, 84, 54]], ['T3', [126, 90, 36]], ['T4', [152, 96, 56]]];
  const on = new Set([0, 1, 2]), H = 260, L = 36, R = 8, T = 12, B = 28, MAX = 160;
  let W = 480;
  const btn = 'inline-flex items-center gap-2 rounded-full border border-line px-3 py-1 hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent';
  function legend() {
    lg.innerHTML = series.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="${on.has(i)}" class="${btn} ${on.has(i) ? '' : 'text-muted'}"><i class="size-2.5 rounded-sm ${s.sw} ${on.has(i) ? '' : 'opacity-30'}"></i>${s.n}</button>`).join('');
  }
  function draw() {
    W = svg.clientWidth || 480;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const vis = series.map((_, i) => i).filter((i) => on.has(i));
    const gw = (W - L - R) / data.length, bw = Math.min(28, (gw * 0.72 - 4 * (vis.length - 1)) / vis.length);
    const y = (v) => T + (H - T - B) * (1 - v / MAX), ax = 'fill-muted text-xs tabular-nums';
    let s = '';
    for (let t = 0; t <= MAX; t += 40) s += `<line class="stroke-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="${ax}" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    data.forEach(([l, v], g) => {
      const x0 = L + g * gw, off = (gw - bw * vis.length - 4 * (vis.length - 1)) / 2;
      s += `<g class="group outline-none" data-g="${g}" data-grp tabindex="0" role="img" aria-label="${l}: ${vis.map((i) => series[i].n + ' ' + v[i]).join(', ')}"><rect class="fill-transparent group-hover:fill-accent-soft group-focus:fill-accent-soft group-focus:stroke-accent" x="${x0}" y="${T}" width="${gw}" height="${H - T - B}" rx="4"/>`;
      vis.forEach((i, k) => { s += `<rect class="${series[i].f}" x="${x0 + off + k * (bw + 4)}" y="${y(v[i])}" width="${bw}" height="${y(0) - y(v[i])}" rx="2"/>`; });
      s += `</g><text class="${ax}" x="${x0 + gw / 2}" y="${H - 8}" text-anchor="middle">${l}</text>`;
    });
    svg.innerHTML = s; tip.hidden = true;
  }
  function show(g) {
    const [l, v] = data[g.dataset.g], x = L + (+g.dataset.g + 0.5) * (W - L - R) / data.length;
    tip.innerHTML = `<b class="mb-1 block">${l}</b>` + series.map((q, i) => on.has(i) ? `<div class="flex justify-between gap-4 tabular-nums"><span><i class="mr-1.5 inline-block size-2.5 rounded-sm ${q.sw}"></i>${q.n}</span><b>${v[i]}</b></div>` : '').join('');
    tip.style.left = Math.min(Math.max(x, 80), W - 80) + 'px'; tip.hidden = false;
  }
  lg.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; if (on.has(i) && on.size > 1) on.delete(i); else on.add(i); legend(); draw(); };
  svg.addEventListener('pointerover', (e) => { const g = e.target.closest('[data-grp]'); if (g) show(g); });
  svg.addEventListener('focusin', (e) => show(e.target.closest('[data-grp]')));
  svg.addEventListener('pointerleave', () => (tip.hidden = true));
  svg.addEventListener('focusout', () => (tip.hidden = true));
  addEventListener('keydown', (e) => e.key === 'Escape' && (tip.hidden = true));
  addEventListener('resize', draw);
  legend(); draw();
</script>
