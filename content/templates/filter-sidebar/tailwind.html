<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <form id="f" aria-label="Filtros de la tienda" novalidate class="w-full max-w-[280px] rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900 [&_details]:border-b [&_details]:border-slate-200 dark:[&_details]:border-slate-700 [&_summary]:cursor-pointer [&_summary]:px-4 [&_summary]:py-3 [&_summary]:font-semibold [&_summary]:hover:bg-blue-50 dark:[&_summary]:hover:bg-slate-800 [&_summary]:focus-visible:outline-2 [&_summary]:focus-visible:-outline-offset-2 [&_summary]:focus-visible:outline-blue-600 [&_.body]:px-4 [&_.body]:pb-3.5 [&_.opt]:flex [&_.opt]:cursor-pointer [&_.opt]:items-center [&_.opt]:gap-2 [&_.opt]:py-1 [&_.opt>input]:accent-blue-600 [&_.stars]:text-amber-600 [&_input[type=number]]:mt-0.5 [&_input[type=number]]:w-full [&_input[type=number]]:rounded-lg [&_input[type=number]]:border [&_input[type=number]]:border-slate-200 [&_input[type=number]]:bg-white [&_input[type=number]]:px-2 [&_input[type=number]]:py-1.5 [&_input[type=number]]:text-slate-900 dark:[&_input[type=number]]:border-slate-700 dark:[&_input[type=number]]:bg-slate-900 dark:[&_input[type=number]]:text-slate-100 [&_input[aria-invalid=true]]:border-red-600">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3.5 dark:border-slate-700">
      <h2 class="text-base font-semibold">Filtros<span id="n" class="ml-1.5 rounded-full bg-blue-50 px-2 text-xs font-semibold text-blue-600 empty:hidden dark:bg-slate-800 dark:text-blue-400"></span></h2>
      <button type="reset" class="px-1 text-blue-600 underline focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-blue-400">Limpiar todo</button>
    </div>
    <details open><summary>Categoría</summary><div class="body">
      <label class="opt"><input type="checkbox" name="cat" value="Zapatillas"> Zapatillas</label>
      <label class="opt"><input type="checkbox" name="cat" value="Ropa"> Ropa</label>
      <label class="opt"><input type="checkbox" name="cat" value="Mochilas"> Mochilas</label>
      <label class="opt"><input type="checkbox" name="cat" value="Accesorios"> Accesorios</label>
    </div></details>
    <details open><summary>Precio</summary><div class="body">
      <div class="grid grid-cols-2 gap-2 text-[13px] text-slate-500 dark:text-slate-400">
        <label>Mínimo (€)<input type="number" name="min" min="0" max="500" aria-describedby="perr"></label>
        <label>Máximo (€)<input type="number" name="max" min="0" max="500" aria-describedby="perr"></label>
      </div>
      <p id="perr" role="alert" hidden class="mt-1.5 text-[13px] text-red-600 dark:text-red-400">El mínimo supera al máximo. Cambia uno de los dos valores.</p>
    </div></details>
    <details open><summary>Marca</summary><div class="body">
      <label class="opt"><input type="checkbox" name="brand" value="Aero"> Aero</label>
      <label class="opt"><input type="checkbox" name="brand" value="Lumen"> Lumen</label>
      <label class="opt"><input type="checkbox" name="brand" value="Nordik"> Nordik</label>
      <label class="opt"><input type="checkbox" name="brand" value="Pulse"> Pulse</label>
      <label class="opt"><input type="checkbox" name="brand" value="Vento"> Vento</label>
    </div></details>
    <details open><summary>Valoración</summary><div class="body">
      <label class="opt"><input type="radio" name="rate" value="0" checked> Todas</label>
      <label class="opt"><input type="radio" name="rate" value="4"><span class="stars" aria-hidden="true">★★★★</span> 4 estrellas o más</label>
      <label class="opt"><input type="radio" name="rate" value="3"><span class="stars" aria-hidden="true">★★★</span> 3 estrellas o más</label>
    </div></details>
    <div class="p-4">
      <button id="go" type="submit" class="w-full rounded-lg bg-blue-600 px-3.5 py-2 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-50 disabled:text-slate-500 dark:bg-blue-500 dark:text-slate-950 dark:disabled:bg-slate-800 dark:disabled:text-slate-400"></button>
      <div class="mt-2.5 h-1 overflow-hidden rounded-full bg-blue-50 dark:bg-slate-800" aria-hidden="true"><i id="bar" class="block h-full bg-gradient-to-br from-cyan-400 to-blue-600 transition-all motion-reduce:transition-none"></i></div>
    </div>
  </form>
</div>
<script>
  const P = [['Zapatillas','Aero',89,4.6],['Zapatillas','Vento',129,4.2],['Zapatillas','Pulse',74,3.8],['Zapatillas','Nordik',159,4.8],['Ropa','Aero',45,4.1],['Ropa','Lumen',62,3.4],['Ropa','Nordik',98,4.5],['Ropa','Pulse',29,3.1],['Ropa','Vento',84,4.0],['Mochilas','Lumen',39,4.4],['Mochilas','Nordik',119,4.7],['Mochilas','Aero',55,3.6],['Accesorios','Pulse',12,3.9],['Accesorios','Lumen',24,4.3],['Accesorios','Vento',18,2.9],['Accesorios','Aero',33,4.5]];
  const f = document.getElementById('f'), $ = (id) => document.getElementById(id);
  function update() {
    const d = new FormData(f), cats = d.getAll('cat'), brands = d.getAll('brand'), rate = +d.get('rate');
    const min = d.get('min') === '' ? 0 : +d.get('min'), max = d.get('max') === '' ? Infinity : +d.get('max'), bad = min > max;
    [f.min, f.max].forEach((el) => el.setAttribute('aria-invalid', bad));
    $('perr').hidden = !bad;
    const n = bad ? 0 : P.filter(([c, b, p, r]) => (!cats.length || cats.includes(c)) && (!brands.length || brands.includes(b)) && p >= min && p <= max && r >= rate).length;
    $('n').textContent = (cats.length ? 1 : 0) + (brands.length ? 1 : 0) + (d.get('min') || d.get('max') ? 1 : 0) + (rate ? 1 : 0) || '';
    $('go').disabled = !n;
    $('go').textContent = n ? `Ver ${n} resultado${n > 1 ? 's' : ''}` : 'Sin resultados';
    $('bar').style.width = (n / P.length) * 100 + '%';
  }
  f.addEventListener('input', update);
  f.addEventListener('reset', () => setTimeout(update));
  f.addEventListener('submit', (e) => e.preventDefault());
  update();
</script>
