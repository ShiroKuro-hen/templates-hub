<style>
  .tag{background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff));color:#0a0f1c}
  .kbd{font:12px/normal ui-monospace,"Cascadia Code",Menlo,monospace}
</style>
<section class="rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm" aria-labelledby="t">
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 id="t" class="m-0 text-base font-semibold">Galería de proyectos</h2>
      <p class="mt-0.5 text-muted">Diez entregas recientes del estudio.</p>
    </div>
    <fieldset id="seg" class="m-0 flex rounded-lg border border-line bg-page p-0.5">
      <legend class="sr-only">Disposición de la galería</legend>
    </fieldset>
  </div>
  <p id="info" aria-live="polite" class="mb-4 text-[13px] text-muted"></p>
  <ul id="grid" class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3 p-0"></ul>
</section>
<script>
  const modes = {
    rows: ['Filas', 'auto-rows-[170px]', '', 'grid-auto-rows: 170px'],
    sq: ['1:1', 'auto-rows-auto', 'aspect-square', 'aspect-ratio: 1 / 1'],
    r43: ['4:3', 'auto-rows-auto', 'aspect-[4/3]', 'aspect-ratio: 4 / 3'],
    r169: ['16:9', 'auto-rows-auto', 'aspect-video', 'aspect-ratio: 16 / 9'],
  };
  const shape = { c: 'rounded-full', s: 'rounded-md rotate-12', t: '[clip-path:polygon(50%_0,100%_100%,0_100%)]' };
  // [título, categoría, color inicio, color fin, tinta, forma, destacado]
  const items = [
    ['Rediseño de la app móvil', 'Producto', 'accent-soft', 'info-soft', 'accent', 'c', 1],
    ['Identidad Aurora', 'Marca', 'info-soft', 'ok-soft', 'info', 's'],
    ['Sistema de iconos', 'Diseño de sistemas', 'ok-soft', 'warn-soft', 'ok', 't'],
    ['Campaña de otoño', 'Marketing', 'warn-soft', 'err-soft', 'warn', 'c'],
    ['Panel de analítica', 'Producto', 'err-soft', 'accent-soft', 'err', 's', 1],
    ['Portal de clientes', 'Producto', 'accent-soft', 'ok-soft', 'accent', 't'],
    ['Guía de estilo', 'Marca', 'info-soft', 'accent-soft', 'info', 'c'],
    ['Tienda en línea', 'Comercio', 'ok-soft', 'info-soft', 'ok', 's'],
    ['Onboarding guiado', 'Producto', 'warn-soft', 'accent-soft', 'warn', 't'],
    ['Kit de ilustraciones', 'Marca', 'err-soft', 'warn-soft', 'err', 'c'],
  ];
  let mode = 'rows';
  function tile([n, c, from, to, ink, s, w]) {
    const featured = w && mode === 'rows' ? 'max-[400px]:col-auto col-span-2' : '';
    const tag = w ? '<span class="tag absolute left-2 top-2 rounded-full px-2 text-xs font-semibold leading-[1.5]">Destacado</span>' : '';
    return `<li class="flex min-h-0 min-w-0 ${modes[mode][2]} ${featured}"><figure class="m-0 grid min-w-0 flex-1 grid-rows-[minmax(0,1fr)_auto] overflow-hidden rounded-lg border border-line bg-surface transition-colors hover:border-accent">
      <div class="relative min-h-0 overflow-hidden" style="background:linear-gradient(135deg,var(--${from}),var(--${to}))">${tag}<i class="absolute bottom-[14%] right-[12%] block aspect-square w-[34%] max-h-[70%] opacity-50 ${shape[s]}" style="background:var(--${ink})"></i></div>
      <figcaption class="border-t border-line px-3 py-2"><b class="block truncate font-semibold">${n}</b><small class="text-muted">${c}</small></figcaption></figure></li>`;
  }
  function draw() {
    const [, rows, , code] = modes[mode];
    grid.className = `m-0 grid list-none grid-flow-dense grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3 p-0 ${rows}`;
    grid.innerHTML = items.map(tile).join('');
    const lead = mode === 'rows' ? 'Filas de altura uniforme: ' : 'Proporción fija: ';
    const tail = mode === 'rows' ? ' y los destacados ocupan dos columnas.' : '';
    info.innerHTML = `${lead}<code class="kbd rounded-sm border border-line bg-page px-1.5 py-px text-fg">${code}</code>${tail}`;
  }
  seg.insertAdjacentHTML('beforeend', Object.entries(modes).map(([k, m]) => `<label class="relative"><input type="radio" name="m" value="${k}" class="peer absolute inset-0 m-0 cursor-pointer opacity-0" ${k === mode ? 'checked' : ''}><span class="block rounded-md px-3 py-1 tabular-nums text-muted transition-colors hover:text-fg peer-checked:bg-accent peer-checked:font-semibold peer-checked:text-accent-ink peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent">${m[0]}</span></label>`).join(''));
  seg.onchange = (e) => { mode = e.target.value; draw(); };
  draw();
</script>
