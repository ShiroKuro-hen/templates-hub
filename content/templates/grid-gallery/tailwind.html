<section class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 id="t" class="m-0 text-base font-semibold">Galería de proyectos</h2>
      <p class="mt-0.5 text-slate-500 dark:text-slate-400">Diez entregas recientes del estudio.</p>
    </div>
    <fieldset id="seg" class="m-0 flex rounded-lg border border-slate-200 bg-slate-50 p-0.5 dark:border-slate-700 dark:bg-slate-950">
      <legend class="sr-only">Disposición de la galería</legend>
    </fieldset>
  </div>
  <p id="info" aria-live="polite" class="mb-4 text-[13px] text-slate-500 dark:text-slate-400"></p>
  <ul id="grid" class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3 p-0"></ul>
</section>
<script>
  const modes = {
    rows: ['Filas', 'auto-rows-[170px]', '', 'grid-auto-rows: 170px'],
    sq: ['1:1', 'auto-rows-auto', 'aspect-square', 'aspect-ratio: 1 / 1'],
    r43: ['4:3', 'auto-rows-auto', 'aspect-[4/3]', 'aspect-ratio: 4 / 3'],
    r169: ['16:9', 'auto-rows-auto', 'aspect-video', 'aspect-ratio: 16 / 9'],
  };
  const pal = {
    a: ['from-blue-100 to-cyan-100 dark:from-blue-950 dark:to-cyan-950', 'bg-blue-600 dark:bg-blue-400'],
    b: ['from-cyan-100 to-emerald-100 dark:from-cyan-950 dark:to-emerald-950', 'bg-cyan-600 dark:bg-cyan-400'],
    c: ['from-emerald-100 to-amber-100 dark:from-emerald-950 dark:to-amber-950', 'bg-emerald-600 dark:bg-emerald-400'],
    d: ['from-amber-100 to-rose-100 dark:from-amber-950 dark:to-rose-950', 'bg-amber-600 dark:bg-amber-400'],
    e: ['from-rose-100 to-blue-100 dark:from-rose-950 dark:to-blue-950', 'bg-rose-600 dark:bg-rose-400'],
  };
  const shape = { c: 'rounded-full', s: 'rounded-md rotate-12', t: '[clip-path:polygon(50%_0,100%_100%,0_100%)]' };
  // [título, categoría, paleta, forma, destacado]
  const items = [
    ['Rediseño de la app móvil', 'Producto', 'a', 'c', 1], ['Identidad Aurora', 'Marca', 'b', 's'], ['Sistema de iconos', 'Diseño de sistemas', 'c', 't'],
    ['Campaña de otoño', 'Marketing', 'd', 'c'], ['Panel de analítica', 'Producto', 'e', 's', 1], ['Portal de clientes', 'Producto', 'a', 't'],
    ['Guía de estilo', 'Marca', 'b', 'c'], ['Tienda en línea', 'Comercio', 'c', 's'], ['Onboarding guiado', 'Producto', 'd', 't'], ['Kit de ilustraciones', 'Marca', 'e', 'c'],
  ];
  let mode = 'rows';
  function draw() {
    const [, rows, ar, code] = modes[mode];
    grid.className = `m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(150px,1fr))] gap-3 p-0 ${rows}`;
    grid.innerHTML = items.map(([n, c, p, s, w]) => `<li class="flex min-h-0 min-w-0 ${ar} ${w && mode === 'rows' ? 'max-[400px]:col-auto col-span-2' : ''}"><figure class="m-0 grid min-w-0 flex-1 grid-rows-[minmax(0,1fr)_auto] overflow-hidden rounded-lg border border-slate-200 bg-white transition-colors hover:border-blue-600 dark:border-slate-700 dark:bg-slate-900 dark:hover:border-blue-400">
      <div class="relative min-h-0 overflow-hidden bg-gradient-to-br ${pal[p][0]}">${w ? '<span class="absolute left-2 top-2 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 px-2 text-xs font-semibold text-slate-950">Destacado</span>' : ''}<i class="absolute bottom-[14%] right-[12%] block aspect-square w-1/3 max-h-[70%] opacity-50 ${pal[p][1]} ${shape[s]}"></i></div>
      <figcaption class="border-t border-slate-200 px-3 py-2 dark:border-slate-700"><b class="block truncate font-semibold">${n}</b><small class="text-slate-500 dark:text-slate-400">${c}</small></figcaption></figure></li>`).join('');
    info.innerHTML = `${mode === 'rows' ? 'Filas de altura uniforme' : 'Proporción fija'}: <code class="rounded border border-slate-200 bg-slate-50 px-1.5 font-mono text-xs text-slate-900 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">${code}</code>`;
  }
  seg.insertAdjacentHTML('beforeend', Object.entries(modes).map(([k, m]) => `<label class="relative"><input type="radio" name="m" value="${k}" class="peer absolute inset-0 m-0 cursor-pointer opacity-0" ${k === mode ? 'checked' : ''}><span class="block rounded-md px-3 py-1 tabular-nums text-slate-500 transition-colors hover:text-slate-900 peer-checked:bg-blue-600 peer-checked:font-semibold peer-checked:text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:text-slate-100 dark:peer-checked:bg-blue-400 dark:peer-checked:text-slate-950">${m[0]}</span></label>`).join(''));
  seg.onchange = (e) => { mode = e.target.value; draw(); };
  draw();
</script>
