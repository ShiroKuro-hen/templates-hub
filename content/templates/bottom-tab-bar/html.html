<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .phone{max-width:380px;height:440px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  main{flex:1;padding:20px}
  main h1{margin:0;font-size:18px}
  main p{margin:4px 0 0;color:var(--muted)}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);margin:0;padding:0 4px env(safe-area-inset-bottom);list-style:none;border-top:1px solid var(--border);background:var(--surface)}
  .tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;padding:8px 2px 6px;box-sizing:border-box;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .14s}
  .tabs a:hover{color:var(--text)}
  .tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
  .tabs a[aria-current=page]{color:var(--accent);font-weight:600}
  .tabs a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:0 0 999px 999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .ico{position:relative;display:grid;place-items:center;width:24px;height:24px}
  .badge{position:absolute;top:-4px;left:14px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;font-size:10px;font-weight:700;line-height:16px;text-align:center;font-variant-numeric:tabular-nums;color:var(--accent-ink);background:var(--err);box-shadow:0 0 0 2px var(--surface)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <main><h1 id="title">Inicio</h1><p>Tus pedidos recientes y novedades aparecen aquí.</p></main>
  <nav aria-label="Principal">
    <ul class="tabs" id="tabs">
      <li><a href="#" aria-current="page"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></span>Inicio</a></li>
      <li><a href="#"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>Buscar</a></li>
      <li><a href="#"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg></span>Pedidos</a></li>
      <li><a href="#"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge" aria-hidden="true">3</span></span>Mensajes<span class="sr">, 3 sin leer</span></a></li>
      <li><a href="#"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Perfil</a></li>
    </ul>
  </nav>
</div>
<script>
  // Demo: en una app real cada enlace navega a su ruta y el servidor marca aria-current.
  document.getElementById('tabs').addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    document.querySelectorAll('#tabs a').forEach((t) => t.removeAttribute('aria-current'));
    a.setAttribute('aria-current', 'page');
    document.getElementById('title').textContent = a.firstChild.nextSibling.textContent;
  });
</script>
</body>
</html>
