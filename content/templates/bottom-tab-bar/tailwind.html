<script>
  // Demo: en una app real cada enlace navega a su ruta y el servidor marca aria-current.
  document.getElementById('tabs').addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    document.querySelectorAll('#tabs a').forEach((t) => t.removeAttribute('aria-current'));
    a.setAttribute('aria-current', 'page');
    document.getElementById('title').textContent = a.firstChild.nextSibling.textContent;
  });
</script>
