<div class="grid max-w-2xl grid-cols-[repeat(auto-fit,minmax(120px,1fr))] gap-4 p-5">
  <figure class="m-0 rounded-lg border border-line bg-surface px-2 pb-4 pt-6 text-center shadow-sm">
    <div class="mb-3 grid h-14 place-items-center">
      <div role="status" class="size-10 animate-spin rounded-full border-4 border-accent-soft border-t-accent motion-reduce:[animation-duration:3s]"><span class="sr-only">Cargando</span></div>
    </div>
    <figcaption class="text-[13px] text-muted">Aro</figcaption>
  </figure>

  <figure class="m-0 rounded-lg border border-line bg-surface px-2 pb-4 pt-6 text-center shadow-sm">
    <div class="mb-3 grid h-14 place-items-center">
      <div role="status" class="flex h-7 items-end gap-2">
        <i class="size-2.5 animate-bounce rounded-full bg-accent motion-reduce:[animation-duration:3s]"></i>
        <i class="size-2.5 animate-bounce rounded-full bg-accent/75 [animation-delay:.15s] motion-reduce:[animation-duration:3s]"></i>
        <i class="size-2.5 animate-bounce rounded-full bg-accent/50 [animation-delay:.3s] motion-reduce:[animation-duration:3s]"></i>
        <span class="sr-only">Cargando</span>
      </div>
    </div>
    <figcaption class="text-[13px] text-muted">Puntos</figcaption>
  </figure>

  <figure class="m-0 rounded-lg border border-line bg-surface px-2 pb-4 pt-6 text-center shadow-sm">
    <div class="mb-3 grid h-14 place-items-center">
      <div role="status" class="flex h-10 items-center gap-1">
        <i class="h-full w-[5px] rounded-full bg-linear-to-b from-accent-2 to-accent [animation:stretch_1s_ease-in-out_infinite] motion-reduce:[animation-duration:3s]"></i>
        <i class="h-full w-[5px] rounded-full bg-linear-to-b from-accent-2 to-accent [animation:stretch_1s_ease-in-out_.1s_infinite] motion-reduce:[animation-duration:3s]"></i>
        <i class="h-full w-[5px] rounded-full bg-linear-to-b from-accent-2 to-accent [animation:stretch_1s_ease-in-out_.2s_infinite] motion-reduce:[animation-duration:3s]"></i>
        <i class="h-full w-[5px] rounded-full bg-linear-to-b from-accent-2 to-accent [animation:stretch_1s_ease-in-out_.3s_infinite] motion-reduce:[animation-duration:3s]"></i>
        <i class="h-full w-[5px] rounded-full bg-linear-to-b from-accent-2 to-accent [animation:stretch_1s_ease-in-out_.4s_infinite] motion-reduce:[animation-duration:3s]"></i>
        <span class="sr-only">Cargando</span>
      </div>
    </div>
    <figcaption class="text-[13px] text-muted">Barras</figcaption>
  </figure>
</div>

<style>
  /* Tailwind no trae este keyframe: añádelo a tu CSS o a @theme */
  @keyframes stretch { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
</style>
