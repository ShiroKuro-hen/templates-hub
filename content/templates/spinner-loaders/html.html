<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinners de carga CSS</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:16px; max-width:640px; }
  .card { margin:0; padding:24px 8px 16px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .stage { display:grid; place-items:center; height:56px; margin-bottom:12px; }
  figcaption { font-size:.8125rem; color:var(--muted); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  .ring { width:40px; height:40px; border:4px solid var(--accent-soft); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .dots { display:flex; gap:8px; align-items:flex-end; height:28px; }
  .dots i { width:10px; height:10px; background:var(--accent); border-radius:50%; animation:hop .6s ease-in-out infinite alternate; }
  .dots i:nth-child(2) { animation-delay:.15s; opacity:.75; }
  .dots i:nth-child(3) { animation-delay:.3s; opacity:.5; }
  @keyframes hop { to { transform:translateY(-14px); } }

  .bars { display:flex; gap:4px; align-items:center; height:40px; }
  .bars i { width:5px; height:100%; background:linear-gradient(180deg,#22d3ee,#2f5bff); border-radius:3px; animation:stretch 1s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay:.1s; } .bars i:nth-child(3) { animation-delay:.2s; }
  .bars i:nth-child(4) { animation-delay:.3s; } .bars i:nth-child(5) { animation-delay:.4s; }
  @keyframes stretch { 0%, 100% { transform:scaleY(.3); } 50% { transform:scaleY(1); } }

  /* Con movimiento reducido: mismo indicador, mucho más lento */
  @media (prefers-reduced-motion:reduce) { .ring, .dots i, .bars i { animation-duration:3s; } }
</style>
</head>
<body>
  <div class="grid">
    <figure class="card">
      <div class="stage"><div class="ring" role="status"><span class="sr">Cargando</span></div></div>
      <figcaption>Aro</figcaption>
    </figure>
    <figure class="card">
      <div class="stage"><div class="dots" role="status"><i></i><i></i><i></i><span class="sr">Cargando</span></div></div>
      <figcaption>Puntos</figcaption>
    </figure>
    <figure class="card">
      <div class="stage"><div class="bars" role="status"><i></i><i></i><i></i><i></i><i></i><span class="sr">Cargando</span></div></div>
      <figcaption>Barras</figcaption>
    </figure>
  </div>
</body>
</html>
