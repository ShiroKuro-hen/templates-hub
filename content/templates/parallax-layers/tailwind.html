<style>
  @property --t{syntax:"<number>";inherits:true;initial-value:0}
  @media (prefers-reduced-motion:no-preference){
    @supports (animation-timeline:scroll()){
      #sc{animation:prog linear both;animation-timeline:scroll(self)}
      @keyframes prog{to{--t:1}}
    }
  }
</style>
<section class="text-sm text-slate-900 dark:text-slate-100">
  <div id="sc" tabindex="0" role="region" aria-label="Escena con capas de profundidad" class="h-[360px] overflow-auto rounded-lg border border-slate-200 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700">
    <div class="sticky top-0 h-[360px] overflow-hidden bg-gradient-to-b from-blue-50 to-white dark:from-slate-800 dark:to-slate-900">
      <div class="absolute right-[14%] top-[46px] size-[72px] rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 [transform:translateY(calc(60px*var(--t,0)))]"></div>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="absolute inset-x-0 -bottom-[30%] block h-[85%] w-full fill-blue-100 [transform:translateY(calc(-24px*var(--t,0)))] dark:fill-blue-950"><path d="M0 90 50 50l60 35 60-50 70 45 60-35 100 50v105H0Z"/></svg>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="absolute inset-x-0 -bottom-[30%] block h-[70%] w-full fill-blue-200 [transform:translateY(calc(-56px*var(--t,0)))] dark:fill-blue-900"><path d="M0 70 70 30l60 40 80-45 70 50 60-30 60 20v145H0Z"/></svg>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="absolute inset-x-0 -bottom-[30%] block h-[55%] w-full fill-blue-400 [transform:translateY(calc(-100px*var(--t,0)))] dark:fill-blue-800"><path d="M0 60C60 20 110 20 170 55s120 20 230-15v160H0Z"/></svg>
      <div class="absolute inset-x-6 top-8 max-w-[400px] [opacity:calc(1-var(--t,0))] [transform:translateY(calc(-70px*var(--t,0)))]">
        <h1 class="text-[clamp(20px,5vw,28px)] font-bold leading-tight tracking-tight">Capas con profundidad</h1>
        <p class="mt-2 text-slate-500 dark:text-slate-400">Cada capa se mueve a su propia velocidad mientras te desplazas.</p>
      </div>
    </div>
    <div class="h-[360px]"></div>
  </div>
  <div class="mt-3 flex flex-wrap items-center justify-between gap-3 text-slate-500 dark:text-slate-400">
    <p>Desplaza dentro del recuadro para separar las capas.</p>
    <button id="rep" type="button" class="rounded-lg border border-slate-200 bg-white px-3.5 py-1.5 font-semibold text-slate-900 transition-colors hover:border-blue-500 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800">Volver al inicio</button>
  </div>
</section>
<script>
  const sc = document.getElementById('sc'), calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && !CSS.supports('animation-timeline', 'scroll()'))
    sc.addEventListener('scroll', () => sc.style.setProperty('--t', sc.scrollTop / (sc.scrollHeight - sc.clientHeight)), { passive: true });
  document.getElementById('rep').onclick = () => sc.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
</script>
