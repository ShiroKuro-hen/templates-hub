<style>
  @property --t{syntax:"<number>";inherits:true;initial-value:0}
  @media (prefers-reduced-motion:no-preference){
    @supports (animation-timeline:scroll()){
      #sc{animation:prog linear both;animation-timeline:scroll(self)}
      @keyframes prog{to{--t:1}}
    }
  }
  .sun{background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff))}
  .far{color:color-mix(in srgb,var(--accent) 16%,var(--surface))}
  .mid{color:color-mix(in srgb,var(--accent) 34%,var(--surface))}
  .near{color:color-mix(in srgb,var(--accent) 62%,var(--surface))}
</style>
<section class="text-sm text-fg">
  <div id="sc" tabindex="0" role="region" aria-label="Escena con capas de profundidad" class="box-content h-[360px] overflow-auto rounded-lg border border-line shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <div class="sticky top-0 h-[360px] overflow-hidden bg-gradient-to-b from-accent-soft to-surface">
      <div class="sun absolute right-[14%] top-[46px] size-[72px] rounded-full [transform:translateY(calc(60px*var(--t,0)))]"></div>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="far absolute inset-x-0 -bottom-[30%] block h-[85%] w-full fill-current [transform:translateY(calc(-24px*var(--t,0)))]"><path d="M0 90 50 50l60 35 60-50 70 45 60-35 100 50v105H0Z"/></svg>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="mid absolute inset-x-0 -bottom-[30%] block h-[70%] w-full fill-current [transform:translateY(calc(-56px*var(--t,0)))]"><path d="M0 70 70 30l60 40 80-45 70 50 60-30 60 20v145H0Z"/></svg>
      <svg viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true" class="near absolute inset-x-0 -bottom-[30%] block h-[55%] w-full fill-current [transform:translateY(calc(-100px*var(--t,0)))]"><path d="M0 60C60 20 110 20 170 55s120 20 230-15v160H0Z"/></svg>
      <div class="absolute inset-x-6 top-8 max-w-[400px] [opacity:calc(1-var(--t,0))] [transform:translateY(calc(-70px*var(--t,0)))]">
        <h1 class="text-[clamp(20px,5vw,28px)] font-bold leading-[1.2] tracking-[-0.01em]">Capas con profundidad</h1>
        <p class="mt-2 text-muted">Cada capa se mueve a su propia velocidad mientras te desplazas.</p>
      </div>
    </div>
    <div class="h-[360px]"></div>
  </div>
  <div class="mt-3 flex flex-wrap items-center justify-between gap-3 text-muted">
    <p>Desplaza dentro del recuadro para separar las capas.</p>
    <button id="rep" type="button" class="rounded-lg border border-line bg-surface px-3.5 py-[7px] font-semibold text-fg transition-colors hover:border-accent hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Volver al inicio</button>
  </div>
</section>
<script>
  const sc = document.getElementById('sc'), calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!calm && !CSS.supports('animation-timeline', 'scroll()'))
    sc.addEventListener('scroll', () => sc.style.setProperty('--t', sc.scrollTop / (sc.scrollHeight - sc.clientHeight)), { passive: true });
  document.getElementById('rep').onclick = () => sc.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
</script>
