<div class="bg-page p-5 text-sm text-fg">
  <div class="max-w-2xl rounded-lg border border-line bg-surface shadow-sm">
    <div class="flex flex-wrap items-center gap-2 border-b border-line px-4 py-3">
      <ul id="chips" aria-label="Filtros activos" class="m-0 flex list-none flex-wrap items-center gap-2 p-0"></ul>
      <select id="add" aria-label="Añadir filtro" class="cursor-pointer rounded-lg border border-line bg-surface px-3 py-1.5 hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"></select>
      <button type="button" id="clr" class="ml-auto rounded-lg px-3 py-1.5 text-accent hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Limpiar todo</button>
    </div>
    <p id="n" aria-live="polite" class="m-0 flex items-center gap-2 px-4 py-3 font-semibold tabular-nums before:size-2 before:rounded-full before:bg-gradient-to-br before:from-accent-2 before:to-accent before:content-['']"></p>
    <ul id="list" class="m-0 list-none divide-y divide-line border-t border-line p-0"></ul>
  </div>
</div>
<script>
  const T = [['No carga el panel de facturas', 'Abierto', 'Alta', 'Soporte'], ['Error 502 al exportar informes', 'Abierto', 'Alta', 'Ingeniería'],
    ['Solicitud de cotización anual', 'En curso', 'Media', 'Ventas'], ['Cambiar correo de facturación', 'Cerrado', 'Baja', 'Soporte'],
    ['Lentitud en la API de pagos', 'En curso', 'Alta', 'Ingeniería'], ['No llegan los correos de aviso', 'Abierto', 'Alta', 'Soporte']]
    .map(([t, estado, prioridad, equipo]) => ({ t, estado, prioridad, equipo }));
  const F = { estado: ['Estado', ['Abierto', 'En curso', 'Cerrado']], prioridad: ['Prioridad', ['Alta', 'Media', 'Baja']], equipo: ['Equipo', ['Soporte', 'Ventas', 'Ingeniería']] };
  const act = { estado: 'Abierto', prioridad: 'Alta' };
  const chips = document.getElementById('chips'), add = document.getElementById('add'), clr = document.getElementById('clr'), list = document.getElementById('list');
  const X = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2 2 8 8M10 2l-8 8"/></svg>';
  function render(focusIdx) {
    const on = Object.entries(act);
    chips.innerHTML = on.map(([k, v]) => `<li class="inline-flex items-center gap-0.5 rounded-full border border-accent bg-accent-soft py-0.5 pl-3 pr-0.5"><span>${F[k][0]}: <b>${v}</b></span><button type="button" data-k="${k}" aria-label="Quitar filtro ${F[k][0]}: ${v}" class="grid size-6 place-items-center rounded-full text-accent hover:bg-surface focus-visible:outline-2 focus-visible:outline-accent">${X}</button></li>`).join('')
      || '<li class="text-muted">Sin filtros activos.</li>';
    add.innerHTML = '<option value="">Añadir filtro</option>' + Object.entries(F).map(([k, [t, vs]]) =>
      `<optgroup label="${t}">${vs.filter((v) => act[k] !== v).map((v) => `<option value="${k}:${v}">${v}</option>`).join('')}</optgroup>`).join('');
    clr.hidden = !on.length;
    const hits = T.filter((x) => on.every(([k, v]) => x[k] === v));
    document.getElementById('n').textContent = `${hits.length} tickets`;
    list.innerHTML = hits.length ? hits.map((x) => `<li class="flex justify-between gap-3 px-4 py-2.5"><span>${x.t}</span><small class="whitespace-nowrap text-muted">${x.estado}, ${x.prioridad}, ${x.equipo}</small></li>`).join('')
      : '<li class="px-4 py-6 text-center text-muted">Ningún ticket coincide. Quita un filtro o pulsa «Limpiar todo».</li>';
    if (focusIdx !== undefined) { const b = chips.querySelectorAll('button'); (b[focusIdx] || b[focusIdx - 1] || add).focus(); }
  }
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const i = [...chips.querySelectorAll('button')].indexOf(b); delete act[b.dataset.k]; render(i);
  });
  add.addEventListener('change', () => { const [k, v] = add.value.split(':'); if (k) act[k] = v; render(); });
  clr.addEventListener('click', () => { for (const k in act) delete act[k]; render(); add.focus(); });
  render();
</script>
