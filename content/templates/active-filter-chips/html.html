<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .ac{max-width:680px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
  ul{list-style:none;margin:0;padding:0}
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px}
  .chip b{font-weight:600}
  .chip button{display:grid;place-items:center;width:24px;height:24px;padding:0;color:var(--accent);background:none;border:0;border-radius:999px;cursor:pointer;transition:background .14s}
  .chip button:hover{background:var(--surface)}
  select,.clr{font:inherit;padding:5px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .14s}
  select:hover,.clr:hover{border-color:var(--accent)}
  .clr{margin-left:auto;color:var(--accent);border-color:transparent;background:none}
  .clr[hidden]{display:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{margin:0;color:var(--muted)}
  .head{display:flex;align-items:center;gap:8px;margin:0;padding:12px 16px;font-weight:600;font-variant-numeric:tabular-nums}
  .head::before{content:"";width:8px;height:8px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  #list li{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--border)}
  #list small{color:var(--muted);white-space:nowrap}
  #list .empty{display:block;padding:24px 16px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ac">
  <div class="bar">
    <ul class="chips" id="chips" aria-label="Filtros activos"></ul>
    <select id="add" aria-label="Añadir filtro"></select>
    <button type="button" class="clr" id="clr">Limpiar todo</button>
  </div>
  <p class="head" id="n" aria-live="polite"></p>
  <ul id="list"></ul>
</div>
<script>
  const T = [['No carga el panel de facturas', 'Abierto', 'Alta', 'Soporte'], ['Error 502 al exportar informes', 'Abierto', 'Alta', 'Ingeniería'],
    ['Solicitud de cotización anual', 'En curso', 'Media', 'Ventas'], ['Cambiar correo de facturación', 'Cerrado', 'Baja', 'Soporte'],
    ['Lentitud en la API de pagos', 'En curso', 'Alta', 'Ingeniería'], ['Duda sobre el plan Team', 'Abierto', 'Media', 'Ventas'],
    ['No llegan los correos de aviso', 'Abierto', 'Alta', 'Soporte'], ['Actualizar logo en facturas', 'Cerrado', 'Baja', 'Ventas'],
    ['Permisos de usuario invitado', 'En curso', 'Media', 'Soporte'], ['Integración con el CRM', 'Abierto', 'Baja', 'Ingeniería']]
    .map(([t, estado, prioridad, equipo]) => ({ t, estado, prioridad, equipo }));
  const F = { estado: ['Estado', ['Abierto', 'En curso', 'Cerrado']], prioridad: ['Prioridad', ['Alta', 'Media', 'Baja']], equipo: ['Equipo', ['Soporte', 'Ventas', 'Ingeniería']] };
  const act = { estado: 'Abierto', prioridad: 'Alta' };
  const chips = document.getElementById('chips'), add = document.getElementById('add'), clr = document.getElementById('clr'), list = document.getElementById('list');
  const X = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m2 2 8 8M10 2l-8 8"/></svg>';
  function render(focusIdx) {
    const on = Object.entries(act);
    chips.innerHTML = on.map(([k, v]) => `<li class="chip"><span>${F[k][0]}: <b>${v}</b></span><button type="button" data-k="${k}" aria-label="Quitar filtro ${F[k][0]}: ${v}">${X}</button></li>`).join('')
      || '<li class="hint">Sin filtros activos.</li>';
    add.innerHTML = '<option value="">Añadir filtro</option>' + Object.entries(F).map(([k, [t, vs]]) =>
      `<optgroup label="${t}">${vs.filter((v) => act[k] !== v).map((v) => `<option value="${k}:${v}">${v}</option>`).join('')}</optgroup>`).join('');
    clr.hidden = !on.length;
    const hits = T.filter((x) => on.every(([k, v]) => x[k] === v));
    document.getElementById('n').textContent = `${hits.length} tickets`;
    list.innerHTML = hits.length ? hits.map((x) => `<li><span>${x.t}</span><small>${x.estado}, ${x.prioridad}, ${x.equipo}</small></li>`).join('')
      : '<li class="empty">Ningún ticket coincide. Quita un filtro o pulsa «Limpiar todo».</li>';
    if (focusIdx !== undefined) { const b = chips.querySelectorAll('button'); (b[focusIdx] || b[focusIdx - 1] || add).focus(); }
  }
  chips.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const i = [...chips.querySelectorAll('button')].indexOf(b); delete act[b.dataset.k]; render(i);
  });
  add.addEventListener('change', () => { const [k, v] = add.value.split(':'); if (k) act[k] = v; render(); });
  clr.addEventListener('click', () => { for (const k in act) delete act[k]; render(); add.focus(); });
  render();
</script>
</body>
</html>
