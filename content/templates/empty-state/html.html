<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado vacío</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .empty { max-width:440px; margin:0 auto; padding:24px 24px 20px; text-align:center; background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius); }
  .empty svg { display:block; width:112px; height:auto; margin:0 auto 8px; color:var(--muted); }
  .empty svg .lid { fill:var(--accent-soft); }
  .empty svg .box { fill:var(--surface); }
  .empty svg .slot { fill:var(--accent); stroke:none; }
  .empty svg .spark { stroke:var(--accent); }
  .empty h2 { margin:0 0 4px; font-size:1.125rem; font-weight:600; letter-spacing:-.01em; }
  .empty p { max-width:34ch; margin:0 auto 16px; color:var(--muted); }
  .actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 12px; }
  .btn { padding:8px 16px; font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:1px solid var(--accent); border-radius:var(--radius); cursor:pointer; transition:filter 140ms; }
  .btn:hover { filter:brightness(1.08); }
  .link { padding:8px 12px; font:inherit; font-weight:500; color:var(--accent); background:none; border:0; border-radius:var(--radius); cursor:pointer; transition:background 140ms; }
  .link:hover { background:var(--accent-soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .empty .note { min-height:1.5em; margin:12px 0 0; font-size:13px; color:var(--ok); }
  @media (prefers-reduced-motion:reduce) { .btn, .link { transition:none; } }
</style>
</head>
<body>
  <section class="empty" aria-labelledby="t">
    <svg viewBox="0 0 160 112" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="80" cy="20" r="10" stroke-dasharray="3 5"/>
      <path class="spark" d="M126 14v14M119 21h14"/>
      <path class="lid" d="M26 66l12-16h22l6 16zM134 66l-12-16h-22l-6 16z"/>
      <rect class="box" x="26" y="66" width="108" height="34" rx="5"/>
      <rect class="slot" x="60" y="77" width="40" height="7" rx="3.5"/>
    </svg>
    <h2 id="t">Aún no tienes proyectos</h2>
    <p>Crea el primero para empezar a organizar tu trabajo.</p>
    <div class="actions">
      <button class="btn" id="create" type="button">Crear proyecto</button>
      <button class="link" type="button">Importar desde CSV</button>
    </div>
    <p class="note" id="note" role="status"></p>
  </section>
<script>
  document.getElementById('create').addEventListener('click', () => {
    document.getElementById('note').textContent = 'Proyecto creado: «Sin título». Aquí abrirías el editor.';
  });
</script>
</body>
</html>
