<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textarea con contador</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  label { display:block; margin-bottom:6px; font-weight:600; }
  textarea { display:block; width:100%; height:130px; padding:10px 12px; resize:vertical; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  textarea::placeholder { color:var(--muted); }
  textarea:focus-visible { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:2px; }
  .meta { display:flex; align-items:center; gap:12px; margin-top:12px; font-size:12px; font-variant-numeric:tabular-nums; }
  progress { flex:1; height:6px; appearance:none; border:0; border-radius:999px; background:var(--border); overflow:hidden; }
  progress::-webkit-progress-bar { background:var(--border); }
  progress::-webkit-progress-value { background:linear-gradient(90deg,#22d3ee,#2f5bff); border-radius:999px; }
  progress::-moz-progress-bar { background:linear-gradient(90deg,#22d3ee,#2f5bff); border-radius:999px; }
  .warn progress::-webkit-progress-value { background:var(--warn); } .warn progress::-moz-progress-bar { background:var(--warn); }
  .full progress::-webkit-progress-value { background:var(--err); } .full progress::-moz-progress-bar { background:var(--err); }
  #left { min-width:120px; text-align:right; color:var(--muted); }
  .warn #left { color:var(--text); font-weight:600; } .full #left { color:var(--err); font-weight:600; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
</style>
</head>
<body>
  <label for="t">Cuéntanos tu experiencia</label>
  <textarea id="t" maxlength="140" placeholder="Escribe tu reseña…" aria-describedby="count">Gracias por el pedido: llegó un día antes, venía bien empacado y el color es idéntico al de las fotos. ¡Volveré pronto!</textarea>
  <div class="meta" id="meta">
    <progress id="bar" max="140" value="0" aria-hidden="true"></progress>
    <span id="count" aria-hidden="true"><b id="n">0</b> / 140</span>
    <span id="left" aria-hidden="true"></span>
  </div>
  <p class="sr" id="live" role="status"></p>
<script>
  const t = document.getElementById('t'), bar = document.getElementById('bar'), n = document.getElementById('n');
  const left = document.getElementById('left'), meta = document.getElementById('meta'), live = document.getElementById('live');
  const MAX = t.maxLength; let lastBand = '';
  function update() {
    const len = t.value.length, rest = MAX - len;
    const band = rest <= 0 ? 'full' : len / MAX >= .85 ? 'warn' : '';
    bar.value = len; n.textContent = len;
    meta.className = 'meta ' + band;
    left.textContent = rest <= 0 ? 'Límite alcanzado' : band ? `Te quedan ${rest}` : '';
    if (band !== lastBand) { live.textContent = band === 'full' ? 'Has alcanzado el límite de caracteres.' : band ? `Quedan ${rest} caracteres.` : ''; lastBand = band; }
  }
  t.addEventListener('input', update);
  update();
</script>
</body>
</html>
