<div class="p-5 text-fg">
  <label for="t" class="mb-1.5 block font-semibold">Cuéntanos tu experiencia</label>
  <textarea id="t" maxlength="140" placeholder="Escribe tu reseña…"
    class="block h-[130px] w-full resize-y rounded-lg border border-line bg-surface px-3 py-2.5 shadow-sm placeholder:text-muted focus-visible:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"></textarea>
  <div class="mt-3 flex items-center gap-3 text-xs tabular-nums">
    <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-line" aria-hidden="true">
      <div id="bar" class="h-full w-0 rounded-full bg-gradient-to-r from-accent-2 to-accent"></div>
    </div>
    <span id="count" class="text-muted" aria-hidden="true">0 / 140</span>
  </div>
  <p id="live" role="status" class="sr-only"></p>
</div>
<script>
  const t = document.getElementById('t'), bar = document.getElementById('bar'), count = document.getElementById('count'), live = document.getElementById('live');
  let band = '';
  t.addEventListener('input', () => {
    const len = t.value.length, max = t.maxLength, ratio = len / max;
    bar.style.width = ratio * 100 + '%';
    bar.className = 'h-full rounded-full ' + (ratio >= 1 ? 'bg-err' : ratio >= 0.85 ? 'bg-warn' : 'bg-gradient-to-r from-accent-2 to-accent');
    count.textContent = `${len} / ${max}`;
    const b = ratio >= 1 ? 'full' : ratio >= 0.85 ? 'warn' : '';
    if (b !== band) { band = b; live.textContent = b ? `Quedan ${max - len} caracteres.` : ''; }
  });
</script>
