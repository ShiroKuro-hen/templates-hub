<div class="p-5 text-slate-900 dark:text-slate-100">
  <label for="t" class="mb-1.5 block font-semibold">Cuéntanos tu experiencia</label>
  <textarea id="t" maxlength="140" placeholder="Escribe tu reseña…"
    class="block h-[130px] w-full resize-y rounded-lg border border-slate-200 bg-white px-3 py-2.5 shadow-sm placeholder:text-slate-500 focus-visible:border-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:placeholder:text-slate-400"></textarea>
  <div class="mt-3 flex items-center gap-3 text-xs tabular-nums">
    <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700" aria-hidden="true">
      <div id="bar" class="h-full w-0 rounded-full bg-gradient-to-r from-cyan-400 to-blue-600"></div>
    </div>
    <span id="count" class="text-slate-500 dark:text-slate-400" aria-hidden="true">0 / 140</span>
  </div>
  <p id="live" role="status" class="sr-only"></p>
</div>
<script>
  const t = document.getElementById('t'), bar = document.getElementById('bar'), count = document.getElementById('count'), live = document.getElementById('live');
  let band = '';
  t.addEventListener('input', () => {
    const len = t.value.length, max = t.maxLength, ratio = len / max;
    bar.style.width = ratio * 100 + '%';
    bar.className = 'h-full rounded-full ' + (ratio >= 1 ? 'bg-red-500' : ratio >= 0.85 ? 'bg-amber-500' : 'bg-gradient-to-r from-cyan-400 to-blue-600');
    count.textContent = `${len} / ${max}`;
    const b = ratio >= 1 ? 'full' : ratio >= 0.85 ? 'warn' : '';
    if (b !== band) { band = b; live.textContent = b ? `Quedan ${max - len} caracteres.` : ''; }
  });
</script>
