<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set de iconos</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  h1 { margin:0; font-size:1.1rem; font-weight:600; letter-spacing:-.01em; }
  #st { margin:0; font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; margin:0; padding:0; list-style:none; }
  .ico { width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px 8px; font:12px system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:border-color .14s, color .14s, box-shadow .14s; }
  .ico:hover { color:var(--accent); border-color:var(--accent); box-shadow:var(--shadow); }
  .ico:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .ico svg { width:24px; height:24px; color:var(--text); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ico:hover svg { color:var(--accent); }
  @media (prefers-reduced-motion:reduce) { .ico { transition:none; } }
</style>
</head>
<body>
  <header>
    <h1>Iconos</h1>
    <p id="st" role="status">Clic para copiar el SVG</p>
  </header>
  <ul class="grid" id="g"></ul>
<script>
  const ICONS = {
    inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    buscar: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    usuario: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    correo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    corazón: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
    estrella: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    ajustes: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
    aviso: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
    papelera: '<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>',
    editar: '<path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/>',
    listo: '<path d="M4 12l5 5L20 6"/>',
    cerrar: '<path d="M5 5l14 14M19 5L5 19"/>',
    añadir: '<path d="M12 4v16M4 12h16"/>',
    descargar: '<path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/>',
    candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
  };
  const st = document.getElementById('st');
  async function copy(name, d) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    try { await navigator.clipboard.writeText(svg); }
    catch { const t = document.createElement('textarea'); t.value = svg; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    st.textContent = 'Copiado: ' + name;
  }
  for (const [name, d] of Object.entries(ICONS)) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.className = 'ico'; b.setAttribute('aria-label', 'Copiar SVG de ' + name);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg><span>${name}</span>`;
    b.onclick = () => copy(name, d);
    li.append(b); g.append(li);
  }
</script>
</body>
</html>
