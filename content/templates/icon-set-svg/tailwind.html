<div class="p-3">
  <p id="st" role="status" class="mb-3 text-xs text-slate-500 dark:text-slate-400">Clic para copiar el SVG</p>
  <ul id="g" class="grid grid-cols-4 gap-2"></ul>
</div>
<script>
  const ICONS = {
    inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    buscar: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    listo: '<path d="M4 12l5 5L20 6"/>',
    cerrar: '<path d="M5 5l14 14M19 5L5 19"/>',
  };
  const cls = 'flex w-full flex-col items-center gap-1 rounded-lg border border-slate-200 bg-white px-1 pt-3 pb-2 text-xs text-slate-500 shadow-sm transition hover:border-blue-600 hover:text-blue-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-400 dark:hover:border-blue-500 dark:hover:text-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500';
  for (const [name, d] of Object.entries(ICONS)) {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.setAttribute('aria-label', 'Copiar SVG de ' + name);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true" class="h-6 w-6 fill-none stroke-current stroke-2 text-slate-900 dark:text-slate-100 [stroke-linecap:round] [stroke-linejoin:round]">${d}</svg>${name}`;
    b.onclick = async () => {
      await navigator.clipboard.writeText(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`);
      document.getElementById('st').textContent = 'Copiado: ' + name;
    };
    li.append(b); document.getElementById('g').append(li);
  }
</script>
