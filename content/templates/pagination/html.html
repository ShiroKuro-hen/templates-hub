<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paginación</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .status { margin:0 0 16px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pager { display:flex; align-items:center; justify-content:center; gap:8px; }
  .pager ul { display:flex; align-items:center; gap:4px; margin:0; padding:0; list-style:none; }
  .pg { display:inline-flex; align-items:center; justify-content:center; gap:4px; min-width:36px; height:36px; padding:0 12px; font:inherit; font-weight:500; font-variant-numeric:tabular-nums; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:background .14s, border-color .14s, color .14s; }
  .pg svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pg:hover { border-color:var(--accent); color:var(--accent); }
  .pg[aria-current] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .pg[aria-disabled="true"] { opacity:.45; background:var(--surface); border-color:var(--border); color:var(--text); cursor:not-allowed; }
  .gap { min-width:20px; text-align:center; color:var(--muted); }
  @media (max-width:520px) {
    .pager, .pager ul { gap:2px; }
    .pg { min-width:30px; height:36px; padding:0 4px; }
    .txt { display:none; }
    .gap { min-width:14px; }
  }
  @media (prefers-reduced-motion:reduce) { .pg { transition:none; } }
</style>
</head>
<body>
  <p class="status" id="status" aria-live="polite"></p>
  <nav class="pager" aria-label="Paginación">
    <button class="pg" id="prev" type="button" aria-label="Página anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="txt">Anterior</span></button>
    <ul id="pages"></ul>
    <button class="pg" id="next" type="button" aria-label="Página siguiente"><span class="txt">Siguiente</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </nav>
<script>
  const TOTAL = 12, PER = 10, COUNT = 120;
  let page = 4;
  const ul = document.getElementById('pages'), prev = document.getElementById('prev'),
        next = document.getElementById('next'), status = document.getElementById('status');

  function pageList(p, total) {
    const nums = [...new Set([1, p - 1, p, p + 1, total])].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
    const out = []; let last = 0;
    for (const n of nums) {
      if (n - last === 2) out.push(last + 1);
      else if (n - last > 2) out.push('…');
      out.push(n); last = n;
    }
    return out;
  }
  function render(focusCurrent) {
    ul.innerHTML = pageList(page, TOTAL).map((n) => n === '…'
      ? '<li class="gap" aria-hidden="true">…</li>'
      : `<li><button class="pg" type="button" data-p="${n}" aria-label="Página ${n}"${n === page ? ' aria-current="page"' : ''}>${n}</button></li>`).join('');
    prev.setAttribute('aria-disabled', page === 1);
    next.setAttribute('aria-disabled', page === TOTAL);
    status.textContent = `Mostrando ${(page - 1) * PER + 1}–${Math.min(page * PER, COUNT)} de ${COUNT} resultados`;
    if (focusCurrent) ul.querySelector('[aria-current]').focus();
  }
  const go = (p, focusCurrent) => { page = Math.min(TOTAL, Math.max(1, p)); render(focusCurrent); };
  ul.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) go(+b.dataset.p, true); });
  prev.addEventListener('click', () => go(page - 1));
  next.addEventListener('click', () => go(page + 1));
  render();
</script>
</body>
</html>
