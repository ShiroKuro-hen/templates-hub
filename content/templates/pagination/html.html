<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; font:14px/1.5 system-ui, sans-serif; background:#f6f1e7; color:#17130f; }
  :focus-visible { outline:3px solid #ff5a36; outline-offset:2px; }
  .status { margin:0 0 18px; font:13px ui-monospace, monospace; color:#6b6258; }
  .pager { display:flex; align-items:center; justify-content:center; gap:8px; }
  .pager ul { display:flex; align-items:center; gap:6px; margin:0; padding:0; list-style:none; }
  .pg { min-width:40px; height:40px; padding:0 12px; font:inherit; font-weight:700; color:inherit; background:#fffdf8; border:2px solid #17130f; border-radius:10px; box-shadow:4px 4px 0 #17130f; cursor:pointer; }
  .pg:hover { background:#ffd84d; transform:translate(2px,2px); box-shadow:2px 2px 0 #17130f; }
  .pg[aria-current] { background:#17130f; color:#fffdf8; }
  .pg[aria-disabled="true"] { opacity:.45; box-shadow:none; transform:none; background:#fffdf8; cursor:not-allowed; }
  .gap { min-width:20px; text-align:center; color:#6b6258; }
  @media (max-width:520px) {
    .pager, .pager ul { gap:3px; }
    .pg { min-width:30px; height:36px; padding:0 4px; box-shadow:3px 3px 0 #17130f; }
    .txt { display:none; }
    .gap { min-width:14px; }
  }
  @media (prefers-reduced-motion:reduce) { .pg { transform:none !important; } }
</style>
</head>
<body>
  <p class="status" id="status" aria-live="polite"></p>
  <nav class="pager" aria-label="Paginación">
    <button class="pg" id="prev" type="button" aria-label="Página anterior">← <span class="txt">Anterior</span></button>
    <ul id="pages"></ul>
    <button class="pg" id="next" type="button" aria-label="Página siguiente"><span class="txt">Siguiente</span> →</button>
  </nav>
<script>
  const TOTAL = 12, PER = 10, COUNT = 120;
  let page = 4;
  const ul = document.getElementById('pages'), prev = document.getElementById('prev'),
        next = document.getElementById('next'), status = document.getElementById('status');

  function pageList(p, total) {
    const nums = [...new Set([1, p - 1, p, p + 1, total])].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
    const out = []; let last = 0;
    for (const n of nums) {
      if (n - last === 2) out.push(last + 1);
      else if (n - last > 2) out.push('…');
      out.push(n); last = n;
    }
    return out;
  }
  function render(focusCurrent) {
    ul.innerHTML = pageList(page, TOTAL).map((n) => n === '…'
      ? '<li class="gap" aria-hidden="true">…</li>'
      : `<li><button class="pg" type="button" data-p="${n}" aria-label="Página ${n}"${n === page ? ' aria-current="page"' : ''}>${n}</button></li>`).join('');
    prev.setAttribute('aria-disabled', page === 1);
    next.setAttribute('aria-disabled', page === TOTAL);
    status.textContent = `Mostrando ${(page - 1) * PER + 1}–${Math.min(page * PER, COUNT)} de ${COUNT} resultados`;
    if (focusCurrent) ul.querySelector('[aria-current]').focus();
  }
  const go = (p, focusCurrent) => { page = Math.min(TOTAL, Math.max(1, p)); render(focusCurrent); };
  ul.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) go(+b.dataset.p, true); });
  prev.addEventListener('click', () => go(page - 1));
  next.addEventListener('click', () => go(page + 1));
  render();
</script>
</body>
</html>
