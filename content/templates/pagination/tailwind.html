<div class="p-5 text-sm text-fg">
  <p id="status" aria-live="polite" class="mb-4 text-center tabular-nums text-muted"></p>
  <nav aria-label="Paginación" class="flex items-center justify-center gap-0.5 sm:gap-2">
    <button id="prev" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round]"><path d="M15 6l-6 6 6 6"/></svg><span class="max-sm:hidden">Anterior</span>
    </button>
    <ul id="pages" class="m-0 flex list-none items-center gap-0.5 p-0 sm:gap-1"></ul>
    <button id="next" type="button" aria-label="Página siguiente">
      <span class="max-sm:hidden">Siguiente</span><svg viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round]"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>
</div>

<script>
  // Clases Tailwind repetidas (cópialas a @apply .pg si prefieres)
  const BTN = 'inline-flex h-9 min-w-[30px] items-center justify-center gap-1 rounded-lg border px-1 font-medium tabular-nums transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:min-w-9 sm:px-3';
  const OFF = 'border-line bg-surface text-fg shadow-sm hover:border-accent hover:text-accent';
  const ON = 'border-accent bg-accent text-accent-ink';
  const TOTAL = 12, PER = 10, COUNT = 120;
  let page = 4;
  const ul = document.getElementById('pages'), prev = document.getElementById('prev'),
        next = document.getElementById('next'), status = document.getElementById('status');
  [prev, next].forEach((b) => (b.className = `${BTN} ${OFF} aria-disabled:cursor-not-allowed aria-disabled:opacity-45`));

  function pageList(p, total) {
    const nums = [...new Set([1, p - 1, p, p + 1, total])].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
    const out = []; let last = 0;
    for (const n of nums) {
      if (n - last === 2) out.push(last + 1);
      else if (n - last > 2) out.push('…');
      out.push(n); last = n;
    }
    return out;
  }
  function render(focusCurrent) {
    ul.innerHTML = pageList(page, TOTAL).map((n) => n === '…'
      ? '<li aria-hidden="true" class="min-w-3.5 text-center text-muted sm:min-w-5">…</li>'
      : `<li><button type="button" data-p="${n}" aria-label="Página ${n}"${n === page ? ' aria-current="page"' : ''} class="${BTN} ${n === page ? ON : OFF}">${n}</button></li>`).join('');
    prev.setAttribute('aria-disabled', page === 1);
    next.setAttribute('aria-disabled', page === TOTAL);
    status.textContent = `Mostrando ${(page - 1) * PER + 1}–${Math.min(page * PER, COUNT)} de ${COUNT} resultados`;
    if (focusCurrent) ul.querySelector('[aria-current]').focus();
  }
  const go = (p, f) => { page = Math.min(TOTAL, Math.max(1, p)); render(f); };
  ul.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) go(+b.dataset.p, true); });
  prev.addEventListener('click', () => go(page - 1));
  next.addEventListener('click', () => go(page + 1));
  render();
</script>
