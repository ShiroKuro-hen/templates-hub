<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{--c:#2f5bff;max-width:460px;margin:0 auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0;font-size:18px;line-height:1.3}
  .sub{margin:2px 0 16px;color:var(--muted)}
  .prev{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 20px;min-height:88px;padding:14px 16px;border-radius:var(--radius);background:linear-gradient(135deg,var(--c) 60%,color-mix(in srgb,var(--c) 55%,#22d3ee));font-size:18px;font-weight:600}
  .prev span:first-child{color:#fff}
  .prev span:last-child{color:#000}
  .ratios{display:grid;gap:6px;margin:12px 0 16px;padding:0;list-style:none;font-variant-numeric:tabular-nums}
  .ratios li{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .badge{padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--ok-soft);color:var(--ok)}
  .badge.no{background:var(--err-soft);color:var(--err)}
  .ctl{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
  .f{display:grid;gap:6px}
  label{font-weight:600}
  input[type=color]{box-sizing:border-box;width:44px;height:40px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
  #x{width:110px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-variant-numeric:tabular-nums;text-transform:uppercase}
  #x[aria-invalid=true]{border-color:var(--err)}
  input:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rgb{margin:0;padding-bottom:8px;color:var(--muted);font-variant-numeric:tabular-nums}
  .err{min-height:21px;margin:6px 0 0;color:var(--err);font-size:13px}
  .sws{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;border:0}
  legend{padding:0;margin-bottom:8px;font-weight:600}
  .sw{width:36px;height:36px;padding:0;background:var(--c);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:#fff;font-size:16px;line-height:1;transition:transform .14s}
  .sw:hover{transform:translateY(-1px)}
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
  .sw[aria-pressed=true]::after{content:"\2713"}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card" id="card">
  <h1>Color de marca</h1>
  <p class="sub">Se usará en botones y enlaces de tu espacio.</p>
  <div class="prev" aria-hidden="true"><span>Aa Texto blanco</span><span>Aa Texto negro</span></div>
  <ul class="ratios" aria-live="polite">
    <li>Texto blanco <b id="rw"></b> <span class="badge" id="bw"></span></li>
    <li>Texto negro <b id="rk"></b> <span class="badge" id="bk"></span></li>
  </ul>
  <div class="ctl">
    <input type="color" id="c" aria-label="Elegir color" value="#2f5bff">
    <div class="f"><label for="x">Valor HEX</label><input id="x" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="xe"></div>
    <p class="rgb" id="rgb"></p>
  </div>
  <p class="err" id="xe" role="alert"></p>
  <fieldset class="sws">
    <legend>Muestras</legend>
    <button type="button" class="sw" style="--c:#2f5bff" data-hex="#2f5bff" aria-label="Ultramar #2F5BFF"></button>
    <button type="button" class="sw" style="--c:#0891b2" data-hex="#0891b2" aria-label="Cian #0891B2"></button>
    <button type="button" class="sw" style="--c:#0e9f6e" data-hex="#0e9f6e" aria-label="Esmeralda #0E9F6E"></button>
    <button type="button" class="sw" style="--c:#b7791f" data-hex="#b7791f" aria-label="Ámbar #B7791F"></button>
    <button type="button" class="sw" style="--c:#d92d4a" data-hex="#d92d4a" aria-label="Coral #D92D4A"></button>
    <button type="button" class="sw" style="--c:#7c3aed" data-hex="#7c3aed" aria-label="Violeta #7C3AED"></button>
    <button type="button" class="sw" style="--c:#334155" data-hex="#334155" aria-label="Pizarra #334155"></button>
    <button type="button" class="sw" style="--c:#0e1726" data-hex="#0e1726" aria-label="Grafito #0E1726"></button>
  </fieldset>
</main>
<script>
  const $ = (id) => document.getElementById(id), c = $('c'), x = $('x'), HEX = /^#[0-9a-f]{6}$/i;
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (v) => { const [r, g, b] = v.map((n) => { n /= 255; return n <= 0.03928 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [p, q] = [lum(a), lum(b)].sort((m, n) => n - m); return (p + 0.05) / (q + 0.05); };
  function set(hex, from) {
    hex = hex.toLowerCase(); c.value = hex; $('card').style.setProperty('--c', hex);
    if (from !== x) x.value = hex;
    x.removeAttribute('aria-invalid'); $('xe').textContent = '';
    const v = rgb(hex); $('rgb').textContent = `rgb(${v.join(', ')})`;
    [['w', [255, 255, 255]], ['k', [0, 0, 0]]].forEach(([k, fg]) => {
      const r = ratio(v, fg), ok = r >= 4.5;
      $('r' + k).textContent = r.toFixed(1).replace('.', ',') + ':1';
      $('b' + k).textContent = ok ? 'Cumple AA' : 'No cumple AA'; $('b' + k).classList.toggle('no', !ok);
    });
    document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', b.dataset.hex === hex));
  }
  c.oninput = () => set(c.value);
  x.oninput = () => { const v = '#' + x.value.replace(/[^0-9a-f]/gi, ''); x.value = v; if (HEX.test(v)) set(v, x); };
  x.onblur = () => {
    let v = x.value; if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + [...v.slice(1)].map((d) => d + d).join('');
    const ok = HEX.test(v); if (ok) set(v);
    x.setAttribute('aria-invalid', !ok); $('xe').textContent = ok ? '' : 'Escribe un HEX de 6 dígitos, como #2F5BFF.';
  };
  document.querySelectorAll('.sw').forEach((b) => (b.onclick = () => set(b.dataset.hex)));
  set('#2f5bff');
</script>
</body>
</html>
