<style>
  #card{--c:var(--accent,#2f5bff)}
  .prev{background:linear-gradient(135deg,var(--c) 60%,color-mix(in srgb,var(--c) 55%,var(--accent-2,#22d3ee)))}
  .prev>span:first-child{color:#fff}
  .prev>span:last-child{color:#000}
  #sws button{color:#fff}
</style>
<main id="card" class="mx-auto box-content max-w-[460px] rounded-lg border border-line bg-surface p-6 text-sm text-fg shadow-sm">
  <h1 class="text-[18px] font-bold leading-[1.3]">Color de marca</h1>
  <p class="mb-4 mt-0.5 text-muted">Se usará en botones y enlaces de tu espacio.</p>
  <div id="prev" aria-hidden="true" class="prev box-content flex min-h-[88px] flex-wrap items-end gap-x-5 gap-y-1 rounded-lg px-4 py-3.5 text-[18px] font-semibold leading-[1.5]"><span>Aa Texto blanco</span><span>Aa Texto negro</span></div>
  <ul aria-live="polite" class="mb-4 mt-3 grid list-none gap-1.5 p-0 tabular-nums">
    <li class="flex flex-wrap items-center gap-2">Texto blanco <b id="rw"></b> <span id="bw" class="rounded-full bg-ok-soft px-2 text-[12px] font-semibold leading-[1.5] text-ok"></span></li>
    <li class="flex flex-wrap items-center gap-2">Texto negro <b id="rk"></b> <span id="bk" class="rounded-full bg-ok-soft px-2 text-[12px] font-semibold leading-[1.5] text-ok"></span></li>
  </ul>
  <div class="flex flex-wrap items-end gap-3">
    <input type="color" id="c" aria-label="Elegir color" value="#2f5bff" class="box-border h-10 w-11 cursor-pointer rounded-lg border border-line bg-surface p-[3px] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <div class="grid gap-1.5">
      <label for="x" class="font-semibold">Valor HEX</label>
      <input id="x" maxlength="7" spellcheck="false" autocomplete="off" aria-describedby="xe" class="box-content w-[110px] rounded-lg border border-line bg-surface px-3 py-2 uppercase tabular-nums text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent [&[aria-invalid=true]]:border-err">
    </div>
    <p id="rgb" class="pb-2 tabular-nums text-muted"></p>
  </div>
  <p id="xe" role="alert" class="mt-1.5 min-h-[21px] text-[13px] text-err"></p>
  <fieldset id="sws" class="m-0 flex flex-wrap gap-2 border-0 p-0 [&_button]:size-9 [&_button]:cursor-pointer [&_button]:rounded-lg [&_button]:border [&_button]:border-line [&_button]:bg-(--c) [&_button]:text-base [&_button]:leading-none [&_button]:transition-transform [&_button:hover]:-translate-y-px [&_button:focus-visible]:outline-2 [&_button:focus-visible]:outline-offset-2 [&_button:focus-visible]:outline-accent motion-reduce:[&_button]:transition-none [&_button[aria-pressed=true]]:ring-1 [&_button[aria-pressed=true]]:ring-accent [&_button[aria-pressed=true]]:ring-offset-2 [&_button[aria-pressed=true]]:ring-offset-surface [&_button[aria-pressed=true]::after]:content-['✓']">
    <legend class="mb-2 p-0 font-semibold">Muestras</legend>
    <button type="button" style="--c:#2f5bff" data-hex="#2f5bff" aria-label="Ultramar #2F5BFF"></button>
    <button type="button" style="--c:#0891b2" data-hex="#0891b2" aria-label="Cian #0891B2"></button>
    <button type="button" style="--c:#0e9f6e" data-hex="#0e9f6e" aria-label="Esmeralda #0E9F6E"></button>
    <button type="button" style="--c:#b7791f" data-hex="#b7791f" aria-label="Ámbar #B7791F"></button>
    <button type="button" style="--c:#d92d4a" data-hex="#d92d4a" aria-label="Coral #D92D4A"></button>
    <button type="button" style="--c:#7c3aed" data-hex="#7c3aed" aria-label="Violeta #7C3AED"></button>
    <button type="button" style="--c:#334155" data-hex="#334155" aria-label="Pizarra #334155"></button>
    <button type="button" style="--c:#0e1726" data-hex="#0e1726" aria-label="Grafito #0E1726"></button>
  </fieldset>
</main>
<script>
  const $ = (id) => document.getElementById(id), c = $('c'), x = $('x'), HEX = /^#[0-9a-f]{6}$/i;
  const BASE = 'rounded-full px-2 text-[12px] font-semibold leading-[1.5] ', OK = 'bg-ok-soft text-ok', NO = 'bg-err-soft text-err';
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const lum = (v) => { const [r, g, b] = v.map((n) => { n /= 255; return n <= 0.03928 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const ratio = (a, b) => { const [p, q] = [lum(a), lum(b)].sort((m, n) => n - m); return (p + 0.05) / (q + 0.05); };
  function set(hex, from) {
    hex = hex.toLowerCase(); c.value = hex; $('card').style.setProperty('--c', hex);
    if (from !== x) x.value = hex;
    x.removeAttribute('aria-invalid'); $('xe').textContent = '';
    const v = rgb(hex); $('rgb').textContent = `rgb(${v.join(', ')})`;
    [['w', [255, 255, 255]], ['k', [0, 0, 0]]].forEach(([k, fg]) => {
      const r = ratio(v, fg), ok = r >= 4.5;
      $('r' + k).textContent = r.toFixed(1).replace('.', ',') + ':1';
      $('b' + k).textContent = ok ? 'Cumple AA' : 'No cumple AA'; $('b' + k).className = BASE + (ok ? OK : NO);
    });
    document.querySelectorAll('#sws button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.hex === hex));
  }
  c.oninput = () => set(c.value);
  x.oninput = () => { const v = '#' + x.value.replace(/[^0-9a-f]/gi, ''); x.value = v; if (HEX.test(v)) set(v, x); };
  x.onblur = () => {
    let v = x.value; if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + [...v.slice(1)].map((d) => d + d).join('');
    const ok = HEX.test(v); if (ok) set(v);
    x.setAttribute('aria-invalid', !ok); $('xe').textContent = ok ? '' : 'Escribe un HEX de 6 dígitos, como #2f5bff.';
  };
  document.querySelectorAll('#sws button').forEach((b) => (b.onclick = () => set(b.dataset.hex)));
  set('#2f5bff');
</script>
