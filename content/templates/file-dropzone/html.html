<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .uploader{max-width:560px;margin:0 auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0 0 12px;font-size:16px}
  .drop{position:relative;display:grid;justify-items:center;gap:6px;padding:28px 16px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s,border-color .14s}
  .drop:hover,.drop.over{background:var(--accent-soft);border-color:var(--accent)}
  .drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .drop input{position:absolute;width:1px;height:1px;opacity:0}
  .ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--accent-ink);background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .link{color:var(--accent);font-weight:600}
  small{color:var(--muted)}
  .msg{margin:12px 0 0;padding:8px 12px;border-radius:var(--radius);background:var(--err-soft);color:var(--err)}
  .msg:empty{display:none}
  ul{list-style:none;margin:12px 0 0;padding:0}
  li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
  .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .size{color:var(--muted);font-variant-numeric:tabular-nums}
  li button{font:inherit;padding:4px 10px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:color .14s,border-color .14s}
  li button:hover{color:var(--err);border-color:var(--err)}
  li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{color:var(--muted);justify-content:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="uploader" aria-labelledby="t">
  <h2 id="t">Adjunta tus facturas</h2>
  <label class="drop" id="drop">
    <input type="file" id="f" multiple accept=".pdf,.png,.jpg,.jpeg" aria-describedby="hint">
    <span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span>
    <span><strong>Arrastra archivos aquí</strong> o <span class="link">elígelos desde tu equipo</span></span>
    <small id="hint">PDF, PNG o JPG. Máximo 10 MB por archivo.</small>
  </label>
  <p class="msg" id="msg" role="alert"></p>
  <ul id="list" aria-label="Archivos seleccionados" aria-live="polite"></ul>
</section>
<script>
  const MAX = 10 * 1024 * 1024;
  const input = document.getElementById('f'), drop = document.getElementById('drop');
  const list = document.getElementById('list'), msg = document.getElementById('msg');
  let files = [];
  const fmt = (b) => b < 1048576 ? Math.ceil(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

  function add(incoming) {
    const big = [...incoming].filter((f) => f.size > MAX);
    files = files.concat([...incoming].filter((f) => f.size <= MAX));
    msg.textContent = big.length ? `${big.map((f) => f.name).join(', ')} supera 10 MB. Comprime el archivo o elige otro.` : '';
    render();
  }
  function render() {
    if (!files.length) {
      list.innerHTML = '<li class="empty">Aún no hay archivos. Añade el primero arriba.</li>';
      return;
    }
    list.replaceChildren(...files.map((f, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="name"></span><span class="size"></span><button type="button">Quitar</button>';
      li.children[0].textContent = f.name;
      li.children[1].textContent = fmt(f.size);
      li.children[2].setAttribute('aria-label', 'Quitar ' + f.name);
      li.children[2].onclick = () => { files.splice(i, 1); render(); input.focus(); };
      return li;
    }));
  }
  input.addEventListener('change', () => { add(input.files); input.value = ''; });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); });
  render();
</script>
</body>
</html>
