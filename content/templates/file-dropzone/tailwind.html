<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <section aria-labelledby="t" class="mx-auto max-w-xl rounded-lg border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 id="t" class="mb-3 text-base font-semibold">Adjunta tus facturas</h2>
    <label id="drop" class="relative grid cursor-pointer justify-items-center gap-1.5 rounded-lg border border-dashed border-slate-300 px-4 py-7 text-center transition-colors hover:border-blue-600 hover:bg-blue-50 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-blue-500 motion-reduce:transition-none dark:border-slate-600 dark:hover:bg-slate-800">
      <input type="file" id="f" multiple accept=".pdf,.png,.jpg,.jpeg" aria-describedby="hint" class="absolute size-px opacity-0">
      <span aria-hidden="true" class="grid size-10 place-items-center rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
      </span>
      <span><strong>Arrastra archivos aquí</strong> o <span class="font-semibold text-blue-600 dark:text-blue-400">elígelos desde tu equipo</span></span>
      <small id="hint" class="text-slate-500 dark:text-slate-400">PDF, PNG o JPG. Máximo 10 MB por archivo.</small>
    </label>
    <p id="msg" role="alert" class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-red-700 empty:hidden dark:bg-red-950 dark:text-red-300"></p>
    <ul id="list" aria-label="Archivos seleccionados" aria-live="polite" class="mt-3"></ul>
  </section>
</div>
<script>
  const MAX = 10 * 1024 * 1024;
  const input = document.getElementById('f'), drop = document.getElementById('drop');
  const list = document.getElementById('list'), msg = document.getElementById('msg');
  const ROW = 'flex items-center gap-3 border-t border-slate-200 py-2.5 dark:border-slate-700';
  const over = ['border-blue-600', 'bg-blue-50', 'dark:bg-slate-800'];
  let files = [];
  const fmt = (b) => b < 1048576 ? Math.ceil(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

  function add(incoming) {
    const big = [...incoming].filter((f) => f.size > MAX);
    files = files.concat([...incoming].filter((f) => f.size <= MAX));
    msg.textContent = big.length ? `${big.map((f) => f.name).join(', ')} supera 10 MB. Comprime el archivo o elige otro.` : '';
    render();
  }
  function render() {
    if (!files.length) {
      list.innerHTML = `<li class="${ROW} justify-center text-slate-500 dark:text-slate-400">Aún no hay archivos. Añade el primero arriba.</li>`;
      return;
    }
    list.replaceChildren(...files.map((f, i) => {
      const li = document.createElement('li');
      li.className = ROW;
      li.innerHTML = '<span class="min-w-0 flex-1 truncate"></span><span class="tabular-nums text-slate-500 dark:text-slate-400"></span>'
        + '<button type="button" class="rounded-lg border border-slate-200 px-2.5 py-1 text-slate-500 hover:border-red-600 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700">Quitar</button>';
      li.children[0].textContent = f.name;
      li.children[1].textContent = fmt(f.size);
      li.children[2].setAttribute('aria-label', 'Quitar ' + f.name);
      li.children[2].onclick = () => { files.splice(i, 1); render(); input.focus(); };
      return li;
    }));
  }
  input.addEventListener('change', () => { add(input.files); input.value = ''; });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add(...over); });
  drop.addEventListener('dragleave', () => drop.classList.remove(...over));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove(...over); add(e.dataTransfer.files); });
  render();
</script>
