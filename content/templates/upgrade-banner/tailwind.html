<div class="bg-page p-5 text-sm text-fg">
  <aside id="banner" aria-labelledby="ttl" class="relative mx-auto max-w-4xl overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-4 py-4 pl-5 pr-14">
      <div class="min-w-0 flex-[1_1_260px]">
        <strong id="ttl" class="block text-[15px] font-semibold">Tu prueba de Pro termina el <time id="end"></time></strong>
        <p id="sub" class="mt-0.5 text-muted">Mejora tu plan para conservar informes ilimitados y hasta 10 personas en tu equipo.</p>
      </div>
      <div role="timer" aria-label="Tiempo restante de la prueba" class="flex gap-2 [&>div]:min-w-[52px] [&>div]:rounded-lg [&>div]:border [&>div]:border-line [&>div]:bg-page [&>div]:px-2 [&>div]:py-1.5 [&>div]:text-center [&_b]:block [&_b]:text-lg [&_b]:font-semibold [&_b]:leading-tight [&_b]:tabular-nums [&_span]:text-xs [&_span]:text-muted">
        <div><b id="d">0</b><span>días</span></div><div><b id="h">00</b><span>horas</span></div><div><b id="m">00</b><span>min</span></div><div><b id="s">00</b><span>seg</span></div>
      </div>
      <div class="flex flex-wrap gap-2 [&>button]:h-9 [&>button]:rounded-lg [&>button]:border [&>button]:border-line [&>button]:px-4 [&>button]:font-medium hover:[&>button]:bg-accent-soft [&>button:focus-visible]:outline-2 [&>button:focus-visible]:outline-offset-2 [&>button:focus-visible]:outline-accent">
        <button type="button" class="!border-accent !bg-accent text-accent-ink hover:!brightness-90">Mejorar plan</button>
        <button type="button">Comparar planes</button>
      </div>
    </div>
    <button type="button" id="close" aria-label="Cerrar banner" class="absolute right-3 top-3 grid size-8 place-items-center rounded-lg text-muted hover:bg-accent-soft hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
    <progress id="bar" max="14" value="8" aria-label="Días de prueba usados"
      class="block h-1 w-full appearance-none border-0 [&::-webkit-progress-bar]:bg-accent-soft [&::-webkit-progress-value]:bg-gradient-to-br [&::-webkit-progress-value]:from-accent-2 [&::-webkit-progress-value]:to-accent [&::-moz-progress-bar]:bg-accent"></progress>
  </aside>
  <button type="button" id="again" hidden class="mx-auto block h-9 rounded-lg border border-line bg-surface px-4 font-medium hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Mostrar banner</button>
</div>
<script>
  const $ = (id) => document.getElementById(id), TOTAL = 14, end = Date.now() + (5 * 86400 + 19 * 3600 + 23 * 60 + 40) * 1000;
  const pad = (n) => String(n).padStart(2, '0');
  $('end').textContent = new Date(end).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
  $('end').dateTime = new Date(end).toISOString();
  function tick() {
    const s = Math.max(0, Math.floor((end - Date.now()) / 1000));
    $('d').textContent = Math.floor(s / 86400); $('h').textContent = pad(Math.floor(s % 86400 / 3600));
    $('m').textContent = pad(Math.floor(s % 3600 / 60)); $('s').textContent = pad(s % 60);
    $('bar').value = TOTAL - Math.ceil(s / 86400);
    if (!s) { clearInterval(t); $('ttl').textContent = 'Tu prueba de Pro ha terminado'; $('sub').textContent = 'Mejora tu plan para recuperar el acceso a tus informes.'; }
  }
  const t = setInterval(tick, 1000); tick();
  $('close').onclick = () => { $('banner').hidden = true; $('again').hidden = false; $('again').focus(); };
  $('again').onclick = () => { $('banner').hidden = false; $('again').hidden = true; $('close').focus(); };
</script>
