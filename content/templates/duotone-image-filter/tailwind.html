<style>
  .frame::before,.frame::after{content:"";position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .duo .frame img{filter:grayscale(1)}
  .duo .frame::before{background:var(--accent);mix-blend-mode:multiply;opacity:var(--k)}
  .duo .frame::after{background:var(--bg);mix-blend-mode:soft-light;opacity:var(--k)}
  @media (prefers-reduced-motion:reduce){.frame::before,.frame::after{transition:none}}
</style>
<div class="bg-page text-fg">
  <main class="mx-auto max-w-[760px]" aria-labelledby="duo-title">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <h1 id="duo-title" class="text-2xl font-bold tracking-[-0.02em]">Galería en duotono</h1>
      <label class="flex items-center gap-2.5 text-[13px] font-semibold text-muted">Intensidad <input id="intensity" type="range" min="0" max="100" value="100" class="w-40 accent-accent"></label>
    </header>
    <ul id="grid" class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-4 p-0" style="--k:1">
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23f4d58d%22%2F%3E%3Ccircle%20cx%3D%22240%22%20cy%3D%2262%22%20r%3D%2226%22%20fill%3D%22%23e76f51%22%2F%3E%3Cpath%20d%3D%22M0%20150l70-70%2055%2050%2045-40%2060%2060%2090-70v120H0z%22%20fill%3D%22%232a9d8f%22%2F%3E%3Cpath%20d%3D%22M0%20200v-30l110-30%2080%2020%20130-25v65z%22%20fill%3D%22%23264653%22%2F%3E%3C%2Fsvg%3E" alt="Colinas y montañas al atardecer" width="320" height="200" loading="lazy" class="block aspect-[16/10] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Colinas al atardecer</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Colinas al atardecer">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%238ecae6%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2250%22%20r%3D%2218%22%20fill%3D%22%23fefae0%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%2290%22%20width%3D%2250%22%20height%3D%22110%22%20fill%3D%22%23023047%22%2F%3E%3Crect%20x%3D%2280%22%20y%3D%2260%22%20width%3D%2260%22%20height%3D%22140%22%20fill%3D%22%23219ebc%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22100%22%20width%3D%2245%22%20height%3D%22100%22%20fill%3D%22%23126782%22%2F%3E%3Crect%20x%3D%22205%22%20y%3D%2245%22%20width%3D%2270%22%20height%3D%22155%22%20fill%3D%22%23023047%22%2F%3E%3Crect%20x%3D%22225%22%20y%3D%2270%22%20width%3D%228%22%20height%3D%2210%22%20fill%3D%22%23ffb703%22%2F%3E%3Crect%20x%3D%22242%22%20y%3D%2270%22%20width%3D%228%22%20height%3D%2210%22%20fill%3D%22%23ffb703%22%2F%3E%3Crect%20x%3D%22225%22%20y%3D%22100%22%20width%3D%228%22%20height%3D%2210%22%20fill%3D%22%23ffb703%22%2F%3E%3C%2Fsvg%3E" alt="Edificios con ventanas iluminadas" width="320" height="200" loading="lazy" class="block aspect-[16/10] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Ciudad iluminada</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Ciudad iluminada">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23e9e3ff%22%2F%3E%3Ccircle%20cx%3D%22110%22%20cy%3D%22100%22%20r%3D%2270%22%20fill%3D%22%237b61ff%22%2F%3E%3Ccircle%20cx%3D%22200%22%20cy%3D%2290%22%20r%3D%2260%22%20fill%3D%22%23ff8fab%22%20opacity%3D%22.85%22%2F%3E%3Ccircle%20cx%3D%22160%22%20cy%3D%22150%22%20r%3D%2240%22%20fill%3D%22%233ddbd9%22%20opacity%3D%22.8%22%2F%3E%3C%2Fsvg%3E" alt="Círculos de colores superpuestos" width="320" height="200" loading="lazy" class="block aspect-[16/10] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Formas de color</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Formas de color">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </main>
</div>
<script>
  const range = document.getElementById('intensity'), grid = document.getElementById('grid');
  range.addEventListener('input', () => grid.style.setProperty('--k', range.value / 100));
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    const card = btn.closest('.card');
    card.classList.toggle('duo', btn.dataset.mode === 'duo');
    card.querySelectorAll('button[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  });
</script>
