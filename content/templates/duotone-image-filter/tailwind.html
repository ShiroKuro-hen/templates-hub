<style>
  .frame::before,.frame::after{content:"";position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .duo .frame img{filter:grayscale(1)}
  .duo .frame::before{background:var(--accent);mix-blend-mode:multiply;opacity:var(--k)}
  .duo .frame::after{background:var(--bg);mix-blend-mode:soft-light;opacity:var(--k)}
  @media (prefers-reduced-motion:reduce){.frame::before,.frame::after{transition:none}}
</style>
<div class="bg-page text-fg">
  <main class="mx-auto max-w-[760px]" aria-labelledby="duo-title">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <h1 id="duo-title" class="text-2xl font-bold tracking-[-0.02em]">Galería en duotono</h1>
      <label class="flex items-center gap-2.5 text-[13px] font-semibold text-muted">Intensidad <input id="intensity" type="range" min="0" max="100" value="100" class="w-40 accent-accent"></label>
    </header>
    <ul id="grid" class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-4 p-0" style="--k:1">
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="/stock/costa-azul.webp" alt="Costa azul con pinos junto al mar" width="800" height="533" loading="lazy" class="block aspect-[3/2] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Costa de pinos</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Costa de pinos">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="/stock/calle-ciudad.webp" alt="Calle de ciudad entre edificios altos" width="800" height="533" loading="lazy" class="block aspect-[3/2] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Calle de ciudad</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Calle de ciudad">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card duo m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
          <div class="frame relative isolate"><img src="/stock/escritorio-madera.webp" alt="Escritorio de madera con portátil" width="800" height="533" loading="lazy" class="block aspect-[3/2] h-auto w-full object-cover"></div>
          <figcaption class="flex flex-wrap items-center justify-between gap-2 px-3 py-2.5">
            <span class="font-semibold">Escritorio de madera</span>
            <span class="inline-flex gap-1" role="group" aria-label="Modo de color: Escritorio de madera">
              <button type="button" data-mode="orig" aria-pressed="false" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Original</button>
              <button type="button" data-mode="duo" aria-pressed="true" class="cursor-pointer rounded-full border border-line bg-surface px-3 py-1 text-xs font-semibold text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-accent aria-pressed:bg-accent aria-pressed:text-accent-ink">Duotono</button>
            </span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </main>
</div>
<script>
  const range = document.getElementById('intensity'), grid = document.getElementById('grid');
  range.addEventListener('input', () => grid.style.setProperty('--k', range.value / 100));
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    const card = btn.closest('.card');
    card.classList.toggle('duo', btn.dataset.mode === 'duo');
    card.querySelectorAll('button[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  });
</script>
