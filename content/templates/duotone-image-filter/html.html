<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería en duotono con intensidad</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:760px;margin:0 auto}
  .head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  .ctrl{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
  .ctrl input{width:160px;accent-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin:0;padding:0;list-style:none;--k:1}
  .card{margin:0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .frame{position:relative;isolation:isolate}
  .frame img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
  .frame::before,.frame::after{content:"";position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .duo .frame img{filter:grayscale(1)}
  .duo .frame::before{background:var(--accent);mix-blend-mode:multiply;opacity:var(--k)}
  .duo .frame::after{background:var(--bg);mix-blend-mode:soft-light;opacity:var(--k)}
  .cap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
  .title{font-weight:600}
  .seg{display:inline-flex;gap:4px}
  .seg button{font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;padding:4px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer}
  .seg button:hover{border-color:var(--accent)}
  .seg button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){.frame::before,.frame::after{transition:none}}
</style>
</head>
<body>
<main class="wrap" aria-labelledby="duo-title">
  <header class="head">
    <h1 id="duo-title">Galería en duotono</h1>
    <label class="ctrl">Intensidad <input id="intensity" type="range" min="0" max="100" value="100"></label>
  </header>
  <ul class="grid" id="grid">
    <li>
      <figure class="card duo">
        <div class="frame"><img src="/stock/costa-azul.webp" alt="Costa azul con pinos junto al mar" width="800" height="533" loading="lazy"></div>
        <figcaption class="cap">
          <span class="title">Costa de pinos</span>
          <span class="seg" role="group" aria-label="Modo de color: Costa de pinos">
            <button type="button" data-mode="orig" aria-pressed="false">Original</button>
            <button type="button" data-mode="duo" aria-pressed="true">Duotono</button>
          </span>
        </figcaption>
      </figure>
    </li>
    <li>
      <figure class="card duo">
        <div class="frame"><img src="/stock/calle-ciudad.webp" alt="Calle de ciudad entre edificios altos" width="800" height="533" loading="lazy"></div>
        <figcaption class="cap">
          <span class="title">Calle de ciudad</span>
          <span class="seg" role="group" aria-label="Modo de color: Calle de ciudad">
            <button type="button" data-mode="orig" aria-pressed="false">Original</button>
            <button type="button" data-mode="duo" aria-pressed="true">Duotono</button>
          </span>
        </figcaption>
      </figure>
    </li>
    <li>
      <figure class="card duo">
        <div class="frame"><img src="/stock/escritorio-madera.webp" alt="Escritorio de madera con portátil" width="800" height="533" loading="lazy"></div>
        <figcaption class="cap">
          <span class="title">Escritorio de madera</span>
          <span class="seg" role="group" aria-label="Modo de color: Escritorio de madera">
            <button type="button" data-mode="orig" aria-pressed="false">Original</button>
            <button type="button" data-mode="duo" aria-pressed="true">Duotono</button>
          </span>
        </figcaption>
      </figure>
    </li>
  </ul>
</main>
<script>
  const range = document.getElementById('intensity'), grid = document.getElementById('grid');
  range.addEventListener('input', () => grid.style.setProperty('--k', range.value / 100));
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    const card = btn.closest('.card');
    card.classList.toggle('duo', btn.dataset.mode === 'duo');
    card.querySelectorAll('button[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  });
</script>
</body>
</html>
