<div class="p-5 text-slate-900 dark:text-slate-100">
  <h2 class="mb-2 text-sm font-semibold">Periodo</h2>
  <div role="group" aria-label="Periodo del informe" id="period"
       class="inline-flex gap-0.5 rounded-lg border border-slate-200 bg-white p-[3px] shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-slate-500 hover:bg-blue-50 aria-pressed:bg-blue-600 aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:aria-pressed:bg-blue-500">Día</button>
    <button type="button" aria-pressed="true" class="rounded-md px-4 py-1.5 text-sm font-medium text-slate-500 hover:bg-blue-50 aria-pressed:bg-blue-600 aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:aria-pressed:bg-blue-500">Semana</button>
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-slate-500 hover:bg-blue-50 aria-pressed:bg-blue-600 aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:aria-pressed:bg-blue-500">Mes</button>
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-slate-500 hover:bg-blue-50 aria-pressed:bg-blue-600 aria-pressed:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:aria-pressed:bg-blue-500">Año</button>
  </div>
  <p id="out" aria-live="polite" class="mt-3 text-[13px] text-slate-500 dark:text-slate-400">Mostrando: Semana</p>
</div>

<script>
  const g = document.getElementById('period');
  g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.getElementById('out').textContent = 'Mostrando: ' + b.textContent;
  });
</script>
