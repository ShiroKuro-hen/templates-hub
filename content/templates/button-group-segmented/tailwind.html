<div class="p-5 text-fg">
  <h2 class="mb-2 text-sm font-semibold">Periodo</h2>
  <div role="group" aria-label="Periodo del informe" id="period"
       class="inline-flex gap-0.5 rounded-lg border border-line bg-surface p-[3px] shadow-sm">
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-muted hover:bg-accent-soft aria-pressed:bg-accent aria-pressed:text-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Día</button>
    <button type="button" aria-pressed="true" class="rounded-md px-4 py-1.5 text-sm font-medium text-muted hover:bg-accent-soft aria-pressed:bg-accent aria-pressed:text-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Semana</button>
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-muted hover:bg-accent-soft aria-pressed:bg-accent aria-pressed:text-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Mes</button>
    <button type="button" aria-pressed="false" class="rounded-md px-4 py-1.5 text-sm font-medium text-muted hover:bg-accent-soft aria-pressed:bg-accent aria-pressed:text-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Año</button>
  </div>
  <p id="out" aria-live="polite" class="mt-3 text-[13px] text-muted">Mostrando: Semana</p>
</div>

<script>
  const g = document.getElementById('period');
  g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.getElementById('out').textContent = 'Mostrando: ' + b.textContent;
  });
</script>
