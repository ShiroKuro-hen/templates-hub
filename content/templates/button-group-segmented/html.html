<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  section { margin-bottom: 20px; }
  .out { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  .sample { margin: 12px 0 0; font-size: 16px; }

  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  .seg button { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 6px 16px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; transition: background .14s, color .14s; }
  .seg button:hover { background: var(--accent-soft); color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }
</style>
</head>
<body>
  <section>
    <h2>Periodo</h2>
    <div class="seg" role="group" aria-label="Periodo del informe" id="period">
      <button type="button" aria-pressed="false">Día</button>
      <button type="button" aria-pressed="true">Semana</button>
      <button type="button" aria-pressed="false">Mes</button>
      <button type="button" aria-pressed="false">Año</button>
    </div>
    <p class="out" aria-live="polite" id="period-out">Mostrando: Semana</p>
  </section>

  <section>
    <h2>Formato</h2>
    <div class="seg" role="group" aria-label="Formato de texto" id="fmt">
      <button type="button" aria-pressed="true" aria-label="Negrita" data-s="font-weight:800"><b>N</b></button>
      <button type="button" aria-pressed="false" aria-label="Cursiva" data-s="font-style:italic"><i>C</i></button>
      <button type="button" aria-pressed="false" aria-label="Subrayado" data-s="text-decoration:underline"><u>S</u></button>
    </div>
    <p class="sample" id="sample">Texto de ejemplo</p>
  </section>

<script>
  const period = document.getElementById('period');
  period.addEventListener('click', (e) => {            // selección única
    const b = e.target.closest('button'); if (!b) return;
    period.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.getElementById('period-out').textContent = 'Mostrando: ' + b.textContent;
  });

  const fmt = document.getElementById('fmt'), sample = document.getElementById('sample');
  const paint = () => { sample.style.cssText = [...fmt.querySelectorAll('[aria-pressed=true]')].map((x) => x.dataset.s).join(';'); };
  fmt.addEventListener('click', (e) => {               // selección múltiple
    const b = e.target.closest('button'); if (!b) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    paint();
  });
  paint();
</script>
</body>
</html>
