<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 20px; font: 14px system-ui, sans-serif; background: #f6f1e7; color: #17130f; }
  fieldset { margin: 0; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 10px; font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; padding: 4px 12px; border: 2px solid #17130f; border-radius: 999px; background: #fffdf8;
    font-weight: 600; cursor: pointer; user-select: none; }
  .chip span:hover { background: #fff1bf; }
  .chip input:checked + span { background: #ffd84d; box-shadow: 2px 2px 0 #17130f; }
  .chip input:checked + span::before { content: "✓ "; }
  .chip input:focus-visible + span { outline: 3px solid #ff5a36; outline-offset: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; font: 12px ui-monospace, monospace; color: #6b6258; }
  .bar button { font: inherit; color: #17130f; background: none; border: 0; text-decoration: underline 2px #ff5a36; text-underline-offset: 3px; cursor: pointer; border-radius: 4px; }
  .bar button:focus-visible { outline: 3px solid #ff5a36; outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px 12px; }
  li { padding: 6px 10px; border: 2px solid #17130f; border-radius: 10px; background: #fffdf8; font-weight: 600; }
  li[hidden] { display: none; }
  .empty { margin: 0; color: #6b6258; }
</style>
</head>
<body>
  <fieldset>
    <legend>Recetas</legend>
    <div class="chips" id="chips">
      <label class="chip"><input type="checkbox" value="vegano"><span>Vegano</span></label>
      <label class="chip"><input type="checkbox" value="sin-gluten"><span>Sin gluten</span></label>
      <label class="chip"><input type="checkbox" value="rapido"><span>Rápido</span></label>
      <label class="chip"><input type="checkbox" value="postre"><span>Postre</span></label>
      <label class="chip"><input type="checkbox" value="picante"><span>Picante</span></label>
    </div>
  </fieldset>
  <div class="bar"><span id="count" aria-live="polite"></span><button type="button" id="clear">Limpiar filtros</button></div>
  <ul id="list">
    <li data-tags="vegano sin-gluten rapido">Ceviche de champiñones</li>
    <li data-tags="vegano postre sin-gluten">Brownie de frijol negro</li>
    <li data-tags="picante rapido">Tacos al pastor</li>
    <li data-tags="postre">Tiramisú</li>
    <li data-tags="vegano rapido">Arroz chaufa vegano</li>
    <li data-tags="picante sin-gluten">Ají de gallina</li>
  </ul>
  <p class="empty" id="empty" hidden>Ninguna receta cumple todos los filtros. Quita alguno.</p>

<script>
  const boxes = [...document.querySelectorAll('#chips input')];
  const rows = [...document.querySelectorAll('#list li')];
  const $ = (id) => document.getElementById(id);

  function apply() {
    const on = boxes.filter((b) => b.checked).map((b) => b.value);
    let n = 0;
    rows.forEach((li) => {
      const ok = on.every((t) => li.dataset.tags.split(' ').includes(t)); // coincide con todos
      li.hidden = !ok;
      n += ok;
    });
    $('count').textContent = n + ' de ' + rows.length + ' recetas';
    $('empty').hidden = n > 0;
  }
  boxes.forEach((b) => b.addEventListener('change', apply));
  $('clear').addEventListener('click', () => { boxes.forEach((b) => (b.checked = false)); apply(); });
  apply();
</script>
</body>
</html>
