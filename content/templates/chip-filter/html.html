<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  fieldset { margin: 0; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 10px; font-size: 18px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-block; padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-weight: 500; cursor: pointer; user-select: none; transition: background-color .14s, border-color .14s; }
  .chip span:hover { background: var(--accent-soft); }
  .chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip input:checked + span::before { content: "✓ "; }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bar { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar button { font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: 4px; }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 12px; }
  li { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); font-weight: 500; }
  li[hidden] { display: none; }
  .empty { margin: 0; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .chip span { transition: none; } }
</style>
</head>
<body>
  <fieldset>
    <legend>Recetas</legend>
    <div class="chips" id="chips">
      <label class="chip"><input type="checkbox" value="vegano"><span>Vegano</span></label>
      <label class="chip"><input type="checkbox" value="sin-gluten"><span>Sin gluten</span></label>
      <label class="chip"><input type="checkbox" value="rapido"><span>Rápido</span></label>
      <label class="chip"><input type="checkbox" value="postre"><span>Postre</span></label>
      <label class="chip"><input type="checkbox" value="picante"><span>Picante</span></label>
    </div>
  </fieldset>
  <div class="bar"><span id="count" aria-live="polite"></span><button type="button" id="clear">Limpiar filtros</button></div>
  <ul id="list">
    <li data-tags="vegano sin-gluten rapido">Ceviche de champiñones</li>
    <li data-tags="vegano postre sin-gluten">Brownie de frijol negro</li>
    <li data-tags="picante rapido">Tacos al pastor</li>
    <li data-tags="postre">Tiramisú</li>
    <li data-tags="vegano rapido">Arroz chaufa vegano</li>
    <li data-tags="picante sin-gluten">Ají de gallina</li>
  </ul>
  <p class="empty" id="empty" hidden>Ninguna receta cumple todos los filtros. Quita alguno.</p>

<script>
  const boxes = [...document.querySelectorAll('#chips input')];
  const rows = [...document.querySelectorAll('#list li')];
  const $ = (id) => document.getElementById(id);

  function apply() {
    const on = boxes.filter((b) => b.checked).map((b) => b.value);
    let n = 0;
    rows.forEach((li) => {
      const ok = on.every((t) => li.dataset.tags.split(' ').includes(t)); // coincide con todos
      li.hidden = !ok;
      n += ok;
    });
    $('count').textContent = n + ' de ' + rows.length + ' recetas';
    $('empty').hidden = n > 0;
  }
  boxes.forEach((b) => b.addEventListener('change', apply));
  $('clear').addEventListener('click', () => { boxes.forEach((b) => (b.checked = false)); apply(); });
  apply();
</script>
</body>
</html>
