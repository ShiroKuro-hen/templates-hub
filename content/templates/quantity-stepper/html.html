<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .item{position:relative;max-width:480px;margin:0 auto;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .item::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .info{flex:1;min-width:160px}
  .info h3{margin:0;font-size:15px}
  .info p{margin:2px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
  .stepper{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius)}
  .stepper button{width:36px;height:36px;font:500 18px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:none;border:0;cursor:pointer;transition:background .14s}
  .stepper button:first-child{border-radius:var(--radius) 0 0 var(--radius)}
  .stepper button:last-child{border-radius:0 var(--radius) var(--radius) 0}
  .stepper button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
  .stepper button:disabled{color:var(--border);cursor:not-allowed}
  .stepper input{width:48px;padding:0;text-align:center;font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;color:var(--text);background:none;border:0;border-inline:1px solid var(--border);-moz-appearance:textfield;appearance:textfield}
  .stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .stepper :focus-visible{outline:2px solid var(--accent);outline-offset:2px;position:relative}
  .total{min-width:88px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  #note{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
  #note.warn{color:var(--warn)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<article class="item">
  <div class="info">
    <h3 id="name">Auriculares inalámbricos</h3>
    <p>$89.00 por unidad</p>
  </div>
  <div class="stepper" role="group" aria-labelledby="name">
    <button type="button" id="dec" aria-label="Quitar una unidad" aria-controls="qty">−</button>
    <input type="number" id="qty" value="1" min="1" max="10" inputmode="numeric" aria-label="Cantidad" aria-describedby="note">
    <button type="button" id="inc" aria-label="Añadir una unidad" aria-controls="qty">+</button>
  </div>
  <output class="total" id="total" for="qty" aria-live="polite">$89.00</output>
  <p id="note">Máximo 10 unidades por pedido.</p>
</article>
<script>
  const PRICE = 89, qty = document.getElementById('qty'), dec = document.getElementById('dec'), inc = document.getElementById('inc');
  const note = document.getElementById('note'), total = document.getElementById('total');
  const min = +qty.min, max = +qty.max;

  function set(n, fromTyping) {
    const v = Math.min(max, Math.max(min, Math.round(n) || min));
    if (!fromTyping) qty.value = v;
    dec.disabled = v <= min;
    inc.disabled = v >= max;
    if (document.activeElement.disabled) qty.focus(); // no perder el foco al llegar al límite
    total.value = '$' + (v * PRICE).toFixed(2);
    const clamped = !fromTyping && n !== v;
    note.textContent = clamped ? `Ajustamos la cantidad a ${v}. Puedes pedir entre ${min} y ${max} unidades.` : `Máximo ${max} unidades por pedido.`;
    note.classList.toggle('warn', clamped);
  }
  dec.addEventListener('click', () => set(+qty.value - 1));
  inc.addEventListener('click', () => set(+qty.value + 1));
  qty.addEventListener('input', () => set(+qty.value, true));
  qty.addEventListener('change', () => set(qty.value === '' ? NaN : +qty.value));
  set(+qty.value);
</script>
</body>
</html>
