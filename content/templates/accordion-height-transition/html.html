<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acordeón con altura animada</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:640px; margin:0 auto; }
  .head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  h1 { margin:0; font-size:1.25rem; letter-spacing:-.01em; }
  .toggle { display:inline-flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; }
  .acc { --dur:260ms; --ease:cubic-bezier(.2,.7,.2,1); display:grid; gap:8px; }
  .item { margin:0; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .item h2 { margin:0; font-size:inherit; }
  .trigger { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; font:inherit; font-weight:600; color:var(--text); background:none; border:0; text-align:left; cursor:pointer; }
  .trigger:focus-visible { outline-offset:-2px; }
  .chev { flex:none; width:18px; height:18px; color:var(--muted); transition:transform var(--dur) var(--ease), color var(--dur) var(--ease); }
  .trigger[aria-expanded=true] .chev { transform:rotate(180deg); color:var(--accent); }
  .panel { display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur) var(--ease); }
  .panel.open { grid-template-rows:1fr; }
  .panel > div { min-height:0; overflow:hidden; visibility:hidden; transition:visibility var(--dur); }
  .panel.open > div { visibility:visible; }
  .panel p { margin:0; padding:0 16px 14px; color:var(--muted); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion:reduce) { .panel, .panel > div, .chev { transition:none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>Preguntas frecuentes</h1>
    <label class="toggle"><input type="checkbox" id="single" checked> Abrir uno a la vez</label>
  </div>
  <div class="acc" id="acc">
    <section class="item">
      <h2><button type="button" class="trigger" aria-expanded="true" aria-controls="p1">¿Cuánto tarda la migración?<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button></h2>
      <div class="panel open" id="p1"><div><p>Entre 2 y 5 días hábiles según el volumen de datos. Te avisamos antes de cada corte.</p></div></div>
    </section>
    <section class="item">
      <h2><button type="button" class="trigger" aria-expanded="false" aria-controls="p2">¿Mis datos se conservan?<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button></h2>
      <div class="panel" id="p2"><div><p>Sí. Hacemos una copia completa antes de empezar y puedes restaurarla durante 30 días.</p></div></div>
    </section>
    <section class="item">
      <h2><button type="button" class="trigger" aria-expanded="false" aria-controls="p3">¿Necesito detener mi equipo?<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button></h2>
      <div class="panel" id="p3"><div><p>No. Trabajamos en horario de bajo tráfico y el servicio se mantiene disponible.</p></div></div>
    </section>
  </div>
</main>
<script>
  const acc = document.getElementById('acc'), single = document.getElementById('single');
  const setOpen = (btn, open) => {
    btn.setAttribute('aria-expanded', String(open));
    document.getElementById(btn.getAttribute('aria-controls')).classList.toggle('open', open);
  };
  acc.addEventListener('click', (e) => {
    const btn = e.target.closest('.trigger');
    if (!btn) return;
    const open = btn.getAttribute('aria-expanded') !== 'true';
    if (open && single.checked) {
      acc.querySelectorAll('.trigger').forEach((other) => { if (other !== btn) setOpen(other, false); });
    }
    setOpen(btn, open);
  });
</script>
</body>
</html>
