<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasos de un proceso</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin:0 0 18px; font-size:1.25rem; letter-spacing:-.01em; }
  .steps { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; margin:0 0 20px; padding:0; list-style:none; }
  .step { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-size:13px; font-weight:500; color:var(--muted); }
  .step::before { content:""; position:absolute; top:17px; right:50%; width:100%; height:2px; background:linear-gradient(90deg,#22d3ee,#2f5bff); }
  .step:first-child::before { display:none; }
  .dot { position:relative; z-index:1; display:grid; place-items:center; width:36px; height:36px; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--surface); color:var(--muted); border:1px solid var(--border); border-radius:50%; }
  .step[data-state="done"], .step[data-state="current"] { color:var(--text); }
  .step[data-state="done"] .dot { background:var(--ok); border-color:var(--ok); color:var(--accent-ink); }
  .step[data-state="done"] .dot::after { content:"✓"; }
  .step[data-state="done"] .dot span { display:none; }
  .step[data-state="current"] .dot { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 0 0 4px var(--accent-soft); }
  .step[data-state="pending"]::before { background:repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 12px); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .nav { display:flex; gap:10px; }
  .btn { font:600 14px system-ui; padding:8px 16px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:background 140ms, border-color 140ms; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn:hover:not(:disabled) { background:var(--accent-soft); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled) { background:var(--accent); filter:brightness(1.1); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { .btn { transition:none; } }
</style>
</head>
<body>
  <h1>Finalizar compra</h1>
  <nav aria-label="Progreso de la compra">
    <ol class="steps" id="steps">
      <li class="step"><span class="dot"><span>1</span></span>Carrito</li>
      <li class="step"><span class="dot"><span>2</span></span>Envío</li>
      <li class="step"><span class="dot"><span>3</span></span>Pago</li>
      <li class="step"><span class="dot"><span>4</span></span>Listo</li>
    </ol>
  </nav>
  <div class="nav">
    <button type="button" class="btn" id="prev">Atrás</button>
    <button type="button" class="btn primary" id="next">Continuar</button>
  </div>
<script>
  const items = [...document.querySelectorAll('.step')];
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  const label = { done: 'completado', current: 'paso actual', pending: 'pendiente' };
  let cur = 1;
  function render() {
    items.forEach((li, i) => {
      const st = i < cur ? 'done' : i === cur ? 'current' : 'pending';
      li.dataset.state = st;
      if (st === 'current') li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
      li.querySelector('.sr')?.remove();
      li.insertAdjacentHTML('beforeend', `<span class="sr">(${label[st]})</span>`);
    });
    prev.disabled = cur === 0;
    next.disabled = cur === items.length - 1;
  }
  prev.onclick = () => { cur--; render(); };
  next.onclick = () => { cur++; render(); };
  render();
</script>
</body>
</html>
