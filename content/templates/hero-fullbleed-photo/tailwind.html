<section class="relative isolate flex min-h-[480px] items-end overflow-hidden rounded-lg text-[rgba(255,255,255,0.97)] min-[720px]:min-h-[540px]" aria-labelledby="h">
  <img class="absolute inset-0 -z-2 h-full w-full object-cover" src="/stock/isla-blanca.webp" alt="Pueblo blanco griego junto al mar" width="800" height="533" fetchpriority="high">
  <div class="absolute inset-0 -z-1 bg-[linear-gradient(180deg,rgba(6,11,22,0.45),rgba(6,11,22,0.72)_45%,rgba(6,11,22,0.92))]" aria-hidden="true"></div>
  <div class="w-full px-4 pt-10 pb-5 min-[720px]:px-10 min-[720px]:pt-14 min-[720px]:pb-10">
    <p class="mb-4 inline-block rounded-full border border-[rgba(255,255,255,0.5)] px-3 py-1 text-[13px] font-medium">Escapadas de temporada</p>
    <h1 id="h" class="mb-3 max-w-[18ch] text-balance text-[clamp(2rem,5.5vw,3.5rem)] leading-[1.05] font-bold tracking-[-0.03em]">Tu próxima escapada, a un clic</h1>
    <p class="mb-5.5 max-w-[50ch] text-[1.05rem] text-[rgba(255,255,255,0.9)]">Compara hoteles, vuelos y casas rurales en un solo lugar y reserva con el precio final visible.</p>
    <form id="search" novalidate class="grid gap-2.5 rounded-lg border border-line bg-surface p-3 text-fg shadow-sm min-[720px]:grid-cols-[2fr_1fr_1fr_auto] min-[720px]:items-end">
      <div class="grid min-w-0 gap-1">
        <label for="dest" class="text-xs leading-normal font-semibold text-muted">Destino</label>
        <input id="dest" name="destino" type="text" autocomplete="off" placeholder="¿A dónde vas?" aria-describedby="dest-err" class="w-full min-w-0 rounded-lg border border-line bg-page px-3 py-2.5 text-fg aria-invalid:border-err focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
        <span class="text-xs leading-normal text-err" id="dest-err" hidden>Escribe un destino para buscar.</span>
      </div>
      <div class="grid min-w-0 gap-1">
        <label for="when" class="text-xs leading-normal font-semibold text-muted">Fechas</label>
        <select id="when" name="fechas" class="w-full min-w-0 rounded-lg border border-line bg-page px-3 py-2.5 text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <option>Fin de semana</option>
          <option>Esta semana</option>
          <option>Este mes</option>
        </select>
      </div>
      <div class="grid min-w-0 gap-1">
        <label for="guests" class="text-xs leading-normal font-semibold text-muted">Viajeros</label>
        <select id="guests" name="viajeros" class="w-full min-w-0 rounded-lg border border-line bg-page px-3 py-2.5 text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <option>1 viajero</option>
          <option selected>2 viajeros</option>
          <option>3 viajeros</option>
          <option>4 viajeros</option>
          <option>5 viajeros</option>
          <option>6 viajeros</option>
        </select>
      </div>
      <button type="submit" class="cursor-pointer rounded-lg border border-accent bg-accent px-[22px] py-[11px] font-semibold text-accent-ink motion-safe:transition-[filter] hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Buscar</button>
    </form>
    <div class="mt-4 flex flex-wrap gap-2" id="chips" role="group" aria-label="Destinos sugeridos">
      <button type="button" data-dest="Islas griegas" class="cursor-pointer rounded-full border border-[rgba(255,255,255,0.5)] bg-[rgba(6,11,22,0.35)] px-3.5 py-1.5 text-[13px] font-semibold text-[rgba(255,255,255,0.97)] motion-safe:transition-[background] hover:bg-[rgba(255,255,255,0.2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[rgba(255,255,255,0.95)]">Islas griegas</button>
      <button type="button" data-dest="Alpes" class="cursor-pointer rounded-full border border-[rgba(255,255,255,0.5)] bg-[rgba(6,11,22,0.35)] px-3.5 py-1.5 text-[13px] font-semibold text-[rgba(255,255,255,0.97)] motion-safe:transition-[background] hover:bg-[rgba(255,255,255,0.2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[rgba(255,255,255,0.95)]">Alpes</button>
      <button type="button" data-dest="Costa" class="cursor-pointer rounded-full border border-[rgba(255,255,255,0.5)] bg-[rgba(6,11,22,0.35)] px-3.5 py-1.5 text-[13px] font-semibold text-[rgba(255,255,255,0.97)] motion-safe:transition-[background] hover:bg-[rgba(255,255,255,0.2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[rgba(255,255,255,0.95)]">Costa</button>
    </div>
    <p class="mt-3 min-h-[1.5em] font-medium" id="summary" aria-live="polite"></p>
  </div>
</section>
<script>
  const form = document.getElementById('search'), dest = form.elements.destino;
  const err = document.getElementById('dest-err'), summary = document.getElementById('summary');
  const showError = (on) => { err.hidden = !on; dest.setAttribute('aria-invalid', String(on)); };
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = dest.value.trim();
    showError(!q);
    if (!q) { dest.focus(); summary.textContent = ''; return; }
    const when = form.elements.fechas.selectedOptions[0].text;
    const guests = form.elements.viajeros.selectedOptions[0].text;
    summary.textContent = `Búsqueda: ${q} · ${when} · ${guests}.`;
  });
  dest.addEventListener('input', () => showError(false));
  document.getElementById('chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-dest]'); if (!b) return;
    dest.value = b.dataset.dest;
    showError(false);
  });
</script>
