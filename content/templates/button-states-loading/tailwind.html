<div class="flex flex-wrap items-center gap-5 bg-[#f6f1e7] p-5 text-[#17130f]">
  <!-- Normal (hover y active vienen de las variantes) -->
  <button type="button" class="inline-flex items-center gap-2 rounded-[10px] border-2 border-[#17130f] bg-[#ff5a36] px-4 py-2 font-semibold shadow-[4px_4px_0_#17130f] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0_#17130f] active:translate-x-0.5 active:translate-y-0.5 active:bg-[#ffd84d] active:shadow-[2px_2px_0_#17130f] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[#ff5a36] motion-reduce:transition-none">Guardar</button>

  <!-- Deshabilitado -->
  <button type="button" disabled class="rounded-[10px] border-2 border-[#6b6258] bg-[#ebe5d8] px-4 py-2 font-semibold text-[#6b6258] cursor-not-allowed">Guardar</button>

  <!-- Cargando: aria-busy + aria-disabled para conservar el foco -->
  <button type="button" aria-busy="true" aria-disabled="true" class="inline-flex cursor-progress items-center gap-2 rounded-[10px] border-2 border-[#17130f] bg-[#ff5a36] px-4 py-2 font-semibold shadow-[4px_4px_0_#17130f] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-[3px] focus-visible:outline-[#ff5a36]">
    <span aria-hidden="true" class="size-3.5 animate-spin rounded-full border-2 border-current border-r-transparent motion-reduce:animate-none"></span>
    Guardando…
  </button>
</div>
