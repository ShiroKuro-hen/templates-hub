<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 16px; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .lbl { font-size: 12px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 8px 16px;
    border: 1px solid transparent; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
    cursor: pointer; transition: filter .14s, box-shadow .14s; }
  .btn:hover, .btn.is-hover { filter: brightness(1.1); box-shadow: var(--shadow); }
  .btn:active, .btn.is-active { filter: brightness(.92); box-shadow: none; }
  .btn:focus-visible, .btn.is-focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { background: var(--accent-soft); color: var(--muted); border-color: var(--border); filter: none; box-shadow: none; cursor: not-allowed; }
  .btn[aria-busy="true"] { cursor: progress; filter: none; box-shadow: none; }
  .btn[aria-busy="true"]::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40%; height: 2px;
    background: linear-gradient(135deg, #22d3ee, #2f5bff); animation: slide 1.1s ease-in-out infinite; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .spin, .btn[aria-busy="true"]::after { animation: none; } }
</style>
</head>
<body>
  <h1>Estados del botón</h1>
  <div class="grid">
    <div class="cell"><button class="btn" id="go" type="button">Guardar</button><span class="lbl">Normal: púlsalo</span></div>
    <div class="cell"><button class="btn is-hover" type="button" tabindex="-1">Guardar</button><span class="lbl">Hover</span></div>
    <div class="cell"><button class="btn is-active" type="button" tabindex="-1">Guardar</button><span class="lbl">Active</span></div>
    <div class="cell"><button class="btn is-focus" type="button" tabindex="-1">Guardar</button><span class="lbl">Foco</span></div>
    <div class="cell"><button class="btn" type="button" disabled>Guardar</button><span class="lbl">Deshabilitado</span></div>
    <div class="cell"><button class="btn" type="button" aria-busy="true" aria-disabled="true"><span class="spin" aria-hidden="true"></span>Guardando…</button><span class="lbl">Cargando</span></div>
  </div>
  <p class="sr" role="status" id="msg"></p>
<script>
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.addEventListener('click', () => {
    if (go.getAttribute('aria-busy') === 'true') return; // aria-disabled: conserva el foco, ignora clics
    go.setAttribute('aria-busy', 'true');
    go.innerHTML = '<span class="spin" aria-hidden="true"></span>Guardando…';
    msg.textContent = 'Guardando cambios';
    setTimeout(() => {
      go.removeAttribute('aria-busy');
      go.textContent = 'Guardar';
      msg.textContent = 'Cambios guardados';
    }, 2000);
  });
</script>
</body>
</html>
