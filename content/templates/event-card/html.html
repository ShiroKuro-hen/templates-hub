<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .event{display:grid;grid-template-columns:auto 1fr;gap:16px;max-width:440px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .date{display:grid;place-content:center;width:64px;height:72px;text-align:center;border:1px solid transparent;border-radius:var(--radius);
        background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box}
  .date b{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
  .date span{margin-top:4px;color:var(--accent);font-weight:600}
  h3{margin:0 0 6px;font-size:16px;line-height:1.3}
  .info{display:grid;gap:4px;margin:0 0 14px;padding:0;list-style:none;color:var(--muted)}
  .info li{display:flex;align-items:center;gap:8px}
  .info svg{flex:none;width:16px;height:16px}
  .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  .seats{color:var(--muted);font-variant-numeric:tabular-nums}
  .btn{font:inherit;font-weight:600;padding:8px 14px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .14s,background .14s,color .14s}
  .btn:hover{filter:brightness(1.08)}
  .btn[aria-pressed=true]{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:360px){.event{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<article class="event" aria-labelledby="ev-title">
  <time class="date" datetime="2026-11-14T18:30"><b>14</b><span>nov</span></time>
  <div>
    <h3 id="ev-title">Meetup de arquitectura frontend</h3>
    <ul class="info">
      <li><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Sábado, 18:30 a 21:00</li>
      <li><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s-4.8-4.4-4.8-8a4.8 4.8 0 0 1 9.6 0c0 3.6-4.8 8-4.8 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="6.5" r="1.7" fill="currentColor"/></svg>Impact Hub, Madrid</li>
    </ul>
    <div class="foot">
      <span class="seats"><span id="seats">12</span> plazas libres</span>
      <button type="button" class="btn" id="reg" aria-pressed="false">Reservar plaza</button>
    </div>
    <p class="sr" role="status" id="live"></p>
  </div>
</article>
<script>
  const b = document.getElementById('reg'), seats = document.getElementById('seats');
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    seats.textContent = +seats.textContent + (on ? -1 : 1);
    document.getElementById('live').textContent = on ? 'Plaza reservada. Te enviamos la confirmación por correo.' : 'Reserva cancelada.';
  });
</script>
</body>
</html>
