<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <article aria-labelledby="ev-title" class="grid max-w-[440px] grid-cols-1 gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-sm min-[361px]:grid-cols-[auto_1fr] dark:border-slate-700 dark:bg-slate-900">
    <div class="h-[72px] w-16 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 p-px">
      <time datetime="2026-11-14T18:30" class="grid h-full place-content-center rounded-[7px] bg-blue-50 text-center dark:bg-slate-800">
        <b class="text-[26px] leading-none tabular-nums">14</b><span class="mt-1 font-semibold text-blue-700 dark:text-blue-300">nov</span>
      </time>
    </div>
    <div>
      <h3 id="ev-title" class="mb-1.5 text-base font-semibold leading-snug">Meetup de arquitectura frontend</h3>
      <ul class="mb-3.5 grid gap-1 text-slate-500 dark:text-slate-400 [&_li]:flex [&_li]:items-center [&_li]:gap-2 [&_svg]:size-4 [&_svg]:flex-none">
        <li><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Sábado, 18:30 a 21:00</li>
        <li><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5s-4.8-4.4-4.8-8a4.8 4.8 0 0 1 9.6 0c0 3.6-4.8 8-4.8 8z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="6.5" r="1.7" fill="currentColor"/></svg>Impact Hub, Madrid</li>
      </ul>
      <div class="flex flex-wrap items-center justify-between gap-2.5">
        <span class="tabular-nums text-slate-500 dark:text-slate-400"><span id="seats">12</span> plazas libres</span>
        <button type="button" id="reg" aria-pressed="false" class="rounded-lg border border-blue-600 bg-blue-600 px-3.5 py-2 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 aria-pressed:border-slate-200 aria-pressed:bg-white aria-pressed:text-slate-900 dark:aria-pressed:border-slate-700 dark:aria-pressed:bg-slate-900 dark:aria-pressed:text-slate-100">Reservar plaza</button>
      </div>
      <p id="live" role="status" class="sr-only"></p>
    </div>
  </article>
</div>
<script>
  const b = document.getElementById('reg'), seats = document.getElementById('seats');
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    seats.textContent = +seats.textContent + (on ? -1 : 1);
    document.getElementById('live').textContent = on ? 'Plaza reservada. Te enviamos la confirmación por correo.' : 'Reserva cancelada.';
  });
</script>
