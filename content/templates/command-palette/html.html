<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  [hidden]{display:none!important}
  kbd{font:12px ui-monospace,"Cascadia Code",Menlo,monospace;padding:1px 6px;color:var(--muted);border:1px solid var(--border);border-radius:4px;background:var(--bg)}
  .trigger{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;padding:8px 12px;font:inherit;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer}
  .trigger span{flex:1;text-align:left}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #out{color:var(--muted);font-variant-numeric:tabular-nums}
  dialog{width:min(560px,calc(100vw - 32px));margin:12vh auto auto;padding:0;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  dialog::backdrop{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(2px)}
  .search{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted)}
  .search input{flex:1;min-width:0;padding:14px 0;font:inherit;font-size:15px;color:var(--text);background:none;border:0;outline:0}
  .list{max-height:320px;overflow:auto;margin:0;padding:6px;list-style:none}
  .list ul{margin:0;padding:0;list-style:none}
  .group-label{padding:8px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
  [role=option]{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:6px;cursor:pointer}
  [role=option][aria-selected=true]{background:var(--accent-soft)}
  [role=option][aria-selected=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .empty{padding:24px 16px;text-align:center;color:var(--muted)}
  .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
</style>
</head>
<body>
<button type="button" class="trigger" id="open" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <span>Buscar comandos</span><kbd>Ctrl K</kbd>
</button>
<p id="out" role="status"></p>
<dialog id="cmd" aria-label="Paleta de comandos">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" role="combobox" aria-expanded="true" aria-controls="list" aria-autocomplete="list" placeholder="Escribe un comando o busca" autocomplete="off">
  </div>
  <ul class="list" id="list" role="listbox" aria-label="Comandos">
    <li role="presentation" class="group"><div class="group-label" id="g1">Navegación</div>
      <ul role="group" aria-labelledby="g1">
        <li role="option" id="o1" data-label="Ir al panel">Ir al panel <kbd>G P</kbd></li>
        <li role="option" id="o2" data-label="Ir a proyectos">Ir a proyectos <kbd>G R</kbd></li>
        <li role="option" id="o3" data-label="Ir a facturación">Ir a facturación</li>
      </ul></li>
    <li role="presentation" class="group"><div class="group-label" id="g2">Acciones</div>
      <ul role="group" aria-labelledby="g2">
        <li role="option" id="o4" data-label="Crear proyecto">Crear proyecto <kbd>C</kbd></li>
        <li role="option" id="o5" data-label="Invitar a un miembro">Invitar a un miembro</li>
        <li role="option" id="o6" data-label="Cambiar tema">Cambiar tema</li>
      </ul></li>
  </ul>
  <p class="empty" id="empty" hidden>Sin resultados para «<b></b>». Prueba con otra palabra.</p>
  <div class="foot" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> moverse</span><span><kbd>Enter</kbd> ejecutar</span><span><kbd>Esc</kbd> cerrar</span></div>
</dialog>
<script>
  const dlg = document.getElementById('cmd'), q = document.getElementById('q'), empty = document.getElementById('empty');
  const opts = [...dlg.querySelectorAll('[role=option]')];
  const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
  const visible = () => opts.filter((o) => !o.hidden);
  let active = 0;

  function select(i) {
    const v = visible();
    active = v.length ? (i + v.length) % v.length : -1;
    opts.forEach((o) => o.setAttribute('aria-selected', o === v[active]));
    if (v[active]) { q.setAttribute('aria-activedescendant', v[active].id); v[active].scrollIntoView({ block: 'nearest' }); }
    else q.removeAttribute('aria-activedescendant');
  }
  function filter() {
    const s = norm(q.value.trim());
    opts.forEach((o) => (o.hidden = !norm(o.dataset.label).includes(s)));
    dlg.querySelectorAll('.group').forEach((g) => (g.hidden = !g.querySelector('[role=option]:not([hidden])')));
    empty.hidden = visible().length > 0;
    empty.querySelector('b').textContent = q.value;
    select(0);
  }
  function open() { q.value = ''; filter(); dlg.showModal(); }
  function run(o) { dlg.close(); document.getElementById('out').textContent = 'Ejecutado: ' + o.dataset.label; }

  if (/Mac|iPhone|iPad/.test(navigator.userAgent)) document.querySelector('.trigger kbd').textContent = '⌘K';
  document.getElementById('open').addEventListener('click', open);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); dlg.open ? dlg.close() : open(); }
  });
  q.addEventListener('input', filter);
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); select(active + (e.key === 'ArrowDown' ? 1 : -1)); }
    if (e.key === 'Enter' && visible()[active]) { e.preventDefault(); run(visible()[active]); }
  });
  dlg.addEventListener('click', (e) => {
    const o = e.target.closest('[role=option]');
    if (o) run(o); else if (e.target === dlg) dlg.close(); // clic en el fondo
  });
  dlg.addEventListener('mousemove', (e) => {
    const o = e.target.closest('[role=option]');
    if (o) select(visible().indexOf(o));
  });
</script>
</body>
</html>
