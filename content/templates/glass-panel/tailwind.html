<style>
  .glass{background:color-mix(in srgb,var(--surface) 72%,transparent);border:1px solid color-mix(in srgb,var(--text) 14%,transparent);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
  .switch{appearance:none;flex:none;position:relative;width:38px;height:22px;margin:0;border-radius:999px;background:var(--muted);cursor:pointer;transition:background .2s}
  .switch::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
  .switch:checked{background:var(--accent)}
  .switch:checked::before{transform:translateX(16px)}
  @media (prefers-reduced-motion:reduce){.switch,.switch::before{transition:none}}
</style>
<main class="relative isolate mx-auto grid max-w-[760px] grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-4 overflow-hidden rounded-lg border border-line bg-page p-4 text-sm text-fg">
  <span class="pointer-events-none absolute -left-[50px] -top-[70px] -z-10 size-[200px] rounded-full bg-accent opacity-75 blur-[36px]" aria-hidden="true"></span>
  <span class="pointer-events-none absolute -right-[30px] top-[35%] -z-10 size-[170px] rounded-full bg-gradient-to-br from-accent-2 to-info opacity-75 blur-[36px]" aria-hidden="true"></span>
  <span class="pointer-events-none absolute bottom-[-130px] left-[30%] -z-10 size-[220px] rounded-full bg-info opacity-75 blur-[36px]" aria-hidden="true"></span>
  <nav class="glass col-span-full flex flex-wrap items-center justify-between gap-3 rounded-lg px-4 py-2.5" aria-label="Principal">
    <strong class="font-bold">Aurora</strong>
    <ul class="flex flex-wrap gap-1 p-0 list-none m-0">
      <li><a href="#" aria-current="page" class="block rounded-lg px-2.5 py-1.5 text-fg no-underline hover:bg-accent-soft aria-[current=page]:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Inicio</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 text-fg no-underline hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Proyectos</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 text-fg no-underline hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Equipo</a></li>
    </ul>
  </nav>
  <article class="glass rounded-lg p-5">
    <h2 class="mb-1.5 text-base font-semibold">Plan Pro</h2>
    <p class="mb-3.5">Acceso a todos los paneles, informes semanales y soporte prioritario.</p>
    <button type="button" class="rounded-lg border border-accent bg-accent px-3.5 py-1.5 font-semibold text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Cambiar plan</button>
  </article>
  <section class="glass overflow-hidden rounded-lg" aria-labelledby="ajustes">
    <header class="border-b border-line px-3.5 py-2.5"><h2 id="ajustes" class="text-sm font-semibold">Ajustes</h2></header>
    <label class="flex cursor-pointer items-center justify-between gap-3 px-3.5 py-3"><span>Avisos por correo</span><input type="checkbox" class="switch" checked></label>
    <label class="flex cursor-pointer items-center justify-between gap-3 border-t border-line px-3.5 py-3"><span>Sincronizar en segundo plano</span><input type="checkbox" class="switch"></label>
  </section>
</main>
