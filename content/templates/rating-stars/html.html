<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valoración con estrellas</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card { max-width:360px; padding:16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
  fieldset { margin:0; padding:0; border:0; }
  legend { padding:0; margin-bottom:8px; font-weight:600; }
  .rate { display:flex; gap:2px; }
  .rate input { position:absolute; opacity:0; width:1px; height:1px; }
  .rate label { display:block; padding:2px; border-radius:var(--radius); cursor:pointer; }
  .star { display:block; width:32px; height:32px; fill:var(--surface); stroke:var(--warn); stroke-width:1.5; stroke-linejoin:round; transition:transform 140ms, fill 140ms; }
  /* rellena la estrella marcada y todas las anteriores */
  .rate input:checked + label .star, .rate label:has(~ input:checked) .star { fill:var(--warn); }
  /* vista previa al pasar el cursor */
  .rate:has(label:hover) label .star { fill:var(--surface); }
  .rate label:hover .star, .rate label:has(~ label:hover) .star { fill:var(--warn) !important; }
  .rate label:hover .star { transform:scale(1.1); }
  .rate input:focus-visible + label { outline:2px solid var(--accent); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  output { display:block; min-height:1.5em; margin-top:8px; color:var(--muted); }
  .ro { display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-variant-numeric:tabular-nums; }
  .ro .star { width:18px; height:18px; fill:var(--warn); }
  .ro .off .star { fill:var(--surface); }
  .ro .stars { display:flex; }
  @media (prefers-reduced-motion:reduce) { .star { transition:none; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.7l-5.9 3.1 1.2-6.5L2.5 9.7l6.6-.9z"/></symbol>
  </svg>
  <div class="card">
    <form onsubmit="return false">
      <fieldset>
        <legend>¿Qué tal estuvo el servicio?</legend>
        <div class="rate">
          <input type="radio" name="rate" id="r1" value="1"><label for="r1"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">1 estrella</span></label>
          <input type="radio" name="rate" id="r2" value="2"><label for="r2"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">2 estrellas</span></label>
          <input type="radio" name="rate" id="r3" value="3"><label for="r3"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">3 estrellas</span></label>
          <input type="radio" name="rate" id="r4" value="4"><label for="r4"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">4 estrellas</span></label>
          <input type="radio" name="rate" id="r5" value="5"><label for="r5"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">5 estrellas</span></label>
        </div>
      </fieldset>
      <output id="out" aria-live="polite">Elige de 1 a 5 estrellas</output>
    </form>
    <div class="ro" role="img" aria-label="Valoración media: 4 de 5 estrellas, 128 opiniones">
      <span class="stars" aria-hidden="true">
        <svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><span class="off"><svg class="star"><use href="#i-star"/></svg></span>
      </span>
      <span>4,0 de 5 (128 opiniones)</span>
    </div>
  </div>
<script>
  const words = ['', 'muy malo', 'regular', 'bien', 'muy bien', 'excelente'];
  document.querySelectorAll('.rate input').forEach((r) =>
    r.addEventListener('change', () => { out.textContent = `Tu valoración: ${r.value} de 5, ${words[r.value]}`; }));
</script>
</body>
</html>
