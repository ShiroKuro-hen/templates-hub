<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valoración con estrellas</title>
<style>
  :root { --bg:#f6f1e7; --surface:#fffdf8; --ink:#17130f; --muted:#6b6258; --accent:#ff5a36; --hl:#ffd84d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .card { max-width:360px; padding:16px; border:2px solid var(--ink); border-radius:10px; background:var(--surface); box-shadow:4px 4px 0 var(--ink); }
  fieldset { margin:0; padding:0; border:0; }
  legend { padding:0; margin-bottom:8px; font-weight:700; letter-spacing:-.01em; }
  .rate { display:flex; gap:2px; }
  .rate input { position:absolute; opacity:0; width:1px; height:1px; }
  .rate label { display:block; padding:2px; border-radius:8px; cursor:pointer; }
  .star { display:block; width:34px; height:34px; fill:var(--surface); stroke:var(--ink); stroke-width:2; stroke-linejoin:round; transition:transform .12s; }
  /* rellena la estrella marcada y todas las anteriores */
  .rate input:checked + label .star, .rate label:has(~ input:checked) .star { fill:var(--hl); }
  /* vista previa al pasar el cursor */
  .rate:has(label:hover) label .star { fill:var(--surface); }
  .rate label:hover .star, .rate label:has(~ label:hover) .star { fill:var(--hl) !important; }
  .rate label:hover .star { transform:scale(1.12); }
  .rate input:focus-visible + label { outline:3px solid var(--accent); outline-offset:1px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  output { display:block; min-height:1.4em; margin-top:8px; color:var(--muted); font:13px ui-monospace, monospace; }
  .ro { display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px; border-top:2px solid var(--ink); }
  .ro .star { width:18px; height:18px; fill:var(--hl); }
  .ro .off .star { fill:var(--surface); }
  .ro .stars { display:flex; }
  @media (prefers-reduced-motion:reduce) { .star { transition:none; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.7l-5.9 3.1 1.2-6.5L2.5 9.7l6.6-.9z"/></symbol>
  </svg>
  <div class="card">
    <form onsubmit="return false">
      <fieldset>
        <legend>¿Qué tal estuvo el servicio?</legend>
        <div class="rate">
          <input type="radio" name="rate" id="r1" value="1"><label for="r1"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">1 estrella</span></label>
          <input type="radio" name="rate" id="r2" value="2"><label for="r2"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">2 estrellas</span></label>
          <input type="radio" name="rate" id="r3" value="3"><label for="r3"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">3 estrellas</span></label>
          <input type="radio" name="rate" id="r4" value="4"><label for="r4"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">4 estrellas</span></label>
          <input type="radio" name="rate" id="r5" value="5"><label for="r5"><svg class="star" aria-hidden="true"><use href="#i-star"/></svg><span class="sr">5 estrellas</span></label>
        </div>
      </fieldset>
      <output id="out" aria-live="polite">Elige de 1 a 5 estrellas</output>
    </form>
    <div class="ro" role="img" aria-label="Valoración media: 4 de 5 estrellas, 128 opiniones">
      <span class="stars" aria-hidden="true">
        <svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><svg class="star"><use href="#i-star"/></svg><span class="off"><svg class="star"><use href="#i-star"/></svg></span>
      </span>
      <span>4,0 · 128 opiniones</span>
    </div>
  </div>
<script>
  const words = ['', 'Muy malo', 'Regular', 'Bien', 'Muy bien', 'Excelente'];
  document.querySelectorAll('.rate input').forEach((r) =>
    r.addEventListener('change', () => { out.textContent = `Tu valoración: ${r.value} de 5 · ${words[r.value]}`; }));
</script>
</body>
</html>
