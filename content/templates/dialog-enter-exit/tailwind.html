<style>
  .modal { --dur:240ms; --ease:cubic-bezier(.2,.7,.2,1); opacity:0; transform:translateY(8px) scale(.98); transition-property:opacity, transform, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, normal, allow-discrete, allow-discrete; }
  .modal[open] { opacity:1; transform:none; }
  @starting-style { .modal[open] { opacity:0; transform:translateY(8px) scale(.98); } }
  .modal::backdrop { background:rgba(0,0,0,0); transition-property:background, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, allow-discrete, allow-discrete; }
  .modal[open]::backdrop { background:rgba(0,0,0,.5); }
  @starting-style { .modal[open]::backdrop { background:rgba(0,0,0,0); } }
  @media (prefers-reduced-motion:reduce) { .modal, .modal::backdrop { transition:none; } }
</style>
<main class="mx-auto max-w-[640px] rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <h1 class="mb-1 text-xl font-semibold tracking-[-0.01em]">Equipo</h1>
  <p class="mb-4 text-muted">Invita a personas al proyecto «Web corporativa».</p>
  <button type="button" id="trigger" aria-haspopup="dialog" class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink hover:brightness-110focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Invitar al equipo</button>
  <p id="msg" role="status" class="mt-3 min-h-6 text-ok"></p>
</main>

<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-desc" class="modal m-auto w-[min(440px,calc(100%-32px))] rounded-lg border border-line bg-surface p-6 text-sm text-fg shadow-sm backdrop:bg-black/0">
  <form method="dialog">
    <h2 id="dlg-title" class="mb-1 text-lg font-semibold">Invitar a una persona</h2>
    <p id="dlg-desc" class="mb-4 text-muted">Le enviaremos un enlace para unirse al proyecto. Caduca en 7 días.</p>
    <label for="email" class="mb-1.5 block font-medium">Correo electrónico</label>
    <input id="email" type="email" required autocomplete="email" placeholder="nombre@empresa.com" autofocus
           class="box-border w-full rounded-lg border border-line bg-surface px-2.5 py-2 text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <div class="mt-5 flex flex-wrap justify-end gap-2">
      <button class="rounded-lg border border-line bg-surface px-3.5 py-2 font-semibold text-fg hover:bg-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" type="submit" value="cancel" formnovalidate>Cancelar</button>
      <button class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" type="submit" value="send">Enviar invitación</button>
    </div>
  </form>
</dialog>
<script>
  const dlg = document.getElementById('dlg'), trigger = document.getElementById('trigger');
  const email = document.getElementById('email'), msg = document.getElementById('msg');
  const isOutside = (e) => {
    const r = dlg.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  };
  trigger.addEventListener('click', () => {
    dlg.querySelector('form').reset();
    dlg.returnValue = '';
    dlg.showModal();
  });
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg && isOutside(e)) dlg.close('cancel');
  });
  dlg.addEventListener('close', () => {
    trigger.focus();
    if (dlg.returnValue === 'send') msg.textContent = `Invitación enviada a ${email.value.trim()}.`;
  });
</script>
