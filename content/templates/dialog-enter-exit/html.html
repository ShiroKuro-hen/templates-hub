<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diálogo con transiciones</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .page { max-width:640px; margin:0 auto; padding:20px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  h1 { margin:0 0 4px; font-size:1.25rem; letter-spacing:-.01em; }
  .lead { margin:0 0 16px; color:var(--muted); }
  .status { min-height:1.5em; margin:12px 0 0; color:var(--ok); }
  .btn { padding:8px 14px; font:inherit; font-weight:600; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:background .14s, filter .14s; }
  .btn:hover { background:var(--bg); }
  .btn.primary { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .btn.primary:hover { background:var(--accent); filter:brightness(1.08); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .modal { --dur:240ms; --ease:cubic-bezier(.2,.7,.2,1); width:min(440px,calc(100% - 32px)); padding:24px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); opacity:0; transform:translateY(8px) scale(.98); transition-property:opacity, transform, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, normal, allow-discrete, allow-discrete; }
  .modal[open] { opacity:1; transform:none; }
  @starting-style { .modal[open] { opacity:0; transform:translateY(8px) scale(.98); } }
  .modal::backdrop { background:rgba(0,0,0,0); transition-property:background, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, allow-discrete, allow-discrete; }
  .modal[open]::backdrop { background:rgba(0,0,0,.5); }
  @starting-style { .modal[open]::backdrop { background:rgba(0,0,0,0); } }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .modal p { margin:0 0 16px; color:var(--muted); }
  .modal label { display:block; margin:0 0 6px; font-weight:500; }
  .modal input { box-sizing:border-box; width:100%; padding:8px 10px; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:20px; }
  @media (prefers-reduced-motion:reduce) { .modal, .modal::backdrop { transition:none; } }
</style>
</head>
<body>
<main class="page">
  <h1>Equipo</h1>
  <p class="lead">Invita a personas al proyecto «Web corporativa».</p>
  <button type="button" class="btn primary" id="trigger" aria-haspopup="dialog">Invitar al equipo</button>
  <p class="status" id="msg" role="status"></p>
</main>

<dialog class="modal" id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
  <form method="dialog">
    <h2 id="dlg-title">Invitar a una persona</h2>
    <p id="dlg-desc">Le enviaremos un enlace para unirse al proyecto. Caduca en 7 días.</p>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" required autocomplete="email" placeholder="nombre@empresa.com" autofocus>
    <div class="actions">
      <button class="btn" type="submit" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn primary" type="submit" value="send">Enviar invitación</button>
    </div>
  </form>
</dialog>
<script>
  const dlg = document.getElementById('dlg'), trigger = document.getElementById('trigger');
  const email = document.getElementById('email'), msg = document.getElementById('msg');
  const isOutside = (e) => {
    const r = dlg.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  };
  trigger.addEventListener('click', () => {
    dlg.querySelector('form').reset();
    dlg.returnValue = '';
    dlg.showModal();
  });
  dlg.addEventListener('click', (e) => {
    if (e.target === dlg && isOutside(e)) dlg.close('cancel');
  });
  dlg.addEventListener('close', () => {
    trigger.focus();
    if (dlg.returnValue === 'send') msg.textContent = `Invitación enviada a ${email.value.trim()}.`;
  });
</script>
</body>
</html>
