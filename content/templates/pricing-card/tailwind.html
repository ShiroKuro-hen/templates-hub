<article class="relative m-5 mt-7 flex max-w-xs flex-col gap-3 rounded-lg border border-accent bg-surface p-5 text-sm text-fg shadow-sm">
  <span aria-hidden="true" class="absolute -inset-x-px -top-px h-[3px] rounded-t-lg bg-gradient-to-r from-accent-2 to-accent"></span>
  <span class="absolute -top-3 right-4 rounded-full border border-accent bg-accent-soft px-2.5 py-0.5 text-xs font-semibold text-accent">Recomendado</span>
  <h2 class="text-base font-semibold">Pro</h2>
  <p class="text-4xl font-bold leading-none tracking-tight tabular-nums">$12 <small class="text-[13px] font-medium tracking-normal text-muted">/mes</small></p>
  <ul class="grid flex-1 gap-1.5 border-t border-line pt-3">
    <li><span aria-hidden="true" class="mr-1.5 inline-block w-4 font-bold text-ok">✓</span>Proyectos ilimitados</li>
    <li><span aria-hidden="true" class="mr-1.5 inline-block w-4 font-bold text-ok">✓</span>Exportar a PDF y PNG</li>
    <li><span aria-hidden="true" class="mr-1.5 inline-block w-4 font-bold text-ok">✓</span>Dominio propio</li>
    <li class="text-muted line-through"><span aria-hidden="true" class="mr-1.5 inline-block w-4 font-bold">✕</span>Soporte dedicado</li>
  </ul>
  <button type="button" id="elegir" aria-pressed="false" class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink transition-colors hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-ok aria-pressed:bg-ok-soft aria-pressed:text-ok motion-reduce:transition-none">Elegir Pro</button>
  <p id="msg" role="status" class="sr-only"></p>
</article>
<script>
  const b = document.getElementById('elegir');
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    b.textContent = on ? 'Plan elegido' : 'Elegir Pro';
    document.getElementById('msg').textContent = on ? 'Elegiste el plan Pro.' : 'Plan Pro descartado.';
  });
</script>
