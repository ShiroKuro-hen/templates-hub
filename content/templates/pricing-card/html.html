<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de plan</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .plans { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; max-width:720px; padding-top:10px; }
  .plan { position:relative; display:flex; flex-direction:column; gap:12px; padding:20px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); }
  .plan.hot { border-color:var(--accent); }
  .plan.hot::before { content:""; position:absolute; inset:-1px -1px auto; height:3px; border-radius:var(--radius) var(--radius) 0 0; background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  .badge { position:absolute; top:-11px; right:16px; padding:2px 10px; border:1px solid var(--accent); border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:12px; font-weight:600; }
  .plan h2 { margin:0; font-size:1rem; font-weight:600; }
  .price { margin:0; font-size:2.25rem; font-weight:700; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
  .price small { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .plan ul { margin:0; padding:12px 0 0; border-top:1px solid var(--border); list-style:none; display:grid; gap:6px; flex:1; }
  .plan li::before { content:"✓"; display:inline-block; width:16px; margin-right:6px; font-weight:700; color:var(--ok); }
  .plan li.no { color:var(--muted); text-decoration:line-through; } .plan li.no::before { content:"✕"; color:var(--muted); }
  button { font:600 14px system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:9px 14px; cursor:pointer; transition:border-color 140ms, background 140ms, filter 140ms; }
  button:hover { border-color:var(--accent); }
  .hot button { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .hot button:hover { filter:brightness(1.08); }
  button[aria-pressed="true"], .hot button[aria-pressed="true"] { color:var(--ok); background:var(--ok-soft); border-color:var(--ok); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { margin:12px 0 0; color:var(--muted); min-height:1.5em; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>
</head>
<body>
<div class="plans" role="group" aria-label="Planes disponibles">
  <article class="plan">
    <h2>Free</h2>
    <p class="price">$0 <small>/mes</small></p>
    <ul><li>3 proyectos</li><li>Exportar a PNG</li><li class="no">Dominio propio</li></ul>
    <button type="button" aria-pressed="false" data-plan="Free">Empezar gratis</button>
  </article>
  <article class="plan hot">
    <span class="badge">Recomendado</span>
    <h2>Pro</h2>
    <p class="price">$12 <small>/mes</small></p>
    <ul><li>Proyectos ilimitados</li><li>Exportar a PDF y PNG</li><li>Dominio propio</li></ul>
    <button type="button" aria-pressed="false" data-plan="Pro">Elegir Pro</button>
  </article>
</div>
<p id="msg" role="status"></p>
<script>
  const btns = [...document.querySelectorAll('button[data-plan]')], msg = document.getElementById('msg');
  const label = { Free: 'Empezar gratis', Pro: 'Elegir Pro' };
  btns.forEach((b) => b.addEventListener('click', () => {
    btns.forEach((x) => { x.setAttribute('aria-pressed', x === b); x.textContent = x === b ? 'Plan elegido' : label[x.dataset.plan]; });
    msg.textContent = 'Elegiste el plan ' + b.dataset.plan + '.';
  }));
</script>
</body>
</html>
