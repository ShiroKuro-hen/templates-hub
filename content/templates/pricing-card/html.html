<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui, sans-serif; background:#f6f1e7; color:#17130f; }
  .plans { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; }
  .plan { position:relative; display:flex; flex-direction:column; gap:10px; padding:16px; border:2px solid #17130f; border-radius:10px; background:#fffdf8; box-shadow:4px 4px 0 #17130f; }
  .plan.hot { background:#ffd84d; }
  .badge { position:absolute; top:-12px; right:12px; padding:1px 10px; border:2px solid #17130f; border-radius:99px; background:#ff5a36; font:700 .72rem ui-monospace, monospace; }
  .plan h2 { margin:0; font-size:1.1rem; letter-spacing:-.02em; }
  .price { margin:0; font-size:2.4rem; font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
  .price small { font:600 .8rem ui-monospace, monospace; color:#4d453c; letter-spacing:0; }
  .plan ul { margin:0; padding:0; list-style:none; display:grid; gap:6px; flex:1; }
  .plan li::before { content:"✓"; margin-right:8px; font-weight:800; color:#17130f; }
  .plan li.no { color:#4d453c; text-decoration:line-through; } .plan li.no::before { content:"✕"; color:#d6293e; }
  button { font:700 .9rem system-ui, sans-serif; color:#17130f; background:#fffdf8; border:2px solid #17130f; border-radius:10px; padding:8px 14px; box-shadow:4px 4px 0 #17130f; cursor:pointer; }
  .hot button { background:#ff5a36; }
  button[aria-pressed="true"] { background:#17130f; color:#fffdf8; }
  button:hover, button:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #17130f; }
  button:focus-visible { outline:3px solid #ff5a36; outline-offset:2px; }
  .hot button:focus-visible { outline-color:#17130f; }
  #msg { margin:12px 0 0; color:#4d453c; min-height:1.2em; }
  @media (prefers-reduced-motion:no-preference) { button { transition:transform .1s, box-shadow .1s; } }
</style>
</head>
<body>
<div class="plans" role="group" aria-label="Planes disponibles">
  <article class="plan">
    <h2>Free</h2>
    <p class="price">$0 <small>/mes</small></p>
    <ul><li>3 proyectos</li><li>Exportar a PNG</li><li class="no">Dominio propio</li></ul>
    <button type="button" aria-pressed="false" data-plan="Free">Empezar gratis</button>
  </article>
  <article class="plan hot">
    <span class="badge">Recomendado</span>
    <h2>Pro</h2>
    <p class="price">$12 <small>/mes</small></p>
    <ul><li>Proyectos ilimitados</li><li>Exportar a PDF y PNG</li><li>Dominio propio</li></ul>
    <button type="button" aria-pressed="false" data-plan="Pro">Elegir Pro</button>
  </article>
</div>
<p id="msg" role="status"></p>
<script>
  const btns = [...document.querySelectorAll('button[data-plan]')], msg = document.getElementById('msg');
  const label = { Free: 'Empezar gratis', Pro: 'Elegir Pro' };
  btns.forEach((b) => b.addEventListener('click', () => {
    btns.forEach((x) => { x.setAttribute('aria-pressed', x === b); x.textContent = x === b ? 'Plan elegido' : label[x.dataset.plan]; });
    msg.textContent = 'Elegiste el plan ' + b.dataset.plan + '.';
  }));
</script>
</body>
</html>
