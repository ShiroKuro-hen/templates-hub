<header class="relative m-4 flex items-center justify-between gap-3 rounded-lg border border-slate-200 bg-white px-3.5 py-2 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <a href="#" class="text-lg font-bold tracking-tight">Nexo</a>

  <button id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"
    class="grid h-10 w-10 place-items-center rounded-lg border border-slate-200 bg-white text-xl dark:border-slate-700 dark:bg-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 sm:hidden">☰</button>

  <nav id="menu" aria-label="Principal"
    class="absolute left-0 right-0 top-full z-10 mt-2 flex flex-col gap-2 rounded-lg border border-slate-200 bg-white p-2.5 shadow-sm dark:border-slate-700 dark:bg-slate-900 max-sm:hidden sm:static sm:mt-0 sm:flex-row sm:items-center sm:gap-3.5 sm:border-0 sm:bg-transparent sm:p-0 sm:shadow-none dark:sm:bg-transparent">
    <ul class="m-0 flex list-none flex-col gap-1 p-0 sm:flex-row">
      <li><a href="#" aria-current="page" class="block rounded-lg bg-blue-50 px-2.5 py-1.5 font-medium text-blue-600 dark:bg-slate-800 dark:text-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Inicio</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Productos</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Precios</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Contacto</a></li>
    </ul>
    <a href="#" class="rounded-lg bg-blue-600 px-3.5 py-2 text-center font-semibold text-white shadow-sm hover:bg-blue-500 dark:bg-blue-500 dark:hover:bg-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Crear cuenta</a>
  </nav>
</header>

<script>
  const burger = document.getElementById('burger'), menu = document.getElementById('menu');
  const set = (o) => {
    burger.setAttribute('aria-expanded', o);
    burger.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú');
    burger.textContent = o ? '✕' : '☰';
    menu.classList.toggle('max-sm:hidden', !o);
  };
  burger.addEventListener('click', () => set(burger.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
</script>
