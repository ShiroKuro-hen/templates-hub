<header class="relative m-4 flex items-center justify-between gap-3 rounded-lg border border-line bg-surface px-3.5 py-2 text-fg shadow-sm">
  <a href="#" class="text-lg font-bold tracking-tight">Nexo</a>

  <button id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"
    class="grid h-10 w-10 place-items-center rounded-lg border border-line bg-surface text-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent sm:hidden">☰</button>

  <nav id="menu" aria-label="Principal"
    class="absolute left-0 right-0 top-full z-10 mt-2 flex flex-col gap-2 rounded-lg border border-line bg-surface p-2.5 shadow-sm max-sm:hidden sm:static sm:mt-0 sm:flex-row sm:items-center sm:gap-3.5 sm:border-0 sm:bg-transparent sm:p-0 sm:shadow-none dark:sm:bg-transparent">
    <ul class="m-0 flex list-none flex-col gap-1 p-0 sm:flex-row">
      <li><a href="#" aria-current="page" class="block rounded-lg bg-accent-soft px-2.5 py-1.5 font-medium text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Inicio</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Productos</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Precios</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-medium text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Contacto</a></li>
    </ul>
    <a href="#" class="rounded-lg bg-accent px-3.5 py-2 text-center font-semibold text-accent-ink shadow-sm hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Crear cuenta</a>
  </nav>
</header>

<script>
  const burger = document.getElementById('burger'), menu = document.getElementById('menu');
  const set = (o) => {
    burger.setAttribute('aria-expanded', o);
    burger.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú');
    burger.textContent = o ? '✕' : '☰';
    menu.classList.toggle('max-sm:hidden', !o);
  };
  burger.addEventListener('click', () => set(burger.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
</script>
