<header class="relative m-4 flex items-center justify-between gap-3 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-3.5 py-2.5 shadow-[4px_4px_0_#17130f]">
  <a href="#" class="text-lg font-extrabold tracking-tight">Tinta&amp;Co</a>

  <button id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"
    class="grid h-11 w-11 place-items-center rounded-[10px] border-2 border-[#17130f] bg-[#ffd84d] text-xl focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] sm:hidden">☰</button>

  <nav id="menu" aria-label="Principal"
    class="absolute left-0 right-0 top-full z-10 mt-2 flex flex-col gap-2 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-2.5 shadow-[4px_4px_0_#17130f] max-sm:hidden sm:static sm:mt-0 sm:flex-row sm:items-center sm:gap-3.5 sm:border-0 sm:bg-transparent sm:p-0 sm:shadow-none">
    <ul class="m-0 flex list-none flex-col gap-1 p-0 sm:flex-row">
      <li><a href="#" aria-current="page" class="block rounded-lg bg-[#17130f] px-2.5 py-1.5 font-semibold text-[#fffdf8] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">Inicio</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-semibold hover:bg-[#ffd84d] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">Productos</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-semibold hover:bg-[#ffd84d] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">Precios</a></li>
      <li><a href="#" class="block rounded-lg px-2.5 py-1.5 font-semibold hover:bg-[#ffd84d] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">Contacto</a></li>
    </ul>
    <a href="#" class="rounded-[10px] border-2 border-[#17130f] bg-[#ff5a36] px-3.5 py-2 text-center font-bold shadow-[2px_2px_0_#17130f] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">Crear cuenta</a>
  </nav>
</header>

<script>
  const burger = document.getElementById('burger'), menu = document.getElementById('menu');
  const set = (o) => {
    burger.setAttribute('aria-expanded', o);
    burger.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú');
    burger.textContent = o ? '✕' : '☰';
    menu.classList.toggle('max-sm:hidden', !o);
  };
  burger.addEventListener('click', () => set(burger.getAttribute('aria-expanded') !== 'true'));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') set(false); });
</script>
