<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barra de navegación</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  a, button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .nav { position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .brand { font-weight:700; font-size:1.1rem; letter-spacing:-.01em; text-decoration:none; }
  .menu { display:flex; align-items:center; gap:14px; }
  .menu ul { display:flex; gap:4px; margin:0; padding:0; list-style:none; }
  .menu a:not(.btn) { position:relative; display:block; padding:6px 10px; border-radius:var(--radius); color:var(--muted); font-weight:500; text-decoration:none; transition:background .14s, color .14s; }
  .menu a:not([aria-current]):not(.btn):hover { color:var(--text); background:var(--bg); }
  .menu a[aria-current] { color:var(--accent); background:var(--accent-soft); }
  .menu a[aria-current]::after { content:""; position:absolute; left:10px; right:10px; bottom:2px; height:2px; border-radius:2px; background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  .btn { padding:7px 14px; border-radius:var(--radius); background:var(--accent); color:var(--accent-ink); font-weight:600; text-decoration:none; transition:filter .14s; }
  .btn:hover { filter:brightness(1.1); }
  .burger { display:none; position:relative; width:40px; height:40px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); cursor:pointer; }
  .burger span, .burger span::before, .burger span::after { position:absolute; left:0; right:0; height:2px; border-radius:2px; background:var(--text); content:""; transition:transform .14s; }
  .burger span { top:50%; left:11px; right:11px; margin-top:-1px; }
  .burger span::before { transform:translateY(-6px); }
  .burger span::after { transform:translateY(6px); }
  .burger[aria-expanded="true"] span { background:transparent; }
  .burger[aria-expanded="true"] span::before { transform:rotate(45deg); }
  .burger[aria-expanded="true"] span::after { transform:rotate(-45deg); }
  main { margin-top:24px; padding:0 4px; }
  h1 { margin:0 0 4px; font-size:1.5rem; font-weight:600; letter-spacing:-.01em; }
  main p { margin:0; max-width:46ch; color:var(--muted); }
  @media (max-width:560px) {
    .burger { display:block; }
    .menu { display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:2; flex-direction:column; align-items:stretch; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
    .menu.open { display:flex; }
    .menu ul { flex-direction:column; }
    .btn { text-align:center; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#">Nexo</a>
    <button class="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú"><span></span></button>
    <nav id="menu" class="menu" aria-label="Principal">
      <ul>
        <li><a href="#" aria-current="page">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Precios</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
      <a class="btn" href="#">Crear cuenta</a>
    </nav>
  </header>
  <main>
    <h1 id="title">Inicio</h1>
    <p>Prueba el menú: en pantallas estrechas se abre con el botón y se cierra con Esc.</p>
  </main>
<script>
  const burger = document.querySelector('.burger'), menu = document.getElementById('menu'), title = document.getElementById('title');
  const isOpen = () => burger.getAttribute('aria-expanded') === 'true';
  const set = (o) => {
    burger.setAttribute('aria-expanded', o);
    burger.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú');
    menu.classList.toggle('open', o);
  };
  burger.addEventListener('click', () => set(!isOpen()));
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) { set(false); burger.focus(); } });
  menu.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    if (!a.classList.contains('btn')) {
      menu.querySelectorAll('a').forEach((x) => x.removeAttribute('aria-current'));
      a.setAttribute('aria-current', 'page');
      title.textContent = a.textContent;
    }
    set(false);
  });
</script>
</body>
</html>
