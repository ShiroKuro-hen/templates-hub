<section id="banner" aria-label="Anuncio"
         class="grid grid-rows-[1fr] border-b border-line bg-accent-soft text-sm text-fg transition-[grid-template-rows] duration-150 motion-reduce:transition-none [&.off]:grid-rows-[0fr] [&.off]:border-b-0">
  <div class="min-h-0 overflow-hidden [.off_&]:invisible">
    <div class="flex items-center gap-3 bg-gradient-to-r from-accent-2 to-accent bg-[length:100%_2px] bg-bottom bg-no-repeat px-4 pt-2.5 pb-3">
      <p class="m-0 flex-1">
        <span class="mr-2 inline-block rounded-full bg-accent px-2.5 py-px text-xs font-semibold text-accent-ink">Nuevo</span>
        Ya puedes exportar tus informes a PDF.
        <a href="#novedades" class="whitespace-nowrap font-semibold text-accent underline underline-offset-4 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ver novedades</a>
      </p>
      <button type="button" id="close" aria-label="Cerrar anuncio"
              class="h-[30px] w-[30px] flex-none rounded-lg text-xl leading-none text-muted hover:bg-surface hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">×</button>
    </div>
  </div>
</section>
<script>
  const banner = document.getElementById('banner');
  document.getElementById('close').addEventListener('click', () => {
    banner.classList.add('off');
    document.getElementById('main')?.focus(); // pon tabindex="-1" id="main" en tu contenido
  });
</script>
