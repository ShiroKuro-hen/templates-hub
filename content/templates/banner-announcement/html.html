<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner de anuncio</title>
<style>
  :root { --bg:#f6f1e7; --surface:#fffdf8; --ink:#17130f; --muted:#6b6258; --accent:#ff5a36; --hl:#ffd84d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .banner { display:grid; grid-template-rows:1fr; transition:grid-template-rows .25s ease; background:var(--hl); border-bottom:2px solid var(--ink); }
  .banner > div { overflow:hidden; min-height:0; }
  .banner.off { grid-template-rows:0fr; border-bottom-width:0; }
  .banner.off > div { visibility:hidden; transition:visibility 0s .25s; }
  .inner { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .inner p { flex:1; margin:0; }
  .inner a { color:var(--ink); font-weight:700; text-underline-offset:3px; white-space:nowrap; }
  .tag { font:700 12px ui-monospace, monospace; padding:2px 7px; margin-right:6px; background:var(--ink); color:var(--hl); border-radius:6px; }
  .x { flex:none; width:30px; height:30px; font-size:20px; line-height:1; color:var(--ink); background:none; border:2px solid transparent; border-radius:8px; cursor:pointer; }
  .x:hover { border-color:var(--ink); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  main { padding:20px; }
  h1 { margin:0 0 6px; font-size:24px; letter-spacing:-.02em; }
  main p { margin:0 0 16px; color:var(--muted); max-width:44ch; }
  .again { font:600 14px system-ui; padding:8px 14px; color:var(--ink); background:var(--surface); border:2px solid var(--ink); border-radius:10px; box-shadow:4px 4px 0 var(--ink); cursor:pointer; }
  .again:hover, .again:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  @media (prefers-reduced-motion:reduce) { .banner, .banner.off > div { transition:none; } }
</style>
</head>
<body>
<section class="banner" id="banner" aria-label="Anuncio">
  <div>
    <div class="inner">
      <p><span class="tag">Nuevo</span>Ya puedes exportar tus informes a PDF. <a href="#novedades">Ver novedades</a></p>
      <button type="button" class="x" id="close" aria-label="Cerrar anuncio">×</button>
    </div>
  </div>
</section>
<main>
  <h1>Panel de ventas</h1>
  <p>Resumen de octubre: 128 pedidos nuevos y un 12 % más de ingresos que el mes pasado.</p>
  <button type="button" class="again" id="again">Mostrar anuncio</button>
</main>
<script>
  const b = document.getElementById('banner'), close = document.getElementById('close'), again = document.getElementById('again');
  close.addEventListener('click', () => { b.classList.add('off'); again.focus(); });
  again.addEventListener('click', () => { b.classList.remove('off'); close.focus(); });
</script>
</body>
</html>
