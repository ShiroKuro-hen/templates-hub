<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner de anuncio</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .banner { display:grid; grid-template-rows:1fr; transition:grid-template-rows .16s ease; background:var(--accent-soft); border-bottom:1px solid var(--border); }
  .banner > div { overflow:hidden; min-height:0; }
  .banner.off { grid-template-rows:0fr; border-bottom-width:0; }
  .banner.off > div { visibility:hidden; transition:visibility 0s .16s; }
  .inner { display:flex; align-items:center; gap:12px; padding:10px 16px 12px; background:linear-gradient(135deg,#22d3ee,#2f5bff) bottom/100% 2px no-repeat; }
  .inner p { flex:1; margin:0; }
  .inner a { color:var(--accent); font-weight:600; text-underline-offset:3px; white-space:nowrap; }
  .tag { display:inline-block; padding:1px 9px; margin-right:8px; font-size:12px; font-weight:600; background:var(--accent); color:var(--accent-ink); border-radius:999px; }
  .x { flex:none; width:30px; height:30px; font-size:20px; line-height:1; color:var(--muted); background:none; border:0; border-radius:var(--radius); cursor:pointer; transition:background .14s, color .14s; }
  .x:hover { color:var(--text); background:var(--surface); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { padding:24px 20px; }
  h1 { margin:0 0 6px; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  main p { margin:0 0 16px; color:var(--muted); max-width:52ch; }
  .again { font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif; padding:8px 14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); cursor:pointer; transition:border-color .14s; }
  .again:hover { border-color:var(--accent); }
  @media (prefers-reduced-motion:reduce) { .banner, .banner.off > div, .x, .again { transition:none; } }
</style>
</head>
<body>
<section class="banner" id="banner" aria-label="Anuncio">
  <div>
    <div class="inner">
      <p><span class="tag">Nuevo</span>Ya puedes exportar tus informes a PDF. <a href="#novedades">Ver novedades</a></p>
      <button type="button" class="x" id="close" aria-label="Cerrar anuncio">×</button>
    </div>
  </div>
</section>
<main>
  <h1>Panel de ventas</h1>
  <p>Resumen de octubre: 128 pedidos nuevos y un 12 % más de ingresos que el mes pasado.</p>
  <button type="button" class="again" id="again">Mostrar anuncio</button>
</main>
<script>
  const b = document.getElementById('banner'), close = document.getElementById('close'), again = document.getElementById('again');
  close.addEventListener('click', () => { b.classList.add('off'); again.focus(); });
  again.addEventListener('click', () => { b.classList.remove('off'); close.focus(); });
</script>
</body>
</html>
