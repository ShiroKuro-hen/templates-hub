<style>
  .fade{animation:fade .25s ease both}
  @keyframes fade{from{opacity:0}}
  ::view-transition-group(card){animation-duration:.42s;animation-timing-function:ease}
  @media (prefers-reduced-motion:reduce){.fade,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
<main id="app" class="mx-auto max-w-[720px] text-sm leading-[1.5] text-fg">
  <ul id="gallery" class="m-0 grid list-none grid-cols-[repeat(auto-fill,minmax(160px,1fr))] gap-3.5 p-0"></ul>
  <article id="detail" hidden class="grid gap-3.5">
    <button id="back" type="button" class="justify-self-start cursor-pointer rounded-lg border border-line bg-surface px-3.5 py-[7px] font-semibold text-fg shadow-smfocus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">← Volver a la galería</button>
    <div id="hero" class="aspect-[16/10] overflow-hidden rounded-lg"><img id="heroImg" alt="" width="160" height="100" class="block h-full w-full"></div>
    <h2 id="dt" tabindex="-1" class="m-0 text-lg leading-[1.5] font-semibold"></h2>
    <p id="dd" class="m-0 text-muted"></p>
  </article>
</main>
<script>
  const OBRAS = [
    { t: 'Costa al amanecer', d: 'Luz cálida sobre la bahía en las primeras horas del día.', s: '<circle cx="118" cy="30" r="12" fill="rgba(255,255,255,.85)"/><path d="M0 80 50 40 90 70 120 52 160 80V100H0Z" fill="rgba(255,255,255,.35)"/>' },
    { t: 'Olas de verano', d: 'Crestas suaves que se repiten hasta el horizonte.', s: '<path d="M0 60Q40 30 80 60T160 60V100H0Z" fill="rgba(255,255,255,.4)"/><rect x="34" y="18" width="58" height="28" rx="6" fill="rgba(255,255,255,.85)"/>' },
    { t: 'Ritmo urbano', d: 'Barras de una ciudad que crece con los años.', s: '<rect x="22" y="48" width="18" height="42" rx="3" fill="rgba(255,255,255,.5)"/><rect x="50" y="26" width="18" height="64" rx="3" fill="rgba(255,255,255,.85)"/><rect x="78" y="58" width="18" height="32" rx="3" fill="rgba(255,255,255,.5)"/><rect x="106" y="36" width="18" height="54" rx="3" fill="rgba(255,255,255,.85)"/>' },
    { t: 'Órbitas', d: 'Dos círculos que giran alrededor del mismo centro.', s: '<circle cx="62" cy="50" r="30" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="4"/><circle cx="104" cy="50" r="18" fill="rgba(255,255,255,.4)"/>' },
    { t: 'Noche estrellada', d: 'Un cielo sereno con una estrella más brillante.', s: '<path d="M80 16 86 36 106 36 90 48 96 68 80 56 64 68 70 48 54 36 74 36Z" fill="rgba(255,255,255,.9)"/>' },
    { t: 'Bloques', d: 'Composición de formas sencillas en equilibrio.', s: '<rect x="20" y="18" width="50" height="62" rx="8" fill="rgba(255,255,255,.4)"/><rect x="86" y="34" width="54" height="46" rx="8" fill="rgba(255,255,255,.85)"/>' },
  ];
  const TILE = 'block aspect-[16/10] overflow-hidden rounded-lg bg-gradient-to-br';
  const GRAD = ['from-accent-2 to-accent', 'from-ok to-info', 'from-warn to-err', 'from-info to-accent', 'from-accent to-err', 'from-ok to-accent'];
  const THUMB = 'block w-full overflow-hidden rounded-lg border border-line bg-surface text-left text-fg shadow-sm cursor-pointer hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent';
  const uri = (s) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">${s}</svg>`);
  const app = document.getElementById('app'), gallery = document.getElementById('gallery'), detail = document.getElementById('detail');
  const hero = document.getElementById('hero'), heroImg = document.getElementById('heroImg');
  const title = document.getElementById('dt'), text = document.getElementById('dd');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const thumbs = OBRAS.map(({ t, s }, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<button class="${THUMB}" type="button"><span class="${TILE} ${GRAD[i]}"><img class="block h-full w-full" alt="" width="160" height="100" src="${uri(s)}"></span><span class="block px-2.5 py-2 font-semibold">${t}</span></button>`;
    gallery.append(li);
    const button = li.querySelector('button');
    button.addEventListener('click', () => open(i));
    return button;
  });
  let cur = 0;

  const clearNames = () => [hero, ...thumbs].forEach((el) => (el.style.viewTransitionName = ''));
  function swap(from, to, update) {
    if (calm) return update();
    if (!document.startViewTransition) {
      update();
      app.classList.remove('fade');
      void app.offsetWidth;
      app.classList.add('fade');
      return;
    }
    clearNames();
    from.style.viewTransitionName = 'card';
    document.startViewTransition(() => {
      clearNames();
      update();
      to.style.viewTransitionName = 'card';
    });
  }
  function showDetail(i) {
    cur = i;
    const { t, d, s } = OBRAS[i];
    gallery.hidden = true;
    detail.hidden = false;
    hero.className = `${TILE} ${GRAD[i]}`;
    heroImg.src = uri(s);
    title.textContent = t;
    text.textContent = d;
    title.focus();
  }
  function showGallery() {
    detail.hidden = true;
    gallery.hidden = false;
    thumbs[cur].focus();
  }
  function open(i) {
    swap(thumbs[i], hero, () => showDetail(i));
  }
  function close() {
    swap(hero, thumbs[cur], showGallery);
  }
  document.getElementById('back').addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !detail.hidden) close();
  });
</script>
