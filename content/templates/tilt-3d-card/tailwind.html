<style>
  @property --rx{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --ry{syntax:'<angle>';inherits:false;initial-value:0deg}
  .tilt{--ease:cubic-bezier(.2,.7,.2,1);transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:--rx .4s var(--ease),--ry .4s var(--ease)}
  .tilt>*{position:relative}
  .tilt::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .4s var(--ease);pointer-events:none}
  @media (hover:hover){.tilt:hover::after{opacity:1}}
  .tilt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main class="grid place-items-center bg-page px-4 py-8 text-sm text-fg">
  <article id="tilt" class="tilt relative w-[280px] max-w-full overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
    <div class="grid aspect-[4/3] place-items-center border-b border-line bg-accent-soft text-accent">
      <svg viewBox="0 0 120 120" role="img" aria-label="Auriculares inalámbricos" class="w-[46%] h-auto">
        <defs><linearGradient id="tilt-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="[stop-color:var(--accent-2,#22d3ee)]"/><stop offset="1" class="[stop-color:var(--accent,#2f5bff)]"/></linearGradient></defs>
        <path d="M22 70V60a38 38 0 0 1 76 0v10" fill="none" stroke="url(#tilt-g)" stroke-width="7" stroke-linecap="round"/>
        <rect x="14" y="64" width="22" height="36" rx="8" fill="currentColor"/>
        <rect x="84" y="64" width="22" height="36" rx="8" fill="currentColor"/>
      </svg>
    </div>
    <div class="p-4">
      <h3 class="mb-1 text-base font-semibold leading-snug">Auriculares Aura 2</h3>
      <p class="mb-3 text-muted">Cancelación de ruido, 40 h de batería</p>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <p class="m-0 text-xl font-bold tabular-nums">149 €</p>
        <button type="button" class="cursor-pointer rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Añadir al carrito</button>
      </div>
    </div>
  </article>
</main>
<script>
  const card = document.getElementById('tilt');
  card.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    card.style.transition = 'none';
    card.style.setProperty('--ry', `${(x - 0.5) * 16}deg`);
    card.style.setProperty('--rx', `${(0.5 - y) * 14}deg`);
    card.style.setProperty('--gx', `${x * 100}%`);
    card.style.setProperty('--gy', `${y * 100}%`);
  });
  card.addEventListener('pointerleave', () => {
    card.style.transition = '';
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
  });
</script>
