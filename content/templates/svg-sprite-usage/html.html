<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite SVG</title>
<style>
  :root { --ink:#17130f; --paper:#f6f1e7; --surface:#fffdf8; --muted:#6b6258; --accent:#ff5a36; --info:#3b5bfd; --ok:#1f9d55; --err:#d6293e; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px 14px; font:14px/1.4 system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  h2 { margin:0 0 6px; font-size:.8rem; font-family:ui-monospace, monospace; color:var(--muted); font-weight:600; }
  section { margin-bottom:12px; }
  .i { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .tile { display:grid; place-items:center; width:44px; height:44px; background:var(--surface); border:2px solid var(--ink); border-radius:10px; box-shadow:3px 3px 0 var(--ink); }
  .tile .i { width:24px; height:24px; }
  .sz { align-items:flex-end; gap:12px; }
  .sz .i { display:block; }
  .sz .a { color:var(--ink); } .sz .b { color:var(--accent); } .sz .c { color:var(--info); } .sz .d { color:var(--ok); } .sz .e { color:var(--err); }
  pre { margin:0; padding:10px 12px; overflow:auto; font:12px/1.5 ui-monospace, monospace; color:var(--paper); background:var(--ink); border-radius:10px; box-shadow:4px 4px 0 var(--accent); }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  </svg>

  <section>
    <h2>Seis iconos, un solo sprite</h2>
    <div class="row">
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg></span>
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg></span>
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg></span>
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg></span>
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-heart"/></svg></span>
      <span class="tile"><svg class="i" aria-hidden="true"><use href="#i-mail"/></svg></span>
    </div>
  </section>

  <section>
    <h2>Tamaño y color con CSS</h2>
    <div class="row sz">
      <svg class="i a" width="16" height="16" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="i b" width="24" height="24" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="i c" width="32" height="32" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="i d" width="40" height="40" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="i e" width="48" height="48" aria-hidden="true"><use href="#i-heart"/></svg>
    </div>
  </section>

  <pre><code>&lt;svg class="i" width="24" height="24" aria-hidden="true"&gt;
  &lt;use href="#i-heart"/&gt;
&lt;/svg&gt;</code></pre>
</body>
</html>
