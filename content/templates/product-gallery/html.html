<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .gallery{max-width:520px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  figure{position:relative;margin:0}
  .stage{display:grid;place-items:center;aspect-ratio:4/3;border:1px solid var(--border);border-radius:var(--radius);background:var(--accent-soft)}
  .stage svg,.thumb svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
  .stage svg{width:62%;height:auto;color:var(--accent);transition:opacity .14s}
  .stage[data-t="1"]{background:var(--info-soft)} .stage[data-t="2"]{background:var(--ok-soft)} .stage[data-t="3"]{background:var(--warn-soft)}
  figcaption{margin-top:8px;color:var(--muted);font-variant-numeric:tabular-nums}
  .nav{position:absolute;top:calc(50% - 20px);width:36px;height:36px;display:grid;place-items:center;padding:0;font:inherit;font-size:18px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow);cursor:pointer;transition:background .14s}
  .nav:hover{background:var(--accent-soft)}
  .prev{left:8px}.next{right:8px}
  .thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
  .thumb{display:grid;place-items:center;aspect-ratio:1;padding:6px;color:var(--accent);background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(var(--border),var(--border)) border-box;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;transition:background .14s}
  .thumb:hover{background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(var(--border),var(--border)) border-box}
  .thumb[aria-current=true]{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box}
  .thumb svg{width:100%;height:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" hidden aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
  <symbol id="s0" viewBox="0 0 100 100"><rect x="38" y="6" width="24" height="24" rx="6"/><rect x="38" y="70" width="24" height="24" rx="6"/><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="20"/><path d="M50 50V37M50 50l9 5"/></symbol>
  <symbol id="s1" viewBox="0 0 100 100"><rect x="34" y="28" width="32" height="44" rx="8"/><rect x="66" y="45" width="7" height="10" rx="2"/><path d="M42 28L46 8h8l4 20M42 72l4 20h8l4-20"/></symbol>
  <symbol id="s2" viewBox="0 0 100 100"><rect x="34" y="6" width="32" height="88" rx="14"/><circle cx="50" cy="30" r="2.5"/><circle cx="50" cy="42" r="2.5"/><circle cx="50" cy="54" r="2.5"/><circle cx="50" cy="66" r="2.5"/></symbol>
  <symbol id="s3" viewBox="0 0 100 100"><rect x="14" y="34" width="72" height="42" rx="6"/><path d="M14 48h72"/><circle cx="50" cy="62" r="6"/></symbol>
</svg>
<section class="gallery" aria-roledescription="galería" aria-label="Reloj Orbit S2">
  <figure>
    <div class="stage" id="stage"><svg id="main" aria-hidden="true" viewBox="0 0 100 100"><use href="#s0"/></svg></div>
    <button class="nav prev" type="button" aria-label="Imagen anterior">&lsaquo;</button>
    <button class="nav next" type="button" aria-label="Imagen siguiente">&rsaquo;</button>
    <figcaption id="cap" aria-live="polite"></figcaption>
  </figure>
  <div class="thumbs" id="thumbs" role="group" aria-label="Miniaturas. Usa las flechas para cambiar de imagen."></div>
</section>
<script>
  const VIEWS = ['Frontal', 'Perfil', 'Correa', 'Caja'], n = VIEWS.length;
  const $ = (id) => document.getElementById(id), gallery = document.querySelector('.gallery');
  $('thumbs').innerHTML = VIEWS.map((v, i) => `<button class="thumb" type="button" aria-label="${v}, imagen ${i + 1} de ${n}"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#s${i}"/></svg></button>`).join('');
  const thumbs = [...$('thumbs').children];
  function show(i, focus) {
    i = (i + n) % n;
    $('main').firstElementChild.setAttribute('href', '#s' + i);
    $('stage').dataset.t = i;
    $('cap').textContent = `${VIEWS[i]} (${i + 1} de ${n})`;
    thumbs.forEach((t, j) => { t.setAttribute('aria-current', j === i); t.tabIndex = j === i ? 0 : -1; });
    if (focus) thumbs[i].focus();
    gallery.dataset.i = i;
  }
  $('thumbs').addEventListener('click', (e) => { const t = e.target.closest('.thumb'); if (t) show(thumbs.indexOf(t)); });
  gallery.addEventListener('keydown', (e) => {
    const i = +gallery.dataset.i, d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (e.target.closest('#thumbs') && (d || e.key === 'Home' || e.key === 'End')) {
      e.preventDefault(); show(e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : i + d, true);
    }
  });
  gallery.querySelector('.prev').onclick = () => show(+gallery.dataset.i - 1);
  gallery.querySelector('.next').onclick = () => show(+gallery.dataset.i + 1);
  show(0);
</script>
</body>
</html>
