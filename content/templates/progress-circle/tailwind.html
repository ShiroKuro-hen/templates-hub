<div class="bg-page p-5 text-sm text-fg">
  <svg width="0" height="0" aria-hidden="true" class="absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs></svg>
  <section aria-labelledby="t" class="mx-auto max-w-2xl rounded-lg border border-line bg-surface shadow-sm">
    <h2 id="t" class="m-0 border-b border-line px-5 py-4 text-base font-semibold">Estado del espacio de trabajo</h2>
    <div class="grid grid-cols-[repeat(auto-fit,minmax(150px,1fr))] gap-x-4 gap-y-6 px-5 py-6 text-center">
      <figure class="m-0">
        <div id="d" role="progressbar" aria-labelledby="l1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" class="relative mx-auto size-28">
          <svg viewBox="0 0 120 120" aria-hidden="true" class="block size-full -rotate-90 fill-none [stroke-width:9]">
            <circle cx="60" cy="60" r="52" class="stroke-line"/>
            <circle id="c" cx="60" cy="60" r="52" pathLength="100" stroke="url(#g)" stroke-linecap="round" style="stroke-dasharray:72 100;transition:stroke-dasharray .6s"/>
          </svg>
          <span class="absolute inset-0 grid place-content-center text-2xl font-semibold tabular-nums" aria-hidden="true"><span><output id="o">72</output><small class="ml-px text-sm font-normal text-muted">%</small></span></span>
        </div>
        <figcaption id="l1" class="mt-3 font-semibold">Migración de datos<small class="block font-normal tabular-nums text-muted">18 de 25 tablas</small></figcaption>
      </figure>
      <figure class="m-0">
        <div role="progressbar" aria-labelledby="l2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45" class="relative mx-auto size-28">
          <svg viewBox="0 0 120 120" aria-hidden="true" class="block size-full -rotate-90 fill-none [stroke-width:9]">
            <circle cx="60" cy="60" r="52" class="stroke-line"/>
            <circle cx="60" cy="60" r="52" pathLength="100" stroke="url(#g)" stroke-linecap="round" style="stroke-dasharray:45 100"/>
          </svg>
          <span class="absolute inset-0 grid place-content-center text-2xl font-semibold tabular-nums" aria-hidden="true"><span>45<small class="ml-px text-sm font-normal text-muted">%</small></span></span>
        </div>
        <figcaption id="l2" class="mt-3 font-semibold">Tareas completadas<small class="block font-normal tabular-nums text-muted">27 de 60 tareas</small></figcaption>
      </figure>
      <figure class="m-0">
        <div role="progressbar" aria-labelledby="l3" aria-valuemin="0" aria-valuemax="100" aria-valuenow="94" class="relative mx-auto size-28">
          <svg viewBox="0 0 120 120" aria-hidden="true" class="block size-full -rotate-90 fill-none [stroke-width:9]">
            <circle cx="60" cy="60" r="52" class="stroke-line"/>
            <circle cx="60" cy="60" r="52" pathLength="100" stroke-linecap="round" class="stroke-err" style="stroke-dasharray:94 100"/>
          </svg>
          <span class="absolute inset-0 grid place-content-center text-2xl font-semibold tabular-nums" aria-hidden="true"><span>94<small class="ml-px text-sm font-normal text-muted">%</small></span></span>
        </div>
        <figcaption id="l3" class="mt-3 font-semibold">Cuota de API<small class="block font-normal text-muted">Cerca del límite</small></figcaption>
      </figure>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 border-t border-line px-5 py-3.5">
      <label for="s" class="font-semibold">Simular avance de la migración</label>
      <input id="s" type="range" min="0" max="100" value="72" class="min-w-36 flex-1 accent-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    </div>
  </section>
</div>
<script>
  const d = document.getElementById('d'), s = document.getElementById('s'), o = document.getElementById('o'), c = document.getElementById('c');
  s.addEventListener('input', () => {
    c.style.strokeDasharray = s.value + ' 100';
    d.setAttribute('aria-valuenow', s.value);
    o.textContent = s.value;
  });
</script>
