<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0;padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px 16px;padding:24px 20px}
  .ring{text-align:center}
  .dial{position:relative;width:112px;height:112px;margin:0 auto}
  .dial svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
  circle{fill:none;stroke-width:9}
  .track{stroke:var(--border)}
  .fill{stroke:url(#g);stroke-linecap:round;stroke-dasharray:var(--p) 100;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1);animation:fill .9s cubic-bezier(.2,.8,.2,1)}
  .crit .fill{stroke:var(--err)}
  @keyframes fill{from{stroke-dasharray:0 100}}
  .val{position:absolute;inset:0;display:grid;place-content:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .val small{margin-left:1px;color:var(--muted);font-size:13px;font-weight:400}
  figcaption{margin-top:12px;font-weight:600}
  figcaption small{display:block;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 20px;border-top:1px solid var(--border)}
  .ctl label{font-weight:600}
  .ctl input{flex:1;min-width:140px;accent-color:var(--accent)}
  .ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.fill{animation:none;transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs></svg>
<section class="card" aria-labelledby="t">
  <h2 id="t">Estado del espacio de trabajo</h2>
  <div class="grid">
    <figure class="ring" style="margin:0">
      <div class="dial" id="d" style="--p:72" role="progressbar" aria-labelledby="l1" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52" pathLength="100"/></svg>
        <span class="val" aria-hidden="true"><span><output id="o">72</output><small>%</small></span></span>
      </div>
      <figcaption id="l1">Migración de datos<small>18 de 25 tablas</small></figcaption>
    </figure>
    <figure class="ring" style="margin:0">
      <div class="dial" style="--p:45" role="progressbar" aria-labelledby="l2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52" pathLength="100"/></svg>
        <span class="val" aria-hidden="true"><span>45<small>%</small></span></span>
      </div>
      <figcaption id="l2">Tareas completadas<small>27 de 60 tareas</small></figcaption>
    </figure>
    <figure class="ring" style="margin:0">
      <div class="dial crit" style="--p:94" role="progressbar" aria-labelledby="l3" aria-valuemin="0" aria-valuemax="100" aria-valuenow="94">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" cx="60" cy="60" r="52" pathLength="100"/></svg>
        <span class="val" aria-hidden="true"><span>94<small>%</small></span></span>
      </div>
      <figcaption id="l3">Cuota de API<small>Cerca del límite</small></figcaption>
    </figure>
  </div>
  <div class="ctl"><label for="s">Simular avance de la migración</label><input id="s" type="range" min="0" max="100" value="72"></div>
</section>
<script>
  const d = document.getElementById('d'), s = document.getElementById('s'), o = document.getElementById('o');
  s.addEventListener('input', () => {
    d.style.setProperty('--p', s.value);
    d.setAttribute('aria-valuenow', s.value);
    o.textContent = s.value;
    d.classList.toggle('crit', s.value > 90);
  });
</script>
</body>
</html>
