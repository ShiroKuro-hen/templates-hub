<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estilos de encabezados</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .doc{max-width:60ch;margin:0 auto;font-size:16px;line-height:1.6}
  .doc h1,.doc h2,.doc h3,.doc h4,.doc h5,.doc h6{margin:1.4em 0 .35em;line-height:1.2;text-wrap:balance}
  .doc>:first-child{margin-top:0}
  .eyebrow{display:inline-block;margin:0 0 12px;padding:2px 10px;font-weight:600;font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:999px}
  h1{font-size:clamp(2rem,1.4rem + 3vw,2.9rem);font-weight:700;letter-spacing:-.025em;line-height:1.08}
  h1+.lead{margin:.5em 0 0;font-size:1.2rem;color:var(--muted);max-width:46ch}
  h2{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
  h3{display:flex;align-items:center;gap:.5em;font-size:1.35rem;font-weight:650;letter-spacing:-.015em}
  h3::before{content:"";flex:none;width:.5em;height:.5em;border-radius:2px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  h4{font-size:1.1rem;font-weight:600}
  h5{font-size:1rem;font-weight:600;color:var(--muted)}
  h6{font-size:.875rem;font-weight:500;color:var(--muted)}
  p{margin:.6em 0}
  code{padding:.1em .4em;font:.88em ui-monospace,"Cascadia Code",Menlo,monospace;background:var(--surface);border:1px solid var(--border);border-radius:6px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
  <article class="doc">
    <p class="eyebrow">Guía de marca</p>
    <h1>Cómo escribimos para la web</h1>
    <p class="lead">Una jerarquía clara ayuda a leer, a escanear y a navegar con lector de pantalla.</p>
    <h2>Estructura de la página</h2>
    <p>Usa un solo <code>h1</code> por página y no saltes niveles.</p>
    <h3>Secciones principales</h3>
    <h4>Subsecciones</h4>
    <h5>Detalle de apoyo</h5>
    <h6>Nota al pie de sección</h6>
  </article>
</body>
</html>
