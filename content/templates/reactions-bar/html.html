<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .msg{display:flex;gap:12px;max-width:520px;margin:0 auto;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .av{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
  .body{flex:1;min-width:0}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  time{font-size:12px;color:var(--muted)}
  p{margin:2px 0 10px;overflow-wrap:anywhere}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .bar button,summary{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;font:inherit;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer;list-style:none;transition:background .14s,color .14s}
  summary::-webkit-details-marker{display:none}
  .bar button:hover,summary:hover{background:var(--accent-soft);color:var(--text)}
  .bar button[aria-pressed=true]{color:var(--accent);border-color:transparent;background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box}
  .bar b{font-weight:600;font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  details{position:relative}
  .pick{position:absolute;z-index:2;top:34px;left:0;display:flex;flex-wrap:wrap;gap:2px;width:max-content;max-width:224px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pick button{min-height:32px;padding:0 8px;border-color:transparent;font-size:16px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<article class="msg">
  <span class="av" aria-hidden="true">MQ</span>
  <div class="body">
    <header><strong>Marina Quiroga</strong><time>10:32</time></header>
    <p>Lanzamos la versión 3.2 con las correcciones de accesibilidad. Gracias a todo el equipo.</p>
    <div class="bar" role="group" aria-label="Reacciones al mensaje">
      <span id="chips" style="display:contents"></span>
      <details id="add">
        <summary aria-label="Añadir reacción">+</summary>
        <div class="pick" role="group" aria-label="Elegir emoji"></div>
      </details>
    </div>
    <p class="sr" id="st" role="status"></p>
  </div>
</article>
<script>
  const EMOJIS = ['👍', '❤️', '🎉', '🚀', '👀', '✅', '😄', '🙌'];
  const rx = [{ e: '👍', n: 12, me: true }, { e: '🎉', n: 7, me: false }, { e: '🚀', n: 3, me: false }];
  const chips = document.getElementById('chips'), add = document.getElementById('add'), st = document.getElementById('st');
  const pick = add.querySelector('.pick');
  function render(focus) {
    chips.innerHTML = '';
    rx.forEach((r) => {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.e = r.e;
      b.setAttribute('aria-pressed', r.me); b.setAttribute('aria-label', r.e + ', ' + r.n + (r.n === 1 ? ' reacción' : ' reacciones'));
      b.innerHTML = '<span aria-hidden="true"></span><b aria-hidden="true"></b>';
      b.firstChild.textContent = r.e; b.lastChild.textContent = r.n; chips.append(b);
    });
    if (focus) chips.querySelector('[data-e="' + focus + '"]')?.focus();
  }
  function toggle(e) {
    let r = rx.find((x) => x.e === e);
    if (!r) rx.push((r = { e, n: 0, me: false }));
    r.me = !r.me; r.n += r.me ? 1 : -1;
    if (!r.n) rx.splice(rx.indexOf(r), 1);
    st.textContent = 'Reacción ' + e + (r.me ? ' añadida' : ' quitada');
    render(r.n ? e : null);
  }
  EMOJIS.forEach((e) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.setAttribute('aria-label', 'Reaccionar con ' + e); pick.append(b); });
  chips.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) toggle(b.dataset.e); });
  pick.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { toggle(b.textContent); add.open = false; } });
  add.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { add.open = false; add.querySelector('summary').focus(); } });
  render();
</script>
</body>
</html>
