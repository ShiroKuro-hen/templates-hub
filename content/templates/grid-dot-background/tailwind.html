<style>
  .stage{--line:color-mix(in srgb,var(--accent) 20%,transparent);--dot:color-mix(in srgb,var(--accent) 45%,transparent)}
  .layer{-webkit-mask-image:radial-gradient(ellipse at center,rgb(0 0 0) 25%,transparent 75%);mask-image:radial-gradient(ellipse at center,rgb(0 0 0) 25%,transparent 75%)}
  .layer[data-pattern=dots]{background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.5px);background-size:20px 20px}
  .layer[data-pattern=lines]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
  .layer[data-pattern=diagonal]{background-image:repeating-linear-gradient(45deg,var(--line) 0 1px,transparent 1px 14px)}
  .glow{width:min(100%,480px);aspect-ratio:1;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 18%,transparent),transparent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="mx-auto flex w-fit gap-0.5 rounded-lg border border-line bg-surface p-[3px] shadow-sm mb-4" role="group" aria-label="Patrón de fondo">
  <button type="button" data-pattern="dots" aria-pressed="true" class="cursor-pointer rounded-sm px-3 py-1.5 text-[13px] font-semibold text-muted hover:text-fg aria-pressed:bg-accent-soft aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Puntos</button>
  <button type="button" data-pattern="lines" aria-pressed="false" class="cursor-pointer rounded-sm px-3 py-1.5 text-[13px] font-semibold text-muted hover:text-fg aria-pressed:bg-accent-soft aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Cuadrícula</button>
  <button type="button" data-pattern="diagonal" aria-pressed="false" class="cursor-pointer rounded-sm px-3 py-1.5 text-[13px] font-semibold text-muted hover:text-fg aria-pressed:bg-accent-soft aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Diagonal</button>
</div>
<section class="stage relative isolate mx-auto grid min-h-[280px] max-w-[720px] place-items-center overflow-hidden rounded-lg border border-line bg-surface shadow-sm" aria-labelledby="gdb-title">
  <div class="layer absolute inset-0 pointer-events-none" data-pattern="dots" aria-hidden="true"></div>
  <div class="glow absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full pointer-events-none" aria-hidden="true"></div>
  <div class="content relative mx-auto max-w-[460px] px-6 py-14 text-center">
    <h1 id="gdb-title" class="mb-2.5 text-[clamp(24px,5vw,34px)] font-bold leading-tight tracking-tight text-fg">Lanza tu producto con una base clara</h1>
    <p class="mb-5 text-fg">Plantillas, datos y permisos listos desde el primer día para tu equipo.</p>
    <a href="#" class="cta inline-block rounded-lg border border-accent bg-accent px-[18px] py-2.5 font-semibold text-accent-ink no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Empezar gratis</a>
  </div>
</section>
<script>
  const layer = document.querySelector('.layer');
  document.querySelector('[role=group]').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    layer.dataset.pattern = b.dataset.pattern;
    document.querySelectorAll('[role=group] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
</script>
