<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{margin:0;font-size:16px;font-weight:600}
  .head p{margin:2px 0 0;color:var(--muted)}
  .btn{padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-weight:600;cursor:pointer;transition:border-color .14s,background .14s}
  .btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:0}
  .stat{margin:0;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  dt{color:var(--muted)}
  dd{margin:0}
  .num{margin:6px 0 14px;font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .num small{margin-left:4px;font-size:15px;font-weight:600;color:var(--muted)}
  .meter{height:4px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
  .meter i{display:block;height:100%;width:calc(var(--p) * var(--t, 1) * 1%);border-radius:inherit;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .cap{margin:6px 0 0;color:var(--muted);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="head">
  <div><h1>Resumen del trimestre</h1><p>Las cifras cuentan hasta su valor al entrar en vista.</p></div>
  <button class="btn" id="rep" type="button">Repetir</button>
</div>
<dl class="grid">
  <div class="stat" data-to="128450" style="--p:86"><dt>Usuarios activos</dt><dd class="num"><span class="v">128.450</span></dd><div class="meter" aria-hidden="true"><i></i></div><p class="cap">86 % de la meta anual</p></div>
  <div class="stat" data-to="99.98" data-dec="2" style="--p:100"><dt>Disponibilidad</dt><dd class="num"><span class="v">99,98</span><small>%</small></dd><div class="meter" aria-hidden="true"><i></i></div><p class="cap">Objetivo de servicio cumplido</p></div>
  <div class="stat" data-to="182" style="--p:64"><dt>Latencia mediana</dt><dd class="num"><span class="v">182</span><small>ms</small></dd><div class="meter" aria-hidden="true"><i></i></div><p class="cap">64 % del presupuesto de 285 ms</p></div>
  <div class="stat" data-to="1284560" style="--p:72"><dt>Pedidos procesados</dt><dd class="num"><span class="v">1.284.560</span></dd><div class="meter" aria-hidden="true"><i></i></div><p class="cap">72 % de la capacidad contratada</p></div>
</dl>
<script>
  const cards = [...document.querySelectorAll('.stat')], rep = document.getElementById('rep');
  const fmt = (n, d) => n.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
  function run(el) {
    const v = el.querySelector('.v'), to = +el.dataset.to, d = +(el.dataset.dec || 0), t0 = performance.now();
    cancelAnimationFrame(el.raf);
    (function f(now) {
      const p = Math.min((now - t0) / 1400, 1), e = 1 - (1 - p) ** 3; // ease-out cúbico
      v.textContent = fmt(to * e, d);
      el.style.setProperty('--t', e);
      if (p < 1) el.raf = requestAnimationFrame(f);
    })(t0);
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) rep.hidden = true; // alternativa estática: valores finales
  else {
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { run(e.target); io.unobserve(e.target); }
    }), { threshold: 0.4 });
    cards.forEach((c) => io.observe(c));
    rep.onclick = () => cards.forEach(run);
  }
</script>
</body>
</html>
