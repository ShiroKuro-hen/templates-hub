<svg width="0" height="0" class="absolute" aria-hidden="true">
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></symbol>
</svg>
<section class="mx-auto max-w-2xl rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <h2 id="t" class="mb-1 text-lg font-semibold">Botones con icono</h2>
  <div id="out"></div>
  <p id="msg" role="status" class="mt-4 min-h-5 text-slate-500 dark:text-slate-400">Prueba el aviso y el carrito: los contadores se actualizan.</p>
</section>
<script>
  const BASE = 'group relative inline-flex h-9 cursor-pointer items-center justify-center gap-2 rounded-lg border px-3.5 font-semibold transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500';
  const V = {
    primary: 'border-blue-600 bg-blue-600 text-white hover:brightness-110 dark:border-blue-400 dark:bg-blue-400 dark:text-slate-950',
    secondary: 'border-slate-200 bg-white hover:border-blue-500 hover:bg-blue-50 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800',
    ghost: 'border-transparent hover:bg-blue-50 dark:hover:bg-slate-800',
  };
  const ico = (n, extra = '') => `<svg class="size-[18px] fill-none stroke-current stroke-2 [stroke-linecap:round] [stroke-linejoin:round] transition-transform ${extra}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const btn = (v, inner, attrs = '', icon = false) => `<button type="button" class="${BASE} ${V[v]} ${icon ? 'w-9 px-0' : ''}" ${attrs}>${inner}</button>`;
  const badge = (id, n, hidden) => `<span id="${id}" aria-hidden="true" ${hidden ? 'hidden' : ''} class="absolute -right-1.5 -top-1.5 box-border h-[18px] min-w-[18px] rounded-full bg-rose-600 px-1 text-center text-[11px] font-bold leading-[18px] tabular-nums text-white ring-2 ring-white dark:bg-rose-400 dark:text-slate-950 dark:ring-slate-900">${n}</span>`;
  const H = (s) => `<h3 class="mb-2 mt-5 text-sm font-semibold text-slate-500 dark:text-slate-400">${s}</h3>`;
  const row = (s) => `<div class="flex flex-wrap items-center gap-3">${s}</div>`;
  out.innerHTML =
    H('Icono a la izquierda') + row(btn('primary', ico('download') + 'Descargar informe') + btn('secondary', ico('plus') + 'Nuevo proyecto')) +
    H('Icono a la derecha') + row(btn('primary', 'Continuar' + ico('next', 'group-hover:translate-x-0.5')) + btn('ghost', 'Ver detalles' + ico('next', 'group-hover:translate-x-0.5'))) +
    H('Solo icono, con etiqueta accesible') + row(btn('primary', ico('plus'), 'aria-label="Crear proyecto" title="Crear proyecto"', true) + btn('secondary', ico('download'), 'aria-label="Descargar" title="Descargar"', true) + btn('ghost', ico('next'), 'aria-label="Siguiente" title="Siguiente"', true)) +
    H('Con badge') + row(btn('secondary', ico('bell') + badge('bn', 3), 'id="bell" aria-label="Avisos, 3 sin leer"', true) + btn('secondary', ico('cart') + badge('cn', 0, true), 'id="cart" aria-label="Carrito, 0 productos"', true) + btn('secondary', ico('plus') + 'Añadir al carrito', 'id="add"'));
  let items = 0;
  const say = (t) => (msg.textContent = t);
  bell.addEventListener('click', () => { bn.hidden = true; bell.setAttribute('aria-label', 'Avisos, sin pendientes'); say('Avisos marcados como leídos.'); });
  add.addEventListener('click', () => {
    items++; cn.hidden = false; cn.textContent = items;
    cart.setAttribute('aria-label', `Carrito, ${items} ${items === 1 ? 'producto' : 'productos'}`);
    say(`Producto añadido. Tienes ${items} en el carrito.`);
  });
</script>
