<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:680px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--border)}
  ul{list-style:none;margin:0;padding:0}
  .item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:0}
  .title{font-weight:500}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px}
  .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
  .pri{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--text);background:var(--soft);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:999px}
  .pri svg{color:var(--c)}
  .pri.alta{--c:var(--err);--soft:var(--err-soft)}
  .pri.media{--c:var(--warn);--soft:var(--warn-soft)}
  .pri.baja{--c:var(--info);--soft:var(--info-soft)}
  .pri.media rect:nth-child(3),.pri.baja rect:nth-child(n+2){opacity:.25}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<section class="card" aria-labelledby="sprint">
  <h2 id="sprint">Tareas del sprint</h2>
  <ul>
    <li class="item">
      <div><span class="title">Corregir pago duplicado en el checkout</span>
        <ul class="tags" aria-label="Etiquetas"><li class="tag" style="--c:var(--accent)">Backend</li></ul></div>
      <span class="pri alta"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect y="8" width="3" height="4" rx=".5"/><rect x="4.5" y="5" width="3" height="7" rx=".5"/><rect x="9" y="2" width="3" height="10" rx=".5"/></svg><span class="sr">Prioridad </span>Alta</span>
    </li>
    <li class="item">
      <div><span class="title">Revisar textos del onboarding</span>
        <ul class="tags" aria-label="Etiquetas"><li class="tag" style="--c:var(--ok)">Diseño</li><li class="tag" style="--c:var(--info)">Documentación</li></ul></div>
      <span class="pri media"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect y="8" width="3" height="4" rx=".5"/><rect x="4.5" y="5" width="3" height="7" rx=".5"/><rect x="9" y="2" width="3" height="10" rx=".5"/></svg><span class="sr">Prioridad </span>Media</span>
    </li>
    <li class="item">
      <div><span class="title">Actualizar dependencias de pruebas</span>
        <ul class="tags" aria-label="Etiquetas"><li class="tag" style="--c:var(--warn)">Infraestructura</li></ul></div>
      <span class="pri baja"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect y="8" width="3" height="4" rx=".5"/><rect x="4.5" y="5" width="3" height="7" rx=".5"/><rect x="9" y="2" width="3" height="10" rx=".5"/></svg><span class="sr">Prioridad </span>Baja</span>
    </li>
  </ul>
</section>
</body>
</html>
