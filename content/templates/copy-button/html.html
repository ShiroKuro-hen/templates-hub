<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:560px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0;font-size:15px;font-weight:600}
  .card > p{margin:2px 0 12px;color:var(--muted)}
  .code{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
  .code::before{content:"$";font:600 13px/1.6 ui-monospace,"Cascadia Code",Menlo,monospace;background:linear-gradient(135deg,#22d3ee,#2f5bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  pre{flex:1;min-width:0;margin:0;overflow-x:auto;font:13px/1.6 ui-monospace,"Cascadia Code",Menlo,monospace}
  .copy{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;font-weight:500;cursor:pointer;transition:border-color .14s,color .14s}
  .copy:hover{border-color:var(--muted)}
  .copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .copy .check,.copy.done .icon{display:none}
  .copy.done .check{display:block}
  .copy.done{color:var(--ok);border-color:var(--ok)}
  .msg{margin:8px 0 0;font-size:13px;color:var(--err)}
  .msg:empty{display:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h2 id="t">Instala la CLI de Ion</h2>
  <p>Requiere Node 18 o superior.</p>
  <div class="code">
    <pre><code id="cmd">npm install -g @ion/cli</code></pre>
    <button class="copy" id="copy" type="button" aria-label="Copiar comando">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      <svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
      <span id="label" aria-hidden="true">Copiar</span>
    </button>
  </div>
  <p class="msg" id="msg"></p>
  <span class="sr" id="live" role="status"></span>
</section>
<script>
  const btn = document.getElementById('copy'), cmd = document.getElementById('cmd');
  const label = document.getElementById('label'), msg = document.getElementById('msg'), live = document.getElementById('live');
  let timer;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(cmd.textContent);
      msg.textContent = ''; live.textContent = 'Comando copiado al portapapeles.';
      btn.classList.add('done'); label.textContent = 'Copiado';
      clearTimeout(timer);
      timer = setTimeout(() => { btn.classList.remove('done'); label.textContent = 'Copiar'; live.textContent = ''; }, 2000);
    } catch {
      getSelection().selectAllChildren(cmd);
      msg.textContent = 'No se pudo copiar. El comando quedó seleccionado: pulsa Ctrl+C.';
    }
  });
</script>
</body>
</html>
