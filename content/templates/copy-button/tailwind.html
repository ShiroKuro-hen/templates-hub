<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <section aria-labelledby="t" class="max-w-xl rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 id="t" class="text-[15px] font-semibold">Instala la CLI de Ion</h2>
    <p class="mb-3 mt-0.5 text-slate-500 dark:text-slate-400">Requiere Node 18 o superior.</p>
    <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 py-1.5 pl-3.5 pr-1.5 dark:border-slate-700 dark:bg-slate-950">
      <span aria-hidden="true" class="bg-gradient-to-br from-cyan-400 to-blue-600 bg-clip-text font-mono text-[13px] font-semibold text-transparent">$</span>
      <pre class="min-w-0 flex-1 overflow-x-auto font-mono text-[13px] leading-relaxed"><code id="cmd">npm install -g @ion/cli</code></pre>
      <button id="copy" type="button" aria-label="Copiar comando"
              class="group inline-flex h-8 flex-none items-center gap-1.5 rounded-md border border-slate-200 bg-white px-3 font-medium transition-colors hover:border-slate-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 data-[done]:border-emerald-600 data-[done]:text-emerald-700 dark:border-slate-700 dark:bg-slate-900 dark:data-[done]:border-emerald-400 dark:data-[done]:text-emerald-400">
        <svg class="group-data-[done]:hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
        <svg class="hidden group-data-[done]:block" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
        <span id="label" aria-hidden="true">Copiar</span>
      </button>
    </div>
    <p id="msg" class="mt-2 text-[13px] text-rose-600 empty:hidden dark:text-rose-400"></p>
    <span id="live" role="status" class="sr-only"></span>
  </section>
</div>
<script>
  const btn = document.getElementById('copy'), cmd = document.getElementById('cmd');
  const label = document.getElementById('label'), msg = document.getElementById('msg'), live = document.getElementById('live');
  let timer;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(cmd.textContent);
      msg.textContent = ''; live.textContent = 'Comando copiado al portapapeles.';
      btn.dataset.done = ''; label.textContent = 'Copiado';
      clearTimeout(timer);
      timer = setTimeout(() => { delete btn.dataset.done; label.textContent = 'Copiar'; live.textContent = ''; }, 2000);
    } catch {
      getSelection().selectAllChildren(cmd);
      msg.textContent = 'No se pudo copiar. El comando quedó seleccionado: pulsa Ctrl+C.';
    }
  });
</script>
