<ul id="list" class="mx-auto m-0 flex max-w-xl list-none flex-col gap-2 p-0 text-sm text-slate-900 dark:text-slate-100">
  <li class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <span class="flex-1 truncate">propuesta-v3.pdf</span>
    <button type="button" class="del rounded-lg border border-slate-200 bg-white px-3 py-1 font-semibold hover:border-red-500 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:hover:text-red-400">Eliminar</button>
  </li>
  <li class="flex items-center gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <span class="flex-1 truncate">logo-final.svg</span>
    <button type="button" class="del rounded-lg border border-slate-200 bg-white px-3 py-1 font-semibold hover:border-red-500 hover:text-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:hover:text-red-400">Eliminar</button>
  </li>
</ul>

<div id="snack" role="status" hidden
     class="fixed inset-x-3 bottom-3 mx-auto max-w-md items-center gap-3 overflow-hidden rounded-lg bg-slate-900 py-3 pr-3 pb-4 pl-4 text-slate-100 shadow-sm dark:bg-slate-100 dark:text-slate-900 [&:not([hidden])]:flex">
  <p id="msg" class="m-0 flex-1 text-sm"></p>
  <button type="button" id="undo" class="rounded-lg border border-current px-3 py-1 text-sm font-semibold hover:bg-white hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-900 dark:hover:text-slate-100">Deshacer</button>
  <i id="bar" class="absolute bottom-0 left-0 h-[3px] w-full origin-left bg-gradient-to-r from-cyan-400 to-blue-600 motion-reduce:hidden"></i>
</div>

<script>
  const list = document.getElementById('list'), snack = document.getElementById('snack'), bar = document.getElementById('bar');
  let pending, timer;
  const finish = () => { clearTimeout(timer); snack.hidden = true; pending = null; };
  list.addEventListener('click', (e) => {
    const b = e.target.closest('.del'); if (!b) return;
    if (pending) finish();
    const li = b.closest('li');
    pending = { li, next: li.nextElementSibling };
    li.remove();
    document.getElementById('msg').textContent = '«' + li.firstElementChild.textContent + '» eliminado';
    snack.hidden = false;
    bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; void bar.offsetWidth;
    bar.style.transition = 'transform 6s linear'; bar.style.transform = 'scaleX(0)';
    timer = setTimeout(finish, 6000);
    document.getElementById('undo').focus();
  });
  document.getElementById('undo').addEventListener('click', () => {
    list.insertBefore(pending.li, pending.next);
    pending.li.querySelector('.del').focus();
    finish();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && pending) finish(); });
</script>
