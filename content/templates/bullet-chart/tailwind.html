<svg width="0" height="0" class="absolute" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs></svg>
<section class="group rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm" aria-labelledby="t">
  <div class="mb-5 flex flex-wrap items-start justify-between gap-3">
    <div>
      <h2 id="t" class="m-0 text-base font-semibold">Objetivos del trimestre</h2>
      <p class="mt-0.5 text-muted">Valor actual frente a la meta, con rangos de desempeño.</p>
    </div>
    <label class="flex cursor-pointer items-center gap-2 text-muted has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-4 has-[:focus-visible]:outline-accent">
      <input type="checkbox" id="rg" checked class="m-0 accent-accent">Mostrar rangos
    </label>
  </div>
  <ul id="ls" class="m-0 grid list-none gap-5 p-0"></ul>
  <p class="mb-0 mt-5 flex flex-wrap gap-x-5 gap-y-2 border-t border-line pt-3 text-[13px] text-muted" aria-hidden="true">
    <span class="inline-flex items-center gap-2"><i class="h-2.5 w-5 rounded-sm bg-muted/40"></i>Bajo</span>
    <span class="inline-flex items-center gap-2"><i class="h-2.5 w-5 rounded-sm bg-muted/25"></i>Medio</span>
    <span class="inline-flex items-center gap-2"><i class="h-2.5 w-5 rounded-sm bg-muted/10"></i>Alto</span>
    <span class="inline-flex items-center gap-2"><i class="h-2.5 w-5 rounded-sm bg-accent"></i>Valor</span>
    <span class="inline-flex items-center gap-2"><i class="h-4 w-[3px] bg-fg"></i>Objetivo</span>
  </p>
</section>
<script>
  const kpis = [
    { n: 'Ingresos', u: 'miles USD', v: 270, t: 250, r: [150, 210, 300] },
    { n: 'Clientes nuevos', u: 'altas', v: 182, t: 220, r: [120, 180, 260] },
    { n: 'Satisfacción', u: 'NPS', v: 61, t: 55, r: [35, 50, 80] },
    { n: 'Retención', u: '%', v: 91, t: 94, r: [80, 90, 100] },
  ];
  const f = (n) => n.toLocaleString('es');
  const dot = { ok: 'bg-ok', warn: 'bg-warn', err: 'bg-err' };
  const bg = { ok: 'bg-ok-soft', warn: 'bg-warn-soft', err: 'bg-err-soft' };
  const band = (o) => `group-has-[#rg:not(:checked)]:fill-transparent ${o}`;
  ls.innerHTML = kpis.map((k) => {
    const max = k.r[2], p = (x) => (x / max * 100).toFixed(2) + '%', pct = Math.round(k.v / k.t * 100);
    const [cls, txt] = k.v >= k.t ? ['ok', 'Objetivo superado'] : k.v >= k.t * 0.9 ? ['warn', 'Cerca del objetivo'] : ['err', 'Por debajo'];
    const aria = `${k.n}: ${f(k.v)} ${k.u}, objetivo ${f(k.t)}, ${pct} % del objetivo. ${txt}.`;
    return `<li><div class="mb-1.5 flex flex-wrap items-baseline justify-between gap-x-3"><span class="font-semibold">${k.n}<small class="ml-2 font-normal text-muted">${k.u}</small></span>
      <span class="tabular-nums text-muted"><b class="text-base text-fg">${f(k.v)}</b> de ${f(k.t)}<span class="ml-2 inline-flex items-center gap-1.5 rounded-full px-2.5 text-xs text-fg ${bg[cls]}"><i class="size-1.5 rounded-full ${dot[cls]}"></i>${txt}, ${pct} %</span></span></div>
      <svg class="block h-7 w-full overflow-hidden rounded-sm" role="img" aria-label="${aria}"><rect class="${band('fill-muted/10')}" width="100%" height="28"/><rect class="${band('fill-muted/25')}" width="${p(k.r[1])}" height="28"/><rect class="${band('fill-muted/40')}" width="${p(k.r[0])}" height="28"/>
      <rect class="${k.v >= k.t ? '' : 'fill-accent'}" ${k.v >= k.t ? 'fill="url(#g)"' : ''} y="10" width="${p(k.v)}" height="8" rx="2"/><line class="stroke-fg" stroke-width="3" x1="${p(k.t)}" x2="${p(k.t)}" y1="4" y2="24"/></svg></li>`;
  }).join('');
</script>
