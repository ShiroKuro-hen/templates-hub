<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .dr{max-width:640px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  form{display:grid;gap:12px;padding:16px;border-bottom:1px solid var(--border)}
  .pres{display:flex;flex-wrap:wrap;gap:8px}
  button{display:inline-flex;align-items:center;gap:6px;font:inherit;padding:5px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:border-color .14s,background .14s}
  button:hover{border-color:var(--accent)}
  button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  button[aria-pressed=true]::before{content:"";width:8px;height:8px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:grid;gap:4px;font-weight:600}
  input{font:inherit;font-weight:400;color:var(--text);color-scheme:light;min-width:0;padding:7px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  :root[data-theme=dark] input{color-scheme:dark}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .err{margin:0;padding:8px 12px;color:var(--err);background:var(--err-soft);border-radius:var(--radius)}
  .err[hidden]{display:none}
  h2{display:flex;justify-content:space-between;gap:12px;margin:0;padding:12px 16px;font-size:14px;font-variant-numeric:tabular-nums}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--border)}
  li small{display:block;color:var(--muted)}
  li output{font-variant-numeric:tabular-nums}
  li.empty{display:block;padding:24px 16px;text-align:center;color:var(--muted)}
  @media (max-width:420px){.dates{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="dr">
  <form aria-label="Rango de fechas" onsubmit="return false">
    <div class="pres" role="group" aria-label="Rangos rápidos">
      <button type="button" data-p="7">Últimos 7 días</button>
      <button type="button" data-p="30">Últimos 30 días</button>
      <button type="button" data-p="90">Últimos 90 días</button>
      <button type="button" data-p="year">Este año</button>
      <button type="button" data-p="all">Todo</button>
    </div>
    <div class="dates">
      <label>Desde<input type="date" id="a"></label>
      <label>Hasta<input type="date" id="b"></label>
    </div>
    <p class="err" id="e" role="alert" hidden>La fecha final es anterior a la inicial. Cambia «Hasta» o elige un rango rápido.</p>
  </form>
  <h2 aria-live="polite"><span id="n"></span><span id="sum"></span></h2>
  <ul id="list"></ul>
</div>
<script>
  const iso = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const ago = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return iso(d); };
  const items = [['Suscripción Pro', 49, 1], ['Licencias adicionales', 180, 4], ['Soporte premium', 320, 9], ['Dominio renovado', 18, 17],
    ['Almacenamiento extra', 75, 26], ['Suscripción Pro', 49, 31], ['Capacitación del equipo', 640, 62], ['Licencias adicionales', 180, 120]]
    .map(([n, m, o]) => ({ n, m, f: ago(o) }));
  const range = (p) => p === 'all' ? ['', ''] : p === 'year' ? [today.getFullYear() + '-01-01', iso(today)] : [ago(+p), iso(today)];
  const a = document.getElementById('a'), b = document.getElementById('b'), list = document.getElementById('list');
  const money = (v) => v.toLocaleString('es', { style: 'currency', currency: 'USD' });
  const date = (d) => new Date(d + 'T00:00').toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
  function render() {
    const bad = a.value && b.value && a.value > b.value;
    document.getElementById('e').hidden = !bad;
    const hits = bad ? [] : items.filter((i) => (!a.value || i.f >= a.value) && (!b.value || i.f <= b.value));
    document.getElementById('n').textContent = `${hits.length} movimientos`;
    document.getElementById('sum').textContent = money(hits.reduce((s, i) => s + i.m, 0));
    list.innerHTML = hits.length ? hits.map((i) => `<li><span>${i.n}<small><time datetime="${i.f}">${date(i.f)}</time></small></span><output>${money(i.m)}</output></li>`).join('')
      : '<li class="empty">No hay movimientos en este rango. Amplía las fechas o elige «Todo».</li>';
    document.querySelectorAll('[data-p]').forEach((x) => x.setAttribute('aria-pressed', String(range(x.dataset.p).join() === [a.value, b.value].join())));
  }
  document.querySelector('.pres').addEventListener('click', (e) => {
    const p = e.target.closest('[data-p]'); if (!p) return;
    [a.value, b.value] = range(p.dataset.p); render();
  });
  [a, b].forEach((x) => x.addEventListener('input', render));
  a.max = b.max = iso(today);
  [a.value, b.value] = range('30'); render();
</script>
</body>
</html>
