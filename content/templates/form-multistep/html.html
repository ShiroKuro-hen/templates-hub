<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  [hidden]{display:none!important}
  .card{max-width:460px;margin:0 auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0;font-size:18px;line-height:1.3}
  .sub{margin:2px 0 14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:6px;margin-bottom:22px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
  .bar i{display:block;height:100%;width:var(--p,33%);border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff);transition:width .16s}
  fieldset{border:0;margin:0;padding:0;min-width:0}
  legend{padding:0;margin-bottom:12px;font-size:16px;font-weight:600}
  .f{display:grid;gap:6px;margin-bottom:14px}
  label{font-weight:600}
  input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;transition:border-color .14s}
  input:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--err)}
  input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
  .chk div{display:flex;gap:8px;align-items:center}
  .chk label{font-weight:400}
  .err{margin:0;color:var(--err);font-size:13px}
  .err:empty{display:none}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 16px;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
  dt{color:var(--muted)} dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .btn{font:inherit;font-weight:600;padding:8px 16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s}
  .btn:hover{background:var(--accent-soft)}
  .btn.pri{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.08)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
<form id="f" novalidate>
  <h1>Crear espacio de trabajo</h1>
  <p class="sub" id="paso" aria-live="polite"></p>
  <div class="bar" id="bar" role="progressbar" aria-label="Progreso del formulario" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33"><i></i></div>
  <fieldset>
    <legend>Tus datos</legend>
    <div class="f"><label for="n">Nombre completo</label><input id="n" name="Nombre" required minlength="2" autocomplete="name" aria-describedby="n-e"><p class="err" id="n-e"></p></div>
    <div class="f"><label for="e">Correo de trabajo</label><input id="e" name="Correo" type="email" required autocomplete="email" aria-describedby="e-e"><p class="err" id="e-e"></p></div>
  </fieldset>
  <fieldset hidden>
    <legend>Tu empresa</legend>
    <div class="f"><label for="c">Nombre de la empresa</label><input id="c" name="Empresa" required minlength="2" autocomplete="organization" aria-describedby="c-e"><p class="err" id="c-e"></p></div>
    <div class="f"><label for="s">Tamaño del equipo</label>
      <select id="s" name="Equipo" required aria-describedby="s-e" data-value-missing="Elige el tamaño de tu equipo.">
        <option value="">Selecciona una opción</option><option>1 a 10 personas</option><option>11 a 50 personas</option><option>Más de 50 personas</option>
      </select><p class="err" id="s-e"></p></div>
  </fieldset>
  <fieldset hidden>
    <legend>Revisa y confirma</legend>
    <dl id="sum"></dl>
    <div class="f chk"><div><input type="checkbox" id="t" required aria-describedby="t-e" data-value-missing="Acepta los términos para crear el espacio."><label for="t">Acepto los términos del servicio</label></div><p class="err" id="t-e"></p></div>
  </fieldset>
  <div class="row"><button type="button" class="btn" id="prev" hidden>Atrás</button><button class="btn pri" id="next">Continuar</button></div>
</form>
</main>
<script>
  const f = document.getElementById('f'), S = [...f.querySelectorAll('fieldset')], $ = (id) => document.getElementById(id);
  const M = { valueMissing: 'Completa este campo.', typeMismatch: 'Escribe un correo válido, como ana@empresa.com.', tooShort: 'Usa al menos 2 caracteres.' };
  let n = 0;
  function show() {
    S.forEach((s, i) => (s.hidden = i !== n));
    const p = ((n + 1) / S.length) * 100;
    $('bar').style.setProperty('--p', p + '%'); $('bar').setAttribute('aria-valuenow', Math.round(p));
    $('paso').textContent = `Paso ${n + 1} de ${S.length}`;
    $('prev').hidden = !n; $('next').textContent = n === S.length - 1 ? 'Crear espacio' : 'Continuar';
    if (n === S.length - 1) $('sum').replaceChildren(...[...f.elements].filter((i) => i.name).flatMap((i) => {
      const a = document.createElement('dt'), b = document.createElement('dd'); a.textContent = i.name; b.textContent = i.value; return [a, b];
    }));
  }
  function valid() {
    let first;
    S[n].querySelectorAll('input,select').forEach((i) => {
      const k = Object.keys(M).find((k) => i.validity[k]);
      i.closest('.f').querySelector('.err').textContent = k ? i.dataset[k] || M[k] : '';
      i.setAttribute('aria-invalid', !!k);
      if (k && !first) first = i;
    });
    first?.focus(); return !first;
  }
  f.onsubmit = (e) => {
    e.preventDefault(); if (!valid()) return;
    if (n < S.length - 1) { n++; show(); S[n].querySelector('input,select').focus(); }
    else f.innerHTML = '<h1>Espacio creado</h1><p class="sub">Revisa tu correo para activar la cuenta.</p>';
  };
  $('prev').onclick = () => { n--; show(); };
  show();
</script>
</body>
</html>
