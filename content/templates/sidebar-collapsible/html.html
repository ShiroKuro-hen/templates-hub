<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú lateral</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .app { display:flex; align-items:flex-start; gap:20px; }
  .side { position:relative; flex:none; width:224px; padding:8px; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); transition:width .16s; }
  .side.collapsed { width:64px; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 4px 8px; }
  .brand { font-weight:700; font-size:1.1rem; letter-spacing:-.01em; white-space:nowrap; }
  .toggle { flex:none; display:grid; place-items:center; width:32px; height:32px; color:var(--muted); background:transparent; border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; transition:color .14s, border-color .14s; }
  .toggle:hover { color:var(--accent); border-color:var(--accent); }
  .toggle svg { transition:transform .16s; }
  .collapsed .toggle svg { transform:rotate(180deg); }
  .collapsed .head { justify-content:center; padding-inline:0; }
  .grp + .grp { margin-top:8px; padding-top:6px; border-top:1px solid var(--border); }
  .sec { margin:4px 10px; font-size:12px; font-weight:600; color:var(--muted); }
  .side ul { display:grid; gap:2px; margin:0; padding:0; list-style:none; }
  .side a { position:relative; display:flex; align-items:center; gap:10px; height:34px; padding:0 10px; color:var(--muted); font-weight:500; white-space:nowrap; text-decoration:none; border-radius:var(--radius); transition:background .14s, color .14s; }
  .side a:hover { color:var(--text); background:var(--bg); }
  .side a[aria-current] { color:var(--accent); background:var(--accent-soft); }
  .side a[aria-current]::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px; border-radius:2px; background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  .ic { flex:none; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .collapsed a { justify-content:center; padding:0; }
  .collapsed .lbl, .collapsed .sec, .collapsed .brand { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  main { flex:1; min-width:0; padding-top:6px; }
  h1 { margin:0 0 4px; font-size:1.5rem; font-weight:600; letter-spacing:-.01em; }
  main p { margin:0; color:var(--muted); }
  @media (prefers-reduced-motion:reduce) { .side, .toggle svg, .side a, .toggle { transition:none; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-panel" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></symbol>
    <symbol id="i-proyectos" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-tareas" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></symbol>
    <symbol id="i-miembros" viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
    <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M13 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0M7 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/></symbol>
  </svg>
  <div class="app">
    <aside class="side" id="side">
      <div class="head">
        <span class="brand">Nexo</span>
        <button class="toggle" id="toggle" type="button" aria-expanded="true" aria-controls="menu" aria-label="Contraer menú">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        </button>
      </div>
      <nav id="menu" aria-label="Lateral">
        <div class="grp">
          <h2 class="sec">Trabajo</h2>
          <ul>
            <li><a href="#" aria-current="page"><svg class="ic" aria-hidden="true"><use href="#i-panel"/></svg><span class="lbl">Panel</span></a></li>
            <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-proyectos"/></svg><span class="lbl">Proyectos</span></a></li>
            <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-tareas"/></svg><span class="lbl">Tareas</span></a></li>
          </ul>
        </div>
        <div class="grp">
          <h2 class="sec">Equipo</h2>
          <ul>
            <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-miembros"/></svg><span class="lbl">Miembros</span></a></li>
            <li><a href="#"><svg class="ic" aria-hidden="true"><use href="#i-ajustes"/></svg><span class="lbl">Ajustes</span></a></li>
          </ul>
        </div>
      </nav>
    </aside>
    <main><h1 id="title">Panel</h1><p>Resumen de tu espacio de trabajo.</p></main>
  </div>
<script>
  const side = document.getElementById('side'), toggle = document.getElementById('toggle'), title = document.getElementById('title');
  const set = (c) => {
    side.classList.toggle('collapsed', c);
    toggle.setAttribute('aria-expanded', !c);
    toggle.setAttribute('aria-label', c ? 'Expandir menú' : 'Contraer menú');
    side.querySelectorAll('nav a').forEach((a) => (c ? (a.title = a.textContent.trim()) : a.removeAttribute('title')));
  };
  toggle.addEventListener('click', () => set(!side.classList.contains('collapsed')));
  side.addEventListener('click', (e) => {
    const a = e.target.closest('nav a'); if (!a) return;
    e.preventDefault();
    side.querySelectorAll('[aria-current]').forEach((x) => x.removeAttribute('aria-current'));
    a.setAttribute('aria-current', 'page');
    title.textContent = a.textContent.trim();
  });
  set(matchMedia('(max-width:520px)').matches);
</script>
</body>
</html>
