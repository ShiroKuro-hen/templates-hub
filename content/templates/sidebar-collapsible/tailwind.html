<div class="flex items-start gap-5 p-3 text-sm text-slate-900 dark:text-slate-100">
  <aside id="side" data-collapsed="false"
    class="group relative w-56 flex-none overflow-hidden rounded-lg border border-slate-200 bg-white p-2 shadow-sm transition-[width] duration-150 data-[collapsed=true]:w-16 motion-reduce:transition-none dark:border-slate-700 dark:bg-slate-900">
    <div class="flex items-center justify-between gap-2 px-1 pb-2 group-data-[collapsed=true]:justify-center group-data-[collapsed=true]:px-0">
      <span class="whitespace-nowrap text-lg font-bold tracking-tight group-data-[collapsed=true]:sr-only">Nexo</span>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="menu" aria-label="Contraer menú"
        class="grid h-8 w-8 flex-none place-items-center rounded-lg border border-slate-200 text-slate-500 hover:border-blue-600 hover:text-blue-600 dark:border-slate-700 dark:text-slate-400 dark:hover:border-blue-500 dark:hover:text-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">
        <svg class="h-[18px] w-[18px] fill-none stroke-current stroke-2 transition-transform group-data-[collapsed=true]:rotate-180" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
    </div>
    <nav id="menu" aria-label="Lateral">
      <h2 class="mx-2.5 my-1 text-xs font-semibold text-slate-500 group-data-[collapsed=true]:sr-only dark:text-slate-400">Trabajo</h2>
      <ul class="m-0 grid list-none gap-0.5 p-0">
        <li><a href="#" aria-current="page" class="flex h-[34px] items-center gap-2.5 whitespace-nowrap rounded-lg bg-blue-50 px-2.5 font-medium text-blue-600 group-data-[collapsed=true]:justify-center group-data-[collapsed=true]:px-0 dark:bg-slate-800 dark:text-blue-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"><svg class="h-[18px] w-[18px] flex-none fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span class="group-data-[collapsed=true]:sr-only">Panel</span></a></li>
        <li><a href="#" class="flex h-[34px] items-center gap-2.5 whitespace-nowrap rounded-lg px-2.5 font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-900 group-data-[collapsed=true]:justify-center group-data-[collapsed=true]:px-0 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"><svg class="h-[18px] w-[18px] flex-none fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="group-data-[collapsed=true]:sr-only">Proyectos</span></a></li>
        <li><a href="#" class="flex h-[34px] items-center gap-2.5 whitespace-nowrap rounded-lg px-2.5 font-medium text-slate-500 hover:bg-slate-100 hover:text-slate-900 group-data-[collapsed=true]:justify-center group-data-[collapsed=true]:px-0 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"><svg class="h-[18px] w-[18px] flex-none fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></svg><span class="group-data-[collapsed=true]:sr-only">Tareas</span></a></li>
      </ul>
    </nav>
  </aside>
  <main class="min-w-0 flex-1 pt-1.5"><h1 class="text-2xl font-semibold tracking-tight">Panel</h1><p class="text-slate-500 dark:text-slate-400">Resumen de tu espacio de trabajo.</p></main>
</div>

<script>
  const side = document.getElementById('side'), toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const c = side.dataset.collapsed !== 'true';
    side.dataset.collapsed = c;
    toggle.setAttribute('aria-expanded', !c);
    toggle.setAttribute('aria-label', c ? 'Expandir menú' : 'Contraer menú');
  });
</script>
