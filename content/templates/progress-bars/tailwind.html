<div class="space-y-3 p-5">
  <div class="grid grid-cols-[110px_1fr_48px] items-center gap-3 font-semibold">
    <label for="a">Diseño</label>
    <progress id="a" max="100" value="88"
      class="h-4 w-full overflow-hidden rounded-full border-2 border-black [&::-webkit-progress-bar]:bg-white [&::-webkit-progress-value]:bg-green-600 [&::-moz-progress-bar]:bg-green-600"></progress>
    <output class="text-right tabular-nums">88%</output>
  </div>
  <div class="grid grid-cols-[110px_1fr_48px] items-center gap-3 font-semibold">
    <label for="b">Pruebas</label>
    <progress id="b" max="100" value="25"
      class="h-4 w-full overflow-hidden rounded-full border-2 border-black [&::-webkit-progress-bar]:bg-white [&::-webkit-progress-value]:bg-red-600 [&::-moz-progress-bar]:bg-red-600"></progress>
    <output class="text-right tabular-nums">25%</output>
  </div>
</div>
