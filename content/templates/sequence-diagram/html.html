<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrama de secuencia</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:440px;margin:0 auto;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0 0 12px;font-size:16px;font-weight:600}
  svg{display:block;width:100%;height:auto}
  text{font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
  .box{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
  .life{stroke:var(--border);stroke-width:1.5;stroke-dasharray:4 4}
  .msg{outline:none}
  .msg text{font-size:12px;fill:var(--muted)}
  .arrow{stroke:var(--text);stroke-width:1.5;marker-end:url(#ah);transition:stroke .14s}
  .reply{stroke:var(--muted);stroke-dasharray:5 4}
  .head{fill:var(--text)}
  .head.hot{fill:var(--accent)}
  .msg.on .arrow{stroke:var(--accent);stroke-width:2;marker-end:url(#ah-hot)}
  .msg.on text{fill:var(--accent);font-weight:600}
  .note{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
  .cap{min-height:3em;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--border);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<figure class="card">
  <h1>Inicio de sesión</h1>
  <svg id="seq" viewBox="0 0 400 450" role="img" aria-labelledby="seq-t seq-d">
    <title id="seq-t">Secuencia de inicio de sesión</title>
    <desc id="seq-d">El usuario envía sus credenciales a la app, que llama a la API. La API consulta la base de datos, valida la contraseña y devuelve un token que permite mostrar el panel.</desc>
    <defs>
      <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head" d="M0 0L9 5L0 10z"/></marker>
      <marker id="ah-hot" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head hot" d="M0 0L9 5L0 10z"/></marker>
    </defs>
    <line class="life" x1="50" y1="54" x2="50" y2="388"/>
    <line class="life" x1="150" y1="54" x2="150" y2="388"/>
    <line class="life" x1="250" y1="54" x2="250" y2="388"/>
    <line class="life" x1="350" y1="54" x2="350" y2="388"/>
    <rect class="box" x="10" y="10" width="80" height="44" rx="6"/><text x="50" y="32">Usuario</text>
    <rect class="box" x="110" y="10" width="80" height="44" rx="6"/><text x="150" y="32">App</text>
    <rect class="box" x="210" y="10" width="80" height="44" rx="6"/><text x="250" y="32">API</text>
    <rect class="box" x="310" y="10" width="80" height="44" rx="6"/><text x="350" y="24">Base de</text><text x="350" y="40">datos</text>
    <g class="msg" tabindex="0" role="group" aria-label="Usuario a App: Credenciales" data-desc="El usuario escribe su correo y contraseña, y pulsa Entrar.">
      <line class="arrow" x1="50" y1="100" x2="150" y2="100"/><text x="100" y="92">Credenciales</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="App a API: POST /login" data-desc="La app envía las credenciales por HTTPS al endpoint de inicio de sesión.">
      <line class="arrow" x1="150" y1="150" x2="250" y2="150"/><text x="200" y="142">POST /login</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="API a Base de datos: Consulta" data-desc="La API busca al usuario por correo en la base de datos.">
      <line class="arrow" x1="250" y1="200" x2="350" y2="200"/><text x="300" y="192">Consulta</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="Base de datos a API: Hash" data-desc="La base de datos devuelve el hash guardado, no la contraseña.">
      <line class="arrow reply" x1="350" y1="250" x2="250" y2="250"/><text x="300" y="242">Hash</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="API a App: 200 + token" data-desc="La API compara el hash con bcrypt y responde con un token de sesión.">
      <line class="arrow reply" x1="250" y1="300" x2="150" y2="300"/><text x="200" y="292">200 + token</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="App a Usuario: Panel" data-desc="La app guarda el token y muestra el panel de inicio.">
      <line class="arrow reply" x1="150" y1="350" x2="50" y2="350"/><text x="100" y="342">Panel</text>
    </g>
    <rect class="note" x="10" y="400" width="380" height="40" rx="6"/>
    <text x="200" y="420">Nota: la contraseña nunca se guarda en claro.</text>
  </svg>
  <p class="cap" id="cap" aria-live="polite">Pasa el foco sobre un mensaje para ver su descripción.</p>
</figure>
<script>
  const seq = document.getElementById('seq'), cap = document.getElementById('cap');
  const hint = cap.textContent;
  const show = (msg) => {
    seq.querySelectorAll('.msg').forEach((g) => g.classList.toggle('on', g === msg));
    cap.textContent = msg ? msg.dataset.desc : hint;
  };
  const msgOf = (e) => e.target.closest('.msg');
  seq.addEventListener('pointerover', (e) => show(msgOf(e)));
  seq.addEventListener('focusin', (e) => show(msgOf(e)));
  seq.addEventListener('pointerleave', () => show(null));
  seq.addEventListener('focusout', () => show(null));
</script>
</body>
</html>
