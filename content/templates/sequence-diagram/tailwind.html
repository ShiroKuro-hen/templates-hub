<figure class="mx-auto max-w-[440px] rounded-lg border border-line bg-surface p-4 text-sm text-fg shadow-sm">
  <h1 class="mb-3 mt-0 text-base font-semibold">Inicio de sesión</h1>
  <svg id="seq" viewBox="0 0 400 450" role="img" aria-labelledby="seq-t seq-d" class="block h-auto w-full">
    <title id="seq-t">Secuencia de inicio de sesión</title>
    <desc id="seq-d">El usuario envía sus credenciales a la app, que llama a la API. La API consulta la base de datos, valida la contraseña y devuelve un token que permite mostrar el panel.</desc>
    <defs>
      <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head fill-fg" d="M0 0L9 5L0 10z"/></marker>
      <marker id="ah-hot" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="head hot fill-accent" d="M0 0L9 5L0 10z"/></marker>
    </defs>
    <line class="life stroke-line stroke-[1.5px] [stroke-dasharray:4_4]" x1="50" y1="54" x2="50" y2="388"/>
    <line class="life stroke-line stroke-[1.5px] [stroke-dasharray:4_4]" x1="150" y1="54" x2="150" y2="388"/>
    <line class="life stroke-line stroke-[1.5px] [stroke-dasharray:4_4]" x1="250" y1="54" x2="250" y2="388"/>
    <line class="life stroke-line stroke-[1.5px] [stroke-dasharray:4_4]" x1="350" y1="54" x2="350" y2="388"/>
    <rect class="box fill-surface stroke-line stroke-[1.5px]" x="10" y="10" width="80" height="44" rx="6"/><text class="fill-fg" x="50" y="32">Usuario</text>
    <rect class="box fill-surface stroke-line stroke-[1.5px]" x="110" y="10" width="80" height="44" rx="6"/><text class="fill-fg" x="150" y="32">App</text>
    <rect class="box fill-surface stroke-line stroke-[1.5px]" x="210" y="10" width="80" height="44" rx="6"/><text class="fill-fg" x="250" y="32">API</text>
    <rect class="box fill-surface stroke-line stroke-[1.5px]" x="310" y="10" width="80" height="44" rx="6"/><text class="fill-fg" x="350" y="24">Base de</text><text class="fill-fg" x="350" y="40">datos</text>
    <g class="msg" tabindex="0" role="group" aria-label="Usuario a App: Credenciales" data-desc="El usuario escribe su correo y contraseña, y pulsa Entrar.">
      <line class="arrow stroke-fg stroke-[1.5px]" x1="50" y1="100" x2="150" y2="100"/><text class="msg-text fill-muted" x="100" y="92">Credenciales</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="App a API: POST /login" data-desc="La app envía las credenciales por HTTPS al endpoint de inicio de sesión.">
      <line class="arrow stroke-fg stroke-[1.5px]" x1="150" y1="150" x2="250" y2="150"/><text class="msg-text fill-muted" x="200" y="142">POST /login</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="API a Base de datos: Consulta" data-desc="La API busca al usuario por correo en la base de datos.">
      <line class="arrow stroke-fg stroke-[1.5px]" x1="250" y1="200" x2="350" y2="200"/><text class="msg-text fill-muted" x="300" y="192">Consulta</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="Base de datos a API: Hash" data-desc="La base de datos devuelve el hash guardado, no la contraseña.">
      <line class="arrow reply stroke-muted stroke-[1.5px] [stroke-dasharray:5_4]" x1="350" y1="250" x2="250" y2="250"/><text class="msg-text fill-muted" x="300" y="242">Hash</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="API a App: 200 + token" data-desc="La API compara el hash con bcrypt y responde con un token de sesión.">
      <line class="arrow reply stroke-muted stroke-[1.5px] [stroke-dasharray:5_4]" x1="250" y1="300" x2="150" y2="300"/><text class="msg-text fill-muted" x="200" y="292">200 + token</text>
    </g>
    <g class="msg" tabindex="0" role="group" aria-label="App a Usuario: Panel" data-desc="La app guarda el token y muestra el panel de inicio.">
      <line class="arrow reply stroke-muted stroke-[1.5px] [stroke-dasharray:5_4]" x1="150" y1="350" x2="50" y2="350"/><text class="msg-text fill-muted" x="100" y="342">Panel</text>
    </g>
    <rect class="note fill-warn-soft stroke-warn stroke-[1.5px]" x="10" y="400" width="380" height="40" rx="6"/>
    <text class="fill-fg" x="200" y="420">Nota: la contraseña nunca se guarda en claro.</text>
  </svg>
  <p id="cap" aria-live="polite" class="mt-3 min-h-[3em] border-t border-line pt-2.5 text-[13px]">Pasa el foco sobre un mensaje para ver su descripción.</p>
</figure>
<style>
  text{font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:middle}
  .msg{outline:none}
  .msg-text{font-size:12px}
  .arrow{marker-end:url(#ah);transition:stroke .14s}
  .msg.on .arrow{stroke:var(--accent);stroke-width:2;marker-end:url(#ah-hot)}
  .msg.on text{fill:var(--accent);font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
  const seq = document.getElementById('seq'), cap = document.getElementById('cap');
  const hint = cap.textContent;
  const show = (msg) => {
    seq.querySelectorAll('.msg').forEach((g) => g.classList.toggle('on', g === msg));
    cap.textContent = msg ? msg.dataset.desc : hint;
  };
  const msgOf = (e) => e.target.closest('.msg');
  seq.addEventListener('pointerover', (e) => show(msgOf(e)));
  seq.addEventListener('focusin', (e) => show(msgOf(e)));
  seq.addEventListener('pointerleave', () => show(null));
  seq.addEventListener('focusout', () => show(null));
</script>
