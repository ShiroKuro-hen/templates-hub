<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:center;max-width:620px;margin:0 auto;padding:24px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  .wrap{position:relative;width:176px;height:176px;flex:none}
  svg{width:100%;height:100%;display:block}
  .seg{fill:none;stroke-width:5;transition:stroke-dasharray .7s cubic-bezier(.3,.7,.2,1),opacity .15s}
  .dim .seg:not(.on){opacity:.3}
  .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .center strong{font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
  .center span{color:var(--muted);font-size:12px}
  h2{margin:0 0 8px;font-size:16px;font-weight:600}
  .legend{display:grid;gap:2px;margin:0;padding:0;list-style:none;min-width:190px}
  .legend button{display:flex;gap:10px;align-items:center;width:100%;padding:6px 8px;border:1px solid transparent;border-radius:var(--radius);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .14s,border-color .14s}
  .legend button:hover,.legend button.on{border-color:var(--border);background:var(--accent-soft)}
  .dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
  .name{flex:1}
  .val{color:var(--muted);font-variant-numeric:tabular-nums}
  @media(prefers-reduced-motion:reduce){.seg,.legend button{transition:none}}
</style>
</head>
<body>
  <section class="card" aria-labelledby="t">
    <div class="wrap" id="wrap">
      <svg viewBox="0 0 42 42" role="img" aria-label="Gráfico de donut: visitas por canal"><g id="segs"></g></svg>
      <div class="center" aria-hidden="true"><strong id="pct">12,5k</strong><span id="lbl">visitas</span></div>
    </div>
    <div>
      <h2 id="t">Visitas por canal</h2>
      <ul class="legend" id="legend"></ul>
    </div>
  </section>
<script>
  const data = [
    { label: 'Directo',   value: 38, color: 'var(--accent)' },
    { label: 'Orgánico',  value: 27, color: 'var(--info)' },
    { label: 'Referidos', value: 18, color: 'var(--ok)' },
    { label: 'Social',    value: 12, color: 'var(--warn)' },
    { label: 'Otros',     value: 5,  color: 'var(--err)' },
  ];
  const TOTAL = '12,5k', NS = 'http://www.w3.org/2000/svg', GAP = 0.8;
  const R = 100 / (2 * Math.PI); // circunferencia = 100, así stroke-dasharray usa porcentajes directos
  const segs = document.getElementById('segs'), legend = document.getElementById('legend'), wrap = document.getElementById('wrap');
  const pct = document.getElementById('pct'), lbl = document.getElementById('lbl');
  const sum = data.reduce((a, d) => a + d.value, 0);
  let acc = 0;
  const circles = data.map((d, i) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'seg');
    c.setAttribute('cx', 21); c.setAttribute('cy', 21); c.setAttribute('r', R);
    c.style.stroke = d.color;
    c.style.strokeDasharray = "0 100";
    c.setAttribute('stroke-dashoffset', 25 - acc); // 25 = empezar arriba
    c.dataset.len = Math.max(d.value / sum * 100 - GAP, 0.1);
    acc += d.value / sum * 100;
    segs.appendChild(c);
    const li = document.createElement('li');
    li.innerHTML = `<button type="button"><span class="dot" style="--c:${d.color}"></span><span class="name">${d.label}</span><span class="val">${d.value}%</span></button>`;
    legend.appendChild(li);
    const b = li.firstChild;
    ['mouseenter', 'focus'].forEach(e => b.addEventListener(e, () => show(i)));
    ['mouseleave', 'blur'].forEach(e => b.addEventListener(e, reset));
    c.addEventListener('mouseenter', () => show(i)); c.addEventListener('mouseleave', reset);
    return c;
  });
  const buttons = legend.querySelectorAll('button');
  function show(i) {
    wrap.classList.add('dim');
    circles.forEach((c, j) => c.classList.toggle('on', j === i));
    buttons.forEach((b, j) => b.classList.toggle('on', j === i));
    pct.textContent = data[i].value + '%'; lbl.textContent = data[i].label;
  }
  function reset() {
    wrap.classList.remove('dim');
    circles.forEach(c => c.classList.remove('on')); buttons.forEach(b => b.classList.remove('on'));
    pct.textContent = TOTAL; lbl.textContent = 'visitas';
  }
  requestAnimationFrame(() => requestAnimationFrame(() =>
    circles.forEach(c => c.style.strokeDasharray = `${c.dataset.len} ${100 - c.dataset.len}`)));
</script>
</body>
</html>
