<div class="bg-page p-5 text-sm text-fg">
  <section aria-labelledby="t" class="mx-auto max-w-lg rounded-lg border border-line bg-surface shadow-sm">
    <h2 id="t" class="m-0 border-b border-line px-5 py-4 text-base font-semibold">Políticas del espacio</h2>
    <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-3.5">
      <div class="flex items-center gap-1 font-semibold">Retención de datos
        <button type="button" popovertarget="p1" aria-label="Más información sobre Retención de datos"
                class="grid size-7 cursor-pointer place-items-center rounded-full text-muted hover:bg-accent-soft hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
          <svg viewBox="0 0 16 16" aria-hidden="true" class="size-4 fill-none stroke-current" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.3-.8.6-.8 1.2M8 11.4v.1"/></svg>
        </button>
        <div id="p1" popover role="dialog" aria-labelledby="p1t"
             class="tip fixed inset-auto m-0 w-72 rounded-lg border border-line bg-surface p-4 text-fg shadow-lg">
          <h3 id="p1t" class="m-0 mb-1 text-sm font-semibold">Retención de 90 días</h3>
          <p class="m-0 mb-3 font-normal text-muted">Los registros se eliminan al cumplirse 90 días. Exporta antes los que necesites conservar.</p>
          <div class="flex items-center gap-3">
            <a href="#politica" class="rounded-sm font-semibold text-accent hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ver política</a>
            <button type="button" popovertarget="p1" popovertargetaction="hide" class="ml-auto cursor-pointer rounded-lg border border-line px-3 py-1 hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Entendido</button>
          </div>
        </div>
      </div>
      <span class="tabular-nums text-muted">90 días</span>
    </div>
    <div class="flex items-center justify-between gap-3 px-5 py-3.5">
      <div class="font-semibold">Copias de seguridad</div>
      <span class="tabular-nums text-muted">Diaria, 02:00</span>
    </div>
  </section>
</div>
<script>
  document.querySelectorAll('.tip').forEach((p) => {
    p.addEventListener('toggle', (e) => {
      if (e.newState !== 'open') return;
      const b = document.querySelector('[popovertarget=' + p.id + ']').getBoundingClientRect();
      p.style.left = Math.max(8, Math.min(b.left + b.width / 2 - p.offsetWidth / 2, innerWidth - p.offsetWidth - 8)) + 'px';
      p.style.top = (b.bottom + 8 + p.offsetHeight < innerHeight ? b.bottom + 8 : Math.max(8, b.top - 8 - p.offsetHeight)) + 'px';
    });
  });
  addEventListener('scroll', () => document.querySelectorAll(':popover-open').forEach((p) => p.hidePopover()), true);
</script>
