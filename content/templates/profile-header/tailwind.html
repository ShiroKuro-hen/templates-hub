<article aria-labelledby="n" class="mx-auto max-w-2xl overflow-hidden rounded-lg border border-slate-200 bg-white text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <svg class="block h-36 w-full" viewBox="0 0 800 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient>
      <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".18"/></pattern>
    </defs>
    <rect width="800" height="150" fill="url(#g)"/><rect width="800" height="150" fill="url(#p)"/>
    <circle cx="640" cy="40" r="90" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="640" cy="40" r="52" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="640" cy="40" r="6" fill="#fff" fill-opacity=".8"/>
  </svg>
  <div class="px-5 pb-5">
    <div class="-mt-11 flex flex-wrap items-end justify-between gap-3">
      <span aria-hidden="true" class="grid size-[88px] place-items-center rounded-full bg-blue-50 text-3xl font-semibold text-blue-600 ring-4 ring-white dark:bg-blue-500/15 dark:text-blue-300 dark:ring-slate-900">VM</span>
      <div class="flex gap-2">
        <button type="button" class="rounded-lg border border-slate-200 bg-white px-4 py-2 font-semibold hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800">Enviar mensaje</button>
        <button type="button" id="follow" class="rounded-lg border border-blue-600 bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-blue-400 dark:bg-blue-400 dark:text-slate-950">Seguir</button>
      </div>
    </div>
    <h1 id="n" class="mt-3 flex items-center gap-1.5 text-xl font-semibold">Valeria Montoya
      <svg class="size-[18px] text-blue-600 dark:text-blue-400" viewBox="0 0 24 24" role="img" aria-label="Cuenta verificada"><path fill="currentColor" d="M12 2l2.4 1.8 3-.2 1 2.8 2.5 1.7-.9 2.9.9 2.9-2.5 1.7-1 2.8-3-.2L12 22l-2.4-1.8-3 .2-1-2.8-2.5-1.7.9-2.9-.9-2.9 2.5-1.7 1-2.8 3 .2z"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 12.5l2.6 2.6L16 9.5"/></svg>
    </h1>
    <p class="text-slate-500 dark:text-slate-400">@valeriamontoya</p>
    <p class="my-2.5 max-w-prose">Diseñadora de producto en Nimbus. Escribo sobre sistemas de diseño, accesibilidad y trabajo en equipo.</p>
    <p class="text-slate-500 dark:text-slate-400">Lima, Perú</p>
    <dl class="mt-4 flex flex-wrap gap-x-7 gap-y-2 border-t border-slate-200 pt-4 dark:border-slate-700 [&>div]:flex [&>div]:flex-col-reverse [&_dt]:text-[13px] [&_dt]:text-slate-500 dark:[&_dt]:text-slate-400 [&_dd]:m-0 [&_dd]:text-lg [&_dd]:font-semibold [&_dd]:tabular-nums">
      <div><dt>Publicaciones</dt><dd>248</dd></div>
      <div><dt>Seguidores</dt><dd id="fl">12.480</dd></div>
      <div><dt>Siguiendo</dt><dd>312</dd></div>
    </dl>
    <p id="st" role="status" class="sr-only"></p>
  </div>
</article>
<script>
  const b = document.getElementById('follow'), fl = document.getElementById('fl'), st = document.getElementById('st');
  const on = 'border-slate-200 bg-white text-slate-900 hover:bg-blue-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:hover:bg-slate-800';
  const off = 'border-blue-600 bg-blue-600 text-white hover:bg-blue-700 dark:border-blue-400 dark:bg-blue-400 dark:text-slate-950';
  let n = 12480, following = false;
  fl.textContent = n.toLocaleString('es');
  b.addEventListener('click', () => {
    following = !following; n += following ? 1 : -1;
    fl.textContent = n.toLocaleString('es');
    b.textContent = following ? 'Siguiendo' : 'Seguir';
    b.classList.remove(...(following ? off : on).split(' '));
    b.classList.add(...(following ? on : off).split(' '));
    st.textContent = following ? 'Ahora sigues a Valeria Montoya' : 'Dejaste de seguir a Valeria Montoya';
  });
</script>
