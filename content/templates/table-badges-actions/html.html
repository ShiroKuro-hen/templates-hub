<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{margin:0 0 12px;font-size:18px;font-weight:600}
  .wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  .wrap:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  table{width:100%;min-width:520px;border-collapse:collapse}
  caption{position:absolute;left:-9999px}
  th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  thead th{color:var(--muted);font-weight:600}
  tbody th{font-weight:500}
  tbody tr:last-child>*{border-bottom:0}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)}
  .err{background:var(--err-soft);color:var(--err)} .info{background:var(--info-soft);color:var(--info)}
  .acts{display:flex;gap:8px}
  button{font:500 13px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 12px;cursor:pointer;transition:background .14s,border-color .14s}
  button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .del{color:var(--err)}
  .del:hover:not(:disabled){background:var(--err-soft);border-color:var(--err)}
  #msg{margin:12px 0 0;color:var(--muted);font-size:13px;min-height:1.5em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Pedidos recientes</h1>
<div class="wrap" role="region" aria-labelledby="cap" tabindex="0">
  <table id="t">
    <caption id="cap">Pedidos con su estado y acciones</caption>
    <thead><tr><th scope="col">Pedido</th><th scope="col">Cliente</th><th scope="col">Estado</th><th scope="col" class="num">Total</th><th scope="col">Acciones</th></tr></thead>
    <tbody>
      <tr><th scope="row">#1042</th><td>Ana Pérez</td><td><span class="badge ok">Pagado</span></td><td class="num">$128.00</td><td></td></tr>
      <tr><th scope="row">#1043</th><td>Luis Gómez</td><td><span class="badge warn">Pendiente</span></td><td class="num">$54.90</td><td></td></tr>
      <tr><th scope="row">#1044</th><td>Marta Ruiz</td><td><span class="badge err">Fallido</span></td><td class="num">$310.00</td><td></td></tr>
      <tr><th scope="row">#1045</th><td>Carlos Díaz</td><td><span class="badge info">Enviado</span></td><td class="num">$76.25</td><td></td></tr>
    </tbody>
  </table>
</div>
<p id="msg" role="status"></p>
<script>
  const t = document.getElementById('t'), msg = document.getElementById('msg');
  const badge = (tr) => tr.querySelector('.badge');
  function acts(tr) {
    const id = tr.cells[0].textContent, paid = badge(tr).classList.contains('ok');
    tr.cells[4].innerHTML = '<div class="acts"><button data-a="pay"' + (paid ? ' disabled' : '') + ' aria-label="Marcar pagado el pedido ' + id + '">Marcar pagado</button>' +
      '<button class="del" data-a="del" aria-label="Quitar el pedido ' + id + '">Quitar</button></div>';
  }
  [...t.tBodies[0].rows].forEach(acts);
  t.tBodies[0].addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const tr = b.closest('tr'), id = tr.cells[0].textContent;
    if (b.dataset.a === 'del') { tr.remove(); msg.textContent = 'Pedido ' + id + ' quitado.'; }
    else { const s = badge(tr); s.className = 'badge ok'; s.textContent = 'Pagado'; acts(tr); msg.textContent = 'Pedido ' + id + ' marcado como pagado.'; tr.querySelector('button').focus(); }
  });
</script>
</body>
</html>
