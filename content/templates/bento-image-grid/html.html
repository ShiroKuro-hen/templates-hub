<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadrícula bento de imágenes</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bento{max-width:960px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.5rem;line-height:1.3;letter-spacing:-.02em}
  .lead{margin:0 0 18px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(6,200px);grid-template-areas:"t1" "t2" "t3" "t4" "t5" "t6";gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,180px);grid-template-areas:"t1 t1" "t2 t3" "t4 t5" "t6 t6"}}
  @media(min-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,190px);grid-template-areas:"t1 t1 t2" "t3 t3 t2" "t4 t5 t6"}}
  .t1{grid-area:t1}.t2{grid-area:t2}.t3{grid-area:t3}.t4{grid-area:t4}.t5{grid-area:t5}.t6{grid-area:t6}
  .tile{position:relative;margin:0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}
  .tile:hover{transform:translateY(-4px)}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .tile:hover img{transform:scale(1.05)}
  .tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:rgba(255,255,255,.96);font-size:13px;font-weight:600}
  .stat{display:flex;flex-direction:column;justify-content:flex-end;padding:16px;border:0;background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff));color:var(--accent-ink)}
  .stat strong{font-size:2.4rem;line-height:1;letter-spacing:-.03em}
  .stat span{margin-top:8px;font-size:14px;font-weight:500}
  @media(prefers-reduced-motion:reduce){.tile,.tile img{transition:none}.tile:hover,.tile:hover img{transform:none}}
</style>
</head>
<body>
<section class="bento" aria-labelledby="h">
  <h1 id="h">Proyectos recientes</h1>
  <p class="lead">Trabajos de este trimestre, con una cifra de resultados.</p>
  <div class="grid">
    <figure class="tile t1"><img loading="lazy" src="/stock/costa-azul.webp" alt="Costa con pinos y mar azul" width="800" height="533" decoding="async"><figcaption>Costa azul con pinos</figcaption></figure>
    <div class="tile stat t2"><strong>+38%</strong><span>conversiones en 90 días tras el rediseño</span></div>
    <figure class="tile t3"><img loading="lazy" src="/stock/calle-ciudad.webp" alt="Calle de la ciudad entre edificios altos" width="800" height="533" decoding="async"><figcaption>Calle entre edificios</figcaption></figure>
    <figure class="tile t4"><img loading="lazy" src="/stock/escritorio-diseno.webp" alt="Escritorio visto desde arriba con materiales de diseño y un teléfono" width="800" height="533" decoding="async"><figcaption>Mesa de diseño</figcaption></figure>
    <figure class="tile t5"><img loading="lazy" src="/stock/montana-nieve.webp" alt="Picos montañosos cubiertos de nieve" width="800" height="533" decoding="async"><figcaption>Picos nevados</figcaption></figure>
    <figure class="tile t6"><img loading="lazy" src="/stock/cafeteria-mesa.webp" alt="Larga mesa de madera de una cafetería" width="800" height="533" decoding="async"><figcaption>Mesa de cafetería</figcaption></figure>
  </div>
</section>
</body>
</html>
