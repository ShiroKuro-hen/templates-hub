<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .nav{display:flex;align-items:center;gap:16px;max-width:900px;margin:0 auto;padding:0 12px 0 16px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap}
  .brand i{width:22px;height:22px;border-radius:6px;background:var(--accent)}
  .links{display:flex;gap:4px;margin:0;padding:0;list-style:none;min-width:0;overflow-x:auto}
  .links a{display:block;padding:6px 12px;border-radius:var(--radius);color:var(--muted);text-decoration:none;white-space:nowrap;transition:background .14s,color .14s}
  .links a:hover{background:var(--accent-soft);color:var(--text)}
  .links a[aria-current=page]{background:var(--accent-soft);color:var(--text);font-weight:600}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .s{position:relative;display:flex;align-items:center;margin-left:auto;border:1px solid transparent;border-radius:var(--radius);transition:border-color .14s,background .14s}
  .s.open{border-color:var(--border);background:var(--bg)}
  .s::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#2f5bff);transform:scaleX(0);transition:transform .16s}
  .s.open:focus-within::after{transform:scaleX(1)}
  .s button{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:var(--radius);background:none;color:var(--muted);cursor:pointer}
  .s button:hover{color:var(--text)}
  .s svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .s input{width:0;padding:0;border:0;background:none;color:var(--text);font:inherit;visibility:hidden;transition:width .16s,padding .16s,visibility .16s}
  .s.open input{width:min(220px,calc(100vw - 190px));padding:0 8px 0 0;visibility:visible}
  .s input:focus-visible{outline:0}
  .s input::-webkit-search-cancel-button{display:none}
  .res{max-width:900px;margin:16px auto 0;color:var(--muted)}
  kbd{padding:0 6px;border:1px solid var(--border);border-radius:4px;font:inherit;font-size:12px}
  @media (max-width:560px){.searching .links,.searching .brand span{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Principal">
  <a class="brand" href="#inicio"><i aria-hidden="true"></i><span>Nimbo Docs</span></a>
  <ul class="links">
    <li><a href="#guias" aria-current="page">Guías</a></li>
    <li><a href="#api">Referencia API</a></li>
    <li><a href="#cambios">Cambios</a></li>
    <li><a href="#estado">Estado</a></li>
  </ul>
  <form class="s" id="s" role="search">
    <button type="button" id="tg" aria-label="Buscar" aria-expanded="false" aria-controls="q" aria-keyshortcuts="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>
    <input id="q" type="search" name="q" placeholder="Buscar en la documentación" aria-label="Buscar en la documentación" autocomplete="off">
  </form>
</nav>
<p class="res" id="r" role="status">Pulsa <kbd>/</kbd> para buscar. Esc cierra el buscador.</p>
<script>
  const $ = (id) => document.getElementById(id);
  function set(open) {
    $('s').classList.toggle('open', open); $('nav').classList.toggle('searching', open);
    $('tg').setAttribute('aria-expanded', open);
    if (open) $('q').focus(); else $('q').value = '';
  }
  $('tg').addEventListener('click', () => set($('tg').getAttribute('aria-expanded') !== 'true'));
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { set(false); $('tg').focus(); } });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); set(true); }
  });
  $('s').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('q').value.trim();
    $('r').textContent = v ? `Mostrando resultados para «${v}».` : 'Escribe qué quieres buscar, por ejemplo «webhooks».';
  });
</script>
</body>
</html>
