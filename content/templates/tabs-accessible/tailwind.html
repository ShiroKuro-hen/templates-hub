<div class="p-5 text-sm text-fg">
  <div role="tablist" aria-label="Detalle del proyecto" class="mb-3 flex gap-1 overflow-x-auto border-b border-line">
    <button role="tab" id="t1" aria-selected="true" aria-controls="p1" type="button"
      class="relative whitespace-nowrap rounded-t-lg px-3.5 py-2.5 font-medium text-muted hover:bg-surface hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-selected:text-accent aria-selected:after:absolute aria-selected:after:inset-x-2 aria-selected:after:-bottom-px aria-selected:after:h-0.5 aria-selected:after:rounded-sm aria-selected:after:bg-accent">Resumen</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1" type="button"
      class="relative whitespace-nowrap rounded-t-lg px-3.5 py-2.5 font-medium text-muted hover:bg-surface hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-selected:text-accent aria-selected:after:absolute aria-selected:after:inset-x-2 aria-selected:after:-bottom-px aria-selected:after:h-0.5 aria-selected:after:rounded-sm aria-selected:after:bg-accent">Actividad</button>
    <button role="tab" id="t3" aria-selected="false" aria-controls="p3" tabindex="-1" type="button"
      class="relative whitespace-nowrap rounded-t-lg px-3.5 py-2.5 font-medium text-muted hover:bg-surface hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent aria-selected:text-accent aria-selected:after:absolute aria-selected:after:inset-x-2 aria-selected:after:-bottom-px aria-selected:after:h-0.5 aria-selected:after:rounded-sm aria-selected:after:bg-accent">Ajustes</button>
  </div>
  <section role="tabpanel" id="p1" aria-labelledby="t1" tabindex="0" class="rounded-lg border border-line bg-surface px-[18px] py-4 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <h2 class="mb-1.5 text-lg font-semibold tracking-tight">Rediseño de la tienda</h2>
    <p>Entrega prevista el 14 de noviembre. 18 de 24 tareas completadas.</p>
  </section>
  <section role="tabpanel" id="p2" aria-labelledby="t2" tabindex="0" hidden class="rounded-lg border border-line bg-surface px-[18px] py-4 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <h2 class="mb-1.5 text-lg font-semibold tracking-tight">Actividad reciente</h2>
    <p>Marta subió 3 mockups y Luis cerró la tarea «Carrito».</p>
  </section>
  <section role="tabpanel" id="p3" aria-labelledby="t3" tabindex="0" hidden class="rounded-lg border border-line bg-surface px-[18px] py-4 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <h2 class="mb-1.5 text-lg font-semibold tracking-tight">Ajustes</h2>
    <p>Nombre, miembros del equipo y notificaciones del proyecto.</p>
  </section>
</div>

<script>
  const list = document.querySelector('[role="tablist"]');
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  const select = (tab, focus) => {
    tabs.forEach((t) => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  };
  list.addEventListener('click', (e) => { const t = e.target.closest('[role="tab"]'); if (t) select(t); });
  list.addEventListener('keydown', (e) => {
    const i = tabs.indexOf(document.activeElement), n = tabs.length;
    const next = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (i < 0 || next === undefined) return;
    e.preventDefault();
    select(tabs[next], true);
  });
</script>
