<div class="p-5 text-sm">
  <div role="tablist" aria-label="Detalle del proyecto" class="relative z-10 -mb-0.5 flex gap-1.5">
    <button role="tab" id="t1" aria-selected="true" aria-controls="p1" type="button"
      class="rounded-t-[10px] border-2 border-b-0 border-[#17130f] bg-[#f6f1e7] px-4 py-2.5 font-semibold text-[#6b6258] hover:bg-[#ffd84d] hover:text-[#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] aria-selected:bg-[#fffdf8] aria-selected:text-[#17130f] aria-selected:shadow-[inset_0_4px_0_#ff5a36]">Resumen</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="p2" tabindex="-1" type="button"
      class="rounded-t-[10px] border-2 border-b-0 border-[#17130f] bg-[#f6f1e7] px-4 py-2.5 font-semibold text-[#6b6258] hover:bg-[#ffd84d] hover:text-[#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] aria-selected:bg-[#fffdf8] aria-selected:text-[#17130f] aria-selected:shadow-[inset_0_4px_0_#ff5a36]">Actividad</button>
    <button role="tab" id="t3" aria-selected="false" aria-controls="p3" tabindex="-1" type="button"
      class="rounded-t-[10px] border-2 border-b-0 border-[#17130f] bg-[#f6f1e7] px-4 py-2.5 font-semibold text-[#6b6258] hover:bg-[#ffd84d] hover:text-[#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] aria-selected:bg-[#fffdf8] aria-selected:text-[#17130f] aria-selected:shadow-[inset_0_4px_0_#ff5a36]">Ajustes</button>
  </div>
  <section role="tabpanel" id="p1" aria-labelledby="t1" tabindex="0" class="rounded-b-[10px] rounded-tr-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-[18px] py-4 shadow-[4px_4px_0_#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">
    <h2 class="mb-1.5 text-lg font-bold tracking-tight">Rediseño de la tienda</h2>
    <p>Entrega prevista el 14 de noviembre. 18 de 24 tareas completadas.</p>
  </section>
  <section role="tabpanel" id="p2" aria-labelledby="t2" tabindex="0" hidden class="rounded-b-[10px] rounded-tr-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-[18px] py-4 shadow-[4px_4px_0_#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">
    <h2 class="mb-1.5 text-lg font-bold tracking-tight">Actividad reciente</h2>
    <p>Marta subió 3 mockups y Luis cerró la tarea «Carrito».</p>
  </section>
  <section role="tabpanel" id="p3" aria-labelledby="t3" tabindex="0" hidden class="rounded-b-[10px] rounded-tr-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-[18px] py-4 shadow-[4px_4px_0_#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36]">
    <h2 class="mb-1.5 text-lg font-bold tracking-tight">Ajustes</h2>
    <p>Nombre, miembros del equipo y notificaciones del proyecto.</p>
  </section>
</div>

<script>
  const list = document.querySelector('[role="tablist"]');
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  const select = (tab, focus) => {
    tabs.forEach((t) => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  };
  list.addEventListener('click', (e) => { const t = e.target.closest('[role="tab"]'); if (t) select(t); });
  list.addEventListener('keydown', (e) => {
    const i = tabs.indexOf(document.activeElement), n = tabs.length;
    const next = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (i < 0 || next === undefined) return;
    e.preventDefault();
    select(tabs[next], true);
  });
</script>
