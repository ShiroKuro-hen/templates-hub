<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:420px;margin:0 auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0;font-size:18px;font-weight:600}
  .card p{margin:4px 0 16px;color:var(--muted)}
  .btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;transition:border-color .14s}
  .btn.main{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #msg{min-height:1.5em;margin:12px 0 0;color:var(--muted)}
  dialog{position:fixed;inset:auto 0 0;margin:0 auto;box-sizing:border-box;width:100%;max-width:520px;max-height:85vh;padding:0;overflow:auto;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);
         transform:translateY(100%);transition:transform .16s ease-out,overlay .16s allow-discrete,display .16s allow-discrete}
  dialog[open]{transform:none}
  @starting-style{dialog[open]{transform:translateY(100%)}}
  dialog::backdrop{background:rgba(14,23,38,.5);opacity:0;transition:opacity .16s,overlay .16s allow-discrete,display .16s allow-discrete}
  dialog[open]::backdrop{opacity:1}
  @starting-style{dialog[open]::backdrop{opacity:0}}
  .grab{display:block;width:100%;padding:10px 0 6px;border:0;background:none;cursor:pointer}
  .grab i{display:block;width:40px;height:4px;margin:0 auto;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  dialog h2{margin:0;padding:4px 20px 12px;font-size:16px;font-weight:600}
  ul{margin:0;padding:0 8px;list-style:none}
  .act{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:var(--radius);background:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background .14s}
  .act:hover{background:var(--accent-soft)}
  .act svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .act span{flex:1}
  .act small{display:block;color:var(--muted)}
  .foot{padding:8px 20px 20px}
  .foot .btn{width:100%}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <h1>Proyecto Atlas</h1>
  <p>Última edición hoy a las 10:42 por Ana Pérez.</p>
  <button class="btn main" id="open" type="button">Compartir proyecto</button>
  <p id="msg" role="status"></p>
</div>
<dialog id="sheet" aria-labelledby="st">
  <button class="grab" id="close" type="button" aria-label="Cerrar hoja"><i></i></button>
  <h2 id="st">Compartir Proyecto Atlas</h2>
  <ul>
    <li><button class="act" data-msg="Enlace copiado al portapapeles." autofocus><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 11.5a3.5 3.5 0 0 0 5 0l2.5-2.5a3.5 3.5 0 0 0-5-5l-1 1M11.5 8.5a3.5 3.5 0 0 0-5 0L4 11a3.5 3.5 0 0 0 5 5l1-1"/></svg><span>Copiar enlace<small>Cualquiera con el enlace puede ver</small></span></button></li>
    <li><button class="act" data-msg="Invitación enviada por correo."><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="m3 6 7 5 7-5"/></svg><span>Enviar por correo<small>Invita a personas concretas</small></span></button></li>
    <li><button class="act" data-msg="Exportación a PDF iniciada."><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m0 0-3.5-3.5M10 13l3.5-3.5M4 16h12"/></svg><span>Exportar a PDF<small>Descarga una copia estática</small></span></button></li>
  </ul>
  <div class="foot"><button class="btn" id="cancel" type="button">Cancelar</button></div>
</dialog>
<script>
  const d = document.getElementById('sheet'), msg = document.getElementById('msg');
  document.getElementById('open').onclick = () => d.showModal();
  document.getElementById('close').onclick = document.getElementById('cancel').onclick = () => d.close();
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.querySelectorAll('[data-msg]').forEach((b) => (b.onclick = () => { msg.textContent = b.dataset.msg; d.close(); }));
</script>
</body>
</html>
