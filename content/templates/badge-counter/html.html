<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing: border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 22px; margin-bottom: 20px; }
  code { display: block; margin-top: 6px; font: 12px ui-monospace, "Cascadia Code", Menlo, monospace; color: var(--muted); }

  .btn { font: 500 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    color: var(--text); cursor: pointer; transition: background-color .14s; }
  .btn:hover { background: var(--accent-soft); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon { position: relative; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .count { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center;
    border-radius: 999px; background: var(--err); color: var(--accent-ink); box-shadow: 0 0 0 2px var(--bg);
    font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .count[hidden] { display: none; }
  .dot { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
  .inline { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 8px; padding: 0 6px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; vertical-align: middle; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; }
  .tools .btn { padding: 5px 10px; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <h1>Bandeja</h1>
  <div class="row">
    <div>
      <button class="btn icon" id="bell" type="button" aria-label="Notificaciones, 3 sin leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>
        <span class="count" id="bell-n" aria-hidden="true">3</span>
      </button><code>contador</code>
    </div>
    <div>
      <button class="btn icon" type="button" aria-label="Mensajes, más de 99 sin leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="count" aria-hidden="true">99+</span>
      </button><code>tope 99+</code>
    </div>
    <div>
      <button class="btn icon" type="button" aria-label="Ajustes, hay novedades">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button><code>punto</code>
    </div>
    <div>
      <button class="btn" type="button" aria-label="Bandeja de entrada, 12 mensajes">Bandeja de entrada<span class="inline" aria-hidden="true">12</span></button>
      <code>en botón</code>
    </div>
  </div>
  <div class="tools">
    <button class="btn" id="add" type="button">Llegó una notificación</button>
    <button class="btn" id="read" type="button">Marcar leídas</button>
  </div>

<script>
  const bell = document.getElementById('bell'), n = document.getElementById('bell-n');
  let count = 3;
  function render() {
    n.hidden = count === 0;
    n.textContent = count > 99 ? '99+' : count;
    bell.setAttribute('aria-label', count ? 'Notificaciones, ' + count + ' sin leer' : 'Notificaciones, ninguna sin leer');
  }
  document.getElementById('add').addEventListener('click', () => { count++; render(); });
  document.getElementById('read').addEventListener('click', () => { count = 0; render(); });
</script>
</body>
</html>
