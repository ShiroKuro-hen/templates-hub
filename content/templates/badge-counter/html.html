<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: #f6f1e7; color: #17130f; }
  h1 { margin: 0 0 16px; font-size: 1.2rem; letter-spacing: -.02em; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 22px; margin-bottom: 20px; }
  code { display: block; margin-top: 6px; font: 11px ui-monospace, monospace; color: #6b6258; }

  .btn { font: 600 14px system-ui, sans-serif; padding: 8px 14px; border: 2px solid #17130f; border-radius: 10px; background: #fffdf8;
    color: #17130f; box-shadow: 4px 4px 0 #17130f; cursor: pointer; transition: transform .1s, box-shadow .1s; }
  .btn:hover, .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #17130f; }
  .btn:focus-visible { outline: 3px solid #ff5a36; outline-offset: 3px; }
  .icon { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .count { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; padding: 0 5px; display: grid; place-items: center;
    border: 2px solid #17130f; border-radius: 999px; background: #ff5a36; color: #17130f; font: 700 11px system-ui, sans-serif; }
  .count[hidden] { display: none; }
  .dot { position: absolute; top: -5px; right: -5px; width: 14px; height: 14px; border: 2px solid #17130f; border-radius: 50%; background: #ff5a36; }
  .inline { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 8px; padding: 0 6px;
    border: 2px solid #17130f; border-radius: 999px; background: #ffd84d; font: 700 11px system-ui, sans-serif; vertical-align: middle; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; }
  .tools .btn { box-shadow: none; padding: 5px 10px; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <h1>Bandeja</h1>
  <div class="row">
    <div>
      <button class="btn icon" id="bell" type="button" aria-label="Notificaciones, 3 sin leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>
        <span class="count" id="bell-n" aria-hidden="true">3</span>
      </button><code>contador</code>
    </div>
    <div>
      <button class="btn icon" type="button" aria-label="Mensajes, más de 99 sin leer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="count" aria-hidden="true">99+</span>
      </button><code>tope 99+</code>
    </div>
    <div>
      <button class="btn icon" type="button" aria-label="Ajustes, hay novedades">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button><code>punto</code>
    </div>
    <div>
      <button class="btn" type="button" aria-label="Bandeja de entrada, 12 mensajes">Bandeja de entrada<span class="inline" aria-hidden="true">12</span></button>
      <code>en botón</code>
    </div>
  </div>
  <div class="tools">
    <button class="btn" id="add" type="button">Llegó una notificación</button>
    <button class="btn" id="read" type="button">Marcar leídas</button>
  </div>

<script>
  const bell = document.getElementById('bell'), n = document.getElementById('bell-n');
  let count = 3;
  function render() {
    n.hidden = count === 0;
    n.textContent = count > 99 ? '99+' : count;
    bell.setAttribute('aria-label', count ? 'Notificaciones, ' + count + ' sin leer' : 'Notificaciones, ninguna sin leer');
  }
  document.getElementById('add').addEventListener('click', () => { count++; render(); });
  document.getElementById('read').addEventListener('click', () => { count = 0; render(); });
</script>
</body>
</html>
