<style>
  .card{transition:transform .35s ease;--d:calc(var(--p) - 1.5);--rot:calc(var(--d) * 8deg);transform:translate(calc(var(--p) * 2px),calc(var(--p) * -2px));z-index:calc(4 - var(--p))}
  .stack:is(:hover,:focus-within,[data-open="true"]) .card{transform:translateX(calc(var(--d) * 26%)) rotate(var(--rot))}
  @media (prefers-reduced-motion:reduce){.card{--rot:0deg;transition:none}}
</style>
<div class="bg-page text-fg">
  <main class="mx-auto max-w-[560px]" aria-labelledby="fan-title">
    <h1 id="fan-title" class="mb-1 text-2xl font-bold tracking-[-0.02em]">Pila de fotos</h1>
    <p id="fan-hint" class="mb-4 text-[13px] text-muted">Pasa el cursor, toca la pila o enfócala para abrirla. Enter o Espacio la abren y las flechas cambian la foto de arriba.</p>
    <div class="grid h-[220px] place-items-center overflow-hidden rounded-lg border border-line bg-surface p-3.5">
      <div id="stack" role="group" tabindex="0" aria-label="Pila de fotos" aria-describedby="fan-hint" data-open="false" class="stack relative aspect-[4/3] w-[min(160px,46vw)] outline-offset-[6px] focus-visible:outline-2 focus-visible:outline-accent">
        <figure style="--p:0" class="card absolute inset-0 m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23ffd6a5%22%2F%3E%3Ccircle%20cx%3D%22160%22%20cy%3D%22110%22%20r%3D%2240%22%20fill%3D%22%23ff9770%22%2F%3E%3Cpath%20d%3D%22M0%20200L90%20110l60%2050%2070-70%20100%20110z%22%20fill%3D%22%236d597a%22%2F%3E%3C%2Fsvg%3E" alt="Montañas bajo un cielo anaranjado" width="320" height="200" loading="lazy" class="block h-full w-full object-cover"><figcaption class="absolute inset-x-0 bottom-0 border-t border-line bg-surface px-2.5 py-1.5 text-xs font-semibold">Montañas</figcaption></figure>
        <figure style="--p:1" class="card absolute inset-0 m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23bde0fe%22%2F%3E%3Ccircle%20cx%3D%22250%22%20cy%3D%2250%22%20r%3D%2222%22%20fill%3D%22%23ffc8dd%22%2F%3E%3Cpath%20d%3D%22M0%20120q40-20%2080%200t80%200%2080%200%2080%200v80H0z%22%20fill%3D%22%233a86ff%22%2F%3E%3Cpath%20d%3D%22M0%20150q40-20%2080%200t80%200%2080%200%2080%200v50H0z%22%20fill%3D%22%231d4ed8%22%2F%3E%3C%2Fsvg%3E" alt="Olas azules bajo un sol rosado" width="320" height="200" loading="lazy" class="block h-full w-full object-cover"><figcaption class="absolute inset-x-0 bottom-0 border-t border-line bg-surface px-2.5 py-1.5 text-xs font-semibold">Olas</figcaption></figure>
        <figure style="--p:2" class="card absolute inset-0 m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23d8f3dc%22%2F%3E%3Cpath%20d%3D%22M40%20170L70%2090l30%2080zM110%20170l30-110%2030%20110zM190%20170l30-85%2030%2085zM260%20170l25-65%2025%2065z%22%20fill%3D%22%232d6a4f%22%2F%3E%3Crect%20y%3D%22170%22%20width%3D%22320%22%20height%3D%2230%22%20fill%3D%22%2374c69d%22%2F%3E%3C%2Fsvg%3E" alt="Bosque de pinos con hierba clara" width="320" height="200" loading="lazy" class="block h-full w-full object-cover"><figcaption class="absolute inset-x-0 bottom-0 border-t border-line bg-surface px-2.5 py-1.5 text-xs font-semibold">Bosque</figcaption></figure>
        <figure style="--p:3" class="card absolute inset-0 m-0 overflow-hidden rounded-lg border border-line bg-surface shadow-sm"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20320%20200%22%3E%3Crect%20width%3D%22320%22%20height%3D%22200%22%20fill%3D%22%23fde2e4%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%2230%22%20width%3D%22110%22%20height%3D%2270%22%20rx%3D%2212%22%20fill%3D%22%23e63946%22%2F%3E%3Crect%20x%3D%22160%22%20y%3D%2230%22%20width%3D%22130%22%20height%3D%2250%22%20rx%3D%2212%22%20fill%3D%22%23f4a261%22%2F%3E%3Crect%20x%3D%2230%22%20y%3D%22120%22%20width%3D%22260%22%20height%3D%2250%22%20rx%3D%2212%22%20fill%3D%22%23457b9d%22%2F%3E%3C%2Fsvg%3E" alt="Bloques de colores redondeados" width="320" height="200" loading="lazy" class="block h-full w-full object-cover"><figcaption class="absolute inset-x-0 bottom-0 border-t border-line bg-surface px-2.5 py-1.5 text-xs font-semibold">Bloques</figcaption></figure>
      </div>
    </div>
    <div class="mt-3.5 flex flex-wrap items-center justify-between gap-3">
      <p id="now" aria-live="polite" class="m-0 text-[13px] text-muted">Arriba: Montañas</p>
      <button type="button" id="shuffle" class="cursor-pointer rounded-full border border-accent bg-accent px-4 py-2 text-[13px] font-semibold text-accent-ink hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Barajar</button>
    </div>
  </main>
</div>
<script>
  const stack = document.getElementById('stack'), now = document.getElementById('now');
  let order = [...stack.querySelectorAll('.card')];
  const STEPS = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  const render = () => {
    order.forEach((card, p) => card.style.setProperty('--p', p));
    now.textContent = `Arriba: ${order[0].querySelector('figcaption').textContent}`;
  };
  const rotate = (step) => {
    const k = (step + order.length) % order.length;
    order = [...order.slice(k), ...order.slice(0, k)];
    render();
  };
  stack.addEventListener('click', () => { stack.dataset.open = String(stack.dataset.open !== 'true'); });
  stack.addEventListener('keydown', (e) => {
    if (e.key in STEPS) { e.preventDefault(); rotate(STEPS[e.key]); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stack.click(); }
  });
  document.getElementById('shuffle').addEventListener('click', () => rotate(1));
</script>
