<section aria-labelledby="fab-title" class="relative min-h-80 rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <h2 id="fab-title" class="mb-1 text-base font-semibold">Proyecto Atlas</h2>
  <p class="text-slate-500 dark:text-slate-400">Usa el botón Crear para añadir contenido sin salir de la página.</p>
  <p id="fab-status" role="status" class="mt-3 min-h-6"></p>
  <div class="fab-wrap absolute bottom-5 right-5 flex flex-col-reverse items-end gap-3">
    <button type="button" aria-label="Crear" aria-expanded="false" aria-controls="fab-actions"
            class="group grid h-14 w-14 place-items-center rounded-full bg-blue-600 text-white shadow-md ring-1 ring-cyan-400/60 transition hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-blue-400 dark:text-slate-950">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="transition-transform group-aria-expanded:rotate-45 motion-reduce:transition-none"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <ul id="fab-actions" hidden class="flex flex-col items-end gap-2 [&_button]:inline-flex [&_button]:items-center [&_button]:gap-2 [&_button]:rounded-full [&_button]:border [&_button]:border-slate-200 [&_button]:bg-white [&_button]:px-3.5 [&_button]:py-2 [&_button]:font-medium [&_button]:shadow-sm hover:[&_button]:bg-blue-50 focus-visible:[&_button]:outline-2 focus-visible:[&_button]:outline-offset-2 focus-visible:[&_button]:outline-blue-500 dark:[&_button]:border-slate-700 dark:[&_button]:bg-slate-900 dark:hover:[&_button]:bg-slate-800 [&_svg]:text-blue-600 dark:[&_svg]:text-blue-400">
      <li><button type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>Nueva tarea</button></li>
      <li><button type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Subir archivo</button></li>
      <li><button type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>Invitar persona</button></li>
    </ul>
  </div>
</section>
<script>
  const fab = document.querySelector('[aria-controls="fab-actions"]'), menu = document.getElementById('fab-actions'), out = document.getElementById('fab-status');
  function toggle(open) {
    fab.setAttribute('aria-expanded', open);
    menu.hidden = !open;
    if (open) menu.querySelector('button').focus();
  }
  fab.addEventListener('click', () => toggle(menu.hidden));
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    out.textContent = `Elegiste: ${b.textContent.trim()}.`;
    toggle(false); fab.focus();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { toggle(false); fab.focus(); } });
  document.addEventListener('click', (e) => { if (!menu.hidden && !e.target.closest('.fab-wrap')) toggle(false); });
</script>
