<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:560px;margin:0 auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0 0 20px;font-size:16px}
  .row{margin-bottom:20px}
  .head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:600}
  .head span:last-child{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .track{position:relative;height:8px;overflow:hidden;border-radius:999px;background:var(--accent-soft)}
  .fill{display:block;height:100%;width:var(--p,0%);border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff);transition:width .16s}
  .ind{position:absolute;top:0;left:0;width:40%;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .ok .track{background:var(--ok-soft)} .ok .fill{background:var(--ok)}
  .err .track{background:var(--err-soft)} .err .fill{background:var(--err)}
  .note{margin:8px 0 0;color:var(--muted);font-size:13px}
  .err .note{color:var(--err)}
  .btn{font:inherit;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s}
  .btn:hover{background:var(--accent-soft)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.ind{animation-duration:3.2s}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h2 id="t">Estado de los procesos</h2>
  <div class="row">
    <div class="head"><span id="l1">Sincronizando contactos</span><span>En curso</span></div>
    <div class="track" role="progressbar" aria-labelledby="l1" aria-valuetext="Sincronizando"><span class="fill ind"></span></div>
  </div>
  <div class="row" id="up">
    <div class="head"><span id="l2">Subiendo informe-q3.pdf</span><span id="pct">0 %</span></div>
    <div class="track" role="progressbar" aria-labelledby="l2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="fill"></span></div>
    <p class="note" id="msg" aria-live="polite">Subiendo, quedan unos segundos.</p>
  </div>
  <div class="row err">
    <div class="head"><span id="l3">Copia de seguridad</span><span>38 %</span></div>
    <div class="track" role="progressbar" aria-labelledby="l3" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38"><span class="fill" style="--p:38%"></span></div>
    <p class="note">Se detuvo en 38 %. Revisa tu conexión y vuelve a iniciar la copia.</p>
  </div>
  <button class="btn" id="r" type="button">Reiniciar subida</button>
</section>
<script>
  const up = document.getElementById('up'), bar = up.querySelector('[role=progressbar]'),
        fill = up.querySelector('.fill'), pct = document.getElementById('pct'), msg = document.getElementById('msg');
  let p, timer;
  function draw() {
    const n = Math.round(p);
    fill.style.setProperty('--p', n + '%'); bar.setAttribute('aria-valuenow', n); pct.textContent = n + ' %';
  }
  function start() {
    clearInterval(timer); p = 0; draw(); up.className = 'row';
    msg.textContent = 'Subiendo, quedan unos segundos.';
    timer = setInterval(() => {
      p = Math.min(100, p + 4 + Math.random() * 10); draw();
      if (p === 100) { clearInterval(timer); up.classList.add('ok'); msg.textContent = 'Archivo subido correctamente.'; }
    }, 300);
  }
  document.getElementById('r').addEventListener('click', start);
  start();
</script>
</body>
</html>
