<style>@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}</style>
<div class="bg-page p-5 text-sm text-fg">
<section class="mx-auto max-w-[560px] rounded-lg border border-line bg-surface p-5 shadow-sm" aria-labelledby="t">
  <h2 id="t" class="mb-5 text-base font-semibold">Estado de los procesos</h2>
  <div class="mb-5">
    <div class="mb-2 flex justify-between gap-3 font-semibold"><span id="l1">Sincronizando contactos</span><span class="font-normal text-muted">En curso</span></div>
    <div class="relative h-2 overflow-hidden rounded-full bg-accent-soft" role="progressbar" aria-labelledby="l1" aria-valuetext="Sincronizando">
      <span class="absolute inset-y-0 left-0 w-2/5 animate-[slide_1.4s_ease-in-out_infinite] rounded-full bg-gradient-to-br from-accent-2 to-accent motion-reduce:animate-none"></span>
    </div>
  </div>
  <div class="mb-5">
    <div class="mb-2 flex justify-between gap-3 font-semibold"><span id="l2">Subiendo informe-q3.pdf</span><span id="pct" class="font-normal tabular-nums text-muted">0 %</span></div>
    <div class="h-2 overflow-hidden rounded-full bg-accent-soft" role="progressbar" aria-labelledby="l2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="fill" class="block h-full w-0 rounded-full bg-gradient-to-br from-accent-2 to-accent transition-[width] duration-150"></span>
    </div>
    <p id="msg" class="mt-2 text-[13px] text-muted" aria-live="polite">Subiendo, quedan unos segundos.</p>
  </div>
  <div class="mb-5">
    <div class="mb-2 flex justify-between gap-3 font-semibold"><span id="l3">Copia de seguridad</span><span class="font-normal tabular-nums text-muted">38 %</span></div>
    <div class="h-2 overflow-hidden rounded-full bg-err-soft" role="progressbar" aria-labelledby="l3" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38">
      <span class="block h-full w-[38%] rounded-full bg-err"></span>
    </div>
    <p class="mt-2 text-[13px] text-err">Se detuvo en 38 %. Revisa tu conexión y vuelve a iniciar la copia.</p>
  </div>
  <button id="r" type="button" class="rounded-lg border border-line bg-surface px-3.5 py-2 hover:bg-accent-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Reiniciar subida</button>
</section>
</div>
<script>
  const bar = document.querySelector('[aria-valuenow="0"]'), fill = document.getElementById('fill'),
        pct = document.getElementById('pct'), msg = document.getElementById('msg');
  let p, timer;
  function draw() {
    const n = Math.round(p);
    fill.style.width = n + '%'; bar.setAttribute('aria-valuenow', n); pct.textContent = n + ' %';
  }
  function start() {
    clearInterval(timer); p = 0; draw();
    msg.textContent = 'Subiendo, quedan unos segundos.';
    timer = setInterval(() => {
      p = Math.min(100, p + 4 + Math.random() * 10); draw();
      if (p === 100) { clearInterval(timer); msg.textContent = 'Archivo subido correctamente.'; }
    }, 300);
  }
  document.getElementById('r').addEventListener('click', start);
  start();
</script>
