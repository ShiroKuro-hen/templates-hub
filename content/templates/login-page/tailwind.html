<main class="grid min-h-screen place-items-center content-center gap-5 bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <section aria-labelledby="title" class="w-full max-w-[400px] rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8 dark:border-slate-700 dark:bg-slate-900">
    <div class="mb-6 flex items-center gap-2.5 text-base font-bold">
      <span aria-hidden="true" class="grid size-7 place-items-center rounded-md bg-gradient-to-br from-cyan-400 to-blue-600">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M3 13V3l10 10V3"/></svg>
      </span>
      Nimbo
    </div>
    <h1 class="mb-1 text-[22px] font-bold leading-tight">Inicia sesión</h1>
    <p class="mb-6 text-slate-500 dark:text-slate-400">Accede a tu espacio de trabajo.</p>

    <button type="button" class="flex w-full items-center justify-center gap-2.5 rounded-lg border border-slate-200 bg-white px-4 py-2.5 font-semibold hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Continuar con SSO de tu empresa
    </button>
    <div role="separator" class="my-5 flex items-center gap-3 text-[13px] text-slate-500 before:flex-1 before:border-t before:border-slate-200 after:flex-1 after:border-t after:border-slate-200 dark:before:border-slate-700 dark:after:border-slate-700">o con tu correo</div>

    <form id="login" class="grid gap-4">
      <label class="grid gap-1.5 font-semibold">Correo electrónico
        <input type="email" name="email" autocomplete="email" required placeholder="nombre@empresa.com"
               class="peer rounded-lg border border-slate-200 bg-transparent px-3 py-2 font-normal user-invalid:border-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-slate-700">
        <span class="hidden text-[13px] font-normal text-red-600 peer-user-invalid:block dark:text-red-400">Escribe un correo válido, por ejemplo nombre@empresa.com.</span>
      </label>
      <label class="grid gap-1.5 font-semibold">
        <span class="flex items-baseline justify-between">Contraseña <a href="#recuperar" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Olvidé mi contraseña</a></span>
        <span class="relative grid">
          <input id="pw" type="password" name="password" autocomplete="current-password" required minlength="8"
                 class="peer rounded-lg border border-slate-200 bg-transparent py-2 pl-3 pr-20 font-normal user-invalid:border-red-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-slate-700">
          <button type="button" id="toggle" aria-controls="pw" aria-pressed="false" class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-md px-2 py-1 text-[13px] font-medium text-blue-600 dark:text-blue-400">Mostrar</button>
          <span class="mt-1.5 hidden text-[13px] font-normal text-red-600 peer-user-invalid:block dark:text-red-400">La contraseña tiene al menos 8 caracteres.</span>
        </span>
      </label>
      <label class="flex items-center gap-2"><input type="checkbox" name="remember" class="size-4 accent-blue-600"> Mantener la sesión iniciada</label>
      <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:bg-blue-500 dark:text-slate-950">Iniciar sesión</button>
      <p id="status" role="status" hidden class="rounded-lg border border-emerald-600 bg-emerald-50 px-3 py-2.5 dark:bg-emerald-950">Sesión iniciada. Abriendo tu espacio de trabajo.</p>
    </form>
  </section>
  <p class="text-center text-slate-500 dark:text-slate-400">¿No tienes cuenta? <a href="#registro" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Crea una gratis</a></p>
</main>
<script>
  const pw = document.getElementById('pw'), toggle = document.getElementById('toggle');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Ocultar' : 'Mostrar';
    toggle.setAttribute('aria-pressed', show);
  });
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('status').hidden = false;
  });
</script>
