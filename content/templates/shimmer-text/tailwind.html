<style>
  .shine{color:var(--text)}
  .sk{display:block;height:12px;border-radius:min(var(--radius),6px);background:var(--accent-soft)}
  @media (prefers-reduced-motion:no-preference){
    @supports ((background-clip:text) or (-webkit-background-clip:text)){
      .shine{background:linear-gradient(100deg,var(--text) 40%,var(--accent) 50%,var(--text) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s linear infinite}
    }
    .sk{background:linear-gradient(90deg,var(--accent-soft) 25%,var(--surface) 50%,var(--accent-soft) 75%) 0 0/200% 100%;animation:sk 1.4s ease-in-out infinite}
    @keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
    @keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
  }
</style>
<section class="mx-auto max-w-[640px] rounded-lg border border-line bg-surface px-6 py-7 text-sm text-fg shadow-sm" aria-labelledby="titulo">
  <span class="inline-block rounded-full border border-line bg-accent-soft px-2.5 py-0.5 text-xs font-semibold"><span class="shine">Nuevo</span></span>
  <h1 id="titulo" class="shine mt-3 text-[clamp(24px,6vw,34px)] font-bold leading-tight tracking-tight">Informes que se escriben solos</h1>
  <p class="mt-3 max-w-[52ch] text-muted">Conecta tus datos y recibe cada lunes un resumen claro, con cifras y próximos pasos.</p>
  <a href="#" class="mt-4.5 inline-block font-semibold text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Ver novedades</a>
</section>
<div class="mx-auto mt-4 flex max-w-[640px] flex-col gap-2.5 rounded-lg border border-line bg-surface px-6 py-5 shadow-sm" role="status">
  <span class="sr-only">Cargando resumen</span>
  <span class="sk h-[18px] w-3/5" aria-hidden="true"></span>
  <span class="sk" aria-hidden="true"></span>
  <span class="sk w-[70%]" aria-hidden="true"></span>
</div>
