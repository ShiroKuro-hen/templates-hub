<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .news{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:center;gap:20px 32px;max-width:960px;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .news h2{margin:0;font-size:22px;line-height:1.25}
  .lead{margin:6px 0 0;color:var(--muted);max-width:52ch}
  .news label{display:block;margin-bottom:6px;font-weight:500}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  .row input{flex:1 1 200px;min-width:0;padding:9px 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  .row input[aria-invalid=true]{border-color:var(--err)}
  .row button{padding:9px 16px;font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer;transition:filter .14s}
  .row button:hover{filter:brightness(1.08)}
  input:focus-visible,button:focus-visible,.ok:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .err{margin:6px 0 0;color:var(--err);font-size:13px}
  .note{margin:8px 0 0;color:var(--muted);font-size:13px}
  .ok{display:flex;align-items:flex-start;gap:12px;margin:0;border-radius:var(--radius)}
  .ok:not(:empty)::before{content:"✓";flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:700;color:var(--surface);background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="news" aria-labelledby="nl-title">
  <div>
    <h2 id="nl-title">Recibe las novedades del producto</h2>
    <p class="lead">Un correo al mes con lanzamientos, guías y cambios importantes. Te das de baja con un clic.</p>
  </div>
  <div>
    <form id="nl" novalidate>
      <label for="nl-email">Correo de trabajo</label>
      <div class="row">
        <input id="nl-email" type="email" name="email" autocomplete="email" placeholder="nombre@empresa.com" required pattern=".+@.+\..+" aria-describedby="nl-err nl-note">
        <button type="submit">Suscribirme</button>
      </div>
      <p class="err" id="nl-err" hidden></p>
      <p class="note" id="nl-note">Usamos tu correo solo para este boletín.</p>
    </form>
    <p class="ok" id="nl-ok" role="status" tabindex="-1"></p>
  </div>
</section>
<script>
  const form = document.getElementById('nl'), email = document.getElementById('nl-email'),
        err = document.getElementById('nl-err'), ok = document.getElementById('nl-ok');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = email.validity;
    const msg = v.valueMissing ? 'Escribe tu correo para suscribirte.'
      : v.typeMismatch || v.patternMismatch ? 'Revisa el correo: necesita @ y un dominio, por ejemplo ana@empresa.com.' : '';
    err.textContent = msg; err.hidden = !msg; email.setAttribute('aria-invalid', !!msg);
    if (msg) return email.focus();
    form.hidden = true;
    ok.textContent = `Listo. Te enviamos un enlace a ${email.value} para confirmar la suscripción.`;
    ok.focus();
  });
  email.addEventListener('input', () => {
    if (!err.hidden && email.checkValidity()) { err.hidden = true; email.setAttribute('aria-invalid', 'false'); }
  });
</script>
</body>
</html>
