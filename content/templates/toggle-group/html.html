<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding:16px 20px;border-bottom:1px solid var(--border)}
  h2{margin:0;font-size:16px;font-weight:600}
  .sum{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .row div{flex:1;min-width:0}
  .row label{font-weight:600}
  .row p{margin:2px 0 0;color:var(--muted)}
  .badge{margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
  .st{order:1;min-width:6em;text-align:right;color:var(--muted);font-size:13px}
  .st::after{content:"Desactivado"}
  input:checked+.st{color:var(--text)}
  input:checked+.st::after{content:"Activado"}
  input:disabled+.st::after{content:"No disponible"}
  input[role=switch]{order:2;appearance:none;position:relative;flex:none;width:40px;height:24px;margin:0;border:1px solid var(--border);border-radius:999px;background:var(--bg);cursor:pointer;transition:background .14s,border-color .14s}
  input[role=switch]::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .14s,background .14s}
  input[role=switch]:checked{border-color:transparent;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  input[role=switch]:checked::before{transform:translateX(16px);background:var(--accent-ink)}
  input[role=switch]:disabled{opacity:.5;cursor:not-allowed}
  input[role=switch]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:420px){.st{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="card" role="group" aria-labelledby="t">
  <header><h2 id="t">Funciones del espacio</h2><p class="sum" aria-live="polite"><b id="n">3</b> de 4 activadas</p></header>
  <div class="row"><div><label for="f1">Autoguardado</label><p id="d1">Guarda tus cambios cada 30 segundos.</p></div><input id="f1" type="checkbox" role="switch" checked aria-describedby="d1"><span class="st" aria-hidden="true"></span></div>
  <div class="row"><div><label for="f2">Comentarios en tiempo real</label><p id="d2">Muestra los comentarios del equipo sin recargar.</p></div><input id="f2" type="checkbox" role="switch" checked aria-describedby="d2"><span class="st" aria-hidden="true"></span></div>
  <div class="row"><div><label for="f3">Vista previa pública</label><p id="d3">Cualquiera con el enlace puede ver el documento.</p></div><input id="f3" type="checkbox" role="switch" aria-describedby="d3"><span class="st" aria-hidden="true"></span></div>
  <div class="row"><div><label for="f4">Resumen semanal</label><p id="d4">Recibe los cambios de la semana cada lunes.</p></div><input id="f4" type="checkbox" role="switch" checked aria-describedby="d4"><span class="st" aria-hidden="true"></span></div>
  <div class="row"><div><label for="f5">Registro de auditoría<span class="badge">Plan Business</span></label><p id="d5">Disponible al mejorar tu plan.</p></div><input id="f5" type="checkbox" role="switch" disabled aria-describedby="d5"><span class="st" aria-hidden="true"></span></div>
</div>
<script>
  const sw = [...document.querySelectorAll('[role=switch]:not(:disabled)')];
  document.addEventListener('change', () => (n.textContent = sw.filter((i) => i.checked).length));
</script>
</body>
</html>
