<div class="relative min-h-[300px] max-w-lg bg-page p-5 text-sm text-fg">
  <label for="q" class="mb-1.5 block font-semibold">Buscar en la consola</label>
  <div class="flex items-center gap-2 rounded-lg border border-line bg-surface px-3 shadow-sm focus-within:border-accent focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent">
    <svg class="flex-none text-muted" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="lb" aria-autocomplete="list" autocomplete="off" placeholder="Servicios, facturas, usuarios" class="min-w-0 flex-1 bg-transparent py-2.5 outline-none">
  </div>
  <ul id="lb" role="listbox" aria-label="Sugerencias" hidden class="absolute inset-x-5 mt-1.5 list-none rounded-lg border border-line bg-surface p-1.5 shadow-md"></ul>
  <p id="st" aria-live="polite" class="mt-2.5 text-muted"></p>
</div>
<script>
  const data = [['Balanceadores de carga', 'Red'], ['Bases de datos gestionadas', 'Datos'], ['Buckets de almacenamiento', 'Datos'],
    ['Claves de API', 'Seguridad'], ['Facturación mensual', 'Cuenta'], ['Funciones sin servidor', 'Cómputo'],
    ['Máquinas virtuales', 'Cómputo'], ['Registros de auditoría', 'Seguridad'], ['Usuarios y roles', 'Cuenta']];
  let recent = ['Máquinas virtuales', 'Claves de API'], opts = [], active = -1;
  const q = document.getElementById('q'), lb = document.getElementById('lb');
  const OPT = 'relative flex cursor-pointer justify-between gap-3 rounded-md px-2.5 py-2 hover:bg-accent-soft aria-selected:bg-accent-soft aria-selected:before:absolute aria-selected:before:inset-y-1.5 aria-selected:before:left-0 aria-selected:before:w-[3px] aria-selected:before:rounded-full aria-selected:before:bg-gradient-to-br aria-selected:before:from-accent-2 aria-selected:before:to-accent aria-selected:before:content-[\'\']';
  const esc = (s) => s.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  const hl = (s, t) => { const i = s.toLowerCase().indexOf(t.toLowerCase());
    return i < 0 || !t ? esc(s) : esc(s.slice(0, i)) + '<mark class="bg-transparent font-semibold text-accent">' + esc(s.slice(i, i + t.length)) + '</mark>' + esc(s.slice(i + t.length)); };
  function open() {
    const t = q.value.trim();
    opts = t ? data.filter(([n]) => n.toLowerCase().includes(t.toLowerCase())) : recent.map((n) => data.find((d) => d[0] === n));
    active = -1;
    lb.innerHTML = (t ? '' : '<li role="presentation" class="px-2.5 pb-1 pt-1.5 text-xs text-muted">Búsquedas recientes</li>') + (opts.length
      ? opts.map(([n, c], i) => `<li role="option" id="o${i}" aria-selected="false" class="${OPT}">${hl(n, t)}<small class="text-muted">${c}</small></li>`).join('')
      : `<li role="presentation" class="p-2.5 text-muted">Sin resultados para “${esc(t)}”. Prueba con otro término.</li>`);
    lb.hidden = false; q.setAttribute('aria-expanded', 'true'); q.removeAttribute('aria-activedescendant');
  }
  function close() { lb.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); }
  function move(d) {
    if (!opts.length) return;
    active = (active + d + opts.length) % opts.length;
    lb.querySelectorAll('[role=option]').forEach((o, i) => o.setAttribute('aria-selected', i === active));
    q.setAttribute('aria-activedescendant', 'o' + active);
  }
  function pick(i) {
    const n = opts[i][0]; q.value = n; close();
    recent = [n, ...recent.filter((r) => r !== n)].slice(0, 4);
    document.getElementById('st').textContent = `Abriendo ${n}.`;
  }
  q.addEventListener('input', open);
  q.addEventListener('focus', open);
  q.addEventListener('blur', () => setTimeout(close, 120));
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); lb.hidden ? open() : move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter' && active > -1) { e.preventDefault(); pick(active); }
    else if (e.key === 'Escape') close();
  });
  lb.addEventListener('mousedown', (e) => { const o = e.target.closest('[role=option]'); if (o) { e.preventDefault(); pick(+o.id.slice(1)); } });
</script>
