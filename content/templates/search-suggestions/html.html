<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .ss{position:relative;max-width:520px;min-height:300px}
  label{display:block;font-weight:600;margin-bottom:6px}
  .field{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .14s}
  .field:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
  .field svg{flex:none;color:var(--muted)}
  input{flex:1;min-width:0;padding:10px 0;border:0;background:none;color:inherit;font:inherit;outline:0}
  [role=listbox]{position:absolute;left:0;right:0;margin:6px 0 0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  [role=listbox][hidden]{display:none}
  .group{padding:6px 10px 4px;font-size:12px;color:var(--muted)}
  [role=option]{position:relative;display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:6px;cursor:pointer}
  [role=option] small{color:var(--muted)}
  [role=option]:hover{background:var(--accent-soft)}
  [role=option][aria-selected=true]{background:var(--accent-soft)}
  [role=option][aria-selected=true]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  mark{background:none;color:var(--accent);font-weight:600}
  .none{padding:10px;color:var(--muted)}
  .status{margin-top:10px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="ss">
  <label for="q">Buscar en la consola</label>
  <div class="field">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="lb" aria-autocomplete="list" autocomplete="off" placeholder="Servicios, facturas, usuarios">
  </div>
  <ul id="lb" role="listbox" aria-label="Sugerencias" hidden></ul>
  <p class="status" id="st" aria-live="polite"></p>
</div>
<script>
  const data = [['Balanceadores de carga', 'Red'], ['Bases de datos gestionadas', 'Datos'], ['Buckets de almacenamiento', 'Datos'],
    ['Claves de API', 'Seguridad'], ['Facturación mensual', 'Cuenta'], ['Funciones sin servidor', 'Cómputo'],
    ['Máquinas virtuales', 'Cómputo'], ['Registros de auditoría', 'Seguridad'], ['Usuarios y roles', 'Cuenta']];
  let recent = ['Máquinas virtuales', 'Claves de API'], opts = [], active = -1;
  const q = document.getElementById('q'), lb = document.getElementById('lb');
  const esc = (s) => s.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  const hl = (s, t) => { const i = s.toLowerCase().indexOf(t.toLowerCase());
    return i < 0 || !t ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + t.length)) + '</mark>' + esc(s.slice(i + t.length)); };
  function open() {
    const t = q.value.trim();
    opts = t ? data.filter(([n]) => n.toLowerCase().includes(t.toLowerCase())) : recent.map((n) => data.find((d) => d[0] === n));
    active = -1;
    lb.innerHTML = (t ? '' : '<li class="group" role="presentation">Búsquedas recientes</li>') + (opts.length
      ? opts.map(([n, c], i) => `<li role="option" id="o${i}" aria-selected="false">${hl(n, t)}<small>${c}</small></li>`).join('')
      : `<li class="none" role="presentation">Sin resultados para “${esc(t)}”. Prueba con otro término.</li>`);
    lb.hidden = false; q.setAttribute('aria-expanded', 'true'); q.removeAttribute('aria-activedescendant');
  }
  function close() { lb.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); }
  function move(d) {
    if (!opts.length) return;
    active = (active + d + opts.length) % opts.length;
    lb.querySelectorAll('[role=option]').forEach((o, i) => o.setAttribute('aria-selected', i === active));
    q.setAttribute('aria-activedescendant', 'o' + active);
  }
  function pick(i) {
    const n = opts[i][0]; q.value = n; close();
    recent = [n, ...recent.filter((r) => r !== n)].slice(0, 4);
    document.getElementById('st').textContent = `Abriendo ${n}.`;
  }
  q.addEventListener('input', open);
  q.addEventListener('focus', open);
  q.addEventListener('blur', () => setTimeout(close, 120));
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); lb.hidden ? open() : move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter' && active > -1) { e.preventDefault(); pick(active); }
    else if (e.key === 'Escape') close();
  });
  lb.addEventListener('mousedown', (e) => { const o = e.target.closest('[role=option]'); if (o) { e.preventDefault(); pick(+o.id.slice(1)); } });
</script>
</body>
</html>
