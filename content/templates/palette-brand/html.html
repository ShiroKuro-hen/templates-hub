<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paleta Ion</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin:0 0 4px; font-size:1.25rem; letter-spacing:-.01em; }
  .lead { margin:0 0 16px; color:var(--muted); }
  .swatches { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin:0; padding:0; list-style:none; }
  .sw { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); box-shadow:var(--shadow); }
  .sw i { display:block; height:56px; border-bottom:1px solid var(--border); }
  .sw div { padding:8px 10px; }
  .sw b { display:block; font-weight:600; }
  .sw code { display:block; color:var(--muted); font:12px ui-monospace, "Cascadia Code", Menlo, monospace; }
  .sw span { display:block; font-size:12px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <h1>Paleta Ion</h1>
  <p class="lead">Cambia entre tema claro y oscuro para ver los valores activos.</p>
  <ul class="swatches" id="sw" aria-label="Paleta Ion"></ul>
<script>
  const T = [['bg','Fondo'],['surface','Superficie'],['text','Texto'],['muted','Atenuado'],['border','Borde'],
    ['accent','Acento'],['accent-soft','Acento suave'],['accent-ink','Texto sobre acento'],
    ['ok','Ok'],['warn','Aviso'],['err','Error'],['info','Info'],
    ['ok-soft','Ok suave'],['warn-soft','Aviso suave'],['err-soft','Error suave'],['info-soft','Info suave']];
  const root = document.documentElement, sw = document.getElementById('sw');
  sw.innerHTML = T.map(([v, n]) =>
    `<li class="sw"><i style="background:var(--${v})"></i><div><b>${n}</b><code>--${v}</code><span data-v="${v}"></span></div></li>`).join('');
  function paint() {
    const cs = getComputedStyle(root);
    sw.querySelectorAll('span').forEach((s) => { s.textContent = cs.getPropertyValue('--' + s.dataset.v).trim().toUpperCase(); });
  }
  new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  paint();
</script>
</body>
</html>
