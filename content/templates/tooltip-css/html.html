<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tooltips solo CSS</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{overflow-x:hidden;margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin:0 0 4px; font-size:18px; font-weight:600; letter-spacing:-.01em; }
  .lead { margin:0 0 56px; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:56px; }
  .btn { font:500 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif; padding:9px 14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 1px 2px rgba(14,23,38,.06); cursor:pointer; transition:border-color .14s, background .14s; }
  .btn:hover { border-color:var(--accent); background:var(--accent-soft); }
  .help { width:32px; height:32px; padding:0; border-radius:999px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-color:transparent; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .tip { position:relative; display:inline-block; }
  .tip [role="tooltip"] { position:absolute; left:50%; bottom:calc(100% + 8px); z-index:10; width:max-content; max-width:220px; padding:6px 10px; font-size:13px; line-height:1.4; text-align:center; color:var(--surface); background:var(--text); border-radius:6px; box-shadow:var(--shadow); opacity:0; visibility:hidden; transform:translate(-50%, 4px); transition:opacity .14s, transform .14s, visibility 0s .14s; }
  .tip [role="tooltip"]::after { content:""; position:absolute; left:50%; top:100%; margin-left:-5px; border:5px solid transparent; border-top-color:var(--text); }
  .tip [role="tooltip"]::before { content:""; position:absolute; left:0; right:0; top:100%; height:8px; } /* puente: el puntero no la pierde */
  .tip.below [role="tooltip"] { bottom:auto; top:calc(100% + 8px); transform:translate(-50%, -4px); }
  .tip.below [role="tooltip"]::after { top:auto; bottom:100%; border-top-color:transparent; border-bottom-color:var(--text); }
  .tip.below [role="tooltip"]::before { top:auto; bottom:100%; }
  .tip:hover [role="tooltip"], .tip:has(:focus-visible) [role="tooltip"] { opacity:1; visibility:visible; transform:translate(-50%, 0); transition-delay:0s; }
  @media (prefers-reduced-motion:reduce) { .btn, .tip [role="tooltip"] { transition:none; } }
</style>
</head>
<body>
<h1>Barra de acciones</h1>
<p class="lead">Pasa el cursor o usa Tab sobre cada botón.</p>

<div class="row">
  <span class="tip">
    <button type="button" class="btn" aria-describedby="t1">Copiar enlace</button>
    <span role="tooltip" id="t1">Copia el enlace al portapapeles</span>
  </span>
  <span class="tip">
    <button type="button" class="btn" aria-describedby="t2">Compartir</button>
    <span role="tooltip" id="t2">Invita a tu equipo por correo</span>
  </span>
  <span class="tip below">
    <button type="button" class="btn help" aria-describedby="t3" aria-label="Ayuda sobre archivar">?</button>
    <span role="tooltip" id="t3">Archivar oculta el proyecto sin borrarlo. Puedes recuperarlo cuando quieras.</span>
  </span>
</div>
</body>
</html>
