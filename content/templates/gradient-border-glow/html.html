<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borde con brillo</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  @property --gbg-angle{syntax:'<angle>';inherits:true;initial-value:0deg}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{--dur:4s;display:flex;flex-wrap:wrap;align-items:center;gap:32px;padding:32px 24px}
  .gbg{position:relative;isolation:isolate;display:inline-block;padding:0;border:0;border-radius:var(--radius);background:none;color:inherit;font:inherit;text-align:left;animation:gbg-spin var(--dur) linear infinite}
  .gbg::before,.gbg::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:conic-gradient(from var(--gbg-angle),var(--accent-2,#22d3ee),var(--accent,#2f5bff),var(--accent-2,#22d3ee))}
  .gbg::after{z-index:-2;filter:blur(18px);opacity:.45;transition:opacity .2s}
  .gbg:hover::after,.gbg:focus-visible::after{opacity:.9}
  .gbg-card{width:260px;max-width:100%}
  .gbg-face{display:block;margin:2px;padding:18px;border-radius:calc(var(--radius) - 2px);background:var(--surface)}
  .gbg-face h3{margin:0 0 4px;font-size:15px}
  .gbg-face p{margin:0;color:var(--muted)}
  .gbg-btn{cursor:pointer}
  .gbg-btn .gbg-face{padding:10px 20px;font-weight:600}
  .gbg-btn:hover .gbg-face{color:var(--accent)}
  @keyframes gbg-spin{to{--gbg-angle:360deg}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.gbg{animation:none}.gbg::after{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <article class="gbg gbg-card">
    <div class="gbg-face">
      <h3>Plan Empresa</h3>
      <p>Informes avanzados, soporte prioritario y espacios ilimitados.</p>
    </div>
  </article>
  <button type="button" class="gbg gbg-btn"><span class="gbg-face">Activar notificaciones</span></button>
</main>
</body>
</html>
