<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:460px;margin:0 auto;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0;font-size:18px;line-height:1.3}
  .sub{margin:2px 0 16px;color:var(--muted)}
  label{display:block;margin-bottom:6px;font-weight:600}
  .box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:text;transition:border-color .14s}
  .box:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .chips{display:contents;margin:0;padding:0;list-style:none}
  .chip{display:inline-flex;align-items:center;gap:2px;padding:1px 2px 1px 10px;background:var(--accent-soft);color:var(--text);border:1px solid var(--border);border-radius:999px}
  .chip button{display:grid;place-items:center;width:20px;height:20px;padding:0;font:inherit;line-height:1;color:var(--muted);background:none;border:0;border-radius:999px;cursor:pointer}
  .chip button:hover{color:var(--text)}
  .chip button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  #q{flex:1 1 120px;min-width:0;font:inherit;color:var(--text);background:transparent;border:0;padding:4px;outline:0}
  #list{max-height:220px;margin:8px 0 0;padding:4px;overflow:auto;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  [hidden]{display:none!important}
  [role=option]{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
  [role=option].act{background:var(--accent-soft)}
  [role=option]::before{content:"";flex:none;width:16px;height:16px;box-sizing:border-box;border:1px solid var(--border);border-radius:4px;background:var(--surface)}
  [role=option][aria-selected=true]{font-weight:600}
  [role=option][aria-selected=true]::before{content:"\2713";display:grid;place-items:center;font-size:11px;color:#fff;border-color:transparent;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .empty{padding:10px;color:var(--muted)}
  .count{margin:8px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <h1>Áreas del proyecto</h1>
  <p class="sub">Elige las áreas que participan. Puedes escribir para buscar.</p>
  <label id="lbl" for="q">Áreas</label>
  <div class="box" id="box">
    <ul class="chips" id="chips" aria-label="Áreas elegidas"></ul>
    <input id="q" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off" placeholder="Buscar áreas">
  </div>
  <ul id="list" role="listbox" aria-labelledby="lbl" aria-multiselectable="true" hidden></ul>
  <p class="count" id="count" role="status"></p>
</main>
<script>
  const D = ['Frontend', 'Backend', 'Diseño', 'Calidad (QA)', 'Infraestructura', 'Datos', 'Seguridad', 'Móvil', 'Producto'];
  const sel = new Set(['Frontend', 'Diseño']), $ = (id) => document.getElementById(id), q = $('q'), list = $('list');
  const norm = (s) => s.normalize('NFD').replace(/\p{M}/g, '').toLowerCase();
  let act = 0, shown = D;
  const open = (v) => { list.hidden = !v; q.setAttribute('aria-expanded', v); };
  function toggle(o) { sel.has(o) ? sel.delete(o) : sel.add(o); render(); }
  function render() {
    shown = D.filter((o) => norm(o).includes(norm(q.value)));
    act = Math.min(act, Math.max(shown.length - 1, 0));
    list.replaceChildren(...(shown.length ? shown.map((o, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option'); li.id = 'o' + D.indexOf(o); li.textContent = o;
      li.setAttribute('aria-selected', sel.has(o)); if (i === act) li.className = 'act';
      li.onmousedown = (e) => { e.preventDefault(); toggle(o); };
      return li;
    }) : [Object.assign(document.createElement('li'), { className: 'empty', textContent: 'No hay áreas con ese nombre. Prueba otra palabra.' })]));
    q.setAttribute('aria-activedescendant', shown[act] ? 'o' + D.indexOf(shown[act]) : '');
    list.querySelector('.act')?.scrollIntoView({ block: 'nearest' });
    $('chips').replaceChildren(...[...sel].map((o) => {
      const li = document.createElement('li'), b = document.createElement('button');
      li.className = 'chip'; li.append(o, b);
      b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Quitar ' + o);
      b.onclick = () => { sel.delete(o); render(); q.focus(); };
      return li;
    }));
    $('count').textContent = sel.size ? `${sel.size} ${sel.size > 1 ? 'áreas elegidas' : 'área elegida'}.` : 'Aún no elegiste ninguna área. Abre la lista y marca una.';
  }
  q.oninput = () => { act = 0; open(true); render(); };
  q.onfocus = () => { open(true); render(); };
  q.onblur = () => open(false);
  $('box').onclick = () => q.focus();
  q.onkeydown = (e) => {
    const k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); open(true); act = (act + (k === 'ArrowDown' ? 1 : -1) + shown.length) % (shown.length || 1); render(); }
    else if (k === 'Enter' && !list.hidden && shown[act]) { e.preventDefault(); toggle(shown[act]); }
    else if (k === 'Escape') { if (!list.hidden) { e.preventDefault(); open(false); } else { q.value = ''; render(); } }
    else if (k === 'Backspace' && !q.value && sel.size) { sel.delete([...sel].pop()); render(); }
  };
  render();
</script>
</body>
</html>
