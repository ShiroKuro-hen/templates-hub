<section class="w-full max-w-[340px] overflow-hidden rounded-lg border border-line bg-surface shadow-sm">
  <h2 id="ttl" class="m-0 border-b border-line px-3 py-2.5 text-sm font-semibold">Proyecto web</h2>
  <ul id="tree" role="tree" aria-label="Archivos del proyecto" class="max-h-80 list-none overflow-auto p-1.5"></ul>
  <p id="sel" role="status" aria-live="polite" class="m-0 border-t border-line px-3 py-2 text-[13px] break-all text-muted"></p>
</section>
<style>
  [role=treeitem]{outline:none}
  [role=treeitem]:focus-visible>.row{outline:2px solid var(--accent);outline-offset:-2px}
  [aria-selected=true]>.row{background:var(--accent-soft);font-weight:600}
  [aria-selected=true]>.row::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(135deg,var(--accent-2,#22d3ee),var(--accent,#2f5bff))}
  [aria-expanded=true]>.row>.chev{transform:rotate(90deg)}
</style>
<script>
  const TREE = [
    { n: 'src', c: [
      { n: 'components', c: [{ n: 'button.ts' }, { n: 'card.css' }] },
      { n: 'styles', c: [{ n: 'tokens.css' }] },
      { n: 'index.ts' },
    ] },
    { n: 'public', c: [{ n: 'logo.svg' }, { n: 'hero.jpg' }] },
    { n: 'docs', c: [{ n: 'leeme.md' }] },
    { n: 'package.json' },
    { n: 'tsconfig.json' },
  ];
  const KIND = { ts: 'ts', css: 'css', json: 'json', md: 'md', svg: 'img', jpg: 'img' };
  const COLOR = { folder: 'text-accent', ts: 'text-info', css: 'text-ok', json: 'text-warn', md: 'text-muted', img: 'text-err' };
  const FOLDER = 'M2 4.5a1 1 0 0 1 1-1h3.2l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z';
  const FILE = 'M4 1.5h5l3.5 3.5v8.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2.5a1 1 0 0 1 1-1z';
  const GLYPH = { ts: 'M6 8.5 4.5 10 6 11.5M10 8.5l1.5 1.5L10 11.5', css: 'M5.5 8.5h5M5.5 10.5h5M5.5 12.5h3', json: 'M6 8.5h-.5v3H6M10 8.5h.5v3h-.5', md: 'M5 11.5v-3l1.5 2 1.5-2v3M10.5 8.5v3', img: 'M5 11.5l2-2.5 1.5 1.8 1-1.2 1.5 1.9z' };
  const SVG = 'fill-none stroke-current stroke-[1.5] [stroke-linecap:round] [stroke-linejoin:round]';
  const CHEV = `<svg class="chev h-3 w-3 flex-none ${SVG} stroke-2 text-muted transition-transform motion-reduce:transition-none" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
  const icon = (k) => `<svg class="h-4 w-4 flex-none ${SVG} ${COLOR[k]}" viewBox="0 0 16 16" aria-hidden="true"><path d="${k === 'folder' ? FOLDER : FILE}"/>${k === 'folder' ? '' : `<path d="${GLYPH[k]}"/>`}</svg>`;

  const state = { open: new Set(['src']), sel: 'src/index.ts', focus: 'src/index.ts' };
  const tree = document.getElementById('tree'), caption = document.getElementById('sel');

  function nodes(list, level, base) {
    return list.map((n) => {
      const path = base ? `${base}/${n.n}` : n.n;
      const dir = Boolean(n.c), open = state.open.has(path);
      const kids = dir && open ? `<ul role="group" class="ml-3.5 list-none border-l border-line pl-1.5">${nodes(n.c, level + 1, path)}</ul>` : '';
      return `<li role="treeitem" aria-level="${level}"${dir ? ` aria-expanded="${open}"` : ''} aria-selected="${state.sel === path}" aria-label="${n.n}" data-path="${path}" tabindex="${state.focus === path ? 0 : -1}"><div class="row relative flex cursor-pointer select-none items-center gap-2 rounded-md px-2 py-1.5 hover:bg-accent-soft">${dir ? CHEV : '<span class="w-3 flex-none"></span>'}${icon(dir ? 'folder' : KIND[n.n.split('.').pop()])}<span class="min-w-0 truncate">${n.n}</span></div>${kids}</li>`;
    }).join('');
  }
  function draw(focus) {
    tree.innerHTML = nodes(TREE, 1, '');
    caption.textContent = `Seleccionado: ${state.sel}`;
    tree.querySelector(`[data-path="${focus}"]`)?.focus();
  }
  function toggle(path) {
    if (state.open.has(path)) state.open.delete(path);
    else state.open.add(path);
  }
  function focusOn(path) {
    state.focus = path;
    draw(path);
  }
  function activate(li) {
    const path = li.dataset.path;
    state.sel = path;
    if (li.hasAttribute('aria-expanded')) toggle(path);
    focusOn(path);
  }
  function typeahead(items, i, ch) {
    const order = [...items.slice(i + 1), ...items.slice(0, i + 1)];
    return order.find((el) => el.getAttribute('aria-label').toLowerCase().startsWith(ch.toLowerCase()));
  }

  tree.addEventListener('keydown', (e) => {
    const li = e.target.closest('[role=treeitem]');
    if (!li) return;
    const path = li.dataset.path, dir = li.hasAttribute('aria-expanded'), open = state.open.has(path);
    const items = [...tree.querySelectorAll('[role=treeitem]')], i = items.indexOf(li);
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      activate(li);
      return;
    }
    const expand = e.key === 'ArrowRight', horizontal = expand || e.key === 'ArrowLeft';
    if (horizontal && dir && expand !== open) {
      e.preventDefault();
      toggle(path);
      focusOn(path);
      return;
    }
    const targets = {
      ArrowDown: items[i + 1], ArrowUp: items[i - 1], Home: items[0], End: items[items.length - 1],
      ArrowRight: li.querySelector('[role=treeitem]'), ArrowLeft: li.parentElement.closest('[role=treeitem]'),
    };
    const target = targets[e.key] ?? (e.key.length === 1 ? typeahead(items, i, e.key) : undefined);
    if (!target) return;
    e.preventDefault();
    focusOn(target.dataset.path);
  });
  tree.addEventListener('click', (e) => {
    const li = e.target.closest('[role=treeitem]');
    if (li) activate(li);
  });
  draw();
</script>
