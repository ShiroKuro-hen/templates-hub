<section class="mx-auto max-w-[560px] overflow-hidden rounded-lg border border-line bg-surface text-sm text-fg shadow-sm" aria-labelledby="title">
  <header class="flex flex-wrap items-start justify-between gap-3 border-b border-line px-4 py-3.5">
    <div>
      <h2 id="title" class="text-[17px] font-semibold">Próximos días</h2>
      <p id="count" class="mt-0.5 text-[13px] text-muted"></p>
    </div>
    <div id="filters" role="group" aria-label="Filtrar por categoría" class="flex flex-wrap gap-1.5">
      <button type="button" class="rounded-full border border-line bg-surface px-3 py-1 text-[13px] font-medium transition-colors hover:border-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[pressed=true]:border-accent aria-[pressed=true]:bg-accent aria-[pressed=true]:text-accent-ink" aria-pressed="true" data-f="all">Todos</button>
      <button type="button" class="rounded-full border border-line bg-surface px-3 py-1 text-[13px] font-medium transition-colors hover:border-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[pressed=true]:border-accent aria-[pressed=true]:bg-accent aria-[pressed=true]:text-accent-ink" aria-pressed="false" data-f="reunion">Reuniones</button>
      <button type="button" class="rounded-full border border-line bg-surface px-3 py-1 text-[13px] font-medium transition-colors hover:border-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[pressed=true]:border-accent aria-[pressed=true]:bg-accent aria-[pressed=true]:text-accent-ink" aria-pressed="false" data-f="personal">Personal</button>
      <button type="button" class="rounded-full border border-line bg-surface px-3 py-1 text-[13px] font-medium transition-colors hover:border-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-[pressed=true]:border-accent aria-[pressed=true]:bg-accent aria-[pressed=true]:text-accent-ink" aria-pressed="false" data-f="viaje">Viajes</button>
    </div>
  </header>
  <div id="list" tabindex="0" role="region" aria-label="Eventos por día, desplazable" class="max-h-[520px] overflow-y-auto focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"></div>
  <p id="empty" hidden class="m-0 px-4 py-6 text-center text-muted">No hay eventos de esta categoría en los próximos días.</p>
  <p id="status" role="status" class="m-0 min-h-10 border-t border-line px-4 py-2.5 text-[13px] text-muted"></p>
</section>
<script>
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const hm = (min) => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
  const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const initials = (name) => name.split(' ').map((w) => w[0]).slice(0, 2).join('');
  const fmtDate = new Intl.DateTimeFormat('es', { weekday: 'long', day: 'numeric', month: 'long' });
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const CATS = { reunion: 'Reunión', personal: 'Personal', viaje: 'Viaje' };
  const DOT = { reunion: 'bg-accent', personal: 'bg-ok', viaje: 'bg-info' };
  const DAYS = [
    { date: new Date(2026, 9, 20), rel: 'Hoy' },
    { date: new Date(2026, 9, 21), rel: 'Mañana' },
    { date: new Date(2026, 9, 22), rel: '' },
    { date: new Date(2026, 9, 23), rel: '' },
  ];
  const EVENTS = [
    { id: 'standup', day: 0, start: 540, dur: 30, cat: 'reunion', title: 'Standup de equipo', place: 'Sala Ámbar', who: ['Ana Ruiz', 'Luis Gómez'] },
    { id: 'diseno', day: 0, start: 600, dur: 90, cat: 'reunion', title: 'Revisión de diseño', place: 'Sala Cobalto', who: ['Ana Ruiz', 'Irene Pardo'] },
    { id: 'lucia', day: 0, start: 810, dur: 60, cat: 'personal', title: 'Comida con Lucía', place: 'Restaurante Olivo', who: ['Lucía Mena'] },
    { id: 'taller', day: 1, start: 570, dur: 120, cat: 'reunion', title: 'Taller de accesibilidad', place: 'Sala Norte', who: ['Marta Sanz', 'Irene Pardo'] },
    { id: 'traslado', day: 1, start: 1020, dur: 90, cat: 'viaje', title: 'Traslado al aeropuerto', place: 'Terminal 1', who: ['Tú'] },
    { id: 'vuelo', day: 2, start: 480, dur: 150, cat: 'viaje', title: 'Vuelo a Lisboa', place: 'Aeropuerto de Barajas', who: ['Tú'] },
    { id: 'presupuesto', day: 2, start: 660, dur: 60, cat: 'reunion', title: 'Revisión de presupuesto', place: 'Sala Cobalto', who: ['Carlos Vega', 'Ana Ruiz'] },
    { id: 'familia', day: 3, start: 780, dur: 30, cat: 'personal', title: 'Llamada familiar', place: 'Videollamada', who: ['Mamá'] },
    { id: 'candidatos', day: 3, start: 990, dur: 45, cat: 'reunion', title: 'Entrevista de candidatos', place: 'Sala Ámbar', who: ['Irene Pardo', 'Marta Sanz'] },
  ];

  const ymd = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const icsText = (s) => s.replace(/[\\;,]/g, (c) => `\\${c}`).replace(/\n/g, '\\n');
  const fold = (line) => line.replace(/.{73}(?=.)/g, '$&\r\n ');

  function icsFor(ev) {
    const d = DAYS[ev.day].date, stamp = (min) => `${ymd(d)}T${hm(min).replace(':', '')}00`;
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//templates-hub//Agenda//ES', 'BEGIN:VEVENT',
      `UID:${ev.id}@templates-hub`, 'DTSTAMP:20261020T080000Z',
      `DTSTART:${stamp(ev.start)}`, `DTEND:${stamp(ev.start + ev.dur)}`,
      `SUMMARY:${icsText(ev.title)}`, `LOCATION:${icsText(ev.place)}`,
      `DESCRIPTION:${icsText(`Asistentes: ${ev.who.join(', ')}`)}`,
      'END:VEVENT', 'END:VCALENDAR',
    ];
    return lines.map(fold).join('\r\n') + '\r\n';
  }

  const canDownload = () => typeof URL.createObjectURL === 'function' && location.origin !== 'null';

  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' }));
    const link = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showIcs(item, text) {
    item.insertAdjacentHTML('beforeend', `<details class="col-start-2 text-[13px]"><summary class="w-max cursor-pointer text-accent">Ver texto .ics</summary><pre class="mt-1.5 overflow-x-auto whitespace-pre rounded-sm border border-line bg-page p-2 font-mono text-xs leading-snug">${esc(text)}</pre></details>`);
    item.querySelector('details').open = true;
  }

  function addToCalendar(ev, item) {
    const text = icsFor(ev), name = `${ev.id}.ics`;
    item.querySelector('details')?.remove();
    if (canDownload()) {
      try {
        download(name, text);
        $('status').textContent = `Descarga iniciada: ${name}.`;
        return;
      } catch {}
    }
    showIcs(item, text);
    $('status').textContent = 'La descarga no está disponible en esta vista: abajo tienes el texto del .ics.';
  }

  const itemHtml = (ev) => `<li class="item grid grid-cols-[auto_1fr] gap-x-3.5 gap-y-1.5 border-b border-line px-4 py-3" data-cat="${ev.cat}">
        <time class="col-start-1 whitespace-nowrap text-[13px] text-muted tabular-nums">${hm(ev.start)} – ${hm(ev.start + ev.dur)}</time>
        <div class="col-start-2 min-w-0">
          <b class="block font-semibold [overflow-wrap:anywhere]">${esc(ev.title)}</b>
          <p class="mt-0.5 text-[13px] text-muted"><span class="mr-1.5 inline-block h-2 w-2 rounded-full ${DOT[ev.cat]}" aria-hidden="true"></span>${CATS[ev.cat]} · ${esc(ev.place)}</p>
          <ul class="mt-2 flex list-none p-0" aria-label="Asistentes: ${esc(ev.who.join(', '))}">${ev.who.map((w) => `<li aria-hidden="true" class="-ml-1.5 grid h-6 w-6 place-items-center rounded-full bg-accent-soft text-[10px] font-semibold text-accent shadow-[0_0_0_2px_var(--surface)] first:ml-0">${esc(initials(w))}</li>`).join('')}</ul>
        </div>
        <button type="button" data-id="${ev.id}" class="col-start-2 mt-1 justify-self-start rounded-md border border-line bg-surface px-2.5 py-1 text-[13px] font-medium transition-colors hover:border-accent hover:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Añadir al calendario</button>
      </li>`;

  const groupHtml = (day, k) => {
    const label = cap(fmtDate.format(day.date));
    const heading = day.rel ? `${day.rel} <span class="font-normal text-muted">${label}</span>` : label;
    const items = EVENTS.filter((ev) => ev.day === k).sort((a, b) => a.start - b.start);
    return `<section class="group" aria-labelledby="g${k}"><h3 id="g${k}" class="sticky top-0 z-[1] flex flex-wrap items-baseline gap-x-2 border-b border-line bg-surface px-4 py-2 text-[13px] font-semibold">${heading}</h3><ol class="m-0 list-none p-0">${items.map(itemHtml).join('')}</ol></section>`;
  };

  function applyFilter(f) {
    let shown = 0;
    document.querySelectorAll('#filters button').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.f === f)));
    document.querySelectorAll('.item').forEach((li) => {
      const on = f === 'all' || li.dataset.cat === f;
      li.hidden = !on;
      if (on) shown++;
    });
    document.querySelectorAll('.group').forEach((g) => { g.hidden = !g.querySelector('.item:not([hidden])'); });
    $('empty').hidden = shown > 0;
    $('count').textContent = `${shown} ${shown === 1 ? 'evento' : 'eventos'}`;
    $('status').textContent = `Mostrando ${shown} ${shown === 1 ? 'evento' : 'eventos'}.`;
  }

  $('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('button');
    if (chip) applyFilter(chip.dataset.f);
  });
  $('list').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    addToCalendar(EVENTS.find((ev) => ev.id === btn.dataset.id), btn.closest('.item'));
  });

  $('list').innerHTML = DAYS.map((day, k) => groupHtml(day, k)).join('');
  applyFilter('all');
</script>
