<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
  h2{margin:0;font-size:16px;font-weight:600}
  header p{margin:2px 0 0;color:var(--muted)}
  .actions{display:flex;gap:8px}
  button{font:inherit;padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;transition:background .14s,opacity .14s}
  button:hover:not(:disabled){background:var(--accent-soft)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent);opacity:.9}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  li{min-width:0}
  .track{height:8px;border-radius:999px;background:var(--border);overflow:hidden}
  .track i{display:block;height:100%;width:calc(var(--p) * 1%);border-radius:inherit;background:var(--ok);transition:width .16s}
  li[data-s=active] .track i{background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  strong{display:block;margin-top:10px;font-weight:600;overflow-wrap:anywhere}
  small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  li[data-s=done] small{color:var(--ok)}
  @media (max-width:640px){ol{grid-template-columns:1fr;gap:16px}li{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px}.track{grid-column:1/-1}strong{margin-top:6px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <header>
    <div><h2 id="t">Despliegue de la versión 4.2</h2><p id="sum" aria-live="polite"></p></div>
    <div class="actions">
      <button type="button" id="rst">Reiniciar</button>
      <button type="button" id="adv" class="primary">Avanzar etapa</button>
    </div>
  </header>
  <ol id="st"></ol>
</section>
<script>
  const names = ['Compilación', 'Pruebas', 'Revisión', 'Staging', 'Producción'];
  const init = [100, 100, 60, 0, 0];
  let p = [...init];
  const label = { done: 'Completada', todo: 'Pendiente' };
  function draw() {
    const cur = p.findIndex((v) => v < 100);
    st.innerHTML = names.map((n, i) => {
      const s = p[i] >= 100 ? 'done' : i === cur ? 'active' : 'todo';
      return `<li data-s="${s}"><div class="track" role="progressbar" aria-label="${n}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p[i]}"><i style="--p:${p[i]}"></i></div><strong>${n}</strong><small>${label[s] || 'En curso, ' + p[i] + '%'}</small></li>`;
    }).join('');
    sum.textContent = cur < 0 ? 'Despliegue completo: las 5 etapas terminaron.' : `${cur} de 5 etapas completadas. En curso: ${names[cur]}.`;
    adv.disabled = cur < 0;
  }
  adv.onclick = () => { const c = p.findIndex((v) => v < 100); if (c >= 0) p[c] = Math.min(100, p[c] + 20); draw(); };
  rst.onclick = () => { p = [...init]; draw(); };
  draw();
</script>
</body>
</html>
