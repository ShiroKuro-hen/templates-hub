<section class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 id="t" class="m-0 text-base font-semibold">Despliegue de la versión 4.2</h2>
      <p id="sum" aria-live="polite" class="mt-0.5 text-slate-500 dark:text-slate-400"></p>
    </div>
    <div class="flex gap-2">
      <button type="button" id="rst" class="rounded-lg border border-slate-200 px-3.5 py-1.5 hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:hover:bg-slate-800">Reiniciar</button>
      <button type="button" id="adv" class="rounded-lg border border-blue-600 bg-blue-600 px-3.5 py-1.5 font-semibold text-white hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 disabled:opacity-50 dark:border-blue-400 dark:bg-blue-400 dark:text-slate-950">Avanzar etapa</button>
    </div>
  </header>
  <ol id="st" class="m-0 grid list-none grid-cols-1 gap-4 p-0 sm:grid-cols-5 sm:gap-1.5"></ol>
</section>
<script>
  const names = ['Compilación', 'Pruebas', 'Revisión', 'Staging', 'Producción'];
  const init = [100, 100, 60, 0, 0];
  let p = [...init];
  const label = { done: 'Completada', todo: 'Pendiente' };
  const fill = { done: 'bg-emerald-600 dark:bg-emerald-400', active: 'bg-gradient-to-br from-cyan-400 to-blue-600', todo: '' };
  const txt = { done: 'text-emerald-600 dark:text-emerald-400', active: 'text-slate-500 dark:text-slate-400', todo: 'text-slate-500 dark:text-slate-400' };
  function draw() {
    const cur = p.findIndex((v) => v < 100);
    st.innerHTML = names.map((n, i) => {
      const s = p[i] >= 100 ? 'done' : i === cur ? 'active' : 'todo';
      return `<li class="min-w-0"><div class="h-2 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700" role="progressbar" aria-label="${n}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p[i]}"><i class="block h-full rounded-full transition-[width] duration-150 ${fill[s]}" style="width:${p[i]}%"></i></div><strong class="mt-2.5 block font-semibold">${n}</strong><small class="tabular-nums ${txt[s]}">${label[s] || 'En curso, ' + p[i] + '%'}</small></li>`;
    }).join('');
    sum.textContent = cur < 0 ? 'Despliegue completo: las 5 etapas terminaron.' : `${cur} de 5 etapas completadas. En curso: ${names[cur]}.`;
    adv.disabled = cur < 0;
  }
  adv.onclick = () => { const c = p.findIndex((v) => v < 100); if (c >= 0) p[c] = Math.min(100, p[c] + 20); draw(); };
  rst.onclick = () => { p = [...init]; draw(); };
  draw();
</script>
