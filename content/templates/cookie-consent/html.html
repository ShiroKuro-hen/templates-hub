<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .banner{max-width:720px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .banner h2{margin:0;font-size:16px}
  .banner p{margin:4px 0 0;color:var(--muted);max-width:68ch}
  .banner a{color:var(--accent)}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .btn{padding:8px 14px;font:inherit;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s}
  .btn:hover{background:var(--bg)}
  .btn.primary{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08)}
  details{margin-top:16px;border-top:1px solid var(--border)}
  summary{width:fit-content;margin-top:12px;padding:2px 4px;border-radius:4px;color:var(--accent);font-weight:600;cursor:pointer}
  .opt{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
  .opt b{display:block;font-weight:600}
  .opt small{display:block;color:var(--muted);font-size:13px}
  .switch{appearance:none;flex:none;position:relative;width:36px;height:20px;margin:2px 0 0;border:1px solid var(--border);border-radius:999px;background:var(--bg);cursor:pointer;transition:background .14s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .14s}
  .switch:checked{border-color:transparent;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .switch:checked::after{transform:translateX(16px);background:var(--surface)}
  .switch:disabled{opacity:.6;cursor:not-allowed}
  .btn:focus-visible,summary:focus-visible,.switch:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .status{margin:12px 0 0;color:var(--text)}
  .status:empty{margin:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="banner" id="cc" aria-labelledby="cc-title">
  <h2 id="cc-title">Tu privacidad en este sitio</h2>
  <p>Usamos cookies necesarias para que el sitio funcione. Con tu permiso, también usamos otras para medir el uso y personalizar contenido. Lee la <a href="#">política de cookies</a>.</p>
  <div class="row">
    <button class="btn" type="button" id="reject">Rechazar opcionales</button>
    <button class="btn" type="button" id="accept">Aceptar todas</button>
  </div>
  <details>
    <summary>Configurar preferencias</summary>
    <form id="prefs">
      <label class="opt"><span><b>Necesarias</b><small>Permiten iniciar sesión y recordar tu carrito. Siempre activas.</small></span>
        <input class="switch" type="checkbox" role="switch" value="Necesarias" checked disabled></label>
      <label class="opt"><span><b>Analíticas</b><small>Nos dicen qué páginas se usan para mejorarlas.</small></span>
        <input class="switch" type="checkbox" role="switch" value="Analíticas"></label>
      <label class="opt"><span><b>Preferencias</b><small>Recuerdan tu idioma y región.</small></span>
        <input class="switch" type="checkbox" role="switch" value="Preferencias"></label>
      <label class="opt"><span><b>Marketing</b><small>Muestran anuncios según tu actividad en otros sitios.</small></span>
        <input class="switch" type="checkbox" role="switch" value="Marketing"></label>
      <div class="row"><button class="btn primary" type="submit">Guardar preferencias</button></div>
    </form>
  </details>
</section>
<p class="status" role="status" id="cc-status"></p>
<button class="btn" type="button" id="reopen" hidden>Cambiar preferencias de cookies</button>
<script>
  const banner = document.getElementById('cc'), form = document.getElementById('prefs'),
        out = document.getElementById('cc-status'), reopen = document.getElementById('reopen');
  const optional = [...form.querySelectorAll('.switch:not(:disabled)')];
  function save() {
    const on = [...form.querySelectorAll('.switch:checked')].map((i) => i.value);
    banner.hidden = true; reopen.hidden = false; reopen.focus();
    out.textContent = `Guardaste tus preferencias: ${on.join(', ')}.`;
  }
  document.getElementById('reject').addEventListener('click', () => { optional.forEach((i) => (i.checked = false)); save(); });
  document.getElementById('accept').addEventListener('click', () => { optional.forEach((i) => (i.checked = true)); save(); });
  form.addEventListener('submit', (e) => { e.preventDefault(); save(); });
  reopen.addEventListener('click', () => { banner.hidden = false; reopen.hidden = true; out.textContent = ''; banner.querySelector('button').focus(); });
</script>
</body>
</html>
