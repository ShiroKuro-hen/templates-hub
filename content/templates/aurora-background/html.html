<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondo aurora</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hero{position:relative;isolation:isolate;overflow:hidden;max-width:720px;margin:0 auto;padding:56px 28px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
  .aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .blob{position:absolute;width:60%;aspect-ratio:1;border-radius:50%;filter:blur(56px);opacity:.4;animation:drift 18s ease-in-out infinite alternate}
  .b1{left:-12%;top:-30%;background:var(--accent)}
  .b2{right:-14%;top:-6%;background:var(--accent-2,var(--info));animation-duration:22s;animation-delay:-6s}
  .b3{left:22%;bottom:-38%;background:var(--info);animation-duration:26s;animation-delay:-12s}
  @keyframes drift{to{transform:translate3d(8%,-6%,0) scale(1.12)}}
  .eyebrow{display:inline-block;margin:0 0 14px;padding:3px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600}
  h1{margin:0 auto;max-width:18ch;font-size:clamp(26px,6vw,40px);line-height:1.15;letter-spacing:-.02em}
  .lead{max-width:50ch;margin:14px auto 24px}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .btn{font:inherit;font-weight:600;padding:10px 18px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .14s,background .14s}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn-secondary{background:var(--surface);color:var(--text)}
  .btn:hover{border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<section class="hero" aria-labelledby="aurora-title">
  <div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <p class="eyebrow">Novedad: panel de equipo</p>
  <h1 id="aurora-title">Todo tu equipo, en una sola vista</h1>
  <p class="lead">Reúne proyectos, plazos y avisos en un solo panel. Empieza en minutos y invita a tus compañeros cuando quieras.</p>
  <div class="actions">
    <button type="button" class="btn btn-primary">Empezar gratis</button>
    <button type="button" class="btn btn-secondary">Ver demo</button>
  </div>
</section>
</body>
</html>
