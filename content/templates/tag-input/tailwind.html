<div class="max-w-lg rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <label for="tag-in" class="mb-1.5 block font-semibold">Etiquetas del artículo</label>
  <div id="box" class="flex cursor-text flex-wrap items-center gap-1.5 rounded-lg border border-line p-1.5 focus-within:border-accent focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent">
    <ul id="tags" aria-label="Etiquetas añadidas" class="flex flex-wrap gap-1.5"></ul>
    <input id="tag-in" list="tag-sug" autocomplete="off" placeholder="Escribe y pulsa Enter" aria-describedby="tag-help"
           class="min-w-36 flex-1 bg-transparent px-1.5 py-1 outline-none placeholder:text-muted">
  </div>
  <datalist id="tag-sug">
    <option value="frontend"><option value="backend"><option value="rendimiento"><option value="seguridad"><option value="documentación"><option value="diseño"><option value="accesibilidad">
  </datalist>
  <p id="tag-help" class="mt-1.5 text-[13px] text-muted">Pulsa Enter o coma para añadir. Retroceso con el campo vacío quita la última.</p>
  <p id="tag-status" role="status" class="mt-1 min-h-5 text-[13px]"></p>
</div>
<script>
  const input = document.getElementById('tag-in'), list = document.getElementById('tags'), out = document.getElementById('tag-status');
  const tags = ['diseño', 'accesibilidad'];
  function render() {
    list.replaceChildren(...tags.map((t) => {
      const li = document.createElement('li'), dot = document.createElement('span'), b = document.createElement('button');
      li.className = 'inline-flex items-center gap-1.5 rounded-full border border-line bg-accent-soft py-0.5 pl-2.5 pr-1 text-[13px]';
      dot.className = 'h-1.5 w-1.5 rounded-full bg-gradient-to-br from-accent-2 to-accent';
      b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', `Quitar ${t}`);
      b.className = 'grid h-5 w-5 place-items-center rounded-full text-base leading-none text-muted hover:bg-surface hover:text-fg focus-visible:outline-2 focus-visible:outline-accent';
      b.onclick = () => remove(t);
      li.append(dot, t, b); return li;
    }));
  }
  function add(raw) {
    const t = raw.trim().toLowerCase();
    if (!t) return;
    if (tags.includes(t)) { out.textContent = `«${t}» ya está en la lista. Escribe otra etiqueta.`; return; }
    tags.push(t); render(); out.textContent = `Añadiste «${t}».`;
  }
  function remove(t) { tags.splice(tags.indexOf(t), 1); render(); out.textContent = `Quitaste «${t}».`; input.focus(); }
  input.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(input.value); input.value = ''; }
    else if (e.key === 'Backspace' && !input.value && tags.length) remove(tags[tags.length - 1]);
  });
  input.addEventListener('input', () => {
    if (!input.value.includes(',')) return;
    const parts = input.value.split(','); input.value = parts.pop(); parts.forEach(add);
  });
  document.getElementById('box').addEventListener('click', (e) => { if (e.target === e.currentTarget) input.focus(); });
  render();
</script>
