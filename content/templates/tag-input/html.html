<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .field{max-width:520px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .field label{display:block;margin-bottom:6px;font-weight:600}
  .box{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border:1px solid var(--border);border-radius:var(--radius);cursor:text;transition:border-color .14s}
  .box:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:2px 4px 2px 10px;font-size:13px;background:var(--accent-soft);border:1px solid var(--border);border-radius:999px}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .tag button{display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);font:inherit;font-size:16px;line-height:1;cursor:pointer;transition:background .14s,color .14s}
  .tag button:hover{background:var(--surface);color:var(--text)}
  .tag button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .box input{flex:1;min-width:140px;padding:4px 6px;border:0;background:none;color:var(--text);font:inherit;outline:none}
  .help{margin:6px 0 0;color:var(--muted);font-size:13px}
  .status{margin:4px 0 0;min-height:1.5em;font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="field">
  <label for="tag-in">Etiquetas del artículo</label>
  <div class="box">
    <ul class="tags" id="tags" aria-label="Etiquetas añadidas"></ul>
    <input id="tag-in" list="tag-sug" autocomplete="off" placeholder="Escribe y pulsa Enter" aria-describedby="tag-help">
  </div>
  <datalist id="tag-sug">
    <option value="frontend"><option value="backend"><option value="rendimiento"><option value="seguridad"><option value="documentación"><option value="diseño"><option value="accesibilidad">
  </datalist>
  <p class="help" id="tag-help">Pulsa Enter o coma para añadir. Retroceso con el campo vacío quita la última.</p>
  <p class="status" role="status" id="tag-status"></p>
</div>
<script>
  const input = document.getElementById('tag-in'), list = document.getElementById('tags'), out = document.getElementById('tag-status');
  const tags = ['diseño', 'accesibilidad'];
  function render() {
    list.replaceChildren(...tags.map((t) => {
      const li = document.createElement('li'), b = document.createElement('button');
      li.className = 'tag'; li.append(t);
      b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', `Quitar ${t}`);
      b.onclick = () => remove(t);
      li.append(b); return li;
    }));
  }
  function add(raw) {
    const t = raw.trim().toLowerCase();
    if (!t) return;
    if (tags.includes(t)) { out.textContent = `«${t}» ya está en la lista. Escribe otra etiqueta.`; return; }
    tags.push(t); render(); out.textContent = `Añadiste «${t}».`;
  }
  function remove(t) { tags.splice(tags.indexOf(t), 1); render(); out.textContent = `Quitaste «${t}».`; input.focus(); }
  input.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(input.value); input.value = ''; }
    else if (e.key === 'Backspace' && !input.value && tags.length) remove(tags[tags.length - 1]);
  });
  input.addEventListener('input', () => {
    if (!input.value.includes(',')) return;
    const parts = input.value.split(','); input.value = parts.pop(); parts.forEach(add);
  });
  document.querySelector('.box').addEventListener('click', (e) => { if (e.target === e.currentTarget) input.focus(); });
  render();
</script>
</body>
</html>
