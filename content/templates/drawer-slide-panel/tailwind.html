<style>
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .drawer { --dur:.3s; --ease:cubic-bezier(.2,.8,.2,1); transform:translate(var(--tx), var(--ty)); transition-property:transform, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, allow-discrete, allow-discrete; }
  .drawer[data-side=right] { inset:0 0 0 auto; width:min(360px, 100%); height:100%; --tx:100%; --ty:0; }
  .drawer[data-side=left] { inset:0 auto 0 0; width:min(360px, 100%); height:100%; --tx:-100%; --ty:0; }
  .drawer[data-side=bottom] { inset:auto 0 0 0; width:100%; max-height:80%; --tx:0; --ty:100%; }
  .drawer[open] { transform:none; }
  @starting-style { .drawer[open] { transform:translate(var(--tx), var(--ty)); } }
  .drawer::backdrop { background:rgba(0,0,0,0); transition-property:background, display, overlay; transition-duration:var(--dur); transition-timing-function:var(--ease); transition-behavior:normal, allow-discrete, allow-discrete; }
  .drawer[open]::backdrop { background:rgba(0,0,0,.5); }
  @starting-style { .drawer[open]::backdrop { background:rgba(0,0,0,0); } }
  @media (prefers-reduced-motion:reduce) { .drawer, .drawer::backdrop { transition:none; } }
</style>
<main id="page" class="mx-auto max-w-[640px] rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <h1 class="mb-1 text-xl font-bold leading-normal tracking-[-0.01em]">Preferencias</h1>
  <p class="mb-4 text-muted">Elige desde qué borde aparece el panel y ábrelo para editar tus ajustes.</p>
  <fieldset class="m-0 mb-4 min-w-0 border-0 p-0">
    <legend class="mb-1.5 p-0 font-medium text-muted">Posición del panel</legend>
    <div class="flex gap-1 rounded-lg border border-line bg-page p-1">
      <label class="relative flex-1 cursor-pointer rounded-[6px] px-2.5 py-1.5 text-center has-[:checked]:bg-accent has-[:checked]:font-semibold has-[:checked]:text-accent-ink has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-accent"><input type="radio" name="side" value="left" class="absolute inset-0 m-0 cursor-pointer opacity-0"><span>Izquierda</span></label>
      <label class="relative flex-1 cursor-pointer rounded-[6px] px-2.5 py-1.5 text-center has-[:checked]:bg-accent has-[:checked]:font-semibold has-[:checked]:text-accent-ink has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-accent"><input type="radio" name="side" value="right" checked class="absolute inset-0 m-0 cursor-pointer opacity-0"><span>Derecha</span></label>
      <label class="relative flex-1 cursor-pointer rounded-[6px] px-2.5 py-1.5 text-center has-[:checked]:bg-accent has-[:checked]:font-semibold has-[:checked]:text-accent-ink has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-accent"><input type="radio" name="side" value="bottom" class="absolute inset-0 m-0 cursor-pointer opacity-0"><span>Abajo</span></label>
    </div>
  </fieldset>
  <button type="button" id="open" aria-haspopup="dialog" class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Abrir ajustes</button>
  <p id="msg" role="status" class="mt-3 min-h-[1.5em] text-ok"></p>
</main>

<dialog id="drawer" aria-labelledby="dr-title" class="drawer m-0 max-h-full max-w-full border-0 bg-surface p-0 text-fg shadow-sm">
  <form method="dialog" class="flex h-full flex-col">
    <header class="flex items-start justify-between gap-3 px-5 pt-5 pb-3">
      <div>
        <h2 id="dr-title" class="text-lg font-bold leading-normal">Ajustes de cuenta</h2>
        <p class="mt-0.5 text-muted">Los cambios se aplican a tu perfil.</p>
      </div>
      <button type="submit" value="cancel" formnovalidate aria-label="Cerrar ajustes" class="size-7 flex-none rounded-lg text-lg leading-none text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">×</button>
    </header>
    <div class="grid flex-1 content-start gap-2 px-5 pt-2 pb-5">
      <label for="name" class="font-medium">Nombre para mostrar</label>
      <input id="name" name="name" required autocomplete="name" value="Lucía Torres" autofocus class="box-border w-full rounded-lg border border-line bg-surface px-2.5 py-2 text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <label for="mail" class="font-medium">Correo electrónico</label>
      <input id="mail" name="mail" type="email" required autocomplete="email" value="lucia@empresa.com" class="box-border w-full rounded-lg border border-line bg-surface px-2.5 py-2 text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
      <label class="flex items-center gap-2 font-medium"><input type="checkbox" name="digest" checked> Recibir un resumen semanal</label>
    </div>
    <footer class="flex justify-end gap-2 border-t border-line px-5 py-3">
      <button type="submit" value="cancel" formnovalidate class="rounded-lg border border-line bg-surface px-3.5 py-2 font-semibold text-fg hover:bg-page focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Cancelar</button>
      <button type="submit" value="save" class="rounded-lg border border-accent bg-accent px-3.5 py-2 font-semibold text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Guardar</button>
    </footer>
  </form>
</dialog>
<script>
  const page = document.getElementById('page'), open = document.getElementById('open');
  const drawer = document.getElementById('drawer'), msg = document.getElementById('msg');
  const nameInput = document.getElementById('name');
  const isOutside = (e) => {
    const r = drawer.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  };
  open.addEventListener('click', () => {
    drawer.dataset.side = document.querySelector('input[name=side]:checked').value;
    drawer.querySelector('form').reset();
    page.inert = true;
    drawer.showModal();
  });
  drawer.addEventListener('click', (e) => {
    if (e.target === drawer && isOutside(e)) drawer.close('cancel');
  });
  drawer.addEventListener('close', () => {
    page.inert = false;
    open.focus();
    if (drawer.returnValue === 'save') msg.textContent = `Ajustes guardados para ${nameInput.value.trim()}.`;
  });
</script>
