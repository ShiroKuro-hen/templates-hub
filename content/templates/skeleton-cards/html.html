<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton con shimmer</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .btn { margin-bottom:16px; padding:7px 16px; font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:1px solid var(--accent); border-radius:var(--radius); cursor:pointer; transition:filter 140ms; }
  .btn:hover { filter:brightness(1.08); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; align-items:start; max-width:720px; }
  .box { margin:0; padding:0; list-style:none; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .pad { padding:14px; }
  .sk { display:block; background:linear-gradient(100deg, var(--border) 30%, var(--bg) 50%, var(--border) 70%) 0 0 / 200% 100%; border-radius:6px; animation:shimmer 1.4s linear infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .media { height:84px; border-radius:0; }
  .line { height:10px; margin-top:10px; } .w60 { width:60%; } .w40 { width:40%; } .title { height:14px; width:75%; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .row + .row { border-top:1px solid var(--border); }
  .row > div { flex:1; } .row .line { margin:0; } .row .line + .line { margin-top:8px; }
  .avatar { flex:none; width:34px; height:34px; border-radius:50%; }
  .real .media { background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  .real h3 { margin:0; font-size:1rem; font-weight:600; } .real p { margin:2px 0 0; color:var(--muted); }
  .real .avatar { display:grid; place-items:center; color:var(--accent); background:var(--accent-soft); font-weight:600; }
  @media (prefers-reduced-motion:reduce) { .sk { animation:none; } .btn { transition:none; } }
</style>
</head>
<body>
  <button class="btn" id="btn" type="button">Mostrar contenido</button>
  <p class="sr" id="live" aria-live="polite">Cargando contenido</p>
  <div class="grid" id="demo" aria-busy="true">
    <article class="box">
      <div class="skel" aria-hidden="true">
        <span class="sk media"></span>
        <div class="pad"><span class="sk title"></span><span class="sk line"></span><span class="sk line w60"></span></div>
      </div>
      <div class="real" hidden>
        <div class="media"></div>
        <div class="pad"><h3>Cerámica de otoño</h3><p>Taller de 3 horas con arcilla local.</p></div>
      </div>
    </article>
    <div class="box">
      <div class="skel" aria-hidden="true">
        <div class="row"><span class="sk avatar"></span><div><span class="sk line"></span><span class="sk line w60"></span></div></div>
        <div class="row"><span class="sk avatar"></span><div><span class="sk line"></span><span class="sk line w40"></span></div></div>
        <div class="row"><span class="sk avatar"></span><div><span class="sk line"></span><span class="sk line w60"></span></div></div>
      </div>
      <ul class="real" hidden style="margin:0;padding:0;list-style:none">
        <li class="row"><span class="avatar">A</span><div><strong>Ana P.</strong><p>Reservó el taller</p></div></li>
        <li class="row"><span class="avatar">L</span><div><strong>Luis G.</strong><p>Dejó una reseña</p></div></li>
        <li class="row"><span class="avatar">M</span><div><strong>Marta R.</strong><p>Pidió un cambio</p></div></li>
      </ul>
    </div>
  </div>
<script>
  const demo = document.getElementById('demo'), btn = document.getElementById('btn'), live = document.getElementById('live');
  let loaded = false;
  btn.addEventListener('click', () => {
    loaded = !loaded;
    demo.setAttribute('aria-busy', !loaded);
    demo.querySelectorAll('.skel').forEach((e) => (e.hidden = loaded));
    demo.querySelectorAll('.real').forEach((e) => (e.hidden = !loaded));
    btn.textContent = loaded ? 'Volver a cargar' : 'Mostrar contenido';
    live.textContent = loaded ? 'Contenido cargado' : 'Cargando contenido';
  });
</script>
</body>
</html>
