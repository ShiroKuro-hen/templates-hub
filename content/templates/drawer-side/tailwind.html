<button type="button" id="open" aria-haspopup="dialog"
        class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 font-semibold text-slate-900 shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  Filtros
</button>

<dialog id="drawer" aria-labelledby="d-title"
        class="m-0 ml-auto h-full max-h-full w-[min(320px,100%)] rounded-none border-0 border-l border-slate-200 bg-white p-0 text-slate-900 shadow-sm backdrop:bg-slate-950/50 open:flex open:flex-col dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <header class="relative flex items-center justify-between border-b border-slate-200 px-4 py-3 after:absolute after:inset-x-0 after:-bottom-px after:h-0.5 after:bg-gradient-to-r after:from-cyan-400 after:to-blue-600 dark:border-slate-700">
    <h2 id="d-title" class="m-0 text-base font-semibold">Filtros</h2>
    <button type="button" id="x" aria-label="Cerrar filtros"
            class="h-8 w-8 rounded-lg text-xl leading-none text-slate-500 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">×</button>
  </header>
  <form method="dialog" class="contents">
    <div class="flex-1 overflow-auto px-4 pt-2 pb-3">
      <fieldset class="mt-3 border-0 p-0">
        <legend class="mb-1 p-0 font-semibold">Estado</legend>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-blue-600" checked> Pendiente</label>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-blue-600"> Enviado</label>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-blue-600"> Entregado</label>
      </fieldset>
    </div>
    <footer class="flex justify-end gap-2.5 border-t border-slate-200 px-4 py-3 dark:border-slate-700">
      <button type="reset" class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 font-semibold shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900">Limpiar</button>
      <button class="rounded-lg bg-blue-600 px-3.5 py-2 font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:bg-blue-500">Aplicar filtros</button>
    </footer>
  </form>
</dialog>

<script>
  const d = document.getElementById('drawer'), opener = document.getElementById('open');
  opener.addEventListener('click', () => d.showModal());
  document.getElementById('x').addEventListener('click', () => d.close());
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.addEventListener('close', () => opener.focus());
</script>
