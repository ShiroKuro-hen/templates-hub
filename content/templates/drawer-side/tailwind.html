<button type="button" id="open" aria-haspopup="dialog"
        class="rounded-lg border border-line bg-surface px-3.5 py-2 font-semibold text-fg shadow-sm hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
  Filtros
</button>

<dialog id="drawer" aria-labelledby="d-title"
        class="m-0 ml-auto h-full max-h-full w-[min(320px,100%)] rounded-none border-0 border-l border-line bg-surface p-0 text-fg shadow-sm backdrop:bg-fg/50 open:flex open:flex-col">
  <header class="relative flex items-center justify-between border-b border-line px-4 py-3 after:absolute after:inset-x-0 after:-bottom-px after:h-0.5 after:bg-gradient-to-r after:from-accent-2 after:to-accent">
    <h2 id="d-title" class="m-0 text-base font-semibold">Filtros</h2>
    <button type="button" id="x" aria-label="Cerrar filtros"
            class="h-8 w-8 rounded-lg text-xl leading-none text-muted hover:bg-page hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">×</button>
  </header>
  <form method="dialog" class="contents">
    <div class="flex-1 overflow-auto px-4 pt-2 pb-3">
      <fieldset class="mt-3 border-0 p-0">
        <legend class="mb-1 p-0 font-semibold">Estado</legend>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-accent" checked> Pendiente</label>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-accent"> Enviado</label>
        <label class="flex cursor-pointer items-center gap-2 py-1"><input type="checkbox" name="estado" class="h-4 w-4 accent-accent"> Entregado</label>
      </fieldset>
    </div>
    <footer class="flex justify-end gap-2.5 border-t border-line px-4 py-3">
      <button type="reset" class="rounded-lg border border-line bg-surface px-3.5 py-2 font-semibold shadow-sm hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Limpiar</button>
      <button class="rounded-lg bg-accent px-3.5 py-2 font-semibold text-accent-ink shadow-sm hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Aplicar filtros</button>
    </footer>
  </form>
</dialog>

<script>
  const d = document.getElementById('drawer'), opener = document.getElementById('open');
  opener.addEventListener('click', () => d.showModal());
  document.getElementById('x').addEventListener('click', () => d.close());
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
  d.addEventListener('close', () => opener.focus());
</script>
