<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel lateral</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:-.01em; }
  p { margin:0 0 14px; color:var(--muted); }
  .btn { font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif; padding:8px 14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); cursor:pointer; transition:border-color .14s, filter .14s; }
  .btn:hover { border-color:var(--accent); }
  .btn.main { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .btn.main:hover { filter:brightness(1.08); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #summary { margin-top:14px; font-size:13px; font-variant-numeric:tabular-nums; }
  dialog { margin:0 0 0 auto; width:min(320px, 100%); height:100%; max-height:100%; padding:0; color:var(--text); background:var(--surface); border:0; border-left:1px solid var(--border); border-radius:0; box-shadow:var(--shadow); }
  dialog[open] { display:flex; flex-direction:column; animation:slide .16s ease-out; }
  dialog::backdrop { background:rgba(10,15,28,.5); }
  header, footer { display:flex; align-items:center; gap:10px; padding:12px 16px; }
  header { position:relative; justify-content:space-between; border-bottom:1px solid var(--border); }
  header::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  footer { justify-content:flex-end; border-top:1px solid var(--border); }
  h2 { margin:0; font-size:16px; font-weight:600; }
  .x { width:32px; height:32px; font-size:20px; line-height:1; color:var(--muted); background:none; border:0; border-radius:var(--radius); cursor:pointer; transition:background .14s, color .14s; }
  .x:hover { color:var(--text); background:var(--bg); }
  .body { flex:1; overflow:auto; padding:8px 16px 12px; }
  fieldset { margin:12px 0 0; padding:0; border:0; }
  legend { padding:0; font-weight:600; margin-bottom:4px; }
  label { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
  input { width:16px; height:16px; margin:0; accent-color:var(--accent); }
  @keyframes slide { from { transform:translateX(100%); } }
  @media (prefers-reduced-motion:reduce) { dialog[open] { animation:none; } * { transition:none !important; } }
</style>
</head>
<body>
<h1>Pedidos</h1>
<p>128 pedidos este mes.</p>
<button type="button" class="btn" id="open" aria-haspopup="dialog">Filtros</button>
<div id="summary" role="status"></div>

<dialog id="drawer" aria-labelledby="d-title">
  <header>
    <h2 id="d-title">Filtros</h2>
    <button type="button" class="x" id="x" aria-label="Cerrar filtros">×</button>
  </header>
  <form id="f" method="dialog" style="display:contents">
    <div class="body">
      <fieldset>
        <legend>Estado</legend>
        <label><input type="checkbox" name="estado" value="Pendiente" checked> Pendiente</label>
        <label><input type="checkbox" name="estado" value="Enviado"> Enviado</label>
        <label><input type="checkbox" name="estado" value="Entregado"> Entregado</label>
      </fieldset>
      <fieldset>
        <legend>Orden</legend>
        <label><input type="radio" name="orden" value="recientes" checked> Más recientes</label>
        <label><input type="radio" name="orden" value="importe"> Mayor importe</label>
      </fieldset>
    </div>
    <footer>
      <button type="reset" class="btn">Limpiar</button>
      <button class="btn main" value="apply">Aplicar filtros</button>
    </footer>
  </form>
</dialog>
<script>
  const d = document.getElementById('drawer'), opener = document.getElementById('open'), f = document.getElementById('f');
  opener.addEventListener('click', () => d.showModal());
  document.getElementById('x').addEventListener('click', () => d.close());
  d.addEventListener('click', (e) => { if (e.target === d) d.close(); }); // clic en el fondo
  d.addEventListener('close', () => {
    opener.focus();
    if (d.returnValue !== 'apply') return;
    const estados = new FormData(f).getAll('estado');
    document.getElementById('summary').textContent =
      'Filtrando: ' + (estados.length ? estados.join(', ') : 'todos los estados') + '.';
    d.returnValue = '';
  });
</script>
</body>
</html>
