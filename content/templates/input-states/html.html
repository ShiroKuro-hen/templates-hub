<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estados de input</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:16px 14px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  label { font-weight:600; font-size:13px; }
  input { width:100%; height:38px; padding:0 10px; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:border-color .14s; }
  input::placeholder { color:var(--muted); }
  input:hover:not(:disabled) { border-color:var(--muted); }
  input:focus, input.is-focus { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:2px; }
  input[aria-invalid=true] { border-color:var(--err); }
  input.ok { border-color:var(--ok); }
  input:disabled { color:var(--muted); background:var(--bg); cursor:not-allowed; }
  .help { display:flex; gap:4px; margin:0; font-size:12px; color:var(--muted); }
  .help::before { flex:none; font-weight:700; }
  .err { color:var(--err); } .err::before { content:"✕"; }
  .good::before { content:"✓"; color:var(--ok); }
  @media (prefers-reduced-motion:reduce) { input { transition:none; } }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label for="f1">Nombre</label>
      <input id="f1" placeholder="Ana Torres" aria-describedby="h1">
      <p class="help" id="h1">Como aparece en tu DNI.</p>
    </div>
    <div class="field">
      <label for="f2">Usuario</label>
      <input id="f2" class="is-focus" value="ana.torres" aria-describedby="h2">
      <p class="help" id="h2">Haz clic para ver el foco.</p>
    </div>
    <div class="field">
      <label for="f3">Correo</label>
      <input id="f3" type="email" value="ana@correo" aria-invalid="true" aria-describedby="h3">
      <p class="help err" id="h3">Falta el dominio. Añade, por ejemplo, .com</p>
    </div>
    <div class="field">
      <label for="f4">Código postal</label>
      <input id="f4" class="ok" value="28013" aria-describedby="h4">
      <p class="help good" id="h4">Código verificado.</p>
    </div>
    <div class="field">
      <label for="f5">País</label>
      <input id="f5" value="España" disabled aria-describedby="h5">
      <p class="help" id="h5">No se puede cambiar.</p>
    </div>
  </div>
</body>
</html>
