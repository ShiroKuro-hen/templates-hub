<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estados de input</title>
<style>
  :root { --ink:#17130f; --paper:#f6f1e7; --surface:#fffdf8; --muted:#6b6258; --accent:#ff5a36; --ok:#1f9d55; --err:#d6293e; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; font:14px/1.4 system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px 14px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  label { font-weight:700; font-size:13px; letter-spacing:-.01em; }
  input { width:100%; height:38px; padding:0 10px; font:inherit; color:var(--ink); background:var(--surface); border:2px solid var(--ink); border-radius:10px; }
  input::placeholder { color:var(--muted); }
  input:focus, input.is-focus { outline:3px solid var(--accent); outline-offset:1px; }
  input[aria-invalid=true] { border-color:var(--err); background:#fff3f4; }
  input.ok { border-color:var(--ok); }
  input:disabled { color:var(--muted); background:#ebe4d4; border-style:dashed; cursor:not-allowed; }
  .help { display:flex; gap:4px; margin:0; font-size:12px; color:var(--muted); }
  .help::before { flex:none; font-weight:800; }
  .err { color:var(--err); } .err::before { content:"✕"; }
  .good::before { content:"✓"; color:var(--ok); }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label for="f1">Nombre</label>
      <input id="f1" placeholder="Ana Torres" aria-describedby="h1">
      <p class="help" id="h1">Como aparece en tu DNI.</p>
    </div>
    <div class="field">
      <label for="f2">Usuario</label>
      <input id="f2" class="is-focus" value="ana.torres" aria-describedby="h2">
      <p class="help" id="h2">Estado de foco (haz clic).</p>
    </div>
    <div class="field">
      <label for="f3">Correo</label>
      <input id="f3" type="email" value="ana@correo" aria-invalid="true" aria-describedby="h3">
      <p class="help err" id="h3">Falta el dominio, p. ej. .com</p>
    </div>
    <div class="field">
      <label for="f4">Código postal</label>
      <input id="f4" class="ok" value="28013" aria-describedby="h4">
      <p class="help good" id="h4">Código verificado.</p>
    </div>
    <div class="field">
      <label for="f5">País</label>
      <input id="f5" value="España" disabled aria-describedby="h5">
      <p class="help" id="h5">No se puede cambiar.</p>
    </div>
  </div>
</body>
</html>
