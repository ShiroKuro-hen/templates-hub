<div class="grid grid-cols-[repeat(auto-fit,minmax(170px,1fr))] gap-x-3.5 gap-y-4 p-5 text-fg">
  <div class="flex flex-col gap-1">
    <label for="f1" class="text-[13px] font-semibold">Nombre</label>
    <input id="f1" placeholder="Ana Torres" aria-describedby="h1"
      class="h-[38px] w-full rounded-lg border border-line bg-surface px-2.5 placeholder:text-muted hover:border-line focus-visible:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <p id="h1" class="text-xs text-muted">Como aparece en tu DNI.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f3" class="text-[13px] font-semibold">Correo</label>
    <input id="f3" type="email" value="ana@correo" aria-invalid="true" aria-describedby="h3"
      class="h-[38px] w-full rounded-lg border border-err bg-surface px-2.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <p id="h3" class="flex gap-1 text-xs text-err"><span aria-hidden="true" class="font-bold">✕</span>Falta el dominio. Añade, por ejemplo, .com</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f4" class="text-[13px] font-semibold">Código postal</label>
    <input id="f4" value="28013" aria-describedby="h4"
      class="h-[38px] w-full rounded-lg border border-ok bg-surface px-2.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <p id="h4" class="flex gap-1 text-xs text-muted"><span aria-hidden="true" class="font-bold text-ok">✓</span>Código verificado.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f5" class="text-[13px] font-semibold">País</label>
    <input id="f5" value="España" disabled aria-describedby="h5"
      class="h-[38px] w-full cursor-not-allowed rounded-lg border border-line bg-page px-2.5 text-muted">
    <p id="h5" class="text-xs text-muted">No se puede cambiar.</p>
  </div>
</div>
