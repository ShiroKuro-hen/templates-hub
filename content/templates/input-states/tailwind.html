<div class="grid grid-cols-[repeat(auto-fit,minmax(150px,1fr))] gap-x-3.5 gap-y-3 p-3.5">
  <div class="flex flex-col gap-1">
    <label for="f1" class="text-[13px] font-bold">Nombre</label>
    <input id="f1" placeholder="Ana Torres" aria-describedby="h1"
      class="h-[38px] w-full rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-2.5 placeholder:text-[#6b6258] focus:outline-[3px] focus:outline-offset-1 focus:outline-[#ff5a36]">
    <p id="h1" class="text-xs text-[#6b6258]">Como aparece en tu DNI.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f3" class="text-[13px] font-bold">Correo</label>
    <input id="f3" type="email" value="ana@correo" aria-invalid="true" aria-describedby="h3"
      class="h-[38px] w-full rounded-[10px] border-2 border-[#d6293e] bg-[#fff3f4] px-2.5 focus:outline-[3px] focus:outline-offset-1 focus:outline-[#ff5a36]">
    <p id="h3" class="flex gap-1 text-xs text-[#d6293e]"><span aria-hidden="true" class="font-extrabold">✕</span>Falta el dominio, p. ej. .com</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f4" class="text-[13px] font-bold">Código postal</label>
    <input id="f4" value="28013" aria-describedby="h4"
      class="h-[38px] w-full rounded-[10px] border-2 border-[#1f9d55] bg-[#fffdf8] px-2.5 focus:outline-[3px] focus:outline-offset-1 focus:outline-[#ff5a36]">
    <p id="h4" class="flex gap-1 text-xs text-[#6b6258]"><span aria-hidden="true" class="font-extrabold text-[#1f9d55]">✓</span>Código verificado.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f5" class="text-[13px] font-bold">País</label>
    <input id="f5" value="España" disabled aria-describedby="h5"
      class="h-[38px] w-full cursor-not-allowed rounded-[10px] border-2 border-dashed border-[#17130f] bg-[#ebe4d4] px-2.5 text-[#6b6258]">
    <p id="h5" class="text-xs text-[#6b6258]">No se puede cambiar.</p>
  </div>
</div>
