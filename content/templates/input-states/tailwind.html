<div class="grid grid-cols-[repeat(auto-fit,minmax(170px,1fr))] gap-x-3.5 gap-y-4 p-5 text-slate-900 dark:text-slate-100">
  <div class="flex flex-col gap-1">
    <label for="f1" class="text-[13px] font-semibold">Nombre</label>
    <input id="f1" placeholder="Ana Torres" aria-describedby="h1"
      class="h-[38px] w-full rounded-lg border border-slate-200 bg-white px-2.5 placeholder:text-slate-500 hover:border-slate-400 focus-visible:border-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:placeholder:text-slate-400">
    <p id="h1" class="text-xs text-slate-500 dark:text-slate-400">Como aparece en tu DNI.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f3" class="text-[13px] font-semibold">Correo</label>
    <input id="f3" type="email" value="ana@correo" aria-invalid="true" aria-describedby="h3"
      class="h-[38px] w-full rounded-lg border border-red-600 bg-white px-2.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-red-400 dark:bg-slate-900">
    <p id="h3" class="flex gap-1 text-xs text-red-600 dark:text-red-400"><span aria-hidden="true" class="font-bold">✕</span>Falta el dominio. Añade, por ejemplo, .com</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f4" class="text-[13px] font-semibold">Código postal</label>
    <input id="f4" value="28013" aria-describedby="h4"
      class="h-[38px] w-full rounded-lg border border-emerald-600 bg-white px-2.5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-emerald-400 dark:bg-slate-900">
    <p id="h4" class="flex gap-1 text-xs text-slate-500 dark:text-slate-400"><span aria-hidden="true" class="font-bold text-emerald-600 dark:text-emerald-400">✓</span>Código verificado.</p>
  </div>
  <div class="flex flex-col gap-1">
    <label for="f5" class="text-[13px] font-semibold">País</label>
    <input id="f5" value="España" disabled aria-describedby="h5"
      class="h-[38px] w-full cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-2.5 text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400">
    <p id="h5" class="text-xs text-slate-500 dark:text-slate-400">No se puede cambiar.</p>
  </div>
</div>
