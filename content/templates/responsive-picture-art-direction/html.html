<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagen responsive con dirección de arte</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  h2{margin:0 0 12px;font-size:18px;font-weight:600}
  .ctl{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
  .ctl label{color:var(--muted)}
  input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent)}
  output{min-width:64px;font-variant-numeric:tabular-nums;font-weight:600}
  .stage{max-width:100%;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:width .2s ease}
  .preview{display:block;width:100%;height:240px;border:0}
  .ind,.note{margin:12px 0 0;color:var(--muted);font-size:13px}
  .ind b{color:var(--text);font-weight:600}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h2>Portada del evento</h2>
  <div class="ctl">
    <label for="range">Ancho de la vista previa</label>
    <input id="range" type="range" min="320" max="960" step="10" value="640" aria-valuetext="640 px">
    <output id="w" for="range">640 px</output>
  </div>
  <div class="stage" id="stage">
    <iframe id="preview" class="preview" title="Vista previa del picture"></iframe>
  </div>
  <p class="ind" aria-live="polite">Fuente activa: <b id="src">cargando</b> · ancho del marco <span id="vp"></span> px</p>
  <p class="note">El atributo media de source responde al ancho del viewport, no al del contenedor. Por eso la vista previa es un iframe: el deslizador cambia su ancho y el navegador vuelve a elegir la imagen.</p>
</main>
<template id="art">
  <picture>
    <source media="(max-width: 600px)" srcset="/stock/atardecer-vertical.webp">
    <img loading="lazy" src="/stock/atardecer-panoramica.webp" alt="Atardecer sobre un paisaje de colinas con el sol bajo el horizonte" width="1200" height="500">
  </picture>
</template>
<script>
  const $ = (id) => document.getElementById(id);
  const SOURCES = { 'atardecer-vertical.webp': 'vertical para móvil', 'atardecer-panoramica.webp': 'panorámica para escritorio' };
  const range = $('range'), stage = $('stage'), preview = $('preview'), out = $('w'), src = $('src'), vp = $('vp');
  const REPORT_SCRIPT = `<script>const img=document.querySelector('img');const report=()=>parent.postMessage({pictureSrc:img.currentSrc,width:innerWidth,height:Math.ceil(img.getBoundingClientRect().height)},'*');img.addEventListener('load',report);addEventListener('resize',report);<\/script>`;
  const SRCDOC = `<!doctype html><html lang="es"><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}img{display:block;width:100%;height:auto}</style></head><body>${$('art').innerHTML}${REPORT_SCRIPT}</body></html>`;

  function setWidth() {
    stage.style.width = `${range.value}px`;
    range.setAttribute('aria-valuetext', `${range.value} px`);
    out.textContent = `${range.value} px`;
  }

  function sourceName(pictureSrc) {
    const file = Object.keys(SOURCES).find((f) => pictureSrc.endsWith(f));
    return file ? SOURCES[file] : 'cargando';
  }

  function onReport(e) {
    if (e.source !== preview.contentWindow || typeof e.data?.pictureSrc !== 'string') return;
    const { pictureSrc, width, height } = e.data;
    preview.style.height = `${height}px`;
    src.textContent = sourceName(pictureSrc);
    vp.textContent = width;
  }

  range.addEventListener('input', setWidth);
  addEventListener('message', onReport);
  preview.srcdoc = SRCDOC;
  setWidth();
</script>
</body>
</html>
