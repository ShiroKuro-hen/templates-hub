<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f6f1e7;color:#17130f}
  :focus-visible{outline:3px solid #ff5a36;outline-offset:3px}
  .hero{display:grid;gap:28px;align-items:center;max-width:1040px;margin:0 auto;padding:36px 20px}
  @media(min-width:640px){.hero{grid-template-columns:1.15fr 1fr;padding:44px 32px}}
  .badge{display:inline-flex;gap:8px;align-items:center;margin:0 0 16px;padding:4px 12px;border:2px solid #17130f;border-radius:99px;background:#ffd84d;font:600 .75rem ui-monospace,monospace}
  h1{margin:0 0 14px;font-size:clamp(2rem,6.2vw,3.4rem);line-height:1.02;letter-spacing:-.03em}
  .sub{margin:0 0 24px;max-width:46ch;color:#6b6258;font-size:1.05rem}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;gap:8px;align-items:center;padding:12px 20px;border:2px solid #17130f;border-radius:10px;background:#fffdf8;color:#17130f;font:700 1rem system-ui,sans-serif;text-decoration:none;box-shadow:4px 4px 0 #17130f;transition:transform .12s,box-shadow .12s}
  .btn.main{background:#ff5a36}
  .btn:hover,.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #17130f}
  .note{margin:16px 0 0;color:#6b6258;font-size:.85rem}
  .art{width:100%;height:auto;overflow:visible}
  @media(prefers-reduced-motion:no-preference){.pop{animation:pop .6s .2s both cubic-bezier(.3,1.6,.5,1);transform-origin:268px 52px}}
  @keyframes pop{from{transform:scale(0) rotate(-40deg)}}
  @media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
  <section class="hero" aria-labelledby="h">
    <div>
      <p class="badge">Novedad · Nimbo 2.0</p>
      <h1 id="h">Todo tu equipo, en el mismo plan.</h1>
      <p class="sub">Nimbo reúne tareas, plazos y conversaciones en un tablero claro, para que cada proyecto llegue a tiempo sin reuniones de más.</p>
      <div class="row">
        <a class="btn main" href="#empezar">Empezar gratis</a>
        <a class="btn" href="#demo">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>
          Ver demo
        </a>
      </div>
      <p class="note">14 días de prueba. No necesitas tarjeta.</p>
    </div>
    <svg class="art" viewBox="0 0 320 260" role="img" aria-label="Tablero de tareas con tres columnas y una tarea completada">
      <g stroke="#17130f" stroke-width="3" stroke-linejoin="round">
        <rect x="14" y="14" width="296" height="236" rx="12" fill="#17130f"/>
        <rect x="6" y="6" width="296" height="236" rx="12" fill="#fffdf8"/>
        <path d="M6 42h296" fill="none"/>
        <g fill="#ff5a36"><circle cx="24" cy="24" r="5"/></g><circle cx="40" cy="24" r="5" fill="#ffd84d"/><circle cx="56" cy="24" r="5" fill="#1f9d55"/>
        <g fill="#f6f1e7">
          <rect x="20" y="58" width="82" height="170" rx="8"/><rect x="113" y="58" width="82" height="170" rx="8"/><rect x="206" y="58" width="82" height="170" rx="8"/>
        </g>
        <rect x="28" y="70" width="66" height="34" rx="6" fill="#fffdf8"/><rect x="28" y="112" width="66" height="44" rx="6" fill="#ffd84d"/><rect x="28" y="164" width="66" height="34" rx="6" fill="#fffdf8"/>
        <rect x="121" y="70" width="66" height="50" rx="6" fill="#fffdf8"/><rect x="121" y="128" width="66" height="34" rx="6" fill="#3b5bfd"/>
        <rect x="214" y="70" width="66" height="34" rx="6" fill="#fffdf8"/><rect x="214" y="112" width="66" height="50" rx="6" fill="#fffdf8"/>
      </g>
      <g stroke="#17130f" stroke-width="3" stroke-linecap="round" fill="none"><path d="M36 82h34M36 92h22M36 124h40M36 134h26M36 176h32M129 82h38M129 92h30M129 102h20M222 82h30M222 124h38M222 134h24M222 144h30"/></g>
      <g class="pop"><circle cx="268" cy="52" r="26" fill="#1f9d55" stroke="#17130f" stroke-width="3"/><path d="M256 52l9 9 16-18" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>
  </section>
</body>
</html>
