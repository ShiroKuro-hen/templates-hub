<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero de landing</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hero{display:grid;gap:40px;align-items:center;max-width:1040px;margin:0 auto;padding:32px 0}
  @media(min-width:720px){.hero{grid-template-columns:1.1fr 1fr;padding:48px 0}}
  .badge{display:inline-block;margin:0 0 20px;padding:4px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:500}
  h1{margin:0 0 16px;font-size:clamp(2.1rem,6vw,3.6rem);font-weight:700;line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
  .sub{margin:0 0 32px;max-width:46ch;color:var(--muted);font-size:1.1rem;line-height:1.55}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;gap:8px;align-items:center;padding:11px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font:600 1rem system-ui,sans-serif;text-decoration:none;transition:filter .14s,border-color .14s,transform .14s}
  .btn:hover{border-color:var(--muted)}
  .btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
  .btn.main:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .note{margin:16px 0 0;color:var(--muted);font-size:.85rem}
  .art{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 20px rgba(14,23,38,.1))}
  .art .win,.art .card{fill:var(--surface);stroke:var(--border)}
  .art .col{fill:var(--bg);stroke:var(--border)}
  .art .hot{fill:var(--accent-soft);stroke:var(--accent)}
  .art .dot{fill:var(--border)}
  .art .ln{fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;opacity:.45}
  @media(prefers-reduced-motion:no-preference){.pop{animation:pop .5s .2s both cubic-bezier(.2,1.4,.4,1);transform-origin:268px 52px}}
  @keyframes pop{from{transform:scale(0)}}
  @media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
  <section class="hero" aria-labelledby="h">
    <div>
      <p class="badge">Nimbo 2.0 ya está disponible</p>
      <h1 id="h">Todo tu equipo, en el mismo plan.</h1>
      <p class="sub">Nimbo reúne tareas, plazos y conversaciones en un tablero claro, para que cada proyecto llegue a tiempo sin reuniones de más.</p>
      <div class="row">
        <a class="btn main" href="#empezar">Empezar gratis</a>
        <a class="btn" href="#demo">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>
          Ver demo
        </a>
      </div>
      <p class="note">14 días de prueba. No necesitas tarjeta.</p>
    </div>
    <svg class="art" viewBox="0 0 320 260" role="img" aria-label="Tablero de tareas con tres columnas y una tarea completada">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>
      <rect class="win" x="6" y="6" width="308" height="244" rx="10"/>
      <path class="dot" d="M6 42h308" stroke="var(--border)"/>
      <circle class="dot" cx="24" cy="24" r="4"/><circle class="dot" cx="38" cy="24" r="4"/><circle class="dot" cx="52" cy="24" r="4"/>
      <rect class="col" x="18" y="56" width="90" height="182" rx="8"/><rect class="col" x="115" y="56" width="90" height="182" rx="8"/><rect class="col" x="212" y="56" width="90" height="182" rx="8"/>
      <rect class="card" x="26" y="68" width="74" height="36" rx="6"/><rect class="hot" x="26" y="112" width="74" height="46" rx="6"/><rect class="card" x="26" y="166" width="74" height="36" rx="6"/>
      <rect class="card" x="123" y="68" width="74" height="50" rx="6"/><rect class="card" x="123" y="126" width="74" height="36" rx="6"/>
      <rect class="card" x="220" y="68" width="74" height="36" rx="6"/><rect class="card" x="220" y="112" width="74" height="50" rx="6"/>
      <path class="ln" d="M34 80h36M34 90h24M34 124h42M34 134h28M34 178h32M131 80h40M131 90h32M131 100h22M228 80h32M228 124h40M228 134h26M228 144h32"/>
      <g class="pop"><circle cx="268" cy="52" r="22" fill="url(#hg)"/><path d="M258 52l7 7 13-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    </svg>
  </section>
</body>
</html>
