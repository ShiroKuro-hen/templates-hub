<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f6f1e7;color:#17130f}
  .quotes{max-width:1040px;margin:0 auto;padding:36px 20px}
  h2{max-width:30rem;margin:0 0 28px;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.1;letter-spacing:-.03em}
  .list{display:grid;gap:18px;margin:0;padding:0;list-style:none;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
  figure{display:flex;flex-direction:column;height:100%;margin:0;padding:22px;border:2px solid #17130f;border-radius:10px;background:#fffdf8;box-shadow:4px 4px 0 #17130f}
  .mark{width:30px;height:24px;margin-bottom:12px;fill:#ff5a36;stroke:#17130f;stroke-width:2}
  blockquote{flex:1;margin:0 0 18px;font-size:1.02rem;line-height:1.55}
  figcaption{display:flex;gap:12px;align-items:center;padding-top:16px;border-top:2px solid #17130f}
  .av{flex:none;display:grid;place-items:center;width:42px;height:42px;border:2px solid #17130f;border-radius:50%;background:var(--c);font:700 .85rem ui-monospace,monospace}
  .who{display:block;font-weight:700}
  .role{display:block;color:#6b6258;font-size:.85rem}
  li:nth-child(2) figure{background:#ffd84d}
  li:nth-child(2) .role{color:#3d362e}
</style>
</head>
<body>
  <section class="quotes" aria-labelledby="t">
    <h2 id="t">Equipos que ya trabajan con Nimbo</h2>
    <ul class="list">
      <li>
        <figure>
          <svg class="mark" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 22V11C2 5 6 2 11 2v5C8 7 7 9 7 11h4v11zM17 22V11c0-6 4-9 9-9v5c-3 0-4 2-4 4h4v11z"/></svg>
          <blockquote><p>Pasamos de cinco herramientas a una. Las revisiones semanales duran la mitad y nadie pregunta ya en qué estado está cada entrega.</p></blockquote>
          <figcaption><span class="av" style="--c:#c9d3ff" aria-hidden="true">LM</span><span><span class="who">Lucía Méndez</span><span class="role">Directora de operaciones, Finca Norte</span></span></figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <svg class="mark" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 22V11C2 5 6 2 11 2v5C8 7 7 9 7 11h4v11zM17 22V11c0-6 4-9 9-9v5c-3 0-4 2-4 4h4v11z"/></svg>
          <blockquote><p>Las automatizaciones nos ahorran unas ocho horas por semana. Por fin el equipo de diseño y el de desarrollo comparten el mismo tablero.</p></blockquote>
          <figcaption><span class="av" style="--c:#fffdf8" aria-hidden="true">JR</span><span><span class="who">Javier Ruiz</span><span class="role">Líder de producto, Orbita Labs</span></span></figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <svg class="mark" viewBox="0 0 30 24" aria-hidden="true"><path d="M2 22V11C2 5 6 2 11 2v5C8 7 7 9 7 11h4v11zM17 22V11c0-6 4-9 9-9v5c-3 0-4 2-4 4h4v11z"/></svg>
          <blockquote><p>Los informes en vivo cambiaron las reuniones con clientes: enseñamos el avance real, sin preparar presentaciones.</p></blockquote>
          <figcaption><span class="av" style="--c:#ff5a36" aria-hidden="true">SP</span><span><span class="who">Sofía Paredes</span><span class="role">Fundadora, Estudio Tramo</span></span></figcaption>
        </figure>
      </li>
    </ul>
  </section>
</body>
</html>
