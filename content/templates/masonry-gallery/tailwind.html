      <li class="mb-3 break-inside-avoid"><button type="button" aria-haspopup="dialog" data-caption="Cañón verde" style="--ar:4/3" class="group relative block w-full cursor-zoom-in overflow-hidden rounded-lg border border-line bg-surface p-0 shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"><img loading="lazy" src="/stock/canon-verde.webp" alt="Cañón verde con un arroyo" width="800" height="533" decoding="async" class="block aspect-[var(--ar)] w-full object-cover transition duration-[.4s] group-hover:scale-[1.03] motion-reduce:transition-none"><span class="absolute inset-x-0 bottom-0 bg-[linear-gradient(transparent,rgba(0,0,0,.72))] px-3 pb-2.5 pt-7 text-left text-[13px] font-semibold text-[rgba(255,255,255,.96)] opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-focus-visible:opacity-100 motion-reduce:transition-none">Cañón verde</span></button></li>

  </main>
  <dialog id="dlg" aria-label="Imagen ampliada" class="m-auto max-h-[92vh] w-[min(92vw,900px)] overflow-auto rounded-lg border border-line bg-surface p-0 text-fg shadow-sm backdrop:bg-[rgba(0,0,0,.6)]">
    <figure class="m-0 p-3">
      <img id="dimg" alt="" width="800" height="533" class="mx-auto block h-auto max-h-[72vh] w-auto max-w-full rounded-md">
      <figcaption id="dcap" class="mt-2.5 text-center font-semibold"></figcaption>
    </figure>
    <button type="button" class="close absolute right-2 top-2 grid size-8 cursor-pointer place-items-center rounded-lg border border-line bg-surface text-xl leading-none text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" aria-label="Cerrar imagen">×</button>
  </dialog>
</div>
<script>
  const dlg = document.getElementById('dlg'), dimg = document.getElementById('dimg'), dcap = document.getElementById('dcap');
  let opener = null;
  document.querySelectorAll('[data-caption]').forEach((b) => b.addEventListener('click', () => {
    const img = b.querySelector('img');
    opener = b;
    dimg.src = img.getAttribute('src');
    dimg.alt = img.alt;
    dcap.textContent = b.dataset.caption;
    dlg.showModal();
  }));
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => opener?.focus());
</script>
</content>
