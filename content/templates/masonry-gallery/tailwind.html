    <button type="button" class="close absolute right-2 top-2 grid size-8 cursor-pointer place-items-center rounded-lg border border-line bg-surface text-xl leading-none text-fg hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" aria-label="Cerrar imagen">×</button>

<script>
  const dlg = document.getElementById('dlg'), dimg = document.getElementById('dimg'), dcap = document.getElementById('dcap');
  let opener = null;
  document.querySelectorAll('[data-caption]').forEach((b) => b.addEventListener('click', () => {
    const img = b.querySelector('img');
    opener = b;
    dimg.src = img.getAttribute('src');
    dimg.alt = img.alt;
    dimg.width = img.naturalWidth;
    dimg.height = img.naturalHeight;
    dcap.textContent = b.dataset.caption;
    dlg.showModal();
  }));
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => opener?.focus());
</script>
