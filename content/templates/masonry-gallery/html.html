<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería en mosaico</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gal{max-width:960px;margin:0 auto}
  h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
  .lead{margin:4px 0 18px;color:var(--muted)}
  .masonry{columns:3;column-gap:12px;margin:0;padding:0;list-style:none}
  .masonry li{break-inside:avoid;margin:0 0 12px}
  @media (max-width:767px){.masonry{columns:2}}
  @media (max-width:479px){.masonry{columns:1}}
  .shot{position:relative;display:block;width:100%;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);cursor:zoom-in}
  .shot img{display:block;width:100%;height:auto;aspect-ratio:var(--ar,4/3);object-fit:cover;transition:transform .4s ease}
  .shot:hover img{transform:scale(1.03)}
  .cap{position:absolute;inset:auto 0 0;padding:28px 12px 10px;color:rgba(255,255,255,.96);font-size:13px;font-weight:600;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transition:opacity .2s ease}
  .shot:hover .cap,.shot:focus-visible .cap{opacity:1}
  dialog{width:min(92vw,900px);max-height:92vh;padding:0;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog figure{margin:0;padding:12px}
  dialog img{display:block;width:auto;height:auto;max-width:100%;max-height:72vh;margin:0 auto;border-radius:min(var(--radius),6px)}
  figcaption{margin-top:10px;font-weight:600;text-align:center}
  .close{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:32px;height:32px;padding:0;font-size:20px;line-height:1;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
  .close:hover{border-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.shot:hover img{transform:none}}
</style>
</head>
<body>
<main class="gal" aria-labelledby="h">
  <h1 id="h">Galería de paisajes y ciudad</h1>
  <p class="lead">Pasa el cursor o usa el teclado para ver el pie. Pulsa una imagen para ampliarla.</p>
  <ul class="masonry">
    <li><button type="button" class="shot" style="--ar:16/9" aria-haspopup="dialog" data-caption="Costa azul con pinos"><img loading="lazy" src="/stock/costa-azul.webp" alt="Costa con pinos y mar azul" width="800" height="533" decoding="async"><span class="cap">Costa azul con pinos</span></button></li>
    <li><button type="button" class="shot" style="--ar:4/5" aria-haspopup="dialog" data-caption="Valle con bruma"><img loading="lazy" src="/stock/valle-bruma.webp" alt="Valle verde cubierto de bruma" width="800" height="533" decoding="async"><span class="cap">Valle con bruma</span></button></li>
    <li><button type="button" class="shot" style="--ar:1/1" aria-haspopup="dialog" data-caption="Calle entre edificios"><img loading="lazy" src="/stock/calle-ciudad.webp" alt="Calle de la ciudad entre edificios altos" width="800" height="533" decoding="async"><span class="cap">Calle entre edificios</span></button></li>
    <li><button type="button" class="shot" style="--ar:3/4" aria-haspopup="dialog" data-caption="Picos nevados"><img loading="lazy" src="/stock/montana-nieve.webp" alt="Picos montañosos cubiertos de nieve" width="800" height="533" decoding="async"><span class="cap">Picos nevados</span></button></li>
    <li><button type="button" class="shot" style="--ar:2/3" aria-haspopup="dialog" data-caption="Puente de noche"><img loading="lazy" src="/stock/puente-noche.webp" alt="Puente y skyline de noche en blanco y negro" width="800" height="533" decoding="async"><span class="cap">Puente de noche</span></button></li>
    <li><button type="button" class="shot" style="--ar:4/3" aria-haspopup="dialog" data-caption="Cañón verde"><img loading="lazy" src="/stock/canon-verde.webp" alt="Cañón verde con un arroyo" width="800" height="533" decoding="async"><span class="cap">Cañón verde</span></button></li>
    <li><button type="button" class="shot" style="--ar:4/5" aria-haspopup="dialog" data-caption="Pueblo blanco junto al mar"><img loading="lazy" src="/stock/isla-blanca.webp" alt="Pueblo blanco frente al mar" width="800" height="533" decoding="async"><span class="cap">Pueblo blanco junto al mar</span></button></li>
    <li><button type="button" class="shot" style="--ar:3/4" aria-haspopup="dialog" data-caption="Puerta antigua"><img loading="lazy" src="/stock/puerta-antigua.webp" alt="Puerta de madera antigua en un muro de piedra" width="800" height="533" decoding="async"><span class="cap">Puerta antigua</span></button></li>
  </ul>
</main>
<dialog id="dlg" aria-label="Imagen ampliada">
  <figure>
    <img id="dimg" alt="" width="800" height="533">
    <figcaption id="dcap"></figcaption>
  </figure>
  <button type="button" class="close" aria-label="Cerrar imagen">×</button>
</dialog>
<script>
  const dlg = document.getElementById('dlg'), dimg = document.getElementById('dimg'), dcap = document.getElementById('dcap');
  let opener = null;
  document.querySelectorAll('.shot').forEach((b) => b.addEventListener('click', () => {
    const img = b.querySelector('img');
    opener = b;
    dimg.src = img.getAttribute('src');
    dimg.alt = img.alt;
    dcap.textContent = b.dataset.caption;
    dlg.showModal();
  }));
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => opener?.focus());
</script>
</body>
</html>
