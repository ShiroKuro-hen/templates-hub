<figure class="mx-auto max-w-[760px] rounded-lg border border-line bg-surface p-5 text-sm text-fg shadow-sm">
  <figcaption>
    <h2 class="m-0 text-base font-semibold">Cronograma del proyecto</h2>
    <p class="mt-0.5 mb-3 text-muted">Seis semanas de trabajo. Pasa el ratón o enfoca una tarea para ver sus fechas y su avance.</p>
  </figcaption>
  <div class="scroll overflow-x-auto focus-visible:outline-2 focus-visible:outline-solid focus-visible:outline-accent" role="region" tabindex="0" aria-label="Cronograma desplazable horizontalmente">
  <svg id="gantt" class="block h-auto w-full min-w-[697px]" viewBox="0 0 760 350" role="img" aria-labelledby="gantt-t gantt-d">
    <title id="gantt-t">Cronograma del proyecto de seis semanas</title>
    <desc id="gantt-d">Seis tareas del 14 de septiembre al 25 de octubre: requisitos, diseño UX, API del backend, interfaz web, pruebas de QA y lanzamiento. Las flechas indican dependencias y la línea discontinua marca hoy, 20 de octubre.</desc>
    <defs>
      <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="arrow" d="M0 0L9 5L0 10z"/></marker>
      <marker id="ah-hot" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="arrow hot" d="M0 0L9 5L0 10z"/></marker>
    </defs>
    <text class="head" x="12" y="24">Tarea</text>
    <text class="head" x="234" y="24">14 sep</text>
    <text class="head" x="318" y="24">21 sep</text>
    <text class="head" x="402" y="24">28 sep</text>
    <text class="head" x="486" y="24">5 oct</text>
    <text class="head" x="570" y="24">12 oct</text>
    <text class="head" x="654" y="24">19 oct</text>
    <path class="grid" d="M230 32V284M314 32V284M398 32V284M482 32V284M566 32V284M650 32V284M734 32V284"/>
    <path class="dep" data-de="req" data-a="diseno" d="M302 64H314V104H326"/>
    <path class="dep" data-de="diseno" data-a="api" d="M398 104H410V144H422"/>
    <path class="dep" data-de="diseno" data-a="web" d="M398 104H410V184H422"/>
    <path class="dep" data-de="api" data-a="pruebas" d="M590 144H602V224H614"/>
    <path class="dep" data-de="web" data-a="pruebas" d="M566 184H578V224H614"/>
    <path class="dep" data-de="pruebas" data-a="lanza" d="M686 224H698V264H710"/>
    <rect class="done" x="12" y="320" width="14" height="10" rx="3"/>
    <text class="leyenda" x="32" y="329">Progreso</text>
    <rect class="base" x="120" y="320" width="14" height="10" rx="3"/>
    <text class="leyenda" x="140" y="329">Pendiente</text>
    <path class="dep" d="M216 325H236"/>
    <text class="leyenda" x="244" y="329">Dependencia</text>
    <line class="hoy" x1="340" x2="340" y1="318" y2="332"/>
    <text class="leyenda" x="348" y="329">Hoy</text>
  </svg>
  </div>
</figure>
<style>
  .grid{fill:none;stroke:var(--border);stroke-width:1}
  .head,.leyenda{fill:var(--muted);font-size:12px}
  .task{fill:var(--text);font-size:13px;font-weight:600;transition:opacity .14s}
  .bar{cursor:pointer;outline:none;transition:opacity .14s}
  .base{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  .done{fill:var(--accent)}
  .bar.on .base{stroke-width:2.5}
  .bar:focus-visible .base{stroke-width:3}
  .dep{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#ah);transition:opacity .14s,stroke .14s}
  .dep.hot{stroke:var(--accent);stroke-width:2.5;marker-end:url(#ah-hot)}
  .arrow{fill:var(--muted)}
  .arrow.hot{fill:var(--accent)}
  .hoy{stroke:var(--err);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
  .hoy-txt{fill:var(--err);font-size:12px;font-weight:600}
  .tip{display:none;pointer-events:none}
  .tip.show{display:inline}
  .tip rect{fill:var(--surface);stroke:var(--border)}
  .tip-name{fill:var(--text);font-size:13px;font-weight:600}
  .tip-info{fill:var(--muted);font-size:12px}
  svg.active [data-id]:not(.on){opacity:.35}
  svg.active .dep[data-de]:not(.hot){opacity:.35}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
  const svg = document.getElementById('gantt');
  const TAREAS = [
    { id: 'req', nombre: 'Requisitos', inicio: 0, dur: 6, pct: 100, fechas: '14 sep – 19 sep' },
    { id: 'diseno', nombre: 'Diseño UX', inicio: 8, dur: 6, pct: 100, fechas: '22 sep – 27 sep' },
    { id: 'api', nombre: 'API del backend', inicio: 16, dur: 14, pct: 60, fechas: '30 sep – 13 oct' },
    { id: 'web', nombre: 'Interfaz web', inicio: 16, dur: 12, pct: 45, fechas: '30 sep – 11 oct' },
    { id: 'pruebas', nombre: 'Pruebas de QA', inicio: 32, dur: 6, pct: 20, fechas: '16 oct – 21 oct' },
    { id: 'lanza', nombre: 'Lanzamiento', inicio: 40, dur: 2, pct: 0, fechas: '24 oct – 25 oct' },
  ];
  const X0 = 230, DIA = 12, FILA = 40, Y0 = 44, BARRA = 22, ANCHO = 760, TIP_W = 250, TIP_H = 44;
  const barX = (t) => X0 + t.inicio * DIA;
  const barY = (i) => Y0 + i * FILA + 9;

  const filas = TAREAS.map((t, i) => `
    <text class="task" data-id="${t.id}" x="12" y="${barY(i) + 15}">${t.nombre}</text>
    <g class="bar" data-id="${t.id}" tabindex="0" role="group" aria-label="${t.nombre}, del ${t.fechas}, ${t.pct} % completado">
      <rect class="base" x="${barX(t)}" y="${barY(i)}" width="${t.dur * DIA}" height="${BARRA}" rx="6"/>
      <rect class="done" x="${barX(t)}" y="${barY(i)}" width="${(t.dur * DIA * t.pct) / 100}" height="${BARRA}" rx="6"/>
    </g>`).join('');
  const hoy = `<line class="hoy" x1="668" x2="668" y1="32" y2="284"/>
    <text class="hoy-txt" x="668" y="300" text-anchor="middle">Hoy · 20 oct</text>`;
  const tip = `<g class="tip" aria-hidden="true"><rect width="${TIP_W}" height="${TIP_H}" rx="6"/><text class="tip-name" x="12" y="18"></text><text class="tip-info" x="12" y="36"></text></g>`;
  svg.insertAdjacentHTML('beforeend', filas + hoy + tip);

  const tipGrupo = svg.querySelector('.tip');
  const [tipNombre, tipInfo] = tipGrupo.querySelectorAll('text');
  const deps = [...svg.querySelectorAll('[data-de]')];
  const enlazados = (id) => new Set([id, ...deps.filter((d) => [d.dataset.de, d.dataset.a].includes(id)).flatMap((d) => [d.dataset.de, d.dataset.a])]);

  function posicionarTip(t) {
    const i = TAREAS.indexOf(t);
    const x = Math.min(Math.max(barX(t), 8), ANCHO - 8 - TIP_W);
    const arriba = barY(i) - TIP_H - 8;
    const y = arriba >= 30 ? arriba : barY(i) + BARRA + 8;
    tipGrupo.setAttribute('transform', `translate(${x} ${y})`);
  }
  function resaltar(id) {
    svg.classList.toggle('active', Boolean(id));
    const cercanos = id ? enlazados(id) : new Set();
    svg.querySelectorAll('[data-id]').forEach((el) => el.classList.toggle('on', cercanos.has(el.dataset.id)));
    deps.forEach((d) => d.classList.toggle('hot', Boolean(id) && [d.dataset.de, d.dataset.a].includes(id)));
    tipGrupo.classList.toggle('show', Boolean(id));
    const t = TAREAS.find((x) => x.id === id);
    if (!t) return;
    tipNombre.textContent = t.nombre;
    tipInfo.textContent = `${t.fechas} · ${t.pct} % completado`;
    posicionarTip(t);
  }
  const idDe = (e) => e.target.closest('.bar')?.dataset.id ?? null;
  svg.addEventListener('pointerover', (e) => resaltar(idDe(e)));
  svg.addEventListener('pointerleave', () => resaltar(null));
  svg.addEventListener('focusin', (e) => resaltar(idDe(e)));
  svg.addEventListener('focusout', () => resaltar(null));
</script>
