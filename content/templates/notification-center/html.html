<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{min-height:420px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .nc{position:relative}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bell{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--radius);color:var(--muted);transition:background .14s,color .14s}
  .bell:hover,.bell[aria-expanded=true]{background:var(--accent-soft);color:var(--text)}
  .count{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
  .count[hidden]{display:none}
  .panel{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:min(360px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
  h2{margin:0;font-size:15px;font-weight:600}
  .link{padding:2px 4px;border-radius:4px;color:var(--accent);font-weight:500}
  .link:disabled{color:var(--muted);cursor:default}
  ul{list-style:none;margin:0;padding:4px 0;max-height:300px;overflow:auto}
  .item{display:grid;grid-template-columns:8px 1fr;gap:2px 12px;width:100%;padding:10px 16px;text-align:left;transition:background .14s}
  .item:hover{background:var(--accent-soft)}
  .item:focus-visible{outline-offset:-2px}
  .dot{grid-row:span 2;width:8px;height:8px;margin-top:7px;border-radius:999px}
  .unread .dot{background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .item strong{font-weight:400}
  .unread strong{font-weight:600}
  .item small{color:var(--muted);font-size:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .item:not(.unread) .sr{display:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <strong>Consola</strong>
    <div class="nc">
      <button class="bell" id="bell" type="button" aria-expanded="true" aria-controls="panel" aria-label="Notificaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="count" id="count" aria-hidden="true"></span>
      </button>
      <section class="panel" id="panel" aria-labelledby="nc-title">
        <header><h2 id="nc-title">Notificaciones</h2><button class="link" id="all" type="button">Marcar todo como leído</button></header>
        <ul id="list">
          <li><button class="item unread" type="button"><span class="dot"><span class="sr">Sin leer.</span></span><strong>Despliegue completado en producción</strong><small>Hace 5 min</small></button></li>
          <li><button class="item unread" type="button"><span class="dot"><span class="sr">Sin leer.</span></span><strong>Marta Ruiz te asignó la incidencia #482</strong><small>Hace 32 min</small></button></li>
          <li><button class="item unread" type="button"><span class="dot"><span class="sr">Sin leer.</span></span><strong>Tu factura de septiembre está disponible</strong><small>Hace 2 h</small></button></li>
          <li><button class="item" type="button"><span class="dot"><span class="sr">Sin leer.</span></span><strong>Se renovó el certificado SSL de api.ion.dev</strong><small>Ayer</small></button></li>
        </ul>
      </section>
    </div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const bell = $('bell'), panel = $('panel'), list = $('list'), all = $('all'), count = $('count');
  function sync() {
    const n = list.querySelectorAll('.unread').length;
    count.textContent = n; count.hidden = !n; all.disabled = !n;
    bell.setAttribute('aria-label', n ? `Notificaciones, ${n} sin leer` : 'Notificaciones, todo leído');
  }
  function toggle(open) { panel.hidden = !open; bell.setAttribute('aria-expanded', open); }
  bell.addEventListener('click', () => toggle(panel.hidden));
  list.addEventListener('click', (e) => { const it = e.target.closest('.item'); if (it) { it.classList.remove('unread'); sync(); } });
  all.addEventListener('click', () => { list.querySelectorAll('.unread').forEach((i) => i.classList.remove('unread')); sync(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { toggle(false); bell.focus(); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.nc')) toggle(false); });
  sync();
</script>
</body>
</html>
