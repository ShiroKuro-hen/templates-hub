<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú con popover</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1 { margin:0 0 4px; font-size:1.125rem; font-weight:600; letter-spacing:-.01em; }
  p { margin:0 0 16px; color:var(--muted); }
  .btn { font:600 14px system-ui, -apple-system, "Segoe UI", sans-serif; padding:8px 14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 1px 2px rgba(14,23,38,.06); cursor:pointer; transition:border-color 140ms, background 140ms; }
  .btn:hover { border-color:var(--accent); }
  .btn[aria-expanded="true"] { color:var(--accent); background:var(--accent-soft); border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #result { margin-top:16px; font-size:13px; color:var(--muted); }
  [popover] { position:fixed; inset:auto; margin:0; min-width:200px; padding:4px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  [popover]:popover-open { animation:in 140ms ease-out; }
  [role="menuitem"] { display:block; width:100%; padding:7px 10px; font:inherit; text-align:left; color:var(--text); background:none; border:0; border-radius:6px; cursor:pointer; }
  [role="menuitem"]:hover, [role="menuitem"]:focus-visible { background:var(--accent-soft); }
  [role="menuitem"]:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  [role="menuitem"].danger { color:var(--err); }
  [role="menuitem"].danger:hover, [role="menuitem"].danger:focus-visible { background:var(--err-soft); outline-color:var(--err); }
  hr { margin:4px 0; border:0; border-top:1px solid var(--border); }
  @keyframes in { from { opacity:0; transform:translateY(-4px); } }
  @media (prefers-reduced-motion:reduce) { [popover]:popover-open { animation:none; } .btn { transition:none; } }
</style>
</head>
<body>
<h1>informe-octubre.pdf</h1>
<p>Editado hace 2 horas por Ana.</p>
<button type="button" class="btn" id="btn" popovertarget="menu" aria-haspopup="menu" aria-expanded="false">Opciones ▾</button>
<div id="result" role="status"></div>

<div id="menu" popover role="menu" aria-label="Opciones del archivo">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide">Renombrar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide">Duplicar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide">Mover a…</button>
  <hr role="separator">
  <button role="menuitem" class="danger" popovertarget="menu" popovertargetaction="hide">Eliminar</button>
</div>
<script>
  const menu = document.getElementById('menu'), btn = document.getElementById('btn');
  const items = () => [...menu.querySelectorAll('[role=menuitem]')];
  menu.addEventListener('toggle', (e) => {
    const open = e.newState === 'open';
    btn.setAttribute('aria-expanded', open);
    if (!open) return;
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 6 + 'px';
    menu.style.left = Math.min(r.left, innerWidth - menu.offsetWidth - 8) + 'px';
    items()[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const l = items(), i = l.indexOf(document.activeElement);
    const next = { ArrowDown: l[(i + 1) % l.length], ArrowUp: l[(i - 1 + l.length) % l.length], Home: l[0], End: l.at(-1) }[e.key];
    if (next) { e.preventDefault(); next.focus(); }
  });
  menu.addEventListener('click', (e) => {
    const it = e.target.closest('[role=menuitem]');
    if (it) document.getElementById('result').textContent = 'Elegiste: ' + it.textContent + '.';
  });
</script>
</body>
</html>
