<button type="button" id="btn" popovertarget="menu" aria-haspopup="menu" aria-expanded="false"
        class="rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-3.5 py-2 font-semibold shadow-[4px_4px_0_#17130f] aria-expanded:translate-x-0.5 aria-expanded:translate-y-0.5 aria-expanded:shadow-[2px_2px_0_#17130f] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#ff5a36]">
  Opciones ▾
</button>

<div id="menu" popover role="menu" aria-label="Opciones del archivo"
     class="fixed m-0 min-w-[190px] rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-1.5 text-[#17130f] shadow-[4px_4px_0_#17130f] [inset:auto]">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-[#ffd84d] focus-visible:bg-[#ffd84d] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-inset focus-visible:ring-[#ff5a36]">Renombrar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-[#ffd84d] focus-visible:bg-[#ffd84d] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-inset focus-visible:ring-[#ff5a36]">Duplicar</button>
  <hr role="separator" class="my-1 border-0 border-t-2 border-[#17130f]">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left font-semibold text-[#d6293e] hover:bg-[#ffd84d] hover:text-[#17130f] focus-visible:bg-[#ffd84d] focus-visible:text-[#17130f] focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-inset focus-visible:ring-[#ff5a36]">Eliminar</button>
</div>

<script>
  const menu = document.getElementById('menu'), btn = document.getElementById('btn');
  const items = () => [...menu.querySelectorAll('[role=menuitem]')];
  menu.addEventListener('toggle', (e) => {
    const open = e.newState === 'open';
    btn.setAttribute('aria-expanded', open);
    if (!open) return;
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 6 + 'px';
    menu.style.left = r.left + 'px';
    items()[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const l = items(), i = l.indexOf(document.activeElement);
    const next = { ArrowDown: l[(i + 1) % l.length], ArrowUp: l[(i - 1 + l.length) % l.length], Home: l[0], End: l.at(-1) }[e.key];
    if (next) { e.preventDefault(); next.focus(); }
  });
</script>
