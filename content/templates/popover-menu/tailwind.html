<button type="button" id="btn" popovertarget="menu" aria-haspopup="menu" aria-expanded="false"
        class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 text-sm font-semibold text-slate-900 shadow-sm transition-colors hover:border-blue-600 aria-expanded:border-blue-600 aria-expanded:bg-blue-50 aria-expanded:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 dark:aria-expanded:border-blue-400 dark:aria-expanded:bg-slate-800 dark:aria-expanded:text-blue-400">
  Opciones ▾
</button>

<div id="menu" popover role="menu" aria-label="Opciones del archivo"
     class="fixed m-0 min-w-[200px] rounded-lg border border-slate-200 bg-white p-1 text-sm text-slate-900 shadow-lg [inset:auto] dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Renombrar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Duplicar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-blue-50 focus-visible:bg-blue-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-blue-500 dark:hover:bg-slate-800 dark:focus-visible:bg-slate-800">Mover a…</button>
  <hr role="separator" class="my-1 border-0 border-t border-slate-200 dark:border-slate-700">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left text-red-600 hover:bg-red-50 focus-visible:bg-red-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-red-500 dark:text-red-400 dark:hover:bg-red-950 dark:focus-visible:bg-red-950">Eliminar</button>
</div>

<script>
  const menu = document.getElementById('menu'), btn = document.getElementById('btn');
  const items = () => [...menu.querySelectorAll('[role=menuitem]')];
  menu.addEventListener('toggle', (e) => {
    const open = e.newState === 'open';
    btn.setAttribute('aria-expanded', open);
    if (!open) return;
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 6 + 'px';
    menu.style.left = Math.min(r.left, innerWidth - menu.offsetWidth - 8) + 'px';
    items()[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const l = items(), i = l.indexOf(document.activeElement);
    const next = { ArrowDown: l[(i + 1) % l.length], ArrowUp: l[(i - 1 + l.length) % l.length], Home: l[0], End: l.at(-1) }[e.key];
    if (next) { e.preventDefault(); next.focus(); }
  });
</script>
