<button type="button" id="btn" popovertarget="menu" aria-haspopup="menu" aria-expanded="false"
        class="rounded-lg border border-line bg-surface px-3.5 py-2 text-sm font-semibold text-fg shadow-sm transition-colors hover:border-accent aria-expanded:border-accent aria-expanded:bg-accent-soft aria-expanded:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">
  Opciones ▾
</button>

<div id="menu" popover role="menu" aria-label="Opciones del archivo"
     class="fixed m-0 min-w-[200px] rounded-lg border border-line bg-surface p-1 text-sm text-fg shadow-lg [inset:auto]">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Renombrar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Duplicar</button>
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left hover:bg-accent-soft focus-visible:bg-accent-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Mover a…</button>
  <hr role="separator" class="my-1 border-0 border-t border-line">
  <button role="menuitem" popovertarget="menu" popovertargetaction="hide"
          class="block w-full rounded-md px-2.5 py-[7px] text-left text-err hover:bg-err-soft focus-visible:bg-err-soft focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-err">Eliminar</button>
</div>

<script>
  const menu = document.getElementById('menu'), btn = document.getElementById('btn');
  const items = () => [...menu.querySelectorAll('[role=menuitem]')];
  menu.addEventListener('toggle', (e) => {
    const open = e.newState === 'open';
    btn.setAttribute('aria-expanded', open);
    if (!open) return;
    const r = btn.getBoundingClientRect();
    menu.style.top = r.bottom + 6 + 'px';
    menu.style.left = Math.min(r.left, innerWidth - menu.offsetWidth - 8) + 'px';
    items()[0].focus();
  });
  menu.addEventListener('keydown', (e) => {
    const l = items(), i = l.indexOf(document.activeElement);
    const next = { ArrowDown: l[(i + 1) % l.length], ArrowUp: l[(i - 1 + l.length) % l.length], Home: l[0], End: l.at(-1) }[e.key];
    if (next) { e.preventDefault(); next.focus(); }
  });
</script>
