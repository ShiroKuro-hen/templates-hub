<button type="button" id="open" aria-haspopup="dialog"
        class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 font-semibold text-slate-900 shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  Eliminar proyecto
</button>

<dialog id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-text"
        class="relative m-auto w-[min(400px,calc(100%-1.5rem))] overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-slate-900 shadow-sm backdrop:bg-slate-950/55 before:absolute before:inset-x-0 before:top-0 before:h-0.5 before:bg-gradient-to-r before:from-cyan-400 before:to-blue-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <form method="dialog" class="px-5 pt-[22px] pb-5">
    <h2 id="dlg-title" class="mb-1.5 text-lg font-semibold">¿Eliminar «Rediseño web»?</h2>
    <p id="dlg-text" class="mb-5 text-slate-500 dark:text-slate-400">Se borrarán sus 24 archivos. Esta acción no se puede deshacer.</p>
    <div class="flex justify-end gap-2.5">
      <button value="cancel" autofocus
              class="rounded-lg border border-slate-200 bg-white px-3.5 py-2 font-semibold shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900">Cancelar</button>
      <button value="delete"
              class="rounded-lg bg-red-600 px-3.5 py-2 font-semibold text-white shadow-sm hover:bg-red-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500">Eliminar proyecto</button>
    </div>
  </form>
</dialog>

<script>
  const dlg = document.getElementById('dlg'), opener = document.getElementById('open');
  opener.addEventListener('click', () => dlg.showModal());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close('cancel'); });
  dlg.addEventListener('close', () => opener.focus());
</script>
