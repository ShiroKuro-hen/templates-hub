<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:380px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0 0 12px;font-size:16px}
  ul{list-style:none;margin:0 0 16px;padding:0}
  li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}
  li small{display:block;color:var(--muted)}
  .num,dd,output{font-variant-numeric:tabular-nums}
  label{display:block;font-weight:500}
  .row{display:flex;gap:8px;margin-top:4px}
  input{flex:1;min-width:0;box-sizing:border-box;padding:8px 10px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  input[aria-invalid=true]{border-color:var(--err)}
  button{font:inherit;cursor:pointer;padding:8px 14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:background .14s}
  button:hover{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .msg{min-height:20px;margin:4px 0 12px;font-size:13px;color:var(--muted)}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px}
  dt{color:var(--muted)} dd{margin:0;text-align:right}
  .save{color:var(--ok)}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:18px;font-weight:600}
  .bar{height:3px;margin-top:12px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .ghost{margin-left:6px;padding:0 6px;border:0;background:none;color:var(--accent);text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h2 id="t">Resumen del pedido</h2>
  <ul>
    <li><span>Zapatillas Aero Run<small>Talla 42, 1 unidad</small></span><span class="num">89,90 €</span></li>
    <li><span>Calcetines técnicos<small>Pack de 3, 2 unidades</small></span><span class="num">25,80 €</span></li>
    <li><span>Mochila Urban 20 L<small>Gris, 1 unidad</small></span><span class="num">39,00 €</span></li>
  </ul>
  <form id="cf" novalidate>
    <label for="code">Código de descuento</label>
    <div class="row"><input id="code" autocomplete="off" aria-describedby="msg"><button type="submit">Aplicar</button></div>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <dl id="dl"></dl>
  <div class="total"><span>Total</span><output id="total" for="dl"></output></div>
  <div class="bar" aria-hidden="true"></div>
</section>
<script>
  const ITEMS = [8990, 2580, 3900], FREE_FROM = 15000, SHIP = 690;
  const CODES = { ION10: { label: '10 %', off: (s) => Math.round(s * 0.1) }, BIENVENIDA: { label: '15 €', off: () => 1500 } };
  const $ = (id) => document.getElementById(id), eur = (c) => (c / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  let code = null;
  function render() {
    const sub = ITEMS.reduce((a, b) => a + b, 0), off = code ? CODES[code].off(sub) : 0;
    const ship = sub - off >= FREE_FROM ? 0 : SHIP, total = sub - off + ship;
    $('dl').innerHTML = `<dt>Subtotal</dt><dd>${eur(sub)}</dd>`
      + (off ? `<dt class="save">Descuento ${code}<button class="ghost" type="button" data-rm>Quitar</button></dt><dd class="save">−${eur(off)}</dd>` : '')
      + `<dt>Envío</dt><dd>${ship ? eur(ship) : 'Gratis'}</dd><dt>IVA incluido</dt><dd>${eur(Math.round(total * 21 / 121))}</dd>`;
    $('total').textContent = eur(total);
  }
  function say(t, cls) { $('msg').textContent = t; $('msg').className = 'msg ' + cls; $('code').setAttribute('aria-invalid', cls === 'err'); }
  $('cf').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('code').value.trim().toUpperCase();
    if (!v) return say('Escribe un código. Por ejemplo, ION10.', 'err');
    if (!CODES[v]) return say(`El código ${v} no existe o ha caducado. Revisa que esté bien escrito.`, 'err');
    code = v; say(`Código aplicado: ${CODES[v].label} de descuento.`, 'ok'); render();
  });
  $('dl').addEventListener('click', (e) => {
    if (!e.target.closest('[data-rm]')) return;
    code = null; $('code').value = ''; say('Código eliminado.', ''); render(); $('code').focus();
  });
  render();
</script>
</body>
</html>
