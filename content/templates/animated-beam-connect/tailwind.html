<style>
  .track{fill:none;stroke:var(--border);stroke-width:2;stroke-linecap:round}
  .beam-run{fill:none;stroke:url(#beam-grad);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:14 86;animation:beam-flow 2.4s linear infinite}
  .src:nth-child(1){top:16.667%}
  .src:nth-child(2){top:50%}
  .src:nth-child(3){top:83.333%}
  .src svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hub svg{fill:currentColor}
  .hub::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);animation:hub-pulse 2.4s ease-out infinite}
  @keyframes beam-flow{to{stroke-dashoffset:-100}}
  @keyframes hub-pulse{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.3)}}
  @media (prefers-reduced-motion:reduce){.beam-run,.hub::after{display:none}}
</style>

        <stop offset="0" style="stop-color:var(--accent-2,#22d3ee)"/>
        <stop offset="1" style="stop-color:var(--accent)"/>
      </linearGradient>
    </defs>
    <path class="track" d="M44 40C196 40 196 101 345 101"/>
    <path class="track" d="M44 120H338"/>
    <path class="track" d="M44 200C196 200 196 139 345 139"/>
    <path class="beam-run" pathLength="100" d="M44 40C196 40 196 101 345 101" style="animation-delay:-0.6s"/>
    <path class="beam-run" pathLength="100" d="M44 120H338" style="animation-delay:-1.4s"/>
    <path class="beam-run" pathLength="100" d="M44 200C196 200 196 139 345 139" style="animation-delay:-2s"/>
  </svg>
  <ul class="absolute inset-0 m-0 list-none p-0">
    <li class="src absolute left-0 grid aspect-square w-[10.476%] -translate-y-1/2 place-items-center rounded-lg border border-line bg-surface text-accent shadow-sm"><svg viewBox="0 0 24 24" class="size-1/2"><path d="M5 5c0-1.7 3.1-3 7-3s7 1.3 7 3v14c0 1.7-3.1 3-7 3s-7-1.3-7-3zM5 5c0 1.7 3.1 3 7 3s7-1.3 7-3M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></li>

  </ul>

</div>
