<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hero{max-width:640px;margin:0 auto;padding:28px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h1{margin:0;min-height:2.5em;font-size:clamp(22px,5.5vw,34px);font-weight:700;line-height:1.25;letter-spacing:-.015em}
  .typed{color:var(--accent)}
  .typed::after{content:"";display:inline-block;width:2px;height:.95em;margin-left:3px;vertical-align:-.1em;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .lead{max-width:52ch;margin:12px 0 20px;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:12px}
  .btn{padding:7px 14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-weight:600;cursor:pointer;transition:border-color .14s,background .14s}
  .btn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){.typed::after{animation:blink 1.06s steps(1) infinite}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.typed::after{display:none}}
</style>
</head>
<body>
<section class="hero">
  <h1>Automatiza <span class="typed" id="t" aria-hidden="true">tus informes semanales</span><span class="sr">tus informes, pagos, inventario y bienvenidas</span></h1>
  <p class="lead">Aurora conecta tus herramientas y repite por ti las tareas que se llevan horas cada semana.</p>
  <div class="actions" id="ctl">
    <button class="btn" id="pause" type="button">Pausar</button>
    <button class="btn" id="rep" type="button">Repetir</button>
  </div>
</section>
<script>
  const P = ['tus informes semanales', 'la conciliación de pagos', 'las alertas de inventario', 'la bienvenida a clientes'];
  const el = document.getElementById('t'), pause = document.getElementById('pause'), rep = document.getElementById('rep');
  let i = 0, n = 0, del = false, paused = false, timer;
  function tick() {
    const p = P[i];
    n += del ? -1 : 1;
    el.textContent = p.slice(0, n);
    let ms = del ? 28 : 55;
    if (!del && n === p.length) { del = true; ms = 1500; }           // pausa con la frase completa
    else if (del && n === 0) { del = false; i = (i + 1) % P.length; ms = 350; }
    timer = setTimeout(tick, ms);
  }
  function stop() { clearTimeout(timer); }
  function play(on) { paused = !on; pause.textContent = on ? 'Pausar' : 'Reanudar'; stop(); if (on) tick(); }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('ctl').hidden = true; // alternativa estática: primera frase
  else {
    pause.onclick = () => play(paused);
    rep.onclick = () => { stop(); i = n = 0; del = false; el.textContent = ''; play(true); };
    n = 0; el.textContent = ''; tick();
  }
</script>
</body>
</html>
