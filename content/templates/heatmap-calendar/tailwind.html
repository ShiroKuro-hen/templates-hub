<section class="relative mx-auto max-w-[560px] rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-4 shadow-[4px_4px_0_#17130f]" id="card" aria-labelledby="t">
  <header class="mb-3 flex flex-wrap items-baseline justify-between gap-x-3">
    <h2 id="t" class="text-[1.05rem] font-bold tracking-tight">Actividad del equipo</h2>
    <span id="sum" class="text-sm text-[#6b6258]"></span>
  </header>
  <div class="grid grid-cols-[28px_1fr] gap-x-1.5 gap-y-1 font-mono text-[10px] text-[#6b6258]">
    <span></span>
    <div id="months" class="grid grid-cols-12 gap-1" aria-hidden="true"></div>
    <div class="grid grid-rows-[repeat(7,1fr)] gap-1" aria-hidden="true"><span></span><span class="flex items-center">Lun</span><span></span><span class="flex items-center">Mié</span><span></span><span class="flex items-center">Vie</span><span></span></div>
    <ul id="heat" class="m-0 grid list-none grid-flow-col grid-cols-12 grid-rows-[repeat(7,auto)] gap-1 p-0" role="group" aria-label="Actividad diaria de las últimas 12 semanas. Usa las flechas para moverte."></ul>
  </div>
  <div id="tip" role="status" class="pointer-events-none absolute z-10 whitespace-nowrap rounded-lg border-2 border-[#17130f] bg-[#17130f] px-2 py-1 text-xs text-[#fffdf8] opacity-0"></div>
</section>
<script>
  const COLORS = ['#efe8d8', '#ffe58a', '#ffc43d', '#ff8a3d', '#e0391a'];
  // data = [{ date: Date, count: number }] — 84 días empezando en lunes
  const start = new Date(2026, 6, 13), data = Array.from({ length: 84 }, (_, i) => {
    const date = new Date(start); date.setDate(start.getDate() + i);
    return { date, count: (i * 7 + (i % 5) * 3) % 11 };
  });
  const level = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 8 ? 3 : 4;
  const label = d => `${d.count} aportes, ${d.date.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' })}`;
  const heat = document.getElementById('heat'), tip = document.getElementById('tip'), card = document.getElementById('card');
  data.forEach((d, i) => {
    const c = document.createElement('li');
    c.className = 'aspect-square cursor-pointer rounded border-[1.5px] border-[#17130f] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-[#17130f]';
    c.style.background = COLORS[level(d.count)]; c.tabIndex = i ? -1 : 0; c.setAttribute('role', 'img'); c.setAttribute('aria-label', label(d));
    const show = () => {
      const r = c.getBoundingClientRect(), k = card.getBoundingClientRect();
      tip.textContent = label(d); tip.style.opacity = 1;
      tip.style.left = Math.min(Math.max(r.left - k.left + r.width / 2 - tip.offsetWidth / 2, 4), k.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = r.top - k.top - tip.offsetHeight - 6 + 'px';
    };
    ['mouseenter', 'focus'].forEach(e => c.addEventListener(e, show));
    ['mouseleave', 'blur'].forEach(e => c.addEventListener(e, () => tip.style.opacity = 0));
    heat.appendChild(c);
  });
  data.forEach((d, i) => { if (i % 7 === 0 && (i === 0 || d.date.getMonth() !== data[i - 7].date.getMonth())) document.getElementById('months').insertAdjacentHTML('beforeend', `<span style="grid-column:${i / 7 + 1}">${d.date.toLocaleDateString('es', { month: 'short' }).replace('.', '')}</span>`); });
  document.getElementById('sum').textContent = data.reduce((a, d) => a + d.count, 0) + ' aportes en 12 semanas';
</script>
