<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{position:relative;max-width:560px;margin:0 auto;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  header{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  h2{margin:0;font-size:16px;font-weight:600}
  .sum{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .cal{display:grid;grid-template-columns:28px 1fr;gap:4px 6px;font-size:11px;color:var(--muted)}
  .months,.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
  .months span{white-space:nowrap}
  .days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
  .days span{display:flex;align-items:center}
  .heat{grid-template-rows:repeat(7,auto);grid-auto-flow:column;margin:0;padding:0;list-style:none}
  .cell{aspect-ratio:1;border-radius:4px;background:var(--bg);cursor:pointer}
  .cell:hover{outline:1px solid var(--text);outline-offset:1px}
  [data-l="0"]{--bg:var(--accent-soft)}
  [data-l="1"]{--bg:color-mix(in srgb,var(--accent) 30%,var(--surface))}
  [data-l="2"]{--bg:color-mix(in srgb,var(--accent) 55%,var(--surface))}
  [data-l="3"]{--bg:color-mix(in srgb,var(--accent) 80%,var(--surface))}
  [data-l="4"]{--bg:var(--accent)}
  .legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:16px;color:var(--muted);font-size:12px}
  .legend i{width:14px;height:14px;border-radius:3px;background:var(--bg)}
  .tip{position:absolute;z-index:1;padding:4px 10px;border-radius:var(--radius);background:var(--text);color:var(--surface);font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
  .tip.on{opacity:1}
  @media(prefers-reduced-motion:reduce){.tip{transition:none}}
</style>
</head>
<body>
  <section class="card" id="card" aria-labelledby="t">
    <header><h2 id="t">Actividad del equipo</h2><span class="sum" id="sum"></span></header>
    <div class="cal">
      <span></span><div class="months" id="months" aria-hidden="true"></div>
      <div class="days" aria-hidden="true"><span></span><span>Lun</span><span></span><span>Mié</span><span></span><span>Vie</span><span></span></div>
      <ul class="heat" id="heat" role="group" aria-label="Actividad diaria de las últimas 12 semanas. Usa las flechas para moverte."></ul>
    </div>
    <div class="legend" aria-hidden="true">Menos <i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i> Más</div>
    <div class="tip" id="tip" role="status"></div>
  </section>
<script>
  // Datos de ejemplo: [{ date, count }] de 12 semanas (lunes a domingo), generados con un PRNG fijo.
  const WEEKS = 12, start = new Date(2026, 6, 13); // lunes 13 jul 2026
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const data = Array.from({ length: WEEKS * 7 }, (_, i) => {
    const date = new Date(start); date.setDate(start.getDate() + i);
    const weekend = i % 7 > 4;
    return { date, count: rnd() < (weekend ? .65 : .12) ? 0 : Math.floor(rnd() * (weekend ? 4 : 12)) + 1 };
  });
  const level = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 8 ? 3 : 4;
  const fmt = d => new Intl.DateTimeFormat('es', { weekday: 'short', day: 'numeric', month: 'short' }).format(d);
  const heat = document.getElementById('heat'), tip = document.getElementById('tip'), card = document.getElementById('card');
  const label = d => `${d.count === 0 ? 'Sin aportes' : d.count + (d.count === 1 ? ' aporte' : ' aportes')}, ${fmt(d.date)}`;
  heat.innerHTML = data.map((d, i) =>
    `<li class="cell" data-l="${level(d.count)}" role="img" tabindex="${i ? -1 : 0}" aria-label="${label(d)}"></li>`).join('');
  const cells = [...heat.children];
  document.getElementById('sum').textContent = data.reduce((a, d) => a + d.count, 0) + ' aportes en 12 semanas';
  const months = document.getElementById('months');
  data.forEach((d, i) => {
    if (i % 7 === 0 && (i === 0 || d.date.getMonth() !== data[i - 7].date.getMonth()))
      months.insertAdjacentHTML('beforeend', `<span style="grid-column:${i / 7 + 1}">${new Intl.DateTimeFormat('es', { month: 'short' }).format(d.date).replace('.', '')}</span>`);
  });
  function show(i) {
    const c = cells[i], r = c.getBoundingClientRect(), k = card.getBoundingClientRect();
    tip.textContent = label(data[i]);
    tip.style.left = Math.min(Math.max(r.left - k.left + r.width / 2 - tip.offsetWidth / 2, 4), k.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = r.top - k.top - tip.offsetHeight - 6 + 'px';
    tip.classList.add('on');
  }
  cells.forEach((c, i) => {
    c.addEventListener('mouseenter', () => show(i)); c.addEventListener('focus', () => show(i));
    c.addEventListener('mouseleave', () => tip.classList.remove('on')); c.addEventListener('blur', () => tip.classList.remove('on'));
    c.addEventListener('keydown', e => {
      const d = { ArrowDown: 1, ArrowUp: -1, ArrowRight: 7, ArrowLeft: -7 }[e.key];
      if (!d || !cells[i + d]) return;
      e.preventDefault(); c.tabIndex = -1; cells[i + d].tabIndex = 0; cells[i + d].focus();
    });
  });
</script>
</body>
</html>
