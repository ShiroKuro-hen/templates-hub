<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; padding:20px; font:14px system-ui, sans-serif; background:#f6f1e7; color:#17130f; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px; }
  .item { border:2px solid #17130f; border-radius:10px; background:#fffdf8; box-shadow:4px 4px 0 #17130f; padding:16px; min-height:90px; font-weight:700; }
  .item.wide { grid-column:span 2; background:#ffd84d; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item wide">Destacado (2 columnas)</div>
    <div class="item">Uno</div><div class="item">Dos</div><div class="item">Tres</div>
    <div class="item">Cuatro</div><div class="item">Cinco</div>
  </div>
</body>
</html>
