<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barra de herramientas</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{overflow-x:hidden;margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  [role=toolbar] { display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:6px; width:fit-content; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .sep { width:1px; align-self:stretch; margin:4px 4px; background:var(--border); }
  button { position:relative; display:grid; place-items:center; width:36px; height:36px; padding:0; color:var(--muted); background:transparent; border:0; border-radius:var(--radius); cursor:pointer; transition:background .14s, color .14s; }
  button:hover { color:var(--text); background:var(--bg); }
  button[aria-pressed=true] { color:var(--accent); background:var(--accent-soft); }
  button[aria-pressed=true]::before { content:""; position:absolute; left:9px; right:9px; bottom:3px; height:2px; border-radius:2px; background:linear-gradient(135deg,#22d3ee,#2f5bff); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  button::after { content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:2; padding:3px 8px; font-size:12px; white-space:nowrap; color:var(--bg); background:var(--text); border-radius:6px; opacity:0; pointer-events:none; }
  button:hover::after, button:focus-visible::after { opacity:1; }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  #sample { margin:56px 0 8px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  #sample.b { font-weight:700; } #sample.i { font-style:italic; } #sample.u { text-decoration:underline; }
  #sample.c { font-family:ui-monospace,"Cascadia Code",Menlo,monospace; background:var(--accent-soft); } #sample.l { color:var(--accent); text-decoration:underline; }
  #sample.o::before { content:"• "; }
  #st { margin:0; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div role="toolbar" aria-label="Formato de texto" aria-controls="sample" id="tb">
    <button type="button" aria-label="Negrita" data-tip="Negrita" data-f="b" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h6a4 4 0 0 1 0 8H7z"/><path d="M7 12h7a4 4 0 0 1 0 8H7z"/></svg></button>
    <button type="button" aria-label="Cursiva" data-tip="Cursiva" data-f="i" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h8M6 20h8M15 4l-6 16"/></svg></button>
    <button type="button" aria-label="Subrayado" data-tip="Subrayado" data-f="u" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4"/><path d="M5 21h14"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" aria-label="Código" data-tip="Código" data-f="c" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
    <button type="button" aria-label="Enlace" data-tip="Enlace" data-f="l" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
    <button type="button" aria-label="Lista" data-tip="Lista" data-f="o" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" aria-label="Deshacer formato" data-tip="Deshacer formato" data-undo><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  </div>
  <p id="sample" class="b">Texto de ejemplo para probar el formato.</p>
  <p id="st" role="status">Negrita activada</p>
<script>
  const tb = document.getElementById('tb'), sample = document.getElementById('sample'), st = document.getElementById('st');
  const bs = [...tb.querySelectorAll('button')];
  bs.forEach((b, i) => { b.tabIndex = i ? -1 : 0; });
  document.querySelector('[data-f=b]').setAttribute('aria-pressed', 'true');
  function focusBtn(b) { bs.forEach((x) => (x.tabIndex = -1)); b.tabIndex = 0; b.focus(); }
  tb.addEventListener('keydown', (e) => {
    const i = bs.indexOf(document.activeElement);
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: bs.length - 1 }[e.key];
    if (i < 0 || next === undefined) return;
    e.preventDefault(); focusBtn(bs[(next + bs.length) % bs.length]);
  });
  tb.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    bs.forEach((x) => (x.tabIndex = -1)); b.tabIndex = 0;
    if (b.hasAttribute('data-undo')) {
      sample.className = ''; bs.forEach((x) => x.hasAttribute('aria-pressed') && x.setAttribute('aria-pressed', 'false'));
      st.textContent = 'Formato deshecho'; return;
    }
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on); sample.classList.toggle(b.dataset.f, on);
    st.textContent = b.getAttribute('aria-label') + (on ? ' activada' : ' desactivada');
  });
</script>
</body>
</html>
