<div class="bg-page p-5 text-sm text-fg">
  <form id="form" novalidate class="mx-auto max-w-sm rounded-lg border border-line bg-surface p-6 shadow-sm">
    <fieldset>
      <legend class="text-base font-semibold">Introduce el código de verificación</legend>
      <p id="hint" class="mb-4 mt-1 text-muted">Lo enviamos por SMS al +51 ••• ••• 482.</p>
      <div id="otp" aria-describedby="hint"
           class="grid grid-cols-6 gap-2 [&>input]:aspect-[1/1.15] [&>input]:w-full [&>input]:min-w-0 [&>input]:rounded-lg [&>input]:border [&>input]:border-line [&>input]:bg-surface [&>input]:text-center [&>input]:text-xl [&>input]:font-semibold [&>input]:tabular-nums [&>input]:transition-colors [&>input:focus-visible]:outline-2 [&>input:focus-visible]:outline-offset-2 [&>input:focus-visible]:outline-accent [&>input:not(:placeholder-shown)]:border-accent [&>input:not(:placeholder-shown)]:bg-accent-soft">
        <input inputmode="numeric" autocomplete="one-time-code" placeholder=" " aria-label="Dígito 1 de 6">
        <input inputmode="numeric" autocomplete="off" placeholder=" " aria-label="Dígito 2 de 6">
        <input inputmode="numeric" autocomplete="off" placeholder=" " aria-label="Dígito 3 de 6">
        <input inputmode="numeric" autocomplete="off" placeholder=" " aria-label="Dígito 4 de 6">
        <input inputmode="numeric" autocomplete="off" placeholder=" " aria-label="Dígito 5 de 6">
        <input inputmode="numeric" autocomplete="off" placeholder=" " aria-label="Dígito 6 de 6">
      </div>
      <div aria-hidden="true" class="mt-3 h-0.5 overflow-hidden rounded-full bg-line">
        <i id="bar" class="block h-full origin-left scale-x-0 bg-gradient-to-br from-accent-2 to-accent transition-transform motion-reduce:transition-none"></i>
      </div>
    </fieldset>
    <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
      <button type="button" class="rounded-lg px-4 py-2 font-semibold text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Reenviar código</button>
      <button type="submit" id="go" disabled class="rounded-lg border border-accent bg-accent px-4 py-2 font-semibold text-accent-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50">Verificar código</button>
    </div>
    <p id="status" role="status" class="mt-3 text-muted"></p>
  </form>
</div>
<script>
  const boxes = [...document.querySelectorAll('#otp input')];
  const bar = document.getElementById('bar'), go = document.getElementById('go');
  const code = () => boxes.map((b) => b.value).join('');
  const sync = () => { bar.style.transform = `scaleX(${code().length / 6})`; go.disabled = code().length < 6; };
  function fill(i, digits) {
    [...digits.slice(0, 6 - i)].forEach((d, j) => (boxes[i + j].value = d));
    boxes[Math.min(i + digits.length, 5)].focus();
    sync();
  }
  boxes.forEach((b, i) => {
    b.addEventListener('input', () => {
      const d = b.value.replace(/\D/g, '');
      if (d.length > 1) return fill(i, d);
      b.value = d;
      if (d && i < 5) boxes[i + 1].focus();
      sync();
    });
    b.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !b.value && i > 0) { e.preventDefault(); boxes[i - 1].value = ''; boxes[i - 1].focus(); sync(); }
      if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); boxes[i - 1].focus(); }
      if (e.key === 'ArrowRight' && i < 5) { e.preventDefault(); boxes[i + 1].focus(); }
    });
    b.addEventListener('paste', (e) => { e.preventDefault(); fill(i, e.clipboardData.getData('text').replace(/\D/g, '')); });
    b.addEventListener('focus', () => b.select());
  });
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('status').textContent = `Código ${code()} enviado. Verificando…`;
  });
</script>
