<div class="bg-[#f6f1e7] p-5 text-sm text-[#17130f]">
  <table id="t" class="w-full border-collapse border-2 border-[#17130f] bg-[#fffdf8]">
    <caption class="sr-only">Ventas por persona (clic en un encabezado para ordenar)</caption>
    <thead>
      <tr class="[&>th]:sticky [&>th]:top-0 [&>th]:border-b-2 [&>th]:border-[#17130f] [&>th]:bg-[#ffd84d] [&>th]:p-0 [&>th]:text-left">
        <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-3 py-2.5 text-left font-bold focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Nombre</button></th>
        <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-3 py-2.5 text-left font-bold focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Plan</button></th>
        <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-3 py-2.5 text-right font-bold focus-visible:outline focus-visible:outline-[3px] focus-visible:-outline-offset-[3px] focus-visible:outline-[#ff5a36]">Ventas</button></th>
      </tr>
    </thead>
    <tbody class="[&>tr:nth-child(even)]:bg-[#17130f0d] [&_td]:border-b [&_td]:border-[#17130f33] [&_td]:px-3 [&_td]:py-2.5">
      <tr><td>Ana Pérez</td><td>Pro</td><td class="text-right tabular-nums">1240</td></tr>
      <tr><td>Luis Gómez</td><td>Free</td><td class="text-right tabular-nums">310</td></tr>
      <tr><td>Marta Ruiz</td><td>Pro</td><td class="text-right tabular-nums">2890</td></tr>
      <tr><td>Carlos Díaz</td><td>Team</td><td class="text-right tabular-nums">760</td></tr>
    </tbody>
  </table>
</div>
<script>
  const t = document.getElementById('t');
  t.tHead.rows[0].addEventListener('click', (e) => {
    const th = e.target.closest('th'); if (!th) return;
    const i = th.cellIndex, asc = th.getAttribute('aria-sort') !== 'ascending';
    [...t.tHead.rows[0].cells].forEach((c) => {
      c.setAttribute('aria-sort', 'none');
      c.firstElementChild.textContent = c.firstElementChild.textContent.replace(/ [▲▼]$/, '');
    });
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
    th.firstElementChild.textContent += asc ? ' ▲' : ' ▼';
    const rows = [...t.tBodies[0].rows].sort((a, b) =>
      a.cells[i].textContent.localeCompare(b.cells[i].textContent, 'es', { numeric: true }) * (asc ? 1 : -1));
    t.tBodies[0].append(...rows);
  });
</script>
