<div class="bg-page p-5 text-sm text-fg">
  <div class="max-h-96 overflow-auto rounded-lg border border-line bg-surface shadow-sm">
    <table id="t" class="w-full border-separate border-spacing-0">
      <caption class="sr-only">Ventas por persona. Usa los encabezados para ordenar.</caption>
      <thead>
        <tr class="[&>th]:sticky [&>th]:top-0 [&>th]:border-b [&>th]:border-line [&>th]:bg-surface [&>th]:p-0 [&>th]:text-left [&>th]:font-semibold [&>th]:text-muted">
          <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-4 py-2.5 text-left hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Nombre</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-4 py-2.5 text-left hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Plan</button></th>
          <th scope="col" aria-sort="none"><button type="button" class="w-full cursor-pointer px-4 py-2.5 text-right hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent">Ventas</button></th>
        </tr>
      </thead>
      <tbody class="[&_td]:border-b [&_td]:border-line [&_td]:px-4 [&_td]:py-2.5 [&>tr:last-child>td]:border-0 [&>tr:hover]:bg-accent-soft">
        <tr><td>Ana Pérez</td><td>Pro</td><td class="text-right tabular-nums">1240</td></tr>
        <tr><td>Luis Gómez</td><td>Free</td><td class="text-right tabular-nums">310</td></tr>
        <tr><td>Marta Ruiz</td><td>Pro</td><td class="text-right tabular-nums">2890</td></tr>
        <tr><td>Carlos Díaz</td><td>Team</td><td class="text-right tabular-nums">760</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
  const t = document.getElementById('t');
  t.tHead.rows[0].addEventListener('click', (e) => {
    const th = e.target.closest('th'); if (!th) return;
    const i = th.cellIndex, asc = th.getAttribute('aria-sort') !== 'ascending';
    [...t.tHead.rows[0].cells].forEach((c) => {
      c.setAttribute('aria-sort', 'none');
      c.firstElementChild.textContent = c.firstElementChild.textContent.replace(/ [▲▼]$/, '');
    });
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
    th.firstElementChild.textContent += asc ? ' ▲' : ' ▼';
    const rows = [...t.tBodies[0].rows].sort((a, b) =>
      a.cells[i].textContent.localeCompare(b.cells[i].textContent, 'es', { numeric: true }) * (asc ? 1 : -1));
    t.tBodies[0].append(...rows);
  });
</script>
