<form class="max-w-md rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
  <fieldset class="min-w-0">
    <legend class="text-base font-semibold">Tema de la interfaz</legend>
    <p class="mb-3.5 mt-0.5 text-slate-500 dark:text-slate-400">Elige cómo se ve la aplicación en este dispositivo.</p>
    <div id="seg" class="grid grid-cols-3 rounded-lg border border-slate-200 bg-slate-50 p-[3px] dark:border-slate-700 dark:bg-slate-950
                [&_label]:flex [&_label]:cursor-pointer [&_label]:items-center [&_label]:justify-center [&_label]:gap-1.5 [&_label]:rounded-md [&_label]:px-1.5 [&_label]:py-2 [&_label]:font-medium [&_label]:text-slate-500 [&_label]:transition-colors
                dark:[&_label]:text-slate-400 [&_label:has(:checked)]:bg-white [&_label:has(:checked)]:text-slate-900 [&_label:has(:checked)]:shadow-sm [&_label:has(:checked)]:ring-1 [&_label:has(:checked)]:ring-cyan-400/60
                dark:[&_label:has(:checked)]:bg-slate-900 dark:[&_label:has(:checked)]:text-slate-100 [&_label:has(:checked)_svg]:text-blue-600 dark:[&_label:has(:checked)_svg]:text-blue-400
                [&_label:has(:focus-visible)]:outline-2 [&_label:has(:focus-visible)]:outline-offset-2 [&_label:has(:focus-visible)]:outline-blue-500 [&_input]:sr-only">
      <label><input type="radio" name="theme" value="light">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</label>
      <label><input type="radio" name="theme" value="dark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Oscuro</label>
      <label><input type="radio" name="theme" value="system" checked>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Sistema</label>
    </div>
    <p id="theme-status" role="status" class="mt-3 min-h-6 text-slate-500 dark:text-slate-400">Sigue la configuración del sistema.</p>
  </fieldset>
</form>
<script>
  const root = document.documentElement, out = document.getElementById('theme-status');
  const mq = matchMedia('(prefers-color-scheme: dark)');
  function apply(v) {
    const dark = v === 'dark' || (v === 'system' && mq.matches);
    root.classList.toggle('dark', dark);
    root.dataset.theme = dark ? 'dark' : 'light';
    out.textContent = v === 'system'
      ? `Sigue la configuración del sistema: ahora en modo ${dark ? 'oscuro' : 'claro'}.`
      : `Modo ${dark ? 'oscuro' : 'claro'} activado.`;
  }
  document.getElementById('seg').addEventListener('change', (e) => apply(e.target.value));
  mq.addEventListener('change', () => { if (document.querySelector('[value=system]').checked) apply('system'); });
</script>
