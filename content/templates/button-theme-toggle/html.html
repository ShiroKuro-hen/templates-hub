<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:480px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  fieldset{margin:0;padding:0;border:0;min-width:0}
  legend{padding:0;font-size:16px;font-weight:600}
  .hint{margin:2px 0 14px;color:var(--muted)}
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
  .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);box-sizing:border-box;border:1px solid transparent;border-radius:6px;box-shadow:var(--shadow);
         background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#22d3ee,#2f5bff) border-box;transition:transform .16s}
  .seg:has([value=dark]:checked) .thumb{transform:translateX(100%)}
  .seg:has([value=system]:checked) .thumb{transform:translateX(200%)}
  .seg label{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:6px;color:var(--muted);font-weight:500;cursor:pointer;transition:color .14s}
  .seg label:hover,.seg label:has(:checked){color:var(--text)}
  .seg label:has(:checked) svg{color:var(--accent)}
  .seg label:has(:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .status{margin:12px 0 0;min-height:1.5em;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<form class="card">
  <fieldset>
    <legend>Tema de la interfaz</legend>
    <p class="hint">Elige cómo se ve la aplicación en este dispositivo.</p>
    <div class="seg">
      <span class="thumb" aria-hidden="true"></span>
      <label><input type="radio" name="theme" value="light">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</label>
      <label><input type="radio" name="theme" value="dark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Oscuro</label>
      <label><input type="radio" name="theme" value="system" checked>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Sistema</label>
    </div>
    <p class="status" role="status" id="theme-status">Sigue la configuración del sistema.</p>
  </fieldset>
</form>
<script>
  const root = document.documentElement, out = document.getElementById('theme-status');
  const mq = matchMedia('(prefers-color-scheme: dark)');
  function apply(v) {
    const dark = v === 'dark' || (v === 'system' && mq.matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    out.textContent = v === 'system'
      ? `Sigue la configuración del sistema: ahora en modo ${dark ? 'oscuro' : 'claro'}.`
      : `Modo ${dark ? 'oscuro' : 'claro'} activado.`;
  }
  document.querySelector('.seg').addEventListener('change', (e) => apply(e.target.value));
  mq.addEventListener('change', () => { if (document.querySelector('[value=system]').checked) apply('system'); });
</script>
</body>
</html>
