<section class="mx-auto max-w-[620px] rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-4 pb-2.5 pt-4 shadow-[4px_4px_0_#17130f]" aria-labelledby="t">
  <header class="mb-1.5 flex flex-wrap items-baseline justify-between gap-x-3">
    <h2 id="t" class="text-[1.05rem] font-bold tracking-tight">Pedidos mensuales, 2026</h2>
    <span class="font-mono text-[.8rem] font-bold text-[#1f9d55]">+250% desde enero</span>
  </header>
  <div class="relative" id="plot">
    <svg id="svg" class="block h-auto w-full" viewBox="0 0 420 220" role="group" aria-label="Gráfico de líneas de pedidos por mes. Usa Tab para recorrer los puntos."></svg>
    <div id="tip" role="status" class="pointer-events-none absolute whitespace-nowrap rounded-lg border-2 border-[#17130f] bg-[#17130f] px-2.5 py-1.5 text-[.8rem] leading-tight text-[#fffdf8] opacity-0 transition-opacity"></div>
  </div>
</section>
<script>
  const data = [{ x: 'Ene', y: 120 }, { x: 'Feb', y: 150 }, { x: 'Mar', y: 135 }, { x: 'Abr', y: 190 }, { x: 'May', y: 220 }, { x: 'Jun', y: 205 },
    { x: 'Jul', y: 260 }, { x: 'Ago', y: 310 }, { x: 'Sep', y: 290 }, { x: 'Oct', y: 340 }, { x: 'Nov', y: 380 }, { x: 'Dic', y: 420 }];
  const W = 420, H = 220, L = 34, R = 14, T = 14, B = 26, NS = 'http://www.w3.org/2000/svg';
  const max = Math.ceil(Math.max(...data.map(d => d.y)) / 100) * 100;
  const X = i => L + i * (W - L - R) / (data.length - 1), Y = v => T + (1 - v / max) * (H - T - B);
  const svg = document.getElementById('svg'), tip = document.getElementById('tip');
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  for (let v = 0; v <= max; v += 100) {
    el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: '#17130f', 'stroke-opacity': .15 });
    el('text', { x: L - 6, y: Y(v) + 3.5, 'text-anchor': 'end', fill: '#6b6258', 'font-size': 10 }).textContent = v;
  }
  data.forEach((d, i) => el('text', { x: X(i), y: H - 8, 'text-anchor': 'middle', fill: '#6b6258', 'font-size': 10 }).textContent = d.x);
  const pts = data.map((d, i) => `${X(i)},${Y(d.y)}`);
  el('path', { d: `M${X(0)},${Y(0)} L${pts.join(' L')} L${X(data.length - 1)},${Y(0)}Z`, fill: '#ffd84d', 'fill-opacity': .55 });
  el('path', { d: 'M' + pts.join(' L'), fill: 'none', stroke: '#17130f', 'stroke-width': 3, 'stroke-linejoin': 'round' });
  data.forEach((d, i) => {
    const c = el('circle', { cx: X(i), cy: Y(d.y), r: 4.5, fill: '#fffdf8', stroke: '#17130f', 'stroke-width': 2.5, tabindex: 0, role: 'img', 'aria-label': `${d.x}: ${d.y} pedidos` });
    const show = () => {
      tip.innerHTML = `${d.x}<b class="block text-base tabular-nums">${d.y} pedidos</b>`;
      tip.style.left = Math.min(Math.max(X(i) / W * 100, 14), 86) + '%';
      tip.style.top = Y(d.y) / H * 100 + '%';
      tip.style.transform = 'translate(-50%, calc(-100% - 12px))';
      tip.style.opacity = 1; c.setAttribute('fill', '#ff5a36');
    };
    const hide = () => { tip.style.opacity = 0; c.setAttribute('fill', '#fffdf8'); };
    ['mouseenter', 'focus'].forEach(e => c.addEventListener(e, show));
    ['mouseleave', 'blur'].forEach(e => c.addEventListener(e, hide));
  });
</script>
