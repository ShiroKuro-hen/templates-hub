<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{max-width:620px;margin:0 auto;padding:20px 20px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  h2{margin:0;font-size:16px;font-weight:600}
  .delta{color:var(--ok);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .plot{position:relative}
  svg{display:block;width:100%;height:auto;touch-action:pan-y}
  .grid line{stroke:var(--border)}
  .axis text{fill:var(--muted);font:10px system-ui,-apple-system,"Segoe UI",sans-serif}
  .area{fill:var(--accent);fill-opacity:.1}
  .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2;cursor:pointer;transition:r .12s}
  .pt.on{fill:var(--accent);r:6}
  .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;opacity:0}
  .guide.on{opacity:1}
  .tip{position:absolute;pointer-events:none;padding:6px 10px;border-radius:var(--radius);background:var(--text);color:var(--surface);font-size:12px;line-height:1.25;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:var(--shadow)}
  .tip.on{opacity:1}
  .tip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
  @media(prefers-reduced-motion:no-preference){.line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .1s ease-out forwards}.area{animation:fade .8s .5s both}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{from{opacity:0}}
  @media(prefers-reduced-motion:reduce){.pt,.tip{transition:none}}
</style>
</head>
<body>
  <section class="card" aria-labelledby="t">
    <header><h2 id="t">Pedidos mensuales, 2026</h2><span class="delta">+250% desde enero</span></header>
    <div class="plot" id="plot">
      <svg id="svg" viewBox="0 0 420 220" role="group" aria-label="Gráfico de líneas de pedidos por mes. Usa Tab para recorrer los puntos."></svg>
      <div class="tip" id="tip" role="status"></div>
    </div>
  </section>
<script>
  const data = [
    { x: 'Ene', y: 120 }, { x: 'Feb', y: 150 }, { x: 'Mar', y: 135 }, { x: 'Abr', y: 190 },
    { x: 'May', y: 220 }, { x: 'Jun', y: 205 }, { x: 'Jul', y: 260 }, { x: 'Ago', y: 310 },
    { x: 'Sep', y: 290 }, { x: 'Oct', y: 340 }, { x: 'Nov', y: 380 }, { x: 'Dic', y: 420 },
  ];
  const W = 420, H = 220, L = 34, R = 14, T = 14, B = 26, NS = 'http://www.w3.org/2000/svg';
  const step = 100, max = Math.ceil(Math.max(...data.map(d => d.y)) / step) * step;
  const X = i => L + i * (W - L - R) / (data.length - 1);
  const Y = v => T + (1 - v / max) * (H - T - B);
  const svg = document.getElementById('svg'), tip = document.getElementById('tip');
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  };
  const grid = el('g', { class: 'grid axis' });
  for (let v = 0; v <= max; v += step) {
    el('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v) }, grid);
    el('text', { x: L - 6, y: Y(v) + 3.5, 'text-anchor': 'end' }, grid).textContent = v;
  }
  const xl = el('g', { class: 'axis' });
  data.forEach((d, i) => el('text', { x: X(i), y: H - 8, 'text-anchor': 'middle' }, xl).textContent = d.x);
  const pts = data.map((d, i) => `${X(i)},${Y(d.y)}`);
  el('path', { class: 'area', d: `M${X(0)},${Y(0)} L${pts.join(' L')} L${X(data.length - 1)},${Y(0)}Z` });
  el('path', { class: 'line', d: 'M' + pts.join(' L'), pathLength: 1 });
  const guide = el('line', { class: 'guide', y1: T, y2: Y(0) });
  const dots = data.map((d, i) => {
    const c = el('circle', { class: 'pt', cx: X(i), cy: Y(d.y), r: 4, tabindex: 0, role: 'img', 'aria-label': `${d.x}: ${d.y} pedidos` });
    c.addEventListener('focus', () => show(i)); c.addEventListener('blur', hide);
    c.addEventListener('mouseenter', () => show(i));
    return c;
  });
  let cur = -1;
  function show(i) {
    if (cur >= 0) dots[cur].classList.remove('on');
    cur = i; dots[i].classList.add('on');
    guide.setAttribute('x1', X(i)); guide.setAttribute('x2', X(i)); guide.classList.add('on');
    tip.innerHTML = `${data[i].x}<b>${data[i].y} pedidos</b>`;
    tip.style.left = Math.min(Math.max(X(i) / W * 100, 14), 86) + '%';
    tip.style.top = Y(data[i].y) / H * 100 + '%';
    tip.style.transform = 'translate(-50%, calc(-100% - 12px))';
    tip.classList.add('on');
  }
  function hide() {
    if (cur >= 0) dots[cur].classList.remove('on');
    cur = -1; guide.classList.remove('on'); tip.classList.remove('on');
  }
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    show(Math.min(data.length - 1, Math.max(0, Math.round((x - L) / ((W - L - R) / (data.length - 1))))));
  });
  svg.addEventListener('pointerleave', hide);
</script>
</body>
</html>
