<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  [hidden]{display:none!important}
  .card{max-width:540px;margin:0 auto;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  header{padding:20px 24px 14px}
  h1{margin:0;font-size:18px;line-height:1.3}
  .sub{margin:2px 0 0;color:var(--muted)}
  dl{margin:0}
  .row{position:relative;display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:4px 16px;align-items:center;min-height:36px;padding:12px 24px;border-top:1px solid var(--border);transition:background .14s}
  dt{color:var(--muted)}
  dd{margin:0;min-width:0}
  .view{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .val{font-weight:600;overflow-wrap:anywhere}
  .row:has(form:not([hidden])){background:var(--accent-soft)}
  .row:has(form:not([hidden]))::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .edit{display:flex;flex-wrap:wrap;gap:8px}
  input{flex:1 1 160px;min-width:0;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px}
  input[aria-invalid=true]{border-color:var(--err)}
  input:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn{font:inherit;font-weight:600;padding:6px 12px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .14s}
  .btn:hover{background:var(--accent-soft)}
  .btn.pri{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.08)}
  .err{flex-basis:100%;margin:0;color:var(--err);font-size:13px}
  .err:empty{display:none}
  #live{margin:0;padding:10px 24px;color:var(--ok);background:var(--ok-soft);border-top:1px solid var(--border)}
  #live:empty{display:none}
  @media (max-width:480px){.row{grid-template-columns:1fr;padding:12px 16px}header{padding:16px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <header><h1 id="t">Perfil de la cuenta</h1><p class="sub">Selecciona Editar para cambiar un dato. Enter guarda y Esc cancela.</p></header>
  <dl>
    <div class="row">
      <dt id="l1">Nombre</dt>
      <dd>
        <div class="view"><span class="val">Ana Pérez</span><button type="button" class="btn" aria-label="Editar nombre">Editar</button></div>
        <form class="edit" hidden novalidate><input aria-labelledby="l1" required minlength="2" autocomplete="name" data-err="Usa al menos 2 caracteres."><button class="btn pri">Guardar</button><button type="button" class="btn">Cancelar</button><p class="err"></p></form>
      </dd>
    </div>
    <div class="row">
      <dt id="l2">Correo</dt>
      <dd>
        <div class="view"><span class="val">ana.perez@meridian.pe</span><button type="button" class="btn" aria-label="Editar correo">Editar</button></div>
        <form class="edit" hidden novalidate><input type="email" aria-labelledby="l2" required autocomplete="email" data-err="Escribe un correo válido, como ana@empresa.com."><button class="btn pri">Guardar</button><button type="button" class="btn">Cancelar</button><p class="err"></p></form>
      </dd>
    </div>
    <div class="row">
      <dt id="l3">Cargo</dt>
      <dd>
        <div class="view"><span class="val">Responsable de Producto</span><button type="button" class="btn" aria-label="Editar cargo">Editar</button></div>
        <form class="edit" hidden novalidate><input aria-labelledby="l3" required autocomplete="organization-title"><button class="btn pri">Guardar</button><button type="button" class="btn">Cancelar</button><p class="err"></p></form>
      </dd>
    </div>
    <div class="row">
      <dt id="l4">Empresa</dt>
      <dd>
        <div class="view"><span class="val">Meridian Logística</span><button type="button" class="btn" aria-label="Editar empresa">Editar</button></div>
        <form class="edit" hidden novalidate><input aria-labelledby="l4" required minlength="2" autocomplete="organization" data-err="Usa al menos 2 caracteres."><button class="btn pri">Guardar</button><button type="button" class="btn">Cancelar</button><p class="err"></p></form>
      </dd>
    </div>
  </dl>
  <p id="live" role="status"></p>
</section>
<script>
  const live = document.getElementById('live');
  document.querySelectorAll('.row').forEach((r) => {
    const view = r.querySelector('.view'), form = r.querySelector('form'), inp = form.querySelector('input'),
      val = r.querySelector('.val'), edit = view.querySelector('button'), err = form.querySelector('.err');
    const close = () => { form.hidden = true; view.hidden = false; edit.focus(); };
    edit.onclick = () => { inp.value = val.textContent; err.textContent = ''; inp.removeAttribute('aria-invalid'); view.hidden = true; form.hidden = false; inp.select(); };
    form.querySelector('[type=button]').onclick = close;
    form.onkeydown = (e) => { if (e.key === 'Escape') close(); };
    form.onsubmit = (e) => {
      e.preventDefault(); inp.value = inp.value.trim();
      const bad = !inp.checkValidity();
      err.textContent = bad ? (inp.validity.valueMissing ? 'Este campo no puede quedar vacío. Escribe un valor.' : inp.dataset.err) : '';
      inp.setAttribute('aria-invalid', bad);
      if (bad) return inp.focus();
      val.textContent = inp.value; close();
      live.textContent = 'Cambios guardados: ' + r.querySelector('dt').textContent.toLowerCase() + ' actualizado.';
    };
  });
</script>
</body>
</html>
