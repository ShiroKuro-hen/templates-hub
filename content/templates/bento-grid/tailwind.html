<main class="grid grid-cols-2 auto-rows-[minmax(96px,auto)] gap-3 text-sm text-[#17130f] sm:grid-cols-4">
  <section class="col-span-2 flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#ffd84d] p-3.5 shadow-[4px_4px_0_#17130f] sm:row-span-2">
    <h2 class="font-mono text-xs font-semibold text-[#6b6258]">Esta semana</h2>
    <p class="text-[2.6rem] font-extrabold leading-none tracking-tight tabular-nums">42 h</p>
    <p>de trabajo enfocado, 6 h más que la anterior.</p>
  </section>
  <section class="flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-3.5 shadow-[4px_4px_0_#17130f]">
    <h2 class="font-mono text-xs font-semibold text-[#6b6258]">Tareas hechas</h2>
    <p class="text-4xl font-extrabold leading-none tracking-tight">98%</p>
  </section>
  <section class="flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#ff5a36] p-3.5 shadow-[4px_4px_0_#17130f]">
    <h2 class="font-mono text-xs font-semibold">Racha</h2>
    <p class="text-4xl font-extrabold leading-none tracking-tight">12 días</p>
  </section>
  <section class="col-span-2 flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-3.5 shadow-[4px_4px_0_#17130f] sm:row-span-2">
    <h2 class="font-mono text-xs font-semibold text-[#6b6258]">Horas por día</h2>
    <div class="flex h-14 items-end gap-1.5" role="img" aria-label="Horas por día: lunes 6, martes 8, miércoles 5, jueves 9, viernes 7, sábado 4, domingo 3">
      <i class="h-[60%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[80%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[50%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[90%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[70%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[40%] flex-1 rounded-t bg-[#17130f]"></i><i class="h-[30%] flex-1 rounded-t bg-[#17130f]"></i>
    </div>
    <p>Mejor día: jueves</p>
  </section>
  <section class="flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#cfd8ff] p-3.5 shadow-[4px_4px_0_#17130f]">
    <h2 class="font-mono text-xs font-semibold text-[#6b6258]">Nota</h2>
    <p>Revisar el informe antes del viernes.</p>
  </section>
  <section class="flex flex-col justify-between gap-1.5 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-3.5 shadow-[4px_4px_0_#17130f]">
    <h2 class="font-mono text-xs font-semibold text-[#6b6258]">Estado</h2>
    <p><span class="inline-block rounded-full border-2 border-[#17130f] bg-[#c9efd8] px-2.5 py-0.5 font-mono text-xs font-semibold">En marcha</span></p>
  </section>
</main>
