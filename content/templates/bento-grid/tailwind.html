<main class="grid grid-cols-2 auto-rows-[minmax(96px,auto)] gap-3 text-sm text-slate-900 dark:text-slate-100 sm:grid-cols-4">
  <section class="relative col-span-2 flex flex-col justify-between gap-2 overflow-hidden rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900 sm:row-span-2">
    <span class="absolute inset-x-0 top-0 h-[3px] bg-gradient-to-br from-cyan-400 to-blue-600"></span>
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Esta semana</h2>
    <p class="text-5xl font-bold leading-tight tracking-tight tabular-nums">42 h</p>
    <p>de trabajo enfocado, 6 h más que la anterior.</p>
  </section>
  <section class="flex flex-col justify-between gap-2 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Tareas hechas</h2>
    <p class="text-3xl font-bold leading-tight tracking-tight tabular-nums">98%</p>
  </section>
  <section class="flex flex-col justify-between gap-2 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Racha</h2>
    <p class="text-3xl font-bold leading-tight tracking-tight tabular-nums">12 días</p>
  </section>
  <section class="col-span-2 flex flex-col justify-between gap-2 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900 sm:row-span-2">
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Horas por día</h2>
    <div class="flex h-14 items-end gap-1.5" role="img" aria-label="Horas por día: lunes 6, martes 8, miércoles 5, jueves 9, viernes 7, sábado 4, domingo 3">
      <i class="h-[60%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i><i class="h-[80%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i><i class="h-[50%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i><i class="h-[90%] flex-1 rounded-t bg-blue-600 dark:bg-blue-500"></i><i class="h-[70%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i><i class="h-[40%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i><i class="h-[30%] flex-1 rounded-t bg-slate-200 dark:bg-slate-700"></i>
    </div>
    <p>Mejor día: jueves</p>
  </section>
  <section class="flex flex-col justify-between gap-2 rounded-lg border border-slate-200 bg-blue-50 p-4 shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Nota</h2>
    <p>Revisar el informe antes del viernes.</p>
  </section>
  <section class="flex flex-col justify-between gap-2 rounded-lg border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-[13px] font-medium text-slate-500 dark:text-slate-400">Estado</h2>
    <p><span class="inline-block rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400">En marcha</span></p>
  </section>
</main>
