<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:560px;margin:0 auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  h2{margin:0;font-size:18px}
  .sub{margin:2px 0 16px;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px;padding:0;list-style:none}
  .legend button{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;transition:background .14s,border-color .14s}
  .legend button:hover{border-color:var(--accent)}
  .legend button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}
  .legend button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .legend b{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{position:relative;flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
  .dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 1.8s ease-out infinite}
  .dot.err.live::after{animation-duration:1.1s}
  @keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(2.8);opacity:0}}
  ul.list{list-style:none;margin:0;padding:0}
  .list li{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
  .list .st{color:var(--muted)}
  .list time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:7ch;text-align:right}
  .list .meta{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 12px}
  .empty{padding:16px 0;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="card" aria-labelledby="t">
  <h2 id="t">Estado de los servicios</h2>
  <p class="sub">Filtra por estado. Cada punto va acompañado de su nombre.</p>
  <ul class="legend" id="legend"></ul>
  <p id="live" class="sub" role="status" style="margin:8px 0 0"></p>
  <ul class="list" id="list"></ul>
</section>
<script>
  const STATES = { ok: ['Operativo', 'var(--ok)', 1], warn: ['Degradado', 'var(--warn)', 1], err: ['Incidente', 'var(--err)', 1], info: ['Mantenimiento', 'var(--info)', 0], idle: ['Pausado', 'var(--muted)', 0] };
  const SERVICES = [['API pública', 'ok', 'hace 1 min'], ['Panel web', 'ok', 'hace 3 min'], ['Pagos', 'warn', 'hace 12 min'], ['Correo transaccional', 'err', 'hace 4 min'], ['Base de datos', 'info', 'hace 25 min'], ['Webhooks', 'ok', 'hace 2 min'], ['Exportaciones', 'idle', 'hace 3 h']];
  const dot = (k) => `<span class="dot ${k}${STATES[k][2] ? ' live' : ''}" style="--c:${STATES[k][1]}" aria-hidden="true"></span>`;
  let filter = null;
  function draw() {
    const rows = SERVICES.filter((s) => !filter || s[1] === filter);
    document.getElementById('legend').innerHTML = Object.entries(STATES).map(([k, [name]]) =>
      `<li><button type="button" data-k="${k}" aria-pressed="${filter === k}">${dot(k)}${name} <b>${SERVICES.filter((s) => s[1] === k).length}</b></button></li>`).join('');
    document.getElementById('list').innerHTML = rows.map(([n, k, t]) =>
      `<li>${dot(k)}<span>${n}</span><span class="meta"><span class="st">${STATES[k][0]}</span><time>${t}</time></span></li>`).join('');
    document.getElementById('live').textContent = filter ? `Mostrando ${rows.length} con estado ${STATES[filter][0].toLowerCase()}.` : `Mostrando los ${rows.length} servicios.`;
  }
  document.getElementById('legend').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = filter === b.dataset.k ? null : b.dataset.k; draw();
    document.querySelector(`[data-k="${b.dataset.k}"]`).focus();
  });
  draw();
</script>
</body>
</html>
