<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{margin:0;font-size:18px;font-weight:600}
  header p{margin:2px 0 16px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:0;padding:0;list-style:none}
  .th{display:block;width:100%;padding:0;font:inherit;color:var(--text);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:border-color .14s}
  .th:hover{border-color:var(--accent)}
  .th svg{display:block;width:100%;aspect-ratio:16/10}
  .th span{display:block;padding:8px 10px;font-weight:500}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bw{fill:var(--warn-soft)}.bi{fill:var(--info-soft)}.ba{fill:var(--accent-soft)}.bo{fill:var(--ok-soft)}.be{fill:var(--err-soft)}
  .fw{fill:var(--warn)}.fi{fill:var(--info)}.fa{fill:var(--accent)}.fo{fill:var(--ok)}.fe{fill:var(--err)}
  dialog{width:min(720px,calc(100vw - 24px));padding:0;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(10,15,28,.6)}
  .stage{position:relative}
  .stage>svg{display:block;width:100%;aspect-ratio:16/10}
  .ib{position:absolute;display:grid;place-items:center;width:36px;height:36px;padding:0;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:50%;box-shadow:var(--shadow);cursor:pointer;transition:background .14s}
  .ib:hover{background:var(--accent-soft)}
  .ib svg{width:18px;height:18px;fill:currentColor}
  .x{top:8px;right:8px}.prev,.next{top:50%;margin-top:-18px}.prev{left:8px}.next{right:8px}
  .meter{height:3px;background:var(--border)}
  .meter i{display:block;height:100%;width:calc(var(--p) * 1%);background:linear-gradient(135deg,#22d3ee,#2f5bff);transition:width .14s}
  .cap{display:flex;justify-content:space-between;gap:12px;padding:12px 16px}
  .cap b{font-weight:600}
  .cap span{color:var(--muted);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s0" viewBox="0 0 160 100"><rect class="bw" width="160" height="100"/><path class="fw" d="M108 28a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/><path class="fa" d="M0 100V70L40 38l28 28 26-22 66 56z"/><path class="fi" d="M0 100 50 74l40 14 70-18v30z"/></symbol>
  <symbol id="s1" viewBox="0 0 160 100"><rect class="bi" width="160" height="100"/><path class="fw" d="M28 26a10 10 0 1 0 20 0a10 10 0 1 0-20 0"/><path class="fi" d="M0 62q20-10 40 0t40 0t40 0t40 0V100H0z"/><path class="fa" d="M0 80q20-10 40 0t40 0t40 0t40 0V100H0z"/></symbol>
  <symbol id="s2" viewBox="0 0 160 100"><rect class="ba" width="160" height="100"/><path class="fi" d="M122 20a8 8 0 1 0 16 0a8 8 0 1 0-16 0"/><path class="fa" d="M10 100V50h22v50zM38 100V28h26v72zM70 100V58h20v42zM96 100V40h24v60zM126 100V60h24v40z"/></symbol>
  <symbol id="s3" viewBox="0 0 160 100"><rect class="bo" width="160" height="100"/><path class="fw" d="M108 28a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/><path class="fo" d="M0 100V64q40-30 80 0t80 0v36z"/></symbol>
  <symbol id="s4" viewBox="0 0 160 100"><rect class="be" width="160" height="100"/><path class="fe" d="M60 70a20 20 0 0 1 40 0z"/><path class="fa" d="M0 100V74l30-10 40 14 40-16 50 12v26z"/></symbol>
</svg>
<header><h2>Paisajes del norte</h2><p>Abre una foto para verla en grande.</p></header>
<ul class="grid">
  <li><button type="button" class="th" aria-haspopup="dialog"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s0"/></svg><span>Sierra al amanecer</span></button></li>
  <li><button type="button" class="th" aria-haspopup="dialog"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s1"/></svg><span>Costa norte</span></button></li>
  <li><button type="button" class="th" aria-haspopup="dialog"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s2"/></svg><span>Ciudad nocturna</span></button></li>
  <li><button type="button" class="th" aria-haspopup="dialog"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s3"/></svg><span>Valle verde</span></button></li>
  <li><button type="button" class="th" aria-haspopup="dialog"><svg viewBox="0 0 160 100" aria-hidden="true"><use href="#s4"/></svg><span>Atardecer en la loma</span></button></li>
</ul>
<dialog id="dlg" aria-labelledby="cap">
  <div class="stage">
    <svg id="big" viewBox="0 0 160 100" role="img"><use id="use" href="#s0"/></svg>
    <button type="button" class="ib x" id="x" aria-label="Cerrar galería"><svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4l5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button>
    <button type="button" class="ib prev" id="prev" aria-label="Foto anterior"><svg viewBox="0 0 24 24"><path d="M15.4 6 14 4.6 6.6 12 14 19.4 15.4 18 9.4 12z"/></svg></button>
    <button type="button" class="ib next" id="next" aria-label="Foto siguiente"><svg viewBox="0 0 24 24"><path d="M8.6 6 10 4.6l7.4 7.4-7.4 7.4L8.6 18l6-6z"/></svg></button>
  </div>
  <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  <div class="cap"><b id="cap"></b><span id="cnt" aria-live="polite"></span></div>
</dialog>
<script>
  const $ = (id) => document.getElementById(id), dlg = $('dlg');
  const pics = [...document.querySelectorAll('.th')], T = pics.map((b) => b.textContent.trim());
  let n = 0;
  function show(k) {
    n = (k + pics.length) % pics.length;
    $('use').setAttribute('href', '#s' + n); $('big').setAttribute('aria-label', T[n]);
    $('cap').textContent = T[n]; $('cnt').textContent = `${n + 1} de ${pics.length}`;
    $('meter').style.setProperty('--p', ((n + 1) / pics.length) * 100);
  }
  pics.forEach((b, k) => (b.onclick = () => { show(k); dlg.showModal(); }));
  $('prev').onclick = () => show(n - 1); $('next').onclick = () => show(n + 1); $('x').onclick = () => dlg.close();
  dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); };
  dlg.onkeydown = (e) => { if (e.key === 'ArrowLeft') show(n - 1); else if (e.key === 'ArrowRight') show(n + 1); };
</script>
</body>
</html>
