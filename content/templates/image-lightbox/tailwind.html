    <symbol id="s3" viewBox="0 0 160 100"><rect class="fill-emerald-100 dark:fill-emerald-950" width="160" height="100"/><path class="fill-amber-500" d="M108 28a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/><path class="fill-emerald-600" d="M0 100V64q40-30 80 0t80 0v36z"/></symbol>

    <li><button type="button" aria-haspopup="dialog" class="th block w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-left shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900"><svg viewBox="0 0 160 100" aria-hidden="true" class="block aspect-[16/10] w-full"><use href="#s0"/></svg><span class="block px-2.5 py-2 font-medium">Sierra al amanecer</span></button></li>
    <li><button type="button" aria-haspopup="dialog" class="th block w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-left shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900"><svg viewBox="0 0 160 100" aria-hidden="true" class="block aspect-[16/10] w-full"><use href="#s1"/></svg><span class="block px-2.5 py-2 font-medium">Costa norte</span></button></li>
    <li><button type="button" aria-haspopup="dialog" class="th block w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-left shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900"><svg viewBox="0 0 160 100" aria-hidden="true" class="block aspect-[16/10] w-full"><use href="#s2"/></svg><span class="block px-2.5 py-2 font-medium">Ciudad nocturna</span></button></li>
    <li><button type="button" aria-haspopup="dialog" class="th block w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-left shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900"><svg viewBox="0 0 160 100" aria-hidden="true" class="block aspect-[16/10] w-full"><use href="#s3"/></svg><span class="block px-2.5 py-2 font-medium">Valle verde</span></button></li>
    <li><button type="button" aria-haspopup="dialog" class="th block w-full cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-left shadow-sm hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:border-slate-700 dark:bg-slate-900"><svg viewBox="0 0 160 100" aria-hidden="true" class="block aspect-[16/10] w-full"><use href="#s4"/></svg><span class="block px-2.5 py-2 font-medium">Atardecer en la loma</span></button></li>

  <dialog id="dlg" aria-labelledby="cap" class="w-[min(720px,calc(100vw-24px))] overflow-hidden rounded-lg border border-slate-200 bg-white p-0 text-slate-900 shadow-lg backdrop:bg-slate-950/60 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
    <div class="relative [&_button]:absolute [&_button]:grid [&_button]:size-9 [&_button]:cursor-pointer [&_button]:place-items-center [&_button]:rounded-full [&_button]:border [&_button]:border-slate-200 [&_button]:bg-white [&_button]:text-slate-900 [&_button]:shadow-sm [&_button:hover]:bg-blue-50 [&_button:focus-visible]:outline-2 [&_button:focus-visible]:outline-offset-2 [&_button:focus-visible]:outline-blue-500 dark:[&_button]:border-slate-700 dark:[&_button]:bg-slate-900 dark:[&_button]:text-slate-100">
      <svg id="big" viewBox="0 0 160 100" role="img" class="block aspect-[16/10] w-full"><use id="use" href="#s0"/></svg>
      <button type="button" id="x" aria-label="Cerrar galería" class="right-2 top-2">&#x2715;</button>
      <button type="button" id="prev" aria-label="Foto anterior" class="left-2 top-1/2 -translate-y-1/2">&#x2039;</button>
      <button type="button" id="next" aria-label="Foto siguiente" class="right-2 top-1/2 -translate-y-1/2">&#x203A;</button>
    </div>
    <div class="h-[3px] bg-slate-200 dark:bg-slate-700"><i id="meter" class="block h-full w-0 bg-gradient-to-br from-cyan-400 to-blue-600 transition-[width] duration-150"></i></div>
    <div class="flex justify-between gap-3 px-4 py-3"><b id="cap" class="font-semibold"></b><span id="cnt" aria-live="polite" class="tabular-nums text-slate-500 dark:text-slate-400"></span></div>
  </dialog>
</div>
<script>
  const $ = (id) => document.getElementById(id), dlg = $('dlg');
  const pics = [...document.querySelectorAll('.th')], T = pics.map((b) => b.textContent.trim());
  let n = 0;
  function show(k) {
    n = (k + pics.length) % pics.length;
    $('use').setAttribute('href', '#s' + n); $('big').setAttribute('aria-label', T[n]);
    $('cap').textContent = T[n]; $('cnt').textContent = `${n + 1} de ${pics.length}`;
    $('meter').style.width = ((n + 1) / pics.length) * 100 + '%';
  }
  pics.forEach((b, k) => (b.onclick = () => { show(k); dlg.showModal(); }));
  $('prev').onclick = () => show(n - 1); $('next').onclick = () => show(n + 1); $('x').onclick = () => dlg.close();
  dlg.onclick = (e) => { if (e.target === dlg) dlg.close(); };
  dlg.onkeydown = (e) => { if (e.key === 'ArrowLeft') show(n - 1); else if (e.key === 'ArrowRight') show(n + 1); };
</script>
