<section class="rounded-lg border border-slate-200 bg-white p-5 text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="t">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 id="t" class="text-lg font-semibold">Resumen de analítica</h2>
      <p class="text-slate-500 dark:text-slate-400">Tienda online de Norte Digital</p>
    </div>
    <fieldset id="range" class="inline-flex rounded-lg border border-slate-200 bg-slate-50 p-0.5 dark:border-slate-700 dark:bg-slate-950">
      <legend class="sr-only">Rango de fechas</legend>
      <label class="relative"><input class="peer absolute inset-0 cursor-pointer opacity-0" type="radio" name="r" value="7" checked><span class="block rounded-md px-3 py-1 text-slate-500 transition-colors peer-checked:bg-white peer-checked:font-semibold peer-checked:text-slate-900 peer-checked:shadow-sm peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-600 dark:peer-checked:bg-slate-800 dark:peer-checked:text-slate-100">7 días</span></label>
      <label class="relative"><input class="peer absolute inset-0 cursor-pointer opacity-0" type="radio" name="r" value="30"><span class="block rounded-md px-3 py-1 text-slate-500 transition-colors peer-checked:bg-white peer-checked:font-semibold peer-checked:text-slate-900 peer-checked:shadow-sm peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-600 dark:peer-checked:bg-slate-800 dark:peer-checked:text-slate-100">30 días</span></label>
      <label class="relative"><input class="peer absolute inset-0 cursor-pointer opacity-0" type="radio" name="r" value="90"><span class="block rounded-md px-3 py-1 text-slate-500 transition-colors peer-checked:bg-white peer-checked:font-semibold peer-checked:text-slate-900 peer-checked:shadow-sm peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-600 dark:peer-checked:bg-slate-800 dark:peer-checked:text-slate-100">90 días</span></label>
    </fieldset>
  </div>
  <dl id="kpis" aria-live="polite" class="my-5 grid grid-cols-[repeat(auto-fit,minmax(140px,1fr))] gap-px overflow-hidden rounded-lg border border-slate-200 bg-slate-200 dark:border-slate-700 dark:bg-slate-700"></dl>
  <figure>
    <figcaption class="mb-2 text-slate-500 dark:text-slate-400">Visitantes únicos por día</figcaption>
    <svg id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" class="block h-[200px] w-full overflow-visible">
      <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="600"><stop offset="0" stop-color="currentColor" class="text-cyan-400"/><stop offset="1" stop-color="currentColor" class="text-blue-600"/></linearGradient></defs>
      <g class="stroke-slate-200 dark:stroke-slate-700"><line x1="0" x2="600" y1="50" y2="50"/><line x1="0" x2="600" y1="100" y2="100"/><line x1="0" x2="600" y1="150" y2="150"/><line x1="0" x2="600" y1="200" y2="200"/></g>
      <polygon id="area" class="fill-blue-50 dark:fill-blue-500/10"/>
      <polyline id="line" class="fill-none" stroke="url(#g)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div id="x" aria-hidden="true" class="mt-1.5 flex justify-between text-xs tabular-nums text-slate-500 dark:text-slate-400"></div>
  </figure>
</section>
<script>
  const D = {
    7:  { p: [42, 55, 48, 63, 71, 58, 80], x: ['30 sep', '3 oct', '6 oct'],
          k: [['Visitantes', '18.420', '+8,2 %', 1], ['Sesiones', '26.910', '+5,1 %', 1], ['Conversión', '3,4 %', '−0,3 pp', 0], ['Ingresos', '12.480 €', '+11,6 %', 1]] },
    30: { p: [35, 41, 38, 52, 47, 60, 55, 49, 66, 72, 64, 78], x: ['7 sep', '21 sep', '6 oct'],
          k: [['Visitantes', '74.305', '+14,0 %', 1], ['Sesiones', '108.240', '+9,8 %', 1], ['Conversión', '3,6 %', '+0,2 pp', 1], ['Ingresos', '51.920 €', '+17,3 %', 1]] },
    90: { p: [62, 58, 50, 44, 47, 40, 52, 57, 61, 59, 70, 76], x: ['8 jul', '22 ago', '6 oct'],
          k: [['Visitantes', '201.780', '−2,4 %', 0], ['Sesiones', '296.400', '+1,2 %', 1], ['Conversión', '3,5 %', '+0,1 pp', 1], ['Ingresos', '139.610 €', '+4,7 %', 1]] },
  };
  const $ = (id) => document.getElementById(id);
  const UP = 'text-emerald-700 bg-emerald-50 dark:text-emerald-300 dark:bg-emerald-500/10';
  const DOWN = 'text-rose-700 bg-rose-50 dark:text-rose-300 dark:bg-rose-500/10';
  function render(r) {
    const d = D[r], n = d.p.length - 1;
    const pts = d.p.map((v, i) => `${(i * 600) / n},${200 - v * 2}`).join(' ');
    $('line').setAttribute('points', pts);
    $('area').setAttribute('points', `${pts} 600,200 0,200`);
    $('chart').setAttribute('aria-label', `Visitantes en ${r} días, de ${d.x[0]} a ${d.x[2]}. Tendencia ${d.p[n] > d.p[0] ? 'al alza' : 'a la baja'}.`);
    $('x').innerHTML = d.x.map((t) => `<span>${t}</span>`).join('');
    $('kpis').innerHTML = d.k.map(([l, v, c, up]) => `<div class="bg-white px-4 py-3 dark:bg-slate-900"><dt class="text-slate-500 dark:text-slate-400">${l}</dt>
      <dd class="mt-1 flex flex-wrap items-baseline gap-2"><b class="text-xl font-semibold tabular-nums">${v}</b><span class="rounded-full px-2 text-xs font-semibold tabular-nums ${up ? UP : DOWN}">${c}</span></dd></div>`).join('');
  }
  $('range').addEventListener('change', (e) => render(e.target.value));
  render(7);
</script>
