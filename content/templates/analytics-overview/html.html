<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  h2{margin:0;font-size:18px;font-weight:600}
  .head p{margin:2px 0 0;color:var(--muted)}
  .range{display:inline-flex;margin:0;padding:3px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
  .range label{position:relative}
  .range input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .range span{display:block;padding:5px 12px;border-radius:6px;color:var(--muted);transition:background .14s,color .14s}
  .range input:checked+span{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
  .range input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;margin:20px 0;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .kpis div{background:var(--surface);padding:12px 16px}
  dt{color:var(--muted)}
  dd{margin:4px 0 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  dd b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .delta{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
  .up{color:var(--ok);background:var(--ok-soft)}
  .down{color:var(--err);background:var(--err-soft)}
  figure{margin:0}
  figcaption{color:var(--muted);margin-bottom:8px}
  svg{display:block;width:100%;height:200px;overflow:visible}
  .grid line{stroke:var(--border)}
  .area{fill:var(--accent-soft);opacity:.7}
  .line{fill:none;stroke-width:2;stroke-linejoin:round}
  .x{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="panel" aria-labelledby="t">
  <div class="head">
    <div><h2 id="t">Resumen de analítica</h2><p>Tienda online de Norte Digital</p></div>
    <fieldset class="range">
      <legend class="sr">Rango de fechas</legend>
      <label><input type="radio" name="r" value="7" checked><span>7 días</span></label>
      <label><input type="radio" name="r" value="30"><span>30 días</span></label>
      <label><input type="radio" name="r" value="90"><span>90 días</span></label>
    </fieldset>
  </div>
  <dl class="kpis" id="kpis" aria-live="polite"></dl>
  <figure>
    <figcaption>Visitantes únicos por día</figcaption>
    <svg viewBox="0 0 600 200" preserveAspectRatio="none" role="img" id="chart">
      <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="600"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs>
      <g class="grid"><line x1="0" x2="600" y1="50" y2="50"/><line x1="0" x2="600" y1="100" y2="100"/><line x1="0" x2="600" y1="150" y2="150"/><line x1="0" x2="600" y1="200" y2="200"/></g>
      <polygon class="area" id="area"/>
      <polyline class="line" id="line" stroke="url(#g)" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="x" id="x" aria-hidden="true"></div>
  </figure>
</section>
<script>
  const D = {
    7:  { p: [42, 55, 48, 63, 71, 58, 80], x: ['30 sep', '3 oct', '6 oct'],
          k: [['Visitantes', '18.420', '+8,2 %', 1], ['Sesiones', '26.910', '+5,1 %', 1], ['Conversión', '3,4 %', '−0,3 pp', 0], ['Ingresos', '12.480 €', '+11,6 %', 1]] },
    30: { p: [35, 41, 38, 52, 47, 60, 55, 49, 66, 72, 64, 78], x: ['7 sep', '21 sep', '6 oct'],
          k: [['Visitantes', '74.305', '+14,0 %', 1], ['Sesiones', '108.240', '+9,8 %', 1], ['Conversión', '3,6 %', '+0,2 pp', 1], ['Ingresos', '51.920 €', '+17,3 %', 1]] },
    90: { p: [62, 58, 50, 44, 47, 40, 52, 57, 61, 59, 70, 76], x: ['8 jul', '22 ago', '6 oct'],
          k: [['Visitantes', '201.780', '−2,4 %', 0], ['Sesiones', '296.400', '+1,2 %', 1], ['Conversión', '3,5 %', '+0,1 pp', 1], ['Ingresos', '139.610 €', '+4,7 %', 1]] },
  };
  const $ = (id) => document.getElementById(id);
  function render(r) {
    const d = D[r], n = d.p.length - 1;
    const pts = d.p.map((v, i) => `${(i * 600) / n},${200 - v * 2}`).join(' ');
    $('line').setAttribute('points', pts);
    $('area').setAttribute('points', `${pts} 600,200 0,200`);
    $('chart').setAttribute('aria-label', `Visitantes en ${r} días, de ${d.x[0]} a ${d.x[2]}. Tendencia ${d.p[n] > d.p[0] ? 'al alza' : 'a la baja'}.`);
    $('x').innerHTML = d.x.map((t) => `<span>${t}</span>`).join('');
    $('kpis').innerHTML = d.k.map(([l, v, c, up]) =>
      `<div><dt>${l}</dt><dd><b>${v}</b><span class="delta ${up ? 'up' : 'down'}">${c}</span></dd></div>`).join('');
  }
  document.querySelector('.range').addEventListener('change', (e) => render(e.target.value));
  render(7);
</script>
</body>
</html>
