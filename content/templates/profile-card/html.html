<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta de perfil</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  * { box-sizing:border-box; }
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; max-width:720px; }
  .profile { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; padding:18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .avatar { grid-row:span 2; width:52px; height:52px; display:grid; place-items:center; border-radius:50%; font-weight:600; font-size:1.05rem; color:var(--accent); background:var(--accent-soft); }
  .avatar.b { color:var(--info); background:var(--info-soft); }
  .profile h2 { margin:0; font-size:1rem; font-weight:600; align-self:end; }
  .role { margin:0; align-self:start; font-size:.8125rem; color:var(--muted); }
  .bio { grid-column:1 / -1; margin:12px 0 14px; color:var(--muted); }
  .count { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .acts { grid-column:1 / -1; display:flex; gap:8px; }
  button { font:inherit; font-weight:600; font-size:.875rem; padding:7px 16px; border-radius:var(--radius); cursor:pointer; color:var(--text); background:var(--surface); border:1px solid var(--border); transition:background 140ms, color 140ms, border-color 140ms; }
  button:hover { border-color:var(--accent); }
  button.follow { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  button.follow[aria-pressed="true"] { color:var(--accent); background:var(--accent-soft); border-color:transparent; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { button { transition:none; } }
</style>
</head>
<body>
<div class="cards">
  <article class="profile" aria-labelledby="n1">
    <div class="avatar" aria-hidden="true">AP</div>
    <h2 id="n1">Ana Pérez</h2>
    <p class="role">Diseñadora de producto</p>
    <p class="bio">Diseña interfaces claras para equipos pequeños. <span class="count">248</span> seguidores.</p>
    <div class="acts">
      <button type="button" class="follow" aria-pressed="false">Seguir</button>
      <button type="button" aria-label="Enviar mensaje a Ana Pérez">Mensaje</button>
    </div>
  </article>
  <article class="profile" aria-labelledby="n2">
    <div class="avatar b" aria-hidden="true">LG</div>
    <h2 id="n2">Luis Gómez</h2>
    <p class="role">Desarrollador frontend</p>
    <p class="bio">Escribe CSS a mano y evita los pop-ups. <span class="count">1.032</span> seguidores.</p>
    <div class="acts">
      <button type="button" class="follow" aria-pressed="true">Siguiendo</button>
      <button type="button" aria-label="Enviar mensaje a Luis Gómez">Mensaje</button>
    </div>
  </article>
</div>
<script>
  document.querySelectorAll('.follow').forEach((b) => {
    const n = b.closest('.profile').querySelector('.count');
    let v = parseInt(n.textContent.replace(/\D/g, ''), 10);
    if (b.getAttribute('aria-pressed') === 'true') v -= 1; // base sin el seguidor actual
    const fmt = (x) => x.toLocaleString('de-DE');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      b.textContent = on ? 'Siguiendo' : 'Seguir';
      n.textContent = fmt(v + (on ? 1 : 0));
    });
  });
</script>
</body>
</html>
