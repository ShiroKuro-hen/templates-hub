<article class="grid grid-cols-[auto_1fr] items-center gap-x-3 gap-y-1 rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] p-3.5 text-sm text-[#17130f] shadow-[4px_4px_0_#17130f]" aria-labelledby="n1">
  <div class="row-span-2 grid size-14 place-items-center rounded-full border-2 border-[#17130f] bg-[#ffd84d] text-xl font-extrabold tracking-tight" aria-hidden="true">AP</div>
  <h2 id="n1" class="self-end text-[1.05rem] font-bold tracking-tight">Ana Pérez</h2>
  <p class="self-start font-mono text-xs font-semibold text-[#6b6258]">Diseñadora de producto</p>
  <p class="col-span-2 mb-1 mt-2">Diseña interfaces claras para equipos pequeños. <span id="c1">248</span> seguidores.</p>
  <div class="col-span-2 flex gap-2">
    <button type="button" id="f1" aria-pressed="false" class="rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-3.5 py-1.5 font-semibold shadow-[4px_4px_0_#17130f] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0_#17130f] aria-pressed:bg-[#17130f] aria-pressed:text-[#fffdf8] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] focus-visible:outline-offset-2 motion-safe:transition">Seguir</button>
    <button type="button" aria-label="Enviar mensaje a Ana Pérez" class="rounded-[10px] border-2 border-[#17130f] bg-[#fffdf8] px-3.5 py-1.5 font-semibold shadow-[4px_4px_0_#17130f] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0_#17130f] focus-visible:outline-[3px] focus-visible:outline-[#ff5a36] focus-visible:outline-offset-2 motion-safe:transition">Mensaje</button>
  </div>
</article>
<script>
  const f = document.getElementById('f1'), c = document.getElementById('c1');
  f.addEventListener('click', () => {
    const on = f.getAttribute('aria-pressed') !== 'true';
    f.setAttribute('aria-pressed', on);
    f.textContent = on ? 'Siguiendo' : 'Seguir';
    c.textContent = on ? 249 : 248;
  });
</script>
