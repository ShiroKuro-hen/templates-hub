<article class="grid max-w-sm grid-cols-[auto_1fr] items-center gap-x-3.5 gap-y-0.5 rounded-lg border border-slate-200 bg-white p-[18px] text-sm text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100" aria-labelledby="n1">
  <div class="row-span-2 grid size-13 place-items-center rounded-full bg-blue-50 text-base font-semibold text-blue-600 dark:bg-blue-950 dark:text-blue-300" aria-hidden="true">AP</div>
  <h2 id="n1" class="self-end text-base font-semibold">Ana Pérez</h2>
  <p class="self-start text-[13px] text-slate-500 dark:text-slate-400">Diseñadora de producto</p>
  <p class="col-span-2 mb-3.5 mt-3 text-slate-500 dark:text-slate-400">Diseña interfaces claras para equipos pequeños. <span id="c1" class="font-semibold tabular-nums text-slate-900 dark:text-slate-100">248</span> seguidores.</p>
  <div class="col-span-2 flex gap-2">
    <button type="button" id="f1" aria-pressed="false" class="rounded-lg border border-blue-600 bg-blue-600 px-4 py-1.5 font-semibold text-white transition-colors duration-150 hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-pressed:border-transparent aria-pressed:bg-blue-50 aria-pressed:text-blue-600 motion-reduce:transition-none dark:bg-blue-500 dark:aria-pressed:bg-blue-950 dark:aria-pressed:text-blue-300">Seguir</button>
    <button type="button" aria-label="Enviar mensaje a Ana Pérez" class="rounded-lg border border-slate-200 bg-white px-4 py-1.5 font-semibold transition-colors duration-150 hover:border-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 motion-reduce:transition-none dark:border-slate-700 dark:bg-slate-900">Mensaje</button>
  </div>
</article>
<script>
  const f = document.getElementById('f1'), c = document.getElementById('c1');
  f.addEventListener('click', () => {
    const on = f.getAttribute('aria-pressed') !== 'true';
    f.setAttribute('aria-pressed', on);
    f.textContent = on ? 'Siguiendo' : 'Seguir';
    c.textContent = on ? 249 : 248;
  });
</script>
