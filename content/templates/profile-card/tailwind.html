<article class="grid max-w-sm grid-cols-[auto_1fr] items-center gap-x-3.5 gap-y-0.5 rounded-lg border border-line bg-surface p-[18px] text-sm text-fg shadow-sm" aria-labelledby="n1">
  <div class="row-span-2 grid size-13 place-items-center rounded-full bg-accent-soft text-base font-semibold text-accent" aria-hidden="true">AP</div>
  <h2 id="n1" class="self-end text-base font-semibold">Ana Pérez</h2>
  <p class="self-start text-[13px] text-muted">Diseñadora de producto</p>
  <p class="col-span-2 mb-3.5 mt-3 text-muted">Diseña interfaces claras para equipos pequeños. <span id="c1" class="font-semibold tabular-nums text-fg">248</span> seguidores.</p>
  <div class="col-span-2 flex gap-2">
    <button type="button" id="f1" aria-pressed="false" class="rounded-lg border border-accent bg-accent px-4 py-1.5 font-semibold text-accent-ink transition-colors duration-150 hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent aria-pressed:border-transparent aria-pressed:bg-accent-soft aria-pressed:text-accent motion-reduce:transition-none">Seguir</button>
    <button type="button" aria-label="Enviar mensaje a Ana Pérez" class="rounded-lg border border-line bg-surface px-4 py-1.5 font-semibold transition-colors duration-150 hover:border-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent motion-reduce:transition-none">Mensaje</button>
  </div>
</article>
<script>
  const f = document.getElementById('f1'), c = document.getElementById('c1');
  f.addEventListener('click', () => {
    const on = f.getAttribute('aria-pressed') !== 'true';
    f.setAttribute('aria-pressed', on);
    f.textContent = on ? 'Siguiendo' : 'Seguir';
    c.textContent = on ? 249 : 248;
  });
</script>
