<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
  .wrap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  table{width:100%;min-width:440px;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums}
  caption,.sr{position:absolute;left:-9999px}
  th,td{padding:12px 16px;border-bottom:1px solid var(--border)}
  tbody tr:last-child>*{border-bottom:0}
  tbody th{text-align:left;font-weight:500}
  thead th{vertical-align:bottom;border-bottom:1px solid var(--border)}
  thead td{border-bottom:1px solid var(--border)}
  .plan{display:block;font-size:16px;font-weight:600}
  .price{display:block;font-size:13px;font-weight:400;color:var(--muted)}
  .tag{display:inline-block;margin-bottom:6px;padding:1px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
  .hl{background:var(--accent-soft)}
  thead .hl{background:linear-gradient(135deg,#22d3ee,#2f5bff) top/100% 2px no-repeat,var(--accent-soft)}
  .yes{color:var(--ok);font-weight:700}
  .no{color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="wrap" role="region" aria-labelledby="cap" tabindex="0">
  <table>
    <caption id="cap">Comparativa de planes</caption>
    <thead>
      <tr>
        <td></td>
        <th scope="col"><span class="plan">Free</span><span class="price">$0/mes</span></th>
        <th scope="col" class="hl"><span class="tag">Recomendado</span><span class="plan">Pro</span><span class="price">$12/mes</span></th>
        <th scope="col"><span class="plan">Team</span><span class="price">$39/mes</span></th>
      </tr>
    </thead>
    <tbody>
      <tr><th scope="row">Proyectos</th><td>3</td><td class="hl">Ilimitados</td><td>Ilimitados</td></tr>
      <tr><th scope="row">Exportar a PDF</th><td><span class="no" aria-hidden="true">✕</span><span class="sr">No incluido</span></td><td class="hl"><span class="yes" aria-hidden="true">✓</span><span class="sr">Incluido</span></td><td><span class="yes" aria-hidden="true">✓</span><span class="sr">Incluido</span></td></tr>
      <tr><th scope="row">Dominio propio</th><td><span class="no" aria-hidden="true">✕</span><span class="sr">No incluido</span></td><td class="hl"><span class="yes" aria-hidden="true">✓</span><span class="sr">Incluido</span></td><td><span class="yes" aria-hidden="true">✓</span><span class="sr">Incluido</span></td></tr>
      <tr><th scope="row">Usuarios</th><td>1</td><td class="hl">1</td><td>Hasta 10</td></tr>
      <tr><th scope="row">Soporte prioritario</th><td><span class="no" aria-hidden="true">✕</span><span class="sr">No incluido</span></td><td class="hl"><span class="no" aria-hidden="true">✕</span><span class="sr">No incluido</span></td><td><span class="yes" aria-hidden="true">✓</span><span class="sr">Incluido</span></td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
