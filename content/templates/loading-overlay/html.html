<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .panel{position:relative;max-width:520px;margin:0 auto;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
  h2{margin:0;font-size:16px}
  .btn{font:inherit;padding:8px 14px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .14s}
  .btn:hover{filter:brightness(1.08)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn[aria-disabled=true]{cursor:progress;filter:none;opacity:.6}
  dl{margin:0;padding:8px 20px}
  .line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .line dd{margin:0;font-variant-numeric:tabular-nums}
  .line dt span{display:block;color:var(--muted);font-size:13px}
  .total{border-bottom:0;font-weight:600;font-size:16px}
  .stamp{margin:0;padding:12px 20px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--surface) 76%,transparent);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}
  .panel[aria-busy=true] .overlay{opacity:1;visibility:visible}
  .spin{width:32px;height:32px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#22d3ee,#2f5bff);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:rot .9s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:3s}}
</style>
</head>
<body>
<section class="panel" id="panel" aria-labelledby="t" aria-busy="false">
  <header>
    <h2 id="t">Facturación de octubre</h2>
    <button class="btn" id="go" type="button">Actualizar datos</button>
  </header>
  <div id="data">
    <dl>
      <div class="line"><dt>Plan Business<span>12 usuarios</span></dt><dd>S/ 1,440.00</dd></div>
      <div class="line"><dt>Almacenamiento adicional<span>500 GB</span></dt><dd id="stor">S/ 180.00</dd></div>
      <div class="line"><dt>Soporte prioritario</dt><dd>S/ 320.00</dd></div>
      <div class="line total"><dt>Total del mes</dt><dd id="tot">S/ 1,940.00</dd></div>
    </dl>
    <p class="stamp" id="stamp">Actualizado hoy a las 09:00:00.</p>
  </div>
  <div class="overlay" aria-hidden="true"><span class="spin"></span><span>Actualizando datos…</span></div>
  <p class="sr" id="live" role="status"></p>
</section>
<script>
  const $ = (id) => document.getElementById(id);
  const f = (n) => 'S/ ' + n.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('go').addEventListener('click', () => {
    const go = $('go');
    if (go.getAttribute('aria-disabled') === 'true') return;
    go.setAttribute('aria-disabled', 'true'); $('panel').setAttribute('aria-busy', 'true');
    $('data').inert = true; $('live').textContent = 'Actualizando datos…';
    setTimeout(() => {
      const s = Math.round(150 + Math.random() * 100);
      $('stor').textContent = f(s); $('tot').textContent = f(1760 + s);
      $('stamp').textContent = 'Actualizado hoy a las ' + new Date().toLocaleTimeString('es-PE') + '.';
      $('panel').setAttribute('aria-busy', 'false'); $('data').inert = false;
      go.removeAttribute('aria-disabled'); $('live').textContent = 'Datos actualizados.';
    }, 1800);
  });
</script>
</body>
</html>
