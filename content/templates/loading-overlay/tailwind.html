<div class="bg-slate-50 p-5 text-sm text-slate-900 dark:bg-slate-950 dark:text-slate-100">
<section id="panel" aria-busy="false" aria-labelledby="t" class="group relative mx-auto max-w-[520px] overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
  <header class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-4 dark:border-slate-700">
    <h2 id="t" class="text-base font-semibold">Facturación de octubre</h2>
    <button id="go" type="button" class="rounded-lg border border-blue-600 bg-blue-600 px-3.5 py-2 text-white hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 aria-disabled:cursor-progress aria-disabled:opacity-60 dark:border-blue-500 dark:bg-blue-500 dark:text-slate-950">Actualizar datos</button>
  </header>
  <div id="data">
    <dl class="m-0 px-5 py-2 tabular-nums [&>div]:flex [&>div]:justify-between [&>div]:gap-3 [&>div]:border-b [&>div]:border-slate-200 [&>div]:py-2.5 dark:[&>div]:border-slate-700 [&_dd]:m-0">
      <div><dt>Plan Business<span class="block text-[13px] text-slate-500 dark:text-slate-400">12 usuarios</span></dt><dd>S/ 1,440.00</dd></div>
      <div><dt>Almacenamiento adicional<span class="block text-[13px] text-slate-500 dark:text-slate-400">500 GB</span></dt><dd id="stor">S/ 180.00</dd></div>
      <div><dt>Soporte prioritario</dt><dd>S/ 320.00</dd></div>
      <div class="!border-b-0 text-base font-semibold"><dt>Total del mes</dt><dd id="tot">S/ 1,940.00</dd></div>
    </dl>
    <p id="stamp" class="m-0 border-t border-slate-200 px-5 py-3 text-[13px] text-slate-500 dark:border-slate-700 dark:text-slate-400">Actualizado hoy a las 09:00:00.</p>
  </div>
  <div aria-hidden="true" class="invisible absolute inset-0 flex flex-col items-center justify-center gap-3 bg-white/75 opacity-0 transition-opacity duration-150 group-aria-[busy=true]:visible group-aria-[busy=true]:opacity-100 dark:bg-slate-900/75">
    <span class="size-8 animate-spin rounded-full bg-[conic-gradient(transparent,theme(colors.cyan.400),theme(colors.blue.600))] [mask:radial-gradient(farthest-side,transparent_calc(100%-4px),#000_calc(100%-3px))]"></span>
    <span>Actualizando datos…</span>
  </div>
  <p id="live" role="status" class="sr-only"></p>
</section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const f = (n) => 'S/ ' + n.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('go').addEventListener('click', () => {
    const go = $('go');
    if (go.getAttribute('aria-disabled') === 'true') return;
    go.setAttribute('aria-disabled', 'true'); $('panel').setAttribute('aria-busy', 'true');
    $('data').inert = true; $('live').textContent = 'Actualizando datos…';
    setTimeout(() => {
      const s = Math.round(150 + Math.random() * 100);
      $('stor').textContent = f(s); $('tot').textContent = f(1760 + s);
      $('stamp').textContent = 'Actualizado hoy a las ' + new Date().toLocaleTimeString('es-PE') + '.';
      $('panel').setAttribute('aria-busy', 'false'); $('data').inert = false;
      go.removeAttribute('aria-disabled'); $('live').textContent = 'Datos actualizados.';
    }, 1800);
  });
</script>
