<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:640px;margin:0 auto}
  h2{margin:0;font-size:16px;font-weight:600}
  .muted{margin:2px 0 0;color:var(--muted)}
  .cmp{--p:50%;position:relative;aspect-ratio:16/10;margin:16px 0 12px;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .img{position:absolute;inset:0;width:100%;height:100%}
  .before{filter:grayscale(1) contrast(.8) brightness(.95)}
  .after{clip-path:inset(0 0 0 var(--p))}
  .bg{fill:var(--warn-soft)}.sun{fill:var(--warn)}.far{fill:var(--accent)}.near{fill:var(--ok)}.lake{fill:var(--info)}
  .tag{position:absolute;top:10px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--surface);border:1px solid var(--border);border-radius:999px}
  .tag.a{left:10px}.tag.d{right:10px}
  .line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:linear-gradient(135deg,#22d3ee,#2f5bff);pointer-events:none}
  .knob{position:absolute;top:50%;left:var(--p);display:grid;place-items:center;width:36px;height:36px;margin:-18px 0 0 -18px;color:var(--accent);background:var(--surface);border:1px solid var(--border);border-radius:50%;box-shadow:var(--shadow);pointer-events:none}
  .knob svg{width:20px;height:20px;fill:currentColor}
  .cmp input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
  .cmp:has(input:focus-visible) .knob{outline:2px solid var(--accent);outline-offset:2px}
  .hint{margin:0;color:var(--muted);font-size:12px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h2>Retoque de color</h2>
  <p class="muted">Fotografía de montaña antes y después de la edición.</p>
  <div class="cmp" id="cmp" role="group" aria-label="Comparación antes y después">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="sc" viewBox="0 0 160 100">
        <rect class="bg" width="160" height="100"/><path class="sun" d="M99 30a13 13 0 1 0 26 0a13 13 0 1 0-26 0"/>
        <path class="far" d="M0 78 30 44l22 24 26-34 34 40 20-18 28 22V100H0z"/>
        <path class="near" d="M0 90q30-22 60-6t60-4t40 6V100H0z"/><path class="lake" d="M0 96q40-8 80 0t80 0V100H0z"/>
      </symbol>
    </svg>
    <svg class="img before" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Versión original, sin retoque"><use href="#sc"/></svg>
    <svg class="img after" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Versión retocada, con color"><use href="#sc"/></svg>
    <span class="tag a" aria-hidden="true">Antes</span><span class="tag d" aria-hidden="true">Después</span>
    <span class="line" aria-hidden="true"></span>
    <span class="knob" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7 3 12l5 5zm8 0v10l5-5z"/></svg></span>
    <input id="r" type="range" min="0" max="100" step="1" value="50" aria-label="Divisor entre antes y después">
  </div>
  <p class="hint">Arrastra el divisor o usa las flechas, Inicio y Fin.</p>
</div>
<script>
  const cmp = document.getElementById('cmp'), r = document.getElementById('r');
  r.oninput = () => {
    cmp.style.setProperty('--p', r.value + '%');
    r.setAttribute('aria-valuetext', `Antes ${r.value} %, después ${100 - r.value} %`);
  };
  r.oninput();
</script>
</body>
</html>
