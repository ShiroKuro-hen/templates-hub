<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{position:relative;max-width:640px;min-height:360px;margin:0 auto;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .tools{display:flex;flex-wrap:wrap;gap:8px}
  .ctl{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);font:inherit;cursor:pointer;transition:border-color .14s}
  .ctl:hover{border-color:var(--accent)}
  .ctl.grow{flex:1;min-width:140px;color:var(--muted)}
  .ctl.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
  .hl{outline:2px solid var(--accent);outline-offset:3px}
  .sk{height:10px;margin:14px 0 0;border-radius:999px;background:var(--accent-soft)}
  .pop{position:absolute;z-index:2;width:min(300px,calc(100% - 32px));padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pop::before{content:"";position:absolute;top:-6px;left:var(--ax,24px);width:10px;height:10px;background:var(--surface);border:solid var(--border);border-width:1px 0 0 1px;transform:rotate(45deg)}
  .pop h3{margin:0;font-size:15px;font-weight:600}
  .pop p{margin:4px 0 12px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:8px}
  .row small{color:var(--muted);font-variant-numeric:tabular-nums}
  .dots{display:flex;gap:4px;margin-left:auto}
  .dots i{width:6px;height:6px;border-radius:999px;background:var(--border)}
  .dots i.on{width:16px;background:linear-gradient(135deg,#22d3ee,#2f5bff)}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns .ctl{height:32px}
  .btns .ctl:disabled{opacity:.5;cursor:default}
  .link{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;border-radius:4px}
  .link:hover{color:var(--text)}
  .pop .hint{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
  kbd{padding:0 5px;border:1px solid var(--border);border-radius:4px;background:var(--bg);font:12px ui-monospace,"Cascadia Code",Menlo,monospace}
  #again{position:absolute;right:16px;bottom:16px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="tools">
    <button type="button" class="ctl grow" id="t1">Buscar pedidos, clientes…</button>
    <button type="button" class="ctl main" id="t2">Nuevo panel</button>
    <button type="button" class="ctl" id="t3" aria-label="Notificaciones, 3 nuevas">Avisos (3)</button>
  </div>
  <div class="sk" style="width:60%"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:40%"></div>
  <button type="button" class="ctl" id="again" hidden>Repetir recorrido</button>
  <div class="pop" id="pop" role="dialog" aria-labelledby="tt" aria-describedby="tb" hidden>
    <h3 id="tt"></h3><p id="tb"></p>
    <div class="row"><small id="n"></small><span class="dots" id="dots" aria-hidden="true"></span></div>
    <div class="btns">
      <button type="button" class="ctl" id="prev">Anterior</button>
      <button type="button" class="ctl main" id="next">Siguiente</button>
      <button type="button" class="link" id="skip">Omitir</button>
    </div>
    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> para navegar, <kbd>Esc</kbd> para cerrar</p>
  </div>
</div>
<script>
  const S = [
    ['t1', 'Busca en todo el panel', 'Encuentra pedidos, clientes y facturas con unas pocas letras.'],
    ['t2', 'Crea un panel nuevo', 'Empieza en blanco o parte de una plantilla de ventas.'],
    ['t3', 'Revisa tus avisos', 'Aquí llegan las alertas cuando una métrica cambia.'],
  ];
  const $ = (id) => document.getElementById(id), pop = $('pop'), st = $('stage');
  let i = 0;
  const clear = () => document.querySelector('.hl')?.classList.remove('hl');
  function show(n, focus) {
    i = n; clear();
    const el = $(S[i][0]); el.classList.add('hl');
    $('tt').textContent = S[i][1]; $('tb').textContent = S[i][2];
    $('n').textContent = `Paso ${i + 1} de ${S.length}`;
    $('prev').disabled = !i;
    $('next').textContent = i === S.length - 1 ? 'Terminar' : 'Siguiente';
    $('dots').innerHTML = S.map((_, k) => `<i${k === i ? ' class="on"' : ''}></i>`).join('');
    pop.hidden = false;
    const s = st.getBoundingClientRect(), r = el.getBoundingClientRect();
    const x = Math.max(16, Math.min(r.left - s.left, s.width - pop.offsetWidth - 16));
    const ax = Math.min(Math.max(r.left - s.left + r.width / 2 - x - 5, 12), pop.offsetWidth - 24);
    pop.style.cssText = `left:${x}px;top:${r.bottom - s.top + 14}px;--ax:${ax}px`;
    if (focus) $('next').focus({ preventScroll: true });
  }
  function end() { pop.hidden = true; clear(); $('again').hidden = false; $('again').focus(); }
  $('next').onclick = () => (i < S.length - 1 ? show(i + 1, 1) : end());
  $('prev').onclick = () => show(i - 1, 1);
  $('skip').onclick = end;
  $('again').onclick = () => { $('again').hidden = true; show(0, 1); };
  document.addEventListener('keydown', (e) => {
    if (pop.hidden) return;
    if (e.key === 'Escape') end();
    else if (e.key === 'ArrowRight' && i < S.length - 1) show(i + 1, 1);
    else if (e.key === 'ArrowLeft' && i > 0) show(i - 1, 1);
  });
  addEventListener('resize', () => !pop.hidden && show(i));
  show(0);
</script>
</body>
</html>
