<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjetas con foco de luz</title>
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:820px;margin:0 auto}
  .spot{position:relative;isolation:isolate;display:block;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:inherit;text-decoration:none;transition:box-shadow .2s}
  .spot>*{position:relative}
  .spot::before,.spot::after{content:"";position:absolute;z-index:-1;pointer-events:none;opacity:0;transition:opacity .2s}
  .spot::before{inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
  .spot::after{inset:-1px;padding:1px;border-radius:inherit;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),var(--accent),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  @media (hover:hover){.spot:hover{box-shadow:var(--shadow)}.spot:hover::before,.spot:hover::after{opacity:1}}
  .spot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .spot:focus-visible::before,.spot:focus-visible::after{opacity:1}
  .ico{display:grid;place-items:center;width:36px;height:36px;margin-bottom:12px;border-radius:min(var(--radius),6px);background:var(--accent-soft);color:var(--accent)}
  .spot h3{margin:0 0 4px;font-size:15px}
  .spot p{margin:0;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="grid">
  <a class="spot" href="#">
    <span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3>Seguridad</h3>
    <p>Cifrado de extremo a extremo y permisos por rol para cada equipo.</p>
  </a>
  <a class="spot" href="#">
    <span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3>Analítica</h3>
    <p>Paneles en tiempo real con alertas cuando una métrica se desvía.</p>
  </a>
  <a class="spot" href="#">
    <span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3>Equipos</h3>
    <p>Espacios compartidos con comentarios y menciones en cada documento.</p>
  </a>
</main>
<script>
  document.querySelectorAll('.spot').forEach((el) => el.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', `${e.clientX - r.left}px`);
    el.style.setProperty('--my', `${e.clientY - r.top}px`);
  }));
</script>
</body>
</html>
