<style>
  .spot{position:relative;isolation:isolate;transition:box-shadow .2s}
  .spot>*{position:relative}
  .spot::before,.spot::after{content:"";position:absolute;z-index:-1;pointer-events:none;opacity:0;transition:opacity .2s}
  .spot::before{inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
  .spot::after{inset:-1px;padding:1px;border-radius:inherit;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),var(--accent),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  @media (hover:hover){.spot:hover::before,.spot:hover::after{opacity:1}}
  .spot:focus-visible::before,.spot:focus-visible::after{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main class="mx-auto grid max-w-[820px] grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-4 bg-page p-5 text-sm text-fg">
  <a href="#" class="spot block rounded-lg border border-line bg-surface p-[18px] text-inherit no-underline hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <span class="mb-3 grid h-9 w-9 place-items-center rounded-md bg-accent-soft text-accent" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3 class="mb-1 text-[15px] font-semibold">Seguridad</h3>
    <p class="text-muted">Cifrado de extremo a extremo y permisos por rol para cada equipo.</p>
  </a>
  <a href="#" class="spot block rounded-lg border border-line bg-surface p-[18px] text-inherit no-underline hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <span class="mb-3 grid h-9 w-9 place-items-center rounded-md bg-accent-soft text-accent" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3 class="mb-1 text-[15px] font-semibold">Analítica</h3>
    <p class="text-muted">Paneles en tiempo real con alertas cuando una métrica se desvía.</p>
  </a>
  <a href="#" class="spot block rounded-lg border border-line bg-surface p-[18px] text-inherit no-underline hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">
    <span class="mb-3 grid h-9 w-9 place-items-center rounded-md bg-accent-soft text-accent" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></span>
    <h3 class="mb-1 text-[15px] font-semibold">Equipos</h3>
    <p class="text-muted">Espacios compartidos con comentarios y menciones en cada documento.</p>
  </a>
</main>
<script>
  document.querySelectorAll('.spot').forEach((el) => el.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', `${e.clientX - r.left}px`);
    el.style.setProperty('--my', `${e.clientY - r.top}px`);
  }));
</script>
