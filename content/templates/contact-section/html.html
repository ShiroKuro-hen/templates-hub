<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px 40px;max-width:1040px}
  .contact h2{margin:0;font-size:22px;line-height:1.25}
  .lead{margin:4px 0 20px;color:var(--muted);max-width:48ch}
  .info{display:grid;gap:14px;margin:0}
  .info dt{color:var(--muted);font-size:13px}
  .info dd{margin:0;font-weight:500}
  .info a{color:var(--accent)}
  form{position:relative;display:grid;gap:14px;padding:24px;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  form::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,#22d3ee,#2f5bff)}
  label{display:block;margin-bottom:6px;font-weight:500}
  input,select,textarea{box-sizing:border-box;width:100%;padding:9px 12px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
  textarea{min-height:110px;resize:vertical}
  [aria-invalid=true]{border-color:var(--err)}
  .err{margin:6px 0 0;color:var(--err);font-size:13px}
  .err:empty{display:none}
  button{justify-self:start;padding:9px 16px;font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);cursor:pointer;transition:filter .14s}
  button:hover{filter:brightness(1.08)}
  :is(input,select,textarea,button,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .status{margin:0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="contact" aria-labelledby="ct-title">
  <div>
    <h2 id="ct-title">Hablemos de tu proyecto</h2>
    <p class="lead">Cuéntanos qué necesitas y te ponemos en contacto con la persona adecuada.</p>
    <dl class="info">
      <div><dt>Correo</dt><dd><a href="mailto:contacto@ejemplo.com">contacto@ejemplo.com</a></dd></div>
      <div><dt>Teléfono</dt><dd><a href="tel:+34910000000">+34 910 000 000</a></dd></div>
      <div><dt>Oficina</dt><dd>Calle de Alcalá 21, 28014 Madrid</dd></div>
      <div><dt>Horario</dt><dd>Lunes a viernes, de 9:00 a 18:00 (CET)</dd></div>
    </dl>
  </div>
  <form id="cf" novalidate>
    <div><label for="cf-name">Nombre</label>
      <input id="cf-name" name="name" autocomplete="name" required aria-describedby="cf-name-err" data-msg="Escribe tu nombre para saber a quién responder.">
      <p class="err" id="cf-name-err"></p></div>
    <div><label for="cf-email">Correo</label>
      <input id="cf-email" name="email" type="email" autocomplete="email" required aria-describedby="cf-email-err" data-msg="Escribe un correo válido, por ejemplo ana@empresa.com.">
      <p class="err" id="cf-email-err"></p></div>
    <div><label for="cf-topic">Tema</label>
      <select id="cf-topic" name="topic" required aria-describedby="cf-topic-err" data-msg="Elige un tema para dirigir tu mensaje al equipo correcto.">
        <option value="">Elige un tema</option><option>Ventas</option><option>Soporte técnico</option><option>Prensa</option><option>Otro</option>
      </select>
      <p class="err" id="cf-topic-err"></p></div>
    <div><label for="cf-msg">Mensaje</label>
      <textarea id="cf-msg" name="message" required minlength="20" aria-describedby="cf-msg-err" data-msg="Cuéntanos un poco más: el mensaje necesita al menos 20 caracteres."></textarea>
      <p class="err" id="cf-msg-err"></p></div>
    <button type="submit">Enviar mensaje</button>
    <p class="status" role="status" id="cf-status"></p>
  </form>
</section>
<script>
  const form = document.getElementById('cf'), out = document.getElementById('cf-status');
  const check = (f) => {
    const bad = !f.checkValidity();
    f.setAttribute('aria-invalid', bad);
    document.getElementById(f.id + '-err').textContent = bad ? f.dataset.msg : '';
    return bad;
  };
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const bad = [...form.querySelectorAll('[data-msg]')].filter(check);
    if (bad.length) { out.textContent = ''; return bad[0].focus(); }
    out.textContent = `Mensaje enviado. Te respondemos en un día hábil en ${form.email.value}.`;
    form.reset();
  });
  form.addEventListener('input', (e) => { if (e.target.getAttribute('aria-invalid') === 'true') check(e.target); });
</script>
</body>
</html>
