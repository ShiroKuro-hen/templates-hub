<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f5f7fa;--surface:#fff;--text:#0e1726;--muted:#5b6b82;--border:#d8dfea;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8eeff;--ok:#0e9f6e;--warn:#b7791f;--err:#d92d4a;--info:#0891b2;--ok-soft:#e3f6ee;--warn-soft:#fbf1dc;--err-soft:#fde8ec;--info-soft:#dff3f8;--radius:8px;--shadow:0 1px 2px rgba(14,23,38,.06),0 6px 20px rgba(14,23,38,.06)}
  :root[data-theme=dark]{--bg:#0a0f1c;--surface:#111a2e;--text:#e6ecf8;--muted:#8ea0bc;--border:#223052;--accent:#6c8cff;--accent-ink:#0a0f1c;--accent-soft:#16213f;--ok:#34d399;--warn:#f5b84b;--err:#ff6b81;--info:#38bdf8;--ok-soft:#0f2a24;--warn-soft:#2a2210;--err-soft:#2d1218;--info-soft:#0c2430;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
  body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .player{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .player.full{position:fixed;inset:0;max-width:none;z-index:10;border-radius:0;display:flex;flex-direction:column}
  .screen{position:relative;aspect-ratio:16/9;background:var(--info-soft);cursor:pointer}
  .full .screen{flex:1;aspect-ratio:auto}
  .screen svg{position:absolute;inset:0;width:100%;height:100%}
  .sky{fill:var(--info-soft)}.sun{fill:var(--warn)}.m1{fill:var(--accent)}.m2{fill:var(--info)}
  .big{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:opacity .14s}
  .playing .big{opacity:0;pointer-events:none}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;border-top:1px solid var(--border)}
  button,select{font:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:var(--radius);height:32px;min-width:32px;display:inline-grid;place-items:center;cursor:pointer;transition:background .14s}
  select{border-color:var(--border);background:var(--surface);padding:0 6px}
  button:hover{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  svg.i{width:18px;height:18px;fill:currentColor}
  .time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .seek{-webkit-appearance:none;appearance:none;flex:1 1 140px;height:4px;margin:0;border-radius:999px;cursor:pointer;
        background:linear-gradient(135deg,#22d3ee,#2f5bff) 0/var(--p,0%) 100% no-repeat,var(--border)}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--surface);border:1px solid var(--accent);box-shadow:var(--shadow)}
  .seek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface);border:1px solid var(--accent)}
  .vol{width:72px;accent-color:var(--accent)}
  .info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px 12px;border-top:1px solid var(--border)}
  .info h2{margin:0;font-size:15px;font-weight:600}
  .hint{margin:0;color:var(--muted);font-size:12px}
  kbd{font:12px ui-monospace,"Cascadia Code",Menlo,monospace;padding:0 4px;border:1px solid var(--border);border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="player" id="player" tabindex="0" aria-label="Reproductor de vídeo: Recorrido por el panel de Ion Cloud">
  <div class="screen" id="screen">
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect class="sky" width="160" height="90"/><circle class="sun" id="sun" cx="130" cy="24" r="10"/>
      <path class="m1" d="M0 90 50 38l26 26 30-34 54 60z"/><path class="m2" d="M0 90 34 62l28 16 40-26 58 34z"/>
    </svg>
    <button type="button" class="big" id="big" tabindex="-1" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </div>
  <div class="bar">
    <button type="button" id="play" aria-label="Reproducir"><svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <span class="time"><span id="cur">0:00</span> / 3:24</span>
    <input class="seek" id="seek" type="range" min="0" max="204" step="1" value="0" aria-label="Progreso" aria-valuetext="0:00 de 3:24">
    <button type="button" id="mute" aria-label="Silenciar" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 16 12z"/></svg></button>
    <input class="vol" id="vol" type="range" min="0" max="100" value="80" aria-label="Volumen">
    <select id="rate" aria-label="Velocidad"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select>
    <button type="button" id="full" aria-label="Pantalla completa" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
  </div>
  <div class="info">
    <h2>Recorrido por el panel de Ion Cloud</h2>
    <p class="hint"><kbd>K</kbd> reproducir, <kbd>←</kbd><kbd>→</kbd> 5 s, <kbd>M</kbd> silenciar, <kbd>F</kbd> pantalla completa</p>
  </div>
</section>
<script>
  const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
  const VOL = 'M4 9v6h4l5 4V5L8 9zm12 3a4 4 0 0 0-2-3.5v7A4 4 0 0 0 16 12z', OFF = 'M4 9v6h4l5 4V5L8 9zm11.6 0L14 10.6l1.4 1.4-1.4 1.4 1.6 1.6 1.4-1.4 1.4 1.4 1.6-1.6-1.4-1.4 1.4-1.4L18.4 9 17 10.4z';
  const p = document.getElementById('player'), $ = (id) => document.getElementById(id);
  const play = $('play'), seek = $('seek'), vol = $('vol'), mute = $('mute'), rate = $('rate'), full = $('full');
  const DUR = 204; let t = 0, playing = false, last = 0, muted = false;
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  function render() {
    seek.value = t; seek.style.setProperty('--p', (t / DUR) * 100 + '%');
    $('cur').textContent = fmt(t); seek.setAttribute('aria-valuetext', fmt(t) + ' de ' + fmt(DUR));
    $('sun').style.transform = `translateX(${(-t / DUR) * 110}px)`;
  }
  function tick(now) {
    if (!playing) return;
    t = Math.min(DUR, t + ((now - last) / 1000) * rate.value); last = now; render();
    t >= DUR ? toggle(false) : requestAnimationFrame(tick);
  }
  function toggle(on = !playing) {
    if (on && t >= DUR) t = 0;
    playing = on; p.classList.toggle('playing', on);
    play.setAttribute('aria-label', on ? 'Pausar' : 'Reproducir');
    play.querySelector('path').setAttribute('d', on ? PAUSE : PLAY);
    if (on) { last = performance.now(); requestAnimationFrame(tick); }
  }
  function setMuted(m) {
    muted = m; mute.setAttribute('aria-pressed', m); mute.setAttribute('aria-label', m ? 'Activar sonido' : 'Silenciar');
    mute.querySelector('path').setAttribute('d', m ? OFF : VOL);
  }
  function setFull(on) { p.classList.toggle('full', on); full.setAttribute('aria-pressed', on); }
  const skip = (s) => { t = Math.max(0, Math.min(DUR, t + s)); render(); };

  play.onclick = () => toggle(); $('screen').onclick = () => toggle();
  seek.oninput = () => { t = +seek.value; render(); };
  vol.oninput = () => { setMuted(vol.value == 0); vol.setAttribute('aria-valuetext', vol.value + ' %'); };
  mute.onclick = () => { setMuted(!muted); if (!muted && vol.value == 0) vol.value = 50; };
  full.onclick = () => setFull(!p.classList.contains('full'));
  p.addEventListener('keydown', (e) => {
    const native = e.target.matches('input, select');
    if (e.key === 'Escape') setFull(false);
    else if (e.key === 'k' || (e.key === ' ' && e.target === p)) toggle();
    else if (!native && e.key === 'ArrowLeft') skip(-5);
    else if (!native && e.key === 'ArrowRight') skip(5);
    else if (e.key === 'm') mute.click();
    else if (e.key === 'f') full.click();
    else return;
    e.preventDefault();
  });
</script>
</body>
</html>
